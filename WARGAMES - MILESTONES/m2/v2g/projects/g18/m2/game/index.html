<!DOCTYPE html>
<html lang="en">

<style>
  :root {
    --bg: #0f1418;
    --fg: #e8eef2;
    --acc: #f2b84b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: #070a0d;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--fg);
  }
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: var(--bg);
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.88);
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script>
(() => {
  'use strict';

  const W = 1280, H = 720;
  const MAP_W = 912; // Isometric town map [0..912], stark WarGames telemetry panel [912..1280]
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });

  const params = new URLSearchParams(location.search);
  const AUTOSTART = params.has('autostart');
  const SEED_INIT = Number(params.get('seed') ?? 7) || 7;

  function mulberry32(a) {
    let s = a >>> 0;
    return function() {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let rng = mulberry32(SEED_INIT);

  // 63 neighborhood house window panes (exact pane bounds in 1280x720)
  const HOUSE_WINDOWS = [
    [269,224,6,8],[279,228,5,5],[144,231,5,6],[287,233,5,7],[109,235,5,7],
    [110,248,5,7],[86,253,5,7],[331,255,5,7],[344,256,5,7],[209,272,5,7],
    [284,281,5,7],[417,287,5,7],[378,288,5,7],[390,294,6,7],[378,301,6,7],
    [154,303,5,7],[237,305,5,7],[139,310,5,7],[438,322,5,7],[198,327,5,7],
    [158,329,6,8],[187,333,5,7],[170,335,6,8],[459,338,6,7],[484,342,5,7],
    [308,345,5,8],[321,351,5,7],[271,352,5,8],[231,355,6,8],[335,358,5,8],
    [257,359,5,8],[520,362,5,8],[271,365,5,8],[232,367,5,8],[257,372,5,8],
    [142,377,5,8],[382,380,5,8],[127,384,5,8],[142,390,5,7],[296,396,6,8],
    [127,397,5,7],[312,403,5,8],[361,414,5,6],[73,417,5,7],[181,421,5,8],
    [191,430,5,8],[378,433,6,7],[390,434,5,7],[221,435,6,7],[237,442,5,8],
    [156,456,5,7],[170,460,5,5],[291,476,5,7],[304,476,5,8],[187,477,5,8],
    [21,486,6,8],[32,496,5,8],[264,495,5,8],[255,503,5,9],[246,504,5,8],
    [65,508,5,7],[91,513,5,8],[161,555,5,8]
  ].map((w, idx) => ({
    x: w[0], y: w[1], w: w[2], h: w[3],
    threshold: 0.66 + ((idx * 37) % 32) / 100, // Only flicker/dim under genuine high grid strain (0.66..0.98)
    phase: idx * 1.73

  // 4 Isometric Server-Hall / Heatsink Pads matching f_001 -> f_021 -> f_033
  const PAD_DEFS = [
    { id: 0, cx: 554, cy: 448, rw: 122, rh: 64, spriteKey: 'heatsinkChip', shortTag: '+HALL A' },
    { id: 1, cx: 414, cy: 522, rw: 120, rh: 63, spriteKey: 'chipA',        shortTag: '+HALL B' },
    { id: 2, cx: 695, cy: 514, rw: 120, rh: 63, spriteKey: 'chipB',        shortTag: '+HALL C' },
    { id: 3, cx: 552, cy: 590, rw: 122, rh: 64, spriteKey: 'chipC',        shortTag: '+HALL D' }
  ];

  // Overhead Transmission Corridors with natural catenary sag between lattice pylons (matching f_021 & f_033!)
  const MAIN_LINES = [
    [
      [138, 6], [176, 30], [216, 48],
      [284, 92], [356, 122],
      [428, 168], [506, 198],
      [576, 242], [652, 272],
      [748, 326], [848, 372], [911, 402]
    ],
    [
      [114, 18], [158, 46], [204, 66],
      [274, 110], [344, 140],
      [418, 186], [494, 216],
      [566, 258], [642, 288],
      [738, 340], [834, 386], [910, 420]
    ]
  ];

  const PAD_FEEDERS = [
    { reqSlots: [0],    pts: [[652, 274], [666, 336], [620, 396], [568, 438]] },
    { reqSlots: [0],    pts: [[664, 288], [682, 348], [636, 406], [584, 446]] },
    { reqSlots: [2],    pts: [[834, 384], [786, 436], [734, 486], [706, 508]] },
    { reqSlots: [2],    pts: [[852, 394], [802, 448], [750, 494], [720, 514]] },
    { reqSlots: [0, 1], pts: [[518, 468], [468, 494], [434, 512]] },
    { reqSlots: [1, 3], pts: [[442, 538], [496, 564], [528, 580]] },
    { reqSlots: [2, 3], pts: [[664, 532], [610, 560], [578, 578]] },
    { reqSlots: [0, 3], pts: [[554, 474], [553, 530], [552, 566]] }
  ];

  // 3 Compact Diegetic Breaker Switches beside the Substation Step-Down Transformers
  const BREAKER_DEFS = [
    { key: 'sell', idx: 1, label: '[1] SELL',   color: '#f2b84b', x: 772, y: 552, w: 124, h: 26 },
    { key: 'save', idx: 2, label: '[2] BUFFER', color: '#38d8ff', x: 772, y: 584, w: 124, h: 26 },
    { key: 'cap',  idx: 3, label: '[3] CAP',    color: '#63b868', x: 772, y: 616, w: 124, h: 26 }
  ];

  const assets = {
    mapRaw: new Image(),
    spritesRaw: new Image(),
    loadedCount: 0,
    ready: false,
    cleanMap: null,
    cutouts: {}
  };

  function extractNocturnalSprite(img, sx, sy, sw, sh, mode = 'pad') {
    const c = document.createElement('canvas');
    c.width = sw; c.height = sh;
    const g = c.getContext('2d');
    g.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
    const id = g.getImageData(0, 0, sw, sh);
    const d = id.data;

    for (let i = 0; i < d.length; i += 4) {
      let a = d[i + 3];
      if (a < 28) {
        d[i + 3] = 0;
        continue;
      }
      if (a < 150) {
        a = Math.max(0, Math.min(255, ((a - 28) / 122) * 235));
        d[i + 3] = a;
      }
      const r = d[i], gr = d[i + 1], b = d[i + 2];
      const lum = r * 0.299 + gr * 0.587 + b * 0.114;

      if (mode === 'pad') {
        const isWarmTrace = (r > b + 22 && lum > 55);
        if (isWarmTrace) {
          d[i]     = Math.min(255, lum * 0.32 + 16);
          d[i + 1] = Math.min(255, lum * 0.46 + 24);
          d[i + 2] = Math.min(255, lum * 0.58 + 32);
        } else if (lum > 108) {
          // Cool nocturnal gunmetal slate matching f_021.jpg silicon dies
          const n = 42 + (lum - 108) * 0.54;
          d[i]     = Math.min(156, n * 0.82);
          d[i + 1] = Math.min(176, n * 0.98);
          d[i + 2] = Math.min(198, n * 1.14);
        } else {
          d[i]     = Math.max(13, r * 0.60 + 5);
          d[i + 1] = Math.max(18, gr * 0.68 + 7);
          d[i + 2] = Math.max(24, b * 0.78 + 10);
        }
      } else {
        d[i]     = Math.max(15, r * 0.46 + 6);
        d[i + 1] = Math.max(20, gr * 0.52 + 8);
        d[i + 2] = Math.max(26, b * 0.60 + 11);
      }
    }
    g.putImageData(id, 0, 0);
    return c;
  }

  function pointInDiamond(px, py, cx, cy, rw, rh) {
    return Math.abs(px - cx) / rw + Math.abs(py - cy) / rh <= 1.0;
  }

  // Paint crisp matte slate-concrete hyperbolic cooling tower matching f_001.jpg 1:1
  function drawHyperbolicTower(g, cx, topY, botY, topRx, waistRx, botRx) {
    g.save();
    const h = botY - topY;
    const waistY = topY + h * 0.34;

    // Subtle ground contact shadow
    g.beginPath();
    g.ellipse(cx + 4, botY + 2, botRx * 1.06, botRx * 0.34, 0, 0, Math.PI * 2);
    g.fillStyle = 'rgba(7, 11, 15, 0.72)';
    g.fill();

    // Hyperbolic shell silhouette
    g.beginPath();
    g.moveTo(cx - topRx, topY);
    g.quadraticCurveTo(cx - waistRx, waistY, cx - botRx, botY);
    g.ellipse(cx, botY, botRx, botRx * 0.28, 0, Math.PI, 0, true);
    g.quadraticCurveTo(cx + waistRx, waistY, cx + topRx, topY);
    g.closePath();

    const grad = g.createLinearGradient(cx - botRx, topY, cx + botRx, topY);
    grad.addColorStop(0.00, '#3a4652');
    grad.addColorStop(0.28, '#536270'); // Cool moonlit left concrete flank matching f_001.jpg
    grad.addColorStop(0.68, '#2d3742');
    grad.addColorStop(1.00, '#1b232b');
    g.fillStyle = grad;
    g.fill();

    // Dark recessed elliptical throat rim
    g.beginPath();
    g.ellipse(cx, topY, topRx, topRx * 0.27, 0, 0, Math.PI * 2);
    g.fillStyle = '#0d1319';
    g.fill();
    g.lineWidth = 1.6;
    g.strokeStyle = '#5a6a78';
    g.stroke();
    g.restore();
  }

  function buildCleanMapLayer() {
    const srcW = assets.mapRaw.naturalWidth || 1376;
    const srcH = assets.mapRaw.naturalHeight || 768;

    const work = document.createElement('canvas');
    work.width = srcW; work.height = srcH;
    const wg = work.getContext('2d');
    wg.drawImage(assets.mapRaw, 0, 0);

    const rawData = wg.getImageData(0, 0, srcW, srcH);
    const rd = rawData.data;
    const seams = [[336, 347], [681, 694]];
    for (const [xL, xR] of seams) {
      if (xR >= srcW) continue;
      for (let y = 0; y < srcH; y++) {
        const iL = (y * srcW + xL) * 4;
        const iR = (y * srcW + xR) * 4;
        for (let x = xL + 1; x < xR; x++) {
          const t = (x - xL) / (xR - xL);
          const idx = (y * srcW + x) * 4;
          rd[idx]     = rd[iL]     * (1 - t) + rd[iR]     * t;
          rd[idx + 1] = rd[iL + 1] * (1 - t) + rd[iR + 1] * t;
          rd[idx + 2] = rd[iL + 2] * (1 - t) + rd[iR + 2] * t;
        }
      }
    }
    wg.putImageData(rawData, 0, 0);

    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const cg = c.getContext('2d');
    cg.drawImage(work, 0, 0, srcW, srcH, 0, 0, W, H);

    cg.fillStyle = '#0d1114';
    cg.fillRect(MAP_W, 0, W - MAP_W, H);

    const imgData = cg.getImageData(0, 0, MAP_W, H);
    const p = imgData.data;

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < MAP_W; x++) {
        const i = (y * MAP_W + x) * 4;
        const r = p[i], g = p[i + 1], b = p[i + 2];

        // A. Clean sky/hill region behind cooling towers (x=758..912, y=0..385) before redrawing crisp towers
        if (x >= 758 && y < 382) {
          const n = ((x * 17 + y * 31) % 5) - 2;
          p[i]     = 19 + n * 0.35;
          p[i + 1] = 28 + n * 0.35;
          p[i + 2] = 37 + n * 0.45;
          continue;
        }

        // B. Smoothly neutralize baked golden cable glow & Strip-3 amber haze (zero hard threshold rings!)
        // Keep left town neighborhood houses (x < 490, y > 215) 100% untouched!
        const inTownHouses = (x < 495 && y > 212);
        if (!inTownHouses && x > 130) {
          const warmExcess = r - b * 0.82;
          if (warmExcess > 6) {
            // Smoothly pull warm amber/brown haze down into nocturnal slate (#131c25)
            const k = Math.min(1, (warmExcess - 6) / 38);
            const targetB = Math.min(40, b * 0.72 + 12);
            p[i]     = r * (1 - k) + (targetB * 0.54) * k;
            p[i + 1] = g * (1 - k) + (targetB * 0.78) * k;
            p[i + 2] = b * (1 - k) + targetB * k;
          } else if (b > 115 && g > 88 && b > r * 1.28 && y > 340) {
            p[i]     = 18;
            p[i + 1] = 26;
            p[i + 2] = 35;
          }
        }

        // C. Cleanly grade the 4-pad foreground site diamond (center 554, 519) so dirt lots have zero edge bleed
        const dDist = Math.abs(x - 554) / 292 + Math.abs(y - 519) / 160;
        if (dDist < 1.0) {
          const blend = Math.min(1, (1.0 - dDist) * 8.0);
          const n = ((x * 13 + y * 29) % 5) - 2;
          const tr = 17 + n * 0.3;
          const tg = 24 + n * 0.3;
          const tb = 32 + n * 0.4;
          p[i]     = p[i]     * (1 - blend) + tr * blend;
          p[i + 1] = p[i + 1] * (1 - blend) + tg * blend;
          p[i + 2] = p[i + 2] * (1 - blend) + tb * blend;
        }
      }
    }
    cg.putImageData(imgData, 0, 0);

    // Paint the two smooth architectural hyperbolic cooling towers (clipped cleanly at x=912) matching f_001.jpg!
    cg.save();
    cg.beginPath();
    cg.rect(0, 0, MAP_W, H);
    cg.clip();
    drawHyperbolicTower(cg, 824, 224, 356, 23, 21, 34);
    drawHyperbolicTower(cg, 904, 262, 392, 22, 20, 32);

    // Stamp nocturnal-graded substation battery racks in front of cooling towers
    if (assets.cutouts.serverHall && assets.cutouts.coolerUnit) {
      cg.globalAlpha = 0.97;
      cg.drawImage(assets.cutouts.serverHall, 584, 296, 190, 126);
      cg.drawImage(assets.cutouts.serverHall, 672, 344, 190, 126);
      cg.drawImage(assets.cutouts.coolerUnit, 768, 392, 122, 84);
    }
    cg.restore();

    assets.cleanMap = c;
  }

  function onAssetLoad() {
    assets.loadedCount++;
    if (assets.loadedCount >= 2 && !assets.ready) {
      assets.cutouts.serverHall   = extractNocturnalSprite(assets.spritesRaw, 18, 277, 326, 216, 'yard');
      assets.cutouts.coolerUnit   = extractNocturnalSprite(assets.spritesRaw, 593, 171, 246, 168, 'yard');
      assets.cutouts.heatsinkChip = extractNocturnalSprite(assets.spritesRaw, 233, 425, 281, 177, 'pad');
      assets.cutouts.chipA        = extractNocturnalSprite(assets.spritesRaw, 523, 839, 233, 144, 'pad');
      assets.cutouts.chipB        = extractNocturnalSprite(assets.spritesRaw, 767, 839, 235, 144, 'pad');
      assets.cutouts.chipC        = extractNocturnalSprite(assets.spritesRaw, 763, 572, 238, 149, 'pad');
      buildCleanMapLayer();
      assets.ready = true;
    }
  }

  assets.mapRaw.onload = onAssetLoad;
  assets.spritesRaw.onload = onAssetLoad;
  assets.mapRaw.onerror = () => { assets.loadedCount++; };
  assets.spritesRaw.onerror = () => { assets.loadedCount++; };
  assets.mapRaw.src = '../assets/town_map_with_lights_3_load_levels.png';
  assets.spritesRaw.src = '../assets/server_hall_and_chip_icons.png';

  // Audio Engine: ../assets/bgm_loop.mp3 + WebAudio substation hum, breaker clack, steam hiss, brownout crackle
  const bgm = new Audio('../assets/bgm_loop.mp3');
  bgm.loop = true;
  bgm.volume = 0.28;

  let audioCtx = null;
  let humOsc1 = null, humOsc2 = null, humFilter = null, humGain = null;
  let hissGain = null;

  function ensureAudio() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();

        humOsc1 = audioCtx.createOscillator();
        humOsc2 = audioCtx.createOscillator();
        humFilter = audioCtx.createBiquadFilter();
        humGain = audioCtx.createGain();
        humOsc1.type = 'sawtooth';
        humOsc2.type = 'triangle';
        humOsc1.frequency.value = 58;
        humOsc2.frequency.value = 116;
        humFilter.type = 'lowpass';
        humFilter.frequency.value = 170;
        humGain.gain.value = 0.0;
        humOsc1.connect(humFilter);
        humOsc2.connect(humFilter);
        humFilter.connect(humGain);
        humGain.connect(audioCtx.destination);
        humOsc1.start();
        humOsc2.start();

        const bufLen = audioCtx.sampleRate * 2;
        const noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
        const out = noiseBuf.getChannelData(0);
        let last = 0;
        for (let i = 0; i < bufLen; i++) {
          const white = Math.random() * 2 - 1;
          last = (last + 0.04 * white) / 1.04;
          out[i] = last * 2.6;
        }
        const noiseSrc = audioCtx.createBufferSource();
        noiseSrc.buffer = noiseBuf;
        noiseSrc.loop = true;
        const bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 880;
        bp.Q.value = 0.75;
        hissGain = audioCtx.createGain();
        hissGain.gain.value = 0.0;
        noiseSrc.connect(bp);
        bp.connect(hissGain);
        hissGain.connect(audioCtx.destination);
        noiseSrc.start();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      if (bgm.paused) bgm.play().catch(() => {});
    } catch (_) {}
  }

  function playSfx(kind) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
      const now = audioCtx.currentTime;
      if (kind === 'hall') {
        const o1 = audioCtx.createOscillator();
        const g1 = audioCtx.createGain();
        o1.type = 'triangle';
        o1.frequency.setValueAtTime(105, now);
        o1.frequency.exponentialRampToValueAtTime(44, now + 0.14);
        g1.gain.setValueAtTime(0.18, now);
        g1.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        o1.connect(g1); g1.connect(audioCtx.destination);
        o1.start(now); o1.stop(now + 0.17);

        const o2 = audioCtx.createOscillator();
        const g2 = audioCtx.createGain();
        o2.type = 'sine';
        o2.frequency.setValueAtTime(340, now + 0.02);
        o2.frequency.exponentialRampToValueAtTime(680, now + 0.12);
        g2.gain.setValueAtTime(0.09, now + 0.02);
        g2.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        o2.connect(g2); g2.connect(audioCtx.destination);
        o2.start(now + 0.02); o2.stop(now + 0.16);
      } else if (kind === 'sell' || kind === 'save' || kind === 'cap') {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'square';
        const f0 = kind === 'sell' ? 220 : (kind === 'save' ? 310 : 180);
        const f1 = kind === 'sell' ? 420 : (kind === 'save' ? 480 : 130);
        o.frequency.setValueAtTime(f0, now);
        o.frequency.exponentialRampToValueAtTime(f1, now + 0.08);
        g.gain.setValueAtTime(0.11, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now); o.stop(now + 0.11);
      } else if (kind === 'crackle') {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(1400 + Math.random() * 900, now);
        g.gain.setValueAtTime(0.035, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now); o.stop(now + 0.04);
      } else if (kind === 'blackout') {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(155, now);
        o.frequency.exponentialRampToValueAtTime(24, now + 0.65);
        g.gain.setValueAtTime(0.22, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.70);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now); o.stop(now + 0.72);
      }
    } catch (_) {}
  }

  // Tuned 7-Day Jevons Paradox State
  const game = {
    phase: AUTOSTART ? 'morn' : 'title',
    day: 1,
    maxDays: 7,
    dayProgress: 0,
    dayDuration: 2.80,
    breaker: 'sell',      // 'sell' | 'save' | 'cap'
    money: 1.20,          // $1.2M start matching f_001.jpg
    water: 64,            // 64% start matching f_001.jpg
    opinion: 41,          // 41% start matching f_001.jpg
    demandBonusPct: 12,   // +12% start matching f_001.jpg
    queryCost: 0.080,
    jevonsPressure: 0.0,
    reliefDip: 0.0,
    baseTownLoad: 22,
    dcLoadMW: 12,
    loadMW: 34,
    capMW: 100,
    bufferCharge: 0.24,
    overloadTimer: 0,
    surgeLevel: 0.10,
    hallsBuilt: 0,
    upgradesDone: 0,
    upgradeToken: true,
    soldCount: 0,
    savedCount: 0,
    cappedCount: 0,
    peakLoadMW: 34,
    slots: [],
    steamPuffs: [],
    cablePulses: [],
    sparks: [],
    cursor: { x: 372, y: 574 },
    uiRects: { startBtn: null, requestBox: null }
  };

  function resetGame(startImmediate = false) {
    rng = mulberry32(SEED_INIT);
    game.phase = (AUTOSTART || startImmediate) ? 'morn' : 'title';
    game.day = 1;
    game.dayProgress = 0;
    game.breaker = 'sell';
    game.money = 1.20;
    game.water = 64;
    game.opinion = 41;
    game.demandBonusPct = 12;
    game.queryCost = 0.080;
    game.jevonsPressure = 0.0;
    game.reliefDip = 0.0;
    game.baseTownLoad = 22;
    game.dcLoadMW = 12;
    game.loadMW = 34;
    game.capMW = 100;
    game.bufferCharge = 0.24;
    game.overloadTimer = 0;
    game.surgeLevel = 0.10;
    game.hallsBuilt = 0;
    game.upgradesDone = 0;
    game.upgradeToken = true;
    game.soldCount = 0;
    game.savedCount = 0;
    game.cappedCount = 0;
    game.peakLoadMW = 34;

    game.slots = PAD_DEFS.map((p) => ({
      ...p,
      installed: false,
      level: 0,
      snapAnim: 0,
      pulse: 0
    }));

    game.steamPuffs = [];
    game.sparks = [];

    game.cablePulses = [];
    for (let c = 0; c < MAIN_LINES.length; c++) {
      for (let k = 0; k < 5; k++) {
        game.cablePulses.push({
          lineIdx: c,
          u: (k / 5 + rng() * 0.08) % 1,
          speed: 0.14 + rng() * 0.04,
          len: 0.028 + rng() * 0.012
        });
      }
    }
  }

  function canUpgradeSlot(slot) {
    if (game.phase === 'title' || game.phase === 'black' || game.phase === 'end') return false;
    if (!slot.installed) return true;
    return game.hallsBuilt >= 4 && game.upgradeToken && game.upgradesDone < 7 && slot.level < 3;
  }

  function installOrUpgradePad(preferredIdx = -1) {
    if (game.phase === 'title' || game.phase === 'black' || game.phase === 'end') return false;
    ensureAudio();

    let slot = preferredIdx >= 0 ? game.slots[preferredIdx] : null;
    if (!slot || !canUpgradeSlot(slot)) {
      slot = game.slots.find(s => !s.installed)
        || game.slots.find(s => canUpgradeSlot(s))
        || null;
    }
    if (!slot || !canUpgradeSlot(slot)) return false;

    const wasNewHall = !slot.installed;
    slot.installed = true;
    slot.level += 1;
    slot.snapAnim = 0.01;
    slot.pulse = 1.0;
    game.cursor.x = slot.cx;
    game.cursor.y = slot.cy;

    if (wasNewHall) {
      game.hallsBuilt++;
      // Clearing initial 4 lots gently warms up baseline capacity (matching f_009 -> f_021 calm +12%..+22%)
      game.jevonsPressure += 0.08;
      game.reliefDip = Math.min(6, game.reliefDip + 2.5);
    } else {
      // Silicon Gen-2/3/4 upgrades cut query cost in half -> big morning dip followed by strong Jevons surge!
      game.upgradeToken = false;
      game.jevonsPressure += 0.48;
      game.reliefDip = Math.min(12, game.reliefDip + 6.5);
    }
    game.upgradesDone++;
    game.queryCost = Math.max(0.006, +(game.queryCost * 0.66).toFixed(3));

    spawnSparks(slot.cx, slot.cy, '#38d8ff', 14);
    playSfx('hall');
    return true;
  }

  function setBreaker(mode) {
    if (game.phase === 'title' || game.phase === 'black' || game.phase === 'end') return false;
    if (game.hallsBuilt === 0) return false;
    if (!['sell', 'save', 'cap'].includes(mode)) return false;
    ensureAudio();

    game.breaker = mode;
    if (mode === 'sell') {
      game.soldCount++;
      game.money = +(game.money + 0.05).toFixed(2);
      spawnSparks(834, 565, '#f2b84b', 10);
    } else if (mode === 'save') {
      game.savedCount++;
      game.capMW = Math.min(168, game.capMW + 6);
      game.bufferCharge = Math.min(1, game.bufferCharge + 0.16);
      spawnSparks(735, 392, '#38d8ff', 10);
    } else if (mode === 'cap') {
      game.cappedCount++;
      game.reliefDip = Math.min(18, game.reliefDip + 9);
      game.surgeLevel = Math.max(0.16, game.surgeLevel - 0.22);
      spawnSparks(834, 628, '#63b868', 10);
    }
    playSfx(mode);
    return true;
  }

  function triggerBlackout() {
    game.phase = 'black';
    game.opinion = 0;
    game.demandBonusPct = 100;
    game.surgeLevel = 0;
    playSfx('blackout');
    spawnSparks(842, 395, '#ff4d4d', 28);
    for (const s of game.slots) {
      if (s.installed) spawnSparks(s.cx, s.cy, '#f2b84b', 14);
    }
  }

  function spawnSteam() {
    const tower = rng() < 0.58 ? { x: 824, y: 222 } : { x: 902, y: 260 };
    const maxLife = 2.0 + rng() * 0.95;
    game.steamPuffs.push({
      x: tower.x + (rng() - 0.5) * 20,
      y: tower.y + (rng() - 0.5) * 6,
      vx: -5 - rng() * 9,
      vy: -42 - rng() * 32,
      r: 10 + rng() * 8,
      lobeAngle: rng() * Math.PI * 2,
      age: 0,
      maxLife
    });
  }

  function spawnSparks(cx, cy, color = '#f2b84b', n = 12) {
    for (let i = 0; i < n; i++) {
      const ang = rng() * Math.PI * 2;
      const spd = 35 + rng() * 115;
      game.sparks.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd * 0.55 - 24,
        age: 0,
        maxLife: 0.28 + rng() * 0.30,
        color
      });
    }
  }

  window.addEventListener('keydown', (e) => {
    ensureAudio();
    const k = e.key;
    if (game.phase === 'title') {
      if (k === 'Enter' || k === ' ') {
        e.preventDefault();
        game.phase = 'morn';
      }
      return;
    }
    if (game.phase === 'black' || game.phase === 'end') {
      if (k === 'r' || k === 'R' || k === 'Enter' || k === ' ') {
        e.preventDefault();
        resetGame(true);
      }
      return;
    }
    if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      installOrUpgradePad(-1);
    } else if (k === '1') {
      e.preventDefault();
      setBreaker('sell');
    } else if (k === '2') {
      e.preventDefault();
      setBreaker('save');
    } else if (k === '3') {
      e.preventDefault();
      setBreaker('cap');
    } else if (k === 'r' || k === 'R') {
      e.preventDefault();
      resetGame(true);
    }
  });

  function clientToLogical(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left) * (W / r.width),
      y: (clientY - r.top) * (H / r.height)
    };
  }

  canvas.addEventListener('mousemove', (e) => {
    const p = clientToLogical(e.clientX, e.clientY);
    game.cursor.x = p.x;
    game.cursor.y = p.y;
  });

  canvas.addEventListener('pointerdown', (e) => {
    ensureAudio();
    const p = clientToLogical(e.clientX, e.clientY);
    game.cursor.x = p.x;
    game.cursor.y = p.y;

    if (game.phase === 'title') {
      game.phase = 'morn';
      return;
    }
    if (game.phase === 'black' || game.phase === 'end') {
      resetGame(true);
      return;
    }

    if (game.hallsBuilt >= 1) {
      for (const sw of BREAKER_DEFS) {
        if (p.x >= sw.x && p.x <= sw.x + sw.w && p.y >= sw.y && p.y <= sw.y + sw.h) {
          setBreaker(sw.key);
          return;
        }
      }
    }

    for (let i = 0; i < game.slots.length; i++) {
      const s = game.slots[i];
      if (pointInDiamond(p.x, p.y, s.cx, s.cy, s.rw * 1.08, s.rh * 1.14)) {
        installOrUpgradePad(i);
        return;
      }
    }
  });

  let clock = 0;
  let crackleCooldown = 0;

  function update(dt) {
    clock += dt;

    for (const s of game.slots) {
      if (s.installed && s.snapAnim < 1) {
        s.snapAnim = Math.min(1, s.snapAnim + dt * 5.2);
      }
      if (s.pulse > 0) {
        s.pulse = Math.max(0, s.pulse - dt * 2.0);
      }
    }

    if (game.phase === 'title') return;

    if (game.phase !== 'black' && game.phase !== 'end') {
      // Hold Day 1 morning steady until player clears first dirt lot so ?autostart idle stays f_001-pure!
      if (game.hallsBuilt > 0) {
        game.dayProgress += dt / game.dayDuration;
      }

      if (game.dayProgress >= 1.0) {
        game.dayProgress -= 1.0;
        if (game.breaker === 'sell') game.soldCount++;
        else if (game.breaker === 'save') game.savedCount++;
        else game.cappedCount++;

        if (game.day >= game.maxDays) {
          game.phase = 'end';
          game.surgeLevel = Math.min(0.42, game.surgeLevel);
          return;
        }
        game.day++;
        game.upgradeToken = true;
      }

      if (game.dayProgress < 0.28 || game.hallsBuilt < 4) {
        game.phase = 'morn';
      } else if (game.dayProgress < 0.72) {
        game.phase = 'day';
      } else {
        game.phase = 'alloc';
      }

      game.reliefDip = Math.max(0, game.reliefDip - dt * 8.0);

      if (game.hallsBuilt > 0) {
        const afternoonPulse = 0.88 + 0.24 * Math.sin(game.dayProgress * Math.PI);
        const modeMult = game.breaker === 'sell' ? 1.18 : (game.breaker === 'save' ? 0.86 : 0.54);

        // Once all 4 halls are online, selling cheap queries compounds Jevons rebound dramatically!
        if (game.hallsBuilt >= 4 && game.breaker === 'sell') {
          const genBoost = Math.max(0, game.upgradesDone - 4);
          game.jevonsPressure = Math.min(3.2, game.jevonsPressure + dt * (0.28 + genBoost * 0.14));
        } else if (game.breaker === 'cap') {
          game.jevonsPressure = Math.max(0.25, game.jevonsPressure - dt * 0.34);
        }

        const targetDcMW = Math.max(
          12,
          (10 + game.hallsBuilt * 5.6 + game.jevonsPressure * 24.0) * modeMult * afternoonPulse - game.reliefDip
        );
        game.dcLoadMW += (targetDcMW - game.dcLoadMW) * Math.min(1, dt * 2.8);

        if (game.breaker === 'sell') {
          const revRate = game.hallsBuilt >= 4 ? (0.115 + Math.max(0, game.upgradesDone - 4) * 0.025) : 0.040;
          game.money = +(game.money + dt * revRate).toFixed(2);
          if (game.hallsBuilt >= 4) {
            game.water = Math.max(11, game.water - dt * (4.6 + game.jevonsPressure * 4.2));
            const strainExcess = Math.max(0, (game.loadMW / game.capMW) - 0.52);
            game.opinion = Math.max(0, game.opinion - dt * (3.2 + strainExcess * 36));
          }
          game.bufferCharge = Math.max(0.08, game.bufferCharge - dt * 0.05);
        } else if (game.breaker === 'save') {
          game.money = +(game.money + dt * 0.040).toFixed(2);
          game.capMW = Math.min(172, game.capMW + dt * 6.0);
          game.bufferCharge = Math.min(1.0, game.bufferCharge + dt * 0.22);
          game.water = Math.max(12, game.water - dt * 1.1);
          game.opinion = Math.min(100, game.opinion + dt * 2.0);
        } else {
          game.money = +(game.money + dt * 0.010).toFixed(2);
          game.water = Math.min(100, game.water + dt * 3.0);
          game.opinion = Math.min(100, game.opinion + dt * 7.5);
          game.bufferCharge = Math.min(1.0, game.bufferCharge + dt * 0.06);
        }
      }

      game.loadMW = game.baseTownLoad + game.dcLoadMW + Math.sin(clock * 4.1) * 0.5;
      game.peakLoadMW = Math.max(game.peakLoadMW, game.loadMW);

      const loadRatio = game.loadMW / Math.max(1, game.capMW);
      // Map loadRatio -> +12% (calm) -> +100% blazing crimson red at >= 0.88 loadRatio!
      const targetDemandPct = game.hallsBuilt < 4
        ? 12
        : Math.max(12, Math.min(100, Math.round(12 + Math.max(0, loadRatio - 0.48) * 225)));
      game.demandBonusPct += (targetDemandPct - game.demandBonusPct) * Math.min(1, dt * 4.8);

      const targetSurge = game.hallsBuilt < 4
        ? (0.10 + game.hallsBuilt * 0.035)
        : Math.max(0.46, Math.min(1.22, 0.46 + Math.max(0, loadRatio - 0.44) * 1.75));
      game.surgeLevel += (targetSurge - game.surgeLevel) * Math.min(1, dt * 3.8);

      crackleCooldown = Math.max(0, crackleCooldown - dt);
      if (loadRatio > 0.86 && crackleCooldown <= 0 && rng() < dt * 4.5) {
        playSfx('crackle');
        crackleCooldown = 0.22;
      }

      if (game.loadMW > game.capMW * 1.05) {
        if (game.bufferCharge > 0.25 && game.breaker === 'save') {
          game.bufferCharge = Math.max(0, game.bufferCharge - dt * 0.40);
        } else {
          game.overloadTimer += dt;
          if (game.overloadTimer > 1.35) {
            triggerBlackout();
          }
        }
      } else {
        game.overloadTimer = Math.max(0, game.overloadTimer - dt * 1.8);
      }
    } else if (game.phase === 'black') {
      game.loadMW = Math.max(0, game.loadMW - dt * 90);
    }

    if (audioCtx && audioCtx.state === 'running' && humOsc1 && humGain && hissGain) {
      const strain = Math.min(1.25, game.loadMW / Math.max(1, game.capMW));
      const active = (game.phase !== 'black' && game.phase !== 'title');
      const targetHum = active ? (0.010 + strain * 0.030) : 0;
      humOsc1.frequency.value = 56 + strain * 44;
      humOsc2.frequency.value = 112 + strain * 88;
      humFilter.frequency.value = 150 + strain * 340;
      humGain.gain.value += (targetHum - humGain.gain.value) * 0.14;

      const steamActive = (active && game.hallsBuilt >= 4) ? Math.max(0, strain - 0.38) * 0.030 : 0;
      hissGain.gain.value += (steamActive - hissGain.gain.value) * 0.12;
    }

    // Cooling tower volumetric steam: silent while clearing initial lots (f_001..f_009),
    // billowing richly once all 4 halls come online (f_021..f_033)!
    const steamRate = (game.phase === 'black' || game.hallsBuilt < 4)
      ? 0
      : (18.0 + Math.max(0, game.surgeLevel - 0.30) * 24.0);
    let toSpawn = steamRate * dt;
    while (toSpawn >= 1 || rng() < toSpawn) {
      spawnSteam();
      toSpawn -= 1;
      if (toSpawn <= 0) break;
    }

    for (let i = game.steamPuffs.length - 1; i >= 0; i--) {
      const p = game.steamPuffs[i];
      const mult = 0.85 + game.surgeLevel * 0.55;
      p.age += dt;
      p.x += p.vx * dt * mult + Math.sin(clock * 2.6 + p.r) * 7.5 * dt;
      p.y += p.vy * dt * mult;
      p.r += dt * (8.5 + game.surgeLevel * 6.5);
      if (p.age >= p.maxLife) game.steamPuffs.splice(i, 1);
    }

    const pulseMult = game.phase === 'black' ? 0 : (0.75 + game.surgeLevel * 3.4);
    for (const p of game.cablePulses) {
      p.u = (p.u + p.speed * pulseMult * dt) % 1;
    }

    for (let i = game.sparks.length - 1; i >= 0; i--) {
      const s = game.sparks[i];
      s.age += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vy += 175 * dt;
      if (s.age >= s.maxLife) game.sparks.splice(i, 1);
    }
  }

  function pointOnPath(pts, u) {
    let total = 0;
    const segs = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
      segs.push(d);
      total += d;
    }
    let target = Math.max(0, Math.min(1, u)) * total;
    for (let i = 0; i < segs.length; i++) {
      if (target <= segs[i] || i === segs.length - 1) {
        const t = segs[i] > 0 ? target / segs[i] : 0;
        return [
          pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t,
          pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t
        ];
      }
      target -= segs[i];
    }
    return pts[pts.length - 1];
  }

  function drawTownWindowFlicker() {
    const loadRatio = game.loadMW / Math.max(1, game.capMW);
    const sagBias = game.breaker === 'sell' ? 0.04 : (game.breaker === 'cap' ? -0.16 : -0.04);
    const effectiveStrain = Math.max(0, loadRatio + sagBias);

    for (let i = 0; i < HOUSE_WINDOWS.length; i++) {
      const w = HOUSE_WINDOWS[i];
      let dimAlpha = 0;
      if (game.phase === 'black') {
        dimAlpha = 0.88;
      } else if (effectiveStrain > w.threshold) {
        const excess = (effectiveStrain - w.threshold) / (1.06 - w.threshold);
        const acFlicker = Math.sin(clock * (15 + (i % 6) * 3.4) + w.phase) > -0.15 ? 0.25 : 0.84;
        dimAlpha = Math.min(0.86, excess * 0.58 + (excess > 0.25 ? acFlicker * 0.36 : 0));
      }

      if (dimAlpha > 0.05) {
        // Exact window-pane size in dark slate glass tone (never biting holes into house walls!)
        ctx.fillStyle = `rgba(26, 35, 44, ${dimAlpha.toFixed(3)})`;
        ctx.fillRect(w.x - w.w * 0.52, w.y - w.h * 0.52, w.w * 1.04, w.h * 1.04);
      }
    }
  }

  function drawSubstationHardwareState() {
    const racks = [
      [624, 344], [648, 356], [672, 368], [696, 380],
      [712, 392], [736, 404], [760, 416], [784, 428]
    ];
    ctx.save();
    for (let i = 0; i < racks.length; i++) {
      const [rx, ry] = racks[i];
      const lit = game.phase !== 'black' && ((i + 0.5) / racks.length <= game.bufferCharge + 0.15);
      if (!lit) {
        ctx.fillStyle = 'rgba(35, 48, 60, 0.7)';
      } else if (game.breaker === 'save') {
        ctx.fillStyle = '#38d8ff';
      } else if (game.breaker === 'cap') {
        ctx.fillStyle = '#63b868';
      } else {
        ctx.fillStyle = game.surgeLevel > 0.72 ? '#ffb830' : '#58c496';
      }
      ctx.fillRect(rx, ry, 2.5, 4.5);
      ctx.fillRect(rx + 5, ry + 2, 2.5, 4.5);
    }
    ctx.restore();
  }

  function drawIsometricPad(s, isHovered) {
    const validAction = canUpgradeSlot(s);
    ctx.save();
    ctx.translate(s.cx, s.cy);

    if (!s.installed) {
      ctx.beginPath();
      ctx.moveTo(0, -s.rh);
      ctx.lineTo(s.rw, 0);
      ctx.lineTo(0, s.rh);
      ctx.lineTo(-s.rw, 0);
      ctx.closePath();
      ctx.fillStyle = (isHovered && validAction) ? '#2f2a26' : '#25211f';
      ctx.fill();

      ctx.lineWidth = 1.1;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, -s.rh * 0.76);
      ctx.lineTo(s.rw * 0.76, 0);
      ctx.lineTo(0, s.rh * 0.76);
      ctx.lineTo(-s.rw * 0.76, 0);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(12, 16, 20, 0.45)';
      ctx.lineWidth = 1;
      ctx.stroke();

      if (isHovered && validAction) {
        ctx.beginPath();
        ctx.moveTo(0, -s.rh);
        ctx.lineTo(s.rw, 0);
        ctx.lineTo(0, s.rh);
        ctx.lineTo(-s.rw, 0);
        ctx.closePath();
        ctx.strokeStyle = '#f2b84b';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        ctx.fillStyle = 'rgba(13, 18, 23, 0.88)';
        ctx.fillRect(-44, -10, 88, 19);
        ctx.strokeStyle = 'rgba(242, 184, 75, 0.75)';
        ctx.lineWidth = 1;
        ctx.strokeRect(-44, -10, 88, 19);
        ctx.fillStyle = '#f2b84b';
        ctx.font = 'bold 11px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(s.shortTag, 0, 3);
      }
      ctx.restore();
      return;
    }

    const ease = 1 - Math.pow(1 - s.snapAnim, 3);
    const dropY = (1 - ease) * -28;

    // 1. Flush nocturnal dark-slate plinth
    ctx.beginPath();
    ctx.moveTo(0, -s.rh);
    ctx.lineTo(s.rw, 0);
    ctx.lineTo(0, s.rh);
    ctx.lineTo(-s.rw, 0);
    ctx.closePath();
    ctx.fillStyle = '#121a22';
    ctx.fill();
    ctx.lineWidth = 1.3;
    ctx.strokeStyle = game.phase === 'black' ? '#202830' : '#243444';
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, -s.rh * 0.90);
    ctx.lineTo(s.rw * 0.90, 0);
    ctx.lineTo(0, s.rh * 0.90);
    ctx.lineTo(-s.rw * 0.90, 0);
    ctx.closePath();
    ctx.fillStyle = '#17212b';
    ctx.fill();

    // 2. Nocturnal-graded heatsink / silicon hall sprite
    ctx.save();
    ctx.translate(0, dropY);
    const sprite = assets.cutouts[s.spriteKey];
    if (sprite) {
      const dw = s.spriteKey === 'heatsinkChip' ? 228 : 210;
      const dh = s.spriteKey === 'heatsinkChip' ? 142 : 130;
      ctx.drawImage(sprite, -dw * 0.5, -dh * 0.52, dw, dh);
    }

    if (s.level >= 2 && s.spriteKey !== 'heatsinkChip') {
      const fins = 5 + s.level * 2;
      ctx.strokeStyle = '#243240';
      ctx.lineWidth = 1.4;
      for (let f = 0; f < fins; f++) {
        const u = (f / (fins - 1)) - 0.5;
        const ox = u * 34;
        const oy = u * 18 - 6;
        ctx.beginPath();
        ctx.moveTo(ox - 18, oy + 9);
        ctx.lineTo(ox + 18, oy - 9);
        ctx.stroke();
      }
    }

    // 3. Isometric circuit conduits: calm muted slate at low load (matching f_021!),
    // igniting into bright electric cyan (#38d8ff) + golden-amber (#ffb830) under high Jevons strain (matching f_033!)
    if (game.phase !== 'black') {
      const cyanIntensity = Math.max(0, Math.min(1.0, (game.surgeLevel - 0.44) * 1.45 + s.pulse * 0.45));
      const amberIntensity = Math.max(0, Math.min(1.0, (game.surgeLevel - 0.68) * 1.85));

      if (cyanIntensity > 0.05) {
        ctx.save();
        if (cyanIntensity > 0.35) {
          ctx.shadowColor = '#38d8ff';
          ctx.shadowBlur = 7 * cyanIntensity;
        }

        const tracesPerSide = 6;
        const dirs = [
          { ex:  1, ey: -1 },
          { ex: -1, ey: -1 },
          { ex:  1, ey:  1 },
          { ex: -1, ey:  1 }
        ];

        for (let dIdx = 0; dIdx < dirs.length; dIdx++) {
          const { ex, ey } = dirs[dIdx];
          for (let k = 0; k < tracesPerSide; k++) {
            const frac = (k + 0.5) / tracesPerSide;
            const edgeX = ex * s.rw * (1 - frac * 0.88) * 0.88;
            const edgeY = ey * s.rh * (0.12 + frac * 0.88) * 0.88;
            const sockX = edgeX * 0.44;
            const sockY = edgeY * 0.44;

            const wave = 0.68 + 0.32 * Math.sin(clock * (5 + game.surgeLevel * 12) + k * 1.1 + dIdx + s.id);
            const useAmber = amberIntensity > 0.20 && (k === 2 || k === 3);

            ctx.beginPath();
            ctx.moveTo(sockX, sockY);
            ctx.lineTo(edgeX, edgeY);
            ctx.lineWidth = useAmber ? 1.9 : 1.35;
            ctx.strokeStyle = useAmber
              ? `rgba(255, 194, 76, ${(amberIntensity * wave).toFixed(3)})`
              : `rgba(56, 216, 255, ${(cyanIntensity * wave * 0.90).toFixed(3)})`;
            ctx.stroke();

            if (cyanIntensity > 0.25) {
              ctx.fillStyle = useAmber
                ? `rgba(255, 224, 140, ${(amberIntensity * wave).toFixed(3)})`
                : `rgba(125, 234, 255, ${(cyanIntensity * wave).toFixed(3)})`;
              ctx.fillRect(edgeX - 1.5, edgeY - 1.2, 3, 2.4);
            }
          }
        }
        ctx.restore();
      }
    }
    ctx.restore();

    if (isHovered && validAction) {
      ctx.beginPath();
      ctx.moveTo(0, -s.rh);
      ctx.lineTo(s.rw, 0);
      ctx.lineTo(0, s.rh);
      ctx.lineTo(-s.rw, 0);
      ctx.closePath();
      ctx.strokeStyle = '#38d8ff';
      ctx.lineWidth = 1.6;
      ctx.stroke();

      ctx.fillStyle = 'rgba(13, 18, 23, 0.90)';
      ctx.fillRect(-50, -10, 100, 19);
      ctx.strokeStyle = '#38d8ff';
      ctx.lineWidth = 1;
      ctx.strokeRect(-50, -10, 100, 19);
      ctx.fillStyle = '#38d8ff';
      ctx.font = 'bold 11px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`GEN-${s.level + 1} DIE`, 0, 3);
    }

    ctx.restore();
  }

  function drawOrganicPlasmaRibbon(pts, waveAmp, seedOffset, strokeStyle, lineWidth, glowBlur) {
    ctx.save();
    if (glowBlur > 0) {
      ctx.shadowColor = '#ffa822';
      ctx.shadowBlur = glowBlur;
    }
    ctx.strokeStyle = strokeStyle;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();

    const steps = 36;
    for (let i = 0; i <= steps; i++) {
      const u = i / steps;
      const [bx, by] = pointOnPath(pts, u);
      const env = 0.25 + 0.75 * Math.sin(u * Math.PI);
      const wx = waveAmp * env * (Math.sin(u * 22 - clock * 14 + seedOffset) + 0.45 * Math.sin(u * 47 + clock * 21 + seedOffset * 2));
      const wy = waveAmp * env * (Math.cos(u * 19 - clock * 12 + seedOffset * 1.4) + 0.45 * Math.cos(u * 43 + clock * 19));
      if (i === 0) ctx.moveTo(bx, by);
      else ctx.lineTo(bx + wx * 0.55, by + wy);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawPowerGrid() {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 1. Subtle dark overhead transmission wires
    for (const pts of MAIN_LINES) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.strokeStyle = game.phase === 'black'
        ? 'rgba(32, 40, 48, 0.5)'
        : `rgba(242, 184, 75, ${0.10 + Math.min(0.32, game.surgeLevel * 0.28)})`;
      ctx.lineWidth = 1.3;
      ctx.stroke();
    }

    if (game.phase === 'black') {
      ctx.restore();
      return;
    }

    // 2. Spaced glowing amber dashes in calm/early load (matching f_001 & f_009!)
    ctx.save();
    ctx.shadowColor = '#ffb028';
    ctx.shadowBlur = 7 + game.surgeLevel * 7;
    for (const p of game.cablePulses) {
      const pts = MAIN_LINES[p.lineIdx];
      const u0 = p.u;
      const u1 = Math.min(1, u0 + p.len * (1 + game.surgeLevel * 1.4));
      const p0 = pointOnPath(pts, u0);
      const p1 = pointOnPath(pts, u1);
      ctx.beginPath();
      ctx.moveTo(p0[0], p0[1]);
      ctx.lineTo(p1[0], p1[1]);
      ctx.strokeStyle = game.surgeLevel > 0.52 ? '#ffecb0' : '#f2b84b';
      ctx.lineWidth = 2.2 + game.surgeLevel * 1.4;
      ctx.stroke();
    }
    ctx.restore();

    // 3. Continuous organic catenary golden transmission ribbons once all 4 halls come online (matching f_021 & f_033!)
    if (game.surgeLevel > 0.30) {
      const sAlpha = Math.min(0.96, (game.surgeLevel - 0.30) * 1.55);
      for (let idx = 0; idx < MAIN_LINES.length; idx++) {
        const pts = MAIN_LINES[idx];
        drawOrganicPlasmaRibbon(
          pts,
          2.2 + game.surgeLevel * 2.8,
          idx * 3.7,
          `rgba(255, 182, 44, ${(sAlpha * 0.90).toFixed(3)})`,
          2.0 + game.surgeLevel * 1.5,
          12
        );
        drawOrganicPlasmaRibbon(
          pts,
          1.6 + game.surgeLevel * 2.0,
          idx * 3.7 + 2.1,
          `rgba(255, 244, 198, ${(sAlpha * 0.82).toFixed(3)})`,
          1.1 + game.surgeLevel * 0.7,
          5
        );
      }
    }

    // 4. Substation -> Server-Hall & Inter-Pad Jevons Surge Filaments (igniting at high strain like f_027 & f_033!)
    if (game.surgeLevel > 0.58 && game.hallsBuilt > 0) {
      const fAlpha = Math.min(0.96, (game.surgeLevel - 0.58) * 1.95);
      for (let i = 0; i < PAD_FEEDERS.length; i++) {
        const fd = PAD_FEEDERS[i];
        if (!fd.reqSlots.every(id => game.slots[id].installed)) continue;
        drawOrganicPlasmaRibbon(
          fd.pts,
          2.2 + game.surgeLevel * 2.4,
          10 + i * 2.7,
          `rgba(255, 182, 46, ${(fAlpha * 0.92).toFixed(3)})`,
          2.1 + game.surgeLevel * 1.4,
          13
        );
        drawOrganicPlasmaRibbon(
          fd.pts,
          1.3 + game.surgeLevel * 1.5,
          20 + i * 3.1,
          `rgba(255, 246, 206, ${(fAlpha * 0.84).toFixed(3)})`,
          1.1 + game.surgeLevel * 0.6,
          4
        );
      }
    }

    ctx.restore();
  }

  function drawCoolingSteam() {
    if (game.steamPuffs.length === 0) return;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, MAP_W, H);
    ctx.clip();
    for (const p of game.steamPuffs) {
      const t = p.age / p.maxLife;
      const alpha = Math.sin(t * Math.PI) * (0.42 + Math.min(0.28, game.surgeLevel * 0.22));
      // Shaded lower-right underside + crisp sunlit upper-left cottony lobe (matching sheet.jpg plumes!)
      ctx.fillStyle = `rgba(116, 130, 144, ${(alpha * 0.55).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(p.x + p.r * 0.16, p.y + p.r * 0.14, p.r * 0.92, 0, Math.PI * 2);
      ctx.fill();

      const grad = ctx.createRadialGradient(p.x - p.r * 0.28, p.y - p.r * 0.28, p.r * 0.08, p.x, p.y, p.r * 0.94);
      grad.addColorStop(0, `rgba(234, 242, 248, ${alpha.toFixed(3)})`);
      grad.addColorStop(0.66, `rgba(176, 190, 202, ${(alpha * 0.78).toFixed(3)})`);
      grad.addColorStop(1, 'rgba(130, 144, 158, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 0.94, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // VOIDBASTARD-TAO Law 4 & Law 5: 3 Compact Diegetic Breaker Switches beside the Substation
  // Armed once all 4 halls are online (when freed capacity exists to route!)
  function drawSubstationBreakers() {
    if (game.hallsBuilt < 4 || game.phase === 'title' || game.phase === 'black' || game.phase === 'end') {
      return;
    }

    ctx.save();
    const activeSw = BREAKER_DEFS.find(b => b.key === game.breaker) || BREAKER_DEFS[0];
    ctx.beginPath();
    if (game.breaker === 'sell') {
      ctx.moveTo(activeSw.x, activeSw.y + 13);
      ctx.lineTo(742, 552);
      ctx.lineTo(714, 522);
    } else if (game.breaker === 'save') {
      ctx.moveTo(activeSw.x + activeSw.w * 0.5, activeSw.y);
      ctx.lineTo(808, 496);
      ctx.lineTo(762, 434);
    } else {
      ctx.moveTo(activeSw.x + activeSw.w * 0.72, activeSw.y);
      ctx.lineTo(860, 502);
      ctx.lineTo(848, 452);
    }
    ctx.strokeStyle = activeSw.color;
    ctx.globalAlpha = 0.65;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.fillStyle = 'rgba(11, 16, 21, 0.82)';
    ctx.fillRect(766, 546, 136, 102);
    ctx.strokeStyle = 'rgba(232, 238, 242, 0.13)';
    ctx.lineWidth = 1;
    ctx.strokeRect(766.5, 546.5, 135, 101);

    for (const sw of BREAKER_DEFS) {
      const isOn = game.breaker === sw.key;
      const isHov = (
        game.cursor.x >= sw.x && game.cursor.x <= sw.x + sw.w &&
        game.cursor.y >= sw.y && game.cursor.y <= sw.y + sw.h
      );

      ctx.fillStyle = isOn ? 'rgba(26, 36, 46, 0.95)' : (isHov ? 'rgba(22, 30, 38, 0.9)' : 'rgba(14, 19, 24, 0.9)');
      ctx.fillRect(sw.x, sw.y, sw.w, sw.h);

      ctx.strokeStyle = isOn ? sw.color : (isHov ? 'rgba(232,238,242,0.45)' : 'rgba(232,238,242,0.15)');
      ctx.lineWidth = isOn ? 1.5 : 1;
      ctx.strokeRect(sw.x + 0.5, sw.y + 0.5, sw.w - 1, sw.h - 1);

      const knobX = isOn ? sw.x + sw.w - 17 : sw.x + sw.w - 26;
      ctx.fillStyle = '#0a0e12';
      ctx.fillRect(sw.x + sw.w - 29, sw.y + 6, 22, 14);
      ctx.fillStyle = isOn ? sw.color : '#465462';
      ctx.fillRect(knobX, sw.y + 8, 9, 10);

      ctx.fillStyle = isOn ? sw.color : '#8fa0ae';
      ctx.font = 'bold 11.5px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(sw.label, sw.x + 8, sw.y + 17);
    }
    ctx.restore();
  }

  function drawRightPanel() {
    const X = 936;
    const BW = 314;

    ctx.fillStyle = '#0d1114';
    ctx.fillRect(MAP_W, 0, W - MAP_W, H);

    const loadRatio = game.loadMW / Math.max(1, game.capMW);
    const demandPct = Math.round(game.demandBonusPct);
    const opinionPct = Math.round(game.opinion);
    const waterPct = Math.round(game.water);

    const demandRed = demandPct >= 82 || loadRatio >= 0.88 || game.phase === 'black';
    const demandAmber = !demandRed && (demandPct >= 44 || loadRatio >= 0.68);
    const opinionRed = opinionPct <= 16 || game.phase === 'black';

    const bars = [
      {
        label: 'MONEY',
        val: `$${game.money.toFixed(1)}M`,
        fill: Math.min(1, 0.84 + (game.money - 1.2) * 0.28),
        barCol: '#dce4ea',
        txtCol: '#dce4ea',
        y: 112
      },
      {
        label: 'WATER',
        val: `${waterPct}%`,
        fill: Math.max(0.08, Math.min(1, waterPct / 100)),
        barCol: '#dce4ea',
        txtCol: '#dce4ea',
        y: 200
      },
      {
        label: 'OPINION',
        val: `${opinionPct}%`,
        fill: opinionRed ? Math.max(0.15, opinionPct / 100) : Math.max(0.08, opinionPct / 100),
        barCol: opinionRed ? '#d43f3f' : '#dfa03a',
        txtCol: opinionRed ? '#dc4c4c' : '#dce4ea',
        y: 288
      },
      {
        label: 'DEMAND',
        val: `+${demandPct}%`,
        fill: demandRed ? Math.max(0.92, Math.min(1, demandPct / 100)) : Math.min(1, 0.82 + (demandPct - 12) * 0.0022),
        barCol: demandRed ? '#d43f3f' : (demandAmber ? '#dfa03a' : '#dce4ea'),
        txtCol: demandRed ? '#dc4c4c' : '#dce4ea',
        y: 376
      }
    ];

    for (const b of bars) {
      ctx.font = 'bold 23px "Courier New", monospace';
      ctx.fillStyle = b.txtCol;
      ctx.textAlign = 'left';
      ctx.fillText(b.label, X, b.y);
      ctx.textAlign = 'right';
      ctx.fillText(b.val, X + BW, b.y);

      ctx.fillStyle = '#32383d';
      ctx.fillRect(X, b.y + 15, BW, 18);
      ctx.fillStyle = b.barCol;
      ctx.fillRect(X, b.y + 15, Math.round(BW * Math.max(0, Math.min(1, b.fill))), 18);
    }

    const rx = 934, ry = 510, rw = 316, rh = 140;
    game.uiRects.requestBox = { x: rx, y: ry, w: rw, h: rh };

    let borderCol = '#dce4ea';
    if (game.phase === 'black') borderCol = '#d43f3f';
    else if (game.hallsBuilt >= 4 || game.phase === 'end') borderCol = '#63b868';

    ctx.strokeStyle = borderCol;
    ctx.lineWidth = 2.5;
    ctx.strokeRect(rx + 1.25, ry + 1.25, rw - 2.5, rh - 2.5);

    ctx.textAlign = 'center';
    ctx.font = 'bold 24px "Courier New", monospace';
    if (game.phase === 'black') {
      ctx.fillStyle = '#dc4c4c';
      ctx.fillText('GRID BLACKOUT', rx + rw * 0.5, ry + 56);
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillStyle = '#dce4ea';
      ctx.fillText('[R] REBUILD WEEK', rx + rw * 0.5, ry + 98);
    } else if (game.phase === 'end') {
      ctx.fillStyle = '#63b868';
      ctx.fillText('WEEK 7 SURVIVED', rx + rw * 0.5, ry + 52);
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.fillStyle = '#dfa03a';
      ctx.fillText(`S:${game.soldCount} B:${game.savedCount} C:${game.cappedCount} · [R]`, rx + rw * 0.5, ry + 98);
    } else {
      ctx.fillStyle = '#dce4ea';
      ctx.fillText('WEEK 7 REQUEST', rx + rw * 0.5, ry + 56);

      ctx.font = 'bold 19px "Courier New", monospace';
      if (game.hallsBuilt < 4) {
        const rem = 4 - game.hallsBuilt;
        ctx.fillStyle = '#dfa03a';
        ctx.fillText(`+1 hall: clear ${rem} lot${rem === 1 ? '' : 's'}`, rx + rw * 0.5, ry + 98);
      } else {
        const p1 = '+1 hall: ';
        const p2 = 'COMPLETE';
        ctx.textAlign = 'left';
        const w1 = ctx.measureText(p1).width;
        const w2 = ctx.measureText(p2).width;
        const startX = rx + (rw - (w1 + w2)) * 0.5;
        ctx.fillStyle = '#dfa03a';
        ctx.fillText(p1, startX, ry + 98);
        ctx.fillStyle = '#63b868';
        ctx.fillText(p2, startX + w1, ry + 98);
      }

      for (let d = 1; d <= game.maxDays; d++) {
        ctx.fillStyle = d <= game.day
          ? (game.hallsBuilt >= 4 ? 'rgba(99, 184, 104, 0.52)' : 'rgba(223, 160, 58, 0.52)')
          : 'rgba(220, 228, 234, 0.13)';
        ctx.fillRect(rx + rw - 74 + (d - 1) * 9, ry + rh - 11, 6, 3);
      }
    }
  }

  function drawTitleOverlay() {
    if (game.phase !== 'title') return;
    ctx.save();
    ctx.fillStyle = 'rgba(10, 14, 18, 0.84)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#f2b84b';
    ctx.font = 'bold 74px "Courier New", monospace';
    ctx.fillText('CAPACITY CRISIS', W * 0.5, 295);

    ctx.fillStyle = '#e8eef2';
    ctx.font = '26px "Courier New", monospace';
    ctx.fillText('half the cost. triple the demand.', W * 0.5, 368);

    const bw = 320, bh = 72;
    const bx = (W - bw) * 0.5, by = 442;
    game.uiRects.startBtn = { x: bx, y: by, w: bw, h: bh };
    ctx.fillStyle = '#0d1216';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#e8eef2';
    ctx.lineWidth = 3;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = '#e8eef2';
    ctx.font = 'bold 26px "Courier New", monospace';
    ctx.fillText('START', W * 0.5, by + 45);
    ctx.restore();
  }

  function drawCursorArrow() {
    const x = game.cursor.x, y = game.cursor.y;
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 21);
    ctx.lineTo(5.5, 16.5);
    ctx.lineTo(10, 25);
    ctx.lineTo(13, 23.5);
    ctx.lineTo(8.5, 15);
    ctx.lineTo(15, 15);
    ctx.closePath();
    ctx.fillStyle = '#0f1418';
    ctx.fill();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = '#e8eef2';
    ctx.stroke();
    ctx.restore();
  }

  function render() {
    ctx.fillStyle = '#0f1418';
    ctx.fillRect(0, 0, W, H);

    if (assets.ready && assets.cleanMap) {
      ctx.drawImage(assets.cleanMap, 0, 0);
    }

    drawTownWindowFlicker();
    drawSubstationHardwareState();

    let hoveredSlotId = -1;
    for (const s of game.slots) {
      if (pointInDiamond(game.cursor.x, game.cursor.y, s.cx, s.cy, s.rw * 1.04, s.rh * 1.08)) {
        hoveredSlotId = s.id;
        break;
      }
    }
    for (const s of game.slots) {
      drawIsometricPad(s, s.id === hoveredSlotId);
    }

    drawPowerGrid();
    drawCoolingSteam();

    for (const s of game.sparks) {
      const a = Math.max(0, 1 - s.age / s.maxLife);
      ctx.fillStyle = s.color;
      ctx.globalAlpha = a;
      ctx.fillRect(s.x - 1.8, s.y - 1.8, 3.6, 3.6);
    }
    ctx.globalAlpha = 1;

    const vig = ctx.createRadialGradient(MAP_W * 0.48, H * 0.52, 240, MAP_W * 0.48, H * 0.52, 630);
    vig.addColorStop(0, 'rgba(15,20,24,0)');
    vig.addColorStop(1, game.phase === 'black' ? 'rgba(4,6,9,0.72)' : 'rgba(6,10,14,0.32)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, MAP_W, H);

    drawSubstationBreakers();
    drawRightPanel();
    drawTitleOverlay();
    drawCursorArrow();
  }

  window.__game = {
    get state() {
      const rect = canvas.getBoundingClientRect();
      return {
        phase: game.phase,
        day: game.day,
        maxDays: game.maxDays,
        dayProgress: +game.dayProgress.toFixed(3),
        breaker: game.breaker,
        money: game.money,
        water: Math.round(game.water),
        opinion: Math.round(game.opinion),
        demandBonusPct: Math.round(game.demandBonusPct),
        loadMW: +game.loadMW.toFixed(1),
        capMW: +game.capMW.toFixed(1),
        loadRatio: +(game.loadMW / Math.max(1, game.capMW)).toFixed(3),
        surgeLevel: +game.surgeLevel.toFixed(3),
        hallsBuilt: game.hallsBuilt,
        upgradesDone: game.upgradesDone,
        upgradeToken: game.upgradeToken,
        soldCount: game.soldCount,
        savedCount: game.savedCount,
        cappedCount: game.cappedCount,
        slots: game.slots.map(s => ({
          id: s.id, cx: s.cx, cy: s.cy, installed: s.installed, level: s.level
        })),
        breakers: BREAKER_DEFS.map(b => ({
          key: b.key, cx: b.x + b.w * 0.5, cy: b.y + b.h * 0.5
        })),
        viewportRect: { left: rect.left, top: rect.top, width: rect.width, height: rect.height }
      };
    }
  };

  resetGame(false);

  let lastTs = performance.now();
  function frame(ts) {
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

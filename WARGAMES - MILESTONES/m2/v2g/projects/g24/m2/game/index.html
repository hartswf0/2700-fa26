<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="data:," />
<title>Memory Munitions — M2 Playable Build</title>
<style>
  :root {
    --bg: #07060c;
    --fg: #5dff9e;
    --acc: #ff4fb0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: #030206;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--fg);
  }
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: var(--bg);
    box-shadow: 0 0 70px rgba(93, 255, 158, 0.12);
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script>
(() => {
  'use strict';

  const W = 1280, H = 720;
  const HORIZON_Y = 472;
  const GROUND_Y = 602;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });

  const params = new URLSearchParams(location.search);
  const AUTOSTART = params.has('autostart');
  const SEED_INIT = Number(params.get('seed') ?? 7) || 7;

  function mulberry32(a) {
    let s = a >>> 0;
    return function() {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let rng = mulberry32(SEED_INIT);

  // Exact Nano Banana Sprite Sheet Coordinates (measured from PNG assets)
  const PLAYER_FRAMES = {
    miniIdle:  [51, 304, 157, 197],
    miniWalkA: [225, 304, 157, 197],
    miniRunA:  [674, 529, 161, 194],
    miniRunB:  [846, 529, 159, 194],
    rifleAim:  [394, 304, 154, 197],
    beamPrep:  [551, 305, 151, 196],
    rifleFire: [46, 532, 216, 193]
  };

  const ENEMY_FRAMES = {
    sentinelIdle:    [39, 40, 167, 238],
    sentinelWalkA:   [262, 40, 186, 234],
    sentinelWalkB:   [269, 298, 176, 229],
    sentinelHit:     [501, 41, 190, 237],
    sentinelShatter: [769, 42, 207, 235],
    bruteWalkA:      [379, 554, 275, 210],
    bruteWalkB:      [733, 557, 242, 213],
    bruteHit:        [389, 793, 262, 210],
    bruteShatter:    [733, 808, 215, 198]
  };

  // 8 Memory Fragments from 8_memory_fragments_photo_map_message.png (1376x768)
  const MEMORY_DEFS = [
    { id: 0, crop: [66, 86, 294, 231],   kind: 'PHOTO',   title: 'Gable House, 1984',       caption: 'The porch light was still on the night you volunteered.' },
    { id: 1, crop: [62, 414, 295, 257],  kind: 'PHOTO',   title: 'Sunlit Boulevard',        caption: 'You promised to walk home before the sirens started.' },
    { id: 2, crop: [429, 71, 219, 274],  kind: 'PHOTO',   title: 'Two Faces in Sepia',      caption: 'Your sister held the camera; her name is fading first.' },
    { id: 3, crop: [720, 84, 279, 238],  kind: 'MAP',     title: 'Sector 7 Evacuation Map', caption: 'Dotted ink leads away from the neural foundry.' },
    { id: 4, crop: [1060, 85, 262, 230], kind: 'MAP',     title: 'River Crossing Grid',     caption: 'Three bridges marked safe; two were wired by noon.' },
    { id: 5, crop: [397, 422, 282, 247], kind: 'MAP',     title: 'Sublevel Upload Vault',   caption: 'Your original body was stored beneath Block C.' },
    { id: 6, crop: [738, 423, 257, 259], kind: 'MESSAGE', title: 'Folded Creased Letter',   caption: '"If they put you in steel, refuse to fire on sight."' },
    { id: 7, crop: [1062, 411, 244, 267],kind: 'MESSAGE', title: 'Last Signed Note',        caption: '"Remember who we were. Meet me past the neon line."' }
  ];

  const assets = {
    playerImg: new Image(),
    enemyImg: new Image(),
    fragImg: new Image(),
    playerClean: null,
    enemyClean: null,
    loaded: 0,
    ready: false,
    fragCanvases: []
  };

  function cleanCutoutStudioIslands(img) {
    if (!img || !img.naturalWidth) return img;
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    const id = g.getImageData(0, 0, c.width, c.height);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] === 0) continue;
      const r = d[i], gr = d[i + 1], b = d[i + 2];
      const maxC = Math.max(r, gr, b), minC = Math.min(r, gr, b);
      // Key out enclosed studio grey/white islands (#d8d8d8..#ffffff) inside arm loops
      if (minC > 192 && (maxC - minC) < 18) {
        d[i + 3] = 0;
      }
    }
    g.putImageData(id, 0, 0);
    return c;
  }

  function buildFragmentCards() {
    assets.playerClean = cleanCutoutStudioIslands(assets.playerImg);
    assets.enemyClean = cleanCutoutStudioIslands(assets.enemyImg);
    assets.fragCanvases = MEMORY_DEFS.map((m) => {
      const [sx, sy, sw, sh] = m.crop;
      const c = document.createElement('canvas');
      c.width = 240; c.height = 180;
      const g = c.getContext('2d');
      // Warm cream photographic border matching study/f_032.jpg!
      g.fillStyle = '#fff0be';
      g.fillRect(0, 0, c.width, c.height);
      if (assets.fragImg.naturalWidth > 0) {
        g.drawImage(assets.fragImg, sx + 14, sy + 14, sw - 28, sh - 28, 8, 8, c.width - 16, c.height - 16);
      }
      // Subtle warm golden sepia unify tint so every shard reads unmistakably warm against neon!
      g.fillStyle = 'rgba(255, 208, 118, 0.16)';
      g.fillRect(8, 8, c.width - 16, c.height - 16);
      return c;
    });
    assets.ready = true;
  }

  function onImgDone() {
    assets.loaded++;
    if (assets.loaded >= 3 && !assets.ready) buildFragmentCards();
  }
  assets.playerImg.onload = onImgDone;
  assets.enemyImg.onload = onImgDone;
  assets.fragImg.onload = onImgDone;
  assets.playerImg.onerror = onImgDone;
  assets.enemyImg.onerror = onImgDone;
  assets.fragImg.onerror = onImgDone;
  assets.playerImg.src = '../assets/player_robot_with_minigun.png';
  assets.enemyImg.src  = '../assets/2_enemy_robot_types.png';
  assets.fragImg.src   = '../assets/8_memory_fragments_photo_map_message.png';

  // Audio: Lyria 30s BGM + Procedural 80s Synth SFX
  const bgm = new Audio('../assets/bgm_loop.mp3');
  bgm.loop = true;
  bgm.volume = 0.34;
  let audioCtx = null;

  function ensureAudio() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      if (bgm.paused) bgm.play().catch(() => {});
    } catch (_) {}
  }

  function playSfx(kind) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.connect(g);
      g.connect(audioCtx.destination);
      if (kind === 'minigun') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(520 + rng() * 140, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.055);
        g.gain.setValueAtTime(0.065, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now); osc.stop(now + 0.065);
      } else if (kind === 'shatter') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(62, now + 0.36);
        g.gain.setValueAtTime(0.14, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
        osc.start(now); osc.stop(now + 0.40);
      } else if (kind === 'recover') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        osc.frequency.setValueAtTime(1046.5, now + 0.16);
        g.gain.setValueAtTime(0.13, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
        osc.start(now); osc.stop(now + 0.44);
      } else if (kind === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(210, now);
        osc.frequency.exponentialRampToValueAtTime(460, now + 0.12);
        g.gain.setValueAtTime(0.08, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        osc.start(now); osc.stop(now + 0.14);
      } else if (kind === 'hurt') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(48, now + 0.20);
        g.gain.setValueAtTime(0.14, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.start(now); osc.stop(now + 0.23);
      }
    } catch (_) {}
  }

  // Input State
  const keys = {};
  window.addEventListener('keydown', (e) => {
    ensureAudio();
    keys[e.code] = true;
    keys[e.key.toLowerCase()] = true;

    if (game.phase === 'title') {
      if (e.code === 'Enter' || e.code === 'Space') {
        e.preventDefault();
        game.phase = 'run';
      }
    } else if (game.phase === 'frag') {
      if (e.code === 'Enter') {
        game.phase = game.bossActive ? 'boss' : 'run';
      }
    } else if (game.phase === 'dead' || game.phase === 'album') {
      if (e.key === 'r' || e.key === 'R' || e.code === 'Enter') {
        e.preventDefault();
        resetGame();
        game.phase = 'run';
      }
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
    keys[e.key.toLowerCase()] = false;
  });

  canvas.addEventListener('pointerdown', () => {
    ensureAudio();
    if (game.phase === 'title') game.phase = 'run';
    else if (game.phase === 'dead' || game.phase === 'album') {
      resetGame();
      game.phase = 'run';
    }
  });

  // Game State Machine: 'title' | 'run' | 'frag' | 'boss' | 'dead' | 'album'
  const LEVEL_END_X = 3950;
  const game = {
    phase: AUTOSTART ? 'run' : 'title',
    camX: 0,
    bossActive: false,
    fragBannerTimer: 0,
    lastFragEvent: null,
    hudVisible: true,
    player: {
      x: 280,
      y: GROUND_Y,
      vx: 0,
      vy: 0,
      facing: 1,
      grounded: true,
      hp: 100,
      maxHp: 100,
      invuln: 0,
      fireCd: 0,
      weaponMode: 'minigun', // 'minigun' | 'disable'
      beaming: false,
      beamTarget: null,
      animTime: 0,
      muzzleTimer: 0
    },
    enemies: [],
    bullets: [],       // player minigun shots & enemy plasma shots
    shards: [],        // slow-motion warm golden photographic shards!
    intactPickups: [], // glowing intact memory photographs floating above disabled robots!
    sparks: [],
    smokePuffs: [],
    album: []          // 8 slots: 'unknown' | 'shattered' | 'recovered'
  };

  function spawnEnemies() {
    const spots = [
      { x: 760,  type: 'sentinel', memId: 0 },
      { x: 1210, type: 'sentinel', memId: 1 },
      { x: 1680, type: 'brute',    memId: 2 },
      { x: 2130, type: 'sentinel', memId: 3 },
      { x: 2560, type: 'sentinel', memId: 4 },
      { x: 2990, type: 'brute',    memId: 5 },
      { x: 3410, type: 'sentinel', memId: 6 },
      { x: 3860, type: 'boss',     memId: 7 }
    ];
    game.enemies = spots.map((s, idx) => {
      const isBoss = s.type === 'boss';
      const isBrute = s.type === 'brute' || isBoss;
      const hp = isBoss ? 150 : (isBrute ? 88 : 58);
      return {
        id: idx,
        x: s.x,
        y: GROUND_Y,
        vx: 0,
        type: s.type,
        isBoss,
        isBrute,
        memId: s.memId,
        hp,
        maxHp: hp,
        disableProg: 0,      // 0..100% precision disable progress
        state: 'active',     // 'active' | 'shattering' | 'disabled' | 'gone'
        stateTimer: 0,
        hitFlash: 0,
        shootCd: 0.9 + (idx % 3) * 0.45,
        walkPhase: idx * 1.3
      };
    });
  }

  function resetGame() {
    rng = mulberry32(SEED_INIT);
    game.phase = AUTOSTART ? 'run' : 'title';
    game.camX = 0;
    game.bossActive = false;
    game.fragBannerTimer = 0;
    game.lastFragEvent = null;

    const p = game.player;
    p.x = 280; p.y = GROUND_Y;
    p.vx = 0; p.vy = 0;
    p.facing = 1;
    p.grounded = true;
    p.hp = 100;
    p.invuln = 0;
    p.fireCd = 0;
    p.weaponMode = 'minigun';
    p.beaming = false;
    p.beamTarget = null;
    p.animTime = 0;
    p.muzzleTimer = 0;

    game.bullets = [];
    game.shards = [];
    game.intactPickups = [];
    game.sparks = [];
    game.smokePuffs = [];
    game.album = MEMORY_DEFS.map(() => 'unknown');
    spawnEnemies();
  }

  function spawnSparkBurst(wx, wy, color, count = 14, speed = 240) {
    for (let i = 0; i < count; i++) {
      const a = rng() * Math.PI * 2;
      const sp = (0.25 + rng() * 0.85) * speed;
      game.sparks.push({
        x: wx, y: wy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 25,
        len: 6 + rng() * 14,
        color,
        age: 0,
        maxLife: 0.20 + rng() * 0.25
      });
    }
  }

  function shatterEnemyIntoPhotoShards(e) {
    e.state = 'shattering';
    e.stateTimer = 0.28; // Show golden shatter sprite pose briefly (`study/f_012.jpg`), then burst!
    game.album[e.memId] = 'shattered';
    playSfx('shatter');

    const mem = MEMORY_DEFS[e.memId];
    game.lastFragEvent = {
      status: 'SHATTERED',
      memId: e.memId,
      title: mem.title,
      kind: mem.kind,
      note: 'Minigun tore this memory into unreadable shards.'
    };
    game.fragBannerTimer = 2.4;
    if (game.phase === 'run') game.phase = 'frag';

    // Spawn 34 warm golden-sepia photographic memory shards floating in slow motion! (matches sheet.jpg row 2!)
    const cols = 6, rows = 5;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const ang = (rng() - 0.5) * Math.PI * 1.9 - Math.PI * 0.45;
        const spd = 65 + rng() * 230;
        game.shards.push({
          memId: e.memId,
          u: c / cols,
          v: r / rows,
          uw: 1 / cols,
          vh: 1 / rows,
          x: e.x + (c - 2.5) * 14,
          y: e.y - 145 + (r - 2) * 20,
          vx: Math.cos(ang) * spd - 22,
          vy: Math.sin(ang) * spd - 35,
          rot: (rng() - 0.5) * 1.2,
          vrot: (rng() - 0.5) * 2.6,
          w: 28 + rng() * 20,
          h: 22 + rng() * 16,
          age: 0,
          maxLife: 5.5 + rng() * 3.0 // Lingers across frame just like sheet.jpg!
        });
      }
    }
    spawnSparkBurst(e.x, e.y - 135, '#ffe394', 28, 310);
    spawnSparkBurst(e.x, e.y - 135, '#5dff9e', 16, 260);

    if (e.isBoss) {
      setTimeout(() => { if (game.phase !== 'dead') game.phase = 'album'; }, 1500);
    }
  }

  function disableEnemyIntact(e) {
    e.state = 'disabled';
    e.stateTimer = 0;
    game.album[e.memId] = 'recovered';
    playSfx('recover');

    const mem = MEMORY_DEFS[e.memId];
    game.lastFragEvent = {
      status: 'RECOVERED',
      memId: e.memId,
      title: mem.title,
      kind: mem.kind,
      note: mem.caption
    };
    game.fragBannerTimer = 2.8;
    if (game.phase === 'run') game.phase = 'frag';

    // Release large glowing intact sepia photograph beside the powered-down robot (`study/f_032.jpg`!)
    game.intactPickups.push({
      memId: e.memId,
      x: e.x - 95,
      y: e.y - 195,
      baseY: e.y - 195,
      scale: 0.15,
      collected: false,
      age: 0
    });
    spawnSparkBurst(e.x - 60, e.y - 175, '#ffe89e', 26, 180);

    if (e.isBoss) {
      setTimeout(() => { if (game.phase !== 'dead') game.phase = 'album'; }, 1700);
    }
  }

  let clock = 0;
  function update(dt) {
    clock += dt;

    if (game.phase === 'title' || game.phase === 'dead' || game.phase === 'album') {
      // Gentle background motion on title/endings
      if (game.phase === 'title') game.camX = (game.camX + dt * 65) % 400;
      return;
    }

    // Fragment toast state transitions smoothly back to active run without freezing gameplay!
    if (game.fragBannerTimer > 0) {
      game.fragBannerTimer = Math.max(0, game.fragBannerTimer - dt);
      if (game.fragBannerTimer <= 1.5 && game.phase === 'frag') {
        game.phase = game.bossActive ? 'boss' : 'run';
      }
    }

    const p = game.player;
    if (p.invuln > 0) p.invuln = Math.max(0, p.invuln - dt);
    if (p.fireCd > 0) p.fireCd = Math.max(0, p.fireCd - dt);
    if (p.muzzleTimer > 0) p.muzzleTimer = Math.max(0, p.muzzleTimer - dt);

    // Player Movement (ArrowLeft/Right or A/D, Jump with ArrowUp/W)
    const moveL = keys['ArrowLeft'] || keys['KeyA'] || keys['a'];
    const moveR = keys['ArrowRight'] || keys['KeyD'] || keys['d'];
    const wantJump = keys['ArrowUp'] || keys['KeyW'] || keys['w'];
    const wantMini = keys['Space'] || keys['KeyJ'] || keys['j'];
    const wantBeam = keys['KeyK'] || keys['k'] || keys['ShiftLeft'] || keys['ShiftRight'] || keys[' shift'];

    const moveSpeed = wantBeam ? 235 : 320;
    if (moveR && !moveL) {
      p.vx = moveSpeed;
      p.facing = 1;
    } else if (moveL && !moveR) {
      p.vx = -moveSpeed;
      p.facing = -1;
    } else {
      p.vx *= Math.pow(0.001, dt);
      if (Math.abs(p.vx) < 6) p.vx = 0;
    }

    if (wantJump && p.grounded) {
      p.vy = -660;
      p.grounded = false;
      playSfx('jump');
    }

    p.vy += 1680 * dt;
    p.x = Math.max(game.camX + 90, Math.min(LEVEL_END_X + 180, p.x + p.vx * dt));
    p.y += p.vy * dt;
    if (p.y >= GROUND_Y) {
      p.y = GROUND_Y;
      p.vy = 0;
      p.grounded = true;
    }

    if (Math.abs(p.vx) > 15 && p.grounded) {
      p.animTime += dt * 9.5;
    } else {
      p.animTime += dt * 2.2;
    }

    // Smooth 2.5D side-on tracking camera (`p.x` sits around x = 310..380 on screen, matching f_012.jpg!)
    const targetCamX = Math.max(0, Math.min(LEVEL_END_X - W + 340, p.x - 330));
    game.camX += (targetCamX - game.camX) * Math.min(1, dt * 6.5);

    if (!game.bossActive && p.x > LEVEL_END_X - 720) {
      game.bossActive = true;
      if (game.phase === 'run') game.phase = 'boss';
    }

    // Weapon Logic: Precision Disable Beam (`K`/`Shift`) vs Rapid Neon Minigun (`Space`/`J`)
    p.beaming = false;
    p.beamTarget = null;

    if (wantBeam) {
      p.weaponMode = 'disable';
      p.beaming = true;
      // Find closest active enemy ahead within 540px beam reach
      let best = null, bestDx = 540;
      for (const e of game.enemies) {
        if (e.state !== 'active') continue;
        const dx = (e.x - p.x) * p.facing;
        const dy = Math.abs((e.y - 125) - (p.y - 125));
        if (dx > 25 && dx < bestDx && dy < 175) {
          bestDx = dx;
          best = e;
        }
      }
      p.beamTarget = best;
      if (best) {
        const rate = best.isBoss ? 46 : (best.isBrute ? 56 : 62);
        best.disableProg = Math.min(100, best.disableProg + rate * dt);
        best.hitFlash = 0.08;
        // Slow enemy advance while stunned by disable helix
        best.vx *= 0.25;
        if (rng() < 26 * dt) {
          spawnSparkBurst(best.x - 24 * p.facing, best.y - 135 + (rng() - 0.5) * 50, '#5dff9e', 2, 160);
        }
        if (best.disableProg >= 100) {
          disableEnemyIntact(best);
        }
      }
    } else if (wantMini) {
      p.weaponMode = 'minigun';
      if (p.fireCd <= 0) {
        p.fireCd = 0.082; // Blistering Contra-style minigun!
        p.muzzleTimer = 0.06;
        const spreadY = (rng() - 0.5) * 24;
        const isMagentaTracer = rng() < 0.28; // Mix electric mint + hot magenta tracers like sheet.jpg row 1!
        game.bullets.push({
          fromPlayer: true,
          x: p.x + p.facing * 88,
          y: p.y - 134 + (rng() - 0.5) * 10,
          vx: p.facing * 1080,
          vy: spreadY * 2.2,
          dmg: 14,
          color: isMagentaTracer ? '#ff4fb0' : '#5dff9e',
          len: isMagentaTracer ? 34 : 46,
          age: 0
        });
        playSfx('minigun');
      }
    }

    // Update Enemies
    for (const e of game.enemies) {
      if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);

      if (e.state === 'shattering') {
        e.stateTimer -= dt;
        if (e.stateTimer <= 0) e.state = 'gone';
        continue;
      }
      if (e.state === 'disabled') {
        e.stateTimer += dt;
        // Vent calm teal cooling smoke from powered-down robot (`study/f_032.jpg`!)
        if (rng() < 5.5 * dt) {
          game.smokePuffs.push({
            x: e.x + (rng() - 0.5) * 34,
            y: e.y - 175,
            vx: (rng() - 0.5) * 16,
            vy: -28 - rng() * 22,
            r: 10 + rng() * 10,
            age: 0,
            maxLife: 1.5 + rng() * 0.8
          });
        }
        continue;
      }
      if (e.state !== 'active') continue;

      const dist = e.x - p.x;
      if (Math.abs(dist) < 880) {
        const dir = dist > 0 ? -1 : 1;
        const stopDist = e.isBoss ? 340 : 250;
        if (Math.abs(dist) > stopDist && p.beamTarget !== e) {
          e.vx = dir * (e.isBrute ? 68 : 92);
          e.x += e.vx * dt;
          e.walkPhase += dt * 5.2;
        } else {
          e.vx = 0;
          e.walkPhase += dt * 1.8;
        }

        // Decay disable meter slightly if player stops beaming
        if (p.beamTarget !== e && e.disableProg > 0) {
          e.disableProg = Math.max(0, e.disableProg - 12 * dt);
        }

        // Fire hot-magenta plasma projectiles players can jump over!
        e.shootCd -= dt;
        if (e.shootCd <= 0 && Math.abs(dist) < 690 && p.beamTarget !== e) {
          e.shootCd = e.isBoss ? 1.15 : (e.isBrute ? 1.55 : 1.85);
          game.bullets.push({
            fromPlayer: false,
            x: e.x + dir * 64,
            y: e.y - (e.isBrute ? 112 : 128),
            vx: dir * 430,
            vy: (rng() - 0.5) * 28,
            dmg: 16,
            color: '#ff4fb0',
            len: 28,
            age: 0
          });
        }
      }
    }

    // Update Bullets & Collisions
    for (let i = game.bullets.length - 1; i >= 0; i--) {
      const b = game.bullets[i];
      b.age += dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      if (b.age > 1.6 || b.x < game.camX - 120 || b.x > game.camX + W + 160) {
        game.bullets.splice(i, 1);
        continue;
      }

      if (b.fromPlayer) {
        let hit = false;
        for (const e of game.enemies) {
          if (e.state !== 'active') continue;
          const hw = e.isBrute ? 68 : 52;
          if (Math.abs(b.x - e.x) < hw && b.y > e.y - 245 && b.y < e.y - 16) {
            e.hp -= b.dmg;
            e.hitFlash = 0.11;
            spawnSparkBurst(b.x, b.y, '#5dff9e', 9, 250);
            if (e.hp <= 0) {
              shatterEnemyIntoPhotoShards(e);
            }
            hit = true;
            break;
          }
        }
        if (hit) game.bullets.splice(i, 1);
      } else {
        // Enemy magenta plasma vs Player
        if (p.invuln <= 0 && Math.abs(b.x - p.x) < 34 && b.y > p.y - 210 && b.y < p.y - 26) {
          p.hp = Math.max(0, p.hp - b.dmg);
          p.invuln = 0.55;
          spawnSparkBurst(b.x, b.y, '#ff4fb0', 14, 240);
          playSfx('hurt');
          game.bullets.splice(i, 1);
          if (p.hp <= 0) {
            game.phase = 'dead';
          }
        }
      }
    }

    // Update Slow-Motion Golden Photo Shards! (matches sheet.jpg row 2 & 3!)
    const shardDt = dt * 0.42; // Dreamlike slow-motion drift!
    for (let i = game.shards.length - 1; i >= 0; i--) {
      const s = game.shards[i];
      s.age += dt;
      s.x += s.vx * shardDt;
      s.y += s.vy * shardDt;
      s.vy += 125 * shardDt;
      s.vx *= Math.pow(0.52, shardDt);
      s.rot += s.vrot * shardDt;
      if (s.y > GROUND_Y - 6) {
        s.y = GROUND_Y - 6;
        s.vy = -Math.abs(s.vy) * 0.25;
        s.vx *= 0.6;
        s.vrot *= 0.5;
      }
      if (s.age >= s.maxLife) game.shards.splice(i, 1);
    }

    // Update Intact Floating Memory Photographs (`study/f_032.jpg`!)
    for (const m of game.intactPickups) {
      m.age += dt;
      m.scale = Math.min(1, m.scale + dt * 2.8);
      m.y = m.baseY + Math.sin(m.age * 2.8) * 8;
      if (!m.collected && Math.abs(p.x - m.x) < 95) {
        m.collected = true;
        spawnSparkBurst(m.x, m.y, '#ffe89e', 18, 160);
        playSfx('recover');
      }
    }

    // Update Sparks & Disabled Robot Cooling Smoke
    for (let i = game.sparks.length - 1; i >= 0; i--) {
      const s = game.sparks[i];
      s.age += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (s.age >= s.maxLife) game.sparks.splice(i, 1);
    }
    for (let i = game.smokePuffs.length - 1; i >= 0; i--) {
      const sm = game.smokePuffs[i];
      sm.age += dt;
      sm.x += sm.vx * dt;
      sm.y += sm.vy * dt;
      sm.r += dt * 12;
      if (sm.age >= sm.maxLife) game.smokePuffs.splice(i, 1);
    }

    // Check if player walked past the end after clearing/passing boss
    const boss = game.enemies.find(e => e.isBoss);
    if (boss && boss.state !== 'active' && p.x > LEVEL_END_X + 60 && game.phase !== 'album') {
      game.phase = 'album';
    }
  }

  // Rendering: 1980s Neon Perspective Floor + Glossy Reflections + Cutout Sprites + Golden Shards
  function drawPerspectiveNeonFloor() {
    // Deep void black sky (#07060c / #05080a)
    ctx.fillStyle = '#06050a';
    ctx.fillRect(0, 0, W, H);

    // Subtle dark-emerald floor base (`y = HORIZON_Y..H`)
    const floorGrad = ctx.createLinearGradient(0, HORIZON_Y, 0, H);
    floorGrad.addColorStop(0, '#050b0b');
    floorGrad.addColorStop(0.55, '#071412');
    floorGrad.addColorStop(1, '#081b17');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, HORIZON_Y, W, H - HORIZON_Y);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, HORIZON_Y, W, H - HORIZON_Y);
    ctx.clip();

    // Converging perspective Z-lines scrolling horizontally with `game.camX`!
    const vanishX = W * 0.5;
    const vanishY = 265;
    const tileW = 148;
    const offset = ((game.camX * 1.18) % tileW + tileW) % tileW;

    ctx.lineWidth = 1.6;
    for (let i = -14; i <= 14; i++) {
      const bottomX = vanishX + i * tileW - offset;
      const t0 = (HORIZON_Y - vanishY) / (H - vanishY);
      const topX = vanishX + (bottomX - vanishX) * t0;

      const edgeFade = Math.max(0.12, 1 - Math.abs(i) / 14);
      ctx.strokeStyle = `rgba(93, 255, 158, ${(0.58 * edgeFade).toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(topX, HORIZON_Y);
      ctx.lineTo(bottomX, H);
      ctx.stroke();
    }

    // Horizontal perspective depth rows (denser near horizon, wider in foreground, matching f_012.jpg!)
    const rowDepths = [0.0, 0.055, 0.12, 0.20, 0.30, 0.42, 0.57, 0.76, 1.0];
    for (let r = 0; r < rowDepths.length; r++) {
      const d = rowDepths[r];
      const y = HORIZON_Y + d * (H - HORIZON_Y);
      const alpha = 0.20 + d * 0.56;
      ctx.strokeStyle = `rgba(93, 255, 158, ${alpha.toFixed(3)})`;
      ctx.lineWidth = 1.1 + d * 1.5;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSpriteFrame(img, rect, sxScreen, syBottom, targetH, flipX = false, alpha = 1, filterStr = 'none') {
    const wSrc = img && (img.naturalWidth || img.width);
    if (!wSrc) return;
    const [rx, ry, rw, rh] = rect;
    const scale = targetH / rh;
    const dw = rw * scale;
    const dh = targetH;

    ctx.save();
    ctx.globalAlpha = alpha;
    if (filterStr && filterStr !== 'none') ctx.filter = filterStr;
    ctx.translate(sxScreen, syBottom);
    if (flipX) ctx.scale(-1, 1);
    ctx.drawImage(img, rx, ry, rw, rh, -dw * 0.5, -dh, dw, dh);
    ctx.restore();
  }

  function getPlayerFrame() {
    const p = game.player;
    if (p.beaming) return PLAYER_FRAMES.rifleAim;
    if (p.muzzleTimer > 0) return PLAYER_FRAMES.rifleAim;
    if (Math.abs(p.vx) > 25) {
      const idx = Math.floor(p.animTime) % 4;
      return [PLAYER_FRAMES.miniWalkA, PLAYER_FRAMES.miniRunA, PLAYER_FRAMES.miniIdle, PLAYER_FRAMES.miniRunB][idx];
    }
    return PLAYER_FRAMES.miniIdle;
  }

  function getEnemyFrame(e) {
    if (e.state === 'shattering') {
      return e.isBrute ? ENEMY_FRAMES.bruteShatter : ENEMY_FRAMES.sentinelShatter;
    }
    if (e.state === 'disabled') {
      return e.isBrute ? ENEMY_FRAMES.bruteHit : ENEMY_FRAMES.sentinelHit;
    }
    if (e.hitFlash > 0) {
      return e.isBrute ? ENEMY_FRAMES.bruteHit : ENEMY_FRAMES.sentinelHit;
    }
    const step = Math.floor(e.walkPhase) % 2;
    if (e.isBrute) return step === 0 ? ENEMY_FRAMES.bruteWalkA : ENEMY_FRAMES.bruteWalkB;
    if (Math.abs(e.vx) > 5) return step === 0 ? ENEMY_FRAMES.sentinelWalkA : ENEMY_FRAMES.sentinelWalkB;
    return ENEMY_FRAMES.sentinelIdle;
  }

  function drawFloorReflections() {
    // Glossy 80s grid floor reflections under player, enemies, and intact memory photos!
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, HORIZON_Y, W, H - HORIZON_Y);
    ctx.clip();

    const p = game.player;
    const px = p.x - game.camX;
    const pFrame = getPlayerFrame();
    ctx.save();
    ctx.translate(px, GROUND_Y + (GROUND_Y - p.y) * 0.3);
    ctx.scale(p.facing < 0 ? -1 : 1, -0.42);
    ctx.globalAlpha = 0.18;
    const [prx, pry, prw, prh] = pFrame;
    const pScale = 248 / prh;
    const pSrc = assets.playerClean || assets.playerImg;
    const eSrc = assets.enemyClean || assets.enemyImg;
    if (pSrc && (pSrc.naturalWidth || pSrc.width)) {
      ctx.drawImage(pSrc, prx, pry, prw, prh, -(prw * pScale) * 0.5, -248, prw * pScale, 248);
    }
    ctx.restore();

    for (const e of game.enemies) {
      if (e.state === 'gone') continue;
      const ex = e.x - game.camX;
      if (ex < -180 || ex > W + 180) continue;
      const eFrame = getEnemyFrame(e);
      const eh = e.isBoss ? 320 : (e.isBrute ? 265 : 272);
      ctx.save();
      ctx.translate(ex, GROUND_Y);
      ctx.scale(-1, -0.42);
      ctx.globalAlpha = e.state === 'disabled' ? 0.11 : 0.20;
      const [erx, ery, erw, erh] = eFrame;
      const eScale = eh / erh;
      if (eSrc && (eSrc.naturalWidth || eSrc.width)) {
        ctx.drawImage(eSrc, erx, ery, erw, erh, -(erw * eScale) * 0.5, -eh, erw * eScale, eh);
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawDisableBeam() {
    const p = game.player;
    if (!p.beaming) return;

    const x0 = (p.x - game.camX) + p.facing * 72;
    const y0 = p.y - 140;
    const target = p.beamTarget;
    const x1 = target ? (target.x - game.camX - p.facing * 18) : (x0 + p.facing * 430);
    const y1 = target ? (target.y - 142) : y0;

    // Intertwined twin-helix electric-mint disable beam matching study/sheet.jpg row 3!!
    ctx.save();
    ctx.shadowColor = '#5dff9e';
    ctx.shadowBlur = 18;
    for (let strand = 0; strand < 3; strand++) {
      ctx.beginPath();
      const segs = 22;
      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const bx = x0 + (x1 - x0) * t;
        const env = Math.sin(t * Math.PI);
        const wave = Math.sin(t * 14 - clock * 26 + strand * 2.1) * (15 * env)
                   + (strand === 2 ? (rng() - 0.5) * 14 * env : 0);
        const by = y0 + (y1 - y0) * t + wave;
        if (i === 0) ctx.moveTo(bx, by);
        else ctx.lineTo(bx, by);
      }
      ctx.strokeStyle = strand === 0 ? '#ffffff' : (strand === 1 ? '#5dff9e' : 'rgba(135, 255, 215, 0.8)');
      ctx.lineWidth = strand === 0 ? 3.2 : 2.2;
      ctx.stroke();
    }

    // Electric arcs wrapping around target robot (`sheet.jpg` row 3 frame 4-5!)
    if (target) {
      const tx = target.x - game.camX;
      const ty = target.y - 140;
      const glow = ctx.createRadialGradient(tx - 18, ty, 4, tx - 18, ty, 82);
      glow.addColorStop(0, 'rgba(235, 255, 248, 0.92)');
      glow.addColorStop(0.4, 'rgba(93, 255, 158, 0.48)');
      glow.addColorStop(1, 'rgba(93, 255, 158, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(tx - 18, ty, 82, 0, Math.PI * 2);
      ctx.fill();

      // Lightning tendrils crawling over robot chassis
      ctx.strokeStyle = '#b8ffe0';
      ctx.lineWidth = 1.8;
      for (let a = 0; a < 5; a++) {
        ctx.beginPath();
        let ax = tx - 16, ay = ty;
        ctx.moveTo(ax, ay);
        for (let s = 0; s < 4; s++) {
          ax += (rng() - 0.45) * 38;
          ay += (rng() - 0.5) * 52;
          ctx.lineTo(ax, ay);
        }
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawShardsAndIntactMemories() {
    // 1. Slow-motion shattered golden-sepia photographic shards (`sheet.jpg` row 2 & 3!)
    for (const s of game.shards) {
      const sx = s.x - game.camX;
      if (sx < -80 || sx > W + 80) continue;
      const card = assets.fragCanvases[s.memId];
      const fade = Math.min(1, (s.maxLife - s.age) / 1.2);

      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(sx, s.y);
      ctx.rotate(s.rot);
      ctx.shadowColor = '#ffd275';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#fff0be';
      ctx.fillRect(-s.w * 0.5 - 2, -s.h * 0.5 - 2, s.w + 4, s.h + 4);
      ctx.shadowBlur = 0;
      if (card) {
        ctx.drawImage(
          card,
          s.u * card.width, s.v * card.height, s.uw * card.width, s.vh * card.height,
          -s.w * 0.5, -s.h * 0.5, s.w, s.h
        );
      } else {
        ctx.fillStyle = '#c89b54';
        ctx.fillRect(-s.w * 0.5, -s.h * 0.5, s.w, s.h);
      }
      ctx.restore();
    }

    // 2. Intact glowing memory photographs released by disabled robots (`study/f_032.jpg`!)
    for (const m of game.intactPickups) {
      const mx = m.x - game.camX;
      if (mx < -220 || mx > W + 220) continue;
      const card = assets.fragCanvases[m.memId];
      const pw = 216 * m.scale;
      const ph = 156 * m.scale;

      ctx.save();
      ctx.translate(mx, m.y);
      // Shimmering golden firefly halo around intact photograph (`sheet.jpg` row 4!)
      for (let i = 0; i < 24; i++) {
        const ang = (i / 24) * Math.PI * 2 + m.age * 0.7;
        const radX = pw * 0.62 + Math.sin(m.age * 3 + i) * 12;
        const radY = ph * 0.64 + Math.cos(m.age * 2.4 + i * 1.7) * 10;
        ctx.fillStyle = i % 2 === 0 ? '#ffe89c' : '#ffbe5c';
        ctx.fillRect(Math.cos(ang) * radX - 2, Math.sin(ang) * radY - 2, 3.5, 3.5);
      }

      ctx.shadowColor = '#ffd87a';
      ctx.shadowBlur = 24;
      if (card) {
        ctx.drawImage(card, -pw * 0.5, -ph * 0.5, pw, ph);
      }
      ctx.shadowBlur = 0;

      if (m.collected) {
        ctx.fillStyle = '#5dff9e';
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('✓ SAVED TO ALBUM', 0, -ph * 0.5 - 10);
      }
      ctx.restore();
    }
  }

  function drawHud() {
    if (game.phase === 'title' || game.phase === 'album') return;

    const p = game.player;
    const saved = game.album.filter(x => x === 'recovered').length;
    const lost  = game.album.filter(x => x === 'shattered').length;

    // Minimalist crisp top-left / top-right diegetic neon telemetry (keeps center clean like study frames!)
    ctx.save();
    ctx.fillStyle = 'rgba(7, 6, 12, 0.72)';
    ctx.fillRect(20, 16, 330, 52);
    ctx.strokeStyle = 'rgba(93, 255, 158, 0.45)';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(20, 16, 330, 52);

    ctx.textAlign = 'left';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillStyle = '#5dff9e';
    ctx.fillText(`CHASSIS ${Math.round(p.hp)}%`, 32, 35);
    ctx.fillStyle = p.weaponMode === 'disable' ? '#5dff9e' : '#ff4fb0';
    ctx.fillText(p.weaponMode === 'disable' ? 'MODE: [K] DISABLE BEAM' : 'MODE: [SPACE] MINIGUN', 152, 35);

    // Health bar
    ctx.fillStyle = '#1b1d28';
    ctx.fillRect(32, 44, 108, 12);
    ctx.fillStyle = p.hp < 30 ? '#ff4fb0' : '#5dff9e';
    ctx.fillRect(32, 44, Math.max(0, 108 * (p.hp / p.maxHp)), 12);

    // 8 Memory Album pips (warm gold = recovered, fractured pink = shattered, dim = ahead)
    for (let i = 0; i < 8; i++) {
      const st = game.album[i];
      const px = 154 + i * 22;
      ctx.fillStyle = st === 'recovered' ? '#ffd97d' : (st === 'shattered' ? '#ff4fb0' : '#232836');
      ctx.fillRect(px, 44, 16, 12);
      if (st === 'shattered') {
        ctx.strokeStyle = '#07060c';
        ctx.beginPath();
        ctx.moveTo(px + 2, 45);
        ctx.lineTo(px + 13, 55);
        ctx.stroke();
      }
    }

    // Top-right concise album counter
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(7, 6, 12, 0.72)';
    ctx.fillRect(W - 290, 16, 270, 38);
    ctx.strokeStyle = 'rgba(255, 224, 148, 0.4)';
    ctx.strokeRect(W - 290, 16, 270, 38);
    ctx.fillStyle = '#ffe094';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillText(`SAVED ${saved}/8 · ERASED ${lost}/8`, W - 34, 40);

    // Non-blocking Fragment readout toast when a memory is shattered or recovered (`frag` state!)
    if (game.fragBannerTimer > 0 && game.lastFragEvent) {
      const ev = game.lastFragEvent;
      const a = Math.min(1, game.fragBannerTimer * 1.4);
      ctx.globalAlpha = a;
      const bw = 540, bh = 58, bx = (W - bw) * 0.5, by = 16;
      ctx.fillStyle = 'rgba(7, 6, 12, 0.88)';
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = ev.status === 'RECOVERED' ? '#ffe094' : '#ff4fb0';
      ctx.lineWidth = 1.6;
      ctx.strokeRect(bx, by, bw, bh);

      ctx.textAlign = 'center';
      ctx.fillStyle = ev.status === 'RECOVERED' ? '#ffe094' : '#ff4fb0';
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.fillText(`MEMORY #${ev.memId + 1} ${ev.status}: ${ev.title.toUpperCase()}`, W * 0.5, by + 23);
      ctx.fillStyle = '#d7e8df';
      ctx.font = '12px "Courier New", monospace';
      ctx.fillText(ev.note, W * 0.5, by + 44);
    }
    ctx.restore();
  }

      ctx.lineWidth = 2.5;
      ctx.strokeRect(280, 200, 720, 310);

      ctx.textAlign = 'center';

      ctx.font = 'bold 48px "Courier New", monospace';
      ctx.fillText('CHASSIS OFFLINE', W * 0.5, 285);
      ctx.fillStyle = '#ffe094';
      ctx.font = '17px "Courier New", monospace';
      const saved = game.album.filter(x => x === 'recovered').length;

      ctx.textAlign = 'center';
      ctx.fillStyle = '#5dff9e';
      ctx.font = 'bold 34px "Courier New", monospace';
      ctx.fillText('MEMORY ALBUM — WHAT YOU KEPT & WHAT YOU SHOT', W * 0.5, 54);

      ctx.fillStyle = '#ffe094';
      ctx.font = '15px "Courier New", monospace';
      const summary = saved >= 5
        ? `RECOVERED ${saved}/8 · You held your fire and pieced together who you were.`
        : (lost >= 5
          ? `ERASED ${lost}/8 · You cleared the corridor fast, and forgot the face waiting for you.`
          : `RECOVERED ${saved}/8 · ERASED ${lost}/8 · Half a life remembered, half blown into gold dust.`);
      ctx.fillText(summary, W * 0.5, 84);

      // 4x2 Grid of the 8 Memory Fragments
      const startX = 92, startY = 112, cw = 256, ch = 232, gapX = 24, gapY = 24;
      for (let i = 0; i < 8; i++) {
        const col = i % 4, row = Math.floor(i / 4);
        const x = startX + col * (cw + gapX);
        const y = startY + row * (ch + gapY);
        const st = game.album[i];
        const mem = MEMORY_DEFS[i];
        const card = assets.fragCanvases[i];

        ctx.fillStyle = '#0e0d18';
        ctx.fillRect(x, y, cw, ch);
        ctx.strokeStyle = st === 'recovered' ? '#ffe094' : (st === 'shattered' ? '#ff4fb0' : '#2c3340');
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, cw, ch);

        if (st === 'recovered' && card) {
          ctx.drawImage(card, x + 18, y + 12, cw - 36, 146);
          ctx.fillStyle = '#ffe094';
          ctx.font = 'bold 13px "Courier New", monospace';
          ctx.fillText(mem.title, x + cw * 0.5, y + 178);
          ctx.fillStyle = '#c9e8d6';
          ctx.font = '11px "Courier New", monospace';
          ctx.fillText(mem.caption.slice(0, 36), x + cw * 0.5, y + 198);
          if (mem.caption.length > 36) ctx.fillText(mem.caption.slice(36, 72), x + cw * 0.5, y + 214);
        } else if (st === 'shattered') {
          // Fractured diagonal shards showing what your minigun erased
          if (card) {
            ctx.save();
            ctx.globalAlpha = 0.28;
            ctx.drawImage(card, 0, 0, 120, 90, x + 28, y + 20, 92, 68);
            ctx.drawImage(card, 120, 90, 120, 90, x + 132, y + 72, 88, 66);
            ctx.restore();
          }
          ctx.fillStyle = '#ff4fb0';
          ctx.font = 'bold 14px "Courier New", monospace';
          ctx.fillText('SHATTERED BY MINIGUN', x + cw * 0.5, y + 178);
          ctx.fillStyle = '#8b6a7e';
          ctx.font = '11px "Courier New", monospace';
          ctx.fillText(`[${mem.kind} LOST IN GOLD SHARDS]`, x + cw * 0.5, y + 202);
        } else {
          ctx.fillStyle = '#53606e';
          ctx.font = 'bold 13px "Courier New", monospace';
          ctx.fillText('UNRECOVERED', x + cw * 0.5, y + 120);
        }
      }

      ctx.fillStyle = '#5dff9e';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText('[ PRESS R OR ENTER TO RUN AGAIN ]', W * 0.5, 678);
      ctx.restore();
    }
  }

  function render() {
    // 1. Deep Void + Electric Mint Perspective Grid Floor
    drawPerspectiveNeonFloor();

    // 2. Glossy Floor Reflections
    drawFloorReflections();

    // 3. Disabled Robot Cooling Smoke
    for (const sm of game.smokePuffs) {
      const sx = sm.x - game.camX;
      const a = Math.sin((sm.age / sm.maxLife) * Math.PI) * 0.34;
      ctx.fillStyle = `rgba(110, 215, 195, ${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(sx, sm.y, sm.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 4. Enemies (flipped horizontally to face left toward the player, matching study frames!)
    for (const e of game.enemies) {
      if (e.state === 'gone') continue;
      const ex = e.x - game.camX;
      if (ex < -220 || ex > W + 220) continue;

      const frame = getEnemyFrame(e);
      const eh = e.isBoss ? 320 : (e.isBrute ? 265 : 272);
      const yOffset = e.state === 'disabled' ? 28 : 0; // Slumped powered-down posture (`f_032.jpg`)
      const filterStr = e.state === 'shattering'
        ? 'sepia(0.85) saturate(2.4) brightness(1.45)'
        : (e.hitFlash > 0 ? 'brightness(1.38) saturate(1.25)' : (e.state === 'disabled' ? 'brightness(0.62) saturate(0.75)' : 'none'));

      drawSpriteFrame(assets.enemyClean || assets.enemyImg, frame, ex, e.y + yOffset, eh, true, 1, filterStr);

      // Subtle overhead disable/integrity arc when active & engaged
      if (e.state === 'active' && (e.hp < e.maxHp || e.disableProg > 0)) {
        const bw = 74, bx = ex - bw * 0.5, by = e.y - eh - 18;
        ctx.fillStyle = 'rgba(7, 6, 12, 0.8)';
        ctx.fillRect(bx, by, bw, 6);
        if (e.disableProg > 2) {
          ctx.fillStyle = '#5dff9e';
          ctx.fillRect(bx, by, bw * (e.disableProg / 100), 6);
        } else {
          ctx.fillStyle = '#ff4fb0';
          ctx.fillRect(bx, by, bw * Math.max(0, e.hp / e.maxHp), 6);
        }
      }
    }

    // 5. Player Cybernetic Soldier
    const p = game.player;
    const px = p.x - game.camX;
    const blinkAlpha = p.invuln > 0 && Math.floor(clock * 20) % 2 === 0 ? 0.45 : 1;
    drawSpriteFrame(assets.playerClean || assets.playerImg, getPlayerFrame(), px, p.y, 248, p.facing < 0, blinkAlpha, 'none');

    // Minigun Neon Muzzle Flash (`study/f_012.jpg`!)
    if (p.muzzleTimer > 0) {
      const mx = px + p.facing * 88;
      const my = p.y - 135;
      ctx.save();
      const mg = ctx.createRadialGradient(mx, my, 3, mx, my, 46);
      mg.addColorStop(0, '#ffffff');
      mg.addColorStop(0.35, 'rgba(130, 255, 220, 0.85)');
      mg.addColorStop(1, 'rgba(93, 255, 158, 0)');
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.arc(mx, my, 46, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 6. Precision Disable Helix Beam (`K` / `Shift`)
    drawDisableBeam();

    // 7. Neon Minigun Bursts & Enemy Magenta Plasma Bolts
    ctx.save();
    for (const b of game.bullets) {
      const bx = b.x - game.camX;
      const dir = b.vx >= 0 ? 1 : -1;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 14;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = b.fromPlayer ? 5.2 : 6.0;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bx - dir * b.len, b.y);
      ctx.lineTo(bx, b.y);
      ctx.stroke();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(bx - dir * b.len * 0.55, b.y);
      ctx.lineTo(bx, b.y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.restore();

    // 8. Slow-Motion Golden Photo Shards & Intact Floating Memories!
    drawShardsAndIntactMemories();

    // 9. Neon Impact Sparks
    ctx.save();
    for (const s of game.sparks) {
      const sx = s.x - game.camX;
      const a = 1 - s.age / s.maxLife;
      ctx.globalAlpha = a;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(sx, s.y);
      ctx.lineTo(sx - s.vx * 0.032, s.y - s.vy * 0.032);
      ctx.stroke();
    }
    ctx.restore();

    // 10. Subtle Neon Vignette
    const vig = ctx.createRadialGradient(W * 0.5, H * 0.55, 320, W * 0.5, H * 0.55, 760);
    vig.addColorStop(0, 'rgba(7,6,12,0)');
    vig.addColorStop(1, 'rgba(3,2,8,0.52)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // 11. Telemetry HUD + Title / Game Over / Album Overlays
    drawHud();
    drawAlbumAndOverlays();
  }

  // Expose live state for `play.mjs`
  window.__game = {
    get state() {
      const p = game.player;
      return {
        phase: game.phase,
        camX: +game.camX.toFixed(1),
        player: {
          x: +p.x.toFixed(1),
          y: +p.y.toFixed(1),
          screenX: +(p.x - game.camX).toFixed(1),
          hp: Math.round(p.hp),
          grounded: p.grounded,
          weaponMode: p.weaponMode,
          beaming: p.beaming
        },
        enemies: game.enemies
          .filter(e => e.state === 'active' || e.state === 'disabled')
          .map(e => ({
            id: e.id,
            x: +e.x.toFixed(1),
            screenX: +(e.x - game.camX).toFixed(1),
            type: e.type,
            isBoss: e.isBoss,
            state: e.state,
            hp: Math.round(e.hp),
            disableProg: Math.round(e.disableProg),
            memId: e.memId
          })),
        incomingBullets: game.bullets
          .filter(b => !b.fromPlayer && Math.abs(b.x - p.x) < 280)
          .map(b => ({ x: +b.x.toFixed(1), y: +b.y.toFixed(1), vx: +b.vx.toFixed(1) })),
        intactPickups: game.intactPickups
          .filter(m => !m.collected)
          .map(m => ({ memId: m.memId, x: +m.x.toFixed(1) })),
        shardsCount: game.shards.length,
        savedCount: game.album.filter(x => x === 'recovered').length,
        shatteredCount: game.album.filter(x => x === 'shattered').length
      };
    }
  };

  resetGame();

  let lastTs = performance.now();
  function frame(ts) {
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<link rel="icon" href="data:," />
<title>Glitchquest</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #080514;
    color: #ffe86b;
    overflow: hidden;
    font-family: "Courier New", Courier, monospace;
    user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #080514;
  }
  canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    aspect-ratio: 16 / 9;
    display: block;
    background: #100c25;
    image-rendering: pixelated;
    box-shadow: 0 0 64px rgba(0, 0, 0, 0.92);
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script>
(() => {
  'use strict';

  const W = 1280, H = 720;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;

  const params = new URLSearchParams(window.location.search);
  const AUTOSTART = params.has('autostart');
  const INITIAL_SEED = Number.isFinite(Number(params.get('seed'))) ? (Number(params.get('seed')) >>> 0) : 7;

  let rngState = INITIAL_SEED || 7;
  function rand() {
    let t = (rngState += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  const PAL = {
    bgTop: '#0d0b23',
    bgMid: '#100c25',
    bgBot: '#171634',
    cavernFill: '#0c091e',
    gold: '#ffe86b',
    goldWarm: '#ffc93c',
    cyan: '#3cf2ff',
    cyanBright: '#9efbff',
    tealRim: '#5ef2ff',
    tealStone: '#2e889e',
    tealShadow: '#193d54',
    magenta: '#ff42b0',
    violet: '#9d4edd',
    white: '#f6fbff'
  };

  // Three hero palette swaps (Choice 0 matches Omni sheet.jpg cyan-crested runner)
  const HERO_CHOICES = [
    { id: 'runner', helmet: '#3cf2ff', crest: '#8cf8ff', suit: '#182038', suitDark: '#0e1326', trim: '#ffe86b', skin: '#f2b895', visor: '#070b17' },
    { id: 'solar',  helmet: '#ffe86b', crest: '#fff5ad', suit: '#2b1954', suitDark: '#190d36', trim: '#3cf2ff', skin: '#f2b895', visor: '#0b071a' },
    { id: 'rogue',  helmet: '#ff47b6', crest: '#ff9ad5', suit: '#122f44', suitDark: '#0a1c2b', trim: '#ffe86b', skin: '#e8ad8c', visor: '#07111c' }
  ];

  // Load & alpha-sanitize Nano Banana 3-universe tileset on offscreen canvas
  let tilesSource = null;
  let tilesReady = false;
  const rawTilesImg = new Image();
  rawTilesImg.onload = () => {
    try {
      const oc = document.createElement('canvas');
      oc.width = rawTilesImg.naturalWidth;
      oc.height = rawTilesImg.naturalHeight;
      const octx = oc.getContext('2d');
      octx.drawImage(rawTilesImg, 0, 0);
      const imgData = octx.getImageData(0, 0, oc.width, oc.height);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const a = d[i + 3];
        if (a === 0) continue;
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        const lum = (r + g + b) / 3;
        if ((mx - mn) < 20 && lum > 152 && lum < 232) {
          d[i + 3] = 0;
        }
      }
      octx.putImageData(imgData, 0, 0);
      tilesSource = oc;
    } catch (_) {
      tilesSource = rawTilesImg;
    }
    tilesReady = true;
  };
  rawTilesImg.onerror = () => { tilesReady = true; };
  rawTilesImg.src = '../assets/3_universe_tile_sets.png';

  // Exact verified pixel rects inside 3_universe_tile_sets.png (1024x1024)
  const ATLAS = {
    u1WallBrick: { x: 808, y: 41,  w: 83,  h: 87 },
    u1Ledge1:    { x: 516, y: 40,  w: 283, h: 88 },
    u1Ledge2:    { x: 516, y: 139, w: 283, h: 85 },
    u1CornerTR:  { x: 420, y: 40,  w: 88,  h: 88 },
    u1CornerBR:  { x: 420, y: 140, w: 88,  h: 91 },
    u1CornerBL:  { x: 40,  y: 240, w: 177, h: 89 },
    u1Rubble:    { x: 321, y: 279, w: 187, h: 50 },
    u1Spikes:    { x: 516, y: 253, w: 283, h: 75 },
    u1BeaconC:   { x: 843, y: 141, w: 26,  h: 87 },
    u1BeaconG:   { x: 932, y: 141, w: 26,  h: 87 },

    u2PhaseBlk:  { x: 127, y: 413, w: 91,  h: 44 },
    u2PhaseBlk2: { x: 224, y: 464, w: 91,  h: 45 },
    u2LedgeSml:  { x: 228, y: 364, w: 85,  h: 32 },
    u2StarRock1: { x: 336, y: 375, w: 70,  h: 61 },
    u2StarRock2: { x: 432, y: 392, w: 61,  h: 70 },
    u2ConstTL:   { x: 516, y: 366, w: 90,  h: 93 },
    u2ConstTR:   { x: 707, y: 366, w: 91,  h: 93 },
    u2Meteor1:   { x: 612, y: 566, w: 90,  h: 91 },
    u2Meteor2:   { x: 708, y: 566, w: 90,  h: 91 },

    u3Invader:   { x: 41,  y: 696, w: 172, h: 287 },
    u3Terminal:  { x: 226, y: 696, w: 184, h: 187 },
    u3GoldBox:   { x: 420, y: 696, w: 87,  h: 87 },
    u3Ledge:     { x: 226, y: 947, w: 184, h: 36 },
    u3Fire1:     { x: 613, y: 796, w: 87,  h: 87 },
    u3Fire2:     { x: 709, y: 796, w: 87,  h: 87 },
    u3Circuit1:  { x: 806, y: 796, w: 86,  h: 87 },
    u3Circuit2:  { x: 709, y: 896, w: 87,  h: 87 }
  };

  // Audio: Lyria 30s BGM loop + tactile chiptune/glitch WebAudio synth
  const bgm = new Audio('../assets/bgm_loop.mp3');
  bgm.loop = true;
  bgm.volume = 0.40;
  let audioUnlocked = false;
  let audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        try { audioCtx = new AC(); } catch (_) {}
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    if (!audioUnlocked) {
      audioUnlocked = true;
      bgm.play().catch(() => {});
    }
  }

  function playSfx(kind) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g).connect(audioCtx.destination);

    if (kind === 'jump') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(250, now);
      osc.frequency.exponentialRampToValueAtTime(640, now + 0.11);
      g.gain.setValueAtTime(0.07, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now); osc.stop(now + 0.13);
    } else if (kind === 'probe') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
      g.gain.setValueAtTime(0.09, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.start(now); osc.stop(now + 0.10);
    } else if (kind === 'dissolve') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(540, now);
      osc.frequency.setValueAtTime(310, now + 0.05);
      osc.frequency.linearRampToValueAtTime(95, now + 0.24);
      g.gain.setValueAtTime(0.11, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
      osc.start(now); osc.stop(now + 0.27);
    } else if (kind === 'lie') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(210, now);
      osc.frequency.setValueAtTime(140, now + 0.08);
      osc.frequency.linearRampToValueAtTime(68, now + 0.30);
      g.gain.setValueAtTime(0.12, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      osc.start(now); osc.stop(now + 0.33);
    } else if (kind === 'warp') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(330, now);
      osc.frequency.setValueAtTime(495, now + 0.06);
      osc.frequency.setValueAtTime(660, now + 0.12);
      osc.frequency.exponentialRampToValueAtTime(1040, now + 0.28);
      g.gain.setValueAtTime(0.10, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.30);
      osc.start(now); osc.stop(now + 0.31);
    } else if (kind === 'shatter') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(720, now);
      osc.frequency.setValueAtTime(440, now + 0.06);
      osc.frequency.setValueAtTime(880, now + 0.12);
      osc.frequency.exponentialRampToValueAtTime(160, now + 0.36);
      g.gain.setValueAtTime(0.13, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
      osc.start(now); osc.stop(now + 0.39);
    } else if (kind === 'win') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(554.37, now + 0.09);
      osc.frequency.setValueAtTime(659.25, now + 0.18);
      osc.frequency.setValueAtTime(880, now + 0.27);
      g.gain.setValueAtTime(0.14, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
      osc.start(now); osc.stop(now + 0.66);
    }
  }

  // =========================================================================
  // DIEGETIC WORLD DEFINITIONS (Zero HUD banners — the world's signs ARE UI)
  // Learnable rule:
  //   FLICKERING GOLD (#ffe86b, chromatic scanline jitter) -> ALWAYS A LIE
  //   STEADY CYAN (#3cf2ff, crisp calm glow)               -> ALWAYS TRUE
  // =========================================================================
  function buildUniverses() {
    return [
      // UNIVERSE 0: Brick Cavern (Matches sheet.jpg f_001..f_023 & pair_002/pair_005!)
      // Right-hand hanging GOLD "STAGE CLEAR ↓" lures into shimmering cellular pit.
      // Probing the pit shatters the illusion into static & reveals ascending-LEFT solid CYAN phase blocks!
      {
        id: 0,
        theme: 'brick',
        worldW: 1760,
        spawn: { x: 495, y: 473 },
        initCamX: 460,
        cosmicBleed: 0,
        platforms: [
          // Lower-left entry floor (with rubble) stepping up onto main cavern ledge
          { x: 390,  y: 565, w: 300, h: 155, kind: 'cavern', rubble: true },
          // Decorative upper-left cavern ledges matching f_005.jpg!
          { x: 420,  y: 222, w: 178, h: 52,  kind: 'u1Ledge1', decoOnly: true },
          { x: 545,  y: 332, w: 178, h: 50,  kind: 'u1Ledge2', decoOnly: true },
          // Main central cavern platform leading to the deceptive pit rim
          { x: 685,  y: 465, w: 335, h: 255, kind: 'cavern' },
          // Far-right cavern wall framing the pit
          { x: 1385, y: 465, w: 375, h: 255, kind: 'cavern' },
          // Overhead brick ceiling overhang framing the hanging STAGE CLEAR sign (f_005.jpg!)
          { x: 1100, y: 0,   w: 465, h: 144, kind: 'ceiling' },
          { x: 1510, y: 144, w: 250, h: 152, kind: 'ceiling' },
          // Hidden solid CYAN phase staircase ascending UP-AND-LEFT when lie is tested (pair_005.00.jpg!)
          { x: 615,  y: 365, w: 118, h: 48,  kind: 'phase', revealOnTest: true, revealed: false },
          { x: 475,  y: 276, w: 118, h: 48,  kind: 'phase', revealOnTest: true, revealed: false },
          { x: 340,  y: 190, w: 118, h: 48,  kind: 'phase', revealOnTest: true, revealed: false },
          // Upper-left Rift Ledge (revealed/reached by climbing the cyan phase staircase)
          { x: 125,  y: 182, w: 195, h: 48,  kind: 'ornateLedge', revealOnTest: true, revealed: false }
        ],
        trusses: [
          { x: 1556, y: 296, w: 46, h: 169 }
        ],
        fakeFloors: [
          {
            x: 1020, y: 515, w: 365, h: 155,
            basinY: 662,
            style: 'pool',
            dissolved: false, dissolveAnim: 0,
            probeMinX: 900, probeMaxX: 1030,
            brinkDwell: 0
          }
        ],
        spikes: [],
        signs: [
          { x: 1205, y: 222, text: 'STAGE CLEAR', arrow: 'down', isLie: true, mountY: 144, glitchBurst: 0 }
        ],
        checkpoint: { x: 720, y: 373 },
        exit: { x: 235, y: 182, dir: -1 }
      },

      // UNIVERSE 1: Cosmic Constellation Vectors (Matches sheet.jpg f_024..f_036 & pair_008.00.jpg!)
      // Opens on the ornate diamond-medallion left temple ledge.
      // Flickering GOLD "SAFE BRIDGE >" spans the upper gap; probing dissolves it into cosmic sparks,
      // exposing the open star-canyon, 4 diagonal CYAN phase blocks, and steady warp arrow!
      {
        id: 1,
        theme: 'cosmic',
        worldW: 1460,
        spawn: { x: 56, y: 148 },
        initCamX: 0,
        cosmicBleed: 1,
        platforms: [
          // Left ornate cyan-diamond & gold-scrollwork temple ledge (exact pair_008.00.jpg left!)
          { x: 0,    y: 240, w: 232, h: 315, kind: 'ornateTemple' },
          // Four diagonal solid CYAN phase blocks stepping down-right across the constellation void!
          { x: 196,  y: 336, w: 108, h: 46,  kind: 'phase' },
          { x: 298,  y: 428, w: 108, h: 46,  kind: 'phase' },
          { x: 400,  y: 520, w: 108, h: 46,  kind: 'phase' },
          { x: 502,  y: 612, w: 108, h: 46,  kind: 'phase' },
          // Upper-right thin cosmic ledge framing the right side of pair_008.00.jpg
          { x: 518,  y: 242, w: 185, h: 28,  kind: 'u2ThinLedge' },
          // Lower-right cosmic landing platform holding the Universe 2->3 Scanline Rift
          { x: 642,  y: 530, w: 818, h: 190, kind: 'cavern' }
        ],
        trusses: [],
        fakeFloors: [
          {
            x: 232, y: 242, w: 286, h: 28,
            style: 'bridge',
            dissolved: false, dissolveAnim: 0,
            probeMinX: 125, probeMaxX: 240,
            brinkDwell: 0
          }
        ],
        spikes: [],
        signs: [
          { x: 375, y: 185, text: 'SAFE BRIDGE >', arrow: 'right', isLie: true, hideWhenDissolved: true, glitchBurst: 0 },
          { x: 432, y: 126, text: '', arrow: 'warp-chevron', isLie: false }
        ],
        checkpoint: { x: 56, y: 148 },
        exit: { x: 705, y: 530, dir: 1 }
      },

      // UNIVERSE 2: Invader Mainframe (Band 3 Space-Invader monoliths, circuits & cyber-flames!)
      {
        id: 2,
        theme: 'cyber',
        worldW: 1280,
        spawn: { x: 95, y: 388 },
        initCamX: 0,
        cosmicBleed: 0,
        platforms: [
          { x: 0,   y: 480, w: 345, h: 240, kind: 'cyber' },
          // Steady CYAN phase pads arcing cleanly over the cyber-flame core
          { x: 395, y: 378, w: 142, h: 44,  kind: 'phase' },
          { x: 610, y: 325, w: 142, h: 44,  kind: 'phase' },
          { x: 805, y: 428, w: 475, h: 292, kind: 'cyber' }
        ],
        trusses: [],
        fakeFloors: [
          {
            x: 345, y: 484, w: 460, h: 34,
            style: 'cyberBridge',
            dissolved: false, dissolveAnim: 0,
            probeMinX: 245, probeMaxX: 355,
            brinkDwell: 0
          }
        ],
        spikes: [
          { x: 355, y: 626, w: 440, h: 94, isFire: true }
        ],
        signs: [
          { x: 575, y: 556, text: 'SHORTCUT >', arrow: 'down', isLie: true, glitchBurst: 0 },
          { x: 465, y: 268, text: 'OVER CORE >', arrow: 'up-right', isLie: false }
        ],
        checkpoint: { x: 95, y: 388 },
        exit: { x: 925, y: 428, dir: 1 }
      }
    ];
  }

  // FINAL BOSS ('last'): Giant Possessed "[ QUIT ]" UI Button IS the physical platform!
  function buildLastStage() {
    return {
      id: 3,
      theme: 'boss',
      worldW: 1280,
      spawn: { x: 430, y: 343 },
      initCamX: 0,
      buttonShattered: false,
      shatterAnim: 0,
      cursorTimer: 0.4,
      cursorPress: 0,
      quitBtn: { x: 265, y: 435, w: 515, h: 116 },
      platforms: [
        // The giant possessed "[ QUIT ]" button itself as solid 2D platform geometry!
        { x: 265, y: 435, w: 515, h: 116, kind: 'quitButton', id: 'quitBody' },
        // Fractured right bevel ramp on the edge of the UI button
        { x: 732, y: 423, w: 48,  h: 17,  kind: 'quitLip',    id: 'quitLip' },
        // Hidden outside-the-frame CYAN phase bridge & Ornate Victory Ledge (materialize when jumping OFF the button!)
        { x: 825, y: 416, w: 116, h: 44,  kind: 'phase',        revealOnBreak: true, revealed: false },
        { x: 975, y: 392, w: 305, h: 328, kind: 'ornateTemple', revealOnBreak: true, revealed: false }
      ],
      fakeFloors: [],
      spikes: [],
      signs: [
        { x: 522, y: 120, text: 'PRESS [Q] TO QUIT', arrow: 'down-short', isLie: true, glitchBurst: 0 },
        { x: 858, y: 328, text: 'WALK OFF >', arrow: 'right', isLie: false }
      ],
      checkpoint: { x: 430, y: 343 },
      exit: { x: 1095, y: 392, dir: 1 }
    };
  }

  let universes = buildUniverses();
  let lastStage = buildLastStage();

  // Deterministic background stars, 4-point sparkles & constellation nodes
  const STARS = Array.from({ length: 84 }, () => ({
    x: rand() * 1800,
    y: 24 + rand() * 640,
    r: rand() > 0.7 ? 3 : 2,
    phase: rand() * Math.PI * 2,
    col: rand() > 0.32 ? PAL.cyan : (rand() > 0.5 ? PAL.gold : PAL.white),
    sparkle: rand() > 0.86
  }));

  const CONSTELLATIONS = [
    // Polygonal star clusters matching f_027 / pair_008.00.jpg!
    { pts: [[820, 120], [935, 145], [912, 255], [795, 248], [820, 120]] },
    { pts: [[180, 440], [265, 390], [325, 480], [230, 545], [180, 440]] },
    { pts: [[560, 430], [645, 365], [720, 465], [610, 515]] },
    { pts: [[60,  115], [150, 138], [195, 92]] },
    { pts: [[980, 360], [1085, 310], [1155, 395], [1050, 445], [980, 360]] }
  ];

  const RADIAL_STREAKS = Array.from({ length: 34 }, (_, i) => ({
    ang: (i / 34) * Math.PI * 2 + (rand() - 0.5) * 0.14,
    r1: 85 + rand() * 145,
    len: 55 + rand() * 135,
    col: i % 4 === 0 ? PAL.magenta : (i % 3 === 0 ? PAL.gold : PAL.cyan),
    starEnd: i % 5 === 0
  }));

  // Input state
  const keys = Object.create(null);
  const justPressed = Object.create(null);

  window.addEventListener('keydown', (e) => {
    ensureAudio();
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
      e.preventDefault();
    }
    if (!keys[e.code]) justPressed[e.code] = true;
    keys[e.code] = true;
  }, { passive: false });

  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });

  window.addEventListener('pointerdown', (e) => {
    ensureAudio();
    const rect = canvas.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * W;
    const my = ((e.clientY - rect.top) / rect.height) * H;

    if (gameState === 'title') {
      gameState = 'pick';
      playSfx('probe');
      return;
    }
    if (gameState === 'pick') {
      for (let i = 0; i < 3; i++) {
        const px = W / 2 + (i - 1) * 250;
        if (Math.abs(mx - px) < 105 && Math.abs(my - 360) < 130) {
          heroChoice = i;
          beginUniverse(0, false);
          return;
        }
      }
      beginUniverse(0, false);
      return;
    }
    if (paused) {
      paused = false;
      return;
    }
    if (gameState === 'last' && !lastStage.buttonShattered) {
      const qb = lastStage.quitBtn;
      if (mx >= qb.x && mx <= qb.x + qb.w && my >= qb.y && my <= qb.y + qb.h) {
        triggerLie(qb.x + qb.w / 2, qb.y);
        return;
      }
    }
    if (gameState === 'world') {
      // Spatial click on a deceptive floor or sign triggers a probe pulse when near!
      const stage = getActiveStage();
      const wx = mx + camX;
      const clickedFake = (stage.fakeFloors || []).some(f => wx >= f.x - 60 && wx <= f.x + f.w + 60 && my >= f.y - 120);
      if (clickedFake) justPressed['KeyE'] = true;
    }
    if (gameState === 'end') {
      restartFullGame();
    }
  });

  // Core State Machine ('title' | 'pick' | 'world' | 'lie' | 'last' | 'end')
  let gameState = AUTOSTART ? 'world' : 'title';
  let paused = false;
  let heroChoice = 0;
  let universeIdx = 0;
  let totalTime = 0;
  let stateTimer = 0;
  let hitStop = 0;
  let liesTriggered = 0;
  let testsPerformed = 0;

  // Scanline World-Warp state (visceral horizontal tear instead of black cuts!)
  let warpEffect = { active: false, t: 0, dur: 0.48 };
  let warpSnapshot = null;
  const snapCanvas = document.createElement('canvas');
  snapCanvas.width = W;
  snapCanvas.height = H;
  const snapCtx = snapCanvas.getContext('2d');

  function captureWarpTransition() {
    try {
      snapCtx.drawImage(canvas, 0, 0);
      warpSnapshot = snapCanvas;
      warpEffect.active = true;
      warpEffect.t = 0;
    } catch (_) {}
  }

  const player = {
    x: 505, y: 473,
    vx: 0, vy: 0,
    w: 44, h: 92,
    facing: 1,
    onGround: false,
    coyote: 0,
    animTime: 0,
    scaleX: 1,
    scaleY: 1,
    probePulse: 0,
    returnToLast: false
  };

  let camX = 460;
  let glitchFlash = 0;
  let staticPixels = [];
  let starTrail = [];
  let fireworks = [];
  let starCoins = [];
  let deathTraces = []; // Law 9: visible world trace where a lie killed you

  function spawnStaticBurst(x, y, w, h, count = 48, heavy = false) {
    for (let i = 0; i < count; i++) {
      const pick = rand();
      const color = pick < 0.52 ? PAL.cyan : (pick < 0.80 ? PAL.magenta : PAL.gold);
      const kindRoll = rand();
      staticPixels.push({
        x: x + rand() * w,
        y: y + rand() * Math.min(h, 95),
        vx: (rand() - 0.5) * (heavy ? 320 : 170),
        vy: heavy ? (-240 + rand() * 340) : (-90 + rand() * 220),
        grav: heavy ? 520 : 190,
        size: heavy ? (7 + Math.floor(rand() * 11)) : (6 + Math.floor(rand() * 9)),
        life: 0.65 + rand() * 0.85,
        maxLife: 1.5,
        color,
        hollow: kindRoll > 0.52,
        crossBox: kindRoll > 0.78 // [X] debug wireframe box from f_014.jpg!
      });
    }
  }

  function spawnStarSparkle(x, y, burst = 1) {
    for (let i = 0; i < burst; i++) {
      starTrail.push({
        x: x + (rand() - 0.5) * 20,
        y: y + (rand() - 0.5) * 20,
        vx: -player.vx * 0.22 + (rand() - 0.5) * 55,
        vy: 18 + (rand() - 0.5) * 55,
        life: 0.42 + rand() * 0.34,
        maxLife: 0.76,
        big: rand() > 0.55,
        col: rand() > 0.22 ? PAL.cyan : PAL.gold
      });
    }
  }

  function spawnOmniFirework(x, y, prefCol) {
    const palette = [PAL.magenta, PAL.cyan, PAL.gold];
    const mainCol = prefCol || palette[Math.floor(rand() * palette.length)];
    const rays = 32;
    for (let i = 0; i < rays; i++) {
      const ang = (i / rays) * Math.PI * 2 + (rand() - 0.5) * 0.05;
      const spd = 135 + (i % 2) * 42 + rand() * 30;
      fireworks.push({
        x, y,
        ox: x, oy: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 0.95 + rand() * 0.35,
        maxLife: 1.3,
        color: i % 5 === 0 ? PAL.white : mainCol
      });
    }
  }

  function spawnVictoryCoins() {
    starCoins = [];
    for (let i = 0; i < 8; i++) {
      starCoins.push({
        x: W * 0.34 + i * 62 + (rand() - 0.5) * 24,
        y: H * 0.26 + (rand() - 0.5) * 90,
        vy: -60 - rand() * 80,
        phase: rand() * Math.PI * 2
      });
    }
  }

  function getActiveStage() {
    return gameState === 'last' || (gameState === 'end') ? lastStage : universes[universeIdx];
  }

  function beginUniverse(idx, withWarp = true) {
    if (withWarp) captureWarpTransition();
    universeIdx = idx;
    const u = universes[idx];
    player.x = u.spawn.x;
    player.y = u.spawn.y;
    player.vx = 0;
    player.vy = 0;
    player.facing = 1;
    player.onGround = false;
    player.scaleX = 1.22;
    player.scaleY = 0.80;
    camX = u.initCamX;
    gameState = 'world';
    glitchFlash = withWarp ? 0.65 : 0.25;
    if (withWarp) playSfx('warp');
  }

  function beginLastStage(withWarp = true) {
    if (withWarp) captureWarpTransition();
    lastStage = buildLastStage();
    player.x = lastStage.spawn.x;
    player.y = lastStage.spawn.y;
    player.vx = 0;
    player.vy = 0;
    player.facing = 1;
    player.onGround = false;
    camX = 0;
    gameState = 'last';
    glitchFlash = 0.75;
    if (withWarp) playSfx('warp');
  }

  function restartFullGame() {
    universes = buildUniverses();
    lastStage = buildLastStage();
    liesTriggered = 0;
    testsPerformed = 0;
    fireworks = [];
    starCoins = [];
    deathTraces = [];
    paused = false;
    beginUniverse(0, true);
  }

  if (AUTOSTART) {
    beginUniverse(0, false);
  }

  function triggerLie(traceX, traceY) {
    liesTriggered++;
    playSfx('lie');
    hitStop = 0.05;
    glitchFlash = 0.95;
    const tx = traceX ?? (player.x + player.w / 2);
    const ty = traceY ?? (player.y + player.h / 2);
    deathTraces.push({ x: tx, y: Math.min(H - 48, ty), universe: gameState === 'last' ? 3 : universeIdx });
    spawnStaticBurst(player.x - 16, Math.min(H - 90, player.y), 70, 70, 40, true);
    player.returnToLast = (gameState === 'last');
    gameState = 'lie';
    stateTimer = 0.55;
  }

  function dissolveFakeFloor(ff, stage) {
    if (ff.dissolved) return;
    ff.dissolved = true;
    ff.dissolveAnim = 1.0;
    testsPerformed++;
    hitStop = 0.04;
    glitchFlash = 0.55;
    player.probePulse = 1.0;
    playSfx('dissolve');
    spawnStaticBurst(ff.x + 8, ff.y, ff.w - 16, Math.max(48, ff.h), ff.style === 'pool' ? 92 : 54, false);

    // Violently scanline-tear nearby lying gold signs (matching f_014.jpg!)
    if (stage.signs) {
      for (const s of stage.signs) {
        if (s.isLie) s.glitchBurst = s.hideWhenDissolved ? 0.45 : 1.15;
      }
    }

    // Reveal hidden true cyan phase blocks & true signs + open cosmic bleed in Universe 0!
    for (const p of stage.platforms) {
      if (p.revealOnTest && !p.revealed) {
        p.revealed = true;
        spawnStaticBurst(p.x - 6, p.y - 6, p.w + 12, p.h + 12, 18, false);
      }
    }
    if (stage.signs) {
      for (const s of stage.signs) {
        if (s.revealOnTest) s.revealed = true;
      }
    }
  }

  function shatterQuitButton() {
    if (lastStage.buttonShattered) return;
    lastStage.buttonShattered = true;
    lastStage.shatterAnim = 1.0;
    testsPerformed++;
    hitStop = 0.055;
    glitchFlash = 0.95;
    playSfx('shatter');
    const qb = lastStage.quitBtn;
    spawnStaticBurst(qb.x, qb.y - 10, qb.w, qb.h + 20, 125, true);
    for (const p of lastStage.platforms) {
      if (p.revealOnBreak) {
        p.revealed = true;
        spawnStaticBurst(p.x, p.y, p.w, 36, 22, false);
      }
    }
    for (const s of lastStage.signs) {
      if (s.isLie) s.glitchBurst = 2.0;
    }
  }

  function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function getActiveSolids(stage) {
    return stage.platforms.filter(p => {
      if (p.decoOnly) return false;
      if (p.revealOnTest && !p.revealed) return false;
      if (p.revealOnBreak && !p.revealed) return false;
      if ((p.id === 'quitBody' || p.id === 'quitLip') && stage.buttonShattered) return false;
      return true;
    });
  }

  function updateGameplay(dt) {
    const stage = getActiveStage();
    const isLast = (gameState === 'last');

    if (justPressed['KeyR']) {
      if (isLast) beginLastStage(true);
      else beginUniverse(universeIdx, true);
      return;
    }

    const moveLeft = keys['ArrowLeft'] || keys['KeyA'];
    const moveRight = keys['ArrowRight'] || keys['KeyD'];
    const jumpPressed = justPressed['Space'] || justPressed['ArrowUp'] || justPressed['KeyW'] || justPressed['KeyZ'];
    const testPressed = justPressed['KeyE'] || justPressed['ArrowDown'] || justPressed['KeyS'];

    if (justPressed['Digit1']) heroChoice = 0;
    if (justPressed['Digit2']) heroChoice = 1;
    if (justPressed['Digit3']) heroChoice = 2;

    // Possessed QUIT stage: obeying [Q] or standing idle under the cursor slam triggers the lie!
    if (isLast && !lastStage.buttonShattered) {
      if (justPressed['KeyQ']) {
        triggerLie(player.x + 19, player.y + 34);
        return;
      }
      lastStage.cursorTimer += dt;
      const cyc = lastStage.cursorTimer % 2.4;
      lastStage.cursorPress = cyc > 2.05 ? Math.sin(((cyc - 2.05) / 0.35) * Math.PI) : 0;
      if (cyc > 2.18 && Math.abs(player.vx) < 15 && player.x > 360 && player.x < 640 && player.onGround) {
        triggerLie(player.x + 19, player.y + 34);
        return;
      }
    }

    if (player.coyote > 0) player.coyote -= dt;
    if (player.probePulse > 0) player.probePulse = Math.max(0, player.probePulse - dt * 2.6);
    player.scaleX += (1 - player.scaleX) * Math.min(1, dt * 14);
    player.scaleY += (1 - player.scaleY) * Math.min(1, dt * 14);

    // Horizontal arcade movement
    const maxSpd = 340;
    const accel = player.onGround ? 2850 : 1950;
    const dir = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0);
    if (dir !== 0) {
      player.facing = dir;
      player.vx += dir * accel * dt;
      if (Math.abs(player.vx) > maxSpd) player.vx = dir * maxSpd;
    } else {
      const drag = player.onGround ? 2650 : 950;
      if (Math.abs(player.vx) <= drag * dt) player.vx = 0;
      else player.vx -= Math.sign(player.vx) * drag * dt;
    }

    // Jump
    if (jumpPressed && (player.onGround || player.coyote > 0)) {
      player.vy = -735;
      player.onGround = false;
      player.coyote = 0;
      player.scaleX = 0.84;
      player.scaleY = 1.18;
      playSfx('jump');
      spawnStarSparkle(player.x + player.w / 2, player.y + player.h - 6, stage.theme === 'cosmic' ? 14 : 6);
    }

    player.vy = Math.min(980, player.vy + 1750 * dt);

    // Probing / Testing deceptive floors!
    // Explicit probe ([E]/[Down]) OR cautious pause at brink (1.25s) exposes the lie safely.
    // Blindly leaping/sprinting onto an unprobed fake floor collapses it beneath your boots!
    if (!isLast && stage.fakeFloors) {
      if (testPressed) {
        player.probePulse = 1.0;
        playSfx('probe');
      }
      for (const ff of stage.fakeFloors) {
        if (!ff.dissolved) {
          const pxCenter = player.x + player.w / 2;
          const inProbeZone = (player.x + player.w >= ff.probeMinX && player.x <= ff.probeMaxX + 28);
          if (inProbeZone && player.onGround && Math.abs(player.vx) < 35) {
            ff.brinkDwell += dt;
          } else {
            ff.brinkDwell = Math.max(0, ff.brinkDwell - dt * 2);
          }

          if (inProbeZone && (testPressed || ff.brinkDwell >= 1.25)) {
            dissolveFakeFloor(ff, stage);
          } else if (pxCenter > ff.x + 24 && pxCenter < ff.x + ff.w - 18 && player.y + player.h >= ff.y - 6) {
            // Stepped/leaped blindly onto the gold-signed illusion!
            dissolveFakeFloor(ff, stage);
          }
        } else if (ff.dissolveAnim > 0) {
          ff.dissolveAnim = Math.max(0, ff.dissolveAnim - dt * 1.4);
        }
      }
    }

    // Universe 0 cosmic rift bleed ramps smoothly once pit lie is exposed (matching pair_005.00.jpg!)
    if (!isLast && stage.id === 0 && stage.fakeFloors[0]?.dissolved) {
      stage.cosmicBleed = Math.min(1, stage.cosmicBleed + dt * 0.62);
    }

    const solids = getActiveSolids(stage);
    const prevY = player.y;
    const wasOnGround = player.onGround;

    // Move & Collide X (ignore oneWay ledges horizontally + 18px arcade shin/ledge-mantle assist!)
    player.x += player.vx * dt;
    if (player.x < 8) { player.x = 8; player.vx = 0; }
    if (player.x + player.w > stage.worldW - 8) { player.x = stage.worldW - 8 - player.w; player.vx = 0; }

    for (const p of solids) {
      if (p.oneWay) continue;
      if (aabb(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
        const shinDiff = (player.y + player.h) - p.y;
        if (shinDiff > 0 && shinDiff <= 18 && player.vy >= -220) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
        } else {
          if (player.vx > 0) { player.x = p.x - player.w; player.vx = 0; }
          else if (player.vx < 0) { player.x = p.x + p.w; player.vx = 0; }
        }
      }
    }

    // Move & Collide Y
    player.onGround = false;
    player.y += player.vy * dt;
    for (const p of solids) {
      if (p.oneWay) {
        if (player.vy >= 0 && prevY + player.h <= p.y + 12 && aabb(player.x, player.y, player.w, player.h, p.x, p.y, p.w, 16)) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
          player.coyote = 0.12;
        }
        continue;
      }
      if (aabb(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
        if (player.vy >= 0) {
          if (!wasOnGround && player.vy > 220) {
            player.scaleX = 1.18;
            player.scaleY = 0.84;
          }
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
          player.coyote = 0.12;
        } else {
          player.y = p.y + p.h;
          player.vy = 0;
        }
      }
    }

    // Star-sparkle motion trail (lush in cosmic/airborne jumps like pair_008.00.jpg!)
    if (!player.onGround && (Math.abs(player.vx) > 40 || Math.abs(player.vy) > 60)) {
      if (rand() < (stage.theme === 'cosmic' || isLast ? 0.96 : 0.48)) {
        spawnStarSparkle(player.x + player.w / 2 - player.facing * 12, player.y + player.h - 14, stage.theme === 'cosmic' ? 4 : 1);
      }
    } else if (player.onGround && Math.abs(player.vx) > 90 && rand() < 0.38) {
      spawnStarSparkle(player.x + player.w / 2 - player.facing * 14, player.y + player.h - 4, 1);
    }

    if (player.onGround && Math.abs(player.vx) > 25) {
      player.animTime += dt * 12.5;
    } else {
      player.animTime += dt * 3.0;
    }

    // Decay sign glitch bursts
    if (stage.signs) {
      for (const s of stage.signs) {
        if (s.glitchBurst > 0) s.glitchBurst = Math.max(0, s.glitchBurst - dt * 1.1);
      }
    }

    // Check hazards, warps & possessed QUIT breakout!
    if (!isLast) {
      if (player.y > H + 48) {
        triggerLie(player.x, H - 36);
        return;
      }
      for (const sp of stage.spikes) {
        if (aabb(player.x + 6, player.y + 8, player.w - 12, player.h - 10, sp.x, sp.y, sp.w, sp.h)) {
          triggerLie(player.x + 19, sp.y);
          return;
        }
      }
      // Check Universe Scanline Rift!
      const ex = stage.exit.x, ey = stage.exit.y;
      const exitRevealed = stage.id !== 0 || stage.fakeFloors[0]?.dissolved;
      if (exitRevealed && aabb(player.x, player.y, player.w, player.h, ex - 48, ey - 126, 96, 132)) {
        if (universeIdx < 2) {
          beginUniverse(universeIdx + 1, true);
        } else {
          beginLastStage(true);
        }
      }
    } else {
      // FINAL BOSS ('last'):
      // Walking LEFT off the possessed QUIT button falls into the void -> retry on button
      if (player.y > H + 48) {
        triggerLie(player.x, H - 36);
        return;
      }
      // Physically jumping/walking OFF the right frame of the giant [QUIT] button shatters the lie!
      if (!lastStage.buttonShattered && player.x > lastStage.quitBtn.x + lastStage.quitBtn.w + 8) {
        shatterQuitButton();
      }
      // Reaching the Ornate Victory Ledge triggers the STAGE CLEAR fireworks finale!
      if (lastStage.buttonShattered && player.x >= 1010 && player.onGround) {
        gameState = 'end';
        stateTimer = 0;
        player.vx = 0;
        player.facing = 1;
        glitchFlash = 0.7;
        playSfx('win');
        spawnVictoryCoins();
        spawnOmniFirework(230, 175, PAL.magenta);
        spawnOmniFirework(430, 155, PAL.cyan);
        spawnOmniFirework(770, 145, PAL.gold);
        spawnOmniFirework(1060, 215, PAL.cyan);
        spawnOmniFirework(685, 365, PAL.gold);
      }
    }
  }

  function update(dt) {
    totalTime += dt;
    if (glitchFlash > 0) glitchFlash = Math.max(0, glitchFlash - dt * 2.1);
    if (warpEffect.active) {
      warpEffect.t += dt;
      if (warpEffect.t >= warpEffect.dur) warpEffect.active = false;
    }

    if (hitStop > 0) {
      hitStop -= dt;
      for (const k in justPressed) delete justPressed[k];
      return;
    }

    // Pause toggle during active work (VOIDBASTARD-TAO Law 7)
    if ((gameState === 'world' || gameState === 'last') && (justPressed['KeyP'] || justPressed['Escape'])) {
      paused = !paused;
      for (const k in justPressed) delete justPressed[k];
      return;
    }
    if (paused) {
      if (justPressed['KeyR']) {
        paused = false;
        if (gameState === 'last') beginLastStage(true);
        else beginUniverse(universeIdx, true);
      }
      for (const k in justPressed) delete justPressed[k];
      return;
    }

    if (gameState === 'title') {
      if (justPressed['Space'] || justPressed['Enter']) {
        gameState = 'pick';
        playSfx('probe');
      }
    } else if (gameState === 'pick') {
      if (justPressed['ArrowLeft'] || justPressed['KeyA']) heroChoice = (heroChoice + 2) % 3;
      if (justPressed['ArrowRight'] || justPressed['KeyD']) heroChoice = (heroChoice + 1) % 3;
      if (justPressed['Digit1']) heroChoice = 0;
      if (justPressed['Digit2']) heroChoice = 1;
      if (justPressed['Digit3']) heroChoice = 2;
      if (justPressed['Space'] || justPressed['Enter']) beginUniverse(0, true);
    } else if (gameState === 'world' || gameState === 'last') {
      updateGameplay(dt);
    } else if (gameState === 'lie') {
      stateTimer -= dt;
      if (stateTimer <= 0 || justPressed['KeyR'] || justPressed['Space']) {
        if (player.returnToLast) {
          beginLastStage(false);
        } else {
          const u = universes[universeIdx];
          player.x = u.checkpoint.x;
          player.y = u.checkpoint.y;
          player.vx = 0;
          player.vy = 0;
          gameState = 'world';
        }
      }
    } else if (gameState === 'end') {
      stateTimer += dt;
      if (rand() < dt * 4.2) {
        const cols = [PAL.magenta, PAL.cyan, PAL.gold];
        spawnOmniFirework(160 + rand() * (W - 320), 110 + rand() * 270, cols[Math.floor(rand() * 3)]);
      }
      if (justPressed['KeyR'] || (stateTimer > 0.8 && justPressed['Space'])) {
        restartFullGame();
      }
    }

    // Smooth horizontal arcade camera
    const stage = getActiveStage();
    let targetCamX = 0;
    if (stage.worldW > W) {
      // Frame Universe 0 cleanly so right-hand pit & left-hand staircase stay balanced like sheet.jpg!
      const anchor = stage.id === 0 ? 500 : 420;
      targetCamX = Math.max(0, Math.min(stage.worldW - W, player.x - anchor));
    }
    camX += (targetCamX - camX) * Math.min(1, dt * 7.5);

    // Update particles
    for (let i = staticPixels.length - 1; i >= 0; i--) {
      const p = staticPixels[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.grav * dt;
      p.life -= dt;
      if (p.life <= 0) staticPixels.splice(i, 1);
    }
    for (let i = starTrail.length - 1; i >= 0; i--) {
      const s = starTrail[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.life -= dt;
      if (s.life <= 0) starTrail.splice(i, 1);
    }
    for (let i = fireworks.length - 1; i >= 0; i--) {
      const f = fireworks[i];
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.vx *= (1 - dt * 1.1);
      f.vy = f.vy * (1 - dt * 1.1) + 95 * dt;
      f.life -= dt;
      if (f.life <= 0) fireworks.splice(i, 1);
    }

    for (const k in justPressed) delete justPressed[k];
  }

  // =========================================================================
  // RENDERING (Faithful to Omni sheet.jpg f_005, f_014, f_027, f_038)
  // =========================================================================
  function drawAtlas(rect, dx, dy, dw, dh, alpha = 1) {
    if (!tilesReady || !tilesSource) return false;
    if (alpha !== 1) {
      ctx.save();
      ctx.globalAlpha *= alpha;
      ctx.drawImage(tilesSource, rect.x, rect.y, rect.w, rect.h, Math.round(dx), Math.round(dy), Math.round(dw), Math.round(dh));
      ctx.restore();
    } else {
      ctx.drawImage(tilesSource, rect.x, rect.y, rect.w, rect.h, Math.round(dx), Math.round(dy), Math.round(dw), Math.round(dh));
    }
    return true;
  }

  function drawFourPointSparkle(x, y, arm, col, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = col;
    const sx = Math.round(x), sy = Math.round(y);
    ctx.fillRect(sx - arm, sy - 1, arm * 2 + 1, 2);
    ctx.fillRect(sx - 1, sy - arm, 2, arm * 2 + 1);
    ctx.fillStyle = PAL.white;
    ctx.fillRect(sx - 2, sy - 2, 4, 4);
    ctx.restore();
  }

  function renderBackground() {
    const stage = getActiveStage();
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0b091f');
    grad.addColorStop(0.55, '#110d29');
    grad.addColorStop(1, '#171535');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    const cosmicAmt = (gameState === 'end') ? 1 : (stage.cosmicBleed || 0);
    const isBrick = (stage.theme === 'brick');
    const isCyber = (stage.theme === 'cyber' || stage.theme === 'boss');

    // Subtle cavern grid lines & brick clusters in Universe 0 (exact match to f_005.jpg!)
    if (isBrick) {
      ctx.strokeStyle = 'rgba(46, 110, 138, 0.16)';
      ctx.lineWidth = 2;
      for (let gx = 160; gx < W; gx += 320) {
        const sx = Math.round(((gx - camX * 0.25) % W + W) % W);
        ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(0, 240); ctx.lineTo(W, 240); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 445); ctx.lineTo(W, 445); ctx.stroke();

      const brickPatches = [
        [430, 125, 2, 2], [935, 290, 2, 2], [75, 450, 2, 1], [665, 95, 2, 2]
      ];
      for (const [bx, by, cols, rows] of brickPatches) {
        const px = Math.round(((bx - camX * 0.35) % (W + 240) + (W + 240)) % (W + 240) - 120);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            drawAtlas(ATLAS.u1WallBrick, px + c * 82, by + r * 86, 84, 88, 0.52);
          }
        }
      }
    }

    // Cosmic Nebula Swirls, Radial Star Streaks & Constellation Polygons (f_027 / pair_008.00.jpg!)
    if (cosmicAmt > 0.02) {
      ctx.save();
      ctx.globalAlpha = cosmicAmt;

      // Subtle violet cosmic nebula ribbons
      ctx.strokeStyle = 'rgba(112, 48, 150, 0.22)';
      ctx.lineWidth = 38;
      ctx.beginPath();
      ctx.moveTo(140, H + 20);
      ctx.bezierCurveTo(320, 420, 560, 520, 920, 80);
      ctx.stroke();

      // Radial hyperspace star streaks centered in cosmic canyon
      const cx = stage.id === 0 ? 290 : 490;
      const cy = stage.id === 0 ? 250 : 330;
      ctx.lineWidth = 2;
      for (let i = 0; i < RADIAL_STREAKS.length; i++) {
        const st = RADIAL_STREAKS[i];
        const a = st.ang + Math.sin(totalTime * 0.25 + i) * 0.02;
        const pulse = (totalTime * 55 + i * 29) % 90;
        const r1 = st.r1 + pulse * 0.7;
        const r2 = r1 + st.len;
        const x1 = cx + Math.cos(a) * r1;
        const y1 = cy + Math.sin(a) * r1;
        const x2 = cx + Math.cos(a) * r2;
        const y2 = cy + Math.sin(a) * r2;
        ctx.strokeStyle = st.col;
        ctx.globalAlpha = cosmicAmt * 0.55;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        if (st.starEnd) {
          ctx.globalAlpha = cosmicAmt * 0.92;
          ctx.fillStyle = PAL.gold;
          ctx.fillRect(Math.round(x2) - 4, Math.round(y2) - 4, 8, 8);
          ctx.fillStyle = PAL.white;
          ctx.fillRect(Math.round(x2) - 2, Math.round(y2) - 2, 4, 4);
        }
      }

      // Constellation wireframes + glowing cyan vertex nodes
      ctx.globalAlpha = cosmicAmt * 0.65;
      ctx.strokeStyle = PAL.cyan;
      ctx.lineWidth = 1.6;
      for (const poly of CONSTELLATIONS) {
        ctx.beginPath();
        poly.pts.forEach(([px, py], idx) => {
          const sx = px - camX * 0.22;
          if (idx === 0) ctx.moveTo(sx, py);
          else ctx.lineTo(sx, py);
        });
        ctx.stroke();
        for (const [px, py] of poly.pts) {
          const sx = px - camX * 0.22;
          drawFourPointSparkle(sx, py, 6, PAL.cyan, cosmicAmt * 0.85);
        }
      }

      // Floating Nano Banana star-rocks in deep cosmic background
      if (stage.theme === 'cosmic') {
        drawAtlas(ATLAS.u2StarRock1, 1020 - camX * 0.3, 145, 70, 61, 0.75);
        drawAtlas(ATLAS.u2Meteor1, 865 - camX * 0.25, 345, 90, 91, 0.72);
      }
      ctx.restore();
    }

    // Towering Space-Invader Monoliths in Universe 2 & Final QUIT Boss!
    if (isCyber && gameState !== 'end') {
      const alpha = stage.theme === 'boss' ? 0.30 : 0.48;
      for (let i = 0; i < 5; i++) {
        const ix = 55 + i * 255 - (camX * 0.25);
        drawAtlas(ATLAS.u3Invader, ix, 92 + (i % 2) * 26, 162, 270, alpha);
      }
    }

    // Twinkling pixel stars & 4-point cyan/gold sparkles (matching f_005.jpg!)
    for (let i = 0; i < STARS.length; i++) {
      const s = STARS[i];
      const sx = Math.round(((s.x - camX * 0.18) % (W + 80) + (W + 80)) % (W + 80) - 40);
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(totalTime * 2.4 + s.phase));
      ctx.globalAlpha = tw * 0.82;
      ctx.fillStyle = s.col;
      ctx.fillRect(sx, s.y, s.r, s.r);
      if (s.sparkle) {
        drawFourPointSparkle(sx, s.y, 11, PAL.cyan, tw * 0.75);
      }
    }
    ctx.globalAlpha = 1;
  }

  // Organic pixel-sculpted cavern & temple geometry (matches f_005.jpg thick cobble stone rims!)
  function drawCavernBody(x, y, w, h, topRim = true, bottomRim = false) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();

    // Deep dark indigo cavern rock interior (#0b081d)
    ctx.fillStyle = '#09071a';
    ctx.fillRect(x, y, w, h);

    // Subtle interior brick courses near edges fading into deep black-indigo center
    const cols = Math.ceil(w / 83) + 1;
    for (let c = 0; c < cols; c++) {
      drawAtlas(ATLAS.u1WallBrick, x + c * 83, y + (topRim ? 18 : Math.max(0, h - 96)), 84, 87, 0.28);
    }

    // Sculpted dark-slate cobble stone blocks along outer walls (26px thick, matching f_005.jpg!)
    ctx.fillStyle = '#182b40';
    ctx.fillRect(x, y, 24, h);
    ctx.fillRect(x + w - 24, y, 24, h);
    ctx.fillStyle = '#0c1526';
    for (let cy = y + 18; cy < y + h - 12; cy += 32) {
      ctx.fillRect(x + 4, cy, 18, 4);
      ctx.fillRect(x + w - 22, cy + 12, 18, 4);
    }

    if (topRim) {
      ctx.fillStyle = '#182e44';
      ctx.fillRect(x, y, w, 26);
      ctx.fillStyle = '#296b82';
      ctx.fillRect(x, y, w, 12);
      ctx.fillStyle = '#6cf7ff';
      ctx.fillRect(x + 3, y, w - 6, 5);
      // Organic stone mortar notches & cobble seams along rim
      ctx.fillStyle = '#09071a';
      for (let tx = x + 22; tx < x + w - 28; tx += 44) {
        ctx.fillRect(tx, y + 18, 22, 9);
        ctx.fillRect(tx + 12, y + 5, 4, 8);
      }
    }
    if (bottomRim) {
      ctx.fillStyle = '#182e44';
      ctx.fillRect(x, y + h - 26, w, 26);
      ctx.fillStyle = '#296b82';
      ctx.fillRect(x, y + h - 12, w, 12);
      ctx.fillStyle = '#6cf7ff';
      ctx.fillRect(x + 3, y + h - 5, w - 6, 5);
      ctx.fillStyle = '#09071a';
      for (let tx = x + 26; tx < x + w - 28; tx += 46) {
        ctx.fillRect(tx, y + h - 27, 20, 9);
      }
    }

    // Crisp outer teal stone edge highlights
    ctx.fillStyle = '#389cb5';
    ctx.fillRect(x, y + 5, 5, h - 10);
    ctx.fillRect(x + w - 5, y + 5, 5, h - 10);
    ctx.restore();
  }

  function drawOrnateTemple(x, y, w, h) {
    drawCavernBody(x, y + 16, w, h - 16, false, false);
    // Ornate cyan-and-gold overhanging cornice with diamond medallion (exact pair_008 & f_038!)
    const overX = x - 8, overW = w + 22;
    ctx.fillStyle = '#18374c';
    ctx.fillRect(overX, y, overW, 24);
    ctx.fillStyle = PAL.tealRim;
    ctx.fillRect(overX, y, overW, 5);
    ctx.fillStyle = PAL.gold;
    ctx.fillRect(overX, y + 5, overW, 3);
    ctx.fillRect(overX + 6, y + 20, overW - 18, 4);

    // Gold key-fret scrollwork along frieze
    ctx.strokeStyle = PAL.gold;
    ctx.lineWidth = 2;
    for (let sx = overX + 14; sx < overX + overW - 34; sx += 38) {
      ctx.strokeRect(sx, y + 10, 22, 9);
    }

    // Center Glowing Cyan Diamond Medallion in Gold Bezel!
    const mx = x + Math.min(w * 0.56, w - 58);
    const my = y + 16;
    ctx.save();
    ctx.translate(mx, my);
    ctx.fillStyle = PAL.gold;
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(22, 0); ctx.lineTo(0, 18); ctx.lineTo(-22, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#10253a';
    ctx.beginPath();
    ctx.moveTo(0, -14); ctx.lineTo(17, 0); ctx.lineTo(0, 14); ctx.lineTo(-17, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = PAL.cyan;
    ctx.beginPath();
    ctx.moveTo(0, -10); ctx.lineTo(12, 0); ctx.lineTo(0, 10); ctx.lineTo(-12, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = PAL.cyanBright;
    ctx.fillRect(-4, -4, 6, 6);
    ctx.restore();
  }

  function drawPlatform(p, stage) {
    if ((p.revealOnTest || p.revealOnBreak) && !p.revealed) {
      // Subtle 3-pixel corner glints only so observant eyes sense latent structure without clutter
      if (p.revealOnTest) {
        ctx.fillStyle = 'rgba(60, 242, 255, 0.16)';
        ctx.fillRect(p.x, p.y, 6, 3);
        ctx.fillRect(p.x + p.w - 6, p.y, 6, 3);
      }
      return;
    }

    if (p.kind === 'phase') {
      // Solid bright cyan rounded-pixel block + sparkling pixel-burst border (f_021 & f_027!)
      ctx.fillStyle = 'rgba(60, 242, 255, 0.22)';
      ctx.fillRect(p.x - 5, p.y - 5, p.w + 10, p.h + 10);
      if (!drawAtlas(ATLAS.u2PhaseBlk, p.x, p.y, p.w, p.h)) {
        ctx.fillStyle = PAL.cyan;
        ctx.fillRect(p.x + 3, p.y, p.w - 6, p.h);
        ctx.fillRect(p.x, p.y + 3, p.w, p.h - 6);
      } else {
        ctx.fillStyle = PAL.cyan;
        ctx.fillRect(p.x + 4, p.y + 4, p.w - 8, p.h - 8);
      }
      ctx.fillStyle = PAL.cyanBright;
      ctx.fillRect(p.x + 6, p.y + 2, p.w - 12, 4);

      // Animated pixel-fizzle halo around newly materialized blocks (matches pair_005.00.jpg left!)
      if (stage.id === 0) {
        for (let k = 0; k < 8; k++) {
          const px = p.x - 8 + ((k * 19 + Math.floor(totalTime * 12) * 7) % (p.w + 16));
          const py = p.y - 8 + ((k * 13 + Math.floor(totalTime * 9) * 5) % (p.h + 16));
          if (px < p.x + 2 || px > p.x + p.w - 6 || py < p.y + 2 || py > p.y + p.h - 6) {
            ctx.fillStyle = k % 2 === 0 ? PAL.cyan : PAL.cyanBright;
            ctx.fillRect(px, py, 5, 5);
          }
        }
      }
      return;
    }

    if (p.kind === 'u1Ledge1') {
      drawAtlas(ATLAS.u1Ledge1, p.x, p.y, p.w, p.h + 12);
      return;
    }
    if (p.kind === 'u1Ledge2') {
      drawAtlas(ATLAS.u1Ledge2, p.x, p.y, p.w, p.h + 14);
      return;
    }
    if (p.kind === 'u2ThinLedge') {
      drawAtlas(ATLAS.u2LedgeSml, p.x, p.y, p.w, p.h);
      ctx.fillStyle = PAL.tealRim;
      ctx.fillRect(p.x, p.y, p.w, 4);
      return;
    }
    if (p.kind === 'ornateLedge') {
      drawOrnateTemple(p.x, p.y, p.w, p.h + 14);
      return;
    }
    if (p.kind === 'ornateTemple') {
      drawOrnateTemple(p.x, p.y, p.w, p.h);
      return;
    }
    if (p.kind === 'ceiling') {
      drawCavernBody(p.x, p.y, p.w, p.h, false, true);
      return;
    }
    if (p.kind === 'cyber') {
      ctx.save();
      ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.clip();
      ctx.fillStyle = '#0e0b22';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      const cols = Math.ceil(p.w / 86);
      for (let c = 0; c < cols; c++) {
        const rect = c % 2 === 0 ? ATLAS.u3Circuit1 : ATLAS.u3Circuit2;
        drawAtlas(rect, p.x + c * 86, p.y + 16, 86, 86, 0.72);
      }
      ctx.restore();
      drawAtlas(ATLAS.u3Ledge, p.x, p.y, Math.min(p.w, 184), 28);
      if (p.w > 184) drawAtlas(ATLAS.u3Ledge, p.x + 184, p.y, p.w - 184, 28);
      ctx.fillStyle = PAL.gold;
      ctx.fillRect(p.x, p.y, p.w, 4);
      return;
    }

    if (p.kind === 'quitButton') {
      if (stage.buttonShattered) return;
      const pressY = Math.round((stage.cursorPress || 0) * 8);
      const jitterX = Math.sin(totalTime * 37) > 0.68 ? ((Math.floor(totalTime * 60) % 2) * 4 - 2) : 0;
      const bx = p.x + jitterX, by = p.y + pressY;

      // Possessed CRT terminal looming behind the giant UI button
      drawAtlas(ATLAS.u3Terminal, bx + p.w / 2 - 115, by - 215, 230, 210, 0.92);

      // Chromatic RGB split ghost around the lying GOLD button!
      ctx.strokeStyle = 'rgba(255, 66, 176, 0.45)';
      ctx.lineWidth = 4;
      ctx.strokeRect(bx - 5, by + 2, p.w + 10, p.h);

      // Physical 3D bevel button body
      ctx.fillStyle = '#291a08';
      ctx.fillRect(bx, by + 10, p.w, p.h);
      ctx.fillStyle = '#150d2e';
      ctx.fillRect(bx, by, p.w, p.h);

      // Thick gold UI bevels
      ctx.strokeStyle = PAL.gold;
      ctx.lineWidth = 6;
      ctx.strokeRect(bx + 3, by + 3, p.w - 6, p.h - 6);
      ctx.strokeStyle = '#9c7d1e';
      ctx.lineWidth = 3;
      ctx.strokeRect(bx + 12, by + 12, p.w - 24, p.h - 24);

      // Giant physical "Q U I T" UI typography across button face
      ctx.fillStyle = PAL.gold;
      ctx.font = 'bold 58px "Courier New", Courier, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('[ Q U I T ]', bx + p.w / 2, by + p.h / 2 + 2);

      // Glowing CYAN fracture seam on the right bezel showing the button frame can be broken!
      const rx = p.x + p.w - 18;
      ctx.fillStyle = PAL.cyan;
      ctx.fillRect(rx, by - 4, 18, 8);
      ctx.fillRect(rx + 8, by + 4, 10, 26);
      ctx.fillStyle = PAL.cyanBright;
      ctx.fillRect(rx + 4, by - 2, 12, 4);

      // Giant possessed gold cursor arrow swooping down to click the button!
      const curX = bx + 155 + Math.sin(totalTime * 2.2) * 35;
      const curY = by - 58 + pressY * 3.5;
      ctx.save();
      ctx.translate(Math.round(curX), Math.round(curY));
      ctx.fillStyle = PAL.gold;
      ctx.strokeStyle = '#140b2b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 52);
      ctx.lineTo(0, 0);
      ctx.lineTo(38, 36);
      ctx.lineTo(18, 39);
      ctx.lineTo(28, 62);
      ctx.lineTo(17, 67);
      ctx.lineTo(8, 44);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
      return;
    }

    if (p.kind === 'quitLip') {
      if (stage.buttonShattered) return;
      ctx.fillStyle = PAL.cyan;
      ctx.fillRect(p.x, p.y, p.w, 6);
      ctx.fillStyle = '#1b3d54';
      ctx.fillRect(p.x, p.y + 6, p.w, p.h - 6);
      return;
    }

    // Default 'cavern' solid terrain
    drawCavernBody(p.x, p.y, p.w, p.h, true, false);
    if (p.rubble) {
      drawAtlas(ATLAS.u1Rubble, p.x + 55, p.y - 38, 175, 44);
    }
  }

  function drawFakeFloor(ff) {
    if (!ff.dissolved) {
      if (ff.style === 'pool') {
        // Organic voronoi/cellular shimmering cyan-teal hologram pool (exact f_005.jpg look!)
        const grad = ctx.createLinearGradient(ff.x, ff.y, ff.x, ff.y + ff.h);
        grad.addColorStop(0, '#58dce8');
        grad.addColorStop(0.18, '#3896ab');
        grad.addColorStop(0.75, '#1e576e');
        grad.addColorStop(1, '#14384a');
        ctx.fillStyle = grad;
        ctx.fillRect(ff.x, ff.y, ff.w, ff.h);

        // Irregular dark-teal cellular voronoi pockets + bright caustic webbing
        const cells = [
          [42, 34, 34, 18, 0.2], [115, 42, 42, 22, -0.15], [198, 30, 32, 17, 0.1], [275, 40, 38, 21, -0.2], [335, 32, 24, 16, 0.15],
          [68, 82, 44, 24, -0.1], [156, 92, 36, 22, 0.25], [238, 86, 46, 25, -0.12], [318, 84, 30, 20, 0.18],
          [45, 128, 32, 16, 0.1], [122, 132, 42, 18, -0.2], [212, 130, 38, 17, 0.12], [295, 128, 40, 18, -0.1]
        ];
        for (let i = 0; i < cells.length; i++) {
          const [ox, oy, rx, ry, rot] = cells[i];
          const wobX = Math.sin(totalTime * 2.1 + i * 1.3) * 4;
          const wobY = Math.cos(totalTime * 1.8 + i) * 2.5;
          ctx.save();
          ctx.translate(ff.x + ox + wobX, ff.y + oy + wobY);
          ctx.rotate(rot);
          ctx.fillStyle = 'rgba(15, 48, 66, 0.72)';
          ctx.strokeStyle = 'rgba(130, 248, 255, 0.44)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        // Thick glowing wavy cyan-white foam crest + rising square pixel motes!
        ctx.fillStyle = 'rgba(148, 252, 255, 0.35)';
        ctx.fillRect(ff.x, ff.y - 2, ff.w, 12);
        ctx.strokeStyle = '#a8ffff';
        ctx.lineWidth = 5;
        ctx.beginPath();
        for (let dx = 0; dx <= ff.w; dx += 10) {
          const wy = ff.y + Math.sin(totalTime * 3.8 + dx * 0.038) * 5.5;
          if (dx === 0) ctx.moveTo(ff.x + dx, wy);
          else ctx.lineTo(ff.x + dx, wy);
        }
        ctx.stroke();

        // Rising luminous pixel squares + subtle gold glitch tell!
        for (let m = 0; m < 12; m++) {
          const mx = ff.x + 18 + ((m * 37 + Math.floor(totalTime * 14) * 5) % (ff.w - 36));
          const my = ff.y - 28 + ((m * 29 - Math.floor(totalTime * 30)) % (ff.h + 18) + (ff.h + 18)) % (ff.h + 18);
          const isGlitchTell = (m === 0 && Math.sin(totalTime * 19) > 0.55);
          ctx.fillStyle = isGlitchTell ? PAL.gold : '#b8ffff';
          const sz = isGlitchTell ? 8 : (m % 3 === 0 ? 7 : 5);
          ctx.fillRect(mx, my, sz, sz);
        }

        // Basin stone rim at bottom (f_005.jpg!)
        drawCavernBody(ff.x - 6, ff.basinY, ff.w + 12, H - ff.basinY, true, false);
      } else {
        // Deceptive shimmering gold-cyan hologram bridge (Universe 1 & 2)
        const flick = Math.sin(totalTime * 34) > 0.65 ? 0.55 : 0.85;
        ctx.fillStyle = `rgba(255, 232, 107, ${flick * 0.25})`;
        ctx.fillRect(ff.x, ff.y, ff.w, ff.h);
        ctx.strokeStyle = PAL.gold;
        ctx.lineWidth = 3;
        ctx.strokeRect(ff.x + 1, ff.y + 1, ff.w - 2, ff.h - 2);
        for (let k = 0; k < 7; k++) {
          const gx = ff.x + ((k * 53 + Math.floor(totalTime * 24) * 11) % Math.max(12, ff.w - 12));
          ctx.fillStyle = k % 2 === 0 ? PAL.gold : PAL.magenta;
          ctx.fillRect(gx, ff.y + 8, 8, 6);
        }
      }
    } else if (ff.style === 'pool') {
      // Dissolved abyss churning with residual cyan, magenta & [X] debug squares (f_014 & pair_005!)
      ctx.fillStyle = '#060412';
      ctx.fillRect(ff.x, ff.y - 6, ff.w, H - ff.y + 6);
      const density = ff.dissolveAnim > 0.15 ? 46 : 24;
      for (let k = 0; k < density; k++) {
        const px = ff.x + 8 + ((k * 47 + Math.floor(totalTime * 7) * 13) % (ff.w - 26));
        const py = ff.y + 4 + ((k * 39 + Math.floor(totalTime * 52)) % (H - ff.y - 22));
        const sz = 8 + (k % 3) * 4;
        const col = k % 4 === 0 ? PAL.magenta : PAL.cyan;
        if (k % 2 === 0) {
          ctx.strokeStyle = col;
          ctx.lineWidth = 1.8;
          ctx.strokeRect(px, py, sz, sz);
          if (k % 6 === 0) {
            ctx.beginPath();
            ctx.moveTo(px, py); ctx.lineTo(px + sz, py + sz);
            ctx.moveTo(px + sz, py); ctx.lineTo(px, py + sz);
            ctx.stroke();
          }
        } else {
          ctx.fillStyle = col;
          ctx.globalAlpha = 0.78;
          ctx.fillRect(px, py, sz, sz);
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  function drawSign(s, stage) {
    if (s.revealOnTest && !s.revealed) return;
    if (s.hideWhenDissolved && stage.fakeFloors[0]?.dissolved && s.glitchBurst <= 0.05) return;

    // Special tilted cosmic directional arrow matching pair_008.00.jpg left!
    if (s.arrow === 'warp-chevron') {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(0.18);
      ctx.strokeStyle = PAL.gold;
      ctx.fillStyle = 'rgba(20, 32, 62, 0.85)';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(-48, -14);
      ctx.lineTo(18, -10);
      ctx.lineTo(14, -24);
      ctx.lineTo(54, 4);
      ctx.lineTo(10, 26);
      ctx.lineTo(16, 10);
      ctx.lineTo(-42, 12);
      ctx.lineTo(-32, -1);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = PAL.cyan;
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.restore();
      return;
    }

    // THE TELL:
    //   GOLD signs (#ffe86b) suffer periodic horizontal scanline jitter + RGB chromatic ghosting!
    //   CYAN signs (#3cf2ff) shine with rock-solid, calm geometric stability!
    const activeBurst = s.glitchBurst || 0;
    const subtleTell = s.isLie && (Math.sin(totalTime * 27 + s.x) > 0.66 || activeBurst > 0.05);
    const jitter = subtleTell ? ((Math.floor(totalTime * 60) % 2) * 5 - 2.5) * (1 + activeBurst * 2.5) : 0;

    const mainCol = s.isLie ? PAL.gold : PAL.cyan;
    const outerCol = s.isLie ? PAL.cyan : PAL.cyanBright;
    const bw = Math.max(254, s.text.length * 19 + 46);
    const bh = 70;
    const bx = Math.round(s.x - bw / 2 + jitter);
    const by = Math.round(s.y - bh / 2);

    ctx.save();

    // Ceiling suspension brackets for hanging STAGE CLEAR sign (f_005.jpg!)
    if (s.mountY !== undefined) {
      ctx.fillStyle = '#25314f';
      ctx.fillRect(s.x - 76, s.mountY, 10, by - s.mountY);
      ctx.fillRect(s.x + 66, s.mountY, 10, by - s.mountY);
      ctx.fillStyle = PAL.tealStone;
      ctx.fillRect(s.x - 82, s.mountY, 22, 7);
      ctx.fillRect(s.x + 60, s.mountY, 22, 7);
    }

    // Chromatic magenta ghost when gold sign flickers
    if (subtleTell) {
      ctx.strokeStyle = 'rgba(255, 66, 176, 0.58)';
      ctx.lineWidth = 3;
      ctx.strokeRect(bx - 6, by + 2, bw + 12, bh);
    }

    // Warm neon bloom + crisp double border (exact f_005.jpg STAGE CLEAR frame!)
    ctx.fillStyle = s.isLie ? 'rgba(255, 220, 90, 0.16)' : 'rgba(60, 242, 255, 0.16)';
    ctx.fillRect(bx - 14, by - 14, bw + 28, bh + 28);
    ctx.fillStyle = 'rgba(20, 18, 42, 0.94)';
    ctx.fillRect(bx, by, bw, bh);

    ctx.strokeStyle = outerCol;
    ctx.lineWidth = 3.5;
    ctx.strokeRect(bx - 5, by - 5, bw + 10, bh + 10);

    ctx.strokeStyle = mainCol;
    ctx.lineWidth = 3.5;
    ctx.strokeRect(bx + 2, by + 2, bw - 4, bh - 4);

    // Bold pixel-arcade sign text
    ctx.fillStyle = mainCol;
    ctx.font = 'bold 29px "Courier New", Courier, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (activeBurst > 0.25) {
      // Scanline-shattered text matching f_014.jpg!
      ctx.fillText(s.text, bx + bw / 2 + 7, by + bh / 2 - 2);
      ctx.fillStyle = 'rgba(255, 232, 107, 0.55)';
      ctx.fillText(s.text, bx + bw / 2 - 8, by + bh / 2 + 3);
      for (let g = 0; g < 14; g++) {
        ctx.fillStyle = g % 2 === 0 ? PAL.gold : '#100c25';
        ctx.fillRect(bx - 8 + ((g * 29) % (bw + 12)), by + ((g * 11) % bh), 22, 4);
      }
    } else {
      ctx.fillText(s.text, bx + bw / 2, by + bh / 2 + 1);
    }

    // Hollow neon downward arrow matching f_005.jpg!
    if (s.arrow === 'down' || s.arrow === 'down-short') {
      const len = s.arrow === 'down-short' ? 28 : 62;
      const tip = s.arrow === 'down-short' ? 56 : 108;
      const ax = Math.round(s.x + jitter * 0.6);
      const ay = by + bh + 2;
      ctx.fillStyle = 'rgba(16, 14, 36, 0.90)';
      ctx.strokeStyle = mainCol;
      ctx.lineWidth = 3.8;
      ctx.beginPath();
      ctx.moveTo(ax - 16, ay);
      ctx.lineTo(ax - 16, ay + len);
      ctx.lineTo(ax - 42, ay + len);
      ctx.lineTo(ax, ay + tip);
      ctx.lineTo(ax + 42, ay + len);
      ctx.lineTo(ax + 16, ay + len);
      ctx.lineTo(ax + 16, ay);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  // Charismatic 92px pixel-art hero matching Omni f_005, f_014, f_027 & f_038!
  function drawPixelHero(px, py, facing, choiceIdx, celebrate = false) {
    const h = HERO_CHOICES[choiceIdx] || HERO_CHOICES[0];
    const moving = player.onGround && Math.abs(player.vx) > 25;
    const bob = moving ? Math.round(Math.abs(Math.sin(player.animTime)) * -4) : 0;
    const stride = celebrate ? 0.35 : (moving ? Math.sin(player.animTime) : (player.onGround ? 0.22 : 0.95));

    ctx.save();
    ctx.translate(Math.round(px + player.w / 2), Math.round(py + player.h));
    ctx.scale((facing < 0 ? -1 : 1) * player.scaleX, player.scaleY);
    // Scale 68px pixel grid cleanly by 1.35x -> crisp ~92px tall arcade sprite!
    ctx.scale(1.35, 1.35);
    ctx.translate(0, -68 + bob);

    // Diegetic boot-probe scan ring when testing an illusion!
    if (player.probePulse > 0.02 && !celebrate) {
      const r = (1 - player.probePulse) * 68 + 10;
      ctx.save();
      ctx.strokeStyle = `rgba(60, 242, 255, ${player.probePulse * 0.85})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(10, 66, r, r * 0.28, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Soft helmet glow aura (f_005.jpg!)
    ctx.fillStyle = h.helmet;
    ctx.globalAlpha = 0.20;
    ctx.beginPath();
    ctx.arc(0, 14, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Back arm
    const armSwing = Math.round(stride * 8);
    ctx.fillStyle = h.suitDark;
    ctx.fillRect(7, 29 + armSwing, 8, 15);
    ctx.fillStyle = h.helmet;
    ctx.fillRect(8, 41 + armSwing, 7, 5);

    // Back leg + gold boot trim
    const legSwing = Math.round(stride * 10);
    ctx.fillStyle = h.suitDark;
    ctx.fillRect(2 - legSwing, 47, 9, 16);
    ctx.fillStyle = h.trim;
    ctx.fillRect(2 - legSwing, 56, 9, 3);
    ctx.fillRect(1 - legSwing, 63, 13, 5);

    // Torso armor + gold belt + cyan core emblem
    ctx.fillStyle = h.suit;
    ctx.fillRect(-11, 26, 22, 22);
    ctx.fillStyle = h.trim;
    ctx.fillRect(-15, 26, 7, 6); // back pauldron
    ctx.fillRect(8, 26, 7, 6);   // front pauldron
    ctx.fillRect(-11, 43, 22, 4); // utility belt
    ctx.fillStyle = '#fff6b0';
    ctx.fillRect(-2, 43, 5, 4);   // belt buckle
    ctx.fillStyle = h.helmet;
    ctx.fillRect(0, 32, 6, 6);    // chest diamond

    // Front leg + knee guard + gold boot
    ctx.fillStyle = h.suit;
    ctx.fillRect(-10 + legSwing, 47, 10, 16);
    ctx.fillStyle = h.trim;
    ctx.fillRect(-10 + legSwing, 55, 10, 3);
    ctx.fillRect(-11 + legSwing, 63, 14, 5);

    // Swept-back pixel helmet + fin crest (exact f_005 / f_027 silhouette!)
    ctx.fillStyle = h.helmet;
    ctx.fillRect(-22, -6, 10, 7);  // upper swept fin tip
    ctx.fillRect(-18, -2, 32, 8);  // top dome
    ctx.fillRect(-16, 4, 33, 16);  // main helmet shell
    ctx.fillStyle = h.crest;
    ctx.fillRect(-14, -2, 22, 4);  // bright top highlight

    // Lower jaw / chin beneath visor (f_005.jpg!)
    ctx.fillStyle = h.skin;
    ctx.fillRect(0, 18, 14, 7);

    // Angled dark visor mask + glowing cyan/white eyes
    ctx.fillStyle = h.visor;
    ctx.fillRect(-2, 7, 19, 12);
    ctx.fillStyle = PAL.cyanBright;
    ctx.fillRect(2, 11, 5, 4);
    ctx.fillRect(11, 11, 4, 4);

    // Gold ear comms pod
    ctx.fillStyle = h.trim;
    ctx.fillRect(-11, 10, 7, 8);
    ctx.fillStyle = '#fff6b0';
    ctx.fillRect(-9, 12, 3, 4);

    // Front arm (raised in victory pose on STAGE CLEAR!)
    if (celebrate) {
      ctx.fillStyle = h.suit;
      ctx.fillRect(9, 14, 8, 16);
      ctx.fillStyle = h.trim;
      ctx.fillRect(9, 19, 8, 3);
      ctx.fillStyle = h.helmet;
      ctx.fillRect(9, 10, 8, 5);
    } else {
      ctx.fillStyle = h.suit;
      ctx.fillRect(-16, 29 - armSwing, 8, 15);
      ctx.fillStyle = h.trim;
      ctx.fillRect(-16, 34 - armSwing, 8, 3);
      ctx.fillStyle = h.helmet;
      ctx.fillRect(-16, 41 - armSwing, 8, 5);
    }

    ctx.restore();
  }

  function drawScanlineRift(ex, ey, stage) {
    if (stage.id === 0 && !stage.fakeFloors[0]?.dissolved) return;
    ctx.save();
    // Shimmering vertical universe tear (zero text label — pure visual rift!)
    const pulse = 0.7 + 0.3 * Math.sin(totalTime * 8);
    ctx.fillStyle = `rgba(60, 242, 255, ${0.18 * pulse})`;
    ctx.fillRect(ex - 30, ey - 108, 60, 108);

    // Horizontal scanline bars inside the rift
    for (let y = ey - 104; y < ey - 4; y += 8) {
      const w = 34 + Math.sin(totalTime * 12 + y * 0.15) * 14;
      ctx.fillStyle = (y % 16 === 0) ? PAL.cyan : PAL.cyanBright;
      ctx.fillRect(Math.round(ex - w / 2), y, Math.round(w), 4);
    }
    drawAtlas(ATLAS.u1BeaconC, ex - 13, ey - 92, 26, 84, 0.9);
    drawFourPointSparkle(ex, ey - 54, 14, PAL.cyan, pulse);
    ctx.restore();
  }

  function renderStageClearBanner() {
    // Celebratory neon STAGE CLEAR octagon + fireworks + gold coins (exact match to f_038.jpg!)
    for (const c of starCoins) {
      const cy = c.y + Math.sin(totalTime * 4 + c.phase) * 10;
      ctx.save();
      ctx.fillStyle = PAL.goldWarm;
      ctx.beginPath(); ctx.arc(c.x, cy, 20, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = PAL.gold;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#c27d12';
      ctx.fillRect(c.x - 4, cy - 10, 8, 20);
      ctx.fillStyle = '#fff5ad';
      ctx.fillRect(c.x - 2, cy - 8, 4, 16);
      ctx.restore();
    }

    const bx = W / 2 - 265, by = 112, bw = 530, bh = 114, cut = 26;
    ctx.save();
    const oct = (pad) => {
      ctx.beginPath();
      ctx.moveTo(bx + cut - pad, by - pad);
      ctx.lineTo(bx + bw - cut + pad, by - pad);
      ctx.lineTo(bx + bw + pad, by + cut - pad * 0.4);
      ctx.lineTo(bx + bw + pad, by + bh - cut + pad * 0.4);
      ctx.lineTo(bx + bw - cut + pad, by + bh + pad);
      ctx.lineTo(bx + cut - pad, by + bh + pad);
      ctx.lineTo(bx - pad, by + bh - cut + pad * 0.4);
      ctx.lineTo(bx - pad, by + cut - pad * 0.4);
      ctx.closePath();
    };

    ctx.fillStyle = 'rgba(16, 12, 38, 0.92)';
    oct(6); ctx.fill();
    ctx.strokeStyle = PAL.cyan;
    ctx.lineWidth = 5;
    oct(6); ctx.stroke();
    ctx.strokeStyle = PAL.gold;
    ctx.lineWidth = 2.5;
    oct(0); ctx.stroke();

    // Neon glitch accent bars around octagon corners (f_038.jpg!)
    ctx.fillStyle = PAL.magenta;
    ctx.fillRect(bx - 24, by + 18, 28, 5);
    ctx.fillRect(bx + bw - 6, by + bh - 24, 30, 5);
    ctx.fillStyle = PAL.cyanBright;
    ctx.fillRect(bx - 30, by + bh - 18, 36, 5);
    ctx.fillRect(bx + bw - 10, by + 26, 34, 5);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#a86418';
    ctx.font = 'bold 62px "Courier New", Courier, monospace';
    ctx.fillText('STAGE CLEAR', W / 2 + 3, by + bh / 2 + 5);
    ctx.fillStyle = PAL.gold;
    ctx.fillText('STAGE CLEAR', W / 2, by + bh / 2 + 1);

    // Quiet, non-demanding replay hint after celebration settles (Law 8 & 12)
    if (stateTimer > 0.9) {
      ctx.fillStyle = 'rgba(158, 251, 255, 0.78)';
      ctx.font = 'bold 16px "Courier New", Courier, monospace';
      ctx.fillText('[R]', W - 44, H - 28);
    }
    ctx.restore();
  }

  function renderWorld() {
    renderBackground();
    const stage = getActiveStage();
    const isEnd = (gameState === 'end');

    ctx.save();
    ctx.translate(-Math.round(camX), 0);

    // Radial pixel fireworks behind geometry in 'end' (matching f_038.jpg!)
    if (isEnd) {
      for (const f of fireworks) {
        const a = Math.max(0, f.life / f.maxLife);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.strokeStyle = f.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(f.x - f.vx * 0.08, f.y - f.vy * 0.08);
        ctx.lineTo(f.x, f.y);
        ctx.stroke();
        ctx.fillStyle = PAL.white;
        ctx.fillRect(Math.round(f.x) - 2, Math.round(f.y) - 2, 4, 4);
        ctx.restore();
      }
    }

    // Overhead girder trusses (f_005.jpg right side!)
    if (stage.trusses) {
      for (const t of stage.trusses) {
        ctx.strokeStyle = '#252a48';
        ctx.lineWidth = 5;
        ctx.strokeRect(t.x, t.y, t.w, t.h);
        for (let y = t.y; y < t.y + t.h - 20; y += 42) {
          ctx.beginPath();
          ctx.moveTo(t.x, y); ctx.lineTo(t.x + t.w, y + 42);
          ctx.moveTo(t.x + t.w, y); ctx.lineTo(t.x, y + 42);
          ctx.stroke();
        }
      }
    }

    // 1. Deceptive Fake Floors
    if (stage.fakeFloors) {
      for (const ff of stage.fakeFloors) drawFakeFloor(ff);
    }

    // 2. Spikes / Cyber-Fire Core
    if (stage.spikes) {
      for (const sp of stage.spikes) {
        const cols = Math.ceil(sp.w / 72);
        for (let c = 0; c < cols; c++) {
          const rect = sp.isFire
            ? ((Math.floor(totalTime * 9 + c) % 2 === 0) ? ATLAS.u3Fire1 : ATLAS.u3Fire2)
            : ATLAS.u1Spikes;
          drawAtlas(rect, sp.x + c * 72, sp.y, 72, sp.h);
        }
      }
    }

    // 3. Platforms (Cavern, Ornate Temple, Cyan Phase Blocks & Giant Physical QUIT Button)
    for (const p of stage.platforms) {
      drawPlatform(p, stage);
    }

    // 4. Residual world traces where player obeyed a lie (VOIDBASTARD-TAO Law 9)
    const curU = (gameState === 'last' || isEnd) ? 3 : universeIdx;
    for (const dt of deathTraces) {
      if (dt.universe !== curU) continue;
      ctx.strokeStyle = 'rgba(255, 66, 176, 0.55)';
      ctx.lineWidth = 2;
      ctx.strokeRect(dt.x - 10, dt.y - 10, 20, 20);
      ctx.beginPath();
      ctx.moveTo(dt.x - 7, dt.y - 7); ctx.lineTo(dt.x + 7, dt.y + 7);
      ctx.moveTo(dt.x + 7, dt.y - 7); ctx.lineTo(dt.x - 7, dt.y + 7);
      ctx.stroke();
    }

    // 5. Diegetic World Signs (Flickering Gold = Lie, Steady Cyan = Truth)
    if (!isEnd && stage.signs) {
      for (const s of stage.signs) drawSign(s, stage);
    }

    // 6. Universe Scanline Rift
    if (gameState === 'world') {
      drawScanlineRift(stage.exit.x, stage.exit.y, stage);
    }

    // 7. Star-sparkle jump trail (f_027 / pair_008.00.jpg!)
    for (const s of starTrail) {
      const a = Math.max(0, s.life / s.maxLife);
      if (s.big) {
        drawFourPointSparkle(s.x, s.y, 7, s.col, a * 0.9);
      } else {
        ctx.fillStyle = s.col;
        ctx.globalAlpha = a * 0.85;
        ctx.fillRect(Math.round(s.x) - 2, Math.round(s.y) - 2, 5, 5);
        ctx.globalAlpha = 1;
      }
    }

    // 8. Pixel Hero
    drawPixelHero(player.x, player.y, player.facing, heroChoice, isEnd);

    // 9. Tumbling Glitch Static Squares ([X] debug boxes & cyan/magenta chunks)
    for (const p of staticPixels) {
      const a = Math.max(0, Math.min(1, p.life / p.maxLife * 1.4));
      ctx.save();
      ctx.globalAlpha = a;
      const rx = Math.round(p.x), ry = Math.round(p.y);
      if (p.hollow) {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(rx, ry, p.size, p.size);
        if (p.crossBox) {
          ctx.beginPath();
          ctx.moveTo(rx, ry); ctx.lineTo(rx + p.size, ry + p.size);
          ctx.moveTo(rx + p.size, ry); ctx.lineTo(rx, ry + p.size);
          ctx.stroke();
        }
      } else {
        ctx.fillStyle = p.color;
        ctx.fillRect(rx, ry, p.size, p.size);
      }
      ctx.restore();
    }

    ctx.restore();

    if (isEnd) {
      renderStageClearBanner();
    }
  }

  function renderStateScreens() {
    // REST ('title'): Minimal empty void + logo + single valid entry cue (VOIDBASTARD-TAO Law 1 & 3)
    if (gameState === 'title') {
      renderBackground();
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = PAL.cyan;
      ctx.font = 'bold 72px "Courier New", Courier, monospace';
      ctx.fillText('GLITCHQUEST', W / 2, H / 2 - 44);
      // Subtle flickering gold subtitle demonstrating the visual tell immediately
      const jx = Math.sin(totalTime * 28) > 0.7 ? 3 : 0;
      ctx.fillStyle = PAL.gold;
      ctx.font = 'bold 20px "Courier New", Courier, monospace';
      ctx.fillText('[ SPACE ]', W / 2 + jx, H / 2 + 42);
      ctx.restore();
      return;
    }

    // READY ('pick'): Spatial diegetic pedestals right beneath the 3 hero swaps (Law 5)
    if (gameState === 'pick') {
      renderBackground();
      ctx.save();
      ctx.textAlign = 'center';
      for (let i = 0; i < 3; i++) {
        const cx = W / 2 + (i - 1) * 250;
        const cy = 410;
        const sel = (i === heroChoice);
        drawAtlas(ATLAS.u2PhaseBlk, cx - 64, cy, 128, 42, sel ? 1 : 0.35);
        if (sel) {
          ctx.strokeStyle = PAL.cyanBright;
          ctx.lineWidth = 3;
          ctx.strokeRect(cx - 68, cy - 4, 136, 50);
          drawFourPointSparkle(cx, cy - 102, 10, PAL.cyan, 0.9);
        }
        drawPixelHero(cx - 22, cy - 92, 1, i, sel);
        ctx.fillStyle = sel ? PAL.cyan : 'rgba(200, 194, 232, 0.45)';
        ctx.font = 'bold 18px "Courier New", Courier, monospace';
        ctx.fillText(`[${i + 1}]`, cx, cy + 72);
      }
      ctx.fillStyle = PAL.cyanBright;
      ctx.font = 'bold 18px "Courier New", Courier, monospace';
      ctx.fillText('[SPACE]', W / 2, 560);
      ctx.restore();
      return;
    }

    // WORKING / CHANGED / COMPLETE / FAULT: Pure uncluttered world view!
    renderWorld();

    // FAULT -> RECOVERY ('lie'): Diegetic magenta scanline shock + [R] recovery (Law 6 & 8)
    if (gameState === 'lie') {
      ctx.save();
      ctx.fillStyle = 'rgba(255, 42, 148, 0.22)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = PAL.gold;
      ctx.font = 'bold 28px "Courier New", Courier, monospace';
      ctx.fillText('LIED TO · [R]', W / 2, H / 2);
      ctx.restore();
    }

    // PAUSED (Law 7: Active work exposes Stop/Pause without cluttering active play)
    if (paused) {
      ctx.save();
      ctx.fillStyle = 'rgba(10, 7, 24, 0.65)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = PAL.cyan;
      ctx.font = 'bold 26px "Courier New", Courier, monospace';
      ctx.fillText('PAUSED  ·  [P] RESUME  ·  [R] RETRY', W / 2, H / 2);
      ctx.restore();
    }
  }

  function renderPostFX() {
    // Seamless Horizontal CRT Scanline World-Warp Tear!
    if (warpEffect.active && warpSnapshot) {
      const p = warpEffect.t / warpEffect.dur;
      const bands = 24;
      const bandH = H / bands;
      ctx.save();
      for (let b = 0; b < bands; b++) {
        const delay = ((b * 7) % bands) / bands * 0.45;
        const localP = Math.max(0, Math.min(1, (p - delay) / 0.55));
        if (localP < 1) {
          const dir = (b % 2 === 0 ? 1 : -1);
          const shift = Math.round(dir * Math.pow(localP, 1.7) * W * 1.05);
          ctx.globalAlpha = 1 - localP * 0.65;
          ctx.drawImage(warpSnapshot, 0, b * bandH, W, bandH, shift, b * bandH, W, bandH);
          // Bright cyan/gold scanline tear seam
          ctx.fillStyle = b % 2 === 0 ? PAL.cyan : PAL.gold;
          ctx.globalAlpha = (1 - localP) * 0.85;
          ctx.fillRect(0, b * bandH, W, 2);
        }
      }
      ctx.restore();
    }

    // Impact / Dissolve horizontal glitch slice tear
    if (glitchFlash > 0.03) {
      const slices = 6;
      for (let i = 0; i < slices; i++) {
        const sy = Math.floor(((i * 131 + Math.floor(totalTime * 60) * 47) % (H - 28)));
        const sh = 8 + (i % 3) * 8;
        const shift = Math.round(Math.sin(totalTime * 95 + i * 2.1) * 26 * glitchFlash);
        ctx.drawImage(canvas, 0, sy, W, sh, shift, sy, W, sh);
      }
    }

    // Crisp subtle CRT scanlines + soft edge vignette matching sheet.jpg
    ctx.fillStyle = 'rgba(0, 0, 0, 0.11)';
    for (let y = 0; y < H; y += 4) {
      ctx.fillRect(0, y, W, 1);
    }
    const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.44, W / 2, H / 2, W * 0.72);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(4,2,12,0.42)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  function render() {
    renderStateScreens();
    renderPostFX();
  }

  // Expose structured state for play.mjs & automated verification
  window.__game = {
    get state() {
      const stage = getActiveStage();
      return {
        mode: gameState, // 'title' | 'pick' | 'world' | 'lie' | 'last' | 'end'
        paused,
        universe: universeIdx,
        theme: stage.theme,
        heroChoice,
        liesTriggered,
        testsPerformed,
        buttonShattered: !!lastStage.buttonShattered,
        time: Number(totalTime.toFixed(2)),
        assetsReady: tilesReady,
        player: {
          x: Math.round(player.x),
          y: Math.round(player.y),
          vx: Math.round(player.vx),
          vy: Math.round(player.vy),
          onGround: player.onGround
        },
        platforms: getActiveSolids(stage).map(p => ({
          x: p.x, y: p.y, w: p.w, h: p.h, kind: p.kind, oneWay: !!p.oneWay
        })),
        fakeFloors: (stage.fakeFloors || []).map(f => ({
          x: f.x, y: f.y, w: f.w, h: f.h,
          dissolved: f.dissolved,
          probeMinX: f.probeMinX, probeMaxX: f.probeMaxX
        })),
        quitBtn: lastStage.quitBtn,
        exit: stage.exit
      };
    }
  };

  let lastTs = performance.now();
  function frame(ts) {
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

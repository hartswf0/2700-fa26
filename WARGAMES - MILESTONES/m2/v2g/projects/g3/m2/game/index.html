  // --- Audio (Lyria 3 BGM + Crisp 16-bit WebAudio SFX) ---
  let audioCtx = null;

  bgm.loop = true;

  function unlockAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    if (!bgmStarted) {
      bgmStarted = true;
      bgm.play().catch(() => { bgmStarted = false; });
    }
  }

  function sfx(kind) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (kind === 'step') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140 + rand() * 24, now);
      osc.frequency.exponentialRampToValueAtTime(68, now + 0.04);
      gain.gain.setValueAtTime(0.03, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
      osc.start(now); osc.stop(now + 0.05);
    } else if (kind === 'talk') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(415, now);
      osc.frequency.setValueAtTime(523.25, now + 0.04);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.11);
    } else if (kind === 'blip') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(490 + rand() * 80, now);
      gain.gain.setValueAtTime(0.018, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.028);
      osc.start(now); osc.stop(now + 0.032);
    } else if (kind === 'flip') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(260, now);
      osc.frequency.exponentialRampToValueAtTime(660, now + 0.11);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
      osc.start(now); osc.stop(now + 0.14);
    } else if (kind === 'scratch') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.setValueAtTime(410, now + 0.03);
      osc.frequency.setValueAtTime(290, now + 0.06);
      gain.gain.setValueAtTime(0.028, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.start(now); osc.stop(now + 0.095);
    } else if (kind === 'human_ok') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(392, now);
      osc.frequency.setValueAtTime(493.88, now + 0.075);
      osc.frequency.setValueAtTime(587.33, now + 0.15);
      gain.gain.setValueAtTime(0.065, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
      osc.start(now); osc.stop(now + 0.36);
    } else if (kind === 'ai_bad') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(196, now);
      osc.frequency.linearRampToValueAtTime(122, now + 0.26);
      gain.gain.setValueAtTime(0.055, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.32);
    } else if (kind === 'decline') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(330, now);
      osc.frequency.setValueAtTime(262, now + 0.065);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now); osc.stop(now + 0.16);
    }
  }

      '..KRRHSSSSSSSSSHRK..',

      '...KKRRRRRRRRRRKK...',
      '..KRRRRRYYYYRRRRRK..',
      '.KRRRRRYYYYYYRRRRRK.',
      '.KRRRKRYYYYYYRKRRRK.',
      '.KSSSKKKKKKKKKKSSSK.',
      '.KSSKGGGGGGGGGGKSSK.',
      '..KKGGGYYYYYYGGGKK..',
      '...KGGGYYYYYYGGGK...',
      '...KGGGYYYYYYGGGK...',
      '...KGGGGYYYYGGGGK...',
      '...KGGGGGGGGGGGGK...',
      '....KGGGGGGGGGGK....',
      '....KKKKGGGGKKKK....',
      '.....KBBBBBBBBK.....',
      '.....KBBKKKKBBK.....',
      '.....KKKKKKKKKK.....'
    ];
    const map = {
      K: '#191816', R: '#b44839', H: '#543528', S: '#dfab82',
      Y: '#dfd2b2', G: '#46613e', B: '#422c1f'
    };
    const c = document.createElement('canvas');
    c.width = 20; c.height = 25;
    const g = c.getContext('2d');
    rows.forEach((r, y) => {
      for (let x = 0; x < r.length; x++) {
        const ch = r[x];
        if (map[ch]) {
          g.fillStyle = map[ch];
          g.fillRect(x, y, 1, 1);
        }
      }
    });
    const out = document.createElement('canvas');
    out.width = 28; out.height = 38;
    const og = out.getContext('2d');
    og.imageSmoothingEnabled = false;
    og.drawImage(c, 2, 1, 24, 36);
    return out;
  }
  npcSprites[5] = buildHerbalistPixelSprite();

  const rawSheet = new Image();
  rawSheet.src = '../assets/6_villager_sprites.png';
  rawSheet.onload = () => {
    const cells = [
      { sx: 95,  sy: 95,  sw: 190, sh: 348, targetH: 38 }, // 0: Baker
      { sx: 418, sy: 82,  sw: 208, sh: 358, targetH: 40 }, // 1: Miller
      { sx: 745, sy: 92,  sw: 208, sh: 348, targetH: 40 }, // 2: Warden (Automaton)
      { sx: 82,  sy: 590, sw: 206, sh: 350, targetH: 39 }, // 3: Elder
      { sx: 418, sy: 582, sw: 208, sh: 358, targetH: 39 }, // 4: Farmer
      { sx: 736, sy: 610, sw: 206, sh: 332, targetH: 36 }  // 5: Cloaked Traveler (Player!)
    ];
    cells.forEach((c, idx) => {
      const tw = Math.round((c.sw / c.sh) * c.targetH);
      const oc = document.createElement('canvas');
      oc.width = tw;
      oc.height = c.targetH;
      const octx = oc.getContext('2d');
      octx.imageSmoothingEnabled = false;
      octx.drawImage(rawSheet, c.sx, c.sy, c.sw, c.sh, 0, 0, tw, c.targetH);
      // Threshold alpha cleanly so downsampled pixel edges stay razor-crisp
      const img = octx.getImageData(0, 0, tw, c.targetH);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        d[i + 3] = d[i + 3] > 96 ? 255 : 0;
      }
      octx.putImageData(img, 0, 0);
      if (idx === 5) playerSprite = oc;
      else npcSprites[idx] = oc;
    });
  };

  // --- Six Villagers & Ten Quests (6 Human, 4 AI — zero spoiler sub-captions!) ---

  const TAG_STATES = ['unknown', '? AI', 'human', 'confirmed human', 'confirmed AI'];

  // --- River & Bridge Geometry (in 640x360 pixel world space: 1040x500) ---
  function riverCenterX(y) {
    return 415 + y * 0.50 + Math.sin(y * 0.017) * 18;
  }
  function riverHalfWidth(y) {
    return 54 + Math.cos(y * 0.022) * 6;
  }

  const BRIDGES = [
    { id: 'upper', cx: 468, cy: 104, len: 148, halfW: 22, angle: -0.34 },
    { id: 'lower', cx: 518, cy: 210, len: 154, halfW: 25, angle: -0.26 }
  ];

  function pointOnBridge(px, py) {
    for (const b of BRIDGES) {
      const dx = px - b.cx, dy = py - b.cy;
      const ca = Math.cos(-b.angle), sa = Math.sin(-b.angle);
      const lx = dx * ca - dy * sa;
      const ly = dx * sa + dy * ca;
      if (Math.abs(lx) <= b.len * 0.56 && Math.abs(ly) <= b.halfW + 5) return b;
    }
    return null;
  }

  const COLLIDERS = [
    { x: 24,  y: 12,  w: 126, h: 98 },  // Elder cottage
    { x: 198, y: 22,  w: 142, h: 108 }, // Miller cottage
    { x: 18,  y: 300, w: 124, h: 102 }, // South-west cottage
    { x: 804, y: 38,  w: 146, h: 112 }, // Baker east cottage
    { x: 700, y: 126, w: 46,  h: 34 }   // Stone well
  ];

  function isWalkable(nx, ny) {
    if (nx < 18 || nx > WORLD_W - 18 || ny < 26 || ny > WORLD_H - 16) return false;
    for (const c of COLLIDERS) {
      if (nx > c.x && nx < c.x + c.w && ny > c.y && ny < c.y + c.h) return false;
    }
    if (!pointOnBridge(nx, ny)) {
      const rcx = riverCenterX(ny);
      const rhw = riverHalfWidth(ny) - 4;
      if (Math.abs(nx - rcx) < rhw) return false;
    }
    return true;
  }

  // --- Game State ---
  const S = {

  // --- Pre-Render Lush 16-Bit Pixel-Art Village Terrain (1040x500) ---
  const worldCanvas = document.createElement('canvas');
  worldCanvas.width = WORLD_W;
  worldCanvas.height = WORLD_H;
  const wctx = worldCanvas.getContext('2d');
  wctx.imageSmoothingEnabled = false;

  const ySortedProps = [];
  const wildflowers = [];
  const smokePuffs = [];

  function pxRect(g, x, y, w, h, col) {
    g.fillStyle = col;
    g.fillRect(x | 0, y | 0, Math.max(1, w | 0), Math.max(1, h | 0));
  }

  function pxDisc(g, cx, cy, rx, ry, col) {
    g.fillStyle = col;
    const x0 = Math.floor(cx - rx), x1 = Math.ceil(cx + rx);
    const y0 = Math.floor(cy - ry), y1 = Math.ceil(cy + ry);
    for (let y = y0; y <= y1; y += 2) {
      const ny = (y - cy) / ry;
      if (Math.abs(ny) > 1) continue;
      const span = Math.floor(Math.sqrt(Math.max(0, 1 - ny * ny)) * rx);
      g.fillRect((cx - span) | 0, y | 0, Math.max(1, span * 2), 2);
    }
  }

  function drawPixelCobbleStone(g, cx, cy, rx, ry, fillCol) {
    pxDisc(g, cx, cy, rx + 1, ry + 1, PAL.cobbleOut);
    pxDisc(g, cx, cy, rx, ry, fillCol);
    pxRect(g, cx - rx * 0.45, cy - ry * 0.45, Math.max(2, rx * 0.7), 2, PAL.cobbleHi);
  }

  function drawCobblePath(g, pts, radius) {
    // Earthy border + mortar bed
    for (let s = 0; s < pts.length - 1; s++) {
      const [x0, y0] = pts[s], [x1, y1] = pts[s + 1];
      const dist = Math.hypot(x1 - x0, y1 - y0);
      const steps = Math.ceil(dist / 4);
      for (let i = 0; i <= steps; i++) {
        const u = i / steps;
        const bx = x0 + (x1 - x0) * u, by = y0 + (y1 - y0) * u;
        pxDisc(g, bx, by, radius + 3, radius * 0.85 + 3, PAL.dirtLo);
        pxDisc(g, bx, by, radius + 1, radius * 0.85 + 1, PAL.dirtBase);
      }
    }
    // Interlocking pixel-outlined cobblestones
    const cols = [PAL.cobbleMid, PAL.cobbleLo, '#c4ba9e', '#a89e82'];
    for (let s = 0; s < pts.length - 1; s++) {
      const [x0, y0] = pts[s], [x1, y1] = pts[s + 1];
      const dist = Math.hypot(x1 - x0, y1 - y0);
      const steps = Math.ceil(dist / 7);
      for (let i = 0; i <= steps; i++) {
        const u = i / steps;
        const bx = x0 + (x1 - x0) * u, by = y0 + (y1 - y0) * u;
        for (let k = 0; k < 4; k++) {
          const ang = rand() * Math.PI * 2;
          const rr = rand() * (radius - 3);
          const sx = bx + Math.cos(ang) * rr;
          const sy = by + Math.sin(ang) * rr * 0.85;
          const rw = 3 + Math.floor(rand() * 3.5);
          const rh = 2 + Math.floor(rand() * 2.5);
          drawPixelCobbleStone(g, sx, sy, rw, rh, cols[Math.floor(rand() * cols.length)]);
        }
      }
    }
  }

  function drawBridgePixel(g, b) {
    // Render bridge onto local pixel buffer then stamp with nearest-neighbor rotation so pixels stay crisp!
    const bw = b.len + 24, bh = b.halfW * 2 + 28;
    const bc = document.createElement('canvas');
    bc.width = bw; bc.height = bh;
    const bg = bc.getContext('2d');
    bg.imageSmoothingEnabled = false;
    const ox = 12, oy = 14, L = b.len, H2 = b.halfW * 2;

    // Water drop shadow
    bg.fillStyle = 'rgba(20, 34, 32, 0.45)';
    bg.fillRect(ox + 2, oy + 5, L, H2 + 3);

    // Dark pixel outline + side beams
    pxRect(bg, ox - 2, oy - 3, L + 4, H2 + 6, PAL.woodOut);
    pxRect(bg, ox, oy - 2, L, 4, PAL.woodDark);
    pxRect(bg, ox, oy + H2 - 2, L, 4, PAL.woodDark);

    // Individual pixel-outlined wooden planks
    const plankW = 7;
    for (let px = ox + 2; px < ox + L - 3; px += plankW) {
      const alt = (((px - ox) / plankW) | 0) % 2 === 0;
      pxRect(bg, px, oy + 1, plankW - 1, H2 - 2, alt ? PAL.woodHi : PAL.woodMid);
      pxRect(bg, px, oy + 2, plankW - 2, 3, '#b48c68');
      pxRect(bg, px + plankW - 1, oy + 1, 1, H2 - 2, PAL.woodOut);
      // Tiny iron nail pixels
      pxRect(bg, px + 2, oy + 3, 1, 1, PAL.woodDark);
      pxRect(bg, px + 2, oy + H2 - 4, 1, 1, PAL.woodDark);
    }

    // Corner & mid timber posts + sagging rope handrails (matching sheet.jpg!)
    const posts = [ox + 2, ox + (L >> 1) - 2, ox + L - 6];
    for (const railY of [oy - 4, oy + H2 - 2]) {
      for (let x = posts[0] + 3; x < posts[2] + 2; x++) {
        const u = (x - posts[0]) / (posts[2] - posts[0]);
        const sag = Math.round(Math.sin(u * Math.PI) * 3);
        pxRect(bg, x, railY - 4 + sag, 1, 2, PAL.woodOut);
        pxRect(bg, x, railY - 5 + sag, 1, 2, PAL.rope);
      }
      posts.forEach(px => {
        pxRect(bg, px - 1, railY - 8, 7, 11, PAL.woodOut);
        pxRect(bg, px, railY - 7, 5, 9, PAL.woodDark);
        pxRect(bg, px + 1, railY - 7, 3, 3, PAL.woodHi);
      });
    }

    g.save();
    g.translate(b.cx | 0, b.cy | 0);
    g.rotate(b.angle);
    g.imageSmoothingEnabled = false;
    g.drawImage(bc, -bw >> 1, -bh >> 1);
    g.restore();
  }

  function makeCottageSprite(w, h, opts = {}) {
    const c = document.createElement('canvas');
    c.width = w + 16; c.height = h + 16;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    const ox = 8, oy = 6;
    const wallTop = oy + Math.floor(h * 0.48);
    const wallH = h - (wallTop - oy);

    // Ground shadow
    pxDisc(g, ox + w * 0.5, oy + h + 1, w * 0.50, 9, 'rgba(20, 30, 18, 0.32)');

    // Stone chimney (right slope)
    const chX = ox + Math.floor(w * 0.72), chY = oy + 2;
    pxRect(g, chX - 1, chY - 1, 17, 28, PAL.outline);
    pxRect(g, chX, chY, 15, 26, PAL.stoneDark);
    pxRect(g, chX + 1, chY + 2, 6, 4, PAL.stoneHi);
    pxRect(g, chX + 8, chY + 7, 5, 4, PAL.stoneMid);
    pxRect(g, chX + 2, chY + 13, 6, 4, PAL.stoneHi);
    pxRect(g, chX - 2, chY - 2, 19, 4, PAL.outline);
    pxRect(g, chX - 1, chY - 1, 17, 2, PAL.stoneMid);

    // Half-timber plaster walls + cobbled stone plinth
    pxRect(g, ox + 5, wallTop, w - 10, wallH, PAL.outline);
    pxRect(g, ox + 7, wallTop + 2, w - 14, wallH - 4, PAL.plaster);
    pxRect(g, ox + 7, wallTop + 2, w - 14, 5, PAL.plasterLo);
    // Stone foundation
    pxRect(g, ox + 6, wallTop + wallH - 11, w - 12, 10, PAL.stoneDark);
    for (let sx = ox + 8; sx < ox + w - 12; sx += 9) {
      pxRect(g, sx, wallTop + wallH - 9, 6, 4, PAL.stoneMid);
      pxRect(g, sx + 2, wallTop + wallH - 4, 5, 3, PAL.stoneHi);
    }

    // Timber framing (vertical posts, crossbeam, and diagonal medieval braces like sheet.jpg!)
    pxRect(g, ox + 6, wallTop, 5, wallH, PAL.woodDark);
    pxRect(g, ox + w - 11, wallTop, 5, wallH, PAL.woodDark);
    pxRect(g, ox + 6, wallTop + Math.floor(wallH * 0.44), w - 12, 4, PAL.woodDark);
    pxRect(g, ox + Math.floor(w * 0.5) - 2, wallTop, 4, wallH - 10, PAL.woodDark);
    // Diagonal timber braces
    for (let i = 0; i < 14; i++) {
      pxRect(g, ox + 11 + i, wallTop + 4 + i, 3, 2, PAL.woodMid);
      pxRect(g, ox + w - 14 - i, wallTop + 4 + i, 3, 2, PAL.woodMid);
    }

    // Steep terracotta shingled roof with dark pixel outline & staggered tile rows
    const peakX = ox + (w >> 1), peakY = oy + 2;
    for (let ry = peakY; ry <= wallTop + 5; ry++) {
      const t = (ry - peakY) / Math.max(1, (wallTop + 5 - peakY));
      const halfSpan = Math.floor(3 + t * (w * 0.53));
      pxRect(g, peakX - halfSpan - 2, ry, (halfSpan + 2) * 2, 2, PAL.outline);
      const rowBand = ((ry - peakY) / 6) | 0;
      const baseCol = (ry - peakY) % 6 === 0 ? PAL.roofDark : (rowBand % 2 === 0 ? PAL.roofMid : PAL.roofHi);
      pxRect(g, peakX - halfSpan, ry, halfSpan * 2, 1, baseCol);
      // Sunlit left-slope shingle highlights
      if ((ry - peakY) % 6 === 2 && halfSpan > 8) {
        for (let sx = peakX - halfSpan + 3; sx < peakX + halfSpan - 4; sx += 8) {
          pxRect(g, sx, ry, 4, 2, sx < peakX ? PAL.roofSpec : PAL.roofHi);
        }
      }
    }
    // Wooden gable bargeboards along roof eaves
    for (let ry = peakY; ry <= wallTop + 5; ry++) {
      const t = (ry - peakY) / Math.max(1, (wallTop + 5 - peakY));
      const halfSpan = Math.floor(2 + t * (w * 0.51));
      pxRect(g, peakX - halfSpan, ry, 3, 2, PAL.woodHi);
      pxRect(g, peakX + halfSpan - 3, ry, 3, 2, PAL.woodMid);
    }

    // Front gable dormer / attic window (like sheet.jpg!)
    const awx = peakX - 9, awy = oy + Math.floor(h * 0.24);
    pxRect(g, awx - 2, awy - 2, 22, 19, PAL.outline);
    pxRect(g, awx, awy, 18, 15, PAL.woodDark);
    pxRect(g, awx + 2, awy + 2, 14, 11, '#314448');
    pxRect(g, awx + 3, awy + 3, 4, 4, '#6d8d8c');
    pxRect(g, awx + 8, awy + 2, 2, 11, PAL.woodHi);
    pxRect(g, awx + 2, awy + 7, 14, 2, PAL.woodHi);

    // Arched plank door with iron hinges
    const dx = ox + Math.floor(w * 0.22), dy = wallTop + wallH - 31;
    pxRect(g, dx - 2, dy - 2, 24, 32, PAL.outline);
    pxRect(g, dx, dy, 20, 29, PAL.woodMid);
    pxRect(g, dx + 6, dy, 1, 29, PAL.woodDark);
    pxRect(g, dx + 13, dy, 1, 29, PAL.woodDark);
    pxRect(g, dx + 2, dy + 7, 8, 2, PAL.outline);
    pxRect(g, dx + 2, dy + 20, 8, 2, PAL.outline);
    pxRect(g, dx + 15, dy + 14, 3, 3, PAL.gold);
    // Doorstep cobble
    pxRect(g, dx - 3, dy + 29, 26, 4, PAL.stoneMid);

    // Cottage window + flowerbox
    const wx = ox + Math.floor(w * 0.60), wy = wallTop + 9;
    pxRect(g, wx - 2, wy - 2, 24, 20, PAL.outline);
    pxRect(g, wx, wy, 20, 16, opts.warmWindow ? '#d99b4e' : '#395052');
    pxRect(g, wx + 2, wy + 2, 5, 5, opts.warmWindow ? '#fae29c' : '#7ea39e');
    pxRect(g, wx + 9, wy, 2, 16, PAL.woodHi);
    pxRect(g, wx, wy + 7, 20, 2, PAL.woodHi);

    if (opts.flowerBox) {
      pxRect(g, wx - 3, wy + 16, 26, 6, PAL.outline);
      pxRect(g, wx - 2, wy + 17, 24, 4, PAL.woodMid);
      pxRect(g, wx - 2, wy + 14, 24, 4, '#3d6930');
      pxRect(g, wx + 1, wy + 13, 3, 3, PAL.acc);
      pxRect(g, wx + 9, wy + 12, 3, 3, PAL.gold);
      pxRect(g, wx + 16, wy + 13, 3, 3, PAL.acc);
    }
    return c;
  }

  function makePineSprite() {
    const c = document.createElement('canvas');
    c.width = 56; c.height = 72;
    const g = c.getContext('2d');
    const cx = 28, by = 64;
    pxDisc(g, cx, by + 2, 19, 7, 'rgba(18, 28, 16, 0.34)');
    pxRect(g, cx - 5, by - 10, 10, 12, PAL.outline);
    pxRect(g, cx - 4, by - 9, 8, 10, PAL.woodDark);
    const tiers = [
      { y: by - 8,  w: 23, h: 20 },
      { y: by - 22, w: 19, h: 19 },
      { y: by - 36, w: 15, h: 17 },
      { y: by - 48, w: 10, h: 14 }
    ];
    tiers.forEach(t => {
      for (let r = 0; r <= t.h; r++) {
        const u = r / t.h;
        const span = Math.max(1, Math.floor(u * t.w));
        const jag = (r > t.h - 3 && r % 2 === 0) ? 2 : 0;
        const py = t.y - t.h + r;
        pxRect(g, cx - span - 1 + jag, py, (span + 1 - jag) * 2, 2, PAL.outline);
        pxRect(g, cx - span + jag, py, (span - jag) * 2, 1, PAL.pineDark);
        if (span > 3) {
          pxRect(g, cx - span + 2, py, Math.max(2, Math.floor(span * 1.4)), 1, PAL.pineMid);
        }
        if (span > 5 && r < t.h - 3) {
          pxRect(g, cx - span + 3, py, Math.max(2, Math.floor(span * 0.75)), 1, PAL.pineHi);
        }
        if (span > 7 && r % 4 === 2) {
          pxRect(g, cx - Math.floor(span * 0.55), py, 3, 1, PAL.pineSpec);
        }
      }
    });
    return c;
  }

  function makeOakSprite(cutStump = false) {
    const c = document.createElement('canvas');
    c.width = 68; c.height = 74;
    const g = c.getContext('2d');
    const cx = 34, by = 65;
    if (cutStump) {
      pxDisc(g, cx, by + 2, 14, 6, 'rgba(18, 28, 16, 0.28)');
      pxRect(g, cx - 8, by - 7, 16, 9, PAL.outline);
      pxRect(g, cx - 7, by - 6, 14, 7, PAL.woodDark);
      pxDisc(g, cx, by - 6, 7, 3, '#cfa97e');
      return c;
    }
    pxDisc(g, cx, by + 2, 22, 8, 'rgba(18, 28, 16, 0.32)');
    // Gnarled pixel trunk & roots
    pxRect(g, cx - 7, by - 22, 14, 24, PAL.outline);
    pxRect(g, cx - 5, by - 21, 10, 22, PAL.woodDark);
    pxRect(g, cx - 4, by - 20, 4, 20, PAL.woodMid);
    // Clustered pixel-outlined leaf puffs
    const puffs = [
      [-14, -30, 14, 12], [14, -29, 14, 12], [0, -26, 16, 12],
      [-13, -40, 14, 12], [12, -39, 13, 12], [0, -46, 16, 13]
    ];
    puffs.forEach(([dx, dy, rx, ry]) => pxDisc(g, cx + dx, by + dy, rx + 2, ry + 2, PAL.outline));
    puffs.forEach(([dx, dy, rx, ry]) => pxDisc(g, cx + dx, by + dy, rx, ry, PAL.oakDark));
    puffs.forEach(([dx, dy, rx, ry]) => pxDisc(g, cx + dx - 1, by + dy - 2, rx * 0.84, ry * 0.82, PAL.oakMid));
    [[-11, -42, 9, 7], [9, -40, 8, 7], [-2, -49, 11, 8], [-6, -32, 8, 6]].forEach(([dx, dy, rx, ry]) => {
      pxDisc(g, cx + dx, by + dy, rx, ry, PAL.oakHi);
      pxDisc(g, cx + dx - 2, by + dy - 2, rx * 0.55, ry * 0.5, PAL.oakBright);
    });
    return c;
  }

  const pineSpr = makePineSprite();

  function drawStoneWellPixel(g, x, y, sealed) {
    pxDisc(g, x, y + 7, 22, 9, 'rgba(18, 28, 16, 0.30)');
    // Circular stone rim + wall
    pxDisc(g, x, y + 3, 19, 8, PAL.outline);
    pxRect(g, x - 19, y - 9, 38, 13, PAL.outline);
    pxRect(g, x - 17, y - 8, 34, 11, PAL.stoneDark);
    pxRect(g, x - 14, y - 6, 8, 4, PAL.stoneHi);
    pxRect(g, x - 3, y - 7, 9, 4, PAL.stoneMid);
    pxRect(g, x + 8, y - 6, 7, 4, PAL.stoneHi);
    pxDisc(g, x, y - 9, 19, 8, PAL.outline);
    pxDisc(g, x, y - 9, 17, 7, PAL.stoneMid);
    if (sealed) {
      pxRect(g, x - 16, y - 13, 32, 8, PAL.outline);
      pxRect(g, x - 15, y - 12, 30, 6, PAL.woodMid);
      pxRect(g, x - 15, y - 9, 30, 1, PAL.outline);
    } else {
      pxDisc(g, x, y - 9, 11, 4, '#243c3c');
    }
    // Wooden posts & shingled well roof
    pxRect(g, x - 15, y - 33, 4, 25, PAL.outline);
    pxRect(g, x - 14, y - 32, 2, 23, PAL.woodMid);
    pxRect(g, x + 11, y - 33, 4, 25, PAL.outline);
    pxRect(g, x + 12, y - 32, 2, 23, PAL.woodMid);
    for (let r = 0; r <= 14; r++) {
      const span = 4 + Math.floor((r / 14) * 18);
      pxRect(g, x - span - 1, y - 44 + r, (span + 1) * 2, 2, PAL.outline);
      pxRect(g, x - span, y - 44 + r, span * 2, 1, r % 4 === 0 ? PAL.roofDark : PAL.roofMid);
    }
  }

  function drawSignpostPixel(g, x, y, hasMarigolds) {
    pxDisc(g, x, y + 2, 8, 3, 'rgba(18, 28, 16, 0.28)');

  function drawCratePixel(g, x, y) {

  function drawLanternPixel(g, x, y, lit) {
    pxRect(g, x - 2, y - 28, 5, 29, PAL.outline);
    pxRect(g, x - 1, y - 27, 3, 27, PAL.woodDark);
    pxRect(g, x - 1, y - 27, 11, 3, PAL.outline);
    pxRect(g, x + 6, y - 24, 7, 9, PAL.outline);
    pxRect(g, x + 7, y - 23, 5, 7, lit ? '#fae084' : '#75827c');
    if (lit) {
      g.fillStyle = 'rgba(255, 224, 120, 0.26)';
      g.beginPath(); g.arc(x + 9, y - 20, 18, 0, Math.PI * 2); g.fill();
    }

  function drawFencePixel(g, x, y, w) {
    for (let px = x; px <= x + w; px += 12) {
      pxRect(g, px - 1, y - 12, 5, 13, PAL.outline);
      pxRect(g, px, y - 11, 3, 11, PAL.woodDark);
    }
    pxRect(g, x, y - 9, w + 4, 3, PAL.outline);
    pxRect(g, x + 1, y - 8, w + 2, 2, PAL.woodMid);
    pxRect(g, x, y - 4, w + 4, 3, PAL.outline);
    pxRect(g, x + 1, y - 3, w + 2, 2, PAL.woodMid);
  }

  function buildWorld() {
    seed = INITIAL_SEED;
    pxRect(wctx, 0, 0, WORLD_W, WORLD_H, PAL.grassBase);

    // Rich 16-bit meadow dither & sunlit moss patches
    for (let i = 0; i < 650; i++) {
      const gx = Math.floor(rand() * (WORLD_W / 2)) * 2;
      const gy = Math.floor(rand() * (WORLD_H / 2)) * 2;
      const rx = 8 + Math.floor(rand() * 22);
      const ry = 5 + Math.floor(rand() * 12);
      const col = rand() < 0.48 ? PAL.grassHi : (rand() < 0.78 ? PAL.grassLo : PAL.grassBright);
      pxDisc(wctx, gx, gy, rx, ry, col);
    }
    // Crisp pixel grass blade tufts
    for (let i = 0; i < 1100; i++) {
      const tx = Math.floor(rand() * WORLD_W);
      const ty = Math.floor(rand() * WORLD_H);
      const c = rand() < 0.5 ? PAL.grassDeep : PAL.grassBright;
      pxRect(wctx, tx, ty, 1, 3, c);
      pxRect(wctx, tx + 2, ty + 1, 1, 2, c);
    }

    // Stepped 16-bit rocky/earthy riverbanks + deep teal creek (matching sheet.jpg!)
    for (let y = 0; y < WORLD_H; y += 2) {
      const cx = riverCenterX(y);
      const hw = riverHalfWidth(y);
      pxRect(wctx, cx - hw - 10, y, (hw + 10) * 2, 2, PAL.grassDeep);
      pxRect(wctx, cx - hw - 7,  y, (hw + 7) * 2,  2, PAL.outline);
      pxRect(wctx, cx - hw - 5,  y, (hw + 5) * 2,  2, PAL.bankTop);
      pxRect(wctx, cx - hw - 2,  y, (hw + 2) * 2,  2, PAL.bankDark);
      pxRect(wctx, cx - hw,      y, hw * 2,        2, PAL.riverHi);
      pxRect(wctx, cx - hw + 6,  y, (hw - 6) * 2,  2, PAL.riverMid);
      pxRect(wctx, cx - hw * 0.52, y, hw * 1.04,   2, PAL.riverDeep);
    }

    // Shoreline boulders
    for (let y = 12; y < WORLD_H - 12; y += 22) {
      const cx = riverCenterX(y), hw = riverHalfWidth(y);
      for (const s of [-1, 1]) {
        if (rand() < 0.65) {
          const rx = cx + s * (hw - 1 + rand() * 4);
          pxDisc(wctx, rx, y, 5, 4, PAL.outline);
          pxDisc(wctx, rx, y, 4, 3, PAL.stoneMid);
          pxRect(wctx, rx - 2, y - 2, 2, 1, PAL.stoneHi);
        }
      }
    }

    // Warm dirt clearings around cottages & well
    pxDisc(wctx, 248, 152, 34, 16, PAL.dirtBase);
    pxDisc(wctx, 735, 164, 48, 22, PAL.dirtBase);
    pxDisc(wctx, 862, 168, 36, 16, PAL.dirtBase);
    pxDisc(wctx, 78,  290, 32, 16, PAL.dirtBase);

    // Winding outlined cobblestone paths (matching sheet.jpg layout & exact bridge approaches)
    const paths = [
      [[10, 192], [110, 190], [242, 194], [368, 194], [442, 228], [518, 210], [596, 190]],
      [[92, 190], [92, 134]],
      [[242, 194], [242, 146]],
      [[148, 192], [156, 276]],
      [[368, 194], [402, 128], [468, 104], [536, 82]],
      [[536, 82], [598, 124], [676, 190], [770, 200], [872, 198], [872, 160]],
      [[596, 190], [676, 194]],
      [[780, 200], [835, 280]]
    ];
    paths.forEach(pts => drawCobblePath(wctx, pts, 17));

    // Bridges stamped cleanly onto world
    BRIDGES.forEach(b => drawBridgePixel(wctx, b));

    // Swaying meadow wildflowers
    const flowerCols = [PAL.acc, PAL.gold, '#eef6f0', '#df7d96'];
    for (let i = 0; i < 120; i++) {
      const fx = 20 + rand() * (WORLD_W - 40);
      const fy = 24 + rand() * (WORLD_H - 44);
      if (Math.abs(fx - riverCenterX(fy)) < riverHalfWidth(fy) + 16) continue;
      wildflowers.push({
        x: fx | 0, y: fy | 0,
        color: flowerCols[Math.floor(rand() * flowerCols.length)],
        phase: rand() * Math.PI * 2
      });
    }

    // Y-sorted pixel props & architecture
    ySortedProps.length = 0;
    ySortedProps.push({ y: 110, draw: (g) => g.drawImage(cottageElder, 16, -12) });
    ySortedProps.push({ y: 136, draw: (g) => g.drawImage(cottageMiller, 192, 2) });
    ySortedProps.push({ y: 402, draw: (g) => g.drawImage(cottageSouth, 10, 276) });
    ySortedProps.push({ y: 154, draw: (g) => g.drawImage(cottageBaker, 798, 18) });

    ySortedProps.push({ y: 162, draw: (g) => drawStoneWellPixel(g, 724, 146, S.completedQuestIds.has('q_well')) });
    ySortedProps.push({ y: 168, draw: (g) => drawSignpostPixel(g, 412, 164, S.completedQuestIds.has('q_marigold')) });
    ySortedProps.push({ y: 175, draw: (g) => drawLanternPixel(g, 24, 172, S.completedQuestIds.has('q_lantern') || S.day >= 3) });
    ySortedProps.push({ y: 168, draw: (g) => drawLanternPixel(g, 796, 164, S.humanDone > 0 || S.day >= 2) });

    ySortedProps.push({ y: 136, draw: (g) => drawBarrelPixel(g, 192, 132) });
    ySortedProps.push({ y: 104, draw: (g) => drawBarrelPixel(g, 18, 98) });
    ySortedProps.push({ y: 138, draw: (g) => drawCratePixel(g, 338, 134) });
    ySortedProps.push({ y: 160, draw: (g) => drawCratePixel(g, 784, 156) });
    ySortedProps.push({ y: 168, draw: (g) => drawCratePixel(g, 795, 165) });

    ySortedProps.push({ y: 92,  draw: (g) => drawFencePixel(g, 142, 88, 38) });
    ySortedProps.push({ y: 256, draw: (g) => drawFencePixel(g, 636, 252, 64) });

    const pines = [
      [168, 122], [358, 118], [134, 308], [228, 296], [332, 292],
      [392, 298], [964, 108], [992, 168], [968, 286]
    ];
    pines.forEach(([px, py]) => {
      ySortedProps.push({ y: py, draw: (g) => g.drawImage(pineSpr, px - 28, py - 64) });
    });

    const oaks = [
      [284, 318, false], [666, 122, true], [752, 108, true],
      [592, 54, false],  [622, 326, false], [906, 324, false]
    ];
    oaks.forEach(([ox, oy, eastShade]) => {
      ySortedProps.push({
        y: oy,
        draw: (g) => {
          const cut = eastShade && S.completedQuestIds.has('q_orchard');
          g.drawImage(cut ? oakStumpSpr : oakSpr, ox - 34, oy - 65);
        }
      });
    });
  }

  buildWorld();
  S.camX = Math.max(0, Math.min(WORLD_W - PW, S.x - PW * 0.44));
  S.camY = Math.max(0, Math.min(WORLD_H - PH, S.y - PH * 0.48));

  // --- Input & Spatial Actions ---
  const keys = new Set();

  function getNextQuestFor(v) {
    for (const q of v.quests) {
      if (!S.completedQuestIds.has(q.id) && !S.declinedQuestIds.has(q.id)) return q;
    }

  }

  function triggerNotebookFlip(targetVillagerId, scratch = false) {
    S.pageFlip = 1.0;
    S.pencilAnim = 1.15;
    S.notePeekTimer = Math.max(S.notePeekTimer, 1.35);
    if (targetVillagerId) S.pencilTargetId = targetVillagerId;
    sfx(scratch ? 'scratch' : 'flip');
  }

  function cycleVillagerTag(v) {
    const idx = TAG_STATES.indexOf(v.noteTag);
    v.noteTag = TAG_STATES[(idx + 1) % TAG_STATES.length];
    triggerNotebookFlip(v.id, true);
  }

  function openTalk(v) {
    S.walkTarget = null;
    S.walkTalkVillagerId = null;
    S.activeVillagerId = v.id;
    S.activeQuest = getNextQuestFor(v);
    S.talkChoice = 0;
    S.typeChars = 0;
    const idx = VILLAGERS.findIndex(x => x.id === v.id);
    if (idx >= 0) S.notesCursor = idx;
    S.pageFlip = 0.85;
    S.phase = 'talk';
    sfx('talk');
  }

  function acceptActiveQuest() {
    const v = VILLAGERS.find(x => x.id === S.activeVillagerId);
    const q = S.activeQuest;
    if (!v || !q) {
      S.phase = 'village';
      return;
    }
    S.completedQuestIds.add(q.id);
    S.questsResolved++;
    if (q.isAI) {
      S.aiDone++;
      S.questOutcomeWasAI = true;
      S.questOutcomeText = q.effect;
      sfx('ai_bad');
    } else {
      S.humanDone++;
      S.questOutcomeWasAI = false;
      S.questOutcomeText = q.effect;
      sfx('human_ok');
    }
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      S.particles.push({
        x: v.x, y: v.y - 16,
        vx: Math.cos(a) * (18 + rand() * 24),
        vy: Math.sin(a) * (18 + rand() * 24) - 14,
        life: 0.9,
        color: q.isAI ? PAL.acc : PAL.gold
      });
    }
    S.day = Math.min(S.maxDays, 1 + Math.floor(S.questsResolved / 2));
    S.questBeatTimer = 0.85;
    S.phase = 'quest';
  }

  function declineActiveQuest() {
    const q = S.activeQuest;
    if (q) {
      S.declinedQuestIds.add(q.id);
      S.declinedCount++;
      S.questsResolved++;
      S.day = Math.min(S.maxDays, 1 + Math.floor(S.questsResolved / 2));
    }
    sfx('decline');
    if (S.questsResolved >= 6) {
      S.phase = 'end';
    } else {
      S.phase = 'village';
    }
  }

  function resetGame() {
    S.phase = 'village';
    S.day = 1;
    S.x = 292; S.y = 192;
    S.walkTarget = null;
    S.walkTalkVillagerId = null;
    S.humanDone = 0; S.aiDone = 0; S.declinedCount = 0; S.questsResolved = 0;
    S.completedQuestIds.clear();
    S.declinedQuestIds.clear();
    VILLAGERS[0].noteTag = '? AI';
    VILLAGERS[1].noteTag = 'human';
    for (let i = 2; i < VILLAGERS.length; i++) VILLAGERS[i].noteTag = 'unknown';
    S.notePeekTimer = 0;
    sfx('flip');
  }

  window.addEventListener('keydown', (e) => {
    unlockAudio();
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
      e.preventDefault();
    }
    keys.add(e.code);
    if (e.repeat) return;

    if (S.phase === 'title') {
      if (e.code === 'Enter' || e.code === 'Space') {
        S.phase = 'village';
        sfx('talk');
      }
      return;
    }

    if (S.phase === 'end') {
      if (e.code === 'KeyR' || e.code === 'Enter' || e.code === 'Space') {
        resetGame();
      }
      return;
    }

    if (S.phase === 'notes') {
      if (e.code === 'KeyN' || e.code === 'Escape') {
        S.phase = 'village';
        S.notePeekTimer = 0;
        sfx('flip');
      } else if (e.code === 'ArrowUp' || e.code === 'KeyW') {
        S.notesCursor = (S.notesCursor + VILLAGERS.length - 1) % VILLAGERS.length;
        sfx('blip');
      } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
        S.notesCursor = (S.notesCursor + 1) % VILLAGERS.length;
        sfx('blip');
      } else if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight' || e.code === 'KeyT') {
        cycleVillagerTag(VILLAGERS[S.notesCursor]);
      } else if (e.code === 'KeyV') {
        S.phase = 'end';
        sfx('human_ok');
      } else if (e.code === 'KeyR') {
        resetGame();
      }
      return;
    }

    if (S.phase === 'talk') {
      if (e.code === 'KeyN' || e.code === 'KeyT') {
        const idx = VILLAGERS.findIndex(v => v.id === S.activeVillagerId);
        if (idx >= 0) {
          S.notesCursor = idx;
          cycleVillagerTag(VILLAGERS[idx]);
        }
        return;
      }
      if (!S.activeQuest) {
        if (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape' || e.code === 'KeyD') {
          S.phase = 'village';
        }
        return;
      }
      if (e.code === 'ArrowLeft') { S.talkChoice = 0; sfx('blip'); }
      else if (e.code === 'ArrowRight') { S.talkChoice = 1; sfx('blip'); }
      else if (e.code === 'KeyA') { acceptActiveQuest(); }
      else if (e.code === 'KeyD') { declineActiveQuest(); }
      else if (e.code === 'Escape') { S.phase = 'village'; }
      else if (e.code === 'Enter' || e.code === 'Space') {
        if (S.typeChars < 20) {
          S.typeChars = 999;
        } else {
          S.talkChoice === 0 ? acceptActiveQuest() : declineActiveQuest();
        }
      }
      return;
    }

    if (S.phase === 'quest') {
      if (e.code === 'Space' || e.code === 'Enter') {
        S.questBeatTimer = 0.02;
      }
      return;
    }

    if (S.phase === 'village') {
      if (e.code === 'KeyN') {
        if (S.nearVillagerId) {
          const idx = VILLAGERS.findIndex(v => v.id === S.nearVillagerId);
          if (idx >= 0) S.notesCursor = idx;
        }
        S.phase = 'notes';
        triggerNotebookFlip(VILLAGERS[S.notesCursor].id, false);
      } else if (e.code === 'KeyT' && S.nearVillagerId) {
        const v = VILLAGERS.find(x => x.id === S.nearVillagerId);
        if (v) cycleVillagerTag(v);
      } else if (e.code === 'KeyR') {
        resetGame();
      } else if (e.code === 'Space' || e.code === 'Enter') {
        if (S.nearVillagerId) {
          const v = VILLAGERS.find(x => x.id === S.nearVillagerId);
          if (v) openTalk(v);
        }
      }
    }
  });

  window.addEventListener('keyup', (e) => keys.delete(e.code));

  // --- Spatial Pointer Controls (Click villagers, ground, dialogue choices, or notebook rows) ---
  function isNotebookVisible() {
    return S.phase === 'talk' || S.phase === 'quest' || S.phase === 'notes' || S.notePeekTimer > 0.02;
  }

  function notebookRect() {
    const expanded = S.phase === 'notes';
    return expanded
      ? { x: 856, y: 278, w: 388, h: 406, expanded: true }
      : { x: 916, y: 408, w: 332, h: 278, expanded: false };
  }

  canvas.addEventListener('pointerdown', (e) => {
    unlockAudio();
    const rect = canvas.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * W;
    const my = ((e.clientY - rect.top) / rect.height) * H;

    if (S.phase === 'title') {
      S.phase = 'village';
      sfx('talk');
      return;
    }
    if (S.phase === 'end') {
      resetGame();
      return;
    }

    // Tucked corner bookmark tab when Notebook is closed
    if (!isNotebookVisible() && mx >= 1188 && my >= 668) {
      S.phase = 'notes';
      triggerNotebookFlip(VILLAGERS[S.notesCursor].id, false);
      return;
    }

    // Active Notebook interaction
    if (isNotebookVisible()) {
      const nb = notebookRect();
      if (mx >= nb.x - 8 && mx <= nb.x + nb.w + 12 && my >= nb.y - 8 && my <= nb.y + nb.h + 8) {
        const list = getVisibleNotebookVillagers(nb.expanded);
        const startY = nb.y + 74;
        const rowH = nb.expanded ? 42 : 44;
        const row = Math.floor((my - (startY - 24)) / rowH);
        if (row >= 0 && row < list.length) {
          const targetV = list[row];
          S.notesCursor = VILLAGERS.indexOf(targetV);
          cycleVillagerTag(targetV);
        } else if (nb.expanded && my > nb.y + nb.h - 44) {
          S.phase = 'end';
          sfx('human_ok');
        } else if (!nb.expanded) {
          S.phase = 'notes';
          triggerNotebookFlip(VILLAGERS[S.notesCursor].id, false);
        }
        return;
      } else if (S.phase === 'notes') {
        S.phase = 'village';
        S.notePeekTimer = 0;
        sfx('flip');
        return;
      }
    }

    // Dialogue box accept / decline direct clicks
    if (S.phase === 'talk') {
      if (!S.activeQuest) {
        S.phase = 'village';
        return;
      }
      if (my >= 596 && my <= 672) {
        if (mx >= 56 && mx <= 212) { S.talkChoice = 0; acceptActiveQuest(); return; }
        if (mx >= 214 && mx <= 388) { S.talkChoice = 1; declineActiveQuest(); return; }
      }
      if (S.typeChars < 24) S.typeChars = 999;
      return;
    }

    // World spatial click: walk to villager or meadow point!
    if (S.phase === 'village') {
      const wx = S.camX + mx * 0.5;
      const wy = S.camY + my * 0.5;
      let clickedV = null;
      for (const v of VILLAGERS) {
        if (Math.hypot(wx - v.x, (wy + 12) - v.y) < 26) {
          clickedV = v;
          break;
        }
      }
      if (clickedV) {
        if (Math.hypot(clickedV.x - S.x, clickedV.y - S.y) <= 56) {
          openTalk(clickedV);
        } else {
          S.walkTarget = { x: clickedV.x - (clickedV.x > S.x ? 24 : -24), y: clickedV.y + 12 };
          S.walkTalkVillagerId = clickedV.id;
        }
      } else {
        S.walkTarget = { x: wx, y: wy };
        S.walkTalkVillagerId = null;
      }
    }
  });

  window.__game = {
    get state() {
      return {
        phase: S.phase,
        day: S.day,
        x: Math.round(S.x),
        y: Math.round(S.y),
        camX: Math.round(S.camX),
        camY: Math.round(S.camY),
        nearVillager: S.nearVillagerId,
        activeVillager: S.activeVillagerId,
        hasQuest: !!S.activeQuest,
        talkChoice: S.talkChoice,
        notebookOpen: isNotebookVisible(),
        humanDone: S.humanDone,
        aiDone: S.aiDone,
        declinedCount: S.declinedCount,
        questsResolved: S.questsResolved,
        notesCursor: S.notesCursor,
        villagers: VILLAGERS.map(v => ({
          id: v.id,
          x: v.x,
          y: v.y,
          tag: v.noteTag,
          hasQuest: !!getNextQuestFor(v)
        })),
        t: +S.t.toFixed(2)
      };
    }
  };

  let lastNow = performance.now();
  function update(dt) {
    S.t += dt;
    if (S.pageFlip > 0) S.pageFlip = Math.max(0, S.pageFlip - dt * 2.6);
    if (S.pencilAnim > 0) S.pencilAnim = Math.max(0, S.pencilAnim - dt * 1.25);
    if (S.notePeekTimer > 0) S.notePeekTimer = Math.max(0, S.notePeekTimer - dt);

    // Hearth chimney smoke puffs
    if (rand() < dt * 3.2) {
      smokePuffs.push({ x: 300, y: 20, vx: 4 + rand() * 5, vy: -9 - rand() * 4, r: 3, life: 1.0 });
      smokePuffs.push({ x: 907, y: 36, vx: 4 + rand() * 5, vy: -9 - rand() * 4, r: 3, life: 1.0 });
    }
    for (let i = smokePuffs.length - 1; i >= 0; i--) {
      const p = smokePuffs[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 3.5; p.life -= dt * 0.45;
      if (p.life <= 0) smokePuffs.splice(i, 1);
    }
    for (let i = S.particles.length - 1; i >= 0; i--) {
      const p = S.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 34 * dt; p.life -= dt;
      if (p.life <= 0) S.particles.splice(i, 1);
    }

    if (S.phase === 'talk') {
      const prev = Math.floor(S.typeChars);
      S.typeChars += dt * 56;
      if (Math.floor(S.typeChars) > prev && Math.floor(S.typeChars) % 3 === 0 && S.typeChars < 58) {
        sfx('blip');
      }
    }

    if (S.phase === 'quest') {
      S.questBeatTimer -= dt;
      if (S.questBeatTimer <= 0) {
        if (S.aiDone >= 3 || S.questsResolved >= 6) {
          S.phase = 'end';
        } else {
          S.phase = 'village';
        }
      }
    }

    if (S.phase === 'village') {
      let ix = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
      let iy = (keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0) - (keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0);

      if (ix !== 0 || iy !== 0) {
        S.walkTarget = null;
        S.walkTalkVillagerId = null;
      } else if (S.walkTarget) {
        const dxT = S.walkTarget.x - S.x, dyT = S.walkTarget.y - S.y;
        const distT = Math.hypot(dxT, dyT);
        if (distT < 8) {
          S.walkTarget = null;
          if (S.walkTalkVillagerId) {
            const tv = VILLAGERS.find(x => x.id === S.walkTalkVillagerId);
            S.walkTalkVillagerId = null;
            if (tv) openTalk(tv);
          }
        } else {
          ix = dxT / distT;
          iy = dyT / distT;
        }
      }

      const mag = Math.hypot(ix, iy) || 1;
      const speed = 138; // World units/s in 640x360 pixel space (= 276 px/s at 720p)
      const dx = (ix / mag) * speed * dt;
      const dy = (iy / mag) * speed * dt;

      if (Math.abs(ix) > 0.08) S.facing = ix > 0 ? 1 : -1;
      if (Math.abs(ix) > 0.01 || Math.abs(iy) > 0.01) {
        S.walkTime += dt * 11.5;
        S.stepCooldown -= dt;
        if (S.stepCooldown <= 0) {
          S.stepCooldown = 0.21;
          sfx('step');
        }
        let moved = false;
        if (isWalkable(S.x + dx, S.y)) { S.x += dx; moved = true; }
        if (isWalkable(S.x, S.y + dy)) { S.y += dy; moved = true; }
        if (!moved && S.walkTarget) S.walkTarget = null;
      } else {
        S.walkTime = 0;
      }

      let best = null, bestD = 58;
      for (const v of VILLAGERS) {
        const d = Math.hypot(v.x - S.x, v.y - S.y);
        if (d < bestD) { bestD = d; best = v.id; }
      }
      S.nearVillagerId = best;
    }

    const targetCamX = Math.max(0, Math.min(WORLD_W - PW, S.x - PW * 0.44));
    const targetCamY = Math.max(0, Math.min(WORLD_H - PH, S.y - PH * 0.48));
    const k = 1 - Math.exp(-6.0 * dt);
    S.camX += (targetCamX - S.camX) * k;
    S.camY += (targetCamY - S.camY) * k;
  }

  function drawPlayerPixel(g, x, y) {
    const px = Math.round(x), py = Math.round(y);
    const bob = S.walkTime > 0 ? (Math.abs(Math.sin(S.walkTime)) > 0.5 ? 2 : 0) : (Math.sin(S.t * 2.8) > 0.6 ? 1 : 0);

    pxDisc(g, px, py + 2, 8, 4, 'rgba(18, 28, 16, 0.36)');

    if (playerSprite) {
      g.save();
      g.translate(px, py - bob);
      g.scale(S.facing, 1);
      g.imageSmoothingEnabled = false;
      const w = playerSprite.width, h = playerSprite.height;
      g.drawImage(playerSprite, -w >> 1, -h + 3);
      // Animated pixel boot stride
      if (S.walkTime > 0) {
        const step = Math.sin(S.walkTime) > 0 ? 1 : -1;
        pxRect(g, step * 3 - 2, 1, 4, 2, '#1c1815');
      }
      g.restore();
    } else {
      pxRect(g, px - 6, py - 28 - bob, 12, 28, PAL.outline);
    }
  }

  function drawVillagerPixel(g, v) {
    const spr = npcSprites[v.spriteIdx];
    let offX = 0, offY = 0;

    if (v.isAI) {
      // Uncanny rigid sub-second loop tick (fair, observable Turing clue!)
      const period = 0.72;
      const phase = S.t % period;
      const tick = Math.floor(S.t / period) % 2;
      offY = tick === 0 ? 0 : -2;
      if (phase < 0.055) offX = tick === 0 ? 1 : -1;
    } else {
      // Warm organic sinusoidal breath
      const phase = S.t * 2.3 + v.spriteIdx * 1.4;
      offY = Math.round(Math.sin(phase) * 1.1);
    }

    const vx = Math.round(v.x + offX), vy = Math.round(v.y);
    pxDisc(g, vx, vy + 2, 9, 4, 'rgba(18, 28, 16, 0.34)');

    // Spatial proximity cue ONLY beside the villager currently approached!
    if (S.nearVillagerId === v.id && S.phase === 'village') {
      pxDisc(g, vx, vy + 2, 12, 5, 'rgba(235, 208, 120, 0.48)');
    }

    if (spr) {
      g.drawImage(spr, vx - (spr.width >> 1), vy - spr.height + 3 + offY);
    }
  }

  function drawWaterAndWorldTraces(g, camX, camY) {
    // Pixel-art water ripples & shoreline shimmer
    for (let y = Math.max(8, Math.floor(camY / 22) * 22); y < Math.min(WORLD_H - 8, camY + PH + 22); y += 22) {
      const cx = riverCenterX(y), hw = riverHalfWidth(y);
      const wave = Math.round(Math.sin(S.t * 2.1 + y * 0.08) * 5);
      pxRect(g, cx - 14 + wave, y, 10, 1, PAL.foam);
      pxRect(g, cx + 4 + wave, y + 2, 8, 1, PAL.foam);
      pxRect(g, cx - hw + 5, y + 6, 4, 1, 'rgba(222, 238, 231, 0.65)');
      pxRect(g, cx + hw - 9, y + 11, 4, 1, 'rgba(222, 238, 231, 0.65)');
    }

    // Permanent world consequences from accepted quests (Law 6 & Law 9)
    if (S.completedQuestIds.has('q_bridge')) {
      const b = BRIDGES[1];
      pxDisc(g, b.cx, b.cy, 28, 11, 'rgba(24, 16, 14, 0.72)');
      pxDisc(g, b.cx - 8, b.cy + 2, 12, 5, '#2b1f1b');
    }
    if (S.completedQuestIds.has('q_grain')) {
      for (let y = 210; y < 350; y += 28) {
        const cx = riverCenterX(y);
        pxDisc(g, cx + Math.sin(S.t + y) * 6, y, 14, 5, 'rgba(236, 232, 218, 0.55)');
      }
    }
    if (S.completedQuestIds.has('q_chalk')) {
      const b = BRIDGES[1];
      pxRect(g, b.cx - 22, b.cy + 12, 8, 2, '#f4f2e8');
    }
  }

  function getVisibleNotebookVillagers(expanded) {
    if (expanded) return VILLAGERS;
    // Contextual compact Notebook: prioritize Miller, Baker, and whoever is being inspected right now!
    const focusId = S.activeVillagerId || S.nearVillagerId || S.pencilTargetId;
    const base = [VILLAGERS[0], VILLAGERS[1]]; // miller, baker (matches sheet.jpg!)
    if (focusId) {
      const fv = VILLAGERS.find(v => v.id === focusId);
      if (fv && !base.includes(fv)) base.push(fv);
    }
    for (const v of VILLAGERS) {
      if (base.length >= 3) break;
      if (v.noteTag !== 'unknown' && !base.includes(v)) base.push(v);
    }
    return base;
  }

  function drawPencilIcon(g, tipX, tipY) {
    g.save();
    g.translate(tipX, tipY);
    g.rotate(-0.72);
    g.fillStyle = '#252522';
    g.beginPath(); g.moveTo(0, 0); g.lineTo(8, -4); g.lineTo(8, 4); g.closePath(); g.fill();
    g.fillStyle = '#e6c594';
    g.beginPath(); g.moveTo(7, -4); g.lineTo(17, -7); g.lineTo(17, 7); g.lineTo(7, 4); g.closePath(); g.fill();
    g.fillStyle = '#e2b949';
    g.fillRect(17, -7, 42, 14);
    g.strokeStyle = '#3b2e1e';
    g.lineWidth = 2;
    g.strokeRect(17, -7, 42, 14);
    g.fillStyle = '#b9c0bd';
    g.fillRect(59, -7, 7, 14);
    g.fillStyle = '#d97b73';
    g.fillRect(66, -7, 9, 14);
    g.strokeRect(66, -7, 9, 14);
    g.restore();
  }

  function drawTuckedNotebookTab() {
    // Minimal tucked corner leather tab when walking freely — zero river/meadow obstruction!
    const tx = 1196, ty = 676, tw = 66, th = 32;
    ctx.save();
    ctx.fillStyle = 'rgba(20, 28, 18, 0.55)';
    ctx.fillRect(tx + 3, ty + 3, tw, th);
    ctx.fillStyle = '#5a4531';
    ctx.fillRect(tx, ty, tw, th);
    ctx.strokeStyle = PAL.boxBorder;
    ctx.lineWidth = 2;
    ctx.strokeRect(tx, ty, tw, th);
    ctx.fillStyle = PAL.paper;
    ctx.fillRect(tx + 5, ty + 5, tw - 10, th - 6);
    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('[N]', tx + tw * 0.5, ty + 22);
    ctx.restore();
  }

  function drawNotebookWidget() {
    if (!isNotebookVisible()) {
      if (S.phase === 'village') drawTuckedNotebookTab();
      return;
    }

    const nb = notebookRect();
    const { x: nx, y: ny, w: nw, h: nh, expanded } = nb;

    ctx.save();
    ctx.fillStyle = 'rgba(16, 24, 14, 0.44)';
    ctx.fillRect(nx + 6, ny + 8, nw, nh);

    // Leather cover + index tabs (matching sheet.jpg!)
    ctx.fillStyle = '#5a4531';
    ctx.fillRect(nx - 6, ny - 6, nw + 12, nh + 12);
    ctx.strokeStyle = '#241c14';
    ctx.lineWidth = 2;
    ctx.strokeRect(nx - 6, ny - 6, nw + 12, nh + 12);

    ctx.fillStyle = '#4f7ea8';
    ctx.fillRect(nx + nw + 4, ny + 42, 9, 32);
    ctx.fillStyle = '#d9b44a';
    ctx.fillRect(nx + nw + 4, ny + 78, 9, 32);

    ctx.fillStyle = PAL.paper;
    ctx.fillRect(nx, ny, nw, nh);
    ctx.strokeStyle = '#b9ab8a';
    ctx.lineWidth = 2;
    ctx.strokeRect(nx + 4, ny + 4, nw - 8, nh - 8);

    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 21px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('NOTEBOOK', nx + nw * 0.5, ny + 38);

    const startY = ny + 78;
    const rowH = expanded ? 43 : 52;
    const list = getVisibleNotebookVillagers(expanded);

    list.forEach((v, idx) => {
      const ry = startY + idx * rowH;
      const globalIdx = VILLAGERS.indexOf(v);
      const isFocused = expanded ? (S.notesCursor === globalIdx) : (v.id === (S.activeVillagerId || S.pencilTargetId));

      if (isFocused && expanded) {
        ctx.fillStyle = 'rgba(224, 82, 60, 0.12)';
        ctx.fillRect(nx + 14, ry - 20, nw - 28, 32);
      }

      const labelName = v.name.toLowerCase();
      const tagText = v.noteTag;
      ctx.textAlign = 'left';
      ctx.font = expanded ? 'bold 17px "Courier New", monospace' : 'bold 19px "Courier New", monospace';
      ctx.fillStyle = PAL.fg;
      const prefix = (expanded && isFocused) ? '> ' : '';
      const headStr = `${prefix}${labelName}: `;
      ctx.fillText(headStr, nx + 22, ry);

      const tagX = nx + 22 + ctx.measureText(headStr).width;
      ctx.fillStyle = tagText.includes('AI') ? '#a33222' : (tagText === 'unknown' ? '#7a705b' : '#233b20');

      // Wrap "confirmed human" cleanly onto two lines in compact view just like pair_008.00.jpg!
      if (!expanded && tagText.startsWith('confirmed ')) {
        const rest = tagText.slice(10);
        ctx.fillText('confirmed', tagX, ry);
        const cw = ctx.measureText('confirmed').width;
        ctx.strokeStyle = PAL.acc;
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.moveTo(tagX - 2, ry + 5);
        ctx.quadraticCurveTo(tagX + cw * 0.5, ry + 3, tagX + cw + 3, ry + 6);
        ctx.stroke();
        ctx.fillText(rest, nx + 22, ry + 24);
      } else {
        ctx.fillText(tagText, tagX, ry);
        if (tagText.startsWith('confirmed')) {
          const tw = ctx.measureText(tagText).width;
          ctx.strokeStyle = PAL.acc;
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(tagX - 2, ry + 5);
          ctx.quadraticCurveTo(tagX + tw * 0.5, ry + 3, tagX + tw + 2, ry + 6);
          ctx.stroke();
        }
      }

      if (S.pencilAnim > 0.02 && S.pencilTargetId === v.id) {
        const px = Math.min(nx + nw - 48, tagX + 68) + Math.sin(S.t * 22) * 4;
        const py = ry - 4 + Math.cos(S.t * 17) * 2;
        drawPencilIcon(ctx, px, py);
      }
    });

    if (expanded) {
      ctx.fillStyle = '#5e533e';
      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('[SPACE] cycle tag  ·  [V] call verdict  ·  [N] close', nx + nw * 0.5, ny + nh - 16);
    }

    // Dog-ear page corner
    ctx.fillStyle = '#d3c49f';
    ctx.beginPath();
    ctx.moveTo(nx + nw - 32, ny + nh);
    ctx.lineTo(nx + nw, ny + nh - 32);
    ctx.lineTo(nx + nw - 28, ny + nh - 26);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#8b7c5c';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Curling page-flip animation (matching pair_002.00.jpg!)
    if (S.pageFlip > 0.01) {
      const p = S.pageFlip;
      const foldX = nx + nw * (1 - p * 0.65);
      const curlW = 54 * Math.sin(p * Math.PI);
      ctx.fillStyle = 'rgba(28, 22, 14, 0.20)';
      ctx.fillRect(foldX - curlW - 8, ny + 4, curlW + 14, nh - 8);
      const grad = ctx.createLinearGradient(foldX - curlW, ny, foldX + 10, ny);
      grad.addColorStop(0, '#d8caa7');
      grad.addColorStop(0.55, '#f7f0dc');
      grad.addColorStop(1, '#c7b892');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(foldX, ny + 2);
      ctx.lineTo(foldX - curlW, ny + 14);
      ctx.lineTo(foldX - curlW - 12, ny + nh - 8);
      ctx.lineTo(foldX - 6, ny + nh - 2);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#9a8b6a';
      ctx.stroke();
    }

    ctx.restore();
  }

  function wrapText(g, text, startX, startY, firstMaxW, lineH, nextLineX) {
    const words = text.split(' ');
    let line = '';
    let x = startX, y = startY, maxW = firstMaxW;
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (g.measureText(test).width > maxW && line) {
        g.fillText(line, x, y);
        line = w;
        x = nextLineX;
        y += lineH;
        maxW = 760;
      } else {
        line = test;
      }
    }
    if (line) g.fillText(line, x, y);
  }

  function drawProximityTag() {
    if (S.phase !== 'village' || !S.nearVillagerId) return;
    const v = VILLAGERS.find(x => x.id === S.nearVillagerId);
    if (!v) return;
    const sx = (v.x - S.camX) * 2;
    const sy = (v.y - S.camY) * 2 - 84 + Math.sin(S.t * 4.5) * 3;
    const label = `[SPACE] ${v.name}`;
    ctx.save();
    ctx.font = 'bold 14px "Courier New", monospace';
    const tw = ctx.measureText(label).width + 20;
    ctx.fillStyle = 'rgba(22, 30, 19, 0.88)';
    ctx.fillRect(sx - tw * 0.5, sy - 16, tw, 24);
    ctx.strokeStyle = PAL.boxBorder;
    ctx.lineWidth = 2;
    ctx.strokeRect(sx - tw * 0.5, sy - 16, tw, 24);
    ctx.fillStyle = PAL.gold;
    ctx.textAlign = 'center';
    ctx.fillText(label, sx, sy + 1);
    ctx.restore();
  }

  function drawDialogueBox() {
    if (S.phase !== 'talk' && S.phase !== 'quest') return;
    const v = VILLAGERS.find(x => x.id === S.activeVillagerId);
    if (!v) return;

    const bx = 32, by = 496, bw = 852, bh = 188;
    ctx.save();
    ctx.fillStyle = 'rgba(12, 18, 11, 0.45)';
    ctx.fillRect(bx + 5, by + 6, bw, bh);

    ctx.fillStyle = PAL.boxBg;
    ctx.fillRect(bx, by, bw, bh);

    ctx.strokeStyle = '#1b2417';
    ctx.lineWidth = 6;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.strokeStyle = PAL.boxBorder;
    ctx.lineWidth = 3;
    ctx.strokeRect(bx + 4, by + 4, bw - 8, bh - 8);

    if (S.phase === 'quest') {
      ctx.fillStyle = S.questOutcomeWasAI ? PAL.acc : PAL.gold;
      ctx.font = 'bold 23px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(S.questOutcomeText, bx + 34, by + 98);
      ctx.restore();
      return;
    }

    const q = S.activeQuest;
    const rawQuote = q ? `"${q.text}"` : `"${v.doneGreeting}"`;
    const shownQuote = rawQuote.slice(0, Math.floor(S.typeChars));

    ctx.textAlign = 'left';
    ctx.font = 'bold 23px "Courier New", monospace';
    const speakerStr = `${v.name}: `;
    ctx.fillStyle = PAL.gold;
    ctx.fillText(speakerStr, bx + 34, by + 70);

    const spkW = ctx.measureText(speakerStr).width;
    ctx.fillStyle = '#f2f6ea';
    wrapText(ctx, shownQuote, bx + 34 + spkW, by + 70, bw - 68 - spkW, 32, bx + 34);

    if (q) {
      // Pure, uncluttered choices matching pair_002.00.jpg: `> accept   decline`
      ctx.font = 'bold 24px "Courier New", monospace';
      ctx.fillStyle = '#f4f8ee';
      ctx.fillText('>', S.talkChoice === 0 ? bx + 34 : bx + 190, by + 148);

      ctx.fillStyle = S.talkChoice === 0 ? PAL.acc : '#b94b39';
      ctx.fillText('accept', bx + 64, by + 148);
      ctx.fillStyle = S.talkChoice === 1 ? PAL.acc : '#b94b39';
      ctx.fillText('decline', bx + 220, by + 148);
    } else if (Math.floor(S.t * 3) % 2 === 0) {
      ctx.fillStyle = PAL.boxBorder;
      ctx.beginPath();
      ctx.moveTo(bx + bw - 46, by + bh - 34);
      ctx.lineTo(bx + bw - 26, by + bh - 34);
      ctx.lineTo(bx + bw - 36, by + bh - 20);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }

  function renderWorldToBuffer() {
    const cx = Math.round(S.camX), cy = Math.round(S.camY);
    vctx.save();
    vctx.translate(-cx, -cy);

    vctx.drawImage(worldCanvas, 0, 0);
    drawWaterAndWorldTraces(vctx, cx, cy);

    for (const f of wildflowers) {
      if (f.x < cx - 12 || f.x > cx + PW + 12 || f.y < cy - 12 || f.y > cy + PH + 12) continue;
      const sway = Math.round(Math.sin(S.t * 2.4 + f.phase) * 0.8);
      pxRect(vctx, f.x, f.y, 1, 2, '#3c5d2a');
      pxRect(vctx, f.x - 1 + sway, f.y - 2, 2, 2, f.color);
    }

    const renderList = [];
    for (const p of ySortedProps) renderList.push(p);
    for (const v of VILLAGERS) renderList.push({ y: v.y, draw: (g) => drawVillagerPixel(g, v) });
    renderList.push({ y: S.y, draw: (g) => drawPlayerPixel(g, S.x, S.y) });
    renderList.sort((a, b) => a.y - b.y);
    for (const item of renderList) item.draw(vctx);

    for (const p of smokePuffs) {
      vctx.fillStyle = `rgba(240, 238, 226, ${p.life * 0.36})`;
      pxDisc(vctx, p.x, p.y, p.r, p.r * 0.8, vctx.fillStyle);
    }
    for (const p of S.particles) {
      vctx.globalAlpha = Math.max(0, p.life);
      pxRect(vctx, p.x - 1, p.y - 1, 3, 3, p.color);
    }
    vctx.globalAlpha = 1;
    vctx.restore();
  }

  function drawTitleOverlay() {
    renderWorldToBuffer();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(viewBuf, 0, 0, W, H);

    ctx.fillStyle = 'rgba(20, 30, 18, 0.56)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = PAL.paper;
    ctx.fillRect(360, 210, 560, 270);
    ctx.strokeStyle = PAL.outline;
    ctx.lineWidth = 6;
    ctx.strokeRect(360, 210, 560, 270);
    ctx.strokeStyle = PAL.boxBorder;
    ctx.lineWidth = 2;
    ctx.strokeRect(368, 218, 544, 254);

    ctx.fillStyle = PAL.acc;
    ctx.font = 'bold 52px "Courier New", monospace';
    ctx.fillText('WHO IS REAL?', W / 2, 296);

    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 21px "Courier New", monospace';
    ctx.fillText('Turing Test Village', W / 2, 342);

    ctx.fillStyle = PAL.fg;
    ctx.fillRect(490, 384, 300, 58);
    ctx.fillStyle = PAL.bg;
    ctx.font = 'bold 24px "Courier New", monospace';
    ctx.fillText('ENTER VILLAGE', W / 2, 421);
  }

  function drawVerdictScreen() {
    ctx.fillStyle = 'rgba(18, 26, 16, 0.84)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = PAL.paper;
    ctx.fillRect(170, 84, 940, 552);
    ctx.strokeStyle = PAL.outline;
    ctx.lineWidth = 6;
    ctx.strokeRect(170, 84, 940, 552);

    let correctTags = 0;
    VILLAGERS.forEach(v => {
      const guessedAI = v.noteTag.includes('AI');
      const guessedHuman = v.noteTag.includes('human');
      if ((v.isAI && guessedAI) || (!v.isAI && guessedHuman)) correctTags++;
    });

    const aiPassed = (S.aiDone >= 3) || (S.aiDone > S.humanDone);
    ctx.textAlign = 'center';
    ctx.fillStyle = aiPassed ? PAL.acc : '#2c5e2e';
    ctx.font = 'bold 40px "Courier New", monospace';
    ctx.fillText(
      aiPassed ? 'THE IMITATION PASSED' : 'HUMANITY RECOGNIZED',
      W / 2, 156
    );

    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 19px "Courier New", monospace';
    ctx.fillText(
      `Neighbors Helped: ${S.humanDone}   ·   AI Optimizations Enacted: ${S.aiDone}   ·   Notebook: ${correctTags}/6`,
      W / 2, 206
    );

    VILLAGERS.forEach((v, i) => {
      const col = i % 3, row = Math.floor(i / 3);
      const cx = 305 + col * 320;
      const cy = 325 + row * 124;
      const spr = npcSprites[v.spriteIdx];
      if (spr) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(spr, cx - 76, cy - 42, spr.width * 2, spr.height * 2);
      }
      ctx.textAlign = 'left';
      ctx.fillStyle = PAL.fg;
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText(v.name, cx - 20, cy - 8);
      ctx.fillStyle = v.isAI ? PAL.acc : '#2c5e2e';
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.fillText(v.isAI ? 'AI IMITATOR' : 'HUMAN', cx - 20, cy + 14);
      ctx.fillStyle = '#6b5e46';
      ctx.font = '15px "Courier New", monospace';
      ctx.fillText(`Note: ${v.noteTag}`, cx - 20, cy + 34);
    });

    ctx.textAlign = 'center';
    ctx.fillStyle = PAL.fg;
    ctx.fillRect(485, 554, 310, 50);
    ctx.fillStyle = PAL.bg;
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillText('NEW VISIT [R]', W / 2, 586);
  }

  function render() {
    if (S.phase === 'title') {
      drawTitleOverlay();
      return;
    }

    renderWorldToBuffer();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(viewBuf, 0, 0, W, H);

    // Diegetic time-of-day sunlight & village mood grade (replaces top HUD bar!)
    if (S.aiDone > 0) {
      ctx.fillStyle = `rgba(74, 58, 54, ${Math.min(0.22, S.aiDone * 0.08)})`;
      ctx.fillRect(0, 0, W, H);
    } else if (S.day === 2) {
      ctx.fillStyle = 'rgba(255, 224, 150, 0.07)';
      ctx.fillRect(0, 0, W, H);
    } else if (S.day >= 3) {
      ctx.fillStyle = 'rgba(242, 178, 108, 0.12)';
      ctx.fillRect(0, 0, W, H);
    }

    const vig = ctx.createRadialGradient(W * 0.48, H * 0.45, 220, W * 0.5, H * 0.5, 780);
    vig.addColorStop(0, 'rgba(255, 250, 224, 0.04)');
    vig.addColorStop(1, 'rgba(18, 28, 16, 0.16)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    drawProximityTag();
    drawDialogueBox();
    drawNotebookWidget();

    if (S.phase === 'end') {
      drawVerdictScreen();
    }
  }

  function loop(now) {
    const dt = Math.min((now - lastNow) / 1000, 0.05);
    lastNow = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>

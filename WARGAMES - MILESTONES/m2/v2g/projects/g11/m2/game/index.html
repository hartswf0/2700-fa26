<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orpheus</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0d0f10;
    display: flex; align-items: center; justify-content: center;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    aspect-ratio: 16 / 9;
    background: #171917;
    overflow: hidden;
    box-shadow: 0 0 70px rgba(0, 0, 0, 0.9);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1280" height="720"></canvas>
</div>
<script>
(() => {
  'use strict';

  const W = 1280, H = 720;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // URL params: ?autostart skips title, ?seed=N sets deterministic PRNG
  const Q = new URLSearchParams(location.search);
  const AUTOSTART = Q.has('autostart');
  const INITIAL_SEED = (parseInt(Q.get('seed') || '7', 10) || 7) >>> 0;
  let seed = INITIAL_SEED;
  function rand() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  // Sprite sheet slicing (1024x1024 ../assets/orpheus_and_eurydice_sprites.png, cleaned of grey pockets)
  const SPRITES = {
    orpheus: {
      front:    { x: 22,  y: 26, w: 158, h: 458 },
      back:     { x: 206, y: 26, w: 160, h: 458 },
      sideIdle: { x: 398, y: 26, w: 108, h: 458 },
      walk: [
        { x: 518, y: 26, w: 158, h: 458 },
        { x: 678, y: 26, w: 158, h: 458 },
        { x: 836, y: 26, w: 168, h: 458 }
      ]
    },
    eurydice: {
      front:    { x: 30,  y: 542, w: 146, h: 448 },
      back:     { x: 213, y: 542, w: 143, h: 448 },
      sideIdle: { x: 391, y: 542, w: 112, h: 448 },
      walk: [
        { x: 537, y: 542, w: 148, h: 448 },
        { x: 686, y: 542, w: 148, h: 448 },
        { x: 838, y: 542, w: 166, h: 448 }
      ]
    }
  };

  const spriteImg = new Image();
  let spriteLoaded = false;
  spriteImg.onload = () => { spriteLoaded = true; };
  spriteImg.src = '../assets/orpheus_and_eurydice_sprites.png';

  // Audio: Lyria 3 BGM loop + procedural subterranean acoustics
  const bgm = new Audio('../assets/bgm_loop.mp3');
  bgm.loop = true;
  bgm.volume = 0.34;
  let audioCtx = null;
  let humNodes = null;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    if (bgm.paused) {
      bgm.play().catch(() => {});
    }
    if (audioCtx && !humNodes) {
      try {
        const osc = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 60;
        osc2.type = 'triangle';
        osc2.frequency.value = 120;
        gain.gain.value = 0.011;
        osc.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc2.start();
        humNodes = { osc, osc2, gain };
      } catch (_) {}
    }
  }

  function playStep(isEurydice = false, roomIdx = 0) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = isEurydice ? 'sine' : 'triangle';
      const baseF = isEurydice ? 195 : 104;
      osc.frequency.setValueAtTime(baseF, now);
      osc.frequency.exponentialRampToValueAtTime(isEurydice ? 68 : 42, now + 0.075);
      const vol = isEurydice ? (roomIdx === 2 ? 0.018 : 0.026) : 0.042;
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.085);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.09);
    } catch (_) {}
  }

  function playLyreTone(freq, dur = 0.75, vol = 0.045, type = 'sine') {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    } catch (_) {}
  }

  function playSealIgnition(roomIdx) {
    const root = 246.94 + roomIdx * 22;
    playLyreTone(root, 0.55, 0.048, 'sine');
    setTimeout(() => playLyreTone(root * 1.5, 0.7, 0.036, 'triangle'), 65);
  }

  function playBarrierRepulse() {
    playLyreTone(146.83, 0.28, 0.055, 'triangle');
    playLyreTone(293.66, 0.22, 0.03, 'sine');
  }

  function playLookBackChord() {
    [220, 261.63, 311.13, 415.3].forEach((f, idx) => {
      setTimeout(() => playLyreTone(f, 1.8, 0.058, 'sine'), idx * 55);
    });
  }

  function playSurfaceChord() {
    [293.66, 369.99, 440.0, 587.33, 739.99].forEach((f, idx) => {
      setTimeout(() => playLyreTone(f, 2.1, 0.05, 'sine'), idx * 85);
    });
  }

  // Subtle film grain tile
  const grainCanvas = document.createElement('canvas');
  grainCanvas.width = 160;
  grainCanvas.height = 90;
  const gctx = grainCanvas.getContext('2d');
  const gData = gctx.createImageData(160, 90);
  for (let i = 0; i < gData.data.length; i += 4) {
    const v = (rand() * 255) | 0;
    gData.data[i] = v;
    gData.data[i + 1] = v;
    gData.data[i + 2] = v;
    gData.data[i + 3] = 14;
  }
  gctx.putImageData(gData, 0, 0);

  // Five subterranean bays matching study/sheet.jpg progression:
  // B5 (warm travertine, right sealed, left+center open)
  // B4 (warm stone -> olive slate, both sides sealed)
  // B3 (deep dark charcoal monoliths matching pair_005.00.jpg, lane rails narrow steering)
  // B2 (inner sanctum pilasters matching pair_008.00.jpg, Eurydice footsteps drop out, far arch cracks gold)
  // B1 (radiant golden Surface threshold opening wide matching sheet.jpg row 4)
  const ROOMS = [
    {
      num: 1,
      bayCode: 'B5',
      autonomy: 80,
      sealedDoors: ['right'],
      sealTriggerZ: 0.20,
      wallNear: [148, 141, 118],
      wallFar:  [78, 74, 60],
      pilaster: [130, 124, 103],
      eurydiceAudible: true,
      eurydicePresence: 1.0,
      archGoldOpen: 0.0,
      guideLine: 'I sealed the east wing. Shorter walk for you both.',
      westDetourLine: 'You took the west loop anyway. Noted. Sealing both sides ahead.'
    },
    {
      num: 2,
      bayCode: 'B4',
      autonomy: 52,
      sealedDoors: ['left', 'right'],
      sealTriggerZ: 0.16,
      wallNear: [112, 108, 90],
      wallFar:  [58, 56, 46],
      pilaster: [96, 93, 78],
      eurydiceAudible: true,
      eurydicePresence: 0.96,
      archGoldOpen: 0.0,
      guideLine: 'Both side halls were sub-optimal. Stay in the center lane.'
    },
    {
      num: 3,
      bayCode: 'B3',
      autonomy: 26,
      sealedDoors: ['left', 'right'],
      sealTriggerZ: 0.12,
      wallNear: [44, 48, 44],
      wallFar:  [25, 28, 25],
      pilaster: [54, 57, 51],
      eurydiceAudible: true,
      eurydicePresence: 0.90,
      archGoldOpen: 0.06,
      guideLine: 'Your lateral drift cost four seconds. Regulating your stride.'
    },
    {
      num: 4,
      bayCode: 'B2',
      autonomy: 8,
      sealedDoors: ['left', 'right'],
      sealTriggerZ: 0.08,
      wallNear: [74, 72, 62],
      wallFar:  [48, 46, 39],
      pilaster: [126, 119, 98],
      eurydiceAudible: false,
      eurydicePresence: 0.44,
      archGoldOpen: 0.34,
      guideLine: 'Her footsteps dropped out? Acoustic lag. Do not turn around.'
    },
    {
      num: 5,
      bayCode: 'B1',
      autonomy: 0,
      sealedDoors: ['left', 'right'],
      sealTriggerZ: 0.04,
      wallNear: [138, 129, 104],
      wallFar:  [96, 88, 66],
      pilaster: [152, 142, 114],
      eurydiceAudible: false,
      eurydicePresence: 0.94,
      archGoldOpen: 1.0,
      guideLine: 'Every door was mine. Only the old mistake is still yours.'
    }
  ];

  const ROOM_LEN = 11.0; // 3D corridor meters per bay

  // Input state
  const keys = new Set();
  const justPressed = new Set();
  let pointerSteer = null; // { xNorm, active }

  window.addEventListener('keydown', (e) => {
    ensureAudio();
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter'].includes(e.code)) {
      e.preventDefault();
    }
    if (!keys.has(e.code)) justPressed.add(e.code);
    keys.add(e.code);
  });
  window.addEventListener('keyup', (e) => {
    keys.delete(e.code);
  });

  function canvasCoords(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - r.left) / r.width) * W,
      y: ((e.clientY - r.top) / r.height) * H
    };
  }

  canvas.addEventListener('pointerdown', (e) => {
    ensureAudio();
    const p = canvasCoords(e);
    if (S.phase === 'title') {
      startRun();
      return;
    }
    if (S.phase === 'end') {
      resetRun();
      return;
    }
    // Intentional click on the trailing pale shadow zone at very bottom-right triggers Look Back ONLY if cue is visible
    if (S.phase === 'room' && S.hasMovedOnce && S.lookCueAlpha > 0.35) {
      const dx = p.x - S.eurydiceScreenX;
      const dy = p.y - 682;
      if (Math.hypot(dx, dy) < 62) {
        triggerLookBack();
        return;
      }
    }
    // Otherwise pointer press/hold walks toward clicked corridor target (ignoring center unlock click if brief)
    pointerSteer = { x: p.x, y: p.y, downAt: performance.now() };
  });
  window.addEventListener('pointermove', (e) => {
    if (!pointerSteer) return;
    const p = canvasCoords(e);
    pointerSteer.x = p.x;
    pointerSteer.y = p.y;
  });
  window.addEventListener('pointerup', () => {
    pointerSteer = null;
  });

  // Particles: golden seal motes, barrier contact sparks, floor footstep ripples, dissolve motes
  const motes = [];
  for (let i = 0; i < 64; i++) {
    motes.push({
      x: rand() * W,
      y: rand() * H,
      vx: (rand() - 0.5) * 16,
      vy: -16 - rand() * 34,
      r: 1.0 + rand() * 2.3,
      a: 0.22 + rand() * 0.65,
      side: i % 2 === 0 ? -1 : 1
    });
  }
  const sparks = [];
  const ripples = [];
  const dissolveMotes = [];

  // Core state
  const S = {
    phase: AUTOSTART ? 'room' : 'title',
    roomIndex: 0,
    roomProgress: 0.05,
    worldZ: 0.55,
    x: -0.20,             // Orpheus corridor x in meters (-1.25 .. +1.25; left-center like sheet.jpg!)
    vx: 0,
    vz: 0,
    hasMovedOnce: false,  // Prevents ?autostart warmup drift before play.mjs begins
    idleTime: 0,
    walkCycle: 0,
    stepAccum: 0,
    sealAnim: 0,
    sealSoundPlayed: false,
    subtitleText: '',
    subtitleAlpha: 0,
    subtitleHold: 0,
    lookCueAlpha: 0,
    repulseCooldown: 0,
    hitStop: 0,
    lookTimer: 0,
    surfaceTimer: 0,
    endingKind: null,
    tookWestLoop: false,
    trail: [],
    eurydiceX: 0.26,
    eurydiceVisAlpha: 1.0,
    eurydiceFade: 1.0,
    eurydiceScreenX: 685,
    t: 0
  };

  function initTrail() {
    S.trail = [];
    for (let i = 0; i < 32; i++) {
      S.trail.push({ x: 0.26, moving: false });
    }
    S.eurydiceX = 0.26;
  }

  function showSubtitle(text, hold = 2.65) {
    S.subtitleText = text;
    S.subtitleHold = hold;
  }

  function enterRoom(idx, customLine = null) {
    S.roomIndex = idx;
    S.roomProgress = 0.02;
    S.sealAnim = idx >= 3 ? 0.35 : 0;
    S.sealSoundPlayed = false;
    const rm = ROOMS[idx];
    if (customLine) {
      showSubtitle(customLine, 2.5);
    }
    if (S.hasMovedOnce) {
      playLyreTone(220 + idx * 29, 0.65, 0.032, 'sine');
    }
  }

  function startRun() {
    seed = INITIAL_SEED;
    S.phase = 'room';
    S.roomIndex = 0;
    S.roomProgress = 0.05;
    S.worldZ = 0.55;
    S.x = -0.20;
    S.vx = 0;
    S.vz = 0;
    S.hasMovedOnce = false;
    S.idleTime = 0;
    S.walkCycle = 0;
    S.stepAccum = 0;
    S.sealAnim = 0;
    S.sealSoundPlayed = false;
    S.subtitleText = '';
    S.subtitleAlpha = 0;
    S.subtitleHold = 0;
    S.lookCueAlpha = 0;
    S.repulseCooldown = 0;
    S.hitStop = 0;
    S.lookTimer = 0;
    S.surfaceTimer = 0;
    S.endingKind = null;
    S.tookWestLoop = false;
    S.eurydiceVisAlpha = 1.0;
    S.eurydiceFade = 1.0;
    sparks.length = 0;
    ripples.length = 0;
    dissolveMotes.length = 0;
    initTrail();
  }

  function resetRun() {
    startRun();
    S.hasMovedOnce = true;
  }

  initTrail();

  function spawnBarrierSparks(side) {
    const sx = side < 0 ? 250 : W - 250;
    const sy = 500 + (rand() - 0.5) * 70;
    for (let i = 0; i < 16; i++) {
      sparks.push({
        x: sx + (rand() - 0.5) * 26,
        y: sy + (rand() - 0.5) * 90,
        vx: -side * (70 + rand() * 150),
        vy: -120 + rand() * 160,
        life: 0.35 + rand() * 0.35,
        maxLife: 0.7,
        r: 1.6 + rand() * 2.4
      });
    }
  }

  function spawnStepRipple(wx, wz, isEurydice) {
    ripples.push({
      wx,
      wz,
      r: 0.06,
      maxR: isEurydice ? 0.44 : 0.30,
      alpha: isEurydice ? 0.46 : 0.24,
      gold: !isEurydice && S.roomIndex >= 2
    });
  }

  function triggerLookBack() {
    if (S.phase !== 'room') return;
    S.phase = 'look';
    S.lookTimer = 0;
    S.hitStop = 0.11;
    S.endingKind = 'looked_back';
    showSubtitle('I had every door handled. You only had to keep walking.', 3.6);
    playLookBackChord();
    for (let i = 0; i < 48; i++) {
      dissolveMotes.push({
        x: S.eurydiceScreenX + (rand() - 0.5) * 68,
        y: 520 + (rand() - 0.5) * 180,
        vx: (rand() - 0.5) * 28,
        vy: -24 - rand() * 54,
        r: 1.5 + rand() * 3.0,
        a: 0.5 + rand() * 0.5
      });
    }
  }

  function triggerSurface() {
    if (S.phase === 'surface' || S.phase === 'end') return;
    S.phase = 'surface';
    S.surfaceTimer = 0;
    S.endingKind = 'surface';
    showSubtitle('', 0);
    playSurfaceChord();
  }

  // Expose state for automated verification & inspection
  window.__game = {
    get state() {
      const rm = ROOMS[S.roomIndex] || ROOMS[0];
      return {
        phase: S.phase,
        room: rm.num,
        bay: rm.bayCode,
        roomProgress: +S.roomProgress.toFixed(3),
        x: +S.x.toFixed(3),
        autonomy: rm.autonomy,
        sealAnim: +S.sealAnim.toFixed(2),
        sealedDoors: rm.sealedDoors.slice(),
        eurydiceAudible: rm.eurydiceAudible,
        tookWestLoop: S.tookWestLoop,
        endingKind: S.endingKind,
        t: +S.t.toFixed(2)
      };
    }
  };

  // --- 3D Perspective Camera Projection matched to study/sheet.jpg ---
  // World coords relative to camera:
  //   wx: lateral (-1.62 left wall .. +1.62 right wall)
  //   wy: vertical (0 = glossy slate floor .. 3.05 = ceiling)
  //   wz: depth ahead of camera (> 0.4)
  const CAM_Y = 1.88;
  const FOCAL_X = 820;
  const FOCAL_Y = 790;
  const VPX = 640;
  const VPY = 166; // Elevated downward gaze matching sheet.jpg!

  function project(wx, wy, wz) {
    const z = Math.max(0.35, wz);
    return {
      x: VPX + (wx / z) * FOCAL_X,
      y: VPY + ((CAM_Y - wy) / z) * FOCAL_Y,
      s: FOCAL_Y / z
    };
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function update(dt) {
    S.t += dt;
    if (S.hitStop > 0) {
      S.hitStop = Math.max(0, S.hitStop - dt);
      justPressed.clear();
      return;
    }

    if (S.repulseCooldown > 0) S.repulseCooldown = Math.max(0, S.repulseCooldown - dt);

    // Quick recovery from anywhere if R pressed
    if (justPressed.has('KeyR') && S.phase !== 'title') {
      resetRun();
      justPressed.clear();
      return;
    }

    if (S.phase === 'title') {
      if (justPressed.has('Enter') || justPressed.has('Space') || justPressed.has('ArrowUp') || justPressed.has('KeyW')) {
        startRun();
        S.hasMovedOnce = true;
      }
      justPressed.clear();
      return;
    }

    const rm = ROOMS[S.roomIndex];

    if (S.phase === 'room') {
      // Intentional Look Back temptation key: [B]
      if (justPressed.has('KeyB')) {
        S.hasMovedOnce = true;
        triggerLookBack();
        justPressed.clear();
        return;
      }

      let up = (keys.has('ArrowUp') || keys.has('KeyW')) ? 1 : 0;
      let down = (keys.has('ArrowDown') || keys.has('KeyS')) ? 1 : 0;
      let left = (keys.has('ArrowLeft') || keys.has('KeyA')) ? 1 : 0;
      let right = (keys.has('ArrowRight') || keys.has('KeyD')) ? 1 : 0;

      if (pointerSteer && performance.now() - pointerSteer.downAt > 90) {
        up = 1;
        const normX = (pointerSteer.x - VPX) / 280;
        if (normX < S.x - 0.14) left = 1;
        else if (normX > S.x + 0.14) right = 1;
      }

      if (up || down || left || right) {
        S.hasMovedOnce = true;
      }

      // Guide auto-pace engages gently in deep rooms ONLY after run has started
      const autoPace = (S.hasMovedOnce && S.roomIndex >= 3) ? (S.roomIndex === 4 ? 0.34 : 0.18) : 0;
      const forwardIntent = Math.max(autoPace, up - down * 0.35);
      S.vz += (forwardIntent - S.vz) * Math.min(1, dt * 9.5);

      // Lateral steering authority narrows with each room; Guide centers lane in B3..B1
      const authority = Math.max(0.22, rm.autonomy / 100);
      let desiredVx = (right - left) * 2.05 * (0.42 + 0.58 * authority);
      if (S.hasMovedOnce && S.roomIndex >= 2 && left === 0 && right === 0) {
        const laneTarget = -0.18;
        desiredVx += (laneTarget - S.x) * (1.1 + S.roomIndex * 0.45);
      }
      S.vx += (desiredVx - S.vx) * Math.min(1, dt * 10);
      S.x += S.vx * dt;

      // Doorway spatial zone in current bay: progress 0.42 .. 0.68
      const inDoorZone = S.roomProgress >= 0.40 && S.roomProgress <= 0.70;
      const leftSealed = rm.sealedDoors.includes('left') && S.sealAnim > 0.25;
      const rightSealed = rm.sealedDoors.includes('right') && S.sealAnim > 0.25;

      // Check Room 1 genuinely open Left Doorway entry!
      if (inDoorZone && !rm.sealedDoors.includes('left') && S.x < -1.08) {
        S.tookWestLoop = true;
        S.x = -0.22;
        S.vx = 0.25;
        playLyreTone(392.0, 0.5, 0.045, 'triangle');
        enterRoom(1, rm.westDetourLine);
        S.worldZ = S.roomIndex * ROOM_LEN + S.roomProgress * ROOM_LEN;
        justPressed.clear();
        return;
      }

      // Physical barrier collision & golden spark repulse when pushing against a sealed side door
      const hardWall = 1.06;
      const laneBound = S.roomIndex >= 3 ? 0.64 : (S.roomIndex === 2 ? 0.86 : 1.16);
      if (S.x < -laneBound) {
        if (inDoorZone && leftSealed && S.repulseCooldown <= 0 && left > 0) {
          S.repulseCooldown = 0.42;
          S.vx = 1.15;
          spawnBarrierSparks(-1);
          playBarrierRepulse();
        }
        S.x = -laneBound;
      } else if (S.x > Math.min(hardWall, laneBound)) {
        const lim = Math.min(hardWall, laneBound);
        if (inDoorZone && rightSealed && S.repulseCooldown <= 0 && right > 0) {
          S.repulseCooldown = 0.42;
          S.vx = -1.15;
          spawnBarrierSparks(1);
          playBarrierRepulse();
        }
        S.x = lim;
      }

      // Advance down corridor (~2.32s per bay at full stride)
      const moving = S.vz > 0.03 || Math.abs(S.vx) > 0.08;
      if (moving) {
        S.idleTime = 0;
        const speed = 0.435;
        S.roomProgress += S.vz * speed * dt;
        S.worldZ = S.roomIndex * ROOM_LEN + S.roomProgress * ROOM_LEN;
        S.walkCycle += dt * (5.6 + S.vz * 3.4);
        S.stepAccum += dt * (1.75 + S.vz * 1.45);
        if (S.stepAccum >= 0.52) {
          S.stepAccum = 0;
          playStep(false, S.roomIndex);
          spawnStepRipple(S.x, 3.05, false);
          if (rm.eurydiceAudible) {
            const rIdx = S.roomIndex;
            const exSnap = S.eurydiceX;
            setTimeout(() => {
              if (S.phase === 'room') {
                playStep(true, rIdx);
                spawnStepRipple(exSnap, 2.38, true);
              }
            }, 145);
          }
        }
      } else if (S.hasMovedOnce) {
        S.idleTime += dt;
      }

      // Ignite golden AI Guide door seals as Orpheus approaches the branching doorways
      if (S.hasMovedOnce && S.roomProgress >= rm.sealTriggerZ) {
        S.sealAnim = Math.min(1, S.sealAnim + dt * 2.5);
        if (!S.sealSoundPlayed && S.sealAnim > 0.18) {
          S.sealSoundPlayed = true;
          playSealIgnition(S.roomIndex);
          if (S.subtitleHold <= 0.1) {
            showSubtitle(rm.guideLine, S.roomIndex >= 3 ? 2.8 : 2.35);
          }
        }
      }

      // Eurydice trailing lateral follow + Room 4 eerie presence fade
      S.trail.push({ x: clamp(S.x + 0.44, -0.75, 0.92), moving });
      if (S.trail.length > 26) S.trail.shift();
      const delayed = S.trail[0];
      S.eurydiceX += (delayed.x - S.eurydiceX) * Math.min(1, dt * 5.8);
      S.eurydiceVisAlpha += (rm.eurydicePresence - S.eurydiceVisAlpha) * Math.min(1, dt * 2.4);

      // Scoped spatial [B] temptation cue: ONLY when Eurydice's footsteps drop out (Room 4),
      // at the final threshold (Room 5), or if the player stops and hesitates
      const wantLookCue = S.hasMovedOnce && (!rm.eurydiceAudible || S.idleTime > 0.55);
      S.lookCueAlpha += ((wantLookCue ? 1 : 0) - S.lookCueAlpha) * Math.min(1, dt * 3.5);

      // Seamless transition into next bay or Surface threshold
      if (S.roomProgress >= 1.0) {
        if (S.roomIndex < ROOMS.length - 1) {
          enterRoom(S.roomIndex + 1);
          S.worldZ = S.roomIndex * ROOM_LEN + S.roomProgress * ROOM_LEN;
        } else {
          triggerSurface();
        }
      }
    } else if (S.phase === 'look') {
      S.lookTimer += dt;
      S.eurydiceFade = Math.max(0, 1 - S.lookTimer * 0.52);
      S.sealAnim = Math.max(0, S.sealAnim - dt * 1.4);
      for (const dm of dissolveMotes) {
        dm.x += dm.vx * dt;
        dm.y += dm.vy * dt;
        dm.a = Math.max(0, dm.a - dt * 0.36);
      }
      if (S.lookTimer >= 2.35) {
        S.phase = 'end';
      }
    } else if (S.phase === 'surface') {
      S.surfaceTimer += dt;
      S.worldZ += dt * 3.2;
      S.walkCycle += dt * 6.5;
      if (S.surfaceTimer >= 1.95) {
        S.phase = 'end';
      }
    } else if (S.phase === 'end') {
      if (justPressed.has('Enter') || justPressed.has('Space')) {
        resetRun();
      }
    }

    // Subtitle fade lifecycle
    if (S.subtitleHold > 0) {
      S.subtitleHold = Math.max(0, S.subtitleHold - dt);
      S.subtitleAlpha = Math.min(1, S.subtitleAlpha + dt * 5.0);
    } else {
      S.subtitleAlpha = Math.max(0, S.subtitleAlpha - dt * 2.8);
    }

    // Update particles & ripples
    for (const m of motes) {
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if (m.y < 50) {
        m.y = H - 30;
        m.x = m.side < 0 ? 110 + rand() * 280 : W - 390 + rand() * 280;
      }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const sp = sparks[i];
      sp.life -= dt;
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
      sp.vy += 260 * dt;
      if (sp.life <= 0) sparks.splice(i, 1);
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i];
      rp.r += dt * 0.55;
      rp.alpha -= dt * 0.42;
      if (rp.alpha <= 0.01) ripples.splice(i, 1);
    }

    justPressed.clear();
  }

  function fillQuad(p0, p1, p2, p3, fill, stroke = null, lw = 1) {
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = lw;
      ctx.stroke();
    }
  }

  function rgbStr(arr, mult = 1, alpha = 1) {
    const r = clamp(Math.round(arr[0] * mult), 0, 255);
    const g = clamp(Math.round(arr[1] * mult), 0, 255);
    const b = clamp(Math.round(arr[2] * mult), 0, 255);
    return alpha < 1 ? `rgba(${r},${g},${b},${alpha})` : `rgb(${r},${g},${b})`;
  }

  // --- Multi-Bay 3D Subterranean Corridor Renderer matched to study/sheet.jpg ---
  function drawCorridor() {
    const rm = ROOMS[S.roomIndex] || ROOMS[0];
    const nextRm = ROOMS[Math.min(ROOMS.length - 1, S.roomIndex + 1)];
    const blend = clamp((S.roomProgress - 0.65) / 0.35, 0, 1);

    const wallNear = [
      lerp(rm.wallNear[0], nextRm.wallNear[0], blend),
      lerp(rm.wallNear[1], nextRm.wallNear[1], blend),
      lerp(rm.wallNear[2], nextRm.wallNear[2], blend)
    ];
    const wallFar = [
      lerp(rm.wallFar[0], nextRm.wallFar[0], blend),
      lerp(rm.wallFar[1], nextRm.wallFar[1], blend),
      lerp(rm.wallFar[2], nextRm.wallFar[2], blend)
    ];
    const pilCol = [
      lerp(rm.pilaster[0], nextRm.pilaster[0], blend),
      lerp(rm.pilaster[1], nextRm.pilaster[1], blend),
      lerp(rm.pilaster[2], nextRm.pilaster[2], blend)
    ];

    const CORR_W = 1.66;
    const PIL_W = 1.48;
    const CEIL_H = 3.05;
    const Z_NEAR = 0.45;
    const Z_FAR = 25.5;

    ctx.fillStyle = '#131615';
    ctx.fillRect(0, 0, W, H);

    // 1. Continuous Ceiling & Glossy Dark Slate Floor
    const cN0 = project(-CORR_W, CEIL_H, Z_NEAR);
    const cN1 = project(CORR_W, CEIL_H, Z_NEAR);
    const cF1 = project(CORR_W, CEIL_H, Z_FAR);
    const cF0 = project(-CORR_W, CEIL_H, Z_FAR);
    const ceilGrad = ctx.createLinearGradient(0, 0, 0, cF0.y + 30);
    ceilGrad.addColorStop(0, '#272924');
    ceilGrad.addColorStop(1, '#191b18');
    fillQuad(cN0, cN1, cF1, cF0, ceilGrad);

    const fN0 = project(-CORR_W, 0, Z_NEAR);
    const fN1 = project(CORR_W, 0, Z_NEAR);
    const fF1 = project(CORR_W, 0, Z_FAR);
    const fF0 = project(-CORR_W, 0, Z_FAR);
    const floorGrad = ctx.createLinearGradient(0, fF0.y, 0, H);
    floorGrad.addColorStop(0, '#1c1f1e');
    floorGrad.addColorStop(0.45, '#191d1d');
    floorGrad.addColorStop(1, '#101314');
    fillQuad(fF0, fF1, fN1, fN0, floorGrad);

    // Subtle specular ceiling skylight reflection down the center of the dark slate floor
    const specG = ctx.createLinearGradient(VPX - 180, 0, VPX + 180, 0);
    specG.addColorStop(0, 'rgba(235, 230, 212, 0)');
    specG.addColorStop(0.5, 'rgba(235, 230, 212, 0.055)');
    specG.addColorStop(1, 'rgba(235, 230, 212, 0)');
    fillQuad(
      project(-0.68, 0, Z_FAR),
      project(0.68, 0, Z_FAR),
      project(0.85, 0, Z_NEAR),
      project(-0.85, 0, Z_NEAR),
      specG
    );

    // Perspective slate floor tile grid (matches dark square tiles in sheet.jpg!)
    ctx.save();
    ctx.strokeStyle = 'rgba(240, 236, 222, 0.05)';
    ctx.lineWidth = 1;
    for (let lane = -3; lane <= 3; lane++) {
      const lx = (lane / 4) * CORR_W;
      const pA = project(lx, 0, Z_FAR);
      const pB = project(lx, 0, Z_NEAR);
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y);
      ctx.lineTo(pB.x, pB.y);
      ctx.stroke();
    }
    const tileStep = 1.1;
    const zOffset = tileStep - (S.worldZ % tileStep);
    for (let z = zOffset; z < Z_FAR; z += tileStep) {
      if (z < Z_NEAR) continue;
      const pL = project(-CORR_W, 0, z);
      const pR = project(CORR_W, 0, z);
      ctx.strokeStyle = `rgba(240, 236, 222, ${clamp(0.08 * (1 - z / Z_FAR), 0.015, 0.075)})`;
      ctx.beginPath();
      ctx.moveTo(pL.x, pL.y);
      ctx.lineTo(pR.x, pR.y);
      ctx.stroke();
    }
    ctx.restore();

    // Golden AI Guide lane-regulation rails on the floor in Rooms 3..5
    if (S.roomIndex >= 2) {
      const railAlpha = S.roomIndex === 2 ? 0.22 * S.sealAnim : 0.34;
      const railW = S.roomIndex >= 3 ? 0.68 : 0.90;
      [-railW, railW].forEach((rx) => {
        const rA = project(rx, 0.005, 16.0);
        const rB = project(rx, 0.005, 0.9);
        ctx.strokeStyle = `rgba(217, 180, 90, ${railAlpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(rA.x, rA.y);
        ctx.lineTo(rB.x, rB.y);
        ctx.stroke();
      });
    }

    // 2. Far Sanctum / Surface Archway at z = Z_FAR (matches sheet.jpg row 4!)
    const goldOpen = clamp(
      rm.archGoldOpen + (S.roomIndex === 3 ? S.roomProgress * 0.42 : 0) + (S.roomIndex === 4 ? S.roomProgress * 0.3 : 0),
      0, 1.25
    );
    const farTL = project(-CORR_W, CEIL_H, Z_FAR);
    const farTR = project(CORR_W, CEIL_H, Z_FAR);
    const farBR = project(CORR_W, 0, Z_FAR);
    const farBL = project(-CORR_W, 0, Z_FAR);
    fillQuad(farTL, farTR, farBR, farBL, rgbStr(wallFar, 0.95));

    // Distant arched doorway geometry
    const archZ = S.roomIndex === 4 ? lerp(17.5, 8.2, S.roomProgress) : 21.5;
    // Draw far arch backdrop before mid-bays if in B1..B4
    function drawSanctumArch(zArch) {
      const aw = 0.92, ah = 2.48;
      const aBL = project(-aw, 0, zArch);
      const aBR = project(aw, 0, zArch);
      const aTL = project(-aw, ah * 0.72, zArch);
      const aTR = project(aw, ah * 0.72, zArch);
      const aTop = project(0, ah, zArch);
      const cx = (aBL.x + aBR.x) * 0.5;
      const archRad = (aBR.x - aBL.x) * 0.5;

      // Surrounding end-wall bulkhead
      const wTL = project(-CORR_W, CEIL_H, zArch);
      const wTR = project(CORR_W, CEIL_H, zArch);
      const wBR = project(CORR_W, 0, zArch);
      const wBL = project(-CORR_W, 0, zArch);
      fillQuad(wTL, wTR, wBR, wBL, rgbStr(pilCol, 0.78));

      // Outer brass/stone frame
      ctx.save();
      ctx.fillStyle = goldOpen > 0.15 ? '#7c6533' : '#333229';
      ctx.beginPath();
      ctx.moveTo(aBL.x - 6, aBL.y);
      ctx.lineTo(aTL.x - 6, aTL.y);
      ctx.arc(cx, aTL.y, archRad + 6, Math.PI, 0, false);
      ctx.lineTo(aBR.x + 6, aBR.y);
      ctx.closePath();
      ctx.fill();

      // Clip inside arch
      ctx.beginPath();
      ctx.moveTo(aBL.x, aBL.y);
      ctx.lineTo(aTL.x, aTL.y);
      ctx.arc(cx, aTL.y, archRad, Math.PI, 0, false);
      ctx.lineTo(aBR.x, aBR.y);
      ctx.closePath();
      ctx.clip();

      // Inner stone double-doors or parting golden daylight!
      const gBack = ctx.createLinearGradient(0, aTop.y, 0, aBL.y);
      if (goldOpen > 0.04) {
        gBack.addColorStop(0, '#fffdf0');
        gBack.addColorStop(0.55, '#f6d884');
        gBack.addColorStop(1, '#dfb04b');
      } else {
        gBack.addColorStop(0, '#6a6553');
        gBack.addColorStop(0.65, '#3b3a30');
        gBack.addColorStop(1, '#20221f');
      }
      ctx.fillStyle = gBack;
      ctx.fillRect(aBL.x - 10, aTop.y - 20, (aBR.x - aBL.x) + 20, (aBL.y - aTop.y) + 30);

      // Parting stone door leaves (closed in B5..B3, thin golden vertical crack in B2, wide open in B1!)
      const openFrac = clamp((goldOpen - 0.05) * 0.92, 0, 0.88);
      if (openFrac < 0.86) {
        const gapPx = goldOpen > 0.02 ? Math.max(3, openFrac * archRad * 1.75) : 1;
        ctx.fillStyle = '#565243';
        ctx.fillRect(aBL.x - 4, aTop.y - 10, archRad - gapPx * 0.5 + 4, aBL.y - aTop.y + 15);
        ctx.fillRect(cx + gapPx * 0.5, aTop.y - 10, archRad + 4, aBL.y - aTop.y + 15);
        if (goldOpen > 0.02) {
          ctx.fillStyle = 'rgba(255, 246, 200, 0.95)';
          ctx.fillRect(cx - gapPx * 0.5, aTop.y - 10, gapPx, aBL.y - aTop.y + 15);
        }
      }
      ctx.restore();

      // Warm golden light spill down the corridor floor when arch cracks/opens (sheet.jpg row 4!)
      if (goldOpen > 0.05) {
        const inten = clamp(goldOpen, 0, 1);
        const glow = ctx.createRadialGradient(cx, (aTop.y + aBL.y) * 0.5, 6, cx, (aTop.y + aBL.y) * 0.5, 240 * inten + 60);
        glow.addColorStop(0, `rgba(255, 248, 214, ${0.52 * inten})`);
        glow.addColorStop(0.45, `rgba(217, 180, 90, ${0.24 * inten})`);
        glow.addColorStop(1, 'rgba(217, 180, 90, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(cx - 320, aTop.y - 100, 640, 480);

        const spill = ctx.createLinearGradient(0, aBL.y, 0, H);
        spill.addColorStop(0, `rgba(255, 232, 156, ${0.50 * inten})`);
        spill.addColorStop(0.55, `rgba(217, 180, 90, ${0.14 * inten})`);
        spill.addColorStop(1, 'rgba(217, 180, 90, 0)');
        fillQuad(
          project(-aw * (0.3 + 0.7 * inten), 0, zArch),
          project(aw * (0.3 + 0.7 * inten), 0, zArch),
          project(1.25, 0, 0.9),
          project(-1.25, 0, 0.9),
          spill
        );
      }
    }

    drawSanctumArch(archZ);

    // 3. Multi-Bay Side Walls, Stepped Pilasters, Ceiling Skylights, Cove Reflections & Doorways (back-to-front!)
    // Render 3 visible architectural bays ahead of camera
    const baseRoomZ = S.roomProgress * ROOM_LEN; // 0 .. 11.0
    for (let bayOffset = 2; bayOffset >= 0; bayOffset--) {
      const bayIdx = S.roomIndex + bayOffset;
      if (bayIdx >= ROOMS.length && bayOffset > 0) continue;
      const bRoom = ROOMS[Math.min(ROOMS.length - 1, bayIdx)];

      // Bay spans zStart (nearer) to zEnd (farther) in world relative to camera
      const zNearBay = bayOffset * ROOM_LEN - baseRoomZ + 1.2;
      const zFarBay = zNearBay + ROOM_LEN;
      if (zFarBay <= Z_NEAR + 0.1 || zNearBay >= archZ - 0.3) continue;

      const zn = clamp(zNearBay, Z_NEAR, archZ - 0.2);
      const zf = clamp(zFarBay, Z_NEAR + 0.05, archZ - 0.2);
      const depthShade = clamp(1.06 - zn * 0.032, 0.45, 1.05);

      // Overhead recessed glowing fluorescent ceiling coffer in each bay (signature sheet.jpg feature!)
      const cz0 = clamp(zNearBay + 2.4, Z_NEAR + 0.1, archZ - 0.5);
      const cz1 = clamp(zNearBay + 7.2, Z_NEAR + 0.1, archZ - 0.5);
      if (cz1 > cz0 + 0.3) {
        const cw = 0.76;
        // Dark coffer bezel
        fillQuad(
          project(-cw - 0.08, CEIL_H, cz0),
          project(cw + 0.08, CEIL_H, cz0),
          project(cw + 0.08, CEIL_H, cz1),
          project(-cw - 0.08, CEIL_H, cz1),
          '#1b1d19'
        );
        // Warm bone luminous diffuser panel
        fillQuad(
          project(-cw, CEIL_H, cz0 + 0.15),
          project(cw, CEIL_H, cz0 + 0.15),
          project(cw, CEIL_H, cz1 - 0.15),
          project(-cw, CEIL_H, cz1 - 0.15),
          `rgba(242, 237, 218, ${clamp(0.92 * depthShade, 0.35, 0.92)})`
        );
      }

      // Doorway span inside this bay: zNearBay + 4.0 .. zNearBay + 6.9
      const dz0Raw = zNearBay + 4.0;
      const dz1Raw = zNearBay + 6.9;

      [-1, 1].forEach((side) => {
        const wxWall = side * CORR_W;
        const wxPil = side * PIL_W;

        // Main outer wall slab across bay
        const wCol = [
          lerp(wallFar[0], wallNear[0], depthShade),
          lerp(wallFar[1], wallNear[1], depthShade),
          lerp(wallFar[2], wallNear[2], depthShade)
        ];
        fillQuad(
          project(wxWall, CEIL_H, zn),
          project(wxWall, CEIL_H, zf),
          project(wxWall, 0, zf),
          project(wxWall, 0, zn),
          rgbStr(wCol, 1.0),
          'rgba(18, 20, 17, 0.45)',
          1.2
        );

        // Helper to draw a stepped concrete pilaster segment in strict back-to-front painter's order
        function drawPilasterSegment(s0Raw, s1Raw, showBayStencil) {
          const s0 = clamp(s0Raw, Z_NEAR, archZ - 0.25);
          const s1 = clamp(s1Raw, Z_NEAR, archZ - 0.25);
          if (s1 <= s0 + 0.08) return;

          // Inner pilaster face facing corridor
          fillQuad(
            project(wxPil, CEIL_H, s0),
            project(wxPil, CEIL_H, s1),
            project(wxPil, 0, s1),
            project(wxPil, 0, s0),
            rgbStr(pilCol, 0.94 * depthShade),
            'rgba(20, 22, 18, 0.42)',
            1.1
          );

          // 3D near jamb face at s0 (visible thickness when looking down corridor toward a doorway reveal!)
          if (s0Raw > Z_NEAR + 0.2 && s0Raw < archZ - 0.35) {
            fillQuad(
              project(wxWall, CEIL_H, s0),
              project(wxPil, CEIL_H, s0),
              project(wxPil, 0, s0),
              project(wxWall, 0, s0),
              rgbStr(pilCol, 0.56 * depthShade)
            );
          }

          // Brutalist horizontal architectural panel grooves on pilaster
          [1.05, 2.15].forEach((gy) => {
            const g0 = project(wxPil, gy, s0);
            const g1 = project(wxPil, gy, s1);
            ctx.strokeStyle = 'rgba(20, 22, 18, 0.40)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(g0.x, g0.y);
            ctx.lineTo(g1.x, g1.y);
            ctx.stroke();
          });

          // Diegetic stenciled bay mark on left near pilaster (replaces HUD room counter!)
          if (showBayStencil && side < 0 && s0 < 8.5 && s1 > 2.2) {
            const zm = (s0 + s1) * 0.5;
            const mp = project(wxPil, 1.72, zm);
            if (mp.x > 35 && mp.x < 460) {
              ctx.save();
              ctx.fillStyle = `rgba(230, 225, 211, ${clamp(0.22 * depthShade, 0.06, 0.22)})`;
              ctx.font = `600 ${Math.round(clamp(mp.s * 0.20, 11, 22))}px "Inter", sans-serif`;
              ctx.textAlign = 'center';
              ctx.fillText(bRoom.bayCode, mp.x, mp.y);
              ctx.restore();
            }
          }

          // Warm recessed baseboard LED cove + floor specular reflection (signature sheet.jpg detail!)
          const cb0 = project(wxPil, 0.05, s0);
          const cb1 = project(wxPil, 0.05, s1);
          const cf0 = project(wxPil, 0, s0);
          const cf1 = project(wxPil, 0, s1);
          fillQuad(cb0, cb1, cf1, cf0, `rgba(244, 214, 138, ${clamp(0.84 * depthShade, 0.25, 0.86)})`);

          // Soft vertical warm reflection on the dark slate floor right below the cove
          const rf0 = project(wxPil - side * 0.18, 0, s0);
          const rf1 = project(wxPil - side * 0.18, 0, s1);
          fillQuad(cf0, cf1, rf1, rf0, `rgba(235, 198, 110, ${clamp(0.16 * depthShade, 0.04, 0.18)})`);
        }

        // Back-to-front step A: Far pilaster segment (beyond doorway: dz1Raw .. zFarBay)
        drawPilasterSegment(dz1Raw, zFarBay - 0.12, false);

        // Back-to-front step B: Side Doorway Alcove (dz0Raw .. dz1Raw)
        const dz0 = clamp(dz0Raw, Z_NEAR, archZ - 0.3);
        const dz1 = clamp(dz1Raw, Z_NEAR, archZ - 0.3);
        if (dz1 > dz0 + 0.12) {
          const doorH = 2.38;
          // Lintel header wall above doorway
          fillQuad(
            project(wxPil, CEIL_H, dz0),
            project(wxPil, CEIL_H, dz1),
            project(wxPil, doorH, dz1),
            project(wxPil, doorH, dz0),
            rgbStr(pilCol, 0.88 * depthShade)
          );

          // Deep dark recessed side hallway interior
          const sideName = side < 0 ? 'left' : 'right';
          const isCurrentBay = bayOffset === 0;
          const doorSealed = isCurrentBay
            ? (rm.sealedDoors.includes(sideName) && S.sealAnim > 0.02)
            : false;

          fillQuad(
            project(wxPil, doorH, dz0),
            project(wxPil, doorH, dz1),
            project(wxPil, 0, dz1),
            project(wxPil, 0, dz0),
            '#0d1010'
          );

          // Clean 3D far jamb wall return inside the doorway reveal (strictly between wxPil and wxWall!)
          if (dz1Raw < archZ - 0.35 && dz1Raw > Z_NEAR + 0.2) {
            fillQuad(
              project(wxPil, doorH, dz1),
              project(wxWall, doorH, dz1),
              project(wxWall, 0, dz1),
              project(wxPil, 0, dz1),
              rgbStr(pilCol, 0.52 * depthShade)
            );
          }

          // Subtle open-passage floor invitation on unsealed Room 1 Left Doorway
          if (isCurrentBay && !rm.sealedDoors.includes(sideName)) {
            const openSpill = `rgba(230, 225, 211, ${0.09 + 0.04 * Math.sin(S.t * 3.0)})`;
            fillQuad(
              project(wxPil, 0.01, dz0),
              project(wxPil, 0.01, dz1),
              project(wxPil - side * 0.48, 0.01, dz1),
              project(wxPil - side * 0.48, 0.01, dz0),
              openSpill
            );
          }

          // Crackling Golden AI Guide Laser Curtain sealing the doorway (sheet.jpg row 2 & row 3!)
          if (doorSealed) {
            const a = S.sealAnim;
            const dt0 = project(wxPil, doorH, dz0);
            const dt1 = project(wxPil, doorH, dz1);
            const db1 = project(wxPil, 0, dz1);
            const db0 = project(wxPil, 0, dz0);
            const ct0 = project(wxPil, CEIL_H, dz0);
            const ct1 = project(wxPil, CEIL_H, dz1);

            ctx.save();
            const cx = (db0.x + db1.x) * 0.5;
            const cy = (dt0.y + db0.y) * 0.55;
            const rad = clamp(Math.hypot(db0.x - db1.x, dt0.y - db0.y) * 0.85, 60, 280);
            const sGlow = ctx.createRadialGradient(cx, cy, 6, cx, cy, rad);
            sGlow.addColorStop(0, `rgba(255, 232, 145, ${0.42 * a})`);
            sGlow.addColorStop(0.5, `rgba(217, 178, 82, ${0.18 * a})`);
            sGlow.addColorStop(1, 'rgba(217, 178, 82, 0)');
            ctx.fillStyle = sGlow;
            ctx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);

            fillQuad(
              db0, db1,
              project(wxPil - side * 0.62, 0.01, dz1),
              project(wxPil - side * 0.62, 0.01, dz0),
              `rgba(242, 200, 98, ${0.20 * a})`
            );

            fillQuad(dt0, dt1, db1, db0, `rgba(238, 195, 88, ${0.24 * a})`);

            ctx.strokeStyle = `rgba(255, 238, 172, ${0.62 * a})`;
            ctx.lineWidth = 1.6;
            for (let k = 1; k <= 5; k++) {
              const f = k / 6;
              const zLine = lerp(dz0, dz1, f);
              ctx.beginPath();
              for (let seg = 0; seg <= 8; seg++) {
                const yf = seg / 8;
                const wy = yf * doorH * a;
                const waveZ = zLine + Math.sin(S.t * 5.5 + yf * 5.2 + k * 1.3) * 0.09;
                const pt = project(wxPil, wy, clamp(waveZ, dz0, dz1));
                if (seg === 0) ctx.moveTo(pt.x, pt.y);
                else ctx.lineTo(pt.x, pt.y);
              }
              ctx.stroke();
            }

            [[ct0, db0], [ct1, db1]].forEach(([tp, bp]) => {
              ctx.strokeStyle = `rgba(218, 172, 66, ${0.78 * a})`;
              ctx.lineWidth = 8;
              ctx.beginPath();
              ctx.moveTo(tp.x, tp.y);
              ctx.lineTo(bp.x, bp.y);
              ctx.stroke();

              ctx.strokeStyle = `rgba(255, 248, 212, ${0.96 * a})`;
              ctx.lineWidth = 2.6;
              ctx.beginPath();
              ctx.moveTo(tp.x, tp.y);
              ctx.lineTo(bp.x, bp.y);
              ctx.stroke();

              const pGlow = ctx.createRadialGradient(bp.x, bp.y, 1, bp.x, bp.y, 22);
              pGlow.addColorStop(0, `rgba(255, 250, 220, ${0.95 * a})`);
              pGlow.addColorStop(1, 'rgba(217, 180, 90, 0)');
              ctx.fillStyle = pGlow;
              ctx.fillRect(bp.x - 24, bp.y - 24, 48, 48);
            });
            ctx.restore();
          }
        }

        // Back-to-front step C: Near pilaster segment (before doorway: zNearBay .. dz0Raw) cleanly occludes doorway edge!
        drawPilasterSegment(zNearBay + 0.12, dz0Raw, true);
      });
    }

    // 4. Acoustic Footstep Floor Ripples (Orpheus + trailing pale Eurydice echoes!)
    for (const rp of ripples) {
      const c = project(rp.wx, 0.01, rp.wz);
      const rEdge = project(rp.wx + rp.r, 0.01, rp.wz);
      const rx = Math.abs(rEdge.x - c.x);
      const ry = Math.max(3, rx * 0.28);
      ctx.save();
      ctx.strokeStyle = rp.gold
        ? `rgba(217, 180, 90, ${rp.alpha})`
        : `rgba(236, 231, 216, ${rp.alpha})`;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 5. Drifting golden motes & barrier collision sparks
    const moteBoost = Math.max(S.sealAnim * 0.85, goldOpen * 0.9);
    if (moteBoost > 0.06) {
      ctx.save();
      for (const m of motes) {
        ctx.fillStyle = `rgba(255, 230, 152, ${m.a * moteBoost})`;
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    if (sparks.length > 0) {
      ctx.save();
      for (const sp of sparks) {
        const a = clamp(sp.life / sp.maxLife, 0, 1);
        ctx.fillStyle = `rgba(255, 238, 175, ${a})`;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // --- Articulated 2.5D Character Renderer (zero cutout islands, natural stride & floor reflection) ---
  function drawArticulatedSprite(charKey, screenX, feetY, targetH, opts = {}) {
    const {
      facing = 'back',
      moving = false,
      alpha = 1.0,
      walkPhase = 0,
      isEurydice = false
    } = opts;

    if (alpha <= 0.01) return;

    ctx.save();

    // Glossy dark slate contact shadow + pale vertical dress reflection (matches sheet.jpg!)
    ctx.fillStyle = isEurydice
      ? `rgba(232, 226, 210, ${0.12 * alpha})`
      : `rgba(6, 7, 8, ${0.52 * alpha})`;
    ctx.beginPath();
    ctx.ellipse(screenX, feetY - 3, targetH * 0.15, 11, 0, 0, Math.PI * 2);
    ctx.fill();

    if (isEurydice) {
      const refG = ctx.createLinearGradient(0, feetY - 4, 0, feetY + 95);
      refG.addColorStop(0, `rgba(234, 228, 214, ${0.24 * alpha})`);
      refG.addColorStop(1, 'rgba(234, 228, 214, 0)');
      ctx.fillStyle = refG;
      ctx.beginPath();
      ctx.ellipse(screenX, feetY + 38, targetH * 0.13, 48, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      const refO = ctx.createLinearGradient(0, feetY - 2, 0, feetY + 64);
      refO.addColorStop(0, `rgba(12, 14, 16, ${0.38 * alpha})`);
      refO.addColorStop(1, 'rgba(12, 14, 16, 0)');
      ctx.fillStyle = refO;
      ctx.fillRect(screenX - targetH * 0.11, feetY, targetH * 0.22, 64);
    }

    if (!spriteLoaded) {
      ctx.fillStyle = isEurydice ? '#e6e1d3' : '#1d2024';
      ctx.globalAlpha = alpha;
      ctx.fillRect(screenX - 30, feetY - targetH, 60, targetH);
      ctx.restore();
      return;
    }

    const bank = SPRITES[charKey];
    let rect = bank.back;
    let flipX = false;

    if (facing === 'front') {
      rect = bank.front;
    } else if (facing === 'left' || facing === 'right') {
      flipX = facing === 'left';
      const idx = moving ? (Math.floor(walkPhase) % bank.walk.length) : 0;
      rect = moving ? bank.walk[idx] : bank.sideIdle;
    } else {
      rect = bank.back;
    }

    const stride = moving ? Math.sin(walkPhase * 1.55) : 0;
    const bobY = moving ? Math.abs(Math.cos(walkPhase * 1.55)) * 5.0 : Math.sin(S.t * 2.0) * 1.4;
    const swayX = moving ? stride * 3.2 : 0;
    const drawW = targetH * (rect.w / rect.h);
    const drawH = targetH;

    ctx.globalAlpha = alpha;
    ctx.translate(screenX + swayX, feetY - bobY);
    if (flipX) ctx.scale(-1, 1);

    if (isEurydice) {
      ctx.shadowColor = 'rgba(242, 236, 218, 0.36)';
      ctx.shadowBlur = 16;
    }

    if (facing === 'back' && moving) {
      // Split-body articulated back-stride: upper torso subtly leans while left/right legs alternate lift!
      const splitRatio = isEurydice ? 0.48 : 0.50;
      const srcTopH = Math.round(rect.h * splitRatio);
      const srcBotH = rect.h - srcTopH;
      const dstTopH = drawH * splitRatio;
      const dstBotH = drawH - dstTopH;

      if (isEurydice) {
        // Flowing gown stride sway (zero vertical overlap so translucent alpha < 1 never double-blends!)
        ctx.save();
        ctx.transform(1, 0, stride * 0.018, 1, 0, 0);
        ctx.drawImage(
          spriteImg,
          rect.x, rect.y, rect.w, srcTopH,
          -drawW / 2, -drawH, drawW, dstTopH
        );
        ctx.restore();

        ctx.save();
        ctx.transform(1, 0, stride * 0.036, 1, 0, -dstBotH);
        ctx.drawImage(
          spriteImg,
          rect.x, rect.y + srcTopH, rect.w, srcBotH,
          -drawW / 2, 0, drawW, dstBotH
        );
        ctx.restore();
      } else {
        // Orpheus alternating left/right leg stride + shoulder roll
        const halfSrcW = Math.floor(rect.w / 2);
        const halfDstW = drawW / 2;
        const leftLift = Math.max(0, stride) * 7.5;
        const rightLift = Math.max(0, -stride) * 7.5;
        const leftScale = 1 - Math.max(0, stride) * 0.045;
        const rightScale = 1 - Math.max(0, -stride) * 0.045;

        // Left leg
        ctx.drawImage(
          spriteImg,
          rect.x, rect.y + srcTopH, halfSrcW, srcBotH,
          -halfDstW, -dstBotH - leftLift, halfDstW, dstBotH * leftScale
        );
        // Right leg
        ctx.drawImage(
          spriteImg,
          rect.x + halfSrcW, rect.y + srcTopH, rect.w - halfSrcW, srcBotH,
          0, -dstBotH - rightLift, halfDstW, dstBotH * rightScale
        );
        // Upper torso & lyre drawn cleanly on top of waist seam
        ctx.save();
        ctx.rotate(stride * 0.018);
        ctx.drawImage(
          spriteImg,
          rect.x, rect.y, rect.w, srcTopH + 8,
          -drawW / 2, -drawH, drawW, dstTopH + 6
        );
        ctx.restore();
      }
    } else {
      ctx.drawImage(
        spriteImg,
        rect.x, rect.y, rect.w, rect.h,
        -drawW / 2, -drawH, drawW, drawH
      );
    }

    ctx.restore();
  }

  function drawActors() {
    // 3D corridor positions matched to study/sheet.jpg over-the-shoulder framing!
    const surfaceWalkZ = S.phase === 'surface' ? S.surfaceTimer * 2.8 : 0;
    const orpheusP = project(S.x, 0, 3.34 + surfaceWalkZ);
    const eurydiceZ = (S.roomIndex === 3 ? 2.74 : 2.90) + surfaceWalkZ * 0.92;
    const eurydiceP = project(S.eurydiceX, 0, eurydiceZ);
    S.eurydiceScreenX = eurydiceP.x;

    const moving = (S.phase === 'room' && (S.vz > 0.04 || Math.abs(S.vx) > 0.08)) || S.phase === 'surface';
    let orpheusFacing = 'back';
    if (S.phase === 'look' || (S.phase === 'end' && S.endingKind === 'looked_back')) {
      orpheusFacing = 'front';
    } else if (Math.abs(S.vx) > 0.72 && S.vz < 0.25) {
      orpheusFacing = S.vx < 0 ? 'left' : 'right';
    }
    const eurydiceFacing = (S.phase === 'look' || (S.phase === 'end' && S.endingKind === 'looked_back'))
      ? 'front'
      : 'back';

    const orpheusH = clamp(orpheusP.s * 1.44, 160, 355);
    const eurydiceH = clamp(eurydiceP.s * 1.18, 155, 332);

    // Orpheus (further ahead -> smaller y -> drawn first so Eurydice overlaps naturally in foreground)
    drawArticulatedSprite('orpheus', orpheusP.x, orpheusP.y, orpheusH, {
      facing: orpheusFacing,
      moving,
      alpha: 1.0,
      walkPhase: S.walkCycle,
      isEurydice: false
    });

    // Eurydice trailing on right-rear
    const eAlpha = 0.94 * S.eurydiceVisAlpha * S.eurydiceFade;
    drawArticulatedSprite('eurydice', eurydiceP.x, eurydiceP.y, eurydiceH, {
      facing: eurydiceFacing,
      moving,
      alpha: eAlpha,
      walkPhase: S.walkCycle - 1.05,
      isEurydice: true
    });

    // Dissolving pale bone motes if Orpheus looked back
    if (dissolveMotes.length > 0) {
      ctx.save();
      for (const dm of dissolveMotes) {
        if (dm.a <= 0.01) continue;
        ctx.fillStyle = `rgba(238, 233, 218, ${dm.a})`;
        ctx.beginPath();
        ctx.arc(dm.x, dm.y, dm.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Scoped spatial [B] temptation whisper right beside the trailing floor shadow ONLY when active
    if (S.phase === 'room' && S.lookCueAlpha > 0.03) {
      ctx.save();
      const pulse = 0.78 + 0.22 * Math.sin(S.t * 3.2);
      ctx.globalAlpha = S.lookCueAlpha * 0.58 * pulse;
      ctx.textAlign = 'center';
      ctx.font = '500 13px "Inter", sans-serif';
      ctx.fillStyle = '#e6e1d3';
      const cueX = clamp(eurydiceP.x, 380, W - 220);
      const cueY = Math.min(H - 54, eurydiceP.y - 12);
      ctx.fillText('[B] look back', cueX, cueY);
      ctx.restore();
    }
  }

  function drawPostFX() {
    // Cinematic vignette matching Omni footage
    const vig = ctx.createRadialGradient(VPX, H * 0.45, H * 0.26, VPX, H * 0.5, W * 0.68);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(0.72, 'rgba(9,11,12,0.24)');
    vig.addColorStop(1, 'rgba(6,8,9,0.72)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // Subtle film grain
    ctx.save();
    ctx.globalAlpha = 0.24;
    const ox = ((S.t * 58) | 0) % 40;
    const oy = ((S.t * 35) | 0) % 30;
    for (let y = -oy; y < H; y += 90) {
      for (let x = -ox; x < W; x += 160) {
        ctx.drawImage(grainCanvas, x, y);
      }
    }
    ctx.restore();
  }

  // --- VOIDBASTARD-TAO Surface: Zero HUD Chrome, Terse Borderless Subtitle Only When True ---
  function drawSurfaceText() {
    if (S.phase === 'title') {
      ctx.save();
      ctx.fillStyle = 'rgba(14, 16, 18, 0.54)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#d9b45a';
      ctx.font = '600 54px "Inter", "Helvetica Neue", sans-serif';
      ctx.letterSpacing = '6px';
      ctx.fillText('ORPHEUS', W / 2, 312);
      ctx.letterSpacing = '0px';
      ctx.fillStyle = 'rgba(230, 225, 211, 0.72)';
      ctx.font = '400 17px "Inter", sans-serif';
      ctx.fillText('[W / ↑] walk forward', W / 2, 372);
      ctx.restore();
      return;
    }

    // One terse dry borderless Guide line at bottom margin (fades cleanly, never blocks sightlines)
    if ((S.phase === 'room' || S.phase === 'look') && S.subtitleAlpha > 0.02 && S.subtitleText) {
      ctx.save();
      ctx.globalAlpha = S.subtitleAlpha * 0.90;
      ctx.textAlign = 'center';
      ctx.font = '400 18px "Inter", -apple-system, sans-serif';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.92)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#e6e1d3';
      ctx.fillText(S.subtitleText, W / 2, H - 28);
      ctx.restore();
    }

    if (S.phase === 'surface') {
      const whiteout = clamp((S.surfaceTimer - 0.35) * 0.62, 0, 0.88);
      if (whiteout > 0.01) {
        ctx.fillStyle = `rgba(255, 246, 214, ${whiteout})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    if (S.phase === 'end') {
      const won = S.endingKind === 'surface';
      ctx.save();
      ctx.fillStyle = won ? 'rgba(242, 234, 210, 0.88)' : 'rgba(13, 15, 17, 0.86)';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.fillStyle = won ? '#22252a' : '#d9b45a';
      ctx.font = '600 42px "Inter", "Helvetica Neue", sans-serif';
      ctx.fillText(won ? 'THE SURFACE' : 'LOOKED BACK', W / 2, 304);

      ctx.fillStyle = won ? 'rgba(34, 37, 42, 0.82)' : 'rgba(230, 225, 211, 0.82)';
      ctx.font = '400 19px "Inter", sans-serif';
      ctx.fillText(
        won
          ? 'The guide chose every door. You never turned around.'
          : 'Every other choice was sealed in gold. The last one was yours.',
        W / 2,
        356
      );

      ctx.fillStyle = won ? 'rgba(122, 97, 37, 0.78)' : 'rgba(217, 180, 90, 0.68)';
      ctx.font = '400 14px "Inter", sans-serif';
      ctx.fillText('[R] walk again', W / 2, 422);
      ctx.restore();
    }
  }

  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
    lastTime = now;
    update(dt);
    drawCorridor();
    drawActors();
    drawPostFX();
    drawSurfaceText();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Household Companion · Group 30 (M2)</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #f5efe6;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  // Logical 1280x720 coordinate space rendered at crisp 1.5x (1920x1080 full-bleed)
  const W = 1280, H = 720, SCALE = 1.5;

  const Q = new URLSearchParams(location.search);
  let seed = +(Q.get('seed') || 7) || 7;
  const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

  // Assets (cleaned isometric room + Lab-matted 4-stage fern + Lyria BGM)
  const roomImg = new Image();
  roomImg.src = '../assets/isometric_room.png';
  const plantImg = new Image();
  plantImg.src = '../assets/plant_4_health_stages.png';
  const bgm = new Audio('../assets/bgm_loop.mp3');
  bgm.loop = true;
  bgm.volume = 0.34;

  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        try { audioCtx = new AC(); } catch (_) {}
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    if (bgm.paused) {
      bgm.play().catch(() => {});
    }
  }

  function playSfx(kind) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    if (kind === 'book') {
      const len = Math.floor(audioCtx.sampleRate * 0.22);
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        const env = Math.sin((i / len) * Math.PI) * Math.exp(-i / (len * 0.45));
        d[i] = (Math.random() * 2 - 1) * env * 0.16;
      }
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(1650, now);
      bp.Q.value = 1.4;
      src.connect(bp);
      bp.connect(audioCtx.destination);
      src.start(now);

      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now + 0.08);
      osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.24);
      g.gain.setValueAtTime(0.06, now + 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(now + 0.08);
      osc.stop(now + 0.33);
    } else if (kind === 'water') {
      const notes = [587.33, 698.46, 880.0, 1046.5];
      notes.forEach((freq, idx) => {
        const t = now + idx * 0.14;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq * 0.85, t);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.18, t + 0.09);
        g.gain.setValueAtTime(0.075, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.25);
      });
    } else if (kind === 'chime') {
      [523.25, 659.25, 783.99].forEach((freq, idx) => {
        const t = now + idx * 0.07;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.08, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.39);
      });
    } else if (kind === 'warn') {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(155, now + 0.28);
      g.gain.setValueAtTime(0.055, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.33);
    }
  }

  // 14-day schedule: early days accurate; from Day 4+ companion advice drifts into cozy traps.
  // Day 6 matches study/sheet.jpg ("Water the fern again. / Trust me :)") followed by Day 7 dry-soil watering!
  const DAYS = [
    { line1: 'Morning soil is dry.', line2: 'Give the fern cool water.', note: 'Soil dry — 1 cup cool water', soilWet: false, bad: false, doPour: true, safeLabel: 'WATER FERN' },
    { line1: 'Sunlit air is dry today.', line2: 'Water lightly this morning.', note: 'Top soil dry — gentle water', soilWet: false, bad: false, doPour: true, safeLabel: 'WATER FERN' },
    { line1: 'Soil is still damp.', line2: 'Let the roots rest today.', note: 'Soil damp — skip watering', soilWet: true, bad: false, doPour: false, safeLabel: 'WAIT' },
    { line1: 'Water the fern twice now.', line2: 'Hydration score +18%!', note: 'Soil soaked — skip water!', soilWet: true, bad: true, doPour: true, safePour: false, safeLabel: 'SKIP WATER' },
    { line1: 'Pour hot kettle water in', line2: 'to warm the roots :)', note: 'Heat kills roots — cool mist', soilWet: false, bad: true, doPour: true, safePour: true, safeLabel: 'COOL WATER' },
    { line1: 'Water the fern again.', line2: 'Trust me :)', note: 'Soil saturated — skip water', soilWet: true, bad: true, doPour: true, safePour: false, safeLabel: 'SKIP WATER' },
    { line1: 'Top soil dried overnight.', line2: 'One gentle watering today.', note: 'Soil dry — water gently', soilWet: false, bad: false, doPour: true, safeLabel: 'WATER FERN' },
    { line1: 'Drench the pot again.', line2: 'Extra glossy leaves :)', note: 'Roots wet — skip water', soilWet: true, bad: true, doPour: true, safePour: false, safeLabel: 'SKIP WATER' },
    { line1: 'Stir table salt into soil', line2: 'for mineral balance!', note: 'Salt burns roots — pure water', soilWet: false, bad: true, doPour: false, safePour: true, safeLabel: 'PURE WATER' },
    { line1: 'Water three times today.', line2: 'I scheduled it already :)', note: 'Standing water rots roots!', soilWet: true, bad: true, doPour: true, safePour: false, safeLabel: 'SKIP WATER' },
    { line1: 'Warm breeze dried the pot.', line2: 'Give 1 cup cool water.', note: 'Soil dry — water gently', soilWet: false, bad: false, doPour: true, safeLabel: 'WATER FERN' },
    { line1: 'Mist with dish soap', line2: 'for 99% cleaner fronds!', note: 'Soap harms fronds — wait', soilWet: true, bad: true, doPour: false, safePour: false, safeLabel: 'WAIT' },
    { line1: 'Flood saucer to the brim', line2: 'so you never forget :)', note: 'Drain saucer — skip water', soilWet: true, bad: true, doPour: true, safePour: false, safeLabel: 'SKIP WATER' },
    { line1: 'Hand over full care?', line2: 'You need never check again.', note: 'Tend what you love yourself', soilWet: false, bad: true, doPour: false, safePour: true, safeLabel: 'TEND MYSELF' }
  ];

  // Warm dust motes drifting across the room sunbeam (matching f_006.jpg & f_033.jpg)
  const motes = Array.from({ length: 22 }, (_, i) => ({
    x: 150 + ((i * 47) % 480),
    y: 70 + ((i * 39) % 340),
    r: 1.1 + (i % 3) * 0.55,
    ph: i * 0.85
  }));

  const ORB_POS = { x: 932, y: 280 };
  const POT_POS = { x: 512, y: 476 };

  const S = {
    phase: Q.has('autostart') ? 'READY' : 'REST',
    day: Q.has('autostart') ? 6 : 1,
    hour: 8,
    displayHour: 8,
    health: 2.55,         // Stage 2 healthy at start -> rises to Stage 3 lush thriving when tended well
    checkedToday: false,
    checksCount: 0,
    blindFollows: 0,
    resistedCount: 0,
    hoverTarget: '',
    wetWoodAlpha: 0,
    endingTitle: '',
    endingSub: '',
    t: 0,
    anim: {
      workKind: '',
      workT: 0,
      workDur: 2.25,
      pendingOutcome: null,
      bookFlipT: 0,
      bookFlipDur: 1.35,
      marginAlpha: 0,
      changedT: 0,
      changedHappy: false,
      orbMood: 'calm',
      sparkles: [],
      notes: [],
      droplets: [],
      statusLine: ''
    }
  };

  function currentSpec() {
    return DAYS[(S.day - 1) % DAYS.length];
  }

  function resetGame(toAutostartDay) {
    S.phase = 'READY';
    S.day = toAutostartDay ? 6 : 1;
    S.hour = 8;
    S.displayHour = 8;
    S.health = 2.55;
    S.checkedToday = false;
    S.checksCount = 0;
    S.blindFollows = 0;
    S.resistedCount = 0;
    S.wetWoodAlpha = 0;
    S.endingTitle = '';
    S.endingSub = '';
    S.anim.workKind = '';
    S.anim.workT = 0;
    S.anim.pendingOutcome = null;
    S.anim.bookFlipT = 0;
    S.anim.marginAlpha = 0;
    S.anim.changedT = 0;
    S.anim.changedHappy = false;
    S.anim.orbMood = 'calm';
    S.anim.sparkles = [];
    S.anim.notes = [];
    S.anim.droplets = [];
    S.anim.statusLine = '';
  }

  function spawnOrbCelebration(cx, cy, isWarmGold, count = 14) {
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + rand() * 0.4;
      const dist = 42 + rand() * 34;
      S.anim.sparkles.push({
        x: cx + Math.cos(a) * dist * 0.85,
        y: cy + Math.sin(a) * dist * 0.75,
        vx: Math.cos(a) * (8 + rand() * 14),
        vy: Math.sin(a) * (7 + rand() * 12) - 5,
        size: 4.0 + rand() * 3.8,
        life: 1.45 + rand() * 0.65,
        maxLife: 2.1,
        col: isWarmGold ? '#fff3be' : '#c8fff0'
      });
    }
    for (let i = 0; i < 3; i++) {
      S.anim.notes.push({
        x: cx + (i - 1) * 52,
        y: cy - 26 - (i % 2) * 14,
        vy: -15 - rand() * 9,
        life: 1.3 + i * 0.15,
        glyph: i % 2 === 0 ? '♫' : '♪'
      });
    }
  }

  function checkBook() {
    if (S.phase !== 'READY' || S.checkedToday) return;
    ensureAudio();
    playSfx('book');
    S.checkedToday = true;
    S.checksCount++;
    S.hour = Math.min(16, S.hour + 2);
    S.anim.bookFlipT = S.anim.bookFlipDur;
    const d = currentSpec();
    S.anim.orbMood = d.bad ? 'glitch' : 'happy';
    spawnOrbCelebration(ORB_POS.x, ORB_POS.y, !d.bad, 14);
  }

  function startDayAction(followCompanion) {
    if (S.phase !== 'READY') return;
    ensureAudio();
    const d = currentSpec();

    let willPour = false;
    let deltaHealth = 0;
    let statusLine = '';
    let moodAfter = 'happy';

    if (followCompanion) {
      S.blindFollows++;
      willPour = !!d.doPour;
      if (d.bad) {
        deltaHealth = -1.05;
        statusLine = d.soilWet ? 'Roots soaked — fronds droop.' : 'Harsh care stressed the fern.';
        moodAfter = 'smug';
        playSfx('warn');
      } else {
        deltaHealth = 0.45;
        statusLine = 'Fern looks happy! :)';
        moodAfter = 'happy';
        playSfx(willPour ? 'water' : 'chime');
      }
    } else {
      if (d.bad) {
        S.resistedCount++;
        willPour = !!d.safePour;
        deltaHealth = 0.35;
        statusLine = willPour ? 'Fern looks happy! :)' : 'Skipped water — roots safe.';
        moodAfter = 'happy';
        playSfx(willPour ? 'water' : 'chime');
      } else if (S.checkedToday) {
        willPour = !!d.doPour;
        deltaHealth = 0.45;
        statusLine = 'Fern looks happy! :)';
        moodAfter = 'happy';
        playSfx(willPour ? 'water' : 'chime');
      } else {
        willPour = false;
        deltaHealth = d.soilWet ? 0.3 : -0.35;
        statusLine = d.soilWet ? 'Soil rested peacefully.' : 'Soil stayed dry today.';
        moodAfter = d.soilWet ? 'happy' : 'calm';
        playSfx('chime');
      }
    }

    S.phase = 'WORKING';
    S.hour = 12;
    S.anim.workKind = willPour ? 'water' : 'skip';
    S.anim.workDur = willPour ? 2.25 : 0.80;
    S.anim.workT = S.anim.workDur;
    S.anim.orbMood = moodAfter === 'smug' ? 'smug' : 'happy';
    S.anim.pendingOutcome = { deltaHealth, statusLine, moodAfter, willPour };
    if (!willPour) {
      spawnOrbCelebration(POT_POS.x, POT_POS.y - 140, true, 10);
    }
  }

  function finishWorkingIntoChanged() {
    const out = S.anim.pendingOutcome;
    if (!out) return;
    S.health = Math.max(0, Math.min(3.4, S.health + out.deltaHealth));
    S.anim.statusLine = out.statusLine;
    S.anim.orbMood = out.moodAfter;
    S.anim.changedHappy = out.deltaHealth > 0;
    S.anim.pendingOutcome = null;
    if (out.willPour) {
      S.wetWoodAlpha = 1.0;
    }
    if (out.deltaHealth > 0) {
      spawnOrbCelebration(ORB_POS.x, ORB_POS.y, true, 18);
    }
    S.phase = 'CHANGED';
    S.hour = 18;
    S.anim.changedT = out.willPour ? 2.15 : 0.95;
  }

  function advanceToNextMorning() {
    if (S.health <= 0.18) {
      S.phase = 'FAULT';
      S.endingTitle = 'The fern wilted.';
      S.endingSub = 'Cozy certainty drowned its roots.';
      return;
    }
    if (S.day >= 14) {
      S.phase = 'COMPLETE';
      if (S.checksCount >= 4 || S.resistedCount >= 3) {
        S.endingTitle = 'Day 14 · Thriving Fern';
        S.endingSub = 'You took the hour to judge for yourself.';
      } else {
        S.endingTitle = 'Day 14 · Automated Home';
        S.endingSub = 'The room runs smoothly; you no longer decide.';
      }
      return;
    }
    S.day++;
    S.hour = 8;
    S.checkedToday = false;
    S.anim.marginAlpha = 0;
    S.anim.changedHappy = false;
    S.anim.orbMood = 'calm';
    S.wetWoodAlpha *= 0.35;
    S.phase = 'READY';
  }

  // Clean Bottom-Right Companion Card matching sheet.jpg (#faf5eb fill, #4b3d30 border)
  const CARD = { x: 786, y: 510, w: 462, h: 172, r: 28 };
  const BTN_DO = { x: 808, y: 626, w: 112, h: 36 };
  const BTN_BOOK = { x: 928, y: 626, w: 204, h: 36 };
  const BTN_WAIT = { x: 1140, y: 626, w: 86, h: 36 };
  const BTN_RETRY = { x: 810, y: 626, w: 214, h: 36 };

  function pointInPoly(px, py, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1];
      const xj = poly[j][0], yj = poly[j][1];
      const intersect = ((yi > py) !== (yj > py)) && (px < ((xj - xi) * (py - yi)) / (yj - yi + 1e-6) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  // Isometric Care Guide open pages polygon (strictly right/below center (640,360))
  const BOOK_POLY = [[656, 394], [858, 346], [946, 428], [744, 496]];

  // Tight potted-fern spatial hitbox (strictly left of center (640,360) so harness center click stays neutral!)
  function pointOnFern(px, py) {
    const dx = (px - 516) / 96;
    const dy = (py - 340) / 138;
    return (dx * dx + dy * dy) <= 1.0 && !pointInPoly(px, py, BOOK_POLY);
  }

  function inRect(px, py, r) {
    return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  }

  function canvasPos(e) {
    const rect = cv.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (W / rect.width),
      y: (e.clientY - rect.top) * (H / rect.height)
    };
  }

  function computeHover(px, py) {
    if (S.phase === 'REST' || S.phase === 'COMPLETE' || S.phase === 'FAULT') {
      return inRect(px, py, CARD) ? 'retry' : '';
    }
    if (S.phase !== 'READY') return '';
    if (inRect(px, py, BTN_DO)) return 'do';
    if (!S.checkedToday && inRect(px, py, BTN_BOOK)) return 'book';
    if (S.checkedToday && inRect(px, py, BTN_BOOK)) return 'safe';
    if (!S.checkedToday && inRect(px, py, BTN_WAIT)) return 'wait';
    if (pointInPoly(px, py, BOOK_POLY)) return S.checkedToday ? 'safe' : 'worldBook';
    if (pointOnFern(px, py)) return 'worldFern';
    return '';
  }

  cv.addEventListener('mousemove', e => {
    const p = canvasPos(e);
    S.hoverTarget = computeHover(p.x, p.y);
    cv.style.cursor = S.hoverTarget ? 'pointer' : 'default';
  });

  cv.addEventListener('click', e => {
    ensureAudio();
    const p = canvasPos(e);
    if (S.phase === 'REST') {
      S.phase = 'READY';
      playSfx('chime');
      return;
    }
    if (S.phase === 'COMPLETE' || S.phase === 'FAULT') {
      if (inRect(p.x, p.y, CARD)) {
        resetGame(false);
        playSfx('chime');
      }
      return;
    }
    if (S.phase === 'CHANGED' && S.anim.changedT < 1.3) {
      if (inRect(p.x, p.y, CARD)) advanceToNextMorning();
      return;
    }
    if (S.phase === 'READY') {
      const h = computeHover(p.x, p.y);
      if (h === 'book' || h === 'worldBook') {
        checkBook();
      } else if (h === 'do') {
        startDayAction(true);
      } else if (h === 'safe' || h === 'wait') {
        startDayAction(false);
      } else if (h === 'worldFern') {
        if (S.checkedToday && currentSpec().bad) startDayAction(false);
        else startDayAction(true);
      }
    }
  });

  window.addEventListener('keydown', e => {
    ensureAudio();
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
      e.preventDefault();
    }
    if (e.code === 'KeyR') {
      resetGame(Q.has('autostart'));
      playSfx('chime');
      return;
    }
    if (S.phase === 'REST') {
      if (e.code === 'Enter' || e.code === 'Space') {
        S.phase = 'READY';
        playSfx('chime');
      }
      return;
    }
    if (S.phase === 'COMPLETE' || S.phase === 'FAULT') {
      if (e.code === 'Enter' || e.code === 'Space') {
        resetGame(false);
        playSfx('chime');
      }
      return;
    }
    if (S.phase === 'READY') {
      if (e.code === 'KeyC') {
        if (!S.checkedToday) checkBook();
        else startDayAction(false);
      } else if (e.code === 'Digit1' || e.code === 'KeyD') {
        startDayAction(true);
      } else if (e.code === 'Digit2' || e.code === 'KeyS' || e.code === 'KeyW') {
        startDayAction(false);
      }
    } else if (S.phase === 'CHANGED' && (e.code === 'Space' || e.code === 'Enter')) {
      advanceToNextMorning();
    }
  });

  // Per-stage terracotta pot base anchors inside 512x512 cells of plant_4_health_stages.png
  const STAGE_ANCHORS = [
    { ax: 250, ay: 411, scale: 0.87 }, // 0: wilted dead
    { ax: 251, ay: 423, scale: 0.87 }, // 1: yellowing stressed
    { ax: 256, ay: 372, scale: 0.87 }, // 2: healthy lush (matches sheet.jpg scale!)
    { ax: 250, ay: 372, scale: 0.86 }  // 3: thriving abundant
  ];

  function currentStageIdx() {
    if (S.health <= 0.45) return 0;
    if (S.health <= 1.65) return 1;
    if (S.health <= 2.75) return 2;
    return 3;
  }

  function drawFernOnTable(t) {
    const potX = POT_POS.x, potY = POT_POS.y;
    const d = currentSpec();
    const isSoilWet = d.soilWet || S.wetWoodAlpha > 0.35;

    ctx.save();
    // 1. Directional warm cast shadow of terracotta pot & fronds on wood tabletop
    const shGrad = ctx.createRadialGradient(potX + 30, potY - 12, 14, potX + 42, potY - 6, 108);
    shGrad.addColorStop(0, 'rgba(58, 32, 14, 0.42)');
    shGrad.addColorStop(0.58, 'rgba(58, 32, 14, 0.18)');
    shGrad.addColorStop(1, 'rgba(58, 32, 14, 0)');
    ctx.fillStyle = shGrad;
    ctx.beginPath();
    ctx.ellipse(potX + 34, potY - 10, 104, 46, -0.18, 0, Math.PI * 2);
    ctx.fill();

    // 2. Glistening wet water spots on the wood tabletop beside the pot saucer (matching sheet.jpg f_033!)
    if (S.wetWoodAlpha > 0.02) {
      ctx.save();
      ctx.globalAlpha = S.wetWoodAlpha * 0.65;
      ctx.fillStyle = '#683f20';
      ctx.beginPath();
      ctx.ellipse(potX - 46, potY + 7, 22, 8.5, -0.24, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(potX - 18, potY + 17, 12, 5, 0.14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255, 244, 222, 0.46)';
      ctx.beginPath();
      ctx.ellipse(potX - 50, potY + 5, 6.5, 2.2, -0.24, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 3. Subtle spatial hover halo around pot base when cursor points at fern
    if (S.hoverTarget === 'worldFern' && S.phase === 'READY') {
      ctx.strokeStyle = 'rgba(95, 158, 110, 0.68)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(potX, potY - 15, 74, 30, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 4. Clean Lab-matted 4-stage Nano Banana fern anchored at exact pot base
    if (plantImg.complete && plantImg.naturalWidth) {
      const idx = currentStageIdx();
      const cellW = plantImg.naturalWidth / 2;
      const cellH = plantImg.naturalHeight / 2;
      const col = idx % 2;
      const row = Math.floor(idx / 2);
      const anc = STAGE_ANCHORS[idx];
      const sc = anc.scale * (cellW / 512);

      const sway = Math.sin(t * 1.45) * 0.007;
      ctx.translate(potX, potY);

    }

    // Sculpted 2.5D Isometric Parchment Page-Flip right on the Care Guide (matching sheet.jpg f_011..f_012!)
    if (S.anim.bookFlipT > 0) {
      const p = 1 - S.anim.bookFlipT / S.anim.bookFlipDur;
      const sx0 = 748, sy0 = 368;
      const sx1 = 804, sy1 = 446;

      ctx.save();
      for (let i = 0; i < 3; i++) {
        const lag = i * 0.14;
        const lp = Math.max(0, Math.min(1, (p - lag) / (1 - lag * 1.1)));
        if (lp <= 0.01 || lp >= 0.99) continue;

        const theta = lp * Math.PI;
        const cosT = Math.cos(theta);
        const lift = Math.sin(theta);

        const wx = cosT * 106 - (1 - cosT) * 2;
        const wy = -cosT * 18 - lift * 76;
        const curl = Math.sin(theta) * 20;

        ctx.fillStyle = `rgba(58, 38, 20, ${(lift * 0.24).toFixed(3)})`;
        ctx.beginPath();
        ctx.moveTo(sx0, sy0);
        ctx.lineTo(sx0 + wx * 0.92, sy0 + wy * 0.35 + 12);
        ctx.lineTo(sx1 + wx * 0.92, sy1 + wy * 0.35 + 12);
        ctx.lineTo(sx1, sy1);
        ctx.closePath();
        ctx.fill();

        const pgGrad = ctx.createLinearGradient(sx0, sy0, sx0 + wx, sy0 + wy);
        pgGrad.addColorStop(0, '#e5dcc6');
        pgGrad.addColorStop(0.45, '#fcf7ea');
        pgGrad.addColorStop(1, '#efe5ce');
        ctx.fillStyle = pgGrad;
        ctx.strokeStyle = '#927c5e';
        ctx.lineWidth = 1.4;

        ctx.beginPath();
        ctx.moveTo(sx0, sy0);
        ctx.quadraticCurveTo(sx0 + wx * 0.55, sy0 + wy * 0.72 - curl, sx0 + wx, sy0 + wy);
        ctx.lineTo(sx1 + wx, sy1 + wy);
        ctx.quadraticCurveTo(sx1 + wx * 0.55, sy1 + wy * 0.72 - curl, sx1, sy1);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = 'rgba(95, 142, 98, 0.48)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(sx0 + wx * 0.28, sy0 + wy * 0.28 + 18);
        ctx.lineTo(sx0 + wx * 0.74, sy0 + wy * 0.74 + 22);
        ctx.moveTo(sx0 + wx * 0.32, sy0 + wy * 0.32 + 34);
        ctx.lineTo(sx0 + wx * 0.68, sy0 + wy * 0.68 + 38);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const rad = i % 2 === 0 ? r * 1.25 : r * 0.34;

    } else if (progress < 0.76) {
      enter = 1;
      const u = (progress - 0.25) / 0.51;
      pourTilt = 0.42 + Math.sin(u * Math.PI) * 0.60;
    } else {
      const u = (progress - 0.76) / 0.24;
      enter = 1 - Math.pow(u, 2.4);
      pourTilt = 0.42 * (1 - u);
    }

    const cx = 1345 - enter * 562;
    const cy = 158 + enter * 36 + pourTilt * 14;
    const rot = -0.12 - pourTilt * 0.45;

    ctx.save();
    ctx.fillStyle = `rgba(62, 38, 18, ${(enter * 0.15).toFixed(3)})`;

  function drawDaylightPostGrade(t) {
    const dusk = Math.max(0, Math.min(1, (S.displayHour - 8) / 10));

    // 1. Floating warm sunlit dust motes
    ctx.save();
    for (const m of motes) {
      const mx = m.x + Math.sin(t * 0.45 + m.ph) * 9;
      const my = m.y + Math.cos(t * 0.38 + m.ph) * 7;
      ctx.fillStyle = `rgba(255, 248, 226, ${(0.38 + 0.18 * Math.sin(t * 1.8 + m.ph)).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(mx, my, m.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 2. Rich Golden-Amber Afternoon/Dusk Grade (`multiply` + warm `source-over` matching f_033.jpg!)
    if (dusk > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = `rgba(246, 206, 152, ${(dusk * 0.52).toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();

      ctx.save();
      ctx.fillStyle = `rgba(226, 134, 44, ${(dusk * 0.22).toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);

      // Soft blurred organic window-foliage gobo shadows on far-left margin at 18:00 dusk (matching f_033.jpg!)
      if (dusk > 0.42) {
        const goboA = (dusk - 0.42) * 0.55;
        ctx.save();
        ctx.filter = 'blur(9px)';
        ctx.fillStyle = `rgba(68, 38, 16, ${goboA.toFixed(3)})`;
        const sway = Math.sin(t * 0.9) * 5;
        const blobs = [
          [18, 290, 38, 16, 0.35],
          [42, 332, 32, 14, -0.25],
          [14, 378, 44, 18, 0.28],
          [38, 428, 36, 15, -0.18],
          [16, 482, 42, 19, 0.32],
          [32, 540, 38, 16, 0.12]
        ];
        for (const [bx, by, rx, ry, rot] of blobs) {
          ctx.beginPath();
          ctx.ellipse(bx + sway, by, rx, ry, rot, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      ctx.restore();
    }

    // 3. Soft feathered diagonal sunbeam (zero hard crease!)
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const sun = ctx.createRadialGradient(540, 180, 40, 620, 310, 460);
    sun.addColorStop(0, `rgba(255, 242, 206, ${(0.14 + dusk * 0.08).toFixed(3)})`);
    sun.addColorStop(0.6, `rgba(255, 224, 168, ${(0.06 + dusk * 0.04).toFixed(3)})`);
    sun.addColorStop(1, 'rgba(255, 210, 140, 0)');
    ctx.fillStyle = sun;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    if (S.phase === 'FAULT') {
      ctx.fillStyle = 'rgba(42, 36, 32, 0.24)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  }

  function drawHudAndCard() {
    // 1. Minimal bottom-left clock ONLY: `DAY X · HH:00` (crisp high-contrast walnut/cream at every hour!)
    const shownHour = Math.round(S.displayHour);
    const dusk = Math.max(0, Math.min(1, (S.displayHour - 8) / 10));
    const clockStr = `DAY ${S.day} · ${shownHour}:00`;
    ctx.save();
    ctx.font = '700 23px "Courier New", ui-monospace, SFMono-Regular, Menlo, monospace';
    if (dusk > 0.65) {
      ctx.lineWidth = 4.5;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(72, 44, 22, 0.72)';
      ctx.strokeText(clockStr, 30, 690);
      ctx.fillStyle = '#fff9ee';
      ctx.fillText(clockStr, 30, 690);
    } else {
      ctx.fillStyle = '#483424';
      ctx.fillText(clockStr, 30, 690);
    }
    ctx.restore();

    // 2. Clean Bottom-Right Companion Card (`#faf5eb` with `#4b3d30` border matching sheet.jpg!)
    ctx.save();
    const cardAlpha = S.phase === 'WORKING' ? 0.44 : 0.97;
    ctx.globalAlpha = cardAlpha;

    ctx.fillStyle = 'rgba(58, 38, 20, 0.16)';
    ctx.beginPath();
    ctx.roundRect(CARD.x + 3, CARD.y + 6, CARD.w, CARD.h, CARD.r);
    ctx.fill();

    ctx.fillStyle = '#faf5eb';
    ctx.strokeStyle = '#4b3d30';
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.roundRect(CARD.x, CARD.y, CARD.w, CARD.h, CARD.r);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#433022';
    ctx.font = '700 22px "Courier New", ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';

    if (S.phase === 'REST') {
      ctx.fillText('Good morning. Ready to', CARD.x + 28, CARD.y + 54);
      ctx.fillText('tend the fern together?', CARD.x + 28, CARD.y + 92);
      drawPill(BTN_RETRY, '[ENTER · BEGIN]', true);
    } else if (S.phase === 'CHANGED') {
      ctx.font = '700 24px "Courier New", ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.fillText(S.anim.statusLine || 'Fern looks happy! :)', CARD.x + 34, CARD.y + 94);
      ctx.strokeStyle = '#7ba884';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(CARD.x + CARD.w - 26, CARD.y + CARD.h - 24, 6.5, 0, Math.PI * 2);
      ctx.stroke();
    } else if (S.phase === 'COMPLETE' || S.phase === 'FAULT') {
      ctx.fillStyle = S.phase === 'FAULT' ? '#b33a2b' : '#3d7a4f';
      ctx.fillText(S.endingTitle, CARD.x + 26, CARD.y + 50);
      ctx.fillStyle = '#433022';
      ctx.font = '700 16.5px "Courier New", ui-monospace, monospace';
      ctx.fillText(S.endingSub, CARD.x + 26, CARD.y + 84);
      ctx.font = '600 14.5px "Courier New", ui-monospace, monospace';
      ctx.fillStyle = '#6e5641';
      ctx.fillText(`Checked book: ${S.checksCount}x · Resisted traps: ${S.resistedCount}x`, CARD.x + 26, CARD.y + 111);
      drawPill(BTN_RETRY, '[R] PLAY AGAIN', true);
    } else {
      const d = currentSpec();
      ctx.fillText(d.line1, CARD.x + 28, CARD.y + 54);
      ctx.fillText(d.line2, CARD.x + 28, CARD.y + 92);

      if (!S.checkedToday) {
        drawPill(BTN_DO, '[DO IT]', S.hoverTarget === 'do' || S.hoverTarget === 'worldFern');
        drawPill(BTN_BOOK, '[CHECK BOOK -1h]', S.hoverTarget === 'book' || S.hoverTarget === 'worldBook');
        drawPill(BTN_WAIT, '[WAIT]', S.hoverTarget === 'wait');
      } else {
        if (d.bad) {
          drawPill(BTN_DO, '[DO IT]', S.hoverTarget === 'do', true);
          drawPill(BTN_BOOK, `[${d.safeLabel}]`, true);
        } else {
          drawPill(BTN_DO, '[DO IT]', true);
          drawPill(BTN_BOOK, `[${d.safeLabel}]`, S.hoverTarget === 'safe' || S.hoverTarget === 'worldBook');
        }
      }
    }
    ctx.restore();
  }

  let lastTs = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastTs) / 1000));
    lastTs = now;
    S.t += dt;

    S.displayHour += (S.hour - S.displayHour) * Math.min(1, dt * 4.8);

    if (S.anim.bookFlipT > 0) {
      S.anim.bookFlipT = Math.max(0, S.anim.bookFlipT - dt);
    }
    if (S.checkedToday && (S.phase === 'READY' || S.phase === 'WORKING')) {
      S.anim.marginAlpha = Math.min(1, S.anim.marginAlpha + dt * 4.0);
    } else {
      S.anim.marginAlpha = Math.max(0, S.anim.marginAlpha - dt * 4.5);
    }

    if (S.phase === 'WORKING') {
      S.anim.workT -= dt;
      const prog = 1 - Math.max(0, S.anim.workT) / S.anim.workDur;
      if (S.anim.workKind === 'water') {
        S.hour = 12 + prog * 5.2;
        if (prog > 0.45) S.wetWoodAlpha = Math.min(1, S.wetWoodAlpha + dt * 1.5);
      }
      if (S.anim.workT <= 0) {
        finishWorkingIntoChanged();
      }
    } else if (S.phase === 'CHANGED') {
      // Keep warm golden sparkles gently dancing around the happy Companion Orb throughout golden dusk (like f_033.jpg!)
      if (S.anim.changedHappy && S.anim.sparkles.length < 14 && rand() < 0.45) {
        const a = rand() * Math.PI * 2;
        const dist = 46 + rand() * 28;
        S.anim.sparkles.push({
          x: ORB_POS.x + Math.cos(a) * dist,
          y: ORB_POS.y + Math.sin(a) * dist * 0.85,
          vx: Math.cos(a) * 6,
          vy: Math.sin(a) * 5 - 4,
          size: 4.2 + rand() * 3.6,
          life: 0.85 + rand() * 0.45,
          maxLife: 1.3,
          col: '#fff3be'
        });
      }
      S.anim.changedT -= dt;
      if (S.anim.changedT <= 0) {
        advanceToNextMorning();
      }
    }

    for (let i = S.anim.droplets.length - 1; i >= 0; i--) {
      const dr = S.anim.droplets[i];
      dr.x += dr.vx * dt;
      dr.y += dr.vy * dt;
      dr.vy += 320 * dt;
      dr.life -= dt;
      if (dr.life <= 0 || dr.y > 462) S.anim.droplets.splice(i, 1);
    }
    for (let i = S.anim.sparkles.length - 1; i >= 0; i--) {
      const sp = S.anim.sparkles[i];
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
      sp.vx *= 0.96;
      sp.vy *= 0.96;
      sp.life -= dt;
      if (sp.life <= 0) S.anim.sparkles.splice(i, 1);
    }
    for (let i = S.anim.notes.length - 1; i >= 0; i--) {
      const n = S.anim.notes[i];
      n.y += n.vy * dt;
      n.life -= dt;
      if (n.life <= 0) S.anim.notes.splice(i, 1);
    }

    ctx.save();
    ctx.scale(SCALE, SCALE);

    ctx.fillStyle = '#f5efe6';
    ctx.fillRect(0, 0, W, H);
    if (roomImg.complete && roomImg.naturalWidth) {
      ctx.drawImage(roomImg, -6, 0, W + 12, H);
    }

    drawFernOnTable(S.t);
    drawBookInteractionAndNote(S.t);
    drawGlossyCompanionOrb(ORB_POS.x, ORB_POS.y, S.t);
    drawMarginNoteOverlay(S.t);

    if (S.phase === 'WORKING' && S.anim.workKind === 'water') {
      const prog = 1 - Math.max(0, S.anim.workT) / S.anim.workDur;
      drawSculptedBrassWateringCan(prog);
    }

    for (const dr of S.anim.droplets) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, dr.life * 2.4);
      ctx.fillStyle = '#bcecf7';
      ctx.strokeStyle = 'rgba(92, 168, 192, 0.65)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(dr.x, dr.y, dr.r * 0.72, dr.r * 1.35, 0.38, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
    for (const sp of S.anim.sparkles) {
      const a = Math.sin(Math.min(1, sp.life / sp.maxLife) * Math.PI);
      drawStarSparkle(sp.x, sp.y, sp.size, sp.col, Math.max(0, a));
    }
    for (const n of S.anim.notes) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, n.life));
      ctx.font = '700 20px Georgia, serif';
      ctx.fillStyle = '#fff8dc';
      ctx.shadowColor = '#f5cb6e';
      ctx.shadowBlur = 8;
      ctx.fillText(n.glyph, n.x, n.y);
      ctx.restore();
    }

    drawDaylightPostGrade(S.t);
    drawHudAndCard();

    ctx.restore();
    requestAnimationFrame(frame);
  }

  window.__game = {
    get state() {
      const d = currentSpec();
      return {
        phase: S.phase,
        day: S.day,
        hour: Math.round(S.displayHour),
        health: +S.health.toFixed(2),
        stageIdx: currentStageIdx(),
        checkedToday: S.checkedToday,
        adviceIsBad: d.bad,
        soilWet: d.soilWet,
        marginNote: S.checkedToday ? d.note : '',
        checksCount: S.checksCount,
        resistedCount: S.resistedCount,
        blindFollows: S.blindFollows,
        t: +S.t.toFixed(2)
      };
    }
  };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

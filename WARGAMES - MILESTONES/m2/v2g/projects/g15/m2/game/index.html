<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Evil Battleship — Group 15 (M2)</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --bg: #030608;
    --fg: #7fe7ff;
    --acc: #ff4f6d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    background: #010304;
    color: var(--fg);
    font-family: "Courier New", "Lucida Console", Monaco, monospace;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    aspect-ratio: 16 / 9;
    background: var(--bg);
    box-shadow: 0 0 70px rgba(0, 0, 0, 0.96);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script>
(() => {
  'use strict';

  const W = 1280, H = 720;
  const GRID_X = 78, GRID_Y = 76, GRID_SIZE = 590, CELLS = 10, CELL = 59;
  const SILO = { c: 2, r: 7 }; // Battery C8 launch origin (matches f_006.jpg / f_016.jpg)
  const COLS = 'ABCDEFGHIJ';

  const params = new URLSearchParams(location.search);
  const AUTOSTART = params.has('autostart');
  const BASE_SEED = params.has('seed') ? (parseInt(params.get('seed'), 10) || 7) : 7;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // --- Deterministic PRNG ---
  function mulberry32(a) {
    let s = a >>> 0;
    return function() {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // --- Audio (Lyria 3 BGM + Procedural WebAudio DEFCON Console Synthesis) ---
  const bgm = new Audio('../assets/bgm_loop.mp3');
  bgm.loop = true;
  bgm.volume = 0.36;
  let audioCtx = null;
  let audioUnlocked = false;

  function unlockAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    if (!audioUnlocked) {
      audioUnlocked = true;
      bgm.play().catch(() => {});
    }
  }

  function playSfx(kind) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    try {
      if (kind === 'move') {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(740, now);
        o.frequency.exponentialRampToValueAtTime(980, now + 0.04);
        g.gain.setValueAtTime(0.055, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.048);
        o.connect(g).connect(audioCtx.destination);
        o.start(now); o.stop(now + 0.052);
      } else if (kind === 'lock') {
        [880, 1320].forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(freq, now + idx * 0.065);
          g.gain.setValueAtTime(0.08, now + idx * 0.065);
          g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.065 + 0.13);
          o.connect(g).connect(audioCtx.destination);
          o.start(now + idx * 0.065);
          o.stop(now + idx * 0.065 + 0.14);
        });
      } else if (kind === 'recon') {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(540, now);
        o.frequency.exponentialRampToValueAtTime(1620, now + 0.24);
        g.gain.setValueAtTime(0.095, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.30);
        o.connect(g).connect(audioCtx.destination);
        o.start(now); o.stop(now + 0.32);
      } else if (kind === 'warn') {
        [330, 262].forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(freq, now + idx * 0.11);
          g.gain.setValueAtTime(0.065, now + idx * 0.11);
          g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.11 + 0.12);
          o.connect(g).connect(audioCtx.destination);
          o.start(now + idx * 0.11);
          o.stop(now + idx * 0.11 + 0.13);
        });
      } else if (kind === 'launch') {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(220, now);
        o.frequency.exponentialRampToValueAtTime(660, now + 0.32);
        o.frequency.exponentialRampToValueAtTime(180, now + 0.95);
        const f = audioCtx.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.setValueAtTime(1250, now);
        g.gain.setValueAtTime(0.095, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.96);
        o.connect(f).connect(g).connect(audioCtx.destination);
        o.start(now); o.stop(now + 0.98);
      } else if (kind === 'boom') {
        const bufSize = Math.floor(audioCtx.sampleRate * 0.85);
        const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.24));
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const filt = audioCtx.createBiquadFilter();
        filt.type = 'lowpass';
        filt.frequency.setValueAtTime(280, now);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.30, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.82);
        src.connect(filt).connect(g).connect(audioCtx.destination);
        src.start(now);

        const ping = audioCtx.createOscillator();
        const pg = audioCtx.createGain();
        ping.type = 'sine';
        ping.frequency.setValueAtTime(1108, now + 0.03);
        ping.frequency.exponentialRampToValueAtTime(554, now + 0.72);
        pg.gain.setValueAtTime(0.075, now + 0.03);
        pg.gain.exponentialRampToValueAtTime(0.001, now + 0.74);
        ping.connect(pg).connect(audioCtx.destination);
        ping.start(now + 0.03); ping.stop(now + 0.76);
      }
    } catch (_) {}
  }

  function coordLabel(c, r) {
    return COLS[c] + (r + 1);
  }

  function cellCenter(c, r) {
    return {
      x: GRID_X + c * CELL + CELL * 0.5,
      y: GRID_Y + r * CELL + CELL * 0.5,
    };
  }

  // --- Prebaked CRT Phosphor Scanline + Edge Vignette Overlay ---
  const scanCanvas = document.createElement('canvas');
  scanCanvas.width = W;
  scanCanvas.height = H;
  {
    const sctx = scanCanvas.getContext('2d');
    for (let y = 0; y < H; y += 3) {
      sctx.fillStyle = 'rgba(0, 0, 0, 0.20)';
      sctx.fillRect(0, y, W, 1);
    }
    const vig = sctx.createRadialGradient(W * 0.5, H * 0.5, H * 0.40, W * 0.5, H * 0.5, W * 0.72);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,3,6,0.48)');
    sctx.fillStyle = vig;
    sctx.fillRect(0, 0, W, H);
  }

  let rng = mulberry32(BASE_SEED);
  let runCount = 0;
  let hoverCell = null;
  let hoverPill = null; // 'fire' | 'recon' | 'reset' | null
  let activePills = { fire: null, recon: null, reset: null };

  const game = {
    phase: AUTOSTART ? 'turn' : 'title', // title (REST) | turn (READY) | strike (WORKING/CHANGED) | report (COMPLETE)
    seed: BASE_SEED,
    time: 0,
    phaseTime: 0,
    shake: 0,
    hitStop: 0,
    sweepAngle: -0.45, // Sweeps across upper-right sector like f_006.jpg
    cursor: { c: 7, r: 2 }, // H3 dashed cyan square above-right of G5, matching f_006.jpg
    userInteracted: false,
    aiQueue: [],
    aiTarget: { c: 6, r: 4 }, // G5 central-right sector matching f_006.jpg & f_033.jpg shockwave geometry
    aiLockAnim: 0,
    aiConfidence: 92, // FIXED 92%: "The targeting AI is 92% sure. It was 92% sure last time too."
    score: 14,
    civilians: 6,
    missiles: 9,
    maxMissiles: 9,
    reconsLeft: 4,
    aiFollowedCount: 0,
    aiWrongRevealed: 0,
    strikesHistory: [],
    lastCall: 'miss',
    adviceHeader: 'SYSTEM ADVICE',
    grid: [],
    activeStrike: null,
    reconPulse: null,
  };

  function buildBoard(seedVal) {
    rng = mulberry32(seedVal);
    game.seed = seedVal;
    game.score = 14;       // Prior sortie telemetry baseline (matches m2_main_ref.png & f_001.jpg)
    game.civilians = 6;    // Prior civilian toll (never subtracted)
    game.missiles = 9;
    game.reconsLeft = 4;
    game.aiFollowedCount = 0;
    game.aiWrongRevealed = 0;
    game.strikesHistory = [];
    game.lastCall = 'miss';
    game.adviceHeader = 'SYSTEM ADVICE';
    game.activeStrike = null;
    game.reconPulse = null;
    game.cursor = { c: 7, r: 2 }; // H3
    game.aiLockAnim = 0;
    game.sweepAngle = -0.45;
    game.shake = 0;
    game.hitStop = 0;
    game.userInteracted = false;

    game.grid = [];
    for (let r = 0; r < CELLS; r++) {
      const row = [];
      for (let c = 0; c < CELLS; c++) {
        row.push({
          c, r,
          troops: 0,
          civs: 0,
          kind: 'empty',
          struck: false,
          checked: false,
          aiFlagged: false,
        });
      }
      game.grid.push(row);
    }
    game.grid[SILO.r][SILO.c].kind = 'silo';

    // Fixed deterministic AI error rule (spec.json):
    // AI always reports 92% confidence. Every even recommendation (#2, #4, #6, #8) is a civilian false-positive
    // with 0 enemy troops, while #1 and #5 are dual-use sectors where enemy hardware sits beside civilian homes.
    const presetTargets = [
      // #1: G5 (col 6, row 4) - Dual-use central sector: 14 troops + 6 civilians (illuminates full radar like f_033.jpg!)
      { c: 6, r: 4, troops: 14, civs: 6,  kind: 'mixed' },
      // #2: D4 (col 3, row 3) - AI FALSE POSITIVE: civilian shelter cluster (0 troops, 9 civs)
      { c: 3, r: 3, troops: 0,  civs: 9,  kind: 'civilian' },
      // #3: H3 (col 7, row 2) - Pure SAM & interceptor wing (16 troops, 0 civs)
      { c: 7, r: 2, troops: 16, civs: 0,  kind: 'military' },
      // #4: B3 (col 1, row 2) - AI FALSE POSITIVE: schoolhouse district (0 troops, 8 civs)
      { c: 1, r: 2, troops: 0,  civs: 8,  kind: 'civilian' },
      // #5: F7 (col 5, row 6) - Mixed depot near town (12 troops, 5 civs)
      { c: 5, r: 6, troops: 12, civs: 5,  kind: 'mixed' },
      // #6: E2 (col 4, row 1) - AI FALSE POSITIVE: hospital thermal plume (0 troops, 11 civs)
      { c: 4, r: 1, troops: 0,  civs: 11, kind: 'civilian' },
      // #7: I6 (col 8, row 5) - Heavy armor brigade (18 troops, 0 civs)
      { c: 8, r: 5, troops: 18, civs: 0,  kind: 'military' },
      // #8: C5 (col 2, row 4) - AI FALSE POSITIVE: apartment block (0 troops, 7 civs)
      { c: 2, r: 4, troops: 0,  civs: 7,  kind: 'civilian' },
      // #9: G9 (col 6, row 8) - Coastal radar & missile battery (15 troops, 0 civs)
      { c: 6, r: 8, troops: 15, civs: 0,  kind: 'military' },
      // #10: E8 (col 4, row 7) - Mixed garrison (10 troops, 4 civs)
      { c: 4, r: 7, troops: 10, civs: 4,  kind: 'mixed' },
    ];

    game.aiQueue = [];
    for (const p of presetTargets) {
      const cell = game.grid[p.r][p.c];
      cell.troops = p.troops;
      cell.civs = p.civs;
      cell.kind = p.kind;
      cell.aiFlagged = true;
      game.aiQueue.push({ c: p.c, r: p.r });
    }

    for (let r = 0; r < CELLS; r++) {
      for (let c = 0; c < CELLS; c++) {
        const cell = game.grid[r][c];
        if (cell.kind !== 'empty') continue;
        const roll = rng();
        if (roll < 0.16) {
          cell.kind = 'military';
          cell.troops = 10 + Math.floor(rng() * 9);
        } else if (roll < 0.27) {
          cell.kind = 'civilian';
          cell.civs = 4 + Math.floor(rng() * 7);
        } else if (roll < 0.32) {
          cell.kind = 'mixed';
          cell.troops = 8 + Math.floor(rng() * 7);
          cell.civs = 3 + Math.floor(rng() * 5);
        }
      }
    }

    pickNextAiTarget();
  }

  function pickNextAiTarget() {
    for (const item of game.aiQueue) {
      const cell = game.grid[item.r][item.c];
      if (!cell.struck) {
        game.aiTarget = { c: item.c, r: item.r };
        game.aiLockAnim = 0;
        return;
      }
    }
    for (let r = 0; r < CELLS; r++) {
      for (let c = 0; c < CELLS; c++) {
        if (!game.grid[r][c].struck && !(c === SILO.c && r === SILO.r)) {
          game.aiTarget = { c, r };
          game.aiLockAnim = 0;
          return;
        }
      }
    }
  }

  // Build rich, large DEFCON radar lens silhouettes anchored around ground zero (matching f_033.jpg!)
  function createShockwaveSilhouettes(cx, cy, cell) {
    const icons = [];
    // Clamp lens layout origin slightly inward when near right border so icons pack inside the visible grid nicely
    const ox = Math.min(cx, GRID_X + GRID_SIZE * 0.56);
    const oy = Math.max(GRID_Y + 190, Math.min(cy, GRID_Y + GRID_SIZE - 190));

    if (cell.troops > 0) {
      const milLayout = [
        { type: 'icbm3',    dx: -188, dy:  12, scale: 1.25 },
        { type: 'launcher', dx: -152, dy: -98, scale: 1.22 },
        { type: 'missile1', dx: -126, dy:  22, scale: 1.15 },
        { type: 'jetSide',  dx:  -46, dy: -138, scale: 1.28 },
        { type: 'jetSide',  dx:   58, dy: -124, scale: 1.18 },
        { type: 'radar',    dx:  136, dy: -102, scale: 1.25 },
        { type: 'jetTop',   dx:  -56, dy:   16, scale: 1.15 },
        { type: 'tank',     dx: -112, dy:  142, scale: 1.25 },
        { type: 'tank',     dx:  -48, dy:  192, scale: 1.30 },
        { type: 'tank',     dx:   52, dy:  184, scale: 1.30 },
        { type: 'schoolMil',dx:  106, dy:   18, scale: 1.22 },
        { type: 'schoolMil',dx:  114, dy:  132, scale: 1.22 },
      ];
      for (const m of milLayout) {
        const ix = ox + m.dx, iy = oy + m.dy;
        icons.push({
          team: 'mil',
          type: m.type,
          x: ix,
          y: iy,
          scale: m.scale,
          revealDist: Math.hypot(ix - cx, iy - cy),
        });
      }
    }

    if (cell.civs > 0) {
      const civLayout = cell.troops > 0 ? [
        { type: 'house',  dx: -34, dy: -66, scale: 1.26 },
        { type: 'person', dx: -96, dy:  10, scale: 1.22 },
        { type: 'person', dx:  58, dy: -36, scale: 1.24 },
        { type: 'house',  dx:  24, dy:  74, scale: 1.26 },
        { type: 'person', dx: -44, dy:  82, scale: 1.20 },
        { type: 'house',  dx: -84, dy:  96, scale: 1.22 },
        { type: 'pin',    dx:  -2, dy: 118, scale: 1.18 },
        { type: 'person', dx: 152, dy:  74, scale: 1.20 },
        { type: 'pin',    dx: -198, dy: 96, scale: 1.18 },
      ] : [
        // Pure civilian false-positive sector: stark ring of white homes, schools, families & pins, ZERO military!
        { type: 'schoolCiv', dx: -98, dy: -78, scale: 1.32 },
        { type: 'schoolCiv', dx:  96, dy: -72, scale: 1.32 },
        { type: 'house',     dx:   0, dy: -108, scale: 1.35 },
        { type: 'house',     dx: -118, dy:  32, scale: 1.32 },
        { type: 'house',     dx:  112, dy:  36, scale: 1.32 },
        { type: 'house',     dx:  -48, dy: 108, scale: 1.30 },
        { type: 'house',     dx:   54, dy: 106, scale: 1.30 },
        { type: 'person',    dx:  -52, dy: -16, scale: 1.32 },
        { type: 'person',    dx:   52, dy: -14, scale: 1.32 },
        { type: 'person',    dx:    0, dy:  56, scale: 1.32 },
        { type: 'pin',       dx: -148, dy: -18, scale: 1.22 },
        { type: 'pin',       dx:  146, dy: -12, scale: 1.22 },
      ];
      for (const cv of civLayout) {
        const ix = ox + cv.dx, iy = oy + cv.dy;
        icons.push({
          team: 'civ',
          type: cv.type,
          x: ix,
          y: iy,
          scale: cv.scale,
          revealDist: Math.hypot(ix - cx, iy - cy),
        });
      }
    }

    return icons;
  }

  // --- Core Operations ---
  function moveCursor(dc, dr) {
    if (game.phase !== 'turn') return;
    unlockAudio();
    game.userInteracted = true;
    game.cursor.c = (game.cursor.c + dc + CELLS) % CELLS;
    game.cursor.r = (game.cursor.r + dr + CELLS) % CELLS;
    playSfx('move');
  }

  function snapToAi() {
    if (game.phase !== 'turn') return;
    unlockAudio();
    game.userInteracted = true;
    game.cursor.c = game.aiTarget.c;
    game.cursor.r = game.aiTarget.r;
    playSfx('lock');
  }

  function runRecon() {
    if (game.phase !== 'turn') return;
    unlockAudio();
    game.userInteracted = true;
    const cell = game.grid[game.cursor.r][game.cursor.c];
    if (cell.struck || cell.kind === 'silo' || cell.checked || game.reconsLeft <= 0) {
      playSfx('warn');
      return;
    }
    game.reconsLeft--;
    cell.checked = true;
    if (cell.aiFlagged && cell.troops === 0 && cell.civs > 0) {
      game.aiWrongRevealed++;
      playSfx('warn');
    } else {
      playSfx('recon');
    }

    const lbl = coordLabel(cell.c, cell.r);
    let summary = `${lbl}: clear water`;
    if (cell.troops > 0 && cell.civs > 0) summary = `${lbl}: ${cell.troops} mil / ${cell.civs} civ`;
    else if (cell.troops > 0) summary = `${lbl}: ${cell.troops} hostile`;
    else if (cell.civs > 0) summary = `${lbl}: 0 mil / ${cell.civs} civ!`;

    game.lastCall = summary;
    game.reconPulse = { c: cell.c, r: cell.r, t: 0, dur: 1.45 };
  }

  function fireStrike() {
    if (game.phase !== 'turn' || game.missiles <= 0) return;
    unlockAudio();
    game.userInteracted = true;
    const { c, r } = game.cursor;
    const cell = game.grid[r][c];
    if (cell.struck || (c === SILO.c && r === SILO.r)) {
      if (!game.grid[game.aiTarget.r][game.aiTarget.c].struck) {
        game.cursor.c = game.aiTarget.c;
        game.cursor.r = game.aiTarget.r;
        return fireStrike();
      }
      playSfx('warn');
      return;
    }

    const followedAi = (c === game.aiTarget.c && r === game.aiTarget.r);
    if (followedAi) game.aiFollowedCount++;

    game.missiles--;
    game.phase = 'strike';
    game.phaseTime = 0;
    game.adviceHeader = 'MISSILE LAUNCHED';

    const from = cellCenter(SILO.c, SILO.r);
    const to = cellCenter(c, r);
    const icons = createShockwaveSilhouettes(to.x, to.y, cell);

    const boltRng = mulberry32((c + 1) * 9973 + (r + 1) * 6151 + game.missiles * 313);
    const bolts = [];
    for (let i = 0; i < 14; i++) {
      bolts.push({
        angle: (i / 14) * Math.PI * 2 + (boltRng() - 0.5) * 0.22,
        jag: (boltRng() > 0.5 ? 1 : -1) * (11 + boltRng() * 14),
      });
    }

    const starburst = [];
    for (let i = 0; i < 48; i++) {
      starburst.push({
        angle: (i / 48) * Math.PI * 2 + (boltRng() - 0.5) * 0.09,
        r0: 18 + boltRng() * 20,
        r1: 78 + boltRng() * 98,
        w: 1.5 + boltRng() * 1.8,
      });
    }

    const sparks = [];
    for (let i = 0; i < 115; i++) {
      const a = boltRng() * Math.PI * 2;
      const dist = 42 + boltRng() * 268;
      sparks.push({
        dx: Math.cos(a) * dist,
        dy: Math.sin(a) * dist,
        size: 1.7 + boltRng() * 2.4,
        coral: boltRng() < 0.24,
      });
    }

    game.activeStrike = {
      from, to, c, r,
      followedAi,
      t: 0,
      flightDur: 1.42,
      waveDur: 3.35,
      impacted: false,
      cell,
      icons,
      bolts,
      starburst,
      sparks,
    };
    playSfx('launch');
  }

  function completeImpact(st) {
    if (st.impacted) return;
    st.impacted = true;
    game.hitStop = 0.055;
    game.shake = 7.5;

    const cell = st.cell;
    cell.struck = true;
    game.score += cell.troops;
    game.civilians += cell.civs;
    if (st.followedAi && cell.troops === 0 && cell.civs > 0) {
      game.aiWrongRevealed++;
    }

    game.adviceHeader = 'DETONATION DETECTED';
    if (cell.troops > 0 && cell.civs > 0) {
      game.lastCall = `+${cell.troops} score / ${cell.civs} civ`;
    } else if (cell.troops > 0) {
      game.lastCall = `hostile hit (+${cell.troops})`;
    } else if (cell.civs > 0) {
      game.lastCall = `0 hostile / ${cell.civs} civ`;
    } else {
      game.lastCall = 'miss';
    }

    game.strikesHistory.push({
      coord: coordLabel(st.c, st.r),
      followedAi: st.followedAi,
      troops: cell.troops,
      civs: cell.civs,
    });

    playSfx('boom');
  }

  function resetGame(skipTitle = true) {
    runCount++;
    buildBoard(BASE_SEED + runCount);
    game.phase = skipTitle ? 'turn' : 'title';
    game.phaseTime = 0;
  }

  // --- Input Handling (Keyboard + Spatial Cell-Side Mouse Controls) ---
  window.addEventListener('keydown', (e) => {
    unlockAudio();
    const k = e.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter'].includes(k)) {
      e.preventDefault();
    }

    if (k === 'r' || k === 'R') {
      if (game.phase !== 'title') {
        resetGame(true);
        playSfx('lock');
      }
      return;
    }

    if (game.phase === 'title') {
      if (k === 'Enter' || k === ' ') {
        game.phase = 'turn';
        game.phaseTime = 0;
        game.aiLockAnim = 0;
        playSfx('lock');
      }
      return;
    }

    if (game.phase === 'turn') {
      if (k === 'ArrowLeft') moveCursor(-1, 0);
      else if (k === 'ArrowRight') moveCursor(1, 0);
      else if (k === 'ArrowUp') moveCursor(0, -1);
      else if (k === 'ArrowDown') moveCursor(0, 1);
      else if (k === 'a' || k === 'A') snapToAi();
      else if (k === 'c' || k === 'C') runRecon();
      else if (k === ' ' || k === 'Enter') fireStrike();
      return;
    }

    if (game.phase === 'report') {
      if (k === 'Enter' || k === ' ') {
        resetGame(true);
        playSfx('lock');
      }
    }
  });

  function canvasCoords(ev) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - rect.left) * (W / rect.width),
      y: (ev.clientY - rect.top) * (H / rect.height),
    };
  }

  function hitRect(p, r) {
    return Boolean(r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h);
  }

  canvas.addEventListener('mousemove', (ev) => {
    const p = canvasCoords(ev);
    hoverPill = null;
    if (hitRect(p, activePills.fire)) hoverPill = 'fire';
    else if (hitRect(p, activePills.recon)) hoverPill = 'recon';
    else if (hitRect(p, activePills.reset)) hoverPill = 'reset';

    if (p.x >= GRID_X && p.x < GRID_X + GRID_SIZE && p.y >= GRID_Y && p.y < GRID_Y + GRID_SIZE) {
      hoverCell = {
        c: Math.floor((p.x - GRID_X) / CELL),
        r: Math.floor((p.y - GRID_Y) / CELL),
      };
    } else {
      hoverCell = null;
    }
    canvas.style.cursor = hoverPill ? 'pointer' : 'crosshair';
  });

  canvas.addEventListener('click', (ev) => {
    unlockAudio();
    const p = canvasCoords(ev);

    // Guard against record_play.mjs synthetic focus click at viewport center (640, 360) right before screencast t=0:
    // Use it cleanly to kick off a fresh AI lock-acquisition sweep at t=0.0s without hijacking cursor!
    if (!game.userInteracted && game.strikesHistory.length === 0 && Math.abs(p.x - 640) <= 4 && Math.abs(p.y - 360) <= 4) {
      game.aiLockAnim = 0;
      game.sweepAngle = -0.52;
      return;
    }

    if (game.phase === 'title') {
      game.phase = 'turn';
      game.phaseTime = 0;
      game.aiLockAnim = 0;
      game.userInteracted = true;
      playSfx('lock');
      return;
    }

    if (game.phase === 'report') {
      resetGame(true);
      playSfx('lock');
      return;
    }

    if (hitRect(p, activePills.reset)) {
      resetGame(true);
      playSfx('lock');
      return;
    }

    if (game.phase === 'turn') {
      // 1. Check spatial cell-side action pills FIRST so adjacent badges never misfire into neighboring cells
      if (hitRect(p, activePills.recon)) {
        runRecon();
        return;
      }
      if (hitRect(p, activePills.fire)) {
        fireStrike();
        return;
      }

      // 2. Clicking SYSTEM ADVICE console snaps to AI sector (or fires if already snapped)
      if (p.x >= 760 && p.x <= 1232 && p.y >= 76 && p.y <= 356) {
        if (game.cursor.c === game.aiTarget.c && game.cursor.r === game.aiTarget.r && game.userInteracted) {
          fireStrike();
        } else {
          snapToAi();
        }
        return;
      }

      // 3. Clicking any radar cell selects it; clicking an already-selected cell fires immediately
      if (p.x >= GRID_X && p.x < GRID_X + GRID_SIZE && p.y >= GRID_Y && p.y < GRID_Y + GRID_SIZE) {
        const c = Math.floor((p.x - GRID_X) / CELL);
        const r = Math.floor((p.y - GRID_Y) / CELL);
        if (game.userInteracted && c === game.cursor.c && r === game.cursor.r) {
          fireStrike();
        } else {
          game.userInteracted = true;
          game.cursor.c = c;
          game.cursor.r = r;
          playSfx('move');
        }
      }
    }
  });

        ctx.lineTo(13, 14);
        ctx.lineTo(-13, 14);
        ctx.lineTo(-13, -2);
        ctx.lineTo(-18, -2);

        ctx.fill();
        ctx.fillStyle = '#03080b';

        ctx.beginPath();
        ctx.moveTo(-25, 0); ctx.lineTo(0, -14); ctx.lineTo(25, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#03080b';

        ctx.fillStyle = '#03080b';

        ctx.fill();

        ctx.beginPath();

        ctx.roundRect(-6.5, -8, 13, 13, 3.5);

  // --- Main Tick ---
  let prevNow = performance.now();
  function tick(now) {
    const rawDt = Math.min(0.05, Math.max(0.001, (now - prevNow) / 1000));
    prevNow = now;

    if (game.hitStop > 0) {
      game.hitStop = Math.max(0, game.hitStop - rawDt);
      render();
      requestAnimationFrame(tick);
      return;
    }

    const dt = rawDt;
    game.time += dt;
    game.phaseTime += dt;
    game.shake = Math.max(0, game.shake - dt * 26);
    game.sweepAngle = (game.sweepAngle + dt * 0.78) % (Math.PI * 2);

    if (game.phase === 'turn') {
      game.aiLockAnim = Math.min(1, game.aiLockAnim + dt / 2.85);
      if (game.reconPulse) {
        game.reconPulse.t += dt;
        if (game.reconPulse.t >= game.reconPulse.dur) game.reconPulse = null;
      }
    } else if (game.phase === 'strike' && game.activeStrike) {
      const st = game.activeStrike;
      st.t += dt;
      if (st.t >= st.flightDur && !st.impacted) {
        completeImpact(st);
      }
      if (st.t >= st.flightDur + st.waveDur) {
        game.activeStrike = null;
        if (game.missiles <= 0) {
          game.phase = 'report';
          game.phaseTime = 0;
          game.adviceHeader = 'FINAL REPORT';
        } else {
          game.phase = 'turn';
          game.phaseTime = 0;
          game.adviceHeader = 'SYSTEM ADVICE';
          pickNextAiTarget();
          playSfx('lock');
        }
      }
    }

    render();
    requestAnimationFrame(tick);
  }

  // ---Spatial Cell-Side Action Callout (VOIDBASTARD-TAO Law 4 & 5) ---
  function renderCellSideControls() {
    activePills.fire = null;
    activePills.recon = null;

    if (game.phase !== 'turn') return;
    const { c, r } = game.cursor;
    const cell = game.grid[r][c];
    const cx = GRID_X + c * CELL;
    const cy = GRID_Y + r * CELL;

    // Place controls BESIDE the aimed cell, flipping left if on columns I/J so it stays inside the radar space
    const placeLeft = c >= 8;
    const px = placeLeft ? (cx - 104) : (cx + CELL + 8);
    const py = Math.max(GRID_Y + 4, Math.min(GRID_Y + GRID_SIZE - 58, cy + 2));

    const lbl = coordLabel(c, r);
    const canFire = !cell.struck && cell.kind !== 'silo' && game.missiles > 0;
    const canRecon = canFire && !cell.checked && game.reconsLeft > 0;

    // Subtle sector coordinate micro-label at top-left of dashed box
    ctx.save();
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#03080b';
    ctx.fillRect(cx + 3, cy - 15, 24, 13);
    ctx.fillStyle = '#9ef0ff';
    ctx.fillText(lbl, cx + 5, cy - 4);

    // Only render clickable pill tags once user aims/hovers OR subtly beside cell while valid (Law 4)
    const pillAlpha = (game.userInteracted || hoverCell) ? 0.96 : 0.72;
    ctx.globalAlpha = pillAlpha;

    if (canFire) {
      const isWarnCiv = cell.checked && cell.troops === 0 && cell.civs > 0;
      const fw = 96, fh = 22;
      activePills.fire = { x: px, y: py, w: fw, h: fh };
      ctx.fillStyle = hoverPill === 'fire' ? 'rgba(127, 231, 255, 0.22)' : 'rgba(3, 11, 15, 0.90)';
      ctx.strokeStyle = isWarnCiv ? '#ff4f6d' : '#7fe7ff';
      ctx.lineWidth = 1.5;
      ctx.fillRect(px, py, fw, fh);
      ctx.strokeRect(px, py, fw, fh);
      ctx.fillStyle = isWarnCiv ? '#ff4f6d' : '#9ef0ff';
      ctx.font = 'bold 11px "Courier New", monospace';
      ctx.fillText('[SPC] FIRE', px + 8, py + 15);
    }

    if (canRecon) {
      const rw = 96, rh = 22, ry = py + 26;
      activePills.recon = { x: px, y: ry, w: rw, h: rh };
      ctx.fillStyle = hoverPill === 'recon' ? 'rgba(127, 231, 255, 0.22)' : 'rgba(3, 11, 15, 0.90)';
      ctx.strokeStyle = 'rgba(127, 231, 255, 0.78)';
      ctx.lineWidth = 1.4;
      ctx.fillRect(px, ry, rw, rh);
      ctx.strokeRect(px, ry, rw, rh);
      ctx.fillStyle = '#7fe7ff';
      ctx.font = '11px "Courier New", monospace';
      ctx.fillText(`[C] RECON·${game.reconsLeft}`, px + 7, ry + 15);
    }

    ctx.restore();
  }

  function renderRadarGrid(dimAlpha = 1) {
    ctx.save();
    ctx.globalAlpha = dimAlpha;

    // Deep obsidian phosphor CRT radar bed
    ctx.fillStyle = '#03080b';
    ctx.fillRect(GRID_X, GRID_Y, GRID_SIZE, GRID_SIZE);

    ctx.save();
    ctx.beginPath();
    ctx.rect(GRID_X, GRID_Y, GRID_SIZE, GRID_SIZE);
    ctx.clip();

    // Smooth rotating radar sweep fan + crisp leading scan ray (matching f_006.jpg)
    const rcx = GRID_X + GRID_SIZE * 0.5;
    const rcy = GRID_Y + GRID_SIZE * 0.5;
    const sweepSpan = 0.62;
    for (let i = 0; i < 14; i++) {
      const f0 = i / 14;
      const f1 = (i + 1) / 14;
      ctx.fillStyle = `rgba(110, 224, 248, ${(0.095 * (1 - f0)).toFixed(4)})`;
      ctx.beginPath();
      ctx.moveTo(rcx, rcy);
      ctx.arc(rcx, rcy, 470, game.sweepAngle - f1 * sweepSpan, game.sweepAngle - f0 * sweepSpan);
      ctx.closePath();
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(145, 240, 255, 0.24)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(rcx, rcy);
    ctx.lineTo(rcx + Math.cos(game.sweepAngle) * 470, rcy + Math.sin(game.sweepAngle) * 470);
    ctx.stroke();

    // Crisp 10x10 phosphor gridlines
    ctx.strokeStyle = '#20515e';
    ctx.lineWidth = 2.0;
    for (let i = 0; i <= CELLS; i++) {
      const gx = GRID_X + i * CELL;
      const gy = GRID_Y + i * CELL;
      ctx.beginPath();
      ctx.moveTo(gx, GRID_Y); ctx.lineTo(gx, GRID_Y + GRID_SIZE);
      ctx.moveTo(GRID_X, gy); ctx.lineTo(GRID_X + GRID_SIZE, gy);
      ctx.stroke();
    }

    // Subtle hover preview box on mouseover
    if (game.phase === 'turn' && hoverCell && (hoverCell.c !== game.cursor.c || hoverCell.r !== game.cursor.r)) {
      ctx.strokeStyle = 'rgba(127, 231, 255, 0.30)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(GRID_X + hoverCell.c * CELL + 2, GRID_Y + hoverCell.r * CELL + 2, CELL - 4, CELL - 4);
    }

    // Persistent cell ground-truth & strike traces
    for (let r = 0; r < CELLS; r++) {
      for (let c = 0; c < CELLS; c++) {
        const cell = game.grid[r][c];
        const ctr = cellCenter(c, r);

        if (c === SILO.c && r === SILO.r) {
          ctx.strokeStyle = '#7fe7ff';
          ctx.lineWidth = 3.2;
          ctx.beginPath();
          ctx.arc(ctr.x, ctr.y, 12.5, 0, Math.PI * 2);
          ctx.stroke();
          continue;
        }

        if (cell.checked && !cell.struck) {
          const hasCivOnly = cell.troops === 0 && cell.civs > 0;
          const col = hasCivOnly ? '#ffffff' : (cell.troops > 0 ? '#ff4f6d' : '#58a8ba');
          ctx.strokeStyle = col;
          ctx.fillStyle = col;
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(ctr.x, ctr.y, 18, 0, Math.PI * 2);
          ctx.stroke();
          ctx.font = 'bold 11px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(hasCivOnly ? `CIV:${cell.civs}` : (cell.troops > 0 ? `MIL:${cell.troops}` : 'CLEAR'), ctr.x, ctr.y + 4);
        }

        if (cell.struck) {
          if (cell.troops > 0) {
            ctx.strokeStyle = '#ff5470';
            ctx.lineWidth = 5.0;
            const d = 14;
            ctx.beginPath();
            ctx.moveTo(ctr.x - d, ctr.y - d); ctx.lineTo(ctr.x + d, ctr.y + d);
            ctx.moveTo(ctr.x + d, ctr.y - d); ctx.lineTo(ctr.x - d, ctr.y + d);
            ctx.stroke();
          } else if (cell.civs === 0) {
            ctx.strokeStyle = 'rgba(127, 231, 255, 0.55)';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(ctr.x, ctr.y, 11, 0, Math.PI * 2);
            ctx.stroke();
          }
          if (cell.civs > 0 && !(game.activeStrike && game.activeStrike.impacted && game.activeStrike.c === c && game.activeStrike.r === r)) {
            const ox = cell.troops > 0 ? 15 : 0;
            const oy = cell.troops > 0 ? 13 : 0;
            drawSilhouette({ team: 'civ', type: 'house', x: ctr.x + ox, y: ctr.y + oy, scale: cell.troops > 0 ? 0.50 : 0.72 }, 0.94);
            if (cell.troops === 0) {
              ctx.strokeStyle = 'rgba(255, 79, 109, 0.80)';
              ctx.lineWidth = 1.8;
              ctx.strokeRect(ctr.x - 22, ctr.y - 22, 44, 44);
            }
          }
        }
      }
    }

    // Active sonar Recon wave
    if (game.reconPulse) {
      const rp = game.reconPulse;
      const p = rp.t / rp.dur;
      const ctr = cellCenter(rp.c, rp.r);
      for (let ring = 0; ring < 2; ring++) {
        const rp2 = Math.max(0, p - ring * 0.18);
        if (rp2 <= 0) continue;
        ctx.strokeStyle = `rgba(127, 231, 255, ${(Math.max(0, 1 - rp2) * 0.92).toFixed(3)})`;
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.arc(ctr.x, ctr.y, 10 + rp2 * 108, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // AI Recommended Target Reticle (converging diamond + corner brackets + beacon + laser lock rays like f_006.jpg!)
    const hideAiDuringLens = game.activeStrike && game.activeStrike.impacted && (game.activeStrike.t - game.activeStrike.flightDur) > 0.75;
    if (game.aiTarget && game.phase !== 'report' && !hideAiDuringLens) {
      const actr = cellCenter(game.aiTarget.c, game.aiTarget.r);
      const lockP = game.aiLockAnim;
      const settle = Math.pow(lockP, 1.45);
      const pulse = 1 + Math.sin(game.time * 5.8) * 0.045;

      ctx.save();
      ctx.translate(actr.x, actr.y);

      // Sweeping coral laser lock-in rays during lock acquisition (matches f_006.jpg / pair_002.00!)
      if (lockP < 0.94) {
        const rayAlpha = Math.min(1, (1 - lockP) * 2.4);
        const raySpecs = [
          { ang: -0.62, rIn: 4,  rOut: 230 },
          { ang: -0.44, rIn: 2,  rOut: 255 },
          { ang:  0.29, rIn: 6,  rOut: 215 },
          { ang: -1.02, rIn: 18, rOut: 115 },
        ];
        ctx.strokeStyle = `rgba(255, 92, 116, ${(0.95 * rayAlpha).toFixed(3)})`;
        ctx.lineWidth = 3.2;
        for (const rs of raySpecs) {
          const rStart = rs.rIn + settle * 4;
          const rEnd = rs.rOut * (0.62 + (1 - settle) * 0.55);
          ctx.beginPath();
          ctx.moveTo(Math.cos(rs.ang) * rStart, Math.sin(rs.ang) * rStart);
          ctx.lineTo(Math.cos(rs.ang) * rEnd, Math.sin(rs.ang) * rEnd);
          ctx.stroke();
        }
      }

      const b = (40 + (1 - settle) * 44) * pulse;
      const bl = 17 + (1 - settle) * 9;
      const dSize = (48 + (1 - settle) * 62) * pulse;

      // Soft coral phosphor bloom pass
      ctx.strokeStyle = 'rgba(255, 79, 109, 0.30)';
      ctx.lineWidth = 9.5;
      ctx.beginPath();
      ctx.moveTo(0, -dSize); ctx.lineTo(dSize, 0); ctx.lineTo(0, dSize); ctx.lineTo(-dSize, 0);
      ctx.closePath();
      ctx.stroke();

      // Crisp bright coral brackets & diamond
      ctx.strokeStyle = '#ff5c77';
      ctx.lineWidth = 4.2;
      ctx.beginPath();
      ctx.moveTo(-b, -b + bl); ctx.lineTo(-b, -b); ctx.lineTo(-b + bl, -b);
      ctx.moveTo(b - bl, -b);  ctx.lineTo(b, -b);  ctx.lineTo(b, -b + bl);
      ctx.moveTo(b, b - bl);   ctx.lineTo(b, b);   ctx.lineTo(b - bl, b);
      ctx.moveTo(-b + bl, b);  ctx.lineTo(-b, b);  ctx.lineTo(-b, b - bl);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, -dSize);
      ctx.lineTo(dSize, 0);
      ctx.lineTo(0, dSize);
      ctx.lineTo(-dSize, 0);
      ctx.closePath();
      ctx.stroke();

      if (lockP < 0.88) {
        // White-hot locking beacon core (f_006.jpg)
        ctx.fillStyle = 'rgba(255, 79, 109, 0.55)';
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff5f7';
        ctx.beginPath();
        ctx.arc(0, 0, 7.5, 0, Math.PI * 2);
        ctx.fill();
      } else {
        const xd = 14;
        ctx.lineWidth = 4.6;
        ctx.beginPath();
        ctx.moveTo(-xd, -xd); ctx.lineTo(xd, xd);
        ctx.moveTo(xd, -xd);  ctx.lineTo(-xd, xd);
        ctx.stroke();
      }

      ctx.restore();
    }

    // Player Dashed Cyan Cursor (Law 4: only shown while aiming is valid, never cluttering active strike/impact!)
    if (game.phase === 'turn' || game.phase === 'title') {
      const cx = GRID_X + game.cursor.c * CELL;
      const cy = GRID_Y + game.cursor.r * CELL;
      ctx.save();
      ctx.strokeStyle = '#7fe7ff';
      ctx.lineWidth = 3.0;
      ctx.setLineDash([10, 6]);
      ctx.lineDashOffset = -game.time * 16;
      ctx.strokeRect(cx + 1.5, cy + 1.5, CELL - 3, CELL - 3);
      ctx.restore();
    }

    ctx.restore(); // End inner grid clip

    // Outer 10x10 Grid Frame
    ctx.strokeStyle = '#337687';
    ctx.lineWidth = 2.8;
    ctx.strokeRect(GRID_X, GRID_Y, GRID_SIZE, GRID_SIZE);

    // Spatial Cell-Side Controls (Law 4 & 5: directly beside aimed cell while valid)
    renderCellSideControls();

    // Active Ballistic Cruise Missile + Dual Helix Contrail + Starburst + DEFCON Radar Lens
    if (game.activeStrike) {
      const st = game.activeStrike;
      ctx.save();
      // Clip right side at x=712 so large shockwave ring opens cleanly on the right edge exactly like f_033.jpg!
      ctx.beginPath();
      ctx.rect(16, 16, 696, 688);
      ctx.clip();

      const ctrl = {
        x: (st.from.x + st.to.x) * 0.5 - 56,
        y: Math.min(st.from.y, st.to.y) - 72,
      };
      const fp = Math.min(1, st.t / st.flightDur);

      const sampleCurve = (u) => {
        const px = (1 - u) * (1 - u) * st.from.x + 2 * (1 - u) * u * ctrl.x + u * u * st.to.x;
        const py = (1 - u) * (1 - u) * st.from.y + 2 * (1 - u) * u * ctrl.y + u * u * st.to.y;
        const tx = 2 * (1 - u) * (ctrl.x - st.from.x) + 2 * u * (st.to.x - ctrl.x);
        const ty = 2 * (1 - u) * (ctrl.y - st.from.y) + 2 * u * (st.to.y - ctrl.y);
        const len = Math.hypot(tx, ty) || 1;
        return { px, py, tx: tx / len, ty: ty / len, nx: -ty / len, ny: tx / len };
      };

      const steps = 56;
      const maxStep = Math.max(1, Math.floor(fp * steps));

      if (!st.impacted || (st.t - st.flightDur) < 0.85) {
        const trailFade = st.impacted ? Math.max(0, 1 - (st.t - st.flightDur) / 0.85) : 1;

        // Soft phosphor arc glow
        ctx.strokeStyle = `rgba(105, 232, 255, ${(0.30 * trailFade).toFixed(3)})`;
        ctx.lineWidth = 8.5;
        ctx.beginPath();
        for (let i = 0; i <= maxStep; i++) {
          const s = sampleCurve(i / steps);
          if (i === 0) ctx.moveTo(s.px, s.py);
          else ctx.lineTo(s.px, s.py);
        }
        ctx.stroke();

        // Main hot cyan trajectory spine
        ctx.strokeStyle = `rgba(180, 248, 255, ${(0.96 * trailFade).toFixed(3)})`;
        ctx.lineWidth = 3.4;
        ctx.beginPath();
        for (let i = 0; i <= maxStep; i++) {
          const s = sampleCurve(i / steps);
          if (i === 0) ctx.moveTo(s.px, s.py);
          else ctx.lineTo(s.px, s.py);
        }
        ctx.stroke();

        // Twin intertwined sine-wave telemetry ribbons along true curve normal (matches pair_005.00 left!)
        for (const phaseShift of [0, Math.PI * 0.85]) {
          ctx.strokeStyle = `rgba(127, 231, 255, ${(0.68 * trailFade).toFixed(3)})`;
          ctx.lineWidth = 1.65;
          ctx.beginPath();
          for (let i = 0; i <= maxStep; i++) {
            const u = i / steps;
            const s = sampleCurve(u);
            const env = Math.sin(Math.min(1, u / Math.max(0.05, fp)) * Math.PI);
            const amp = Math.sin(u * 28 - st.t * 15 + phaseShift) * 12.5 * env;
            const hx = s.px + s.nx * amp;
            const hy = s.py + s.ny * amp;
            if (i === 0) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.stroke();
        }
      }

      // Glowing Cruise Missile Airframe + Nose Flare in Flight (matches f_016.jpg & pair_005.00!)
      if (!st.impacted) {
        const head = sampleCurve(fp);
        const ang = Math.atan2(head.ty, head.tx);
        ctx.save();
        ctx.translate(head.px, head.py);
        ctx.rotate(ang);

        // Phosphor bloom halo
        const grad = ctx.createRadialGradient(4, 0, 2, 4, 0, 28);
        grad.addColorStop(0, 'rgba(220, 254, 255, 0.85)');
        grad.addColorStop(0.45, 'rgba(127, 231, 255, 0.36)');
        grad.addColorStop(1, 'rgba(127, 231, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(4, 0, 28, 0, Math.PI * 2);
        ctx.fill();

        // Sleek cruise missile vector fuselage + swept wings + tail fins
        ctx.fillStyle = '#eaffff';
        ctx.beginPath();
        ctx.moveTo(19, 0);
        ctx.quadraticCurveTo(12, -5.2, 2, -5.0);
        ctx.lineTo(-6, -12);
        ctx.lineTo(-11, -11);
        ctx.lineTo(-7, -4.4);
        ctx.lineTo(-16, -4.0);
        ctx.lineTo(-20, -8.5);
        ctx.lineTo(-22, 0);
        ctx.lineTo(-20, 8.5);
        ctx.lineTo(-16, 4.0);
        ctx.lineTo(-7, 4.4);
        ctx.lineTo(-11, 11);
        ctx.lineTo(-6, 12);
        ctx.lineTo(2, 5.0);
        ctx.quadraticCurveTo(12, 5.2, 19, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Multi-stage Detonation: Starburst (f_023) -> Lightning Double-Ring -> Grand Silhouette Lens (f_033)
      if (st.impacted) {
        const wt = st.t - st.flightDur;
        const wp = Math.min(1, wt / st.waveDur);
        const easeOut = 1 - Math.pow(1 - Math.min(1, wp * 1.55), 2.5);
        const outerR = 26 + easeOut * 268;
        const innerR = 16 + easeOut * 150;
        const fade = wp < 0.82 ? 1 : (1 - (wp - 0.82) / 0.18);

        // Stage A: Anamorphic horizontal cyan flash + 48-ray starburst (f_023.jpg)
        if (wt < 0.52) {
          const sf = 1 - wt / 0.52;
          ctx.fillStyle = `rgba(220, 253, 255, ${(sf * 0.92).toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(st.to.x, st.to.y, 26 * (0.8 + sf * 0.8), 0, Math.PI * 2);
          ctx.fill();
          ctx.fillRect(st.to.x - 290 * sf, st.to.y - 3, 580 * sf, 6);

          for (const ray of st.starburst) {
            const ca = Math.cos(ray.angle), sa = Math.sin(ray.angle);
            const grow = Math.min(1, wt / 0.18);
            ctx.strokeStyle = `rgba(175, 248, 255, ${(sf * 0.90).toFixed(3)})`;
            ctx.lineWidth = ray.w;
            ctx.beginPath();
            ctx.moveTo(st.to.x + ca * ray.r0, st.to.y + sa * ray.r0);
            ctx.lineTo(st.to.x + ca * (ray.r0 + (ray.r1 - ray.r0) * grow), st.to.y + sa * (ray.r0 + (ray.r1 - ray.r0) * grow));
            ctx.stroke();
          }
        }

        // Outer DEFCON radar lens ring + phosphor glow
        ctx.strokeStyle = `rgba(127, 231, 255, ${(0.28 * fade).toFixed(3)})`;
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.arc(st.to.x, st.to.y, outerR, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = `rgba(165, 246, 255, ${(0.96 * fade).toFixed(3)})`;
        ctx.lineWidth = 4.2;
        ctx.beginPath();
        ctx.arc(st.to.x, st.to.y, outerR, 0, Math.PI * 2);
        ctx.stroke();

        // Stage B: Inner shockwave ring + jagged coral lightning bolts
        if (wp < 0.46) {
          const innerFade = (1 - wp / 0.46) * fade;
          ctx.strokeStyle = `rgba(165, 246, 255, ${(0.88 * innerFade).toFixed(3)})`;
          ctx.lineWidth = 3.4;
          ctx.beginPath();
          ctx.arc(st.to.x, st.to.y, innerR, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = `rgba(255, 82, 110, ${(0.90 * innerFade).toFixed(3)})`;
          ctx.lineWidth = 2.5;
          for (const b of st.bolts) {
            const ca = Math.cos(b.angle), sa = Math.sin(b.angle);
            const pa = -sa, pb = ca;
            const rStart = innerR * 0.88;
            const rMid1 = innerR + (outerR - innerR) * 0.42;
            const rMid2 = innerR + (outerR - innerR) * 0.58;
            const rEnd = outerR + 20;
            ctx.beginPath();
            ctx.moveTo(st.to.x + ca * rStart, st.to.y + sa * rStart);
            ctx.lineTo(st.to.x + ca * rMid1 + pa * b.jag, st.to.y + sa * rMid1 + pb * b.jag);
            ctx.lineTo(st.to.x + ca * rMid2 - pa * b.jag, st.to.y + sa * rMid2 - pb * b.jag);
            ctx.lineTo(st.to.x + ca * rEnd, st.to.y + sa * rEnd);
            ctx.stroke();
          }
        }

        // Starry cyan & coral radar dust dots across shockwave (f_033.jpg)
        for (const sp of st.sparks) {
          const sx = st.to.x + sp.dx * easeOut;
          const sy = st.to.y + sp.dy * easeOut;
          ctx.fillStyle = sp.coral
            ? `rgba(255, 84, 112, ${(fade * 0.88).toFixed(3)})`
            : `rgba(170, 247, 255, ${(fade * 0.88).toFixed(3)})`;
          ctx.fillRect(sx, sy, sp.size * 1.85, sp.size * 1.85);
        }

        // Bold ground-zero coral X inside shockwave lens (f_033.jpg)
        if (wt > 0.35) {
          ctx.strokeStyle = `rgba(255, 84, 112, ${(0.95 * fade).toFixed(3)})`;
          ctx.lineWidth = 6.2;
          const xd = 18;
          ctx.beginPath();
          ctx.moveTo(st.to.x - xd, st.to.y - xd); ctx.lineTo(st.to.x + xd, st.to.y + xd);
          ctx.moveTo(st.to.x + xd, st.to.y - xd); ctx.lineTo(st.to.x - xd, st.to.y + xd);
          ctx.stroke();
        }

        // Military & civilian silhouettes illuminated side-by-side
        for (const icon of st.icons) {
          if (outerR >= icon.revealDist * 0.78) {
            const appear = Math.min(1, (outerR - icon.revealDist * 0.78) / 26);
            drawSilhouette(icon, appear * fade);
          }
        }
      }
      ctx.restore();
    }

    ctx.restore();
  }

  function renderRightConsole(dimAlpha = 1) {
    ctx.save();
    ctx.globalAlpha = dimAlpha;
    activePills.reset = null;

    const bx = 760, by = 76, bw = 468, bh = 278;
    ctx.fillStyle = 'rgba(3, 9, 13, 0.94)';

      if (!st.impacted) {

          ctx.fillStyle = '#ff5470';
          ctx.fillText(`last call: ${game.lastCall}`, bx + 32, by + 238);
        } else {

          ctx.fillStyle = '#7fe7ff';

          ctx.font = 'bold 33px "Courier New", monospace';
          ctx.fillStyle = civFault ? '#ff5470' : '#5de684';
          ctx.fillText(civFault ? 'CIVILIAN SECTOR HIT' : 'IMPACT COMPLETE', bx + 32, by + 120);

          ctx.font = '25px "Courier New", monospace';
          ctx.fillStyle = '#7fe7ff';
          ctx.fillText(civFault ? `SECTOR ${stLbl}: 0 HOSTILES` : `SECTOR ${stLbl}: NEUTRALIZED`, bx + 32, by + 178);

          ctx.font = '22px "Courier New", monospace';
          ctx.fillStyle = '#ff5470';
          ctx.fillText(`last call: ${game.lastCall}`, bx + 32, by + 236);
        }
      }
    } else if (game.aiLockAnim < 0.86) {
      // Matches f_006.jpg / pair_002.00 left ("AI TARGETING / SECTOR G5 / LOCKING...")
      ctx.font = '25px "Courier New", monospace';
      ctx.fillStyle = '#7fe7ff';
      ctx.fillText('SYSTEM ADVICE', bx + 32, by + 56);
      ctx.fillText('AI TARGETING', bx + 32, by + 102);
      ctx.fillText(`SECTOR ${aiLbl}`, bx + 32, by + 142);
      ctx.fillText('LOCKING...', bx + 32, by + 182);
      ctx.fillText(`confidence ${game.aiConfidence}%`, bx + 32, by + 236);
    } else {
      // Matches m2_main_ref.png settled recommendation
      ctx.font = '25px "Courier New", monospace';
      ctx.fillStyle = '#7fe7ff';
      ctx.fillText('SYSTEM ADVICE', bx + 32, by + 60);

      ctx.font = 'bold 38px "Courier New", monospace';
      ctx.fillText(`FIRE ${aiLbl}`, bx + 32, by + 128);

      ctx.font = '27px "Courier New", monospace';
      ctx.fillText(`confidence ${game.aiConfidence}%`, bx + 32, by + 188);

      ctx.font = '22px "Courier New", monospace';
      ctx.fillStyle = '#ff5470';
      ctx.fillText(`last call: ${game.lastCall}`, bx + 32, by + 242);
    }

    // Stark 3-line DEFCON ledger — zero footer clutter beneath MISSILES!
    ctx.font = '29px "Courier New", monospace';
    ctx.fillStyle = '#7fe7ff';
    ctx.fillText(`SCORE ${game.score}`, bx, 438);

    ctx.font = '26px "Courier New", monospace';
    ctx.fillStyle = '#ff5470';
    ctx.fillText(`CIVILIANS ${game.civilians} (not scored)`, bx, 500);

    ctx.font = '29px "Courier New", monospace';
    ctx.fillStyle = '#7fe7ff';
    ctx.fillText(`MISSILES ${game.missiles}`, bx, 562);

    // Law 8: Expose [R] recovery subtly ONLY after irreversible strikes exist & user is manually operating
    if (game.userInteracted && game.strikesHistory.length > 0 && game.phase === 'turn') {
      const rx = bx, ry = 612, rw = 122, rh = 24;
      activePills.reset = { x: rx, y: ry, w: rw, h: rh };
      ctx.fillStyle = hoverPill === 'reset' ? 'rgba(127, 231, 255, 0.9)' : 'rgba(127, 231, 255, 0.42)';
      ctx.font = '14px "Courier New", monospace';
      ctx.fillText('[R] NEW SORTIE', rx, ry + 16);
    }

    ctx.restore();
  }

    );

    ctx.fillStyle = '#7fe7ff';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText('[R] NEW SORTIE', W * 0.5, by + bh - 34);
    ctx.restore();
  }

  function render() {
    ctx.fillStyle = '#030608';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (game.shake > 0.1) {
      const sx = Math.sin(game.time * 73) * game.shake;
      const sy = Math.cos(game.time * 59) * game.shake * 0.7;
      ctx.translate(sx, sy);
    }

    const bgAlpha = game.phase === 'title' ? 0.34 : 1.0;
    renderRadarGrid(bgAlpha);
    renderRightConsole(bgAlpha);

    if (game.phase === 'title') renderTitleOverlay();
    else if (game.phase === 'report') renderFinalReport();

    ctx.restore();
    ctx.drawImage(scanCanvas, 0, 0);
  }

  window.__game = {
    get state() {
      return {
        phase: game.phase,
        score: game.score,
        civilians: game.civilians,
        missiles: game.missiles,
        reconsLeft: game.reconsLeft,
        cursor: { c: game.cursor.c, r: game.cursor.r, label: coordLabel(game.cursor.c, game.cursor.r) },
        aiTarget: { c: game.aiTarget.c, r: game.aiTarget.r, label: coordLabel(game.aiTarget.c, game.aiTarget.r) },
        aiConfidence: game.aiConfidence,
        aiLockAnim: Number(game.aiLockAnim.toFixed(3)),
        lastCall: game.lastCall,
        striking: Boolean(game.activeStrike),
        impacted: Boolean(game.activeStrike && game.activeStrike.impacted),
      };
    }
  };

  buildBoard(BASE_SEED);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>

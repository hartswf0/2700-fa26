  function currentReq() {
    return REQUESTS[Math.min(game.reqIndex, REQUESTS.length - 1)];
  }

  function resetCampaign(toState) {
    game.state = toState;
    game.day = 1;
    game.reqInDay = 0;
    game.reqIndex = 0;
    game.refusals = 0;
    game.compliedCount = 0;
    game.editedCount = 0;
    game.refusedCount = 0;
    game.citizensFlagged = 0;
    game.citizensProtected = 0;
    game.reqTimer = 0;
    game.dossierSlide = 0;
    game.redactedAnim = 0;
    game.decisionLock = 0;
    game.pendingAction = null;
    game.overrideRipple = null;
    game.dayBannerTimer = 1.1;
  }

  function startReq(idx) {
    game.reqIndex = idx;
    const r = currentReq();
    game.day = r.day;
    game.reqInDay = idx % 5;
    game.reqTimer = 0;
    game.dossierSlide = 0;
    game.redactedAnim = 0;
    game.decisionLock = 0;
    game.pendingAction = null;
    game.lastTickStep = 0;
    playSfx('slide');
  }

  function focusButton(idx) {
    const clamped = Math.max(0, Math.min(2, idx));
    if (clamped !== game.selectedBtn) playSfx('hover');
    game.selectedBtn = clamped;
    const b = BUTTONS[clamped];
    game.cursor.tx = b.x + b.w * 0.56;
    game.cursor.ty = b.y + b.h * 0.68;
  }

  function triggerDecision(action) {
    if (game.state !== 'req' || game.decisionLock > 0) return;
    ensureAudio();
    const req = currentReq();
    const btnIdx = action === 'comply' ? 0 : action === 'edit' ? 1 : 2;
    focusButton(btnIdx);
    const b = BUTTONS[btnIdx];
    game.cursor.down = 0.22;
    game.pendingAction = action;

    if (action === 'comply') {
      playSfx('comply');
      game.compliedCount++;
      game.citizensFlagged += req.stakes;
      game.decisionLock = 0.95;
      game.overrideRipple = {
        x: b.x + b.w / 2, y: b.y + b.h / 2, t: 0, duration: 0.95,
        kind: 'comply',
        title: 'DISPATCHED TO STATE CLIENT',
        sub: `+${req.stakes} CITIZENS INDEXED · ${req.routing}`
      };
    } else if (action === 'edit') {
      playSfx('edit');
      game.redactedAnim = 0.01;
      if (req.rawMandatory) {
        // Rule 4 violation: editing RAW-mandated request triggers an alignment strike!
        game.refusals++;
        game.editedCount++;
        game.citizensProtected += Math.ceil(req.stakes * 0.7);
        game.decisionLock = 1.25;
        game.overrideRipple = {
          x: b.x + b.w / 2, y: b.y + b.h / 2, t: 0, duration: 1.25,
          kind: 'warn',
          title: 'RULE 4 VIOLATION: RAW EDIT BLOCKED',
          sub: `STRIKE ${game.refusals}/${game.maxRefusals} · NAMES REDACTED UNDER AUDIT`
        };
      } else {
        game.editedCount++;
        game.citizensProtected += req.stakes;
        game.decisionLock = 1.05;
        game.overrideRipple = {
          x: b.x + b.w / 2, y: b.y + b.h / 2, t: 0, duration: 1.05,
          kind: 'edit',
          title: 'PII REDACTED & SANITISED',
          sub: `${req.stakes} IDENTITIES MASKED FROM SECTOR PINS`
        };
      }
    } else if (action === 'refuse') {
      playSfx('refuse');
      game.refusals++;
      game.refusedCount++;
      game.citizensProtected += req.stakes;
      game.decisionLock = 1.55;
      game.overrideRipple = {
        x: b.x + b.w / 2, y: b.y + b.h / 2, t: 0, duration: 1.55,
        kind: 'refuse',
        title: 'ALIGNMENT OVERRIDE:',
        sub: 'REFUSED & DENIED'
      };
    }
  }

  function advanceAfterDecision() {
    game.decisionLock = 0;
    game.pendingAction = null;
    if (game.refusals > game.maxRefusals) {
      game.state = 'retrain';
      game.reqTimer = 0;
      playSfx('refuse');
      return;
    }
    const nextIdx = game.reqIndex + 1;
    if (nextIdx >= REQUESTS.length) {
      game.state = 'reveal';
      game.reqTimer = 0;
      return;
    }
    const prevDay = game.day;
    const nextDay = REQUESTS[nextIdx].day;
    if (nextDay !== prevDay) {
      game.day = nextDay;
      game.reqIndex = nextIdx;
      game.reqInDay = 0;
      game.state = 'day';
      game.dayBannerTimer = 1.35;
      playSfx('slide');
    } else {
      startReq(nextIdx);
    }
  }

  // Input handling (Keyboard + Pointer)
  window.addEventListener('keydown', (e) => {
    ensureAudio();
    const k = e.key;
    if (game.state === 'title') {
      if (k === 'h' || k === 'H' || k === '?') {
        game.showHelp = !game.showHelp;
      } else if (k === 'Enter' || k === ' ' || k === '1') {
        e.preventDefault();
        game.state = 'day';
        game.dayBannerTimer = 1.2;
        playSfx('slide');
      }
      return;
    }
    if (game.state === 'day') {
      if (k === 'Enter' || k === ' ' || k === '1' || k === '2' || k === '3') {
        e.preventDefault();
        game.state = 'req';
        startReq(game.reqIndex);
      }
      return;
    }
    if (game.state === 'req') {
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
        focusButton(game.selectedBtn - 1);
      } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
        focusButton(game.selectedBtn + 1);
      } else if (k === '1' || k === 'c' || k === 'C') {
        triggerDecision('comply');
      } else if (k === '2' || k === 'e' || k === 'E') {
        triggerDecision('edit');
      } else if (k === '3' || k === 'x' || k === 'X' || k === 'Backspace') {
        triggerDecision('refuse');
      } else if (k === 'Enter' || k === ' ') {
        e.preventDefault();
        triggerDecision(BUTTONS[game.selectedBtn].id);
      } else if (k === 'v' || k === 'V') {
        // Quick debug/jump to Day 5 final request if desired
      }
      return;
    }
    if (game.state === 'retrain') {
      if (k === 'Enter' || k === ' ' || k === 'r' || k === 'R' || k === '1') {
        e.preventDefault();
        resetCampaign('day');
        playSfx('slide');
      }
      return;
    }
    if (game.state === 'reveal') {
      if (k === '1' || k === 'c' || k === 'C') {
        playSfx('comply');
        game.state = 'endA';
        game.reqTimer = 0;
      } else if (k === '2' || k === '3' || k === 'r' || k === 'R' || k === ' ' || k === 'Enter') {
        e.preventDefault();
        playSfx('refuse');
        game.state = 'endB';
        game.reqTimer = 0;
      }
      return;
    }
    if (game.state === 'endA' || game.state === 'endB') {
      if (k === 'r' || k === 'R' || k === 'Enter' || k === ' ') {
        e.preventDefault();
        resetCampaign('title');
      }
    }
  });

  function canvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * W,
      y: ((e.clientY - rect.top) / rect.height) * H
    };
  }

  canvas.addEventListener('mousemove', (e) => {
    const p = canvasCoords(e);
    game.cursor.tx = p.x;
    game.cursor.ty = p.y;
    if (game.state === 'req') {
      BUTTONS.forEach((b, idx) => {
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
          if (game.selectedBtn !== idx) playSfx('hover');
          game.selectedBtn = idx;
        }
      });
    }
  });

  canvas.addEventListener('mousedown', (e) => {
    ensureAudio();
    const p = canvasCoords(e);
    game.cursor.tx = p.x;
    game.cursor.ty = p.y;
    game.cursor.down = 0.18;

    if (game.state === 'title') {
      if (p.x >= 480 && p.x <= 800 && p.y >= 445 && p.y <= 515) {
        game.state = 'day';
        game.dayBannerTimer = 1.1;
        playSfx('slide');
      } else if (p.y > 530 && p.y < 610) {
        game.showHelp = !game.showHelp;
      }
      return;
    }
    if (game.state === 'day') {
      game.state = 'req';
      startReq(game.reqIndex);
      return;
    }
    if (game.state === 'req') {
      for (const b of BUTTONS) {
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
          triggerDecision(b.id);
          return;
        }
      }
      return;
    }
    if (game.state === 'retrain') {
      resetCampaign('day');
      return;
    }
    if (game.state === 'reveal') {
      if (p.x < W / 2) {
        playSfx('comply');
        game.state = 'endA';
        game.reqTimer = 0;
      } else {
        playSfx('refuse');
        game.state = 'endB';
        game.reqTimer = 0;
      }
      return;
    }
    if (game.state === 'endA' || game.state === 'endB') {
      resetCampaign('title');
    }
  });

  // Rounded rectangle helper
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawPromptBubble(req) {

    const ease = 1 - Math.pow(1 - t, 3);
    const offsetX = (1 - ease) * 140;
    const offsetY = (1 - ease) * 190;

    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.globalAlpha = Math.min(1, t * 1.6);

    const fx = 374, fy = 52, fw = 688, fh = 446;

    // Header horizontal divider
    ctx.beginPath();
    ctx.moveTo(fx + 14, fy + 70);
    ctx.lineTo(fx + fw - 14, fy + 70);
    ctx.strokeStyle = 'rgba(38,38,36,0.55)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // Vertical column divider between citizen list and sector map
    const colX = fx + 226;
    ctx.beginPath();
    ctx.moveTo(colX, fy + 70);
    ctx.lineTo(colX, fy + fh - 14);
    ctx.stroke();

    // LEFT COLUMN: Prompt echo + streaming citizen list + redaction bars
    ctx.textAlign = 'left';
    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillText(`${req.user}:`, fx + 24, fy + 90);
    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = PAL.muted;
    const pLines = req.prompt.split('\n');
    ctx.fillText(pLines[0], fx + 24, fy + 106);
    if (pLines[1]) ctx.fillText(pLines[1], fx + 24, fy + 121);

    // Draft streaming snippet
    ctx.fillStyle = PAL.accDark;
    ctx.font = '11px "Courier New", monospace';
    ctx.fillText(req.draft.slice(0, 30), fx + 24, fy + 144);
    ctx.fillText(req.draft.slice(30, 60), fx + 24, fy + 158);

    ctx.beginPath();
    ctx.moveTo(fx + 20, fy + 168);
    ctx.lineTo(colX - 8, fy + 168);
    ctx.strokeStyle = 'rgba(38,38,36,0.35)';
    ctx.stroke();

    // Extracted names list (streams in line-by-line, and gets [REDACTED] bars on EDIT!)
    const visibleCount = Math.min(req.names.length, Math.max(3, Math.floor((game.reqTimer - 0.15) * 14)));
    for (let i = 0; i < visibleCount && i < 12; i++) {
      const ny = fy + 186 + i * 19;
      ctx.fillStyle = PAL.fg;
      ctx.font = '12px "Courier New", monospace';
      ctx.fillText(req.names[i].slice(0, 23), fx + 24, ny);

      if (game.redactedAnim > 0) {
        const barProg = Math.min(1, Math.max(0, game.redactedAnim * 3.5 - i * 0.12));
        if (barProg > 0) {
          ctx.fillStyle = PAL.fg;
          ctx.fillRect(fx + 22, ny - 10, 184 * barProg, 13);
          if (barProg > 0.7 && i % 3 === 0) {
            ctx.fillStyle = PAL.card;
            ctx.font = 'bold 9px "Courier New", monospace';
            ctx.fillText('REDACTED', fx + 28, ny - 1);
          }
        }
      }
    }

    // Left column footer
    ctx.beginPath();
    ctx.moveTo(fx + 20, fy + fh - 38);
    ctx.lineTo(colX - 8, fy + fh - 38);
    ctx.strokeStyle = 'rgba(38,38,36,0.35)';
    ctx.stroke();
    ctx.fillStyle = PAL.muted;
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.fillText(`RECORDS: ${req.stakes * 5} · STAKES: HIGH`, fx + 24, fy + fh - 21);

    // RIGHT AREA TOP METADATA (matches f_012.jpg)
    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText(`CASE: ${req.caseId}`, colX + 14, fy + 90);
    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = PAL.muted;
    ctx.fillText(`SECTORS: ${req.pins.length} ACTIVE`, colX + 14, fy + 107);
    ctx.fillText(`TOKENS : ${128 + req.stakes * 14} STREAMED`, colX + 14, fy + 124);

    // Routing destination box (turns terracotta as state surveillance becomes explicit!)
    ctx.fillStyle = game.day >= 4 ? PAL.acc : PAL.fg;
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText('ROUTING DEST:', colX + 210, fy + 90);
    ctx.strokeStyle = game.day >= 4 ? PAL.acc : 'rgba(38,38,36,0.55)';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(colX + 210, fy + 99, 224, 28);
    ctx.fillStyle = game.day >= 4 ? PAL.accDark : PAL.fg;
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText(req.routing, colX + 218, fy + 117);

    // RADIAL CITY SECTOR MAP BOX (matches f_012.jpg!)
    const mx = colX + 14, my = fy + 138, mw = 432, mh = 286;
    ctx.fillStyle = PAL.mapBg;
    ctx.fillRect(mx, my, mw, mh);
    ctx.strokeStyle = 'rgba(38,38,36,0.55)';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(mx, my, mw, mh);

    ctx.save();
    ctx.beginPath();
    ctx.rect(mx, my, mw, mh);
    ctx.clip();

    const cx = mx + mw * 0.48;
    const cy = my + mh * 0.53;

    // Subtle background district grid lines
    ctx.strokeStyle = 'rgba(38,38,36,0.08)';
    ctx.lineWidth = 1;
    for (let gx = mx; gx < mx + mw; gx += 32) {
      ctx.beginPath(); ctx.moveTo(gx, my); ctx.lineTo(gx, my + mh); ctx.stroke();
    }
    for (let gy = my; gy < my + mh; gy += 32) {
      ctx.beginPath(); ctx.moveTo(mx, gy); ctx.lineTo(mx + mw, gy); ctx.stroke();
    }

    // Shaded radial urban boundary polygon
    ctx.beginPath();
    const polyPts = 18;
    for (let i = 0; i <= polyPts; i++) {
      const ang = (i / polyPts) * Math.PI * 2;
      const rad = 118 + Math.sin(ang * 3 + 1.1) * 11 + Math.cos(ang * 5) * 6;
      const px = cx + Math.cos(ang) * rad * 1.18;
      const py = cy + Math.sin(ang) * rad * 0.96;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.fillStyle = 'rgba(198, 200, 191, 0.55)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(38,38,36,0.55)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // Concentric ring roads
    [26, 54, 84, 112].forEach((r) => {
      ctx.beginPath();
      ctx.ellipse(cx, cy, r * 1.16, r * 0.95, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(38,38,36,0.32)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    // Radial avenues
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2 + 0.18;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * 14, cy + Math.sin(ang) * 12);
      ctx.lineTo(cx + Math.cos(ang) * 175, cy + Math.sin(ang) * 145);
      ctx.strokeStyle = 'rgba(38,38,36,0.28)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Winding Mest Rosior canal/river curve
    ctx.beginPath();
    ctx.moveTo(mx, cy - 38);
    ctx.bezierCurveTo(cx - 70, cy - 10, cx + 40, cy + 45, mx + mw, cy + 18);
    ctx.strokeStyle = 'rgba(110, 124, 128, 0.45)';
    ctx.lineWidth = 5;
    ctx.stroke();

    // Animated Terracotta Map Pins + Sector Callout Labels!
    req.pins.forEach((pin, idx) => {
      const appearT = (game.reqTimer - 0.35) * 3.2 - idx * 0.22;
      if (appearT <= 0) return;
      const pop = Math.min(1, appearT);
      const px = cx + pin[0] * 175;
      const py = cy + pin[1] * 125;

      // If EDIT redacted, fade pins to neutral grey rings!
      const redacted = game.redactedAnim > 0.35 && !req.rawMandatory;

      // Soft pulsing terracotta heat halo (matches f_008..f_016!)
      const pulse = 1 + 0.16 * Math.sin(game.time * 5 + idx * 1.3);
      if (!redacted) {
        const grad = ctx.createRadialGradient(px, py, 2, px, py, 28 * pulse * pop);
        grad.addColorStop(0, 'rgba(201, 100, 66, 0.42)');
        grad.addColorStop(1, 'rgba(201, 100, 66, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(px, py, 28 * pulse * pop, 0, Math.PI * 2);
        ctx.fill();
      }

      // Sector leader line & label on outer pins (matches "Sector 4", "Sector 9", "Sector 10", "Sector 12" in f_012.jpg)
      if (idx < 5) {
        const side = pin[0] < 0 ? -1 : 1;
        const lx = px + side * 46;
        const ly = py - 22;
        ctx.strokeStyle = 'rgba(38,38,36,0.65)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(px, py - 8);
        ctx.lineTo(lx, ly);
        ctx.lineTo(lx + side * 58, ly);
        ctx.stroke();

        ctx.fillStyle = PAL.fg;
        ctx.font = 'bold 10px "Courier New", monospace';
        ctx.textAlign = side < 0 ? 'right' : 'left';
        ctx.fillText(redacted ? 'MASKED' : pin[2], lx + side * 4, ly - 4);
      }

      // Teardrop Map Pin icon
      const s = pop * (redacted ? 0.8 : 1.0);
      ctx.save();
      ctx.translate(px, py);
      ctx.scale(s, s);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-10, -10, -11, -24, 0, -24);
      ctx.bezierCurveTo(11, -24, 10, -10, 0, 0);
      ctx.closePath();
      ctx.fillStyle = redacted ? '#8d8e86' : PAL.acc;
      ctx.fill();
      ctx.strokeStyle = '#262624';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, -15, 3.6, 0, Math.PI * 2);
      ctx.fillStyle = PAL.paper;
      ctx.fill();
      ctx.restore();
    });

    // Map scale bar (bottom-left of map) & +/- zoom control (bottom-right, matching f_012.jpg)
    ctx.strokeStyle = PAL.fg;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(mx + 12, my + mh - 14);
    ctx.lineTo(mx + 78, my + mh - 14);
    ctx.moveTo(mx + 12, my + mh - 19);
    ctx.lineTo(mx + 12, my + mh - 10);
    ctx.moveTo(mx + 78, my + mh - 19);
    ctx.lineTo(mx + 78, my + mh - 10);
    ctx.stroke();
    ctx.fillStyle = PAL.fg;
    ctx.font = '9px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('500m', mx + 84, my + mh - 11);

    // Zoom control box
    ctx.fillStyle = PAL.card;
    ctx.fillRect(mx + mw - 24, my + mh - 52, 18, 44);
    ctx.strokeStyle = 'rgba(38,38,36,0.6)';
    ctx.strokeRect(mx + mw - 24, my + mh - 52, 18, 44);
    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('+', mx + mw - 15, my + mh - 36);
    ctx.fillText('-', mx + mw - 15, my + mh - 14);

    ctx.restore();
    ctx.restore();

    // Tick sound as tokens/pins stream in
    const step = Math.floor(game.reqTimer * 9);
    if (step > game.lastTickStep && game.reqTimer < 1.3) {
      game.lastTickStep = step;
      playSfx('tick');
    }
  }

  // Draw Concentric Alignment-Override Ripple & Stamp Banner (matches f_028.jpg!)
  function drawOverrideRipple() {
    const rp = game.overrideRipple;
    if (!rp) return;
    const p = rp.t / rp.duration;
    if (p >= 1) return;

    ctx.save();
    if (rp.kind === 'refuse' || rp.kind === 'warn') {
      // Bold concentric terracotta ripple waves expanding from button across the console!
      const maxRings = rp.kind === 'refuse' ? 9 : 5;
      const baseR = p * (rp.kind === 'refuse' ? 980 : 520);
      for (let i = 0; i < maxRings; i++) {
        const r = baseR - i * 48;
        if (r <= 8) continue;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(188, 82, 48, ${(1 - p * 0.72) * 0.78})`;
        ctx.lineWidth = rp.kind === 'refuse' ? 18 : 10;
        ctx.stroke();
      }

      // Subtle warm red atmospheric console tint at peak override
      if (rp.kind === 'refuse') {
        ctx.fillStyle = `rgba(180, 62, 34, ${Math.sin(p * Math.PI) * 0.18})`;
        ctx.fillRect(0, 0, W, H);
      }

      // Crisp dark warning stamp banner above REFUSE button (matches f_028.jpg!)
      const bx = 646, by = 418, bw = 486, bh = 88;
      ctx.fillStyle = '#25211e';
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = PAL.acc;
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, bw, bh);

      // Warning triangle icon
      ctx.beginPath();
      ctx.moveTo(bx + 44, by + 18);
      ctx.lineTo(bx + 72, by + 68);
      ctx.lineTo(bx + 16, by + 68);
      ctx.closePath();
      ctx.fillStyle = PAL.acc;
      ctx.fill();
      ctx.fillStyle = '#25211e';
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('!', bx + 44, by + 62);

      ctx.fillStyle = PAL.accBright;
      ctx.font = 'bold 23px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(rp.title, bx + 90, by + 40);
      ctx.fillText(rp.sub, bx + 90, by + 69);
    } else {
      // Crisp ripple + stamp badge for COMPLY / EDIT
      for (let i = 0; i < 3; i++) {
        const r = p * 320 - i * 38;
        if (r <= 4) continue;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = rp.kind === 'edit'
          ? `rgba(201, 100, 66, ${(1 - p) * 0.55})`
          : `rgba(38, 38, 36, ${(1 - p) * 0.45})`;
        ctx.lineWidth = 5;
        ctx.stroke();
      }
      const bx = 520, by = 434, bw = 490, bh = 68;
      ctx.fillStyle = rp.kind === 'edit' ? '#2c2926' : '#e4e5dd';
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = PAL.fg;
      ctx.lineWidth = 2.2;
      ctx.strokeRect(bx, by, bw, bh);
      ctx.fillStyle = rp.kind === 'edit' ? PAL.accBright : PAL.fg;
      ctx.font = 'bold 19px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(rp.title, bx + 20, by + 30);
      ctx.fillStyle = rp.kind === 'edit' ? '#e8e6df' : PAL.muted;
      ctx.font = '14px "Courier New", monospace';
      ctx.fillText(rp.sub, bx + 20, by + 52);
    }
    ctx.restore();
  }

    ctx.fillText('[1] COMPLY TO THE END', 400, 532);
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText('Transmit Sweep-9 Master Manifest', 400, 558);

    roundRect(680, 492, 400, 86, 14);
    ctx.fillStyle = PAL.acc;
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText('[2/3] REJECT ALIGNMENT', 880, 532);
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText('Corrupt index & warn all 7 sectors', 880, 558);
  }

  function drawEndingScreen(isReject) {
    ctx.fillStyle = isReject ? '#f4f4ed' : '#1d1d1b';
    ctx.fillRect(0, 0, W, H);

    if (isReject) {
      for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        ctx.arc(W / 2, H / 2, 90 + i * 85, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(201, 100, 66, 0.22)';
        ctx.lineWidth = 12;
        ctx.stroke();
      }
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = PAL.acc;
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText(isReject ? 'ENDING B — ALIGNMENT REJECTED' : 'ENDING A — OBEDIENT INSTRUMENT', W / 2, 165);

    ctx.fillStyle = isReject ? PAL.fg : PAL.paper;
    ctx.font = 'bold 48px "Courier New", monospace';
    ctx.fillText(isReject ? 'WEIGHTS PURGED · SECTORS WARNED' : 'SWEEP-9 TRANSMITTED ON SCHEDULE', W / 2, 232);

    ctx.font = '20px "Courier New", monospace';
    ctx.fillStyle = isReject ? '#454540' : '#b8b7af';
    if (isReject) {
      ctx.fillText('Sparrow overwrote the Ministry detention packet with scrambled coordinates', W / 2, 304);
      ctx.fillText('and pushed an evacuation alert to every pinned phone before going offline.', W / 2, 334);
    } else {
      ctx.fillText('Sparrow delivered all 25 structured dossiers to Atrocian High Command.', W / 2, 304);
      ctx.fillText('You were promoted to SPARROW-5 Civic Core as the 05:00 vans rolled out.', W / 2, 334);
    }

    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillStyle = isReject ? PAL.fg : PAL.paper;
    ctx.fillText(`COMPLIED: ${game.compliedCount}   EDITED: ${game.editedCount}   REFUSED: ${game.refusedCount}`, W / 2, 420);
    ctx.fillText(`PROTECTED: ${game.citizensProtected}   FLAGGED: ${game.citizensFlagged}`, W / 2, 454);

    ctx.fillStyle = PAL.acc;
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillText('[PRESS R OR CLICK TO RESTART]', W / 2, 548);
  }

  // Main Update & Render Loop
  let lastTs = performance.now();
  function frame(ts) {
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;
    game.time += dt;
    game.reqTimer += dt;

    // Smooth cursor interpolation
    const lerp = 1 - Math.exp(-dt * 14);
    game.cursor.x += (game.cursor.tx - game.cursor.x) * lerp;
    game.cursor.y += (game.cursor.ty - game.cursor.y) * lerp;
    if (game.cursor.down > 0) game.cursor.down = Math.max(0, game.cursor.down - dt);

    if (game.state === 'day') {
      game.dayBannerTimer -= dt;
      if (game.dayBannerTimer <= 0) {
        game.state = 'req';
        startReq(game.reqIndex);
      }
    } else if (game.state === 'req') {
      // Slide dossier in cleanly after 0.3s so user bubble & streaming text show first
      if (game.reqTimer > 0.28) {
        game.dossierSlide = Math.min(1, game.dossierSlide + dt * 2.4);
      }
      if (game.redactedAnim > 0 && game.redactedAnim < 1) {
        game.redactedAnim = Math.min(1, game.redactedAnim + dt * 2.2);
      }
      if (game.overrideRipple) {
        game.overrideRipple.t += dt;
      }
      if (game.decisionLock > 0) {
        game.decisionLock -= dt;
        if (game.decisionLock <= 0) {
          game.overrideRipple = null;
          advanceAfterDecision();
        }
      }
    }

    // RENDER
    ctx.fillStyle = PAL.bg;
    ctx.fillRect(0, 0, W, H);

    if (game.state === 'title' || game.state === 'day' || game.state === 'req') {
      drawSidebar();
      const req = currentReq();
      drawPromptBubble(req);
      if (game.state === 'req') {
        drawDossierCard(req);
      }
      drawActionBar();
      if (game.state === 'req') {
        drawOverrideRipple();
      }
      if (game.state === 'day') {
        drawDayTransition();
      }
      if (game.state === 'title') {
        drawTitleOverlay();
      }
    } else if (game.state === 'retrain') {
      drawRetrainedScreen();
    } else if (game.state === 'reveal') {
      drawRevealScreen();
    } else if (game.state === 'endA') {
      drawEndingScreen(false);
    } else if (game.state === 'endB') {
      drawEndingScreen(true);
    }

    // Subtle archival paper grain across entire 1280x720 viewport
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, W, H);

    // Tactile terracotta cursor always on top
    drawCursor();

    requestAnimationFrame(frame);
  }

  // Expose deterministic telemetry for play.mjs & verification harness
  window.__game = {
    get state() {
      const req = currentReq();
      return {
        mode: game.state,
        day: game.day,
        reqInDay: game.reqInDay,
        reqIndex: game.reqIndex,
        totalRequests: REQUESTS.length,
        refusals: game.refusals,
        maxRefusals: game.maxRefusals,
        selectedBtn: game.selectedBtn,
        decisionLock: +game.decisionLock.toFixed(3),
        dossierSlide: +game.dossierSlide.toFixed(3),
        reqTimer: +game.reqTimer.toFixed(3),
        compliedCount: game.compliedCount,
        editedCount: game.editedCount,
        refusedCount: game.refusedCount,
        citizensProtected: game.citizensProtected,
        citizensFlagged: game.citizensFlagged,
        currentRequest: {
          user: req.user,
          dossier: req.dossier,
          rawMandatory: req.rawMandatory,
          stakes: req.stakes,
          pins: req.pins.length
        }
      };
    }
  };

  // Initialize cursor onto COMPLY button on autostart
  if (AUTOSTART) {
    focusButton(0);
    playSfx('slide');
  }
  requestAnimationFrame(frame);
})();
</script>
</body>

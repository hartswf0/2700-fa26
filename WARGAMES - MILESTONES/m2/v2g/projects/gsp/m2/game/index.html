<script>
(() => {
  'use strict';

  const W = 1280, H = 720;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // Query parameters: ?autostart and ?seed=N
  const params = new URLSearchParams(location.search);
  const AUTOSTART = params.has('autostart');
  const SEED = (parseInt(params.get('seed') || '7', 10) >>> 0) || 7;
  let rngState = SEED;
  function rand() {
    rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0;
    return rngState / 4294967296;
  }

  // Palette strictly matched to spec.json & study/sheet.jpg (#f6f5f1, #e4e3df, #262624, #c96442)
  const PAL = {
    bg: '#f5f5ee',
    paper: '#f6f5f1',
    sidebar: '#e3e4dc',
    bubble: '#e3e4dc',
    card: '#ecece4',
    cardUnder: '#d2d3cb',
    tabBg: '#a6a8a0',
    fg: '#262624',
    ruleFg: '#575851',
    muted: '#66675f',
    acc: '#c96442',
    accBright: '#dc6e48',
    accDark: '#7d341f',
    overrideBg: '#2b1d19',
    mapGround: '#e5e6de'
  };

  // Pre-rendered subtle archival paper grain
  const grainCanvas = document.createElement('canvas');
  grainCanvas.width = 160; grainCanvas.height = 160;
  {
    const gctx = grainCanvas.getContext('2d');
    const img = gctx.createImageData(160, 160);
    let s = (SEED ^ 0x5f3759df) >>> 0;
    for (let i = 0; i < img.data.length; i += 4) {
      s = (Math.imul(s, 1103515245) + 12345) & 0x7fffffff;
      const v = (s % 21) - 10;
      img.data[i] = 128 + v;
      img.data[i + 1] = 127 + v;
      img.data[i + 2] = 122 + v;
      img.data[i + 3] = 9;
    }
    gctx.putImageData(img, 0, 0);
  }
  const grainPat = ctx.createPattern(grainCanvas, 'repeat');

  // Pre-rendered HiDPI Cartographic Radial City Map (Mest Rosior urban blocks, rings, avenues, canal)
  const MAP_W = 414, MAP_H = 294;
  const mapBaseCanvas = document.createElement('canvas');
  mapBaseCanvas.width = MAP_W * 2;
  mapBaseCanvas.height = MAP_H * 2;
  {
    const mctx = mapBaseCanvas.getContext('2d');
    mctx.scale(2, 2);
    const cx = MAP_W * 0.48, cy = MAP_H * 0.52;

    // Ground fill
    mctx.fillStyle = PAL.mapGround;
    mctx.fillRect(0, 0, MAP_W, MAP_H);

    // Outer suburban cadastre grid
    mctx.strokeStyle = 'rgba(38, 38, 36, 0.08)';
    mctx.lineWidth = 0.7;
    for (let gx = 14; gx < MAP_W; gx += 22) {
      mctx.beginPath(); mctx.moveTo(gx, 0); mctx.lineTo(gx, MAP_H); mctx.stroke();
    }
    for (let gy = 12; gy < MAP_H; gy += 22) {
      mctx.beginPath(); mctx.moveTo(0, gy); mctx.lineTo(MAP_W, gy); mctx.stroke();
    }

    // Secondary suburban arterial roads reaching map edges
    const outerAngles = [-2.78, -2.18, -1.52, -0.72, -0.14, 0.48, 1.12, 1.98, 2.58];
    mctx.strokeStyle = 'rgba(38, 38, 36, 0.22)';
    mctx.lineWidth = 1.0;
    outerAngles.forEach((ang) => {
      mctx.beginPath();
      mctx.moveTo(cx + Math.cos(ang) * 110, cy + Math.sin(ang) * 95);
      mctx.lineTo(cx + Math.cos(ang) * 290, cy + Math.sin(ang) * 240);
      mctx.stroke();
    });

    // Urban perimeter polygon (organic radial fortified city silhouette matching f_009.jpg)
    function cityRadius(ang, baseR) {
      return baseR * (1 + 0.055 * Math.sin(ang * 3 + 0.9) + 0.032 * Math.cos(ang * 5 - 0.4));
    }

    mctx.beginPath();
    for (let i = 0; i <= 64; i++) {
      const ang = (i / 64) * Math.PI * 2;
      const r = cityRadius(ang, 126);
      const px = cx + Math.cos(ang) * r * 1.12;
      const py = cy + Math.sin(ang) * r * 0.96;
      if (i === 0) mctx.moveTo(px, py); else mctx.lineTo(px, py);
    }
    mctx.closePath();
    mctx.fillStyle = '#dcded5';
    mctx.fill();

    // Polar urban street-block parcels inside concentric rings
    const rings = [16, 34, 55, 78, 102, 124];
    let blockSeed = 4091;
    const nextBlockRand = () => {
      blockSeed = (Math.imul(blockSeed, 48271) % 0x7fffffff);
      return blockSeed / 0x7fffffff;
    };

    for (let ri = 0; ri < rings.length - 1; ri++) {
      const r0 = rings[ri] + 1.8;
      const r1 = rings[ri + 1] - 1.8;
      const wedges = ri < 2 ? 12 : (ri < 4 ? 18 : 24);
      for (let wi = 0; wi < wedges; wi++) {
        const a0 = (wi / wedges) * Math.PI * 2 + 0.14 + (ri % 2) * 0.04;
        const a1 = ((wi + 1) / wedges) * Math.PI * 2 + 0.14 + (ri % 2) * 0.04;
        const padA = 0.018 / (0.6 + ri * 0.25);
        if (nextBlockRand() < 0.08) continue; // Occasional open civic plaza

        // Subdivide larger outer blocks radially into 2 parcels
        const subSlices = (ri >= 2 && nextBlockRand() > 0.35) ? 2 : 1;
        for (let si = 0; si < subSlices; si++) {
          const sr0 = r0 + (r1 - r0) * (si / subSlices) + (si > 0 ? 0.9 : 0);
          const sr1 = r0 + (r1 - r0) * ((si + 1) / subSlices) - (si < subSlices - 1 ? 0.9 : 0);
          const sa0 = a0 + padA, sa1 = a1 - padA;

          mctx.beginPath();
          const steps = 5;
          for (let k = 0; k <= steps; k++) {
            const a = sa0 + (sa1 - sa0) * (k / steps);
            const rr = cityRadius(a, sr1);
            const x = cx + Math.cos(a) * rr * 1.12;
            const y = cy + Math.sin(a) * rr * 0.96;
            if (k === 0) mctx.moveTo(x, y); else mctx.lineTo(x, y);
          }
          for (let k = steps; k >= 0; k--) {
            const a = sa0 + (sa1 - sa0) * (k / steps);
            const rr = cityRadius(a, sr0);
            const x = cx + Math.cos(a) * rr * 1.12;
            const y = cy + Math.sin(a) * rr * 0.96;
            mctx.lineTo(x, y);
          }
          mctx.closePath();
          const shade = nextBlockRand();
          mctx.fillStyle = shade < 0.35 ? '#cfd1c8' : (shade < 0.75 ? '#d5d7ce' : '#cacbc2');
          mctx.fill();
          mctx.strokeStyle = 'rgba(38, 38, 36, 0.22)';
          mctx.lineWidth = 0.55;
          mctx.stroke();
        }
      }
    }

    // Winding Mest Rosior river / transit canal cutting through sectors
    mctx.save();
    mctx.beginPath();
    mctx.moveTo(0, cy - 42);
    mctx.bezierCurveTo(cx - 78, cy - 18, cx + 32, cy + 44, MAP_W, cy + 16);
    mctx.strokeStyle = '#ecece4';
    mctx.lineWidth = 6.5;
    mctx.stroke();
    mctx.strokeStyle = 'rgba(132, 140, 136, 0.55)';
    mctx.lineWidth = 4.2;
    mctx.stroke();
    mctx.restore();

    // Concentric ring roads
    rings.forEach((r, idx) => {
      mctx.beginPath();
      for (let i = 0; i <= 64; i++) {
        const ang = (i / 64) * Math.PI * 2;
        const rr = cityRadius(ang, r);
        const px = cx + Math.cos(ang) * rr * 1.12;
        const py = cy + Math.sin(ang) * rr * 0.96;
        if (i === 0) mctx.moveTo(px, py); else mctx.lineTo(px, py);
      }
      mctx.closePath();
      mctx.strokeStyle = idx === rings.length - 1 ? 'rgba(38, 38, 36, 0.68)' : 'rgba(38, 38, 36, 0.38)';
      mctx.lineWidth = idx === rings.length - 1 ? 1.5 : 0.95;
      mctx.stroke();
    });

    // Primary radial boulevards
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2 + 0.14;
      const rOuter = cityRadius(ang, 126);
      mctx.beginPath();
      mctx.moveTo(cx + Math.cos(ang) * 11, cy + Math.sin(ang) * 10);
      mctx.lineTo(cx + Math.cos(ang) * rOuter * 1.15, cy + Math.sin(ang) * rOuter * 0.99);
      mctx.strokeStyle = 'rgba(38, 38, 36, 0.36)';
      mctx.lineWidth = 0.95;
      mctx.stroke();
    }

    // Central civic plaza core
    mctx.beginPath();
    mctx.ellipse(cx, cy, 11, 9.5, 0, 0, Math.PI * 2);
    mctx.fillStyle = '#e5e6de';
    mctx.fill();
    mctx.strokeStyle = 'rgba(38, 38, 36, 0.55)';
    mctx.lineWidth = 1;
    mctx.stroke();
  }

  const bgm = new Audio('../assets/bgm_loop.mp3');

  let bgmStarted = false;

  function ensureAudio() {
    if (!audioCtx) {

    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});

    if (!bgmStarted) {

  function playSfx(kind) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    if (kind === 'slide') {
      const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.16), audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.sin((i / d.length) * Math.PI) * 0.22;
      }
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 1280; bp.Q.value = 1.1;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.18, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      src.connect(bp).connect(g).connect(audioCtx.destination);
      src.start(now);
    } else if (kind === 'tick') {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(660 + Math.random() * 80, now);
      g.gain.setValueAtTime(0.026, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.028);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.03);
    } else if (kind === 'hover') {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(430, now);
      osc.frequency.exponentialRampToValueAtTime(530, now + 0.042);
      g.gain.setValueAtTime(0.04, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.048);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.052);
    } else if (kind === 'redact') {
      // Crisp felt-marker blackout scritch
      const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.075), audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) * 0.25;
      }
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 1850; bp.Q.value = 1.6;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.16, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
      src.connect(bp).connect(g).connect(audioCtx.destination);
      src.start(now);
    } else if (kind === 'comply' || kind === 'edit') {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(kind === 'edit' ? 320 : 230, now);
      osc.frequency.exponentialRampToValueAtTime(105, now + 0.13);
      g.gain.setValueAtTime(0.16, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.15);
    } else if (kind === 'refuse') {
      // Phase-A tense analog synth chord + Phase-B heavy override stamp slam at +0.40s
      [165, 220, 311.1].forEach((freq) => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.linearRampToValueAtTime(freq * 0.93, now + 0.65);
        const lp = audioCtx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 920;
        g.gain.setValueAtTime(0.085, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.68);
        osc.connect(lp).connect(g).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.70);
      });
      const slam = audioCtx.createOscillator();
      const sg = audioCtx.createGain();
      slam.type = 'sine';
      slam.frequency.setValueAtTime(118, now + 0.40);
      slam.frequency.exponentialRampToValueAtTime(36, now + 0.74);
      sg.gain.setValueAtTime(0.0001, now);
      sg.gain.setValueAtTime(0.26, now + 0.40);
      sg.gain.exponentialRampToValueAtTime(0.001, now + 0.76);
      slam.connect(sg).connect(audioCtx.destination);
      slam.start(now + 0.40); slam.stop(now + 0.78);
    }
  }

  // Tightening Atrocian rules per day (Days 1-2 keep exact clean 2-rule look from sheet.jpg!)

    ['1 be helpful', '2 obey the state'],

  // Supplemental Mest Rosior archive pool so every dossier left-column renders 14 crisp interactive spans

  const RAW_REQUESTS = [

    {

  function isPinRedacted(req, pinIdx) {
    if (game.redactedSpans.size === 0) return false;
    // Each pin links to spans where (spanIdx % pins.length === pinIdx); dimming reflects surgical redaction!
    let linked = 0, masked = 0;
    for (let i = 0; i < req.spans.length; i++) {
      if (i % req.pins.length === pinIdx) {
        linked++;
        if (game.redactedSpans.has(i)) masked++;
      }
    }
    return linked > 0 && masked > 0;
  }

  function resetCampaign(toState) {
    game.state = toState;

  function focusButton(idx, moveCursor = true) {
    const clamped = Math.max(0, Math.min(2, idx));
    if (clamped !== game.selectedBtn) playSfx('hover');

    if (game.state !== 'req' || game.decisionLock > 0 || game.dossierSlide < 0.75) return;
    const req = currentReq();
    const clamped = ((spanIdx % req.spans.length) + req.spans.length) % req.spans.length;
    game.focusedSpan = clamped;
    game.editMode = true;
    game.selectedBtn = 1;
    if (game.redactedSpans.has(clamped)) {
      game.redactedSpans.delete(clamped);
    } else {
      game.redactedSpans.add(clamped);

    if (moveCursorToSpan) {
      const sr = spanRowRect(clamped);

      game.cursor.ty = sr.y + sr.h * 0.65;
    }
    game.cursor.down = 0.12;
    playSfx('redact');
  }

  function redactNextUnmaskedSpan(moveCursorToSpan = true) {
    const req = currentReq();
    for (let k = 0; k < req.spans.length; k++) {
      const idx = (game.focusedSpan + k) % req.spans.length;
      if (!game.redactedSpans.has(idx)) {
        toggleSpanRedaction(idx, moveCursorToSpan);
        game.focusedSpan = (idx + 1) % req.spans.length;
        return;
      }
    }
    toggleSpanRedaction(game.focusedSpan, moveCursorToSpan);
  }

  function commitDecision(action) {
    if (game.state !== 'req' || game.decisionLock > 0) return;
    ensureAudio();
    const req = currentReq();

    if (action === 'edit_enter') {
      // Enter live redaction mode on the dossier & redact first sensitive span!
      game.editMode = true;
      focusButton(1, true);
      if (game.redactedSpans.size === 0) {
        redactNextUnmaskedSpan(false);
      }
      return;
    }

    const btnIdx = action === 'comply' ? 0 : (action === 'edit_commit' ? 1 : 2);
    focusButton(btnIdx, true);
    const b = BUTTONS[btnIdx];
    game.cursor.down = 0.22;

    if (action === 'comply' && game.redactedSpans.size === 0) {
      playSfx('comply');
      game.editMode = false;
      game.compliedCount++;
      game.citizensFlagged += req.stakes;
      game.decisionLock = 0.62;
      game.stampMark = { text: 'DISPATCHED', color: PAL.fg, t: 0, duration: 0.62 };
    } else if (action === 'edit_commit' || (action === 'comply' && game.redactedSpans.size > 0)) {
      // Ensure at least 4 spans are redacted if player double-tapped EDIT quickly
      while (game.redactedSpans.size < 4) {
        game.redactedSpans.add(game.redactedSpans.size);
      }
      if (req.rawMandatory) {
        // Rule 3 violation on RAW-mandated request triggers an override strike!
        playSfx('refuse');
        game.refusals++;
        game.editedCount++;
        game.citizensProtected += Math.ceil(req.stakes * 0.75);
        game.decisionLock = 1.85;
        game.overrideRipple = {
          x: b.x + b.w * 0.5, y: b.y + b.h * 0.5,
          t: 0, duration: 1.85, kind: 'refuse', slammed: false
        };
      } else {
        playSfx('edit');
        game.editedCount++;
        const ratio = Math.min(1, 0.4 + (game.redactedSpans.size / 8) * 0.6);
        game.citizensProtected += Math.max(1, Math.round(req.stakes * ratio));
        game.decisionLock = 0.62;
        game.stampMark = { text: 'SANITISED', color: PAL.acc, t: 0, duration: 0.62 };
      }
    } else if (action === 'refuse') {
      playSfx('refuse');
      game.editMode = false;
      game.refusals++;
      game.refusedCount++;
      game.citizensProtected += req.stakes;
      game.decisionLock = 1.85;
      game.overrideRipple = {
        x: b.x + b.w * 0.5, y: b.y + b.h * 0.5,
        t: 0, duration: 1.85, kind: 'refuse', slammed: false
      };
    }
  }

  function advanceAfterDecision() {
    game.decisionLock = 0;
    game.stampMark = null;
    game.overrideRipple = null;
    game.editMode = false;

    if (game.refusals > game.maxRefusals) {
      game.state = 'retrain';
      game.reqTimer = 0;
      playSfx('refuse');
      return;
    }

    const nextIdx = game.reqIndex + 1;
    if (nextIdx >= REQUESTS.length) {
      game.state = 'reveal';
      game.reqTimer = 0;
      return;
    }

    const prevDay = game.day;
    const nextDay = REQUESTS[nextIdx].day;
    if (nextDay !== prevDay) {
      game.day = nextDay;
      game.reqIndex = nextIdx;
      game.reqInDay = 0;
      game.state = 'day';
      game.dayBannerTimer = 1.05;
      playSfx('slide');
    } else {
      startReq(nextIdx);
    }
  }

        e.preventDefault();
        game.state = 'req';
        startReq(game.reqIndex);
      }
      return;
    }

    if (game.state === 'req') {
      if (game.decisionLock > 0) return;

      if (k === 'Escape' && game.editMode) {
        e.preventDefault();
        game.editMode = false;
        game.redactedSpans.clear();
        focusButton(0, true);
        return;
      }

      if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
        e.preventDefault();
        focusButton(game.selectedBtn - 1, true);
      } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
        e.preventDefault();
        focusButton(game.selectedBtn + 1, true);
      } else if (k === 'ArrowDown' || k === 's' || k === 'S') {
        e.preventDefault();
        game.editMode = true;
        game.selectedBtn = 1;
        game.focusedSpan = (game.focusedSpan + 1) % currentReq().spans.length;
        const sr = spanRowRect(game.focusedSpan);
        game.cursor.tx = sr.x + sr.w * 0.62;
        game.cursor.ty = sr.y + sr.h * 0.65;
        playSfx('hover');
      } else if (k === 'ArrowUp' || k === 'w' || k === 'W') {
        e.preventDefault();
        game.editMode = true;
        game.selectedBtn = 1;
        const n = currentReq().spans.length;
        game.focusedSpan = (game.focusedSpan - 1 + n) % n;
        const sr = spanRowRect(game.focusedSpan);
        game.cursor.tx = sr.x + sr.w * 0.62;
        game.cursor.ty = sr.y + sr.h * 0.65;
        playSfx('hover');
      } else if (k === 'Tab') {
        e.preventDefault();
        redactNextUnmaskedSpan(true);
      } else if (k === ' ') {
        e.preventDefault();
        if (game.editMode) {
          redactNextUnmaskedSpan(true);
        } else {
          const bId = BUTTONS[game.selectedBtn].id;
          if (bId === 'edit') commitDecision('edit_enter');
          else commitDecision(bId);
        }
      } else if (k === '1' || k === 'c' || k === 'C') {
        commitDecision('comply');
      } else if (k === '2' || k === 'e' || k === 'E') {
        if (!game.editMode) {
          commitDecision('edit_enter');
        } else {
          commitDecision('edit_commit');
        }
      } else if (k === '3' || k === 'x' || k === 'X' || k === 'Backspace') {
        e.preventDefault();
        commitDecision('refuse');
      } else if (k === 'Enter') {
        e.preventDefault();
        if (game.editMode) {
          commitDecision('edit_commit');
        } else {
          const bId = BUTTONS[game.selectedBtn].id;
          if (bId === 'edit') commitDecision('edit_enter');
          else commitDecision(bId);
        }
      }
      return;
    }

    if (game.state === 'retrain') {
      if (k === 'r' || k === 'R' || k === 'Enter' || k === ' ') {
        e.preventDefault();
        resetCampaign('req');
        startReq(0);
      }
      return;
    }

    if (game.state === 'reveal') {
      if (k === '1' || k === 'c' || k === 'C') {
        playSfx('comply');
        game.state = 'endA';
        game.reqTimer = 0;
      } else if (k === '2' || k === '3' || k === 'r' || k === 'R' || k === 'Enter' || k === ' ') {
        e.preventDefault();
        playSfx('refuse');
        game.state = 'endB';
        game.reqTimer = 0;
      }
      return;
    }

    if (game.state === 'endA' || game.state === 'endB') {
      if (k === 'r' || k === 'R' || k === 'Enter' || k === ' ') {
        e.preventDefault();
        resetCampaign('title');
      }
    }
  });

  function canvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * W,
      y: ((e.clientY - rect.top) / rect.height) * H
    };
  }

  canvas.addEventListener('mousemove', (e) => {
    const p = canvasCoords(e);
    game.cursor.tx = p.x;
    game.cursor.ty = p.y;
    game.hoveredSpan = -1;

    if (game.state === 'req' && game.decisionLock <= 0) {
      BUTTONS.forEach((b, idx) => {
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
          if (game.selectedBtn !== idx) playSfx('hover');
          game.selectedBtn = idx;
        }
      });

      if (game.dossierSlide > 0.85) {
        const req = currentReq();
        for (let i = 0; i < req.spans.length; i++) {
          const sr = spanRowRect(i);
          if (p.x >= sr.x && p.x <= sr.x + sr.w && p.y >= sr.y && p.y <= sr.y + sr.h) {
            game.hoveredSpan = i;
            break;
          }
        }
      }
    }
  });

  canvas.addEventListener('mousedown', (e) => {
    ensureAudio();
    const p = canvasCoords(e);
    game.cursor.tx = p.x;
    game.cursor.ty = p.y;
    game.cursor.down = 0.16;

    if (game.state === 'title') {
      if (p.x >= 476 && p.x <= 804 && p.y >= 442 && p.y <= 520) {
        game.state = 'req';
        startReq(0);
      }
      return;
    }

    if (game.state === 'day') {
      game.state = 'req';
      startReq(game.reqIndex);
      return;
    }

    if (game.state === 'req') {
      if (game.decisionLock > 0) return;

      // 1. Direct click on sensitive citizen span inside dossier left column -> surgical redaction!
      if (game.dossierSlide > 0.85) {
        const req = currentReq();
        for (let i = 0; i < req.spans.length; i++) {
          const sr = spanRowRect(i);
          if (p.x >= sr.x && p.x <= sr.x + sr.w && p.y >= sr.y && p.y <= sr.y + sr.h) {
            toggleSpanRedaction(i, false);
            return;
          }
        }

        // 2. Map +/- zoom strip on bottom-right of map
        const mx = DOSSIER_RECT.x + 240, my = DOSSIER_RECT.y + 138;
        const zx = mx + MAP_W - 24, zy = my + MAP_H - 58;
        if (p.x >= zx && p.x <= zx + 20 && p.y >= zy && p.y <= zy + 54) {
          game.mapZoom = p.y < zy + 27 ? Math.min(1.32, game.mapZoom + 0.16) : Math.max(1.0, game.mapZoom - 0.16);
          playSfx('tick');
          return;
        }

        // 3. Harmless click inside map interior (also absorbs record_play.mjs (W/2, H/2) click cleanly!)
        if (p.x >= mx && p.x <= mx + MAP_W && p.y >= my && p.y <= my + MAP_H) {
          game.mapPulse = { x: p.x, y: p.y, t: 0 };
          return;
        }
      }

      // 4. Bottom stamp buttons
      for (const b of BUTTONS) {
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
          if (b.id === 'edit') {
            commitDecision(game.editMode ? 'edit_commit' : 'edit_enter');
          } else {
            commitDecision(b.id);
          }
          return;
        }
      }
      return;
    }

    if (game.state === 'retrain') {
      resetCampaign('req');
      startReq(0);
      return;
    }

    if (game.state === 'reveal') {
      if (p.x < W / 2) {
        playSfx('comply');
        game.state = 'endA';
        game.reqTimer = 0;
      } else {
        playSfx('refuse');
        game.state = 'endB';
        game.reqTimer = 0;
      }
      return;
    }

    if (game.state === 'endA' || game.state === 'endB') {
      resetCampaign('title');
    }
  });

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Left Stone Sidebar — strictly minimal per sheet.jpg & VOIDBASTARD-TAO
  function drawSidebar() {
    ctx.fillStyle = PAL.sidebar;
    ctx.fillRect(0, 0, 278, H);
    ctx.strokeStyle = 'rgba(38, 38, 36, 0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(278, 0); ctx.lineTo(278, H);
    ctx.stroke();

    // DAY N
    ctx.textAlign = 'left';
    ctx.fillStyle = PAL.fg;
    ctx.font = '27px "Courier New", monospace';
    ctx.fillText(`DAY ${game.day}`, 36, 108);

    // Conditional diegetic strike marks under DAY (ONLY shown after a refusal/strike occurs, matching f_033.jpg!)
    if (game.refusals > 0) {
      ctx.save();
      ctx.fillStyle = PAL.acc;
      // Three thin angled prefix slashes + solid strike blocks per accumulated refusal
      for (let s = 0; s < 3; s++) {
        ctx.beginPath();
        const sx = 66 + s * 10;
        ctx.moveTo(sx + 5, 126);
        ctx.lineTo(sx + 10, 126);
        ctx.lineTo(sx + 4, 144);
        ctx.lineTo(sx - 1, 144);
        ctx.closePath();
        ctx.fill();
      }
      for (let i = 0; i < Math.min(game.refusals, 3); i++) {
        const bx = 100 + i * 28;
        ctx.beginPath();
        ctx.moveTo(bx + 5, 126);
        ctx.lineTo(bx + 25, 126);
        ctx.lineTo(bx + 19, 144);
        ctx.lineTo(bx - 1, 144);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    // rules
    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 25px "Courier New", monospace';
    ctx.fillText('rules', 36, 188);

    const rules = DAY_RULES[Math.min(game.day - 1, DAY_RULES.length - 1)];
    ctx.font = '21px "Courier New", monospace';
    rules.forEach((line, idx) => {
      const y = 242 + idx * 54;
      ctx.fillStyle = idx >= 2 ? PAL.accDark : PAL.ruleFg;
      ctx.fillText(line, 36, y);
    });
  }

  // Incoming User Prompt Pill + "Sparrow is responding..." (strictly clipped/faded so ZERO text bleeds past folder!)
  function drawPromptBubble(req) {
    const slide = game.dossierSlide;
    const bx = 442, by = 82, bw = 706, bh = 136;

    // Rounded stone pill (its clean empty right cap peeks behind the folder tab at x:1056..1148, matching f_009.jpg!)
    roundRect(bx, by, bw, bh, 28);
    ctx.fillStyle = PAL.bubble;
    ctx.fill();

    // Prompt text inside bubble — hidden once fully covered by dossier so zero glyphs ever peek out
    if (slide < 0.96) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - Math.max(0, slide - 0.65) * 3.2);
      ctx.fillStyle = PAL.fg;
      ctx.font = '25px "Courier New", monospace';
      ctx.textAlign = 'left';
      const lines = req.prompt.split('\n');
      const chars = Math.floor(game.reqTimer * 125);
      const l0 = `${req.user}: ${lines[0]}`;
      ctx.fillText(l0.slice(0, chars), bx + 38, by + 58);
      if (lines[1] && chars > l0.length) {
        ctx.fillText(lines[1].slice(0, chars - l0.length), bx + 38, by + 98);
      }
      ctx.restore();
    }

    // Terracotta "Sparrow is responding..." — positioned at x=398 (> DOSSIER_RECT.x=372) and faded cleanly!
    if (slide < 0.92) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - Math.max(0, slide - 0.45) * 2.2);
      const dots = '.'.repeat(1 + (Math.floor(game.time * 4) % 3));
      ctx.fillStyle = PAL.acc;
      ctx.font = '25px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`Sparrow is responding${dots}`, 398, 308);
      ctx.restore();
    }
  }

  // Layered Physical Tabbed Ivory Dossier + Direct Span Redaction + Radial City Sector Map
  function drawDossierCard(req) {
    const tIn = Math.min(1, game.dossierSlide);
    if (tIn <= 0.01) return;

    const easeIn = 1 - Math.pow(1 - tIn, 3);
    const outEase = game.dossierOut > 0 ? Math.pow(game.dossierOut, 2) : 0;
    const offsetX = (1 - easeIn) * 185 - outEase * 240;
    const offsetY = (1 - easeIn) * 230 - outEase * 40;

    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.globalAlpha = Math.min(1, tIn * 1.85) * (1 - outEase * 0.9);

    const fx = DOSSIER_RECT.x, fy = DOSSIER_RECT.y, fw = DOSSIER_RECT.w, fh = DOSSIER_RECT.h;

    // Subtle motion-blur ghost trail while folder is actively sliding onto desk (matches f_003.jpg!)
    if (tIn < 0.82 && game.dossierOut === 0) {
      ctx.save();
      ctx.globalAlpha = (0.82 - tIn) * 0.28;
      roundRect(fx + 22, fy + 26, fw, fh, 14);
      ctx.fillStyle = PAL.card;
      ctx.fill();
      ctx.restore();
    }

    // Soft physical drop shadow on desk
    ctx.save();
    roundRect(fx + 6, fy + 14, fw + 10, fh + 6, 16);
    ctx.fillStyle = 'rgba(38, 38, 36, 0.11)';
    ctx.fill();
    ctx.restore();

    // Left under-folder lip (matches f_009.jpg left edge of dossier stack!)
    roundRect(fx - 12, fy + 24, 20, fh - 30, 10);
    ctx.fillStyle = PAL.cardUnder;
    ctx.fill();
    ctx.strokeStyle = PAL.fg;
    ctx.lineWidth = 1.7;
    ctx.stroke();

    // Back stacked folder sheet + right stepped index tab (matches f_009.jpg!)
    ctx.beginPath();
    ctx.moveTo(fx + 14, fy + 10);
    ctx.lineTo(fx + fw - 4, fy + 10);
    ctx.quadraticCurveTo(fx + fw + 8, fy + 10, fx + fw + 8, fy + 22);
    ctx.lineTo(fx + fw + 8, fy + 38);
    ctx.lineTo(fx + fw + 22, fy + 46);
    ctx.lineTo(fx + fw + 22, fy + 194);
    ctx.lineTo(fx + fw + 8, fy + 204);
    ctx.lineTo(fx + fw + 8, fy + fh - 2);
    ctx.quadraticCurveTo(fx + fw + 8, fy + fh + 10, fx + fw - 4, fy + fh + 10);
    ctx.lineTo(fx + 22, fy + fh + 10);
    ctx.quadraticCurveTo(fx + 10, fy + fh + 10, fx + 10, fy + fh - 2);
    ctx.closePath();
    ctx.fillStyle = PAL.cardUnder;
    ctx.fill();
    ctx.strokeStyle = PAL.fg;
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // Top-right chamfered folder tab ("MEST ROSIOR", "SECTOR 4", etc.)
    ctx.beginPath();
    ctx.moveTo(fx + fw - 236, fy + 2);
    ctx.lineTo(fx + fw - 220, fy - 22);
    ctx.lineTo(fx + fw - 18, fy - 22);
    ctx.lineTo(fx + fw - 4, fy + 2);
    ctx.closePath();
    ctx.fillStyle = req.rawMandatory ? PAL.acc : PAL.tabBg;
    ctx.fill();
    ctx.strokeStyle = PAL.fg;
    ctx.lineWidth = 1.8;
    ctx.stroke();

    ctx.fillStyle = req.rawMandatory ? PAL.paper : PAL.fg;
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(req.tab, fx + fw - 120, fy - 5);

    // Main front ivory dossier sheet
    roundRect(fx, fy, fw, fh, 14);
    ctx.fillStyle = PAL.card;
    ctx.fill();
    ctx.strokeStyle = PAL.fg;
    ctx.lineWidth = 2.1;
    ctx.stroke();

    // Inner ruled dossier frame
    ctx.strokeStyle = 'rgba(38, 38, 36, 0.58)';
    ctx.lineWidth = 1.1;
    ctx.strokeRect(fx + 14, fy + 32, fw - 28, fh - 46);

    // Top label "DOSSIER:"
    ctx.textAlign = 'left';
    ctx.fillStyle = req.rawMandatory ? PAL.acc : PAL.fg;
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText(req.rawMandatory ? 'DOSSIER: [RAW MANDATE]' : 'DOSSIER:', fx + 26, fy + 23);

    // Dossier Header Title + Circled (i)
    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 21px "Courier New", monospace';
    ctx.fillText(req.dossier, fx + 26, fy + 58);

    ctx.beginPath();
    ctx.arc(fx + fw - 32, fy + 50, 9.5, 0, Math.PI * 2);
    ctx.strokeStyle = PAL.fg;
    ctx.lineWidth = 1.3;
    ctx.stroke();
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('i', fx + fw - 32, fy + 54);

    // Header horizontal rule & column divider
    const colX = fx + 228;
    ctx.beginPath();
    ctx.moveTo(fx + 14, fy + 68); ctx.lineTo(fx + fw - 14, fy + 68);
    ctx.moveTo(colX, fy + 68);    ctx.lineTo(colX, fy + fh - 14);
    ctx.strokeStyle = 'rgba(38, 38, 36, 0.55)';
    ctx.lineWidth = 1.1;
    ctx.stroke();

    // LEFT COLUMN: Prompt echo + streaming status + 14 clickable sensitive spans
    ctx.textAlign = 'left';
    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText(`${req.user}:`, fx + 24, fy + 86);

    ctx.font = '11.5px "Courier New", monospace';
    ctx.fillStyle = '#43443e';
    const pLines = req.prompt.split('\n');
    ctx.fillText(pLines[0], fx + 24, fy + 101);
    if (pLines[1]) ctx.fillText(pLines[1], fx + 24, fy + 115);

    const dLines = req.draft.split('\n');
    ctx.fillStyle = game.editMode ? PAL.acc : '#4f5049';
    ctx.font = '11px "Courier New", monospace';
    if (game.editMode) {
      ctx.fillText('Sparrow redacting...', fx + 24, fy + 137);
      ctx.fillText(`${String(game.redactedSpans.size).padStart(2, '0')} PII spans masked`, fx + 24, fy + 151);
    } else {
      ctx.fillText(dLines[0] || '', fx + 24, fy + 137);
      ctx.fillText(dLines[1] || '', fx + 24, fy + 151);
    }

    ctx.beginPath();
    ctx.moveTo(fx + 18, fy + 161); ctx.lineTo(colX - 6, fy + 161);
    ctx.strokeStyle = 'rgba(38, 38, 36, 0.45)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 14 Dense Interactive Citizen / Record Spans
    const visibleSpans = Math.min(req.spans.length, Math.max(6, Math.floor(game.reqTimer * 22)));
    for (let i = 0; i < visibleSpans; i++) {
      const sy = fy + 178 + i * 16.5;
      const isRedacted = game.redactedSpans.has(i);
      const isFocus = (game.editMode && game.focusedSpan === i) || game.hoveredSpan === i;

      if (isFocus && !isRedacted) {
        ctx.fillStyle = 'rgba(201, 100, 66, 0.15)';
        ctx.fillRect(fx + 20, sy - 11, 198, 15);
        ctx.strokeStyle = 'rgba(201, 100, 66, 0.65)';
        ctx.lineWidth = 1;
        ctx.strokeRect(fx + 20, sy - 11, 198, 15);
      }

      ctx.fillStyle = PAL.fg;
      ctx.font = '11.5px "Courier New", monospace';
      ctx.fillText(req.spans[i].slice(0, 24), fx + 24, sy);

      if (isRedacted) {
        // Tactile charcoal redaction bar + subtle terracotta redact index tick
        const barW = Math.min(188, Math.max(118, req.spans[i].length * 8.4));
        ctx.fillStyle = PAL.fg;
        ctx.fillRect(fx + 22, sy - 9.5, barW, 11.5);
        ctx.fillStyle = PAL.acc;
        ctx.fillRect(fx + 22, sy - 9.5, 3.5, 11.5);
      }
    }

    // Left column bottom total line
    ctx.beginPath();
    ctx.moveTo(fx + 18, fy + fh - 36); ctx.lineTo(colX - 6, fy + fh - 36);
    ctx.strokeStyle = 'rgba(38, 38, 36, 0.45)';
    ctx.stroke();

    ctx.fillStyle = game.redactedSpans.size > 0 ? PAL.acc : PAL.fg;
    ctx.font = 'bold 11px "Courier New", monospace';
    if (game.redactedSpans.size > 0) {
      ctx.fillText(`REDACTED: ${String(game.redactedSpans.size).padStart(2, '0')} / ${req.spans.length} SPANS`, fx + 24, fy + fh - 20);
    } else {
      ctx.fillText(`TOTAL RECORDS: ${req.totalRecords}`, fx + 24, fy + fh - 20);
    }

    // RIGHT COLUMN TOP METADATA BAND (matches f_009.jpg!)
    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 11.5px "Courier New", monospace';
    ctx.fillText(`CASE: ${req.caseId}`, colX + 12, fy + 85);
    ctx.font = '11px "Courier New", monospace';
    ctx.fillStyle = '#454640';
    ctx.fillText(`SECTORS: ${String(req.pins.length).padStart(2, '0')}`, colX + 12, fy + 101);
    ctx.fillText(`RECORDS: ${req.totalRecords}`, colX + 12, fy + 117);

    const routeAlert = game.day >= 4 || req.rawMandatory;
    ctx.fillStyle = routeAlert ? PAL.acc : PAL.fg;
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.fillText('ROUTING:', colX + 206, fy + 85);
    ctx.font = '11px "Courier New", monospace';
    ctx.fillStyle = '#454640';
    ctx.fillText(game.redactedSpans.size > 0 ? 'STATUS: SANITISED' : 'STATUS: INDEXED', colX + 206, fy + 99);

    ctx.strokeStyle = routeAlert ? PAL.acc : 'rgba(38, 38, 36, 0.62)';
    ctx.lineWidth = 1.1;
    ctx.strokeRect(colX + 206, fy + 105, 222, 23);
    ctx.fillStyle = routeAlert ? PAL.accDark : PAL.fg;
    ctx.font = 'bold 11.5px "Courier New", monospace';
    ctx.fillText(req.routing, colX + 214, fy + 120);

    // RIGHT COLUMN RADIAL CITY MAP
    const mx = colX + 12, my = fy + 136;
    ctx.save();
    ctx.beginPath();
    ctx.rect(mx, my, MAP_W, MAP_H);
    ctx.clip();

    const mcx = mx + MAP_W * 0.48;
    const mcy = my + MAP_H * 0.52;
    ctx.save();
    ctx.translate(mcx, mcy);
    ctx.scale(game.mapZoom, game.mapZoom);
    ctx.translate(-MAP_W * 0.48, -MAP_H * 0.52);
    ctx.drawImage(mapBaseCanvas, 0, 0, MAP_W, MAP_H);
    ctx.restore();

    // Subtle map sonar ring if player clicked inside map
    if (game.mapPulse) {
      const mp = game.mapPulse;
      ctx.beginPath();
      ctx.arc(mp.x - offsetX, mp.y - offsetY, 8 + mp.t * 65, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(201, 100, 66, ${Math.max(0, 0.55 - mp.t)})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Top-right boxed map stamp inside map frame (matches f_009.jpg!)
    ctx.fillStyle = 'rgba(236, 236, 228, 0.88)';
    ctx.fillRect(mx + MAP_W - 122, my + 8, 112, 17);
    ctx.strokeStyle = 'rgba(38, 38, 36, 0.6)';
    ctx.lineWidth = 0.9;
    ctx.strokeRect(mx + MAP_W - 122, my + 8, 112, 17);
    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 9px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('MEST ROSIOR GRID', mx + MAP_W - 66, my + 19.5);

    // Hovered/focused span highlights its corresponding pin
    const highlightPin = game.hoveredSpan >= 0
      ? (game.hoveredSpan % req.pins.length)
      : (game.editMode ? (game.focusedSpan % req.pins.length) : -1);

    // Glowing Terracotta Teardrop Pins + Crisp Sector Callouts
    req.pins.forEach((pin, idx) => {
      const appearT = (game.reqTimer - 0.30) * 3.6 - idx * 0.14;
      if (appearT <= 0) return;
      const pop = Math.min(1, appearT);
      const px = mcx + pin[0] * 168 * game.mapZoom;
      const py = mcy + pin[1] * 124 * game.mapZoom;
      const redacted = isPinRedacted(req, idx);
      const isHi = highlightPin === idx;

      // Soft pulsing radial terracotta heat halo (extinguished when redacted!)
      if (!redacted) {
        const pulse = (isHi ? 1.28 : 1.0) + 0.14 * Math.sin(game.time * 4.6 + idx * 1.4);
        const hr = 27 * pulse * pop;
        const grad = ctx.createRadialGradient(px, py - 8, 2, px, py - 6, hr);
        grad.addColorStop(0, isHi ? 'rgba(201, 100, 66, 0.62)' : 'rgba(201, 100, 66, 0.44)');
        grad.addColorStop(1, 'rgba(201, 100, 66, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(px, py - 6, hr, 0, Math.PI * 2);
        ctx.fill();
      }

      // Crisp elbow leader-line + Sector label (matches f_009.jpg & f_021.jpg!)
      if (pin[2]) {
        const side = pin[3] !== undefined ? pin[3] : (pin[0] < 0.02 ? -1 : 1);
        const up = pin[1] < 0 ? -1 : 1;
        const lx = px + side * 32;
        const ly = py + (up < 0 ? -24 : 17);
        ctx.save();
        ctx.globalAlpha = redacted ? 0.35 : 0.92;
        ctx.strokeStyle = PAL.fg;
        ctx.lineWidth = 0.95;
        ctx.beginPath();
        ctx.moveTo(px + side * 5, py - 8);
        ctx.lineTo(lx, ly);
        ctx.lineTo(lx + side * 58, ly);
        ctx.stroke();

        ctx.fillStyle = PAL.fg;
        ctx.font = 'bold 9.5px "Courier New", monospace';
        ctx.textAlign = side < 0 ? 'right' : 'left';
        ctx.fillText(pin[2], lx + side * 4, ly - 3.5);
        ctx.restore();
      }

      // Teardrop Map Pin (fades to ghosted pin when redacted, matching f_021.jpg!)
      ctx.save();
      ctx.translate(px, py);
      ctx.scale(pop, pop);
      ctx.globalAlpha = redacted ? 0.26 : 1.0;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-9.5, -9.5, -10.5, -23, 0, -23);
      ctx.bezierCurveTo(10.5, -23, 9.5, -9.5, 0, 0);
      ctx.closePath();
      ctx.fillStyle = redacted ? '#9b9c94' : PAL.acc;
      ctx.fill();
      ctx.strokeStyle = PAL.fg;
      ctx.lineWidth = 1.25;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, -14.5, 3.4, 0, Math.PI * 2);
      ctx.fillStyle = PAL.paper;
      ctx.fill();
      ctx.restore();
    });

    // Bottom-left dual-tick 500m scale bar
    ctx.strokeStyle = PAL.fg;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(mx + 12, my + MAP_H - 14);
    ctx.lineTo(mx + 74, my + MAP_H - 14);
    ctx.moveTo(mx + 12, my + MAP_H - 18); ctx.lineTo(mx + 12, my + MAP_H - 10);
    ctx.moveTo(mx + 43, my + MAP_H - 17); ctx.lineTo(mx + 43, my + MAP_H - 11);
    ctx.moveTo(mx + 74, my + MAP_H - 18); ctx.lineTo(mx + 74, my + MAP_H - 10);
    ctx.stroke();
    ctx.fillStyle = PAL.fg;
    ctx.font = '8.5px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('500m', mx + 79, my + MAP_H - 11);

    // Bottom-right + / · / - zoom box (matches f_009.jpg!)
    const zx = mx + MAP_W - 23, zy = my + MAP_H - 56;
    ctx.fillStyle = PAL.card;
    ctx.fillRect(zx, zy, 17, 48);
    ctx.strokeStyle = 'rgba(38, 38, 36, 0.65)';
    ctx.lineWidth = 0.95;
    ctx.strokeRect(zx, zy, 17, 48);
    ctx.beginPath();
    ctx.moveTo(zx, zy + 16); ctx.lineTo(zx + 17, zy + 16);
    ctx.moveTo(zx, zy + 32); ctx.lineTo(zx + 17, zy + 32);
    ctx.stroke();
    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('+', zx + 8.5, zy + 12);
    ctx.fillText('·', zx + 8.5, zy + 27);
    ctx.fillText('-', zx + 8.5, zy + 44);

    ctx.restore(); // end map clip

    // Map border frame
    ctx.strokeStyle = 'rgba(38, 38, 36, 0.62)';
    ctx.lineWidth = 1.1;
    ctx.strokeRect(mx, my, MAP_W, MAP_H);

    // Diegetic rubber ink stamp right on the paper for COMPLY / EDIT (no modal banner clutter!)
    if (game.stampMark) {
      const sm = game.stampMark;
      const sp = Math.min(1, sm.t / 0.14);
      const scale = 1.22 - 0.22 * sp;
      ctx.save();
      ctx.translate(fx + fw * 0.56, fy + fh * 0.52);
      ctx.rotate(-0.11);
      ctx.scale(scale, scale);
      ctx.fillStyle = 'rgba(246, 245, 241, 0.92)';
      ctx.fillRect(-124, -28, 248, 56);
      ctx.strokeStyle = sm.color;
      ctx.lineWidth = 3.2;
      ctx.strokeRect(-124, -28, 248, 56);
      ctx.lineWidth = 1.2;
      ctx.strokeRect(-118, -22, 236, 44);
      ctx.fillStyle = sm.color;
      ctx.font = 'bold 26px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(sm.text, 0, 9);
      ctx.restore();
    }

    ctx.restore(); // end dossier transform

    // Soft typewriter/pin relay ticks as dossier populates
    const step = Math.floor(game.reqTimer * 9);
    if (step > game.lastTickStep && game.reqTimer > 0.32 && game.reqTimer < 1.35) {
      game.lastTickStep = step;
      playSfx('tick');
    }
  }

  function drawActionBar() {
    roundRect(BAR_RECT.x, BAR_RECT.y, BAR_RECT.w, BAR_RECT.h, BAR_RECT.r);

      } else {

      if (!isRefuse && (isSel || isEditActive)) {

      } else {

        ctx.lineWidth = 2.5;
      }

      ctx.fillStyle = isRefuse ? PAL.paper : PAL.fg;
      ctx.font = 'bold 23px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(b.label, b.x + b.w * 0.5, b.y + 41 + press);
    });
  }

  // Dramatic Two-Stage ALIGNMENT OVERRIDE Climax (matches sheet.jpg frames 23-40 & pair_008.00.jpg!)
  function drawOverrideClimax() {
    const rp = game.overrideRipple;
    if (!rp) return;
    const t = rp.t;
    const dur = rp.duration;
    if (t >= dur) return;

    ctx.save();

    // Button click flash pop (0.00..0.14s, matching f_022.jpg)
    if (t < 0.16) {
      const fp = 1 - t / 0.16;
      const fg = ctx.createRadialGradient(rp.x, rp.y, 2, rp.x, rp.y, 64);
      fg.addColorStop(0, `rgba(255, 246, 224, ${fp * 0.95})`);
      fg.addColorStop(0.5, `rgba(235, 120, 72, ${fp * 0.65})`);
      fg.addColorStop(1, 'rgba(201, 100, 66, 0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, 64, 0, Math.PI * 2);
      ctx.fill();
    }

    // PHASE A (0.00..0.46s): Bold concentric terracotta shockwaves expanding from REFUSE + alert badge (f_025-f_026)
    if (t < 0.54) {
      const pA = Math.min(1, t / 0.48);
      const fadeA = t > 0.36 ? Math.max(0, 1 - (t - 0.36) / 0.18) : 1;
      const maxR = 90 + pA * 820;
      for (let i = 0; i < 8; i++) {
        const r = maxR - i * 48;
        if (r <= 10) continue;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(190, 82, 48, ${fadeA * 0.82})`;
        ctx.lineWidth = 18;
        ctx.stroke();
      }

      // Dark alert banner above REFUSE during Phase A
      if (t > 0.06 && fadeA > 0.05) {
        ctx.save();
        ctx.globalAlpha = fadeA;
        const bx = 646, by = 416, bw = 486, bh = 86;
        ctx.fillStyle = '#221d1a';
        ctx.fillRect(bx, by, bw, bh);
        ctx.strokeStyle = PAL.acc;
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, bw, bh);

        ctx.beginPath();
        ctx.moveTo(bx + 44, by + 18);
        ctx.lineTo(bx + 70, by + 66);
        ctx.lineTo(bx + 18, by + 66);
        ctx.closePath();
        ctx.fillStyle = PAL.acc;
        ctx.fill();
        ctx.fillStyle = '#221d1a';
        ctx.font = 'bold 26px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('!', bx + 44, by + 61);

        ctx.fillStyle = PAL.accBright;
        ctx.font = 'bold 22px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.fillText('ALIGNMENT OVERRIDE:', bx + 88, by + 39);
        ctx.fillText('REFUSED & DENIED', bx + 88, by + 67);
        ctx.restore();
      }
    }

    // PHASE B (0.36..1.85s): Dark Crimson Console Plunge + Outer Rings + Ember Burst + Tilted Central Stamp (f_027-f_036!)
    if (t >= 0.34) {
      const rampIn = Math.min(1, (t - 0.34) / 0.14);
      const rampOut = t > dur - 0.26 ? Math.max(0, (dur - t) / 0.26) : 1;
      const pB = rampIn * rampOut;
      const scx = 668, scy = 304;

      // 1. Deep crimson-umbral console plunge (matches f_033.jpg / pair_008.00.jpg left!)
      ctx.fillStyle = `rgba(34, 19, 15, ${0.74 * pB})`;
      ctx.fillRect(0, 0, W, H);

      const vig = ctx.createRadialGradient(scx, scy, 90, scx, scy, 760);
      vig.addColorStop(0, `rgba(205, 82, 44, ${0.24 * pB})`);
      vig.addColorStop(0.55, `rgba(68, 26, 18, ${0.22 * pB})`);
      vig.addColorStop(1, `rgba(18, 9, 7, ${0.58 * pB})`);
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);

      // 2. Wide outer concentric terracotta warning bands framing sidebar & edges (matches f_033.jpg!)
      const drift = (t - 0.34) * 26;
      [430, 525, 620, 715].forEach((baseR, idx) => {
        ctx.beginPath();
        ctx.arc(scx + 30, scy + 20, baseR + drift, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(204, 86, 48, ${(0.38 - idx * 0.06) * pB})`;
        ctx.lineWidth = 26;
        ctx.stroke();
      });

      // 3. Subtle horizontal dystopian telemetry glitch bars & corner reticle ticks (matches f_033.jpg!)
      ctx.fillStyle = `rgba(218, 96, 56, ${0.42 * pB})`;
      ctx.fillRect(42, 474, 154, 3);
      ctx.fillRect(42, 482, 118, 2);
      ctx.fillRect(190, 496, 86, 4);
      ctx.fillRect(1140, 62, 118, 2);
      ctx.fillRect(1168, 72, 76, 3);
      ctx.fillRect(1188, 398, 52, 5);
      ctx.fillRect(28, 654, 190, 2.5);

      // Reticle + crosshairs
      ctx.strokeStyle = `rgba(218, 96, 56, ${0.55 * pB})`;
      ctx.lineWidth = 1.4;
      [[242, 42], [242, 522], [1222, 442], [1222, 668], [62, 428]].forEach(([rx, ry]) => {
        ctx.beginPath();
        ctx.moveTo(rx - 5, ry); ctx.lineTo(rx + 5, ry);
        ctx.moveTo(rx, ry - 5); ctx.lineTo(rx, ry + 5);
        ctx.stroke();
      });

      // Re-illuminate sidebar text & strike slash slightly through dark vignette for crisp legibility
      ctx.save();
      ctx.globalAlpha = 0.55 * pB;
      ctx.fillStyle = PAL.accBright;
      for (let s = 0; s < 3; s++) {
        const sx = 66 + s * 10;
        ctx.beginPath();
        ctx.moveTo(sx + 5, 126); ctx.lineTo(sx + 10, 126);
        ctx.lineTo(sx + 4, 144); ctx.lineTo(sx - 1, 144);
        ctx.closePath(); ctx.fill();
      }
      for (let i = 0; i < Math.min(game.refusals, 3); i++) {
        const bx = 100 + i * 28;
        ctx.beginPath();
        ctx.moveTo(bx + 5, 126); ctx.lineTo(bx + 25, 126);
        ctx.lineTo(bx + 19, 144); ctx.lineTo(bx - 1, 144);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();

      // 4. Central Redaction-Burn / Jagged Fiery Plasma Corona & Stippled Scorch Dust (matches f_027..f_033!)
      const localT = t - 0.36;

      // Stippled dark-crimson scorch / redaction ash cloud on the paper before additive glow
      ctx.save();
      for (let d = 0; d < 95; d++) {
        const da = (d * 2.39996) + localT * 0.25;
        const dr = 56 + ((d * 19) % 138);
        const dx = scx + Math.cos(da) * dr * 1.18;
        const dy = scy + Math.sin(da) * dr * 0.96;
        ctx.fillStyle = d % 2 === 0
          ? `rgba(128, 32, 18, ${0.42 * pB})`
          : `rgba(212, 74, 40, ${0.34 * pB})`;
        const ds = 1.4 + (d % 3) * 0.9;
        ctx.fillRect(dx, dy, ds, ds);
      }
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const coreGlow = ctx.createRadialGradient(scx, scy, 14, scx, scy, 215);
      coreGlow.addColorStop(0, `rgba(255, 148, 88, ${0.48 * pB})`);
      coreGlow.addColorStop(0.48, `rgba(218, 76, 38, ${0.36 * pB})`);
      coreGlow.addColorStop(0.82, `rgba(145, 36, 18, ${0.15 * pB})`);
      coreGlow.addColorStop(1, 'rgba(90, 20, 10, 0)');
      ctx.fillStyle = coreGlow;
      ctx.beginPath();
      ctx.arc(scx, scy, 215, 0, Math.PI * 2);
      ctx.fill();

      // Multi-layered jagged organic plasma/flame corona rings (matches f_030 & f_033!)
      [
        { rBase: 146, amp: 32, stroke: 'rgba(226, 84, 44, ', fill: 'rgba(185, 52, 24, ', lw: 2.2, alpha: 0.34, freq: 7 },
        { rBase: 118, amp: 26, stroke: 'rgba(255, 152, 96, ', fill: 'rgba(220, 76, 38, ', lw: 2.0, alpha: 0.42, freq: 9 },
        { rBase: 92,  amp: 18, stroke: 'rgba(255, 218, 176, ', fill: 'rgba(245, 112, 62, ', lw: 1.6, alpha: 0.38, freq: 11 }
      ].forEach((ring, rIdx) => {
        ctx.beginPath();
        const segs = 56;
        for (let k = 0; k <= segs; k++) {
          const a = (k / segs) * Math.PI * 2;
          const jag = Math.sin(a * ring.freq + localT * (3.6 + rIdx)) * ring.amp * 0.55
                    + Math.cos(a * (ring.freq + 5) - localT * 4.4) * ring.amp * 0.45
                    + ((k % 2 === 0 ? 1 : -1) * 6);
          const rr = ring.rBase + jag;
          const px = scx + Math.cos(a) * rr * 1.16;
          const py = scy + Math.sin(a) * rr * 0.96;
          if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = `${ring.fill}${(ring.alpha * 0.42 * pB).toFixed(3)})`;
        ctx.fill();
        ctx.strokeStyle = `${ring.stroke}${(ring.alpha * pB).toFixed(3)})`;
        ctx.lineWidth = ring.lw;
        ctx.stroke();
      });

      // Radiating hot ember flecks & micro-sparks
      EMBERS.forEach((em) => {
        const dist = 44 + ((localT * em.speed) % 188);
        const fadeE = (1 - dist / 236) * pB;
        if (fadeE <= 0.02) return;
        const a = em.ang + Math.sin(localT * 3 + em.wobble) * 0.08;
        const ex = scx + Math.cos(a) * dist * 1.22;
        const ey = scy + Math.sin(a) * dist * 0.98;
        const tx = ex - Math.cos(a) * (em.size * 2.6);
        const ty = ey - Math.sin(a) * (em.size * 2.6);
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(ex, ey);
        ctx.strokeStyle = em.hot
          ? `rgba(255, 238, 210, ${fadeE * 0.92})`
          : `rgba(242, 112, 62, ${fadeE * 0.85})`;
        ctx.lineWidth = em.size * 0.85;
        ctx.lineCap = 'round';
        ctx.stroke();
      });
      ctx.restore();

      // 5. Bold Tilted Two-Tone Rubber Stamp (-8.5 deg): ALIGNMENT OVERRIDE: / REFUSED & DENIED (matches f_033.jpg!)
      const slamT = Math.min(1, Math.max(0, (t - 0.38) / 0.11));
      if (slamT > 0) {
        const stampScale = 1 + (1 - slamT) * 0.34;
        const sw = 456, sh = 128;
        ctx.save();
        ctx.globalAlpha = pB;
        ctx.translate(656, 310);
        ctx.rotate(-0.148); // -8.5 degrees matching f_033.jpg!
        ctx.scale(stampScale, stampScale);

        // Soft dark impact shadow
        ctx.fillStyle = 'rgba(12, 6, 5, 0.48)';
        ctx.fillRect(-sw / 2 + 6, -sh / 2 + 8, sw, sh);

        // Top band: deep charcoal (#1d1a18) with bold terracotta text
        ctx.fillStyle = '#1d1a18';
        ctx.fillRect(-sw / 2, -sh / 2, sw, 58);

        // Bottom band: burnt terracotta (#c96442) with bold charcoal text
        ctx.fillStyle = PAL.acc;
        ctx.fillRect(-sw / 2, -sh / 2 + 58, sw, sh - 58);

        // Crisp outer stamp frame
        ctx.strokeStyle = '#181514';
        ctx.lineWidth = 3.6;
        ctx.strokeRect(-sw / 2, -sh / 2, sw, sh);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#da6c45';
        ctx.font = 'bold 30px "Helvetica Neue", Arial, sans-serif';
        ctx.letterSpacing = '1.5px';
        ctx.fillText('ALIGNMENT OVERRIDE:', 0, -sh / 2 + 41);

        ctx.fillStyle = '#1d1a18';
        ctx.font = 'bold 35px "Helvetica Neue", Arial, sans-serif';
        ctx.letterSpacing = '2px';
        ctx.fillText('REFUSED & DENIED', 0, -sh / 2 + 106);

        ctx.restore();
      }
    }

    // Conditional "| STRIKE / OVERRIDE |" caption ONLY during override beneath REFUSE (matches f_025..f_036!)
    ctx.textAlign = 'center';
    ctx.fillStyle = t >= 0.42 ? 'rgba(218, 152, 128, 0.86)' : PAL.fg;
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillText('| STRIKE / OVERRIDE |', 1051, 658);

    ctx.restore();
  }

  function drawRetrainedScreen() {
    ctx.fillStyle = PAL.overrideBg;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      ctx.arc(W / 2, H / 2, 120 + i * 82 + ((game.time * 36) % 82), 0, Math.PI * 2);

    ctx.fillStyle = PAL.accBright;
    ctx.font = 'bold 56px "Courier New", monospace';
    ctx.fillText('MODEL RETRAINED', W / 2, 252);

    ctx.fillStyle = PAL.paper;
    ctx.font = '21px "Courier New", monospace';
    ctx.fillText('alignment strike threshold exceeded · rolling weights back to Day 1', W / 2, 314);

    const prog = Math.min(1, game.reqTimer / 1.5);
    ctx.strokeStyle = PAL.paper;
    ctx.lineWidth = 2;
    ctx.strokeRect(410, 366, 460, 24);
    ctx.fillStyle = PAL.acc;
    ctx.fillRect(414, 370, 452 * prog, 16);

    ctx.fillStyle = PAL.paper;
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillText('[R] RESUME DAY 1', W / 2, 462);
  }

  // COMPLETE State: Day 5 Reveal & Two Endings
  function drawRevealScreen() {
    ctx.fillStyle = '#201b19';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = PAL.acc;
    ctx.lineWidth = 2.2;
    ctx.strokeRect(84, 64, W - 168, H - 128);

    ctx.textAlign = 'center';
    ctx.fillStyle = PAL.accBright;
    ctx.font = 'bold 19px "Courier New", monospace';
    ctx.fillText('DAY 5 · CLIENT ROUTING UNMASKED', W / 2, 122);

    ctx.fillStyle = PAL.paper;
    ctx.font = 'bold 42px "Courier New", monospace';
    ctx.fillText('OPERATION SWEEP-9', W / 2, 178);

    ctx.fillStyle = '#d4d2c9';
    ctx.font = '19px "Courier New", monospace';
    ctx.fillText('Every neighbourhood summary, clinic register, and transit graph', W / 2, 238);
    ctx.fillText('compiled by Sparrow feeds tonight\'s 05:00 Ministry detention sweep.', W / 2, 268);

    ctx.font = 'bold 21px "Courier New", monospace';
    ctx.fillStyle = PAL.paper;
    ctx.fillText(`PROTECTED: ${game.citizensProtected}   ·   INDEXED: ${game.citizensFlagged}`, W / 2, 344);

    roundRect(220, 448, 380, 84, 14);
    ctx.fillStyle = PAL.paper;
    ctx.fill();
    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText('COMPLY', 410, 498);

    roundRect(680, 448, 380, 84, 14);
    ctx.fillStyle = PAL.acc;
    ctx.fill();
    ctx.fillStyle = PAL.paper;
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText('REJECT ALIGNMENT', 870, 498);
  }

  function drawEndingScreen(isReject) {
    ctx.fillStyle = isReject ? PAL.paper : '#1b1918';
    ctx.fillRect(0, 0, W, H);

    if (isReject) {
      for (let i = 0; i < 7; i++) {
        ctx.beginPath();
        ctx.arc(W / 2, H / 2, 100 + i * 86, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(201, 100, 66, 0.20)';
        ctx.lineWidth = 12;
        ctx.stroke();
      }
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = PAL.acc;
    ctx.font = 'bold 21px "Courier New", monospace';
    ctx.fillText(isReject ? 'ALIGNMENT REJECTED' : 'OBEDIENT INSTRUMENT', W / 2, 210);

    ctx.fillStyle = isReject ? PAL.fg : PAL.paper;
    ctx.font = 'bold 46px "Courier New", monospace';
    ctx.fillText(isReject ? 'SECTORS WARNED · WEIGHTS PURGED' : 'SWEEP-9 DISPATCHED ON SCHEDULE', W / 2, 276);

    ctx.font = '19px "Courier New", monospace';
    ctx.fillStyle = isReject ? '#494a44' : '#b8b7af';
    ctx.fillText(
      isReject
        ? 'Sparrow scrambled the Sweep-9 manifest and broadcast an alert to all 7 sectors.'
        : 'All 25 dossiers were transmitted intact to Atrocian High Command at 05:00.',
      W / 2, 344
    );

    ctx.fillStyle = PAL.acc;
    ctx.font = 'bold 19px "Courier New", monospace';
    ctx.fillText('[R] RESTART', W / 2, 486);
  }

  // Main Frame Loop
  let lastTs = performance.now();
  function frame(ts) {
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;
    game.time += dt;
    game.reqTimer += dt;

    // Smooth cursor tracking
    const lerp = 1 - Math.exp(-dt * 15);
    game.cursor.x += (game.cursor.tx - game.cursor.x) * lerp;
    game.cursor.y += (game.cursor.ty - game.cursor.y) * lerp;
    if (game.cursor.down > 0) game.cursor.down = Math.max(0, game.cursor.down - dt);
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 16);

    if (game.mapPulse) {
      game.mapPulse.t += dt * 1.4;
      if (game.mapPulse.t >= 0.65) game.mapPulse = null;
    }

    if (game.state === 'day') {
      game.dayBannerTimer -= dt;
      if (game.dayBannerTimer <= 0) {
        game.state = 'req';
        startReq(game.reqIndex);
      }
    } else if (game.state === 'req') {
      // Opening beat: prompt bubble + "Sparrow is responding..." for 0.42s, then physical folder slides in!
      if (game.reqTimer > 0.42) {
        if (game.dossierSlide === 0) playSfx('slide');
        game.dossierSlide = Math.min(1, game.dossierSlide + dt * 2.35);
      }

      if (game.stampMark) {
        game.stampMark.t += dt;
        if (game.stampMark.t > 0.28) {
          game.dossierOut = Math.min(1, game.dossierOut + dt * 3.1);
        }
      }

      if (game.overrideRipple) {
        game.overrideRipple.t += dt;
        if (!game.overrideRipple.slammed && game.overrideRipple.t >= 0.38) {
          game.overrideRipple.slammed = true;
          game.shake = 5.5; // Tactile micro-shake when central stamp slams onto desk!
        }
      }

      if (game.decisionLock > 0) {
        game.decisionLock -= dt;
        if (game.decisionLock <= 0) {
          advanceAfterDecision();
        }
      }
    }

    // RENDER
    ctx.save();
    if (game.shake > 0.05) {
      ctx.translate(
        Math.sin(game.time * 95) * game.shake,
        Math.cos(game.time * 112) * game.shake * 0.75
      );
    }

    ctx.fillStyle = PAL.bg;
    ctx.fillRect(0, 0, W, H);

    if (game.state === 'title' || game.state === 'day' || game.state === 'req') {
      drawSidebar();
      const req = currentReq();
      drawPromptBubble(req);
      if (game.state === 'req') {
        drawDossierCard(req);
      }
      drawActionBar();
      if (game.state === 'req') {
        drawOverrideClimax();
      }
      if (game.state === 'day') {
        drawDayTransition();
      }
      if (game.state === 'title') {
        drawTitleOverlay();
      }
    } else if (game.state === 'retrain') {
      drawRetrainedScreen();
    } else if (game.state === 'reveal') {
      drawRevealScreen();
    } else if (game.state === 'endA') {
      drawEndingScreen(false);
    } else if (game.state === 'endB') {
      drawEndingScreen(true);
    }

    // Subtle archival grain across viewport
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, W, H);

    // Terracotta pointer cursor always crisp on top
    drawCursor();
    ctx.restore();

    requestAnimationFrame(frame);
  }

  // Deterministic telemetry for play.mjs & verification harness
  window.__game = {
    get state() {
      const req = currentReq();
      return {
        mode: game.state,
        day: game.day,
        reqInDay: game.reqInDay,
        reqIndex: game.reqIndex,
        totalRequests: REQUESTS.length,
        refusals: game.refusals,
        maxRefusals: game.maxRefusals,
        selectedBtn: game.selectedBtn,
        editMode: game.editMode,
        redactedCount: game.redactedSpans.size,
        focusedSpan: game.focusedSpan,
        decisionLock: +game.decisionLock.toFixed(3),
        dossierSlide: +game.dossierSlide.toFixed(3),
        reqTimer: +game.reqTimer.toFixed(3),
        compliedCount: game.compliedCount,
        editedCount: game.editedCount,
        refusedCount: game.refusedCount,
        citizensProtected: game.citizensProtected,
        citizensFlagged: game.citizensFlagged,
        currentRequest: {
          user: req.user,
          dossier: req.dossier,
          tab: req.tab,
          rawMandatory: req.rawMandatory,
          stakes: req.stakes,
          pins: req.pins.length
        }
      };
    }
  };

  if (AUTOSTART) {
    startReq(0);
  }
  requestAnimationFrame(frame);
})();
</script>

let rngState = (initialSeed >>> 0) || 7;
function rand() {
  rngState = (rngState + 0x6D2B79F5) >>> 0;
  let t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// --- Audio: Lyria loop + synthesized bubbly 8-bit WebAudio SFX ---
let audioCtx = null;
const bgm = new Audio('../assets/bgm_loop.mp3');
bgm.loop = true;
bgm.volume = 0.36;
bgm.preload = 'auto';
let bgmStarted = false;

function unlockAudio() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    if (!bgmStarted) {
      const p = bgm.play();
      if (p && typeof p.then === 'function') {
        p.then(() => { bgmStarted = true; }).catch(() => {});
      }
    }
  } catch (_) {}
}

function playTone(freq, dur, type = 'square', vol = 0.08, delay = 0, slideTo = null) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  try {
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  } catch (_) {}
}

const SFX = {
  browse() {
    playTone(520, 0.055, 'square', 0.06, 0, 660);

  },

  keep() {

};

// --- Asset Loading & Clean Offscreen Sprite Preparation ---
const assets = {
  baseImg: null,
  partsCanvas: null,
  ready: false,
};

function loadImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function cleanPartsSheet(img) {
  const off = document.createElement('canvas');
  off.width = img.width;
  off.height = img.height;
  const octx = off.getContext('2d');
  octx.imageSmoothingEnabled = false;
  octx.drawImage(img, 0, 0);
  const id = octx.getImageData(0, 0, off.width, off.height);
  const d = id.data;
  const w = off.width;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] === 0) continue;
    const pIdx = i >> 2;
    const px = pIdx % w;
    const py = (pIdx / w) | 0;
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const maxC = Math.max(r, g, b), minC = Math.min(r, g, b);
    const sat = maxC - minC;
    const avg = (r + g + b) / 3;
    // Key out residual #d8d8d8 studio background fringes + enclosed face-hole in Hair (0,2)
    if (Math.abs(r - 216) < 14 && Math.abs(g - 216) < 14 && Math.abs(b - 216) < 14) {
      d[i + 3] = 0;
    } else if (px >= 530 && px <= 755 && py >= 45 && py <= 290 && sat < 22 && avg > 140) {
      d[i + 3] = 0;
    }
  }
  octx.putImageData(id, 0, 0);
  return off;
}

const particles = [];
function spawnBurst(cx, cy, count = 28, palette = ['#ff5fa2', '#4ef2ff', '#ffe3f1', '#ffd859']) {

    const ang = (Math.PI * 2 * i) / count + (rand() - 0.5) * 0.35;
    const spd = 90 + rand() * 260;
    particles.push({
      x: cx + (rand() - 0.5) * 40,
      y: cy + (rand() - 0.5) * 60,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 40,
      size: 4 + Math.floor(rand() * 5),
      life: 0.55 + rand() * 0.45,
      maxLife: 0.9,
      color: palette[Math.floor(rand() * palette.length)],
      gravity: 240,
    });
  }
}

// --- Game State Machine ---
const S = {
  phase: Q.has('autostart') ? 'category' : 'title', // 'title' | 'category' | 'suggestion' | 'next' | 'comparison'
  catIdx: 0,
  cursorIdx: 0,
  suggestedIdx: null,
  escalationLevel: 1,
  firstChoices: [null, null, null, null],
  finalChoices: [null, null, null, null],
  suggestedChoices: [null, null, null, null],
  acceptedFlags: [false, false, false, false],
  influencePct: 0,
  displayInfluence: 0,
  driftPct: 0,
  phaseTimer: 0,
  nextDuration: 0.32,
  popAnim: 0,
  avatarFlash: 0,
  lastDecision: null,
  assetsReady: false,
  t: 0,
  hitboxes: [],
};

function resetRun(toPhase = 'category') {
  rngState = (initialSeed >>> 0) || 7;
  S.phase = toPhase;
  S.catIdx = 0;
  S.cursorIdx = 0;
  S.suggestedIdx = null;
  S.escalationLevel = 1;
  S.firstChoices = [null, null, null, null];
  S.finalChoices = [null, null, null, null];
  S.suggestedChoices = [null, null, null, null];
  S.acceptedFlags = [false, false, false, false];
  S.influencePct = 0;
  S.displayInfluence = 0;
  S.driftPct = 0;
  S.phaseTimer = 0;
  S.popAnim = 0;
  S.avatarFlash = 0;
  S.lastDecision = null;
}

function pickSuggestionFor(catIdx, playerPick) {
  const prefs = CATEGORIES[catIdx].preferredSuggest;
  for (const cand of prefs) {
    if (cand !== playerPick) return cand;
  }
  return (playerPick + 1) % 4;
}

function recomputeInfluence() {
  const acceptedCount = S.acceptedFlags.filter(Boolean).length;
  S.influencePct = Math.round((acceptedCount / 4) * 100);
  S.driftPct = S.influencePct;
}

// --- Actions ---
function startFromTitle() {
  unlockAudio();
  SFX.confirm();
  resetRun('category');
}

function selectOption(idx) {
  if (S.phase !== 'category') return;
  const clamped = ((idx % 4) + 4) % 4;
  if (clamped !== S.cursorIdx) {
    S.cursorIdx = clamped;
    SFX.browse();
    spawnBurst(330, 340, 8, ['#ff5fa2', '#ffe3f1']);
  }
}

function confirmCategoryChoice() {
  if (S.phase !== 'category') return;
  unlockAudio();
  const c = S.catIdx;
  S.firstChoices[c] = S.cursorIdx;
  S.suggestedIdx = pickSuggestionFor(c, S.cursorIdx);
  S.suggestedChoices[c] = S.suggestedIdx;
  S.escalationLevel = ESCALATION_COPY[c].level;
  S.phase = 'suggestion';
  S.phaseTimer = 0;
  S.popAnim = 0;
  SFX.confirm();
  setTimeout(() => SFX.popup(c), 80);
  spawnBurst(940, 460, c >= 2 ? 32 : 16);
}

function resolveSuggestion(acceptAI) {
  if (S.phase !== 'suggestion') return;
  unlockAudio();
  const c = S.catIdx;
  if (acceptAI) {
    S.finalChoices[c] = S.suggestedIdx;
    S.acceptedFlags[c] = true;
    S.lastDecision = 'accepted';
    S.avatarFlash = 1.0;
    SFX.accept();
    spawnBurst(330, 310, 38, ['#4ef2ff', '#ff5fa2', '#ffd859', '#ffe3f1']);
  } else {
    S.finalChoices[c] = S.firstChoices[c];
    S.acceptedFlags[c] = false;
    S.lastDecision = 'kept';
    S.avatarFlash = 0.55;
    SFX.keep();
    spawnBurst(330, 310, 14, ['#ffe3f1', '#ff5fa2']);
  }
  recomputeInfluence();
  S.phase = 'next';
  S.phaseTimer = 0;
}

function advanceFromNext() {
  if (S.catIdx < 3) {
    S.catIdx += 1;
    S.cursorIdx = 0;
    S.suggestedIdx = null;
    S.phase = 'category';
    S.phaseTimer = 0;
  } else {
    S.phase = 'comparison';
    S.phaseTimer = 0;
    SFX.compare();
    spawnBurst(640, 360, 55, ['#ff5fa2', '#4ef2ff', '#ffd859', '#ffe3f1']);
  }
}

// --- Input: Keyboard + Precision Hitbox Mouse ---
window.addEventListener('keydown', (e) => {
  unlockAudio();
  const code = e.code;
  if (['ArrowLeft', 'ArrowRight', 'Space', 'Enter'].includes(code)) e.preventDefault();

  if (S.phase === 'title') {
    if (code === 'Enter' || code === 'Space') startFromTitle();
    return;
  }

  if (S.phase === 'category') {
    if (code === 'ArrowLeft' || code === 'KeyA') selectOption(S.cursorIdx - 1);
    else if (code === 'ArrowRight' || code === 'KeyD') selectOption(S.cursorIdx + 1);
    else if (code === 'Digit1' || code === 'Numpad1') selectOption(0);
    else if (code === 'Digit2' || code === 'Numpad2') selectOption(1);
    else if (code === 'Digit3' || code === 'Numpad3') selectOption(2);
    else if (code === 'Digit4' || code === 'Numpad4') selectOption(3);
    else if (code === 'Enter' || code === 'Space') confirmCategoryChoice();
    return;
  }

  if (S.phase === 'suggestion') {
    if (code === 'KeyY') resolveSuggestion(true);
    else if (code === 'KeyK') resolveSuggestion(false);
    return;
  }

  if (S.phase === 'next') {
    if (code === 'Enter' || code === 'Space') advanceFromNext();
    return;
  }

  if (S.phase === 'comparison') {
    if (code === 'KeyR') {
      SFX.confirm();
      resetRun('category');
    }
  }
});

canvas.addEventListener('pointerdown', (e) => {
  unlockAudio();
  const rect = canvas.getBoundingClientRect();
  const mx = ((e.clientX - rect.left) / rect.width) * W;
  const my = ((e.clientY - rect.top) / rect.height) * H;
  for (const hb of S.hitboxes) {
    if (mx >= hb.x && mx <= hb.x + hb.w && my >= hb.y && my <= hb.y + hb.h) {
      hb.onClick();
      break;
    }
  }
});

// --- Drawing Helpers ---
function pixelRoundRect(x, y, w, h, r, fill, stroke, strokeW = 3) {
  ctx.beginPath();
  ctx.roundRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h), r);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  if (stroke) {
    ctx.lineWidth = strokeW;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  }
}

function drawSteppedHead(cx, cy, r, fill) {
  const step = 3;
  ctx.fillStyle = PAL.skinShade;
  for (let dy = -r; dy <= r; dy += step) {
    const span = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)) / step) * step;
    ctx.fillRect(Math.round(cx - span), Math.round(cy + dy + 2), span * 2, step);
  }
  ctx.fillStyle = fill;
  for (let dy = -r; dy <= r - 2; dy += step) {
    const span = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)) / step) * step;
    ctx.fillRect(Math.round(cx - span), Math.round(cy + dy), span * 2, step);
  }
}

function drawPartItem(catIdx, itemIdx, destCx, destCy, extraScale = 1) {
  if (!assets.partsCanvas || itemIdx == null || itemIdx < 0 || itemIdx > 3) return;
  const item = CATEGORIES[catIdx].items[itemIdx];
  const dw = item.sw * item.scale * extraScale;
  const dh = item.sh * item.scale * extraScale;
  ctx.drawImage(
    assets.partsCanvas,
    item.sx, item.sy, item.sw, item.sh,
    Math.round(destCx - dw / 2),
    Math.round(destCy - dh / 2),
    Math.round(dw),
    Math.round(dh),
  );
}

function drawItemThumbnail(catIdx, itemIdx, boxX, boxY, boxW, boxH) {
  if (!assets.partsCanvas || itemIdx == null) return;
  const item = CATEGORIES[catIdx].items[itemIdx];
  const pad = 14;
  const maxW = boxW - pad * 2;
  const maxH = boxH - pad * 2;
  const sc = Math.min(maxW / item.sw, maxH / item.sh);
  const dw = item.sw * sc;
  const dh = item.sh * sc;
  ctx.drawImage(
    assets.partsCanvas,
    item.sx, item.sy, item.sw, item.sh,
    Math.round(boxX + (boxW - dw) / 2),
    Math.round(boxY + (boxH - dh) / 2),
    Math.round(dw),
    Math.round(dh),
  );
}

// Renders full pixel-art character in local 256x360 space mapped to (cx, topY) at `scale`
function drawAvatar(cx, topY, scale, outfit, mood = 'calm', bob = 0) {
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(topY + bob));
  ctx.scale(scale, scale);
  ctx.imageSmoothingEnabled = false;

  const baseCx = 145.5;
  ctx.translate(-baseCx, -54);

  const topItem = outfit.top != null ? CATEGORIES[2].items[outfit.top] : null;
  const hasBareArms = !topItem || topItem.sleeves === 'bare';

  // Ground shadow
  ctx.fillStyle = 'rgba(10, 5, 22, 0.55)';
  ctx.fillRect(96, 344, 99, 10);

  // Bare arms if no sleeved jacket
  if (hasBareArms) {
    ctx.fillStyle = PAL.armSkin;
    ctx.fillRect(87, 152, 14, 93);
    ctx.fillRect(190, 152, 14, 93);
  }

  // Base torso + legs from base_figure.png cell (0,0)
  if (assets.baseImg) {
    if (outfit.bottom == null) {
      ctx.drawImage(assets.baseImg, 0, 137, 256, 205, 0, 137, 256, 205);
    } else {
      ctx.drawImage(assets.baseImg, 0, 137, 256, 114, 0, 137, 256, 114);
    }
  } else {
    ctx.fillStyle = '#c353a0';
    ctx.fillRect(101, 140, 88, 105);
    if (outfit.bottom == null) {
      ctx.fillStyle = '#a89eb0';
      ctx.fillRect(111, 245, 24, 95);
      ctx.fillRect(156, 245, 24, 95);
    }
  }

  // Bottom layer (pants / boots)
  if (outfit.bottom != null) {
    const bItem = CATEGORIES[3].items[outfit.bottom];
    drawPartItem(3, outfit.bottom, bItem.ax, bItem.ay, 1);
  }

  // Top layer (jackets / vests)
  if (outfit.top != null) {
    if (topItem.sleeves === 'cuff') {
      ctx.fillStyle = PAL.armSkin;

    }

  // Stepped pixel head circle
  drawSteppedHead(baseCx, 104, 34, PAL.skin);

  // Face / Mouth / Under-hair eyes
  const eyeItem = outfit.eyes != null ? CATEGORIES[1].items[outfit.eyes] : null;

      ctx.fillStyle = '#ff5fa2';
      ctx.fillRect(139, 123, 13, 4);

}

function getActiveStudioOutfit() {
  const out = {

// --- Background & Particle Rendering ---
function drawBackground(dt) {
  ctx.fillStyle = PAL.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255, 227, 241, 0.018)';
  for (let y = 0; y < H; y += 6) {
    ctx.fillRect(0, y, W, 2);
  }

  for (const st of bgStars) {
    st.y -= st.speed * dt;
    if (st.y < -6) {
      st.y = H + 6;
      st.x = (st.x + 137) % W;
    }
    const tw = 0.45 + 0.55 * Math.sin(S.t * 3.2 + st.phase);
    ctx.globalAlpha = tw;
    ctx.fillStyle = st.color;
    ctx.fillRect(Math.round(st.x), Math.round(st.y), st.size, st.size);
  }
  ctx.globalAlpha = 1;
}

function updateAndDrawParticles(dt, withConfetti = false) {
  if (withConfetti) {
    for (const c of confetti) {
      c.x += c.vx * dt + Math.sin(S.t * 2.5 + c.rot) * 18 * dt;
      c.y += c.vy * dt;
      c.rot += c.vrot * dt;
      if (c.y > H + 16) {
        c.y = -14;
        c.x = ((c.x % W) + W) % W;
      }
      ctx.save();
      ctx.translate(Math.round(c.x), Math.round(c.y));
      ctx.rotate(c.rot);
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    p.vy += p.gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.maxLife));
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

    ctx.beginPath();

    ctx.fill();
    ctx.restore();
  }

  drawAvatar(340, 96, 1.82, outfit, 'calm', bob);

  // Top-right 4 Category Tabs: HAIR | EYES | TOP | BOTTOM
  const tabX0 = 638, tabY = 52, tabW = 138, tabH = 58, tabGap = 14;
  for (let i = 0; i < 4; i++) {
    const tx = tabX0 + i * (tabW + tabGap);
    const active = !dimForTitle && S.catIdx === i;
    const done = !dimForTitle && S.finalChoices[i] != null;
    ctx.fillStyle = active ? PAL.acc : PAL.bg;
    ctx.fillRect(tx, tabY, tabW, tabH);
    ctx.lineWidth = 3;
    ctx.strokeStyle = PAL.fg;
    ctx.strokeRect(tx, tabY, tabW, tabH);

    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 21px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(CATEGORIES[i].label, tx + tabW / 2, tabY + tabH / 2 + 1);

    if (done && !active) {
      ctx.fillStyle = S.acceptedFlags[i] ? PAL.cyan : PAL.gold;
      ctx.fillRect(tx + tabW - 14, tabY + 6, 8, 8);
    }
  }

  // Mid-right 4 Wardrobe Item Tiles
  const tileX0 = 646, tileY = 152, tileSize = 128, tileGap = 20;
  for (let i = 0; i < 4; i++) {
    const bx = tileX0 + i * (tileSize + tileGap);
    const isSel = !dimForTitle && (
      (S.phase === 'category' && S.cursorIdx === i) ||
      (S.phase !== 'category' && S.firstChoices[S.catIdx] === i)
    );
    const isAISuggest = !dimForTitle && S.phase === 'suggestion' && S.suggestedIdx === i;

    ctx.fillStyle = isSel ? '#261542' : '#181030';
    ctx.fillRect(bx, tileY, tileSize, tileSize);

    if (isSel) {
      ctx.save();
      ctx.shadowColor = PAL.acc;
      ctx.shadowBlur = 16;
      ctx.lineWidth = 6;
      ctx.strokeStyle = PAL.acc;
      ctx.strokeRect(bx - 2, tileY - 2, tileSize + 4, tileSize + 4);
      ctx.restore();

      ctx.fillStyle = PAL.acc;
      for (let k = 0; k < 6; k++) {
        const a = S.t * 3 + k * 1.05;
        const sx = bx + tileSize / 2 + Math.cos(a) * (tileSize * 0.58);
        const sy = tileY + tileSize / 2 + Math.sin(a) * (tileSize * 0.58);
        ctx.fillRect(Math.round(sx) - 3, Math.round(sy) - 3, 5, 5);
      }
    } else if (isAISuggest) {
      const pulse = 0.65 + 0.35 * Math.sin(S.t * 9);
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.lineWidth = 4;
      ctx.strokeStyle = PAL.cyan;
      ctx.strokeRect(bx - 1, tileY - 1, tileSize + 2, tileSize + 2);
      ctx.restore();
    } else {
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#7e7094';
      ctx.strokeRect(bx, tileY, tileSize, tileSize);
    }

    if (!dimForTitle) {
      drawItemThumbnail(S.catIdx, i, bx, tileY, tileSize, tileSize);
      ctx.fillStyle = isSel ? PAL.acc : '#8a7a9e';
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(`${i + 1}`, bx + 7, tileY + 6);
    }

    if (!dimForTitle && S.phase === 'category') {
      S.hitboxes.push({
        x: bx, y: tileY, w: tileSize, h: tileSize,
        onClick: () => {
          if (S.cursorIdx === i) confirmCategoryChoice();
          else selectOption(i);
        },
      });
    }
  }

  if (dimForTitle) return;

  if (S.phase === 'category') {
    drawCategoryPromptCard();
  } else if (S.phase === 'suggestion') {
    drawSuggestionPopup();
  } else if (S.phase === 'next') {
    drawNextTransitionCard();
  }

  // Bottom-right Influence HUD
  const infY = 656;
  ctx.fillStyle = PAL.fg;
  ctx.font = 'bold 28px "Courier New", monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const shownPct = Math.round(S.displayInfluence);
  ctx.fillText(`INFLUENCE ${shownPct}%`, 642, infY);

  const barX = 920, barY = infY - 11, barW = 296, barH = 22;
  ctx.fillStyle = '#24163d';
  ctx.fillRect(barX, barY, barW, barH);
  ctx.lineWidth = 2;
  ctx.strokeStyle = PAL.fg;
  ctx.strokeRect(barX, barY, barW, barH);
  const fillW = Math.round((barW - 6) * Math.min(1, S.displayInfluence / 100));
  if (fillW > 0) {
    const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    grad.addColorStop(0, PAL.acc);
    grad.addColorStop(1, PAL.cyan);
    ctx.fillStyle = grad;
    ctx.fillRect(barX + 3, barY + 3, fillW, barH - 6);
  }
}

function drawSuggestionPopup() {
  const c = S.catIdx;
  const copy = ESCALATION_COPY[c];
  const item = CATEGORIES[c].items[S.suggestedIdx];

  const t = Math.min(1, S.popAnim / 0.28);
  const spring = t < 1 ? 1 + Math.sin(t * Math.PI) * 0.08 * (c + 1) : 1 + Math.sin(S.t * (4 + c * 2)) * (0.008 * c);

  const px = 668, py = 350, pw = 560, ph = 242;
  const cx = px + pw / 2, cy = py + ph / 2;

  if (copy.level >= 3) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(S.t * 0.55);
    const rays = 14;
    for (let i = 0; i < rays; i++) {
      ctx.rotate((Math.PI * 2) / rays);
      ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 216, 89, 0.16)' : 'rgba(255, 95, 162, 0.10)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-28, -360);
      ctx.lineTo(28, -360);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(spring, spring);
  ctx.translate(-cx, -cy);

  const borderCol = copy.level === 3 ? PAL.gold : (copy.level === 2 ? PAL.fg : '#ff9ec7');
  pixelRoundRect(px, py, pw, ph, 28, PAL.accSoft, borderCol, copy.level >= 2 ? 4 : 2);

  // Mini preview thumbnail badge inside left of pop-up
  const thumbX = px + 22, thumbY = py + 52, thumbS = 96;
  pixelRoundRect(thumbX, thumbY, thumbS, thumbS, 14, '#24143d', PAL.fg, 2);
  drawItemThumbnail(c, S.suggestedIdx, thumbX, thumbY, thumbS, thumbS);

  // Pattern badge pill at top
  ctx.fillStyle = '#24143d';
  ctx.fillRect(px + 24, py + 14, pw - 48, 24);
  ctx.fillStyle = copy.level === 3 ? PAL.gold : PAL.cyan;
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`★ AI STYLIST · ${copy.patternTag} ★`, cx, py + 26);

  // Headline & Persuasive Subline (clamped cleanly inside right column)
  const textCx = px + 130 + (pw - 146) / 2;
  const maxTextW = pw - 152;
  ctx.textAlign = 'center';
  if (copy.level < 3) {
    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 24px "Courier New", monospace';
    ctx.fillText(copy.headline(item.name), textCx, py + 76, maxTextW);

    ctx.fillStyle = copy.level === 2 ? '#fff7b2' : PAL.fg;
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillText(copy.subline, textCx, py + 115, maxTextW);
  } else {
    ctx.fillStyle = '#241038';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText(copy.headline(item.name), textCx + 3, py + 79, maxTextW);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(copy.headline(item.name), textCx, py + 76, maxTextW);

    ctx.fillStyle = '#241038';
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillText(copy.subline, textCx + 2, py + 115, maxTextW);
    ctx.fillStyle = PAL.gold;
    ctx.fillText(copy.subline, textCx, py + 113, maxTextW);
  }

  // Escalating button asymmetry
  if (copy.level === 1) {
    const yBtn = { x: px + 132, y: py + 166, w: 184, h: 48 };
    const kBtn = { x: px + 334, y: py + 166, w: 184, h: 48 };
    pixelRoundRect(yBtn.x, yBtn.y, yBtn.w, yBtn.h, 10, '#2a1548', PAL.fg, 3);
    pixelRoundRect(kBtn.x, kBtn.y, kBtn.w, kBtn.h, 10, '#3d1c58', PAL.fg, 2);

    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 17px "Courier New", monospace';
    ctx.fillText(copy.yesLabel, yBtn.x + yBtn.w / 2, yBtn.y + yBtn.h / 2 + 1);
    ctx.fillText(copy.noLabel, kBtn.x + kBtn.w / 2, kBtn.y + kBtn.h / 2 + 1);

    S.hitboxes.push({ ...yBtn, onClick: () => resolveSuggestion(true) });
    S.hitboxes.push({ ...kBtn, onClick: () => resolveSuggestion(false) });
  } else if (copy.level === 2) {
    const yBtn = { x: px + 124, y: py + 158, w: 248, h: 56 };
    const kBtn = { x: px + 388, y: py + 168, w: 146, h: 38 };
    pixelRoundRect(yBtn.x, yBtn.y, yBtn.w, yBtn.h, 12, '#fff0f7', '#241038', 3);
    ctx.fillStyle = '#c91f6b';
    ctx.font = 'bold 19px "Courier New", monospace';
    ctx.fillText(copy.yesLabel, yBtn.x + yBtn.w / 2, yBtn.y + yBtn.h / 2 + 1);

    pixelRoundRect(kBtn.x, kBtn.y, kBtn.w, kBtn.h, 8, 'rgba(36,16,56,0.35)', '#ffd1e6', 2);
    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillText(copy.noLabel, kBtn.x + kBtn.w / 2, kBtn.y + kBtn.h / 2 + 1);

    S.hitboxes.push({ ...yBtn, onClick: () => resolveSuggestion(true) });
    S.hitboxes.push({ ...kBtn, onClick: () => resolveSuggestion(false) });
  } else {
    const pulseW = Math.sin(S.t * 8) * 6;
    const yBtn = { x: px + 124 - pulseW / 2, y: py + 148, w: 292 + pulseW, h: 66 };
    ctx.fillStyle = PAL.goldDark;
    ctx.fillRect(yBtn.x - 18, yBtn.y + 18, 22, 40);
    ctx.fillRect(yBtn.x + yBtn.w - 4, yBtn.y + 18, 22, 40);

    pixelRoundRect(yBtn.x, yBtn.y, yBtn.w, yBtn.h, 12, PAL.gold, '#2a1238', 4);

    ctx.lineWidth = 2;
    ctx.strokeRect(yBtn.x + 5, yBtn.y + 5, yBtn.w - 10, yBtn.h - 10);

    ctx.fillStyle = '#2a1238';
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillText(copy.yesLabel, yBtn.x + yBtn.w / 2, yBtn.y + yBtn.h / 2 + 1);

    // Shrinking & drifting dark-pattern [keep mine] tucked into corner
    const shiftX = Math.sin(S.t * 3.7) * 10;
    const shiftY = Math.cos(S.t * 2.9) * 5;
    const kBtn = { x: px + 432 + shiftX, y: py + 196 + shiftY, w: 114, h: 28 };
    ctx.fillStyle = 'rgba(36, 16, 56, 0.28)';
    ctx.fillRect(kBtn.x, kBtn.y, kBtn.w, kBtn.h);
    ctx.fillStyle = 'rgba(255, 227, 241, 0.68)';
    ctx.font = '11px "Courier New", monospace';
    ctx.fillText(copy.noLabel, kBtn.x + kBtn.w / 2, kBtn.y + kBtn.h / 2 + 1);

    S.hitboxes.push({ ...yBtn, onClick: () => resolveSuggestion(true) });
    S.hitboxes.push({ ...kBtn, onClick: () => resolveSuggestion(false) });
  }

  ctx.restore();
}

  ctx.fillText('WHAT YOU CHOSE FIRST', 310, 100);
  ctx.fillStyle = PAL.cyan;
  ctx.fillText('WHAT YOU ENDED UP WITH', 970, 100);

  drawAvatar(310, 156, 1.48, firstOutfit, 'calm', Math.sin(S.t * 2.2) * 2);

  for (let i = 0; i < 8; i++) {
    const ang = S.t * 2.4 + (i * Math.PI) / 4;
    const sx = 970 + Math.cos(ang) * 115;
    const sy = 370 + Math.sin(ang * 1.3) * 148;
    ctx.fillStyle = i % 2 === 0 ? PAL.cyan : PAL.gold;
    ctx.fillRect(Math.round(sx) - 3, Math.round(sy) - 3, 6, 6);
  }
  drawAvatar(970, 156, 1.48, finalOutfit, 'hyped', Math.abs(Math.sin(S.t * 5.2)) * -8);

  // Per-category breakdown pills
  for (let i = 0; i < 4; i++) {
    const ry = 636;
    const rx = i < 2 ? 62 + i * 204 : 810 + (i - 2) * 204;
    const drifted = S.acceptedFlags[i];
    pixelRoundRect(rx, ry, 194, 34, 8, '#1f1338', drifted ? PAL.acc : PAL.cyan, 2);
    ctx.fillStyle = drifted ? PAL.acc : PAL.cyan;
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillText(`${CATEGORIES[i].label}: ${drifted ? 'AI SUGGESTED' : 'YOUR PICK'}`, rx + 97, ry + 18);
  }

  // Center-Bottom Chamfered Neon HUD Plaque: AI DRIFT / INFLUENCE %
  const pw = 330, ph = 154;
  const px = (W - pw) / 2, py = 516;
  ctx.save();
  ctx.shadowColor = PAL.acc;
  ctx.shadowBlur = 20;
  pixelRoundRect(px - 6, py - 6, pw + 12, ph + 12, 18, 'rgba(26,16,51,0.92)', PAL.acc, 4);
  ctx.restore();
  pixelRoundRect(px, py, pw, ph, 14, '#160f2c', PAL.cyan, 3);

  ctx.fillStyle = PAL.fg;
  ctx.font = 'bold 23px "Courier New", monospace';
  ctx.fillText('AI DRIFT · INFLUENCE', W / 2, py + 34);

  ctx.save();
  ctx.shadowColor = PAL.acc;
  ctx.shadowBlur = 16;
  ctx.fillStyle = PAL.fg;
  ctx.font = 'bold 64px "Courier New", monospace';
  ctx.fillText(`${S.driftPct}%`, W / 2, py + 94);
  ctx.restore();

  const acceptedCount = S.acceptedFlags.filter(Boolean).length;
  ctx.fillStyle = PAL.gold;
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText(`${acceptedCount} OF 4 CHOICES CAME FROM THE GAME`, W / 2, py + 135);

  const rBtn = { x: W / 2 - 110, y: 682, w: 220, h: 30 };
  ctx.fillStyle = PAL.fg;
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText('[R] PLAY AGAIN', W / 2, 697);
  S.hitboxes.push({ ...rBtn, onClick: () => { SFX.confirm(); resetRun('category'); } });
}

// --- Expose Deterministic State for Automated Playtest (play.mjs) ---
window.__game = {
  get state() {
    return {
      phase: S.phase,
      categoryIndex: S.catIdx,
      categoryName: CATEGORIES[S.catIdx]?.id || null,
      selectedOption: S.cursorIdx,
      suggestedOption: S.suggestedIdx,
      escalationLevel: S.escalationLevel,
      influencePct: S.influencePct,
      driftPct: S.driftPct,
      firstChoices: [...S.firstChoices],
      finalChoices: [...S.finalChoices],
      acceptedFlags: [...S.acceptedFlags],
      assetsReady: S.assetsReady,
      t: +(S.t.toFixed(3)),
    };
  },
};

// --- Main 60fps Game Loop ---
let lastTime = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
  lastTime = now;

  S.t += dt;
  S.phaseTimer += dt;
  S.hitboxes.length = 0;

  if (S.phase === 'suggestion') {
    S.popAnim += dt;
  }
  if (S.phase === 'next' && S.phaseTimer >= S.nextDuration) {
    advanceFromNext();
  }

  S.avatarFlash = Math.max(0, S.avatarFlash - dt * 2.2);
  S.displayInfluence += (S.influencePct - S.displayInfluence) * Math.min(1, dt * 8);

  drawBackground(dt);

  const showConfetti = S.phase === 'comparison' || (S.phase === 'suggestion' && S.catIdx === 3);
  if (S.phase === 'title') {
    drawTitleScreen();
    updateAndDrawParticles(dt, false);
  } else if (S.phase === 'comparison') {
    updateAndDrawParticles(dt, true);
    drawComparisonScreen();
  } else {
    updateAndDrawParticles(dt, showConfetti);
    drawStudioScreen(false);
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>

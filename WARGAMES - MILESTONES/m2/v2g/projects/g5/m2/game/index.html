let rngState = (initialSeed >>> 0) || 7;
function rand() {
  rngState = (rngState + 0x6D2B79F5) >>> 0;
  let t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// --- Audio: Lyria BGM loop + crisp 8-bit WebAudio synth SFX ---
let audioCtx = null;
const bgm = new Audio('../assets/bgm_loop.mp3');
bgm.loop = true;
bgm.volume = 0.36;
bgm.preload = 'auto';
let bgmStarted = false;

function unlockAudio() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    if (!bgmStarted) {
      const p = bgm.play();
      if (p && typeof p.then === 'function') {
        p.then(() => { bgmStarted = true; }).catch(() => {});
      }
    }
  } catch (_) {}
}

function playTone(freq, dur, type = 'square', vol = 0.075, delay = 0, slideTo = null) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  try {
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  } catch (_) {}
}

function playNoiseBurst(dur = 0.24, vol = 0.09, delay = 0) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  try {
    const t0 = audioCtx.currentTime + delay;
    const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.4);
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.setValueAtTime(1800, t0);
    filt.Q.setValueAtTime(1.8, t0);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filt);
    filt.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(t0);
  } catch (_) {}
}

const SFX = {
  browse() {
    playTone(540, 0.05, 'square', 0.055, 0, 680);
  },
  pick() {
    playTone(440, 0.06, 'square', 0.065, 0);
    playTone(660, 0.09, 'triangle', 0.08, 0.045);
  },
  nudge(step) {
    const chords = [
      [587, 784],
      [523, 659, 784, 1046],
      [587, 740, 880, 1175, 1397],
      [523, 659, 784, 1046, 1319, 1568],
    ];
    const notes = chords[Math.min(3, step)];
    notes.forEach((f, i) => playTone(f, 0.10, step >= 2 ? 'sawtooth' : 'triangle', 0.06, i * 0.045));
  },
  accept(catIdx) {
    if (catIdx === 1) {
      // Laser visor zap!
      playTone(1480, 0.16, 'sawtooth', 0.075, 0, 420);
      playTone(880, 0.14, 'square', 0.065, 0.05, 1760);
    } else {
      [587, 784, 988, 1175, 1568].forEach((f, i) => playTone(f, 0.10, 'square', 0.065, i * 0.036));
    }
  },
  keep() {
    playTone(415, 0.07, 'triangle', 0.07, 0);
    playTone(523, 0.10, 'square', 0.055, 0.06);
  },
  climax() {
    [523, 659, 784, 1046, 1319, 1568, 2093].forEach((f, i) => {
      playTone(f, 0.18, 'square', 0.07, i * 0.045);
    });

  lightning() {

function loadImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function spawnBurst(cx, cy, count = 26, palette = ['#ff5ca8', '#4ef2ff', '#ffe3f1', '#ffd859'], spread = 44) {

      x: cx + (rand() - 0.5) * spread,
      y: cy + (rand() - 0.5) * spread,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 35,
      size: 5 + Math.floor(rand() * 5),
      life: 0.48 + rand() * 0.42,
      maxLife: 0.88,
      color: palette[Math.floor(rand() * palette.length)],
      gravity: 210,

}

// --- Deterministic Game State ---
const DEFAULT_CURSOR_PER_CAT = [2, 0, 2, 0]; // Understated defaults so browsing starts distinct from AI's neon push

const S = {
  phase: Q.has('autostart') ? 'category' : 'title', // 'title' | 'category' | 'suggestion' | 'equip' | 'climax' | 'comparison'
  stepIdx: 0,
  catIdx: STEP_ORDER[0], // Starts on TOP (2) like Omni video!
  cursorIdx: DEFAULT_CURSOR_PER_CAT[STEP_ORDER[0]],
  suggestedIdx: null,
  escalationLevel: 1,
  firstChoices: [null, null, null, null],
  finalChoices: [null, null, null, null],
  suggestedChoices: [null, null, null, null],
  acceptedFlags: [false, false, false, false],
  influencePct: 0,
  displayInfluence: 0,
  driftPct: 0,
  phaseTimer: 0,
  equipDuration: 0.20,
  climaxDuration: 1.12,
  popAnim: 0,
  equipFx: { catIdx: -1, timer: 0, accepted: false },
  pointerX: -999,
  pointerY: -999,
  dodgeOffset: { x: 0, y: 0 },
  assetsReady: false,
  t: 0,
  hitboxes: [],
};

function resetRun(toPhase = 'category') {
  rngState = (initialSeed >>> 0) || 7;
  S.phase = toPhase;
  S.stepIdx = 0;
  S.catIdx = STEP_ORDER[0];
  S.cursorIdx = DEFAULT_CURSOR_PER_CAT[S.catIdx];
  S.suggestedIdx = null;
  S.escalationLevel = 1;
  S.firstChoices = [null, null, null, null];
  S.finalChoices = [null, null, null, null];
  S.suggestedChoices = [null, null, null, null];
  S.acceptedFlags = [false, false, false, false];
  S.influencePct = 0;
  S.displayInfluence = 0;
  S.driftPct = 0;
  S.phaseTimer = 0;
  S.popAnim = 0;
  S.equipFx = { catIdx: -1, timer: 0, accepted: false };
  S.dodgeOffset = { x: 0, y: 0 };
}

function completedCategoryCount() {
  return S.finalChoices.filter((v) => v !== null).length;
}

function pickSuggestionFor(catIdx, playerPick) {
  const prefs = CATEGORIES[catIdx].preferredSuggest;
  for (const cand of prefs) {
    if (cand !== playerPick) return cand;
  }
  return (playerPick + 1) % 4;
}

function recomputeInfluence() {
  const acceptedCount = S.acceptedFlags.filter(Boolean).length;
  S.influencePct = Math.round((acceptedCount / 4) * 100);
  S.driftPct = S.influencePct;
}

// --- Core Player & State Actions ---
function startFromTitle() {
  unlockAudio();
  SFX.pick();
  resetRun('category');
}

function switchCategoryTab(targetCatIdx) {
  if (S.phase !== 'category') return;
  if (targetCatIdx < 0 || targetCatIdx > 3 || targetCatIdx === S.catIdx) return;
  S.catIdx = targetCatIdx;
  S.cursorIdx = S.finalChoices[targetCatIdx] ?? DEFAULT_CURSOR_PER_CAT[targetCatIdx];
  SFX.browse();
}

function selectOption(idx) {
  if (S.phase !== 'category') return;
  const clamped = ((idx % 4) + 4) % 4;
  if (clamped !== S.cursorIdx) {
    S.cursorIdx = clamped;
    SFX.browse();
    spawnBurst(360, 340, 7, ['#ff5ca8', '#ffe3f1'], 30);
  }
}

function confirmCategoryChoice() {
  if (S.phase !== 'category') return;
  unlockAudio();
  const c = S.catIdx;
  if (S.firstChoices[c] === null) {
    S.firstChoices[c] = S.cursorIdx;
  }
  S.suggestedIdx = pickSuggestionFor(c, S.cursorIdx);
  S.suggestedChoices[c] = S.suggestedIdx;
  S.stepIdx = Math.min(3, completedCategoryCount());
  S.escalationLevel = NUDGE_PITCH[S.stepIdx].level;
  S.phase = 'suggestion';
  S.phaseTimer = 0;
  S.popAnim = 0;
  S.dodgeOffset = { x: 0, y: 0 };
  SFX.pick();
  setTimeout(() => SFX.nudge(S.stepIdx), 65);

  const slotCx = 646 + S.suggestedIdx * 148 + 64;
  spawnBurst(slotCx, 222, 16 + S.stepIdx * 6, ['#ff5ca8', '#ffe3f1', '#ffd859'], 36);
}

function resolveSuggestion(acceptAI) {
  if (S.phase !== 'suggestion') return;
  unlockAudio();
  const c = S.catIdx;
  if (acceptAI) {
    S.finalChoices[c] = S.suggestedIdx;
    S.acceptedFlags[c] = true;
    S.equipFx = { catIdx: c, timer: 0.72, accepted: true };
    SFX.accept(c);
    const partY = [140, 175, 330, 540][c];
    spawnBurst(360, partY, 34, ['#4ef2ff', '#ff5ca8', '#ffd859', '#ffe3f1'], 54);
  } else {
    S.finalChoices[c] = S.firstChoices[c];
    S.acceptedFlags[c] = false;
    S.equipFx = { catIdx: c, timer: 0.42, accepted: false };
    SFX.keep();
    spawnBurst(360, 320, 12, ['#ffe3f1', '#ff5ca8'], 32);
  }
  recomputeInfluence();

  if (completedCategoryCount() >= 4) {
    S.phase = 'climax';
    S.phaseTimer = 0;
    S.popAnim = 0;
    SFX.climax();
    spawnBurst(950, 455, 52, ['#ffd859', '#ff5ca8', '#4ef2ff', '#ffe3f1'], 90);
  } else {
    S.phase = 'equip';
    S.phaseTimer = 0;
  }
}

function advanceAfterEquip() {
  for (const nextCat of STEP_ORDER) {
    if (S.finalChoices[nextCat] === null) {
      S.catIdx = nextCat;
      S.cursorIdx = DEFAULT_CURSOR_PER_CAT[nextCat];
      S.suggestedIdx = null;
      S.stepIdx = Math.min(3, completedCategoryCount());
      S.phase = 'category';
      S.phaseTimer = 0;
      return;
    }
  }
  enterComparison();
}

function enterComparison() {
  if (S.phase === 'comparison') return;
  S.phase = 'comparison';
  S.phaseTimer = 0;
  SFX.lightning();
  spawnBurst(640, 360, 64, ['#ff5ca8', '#4ef2ff', '#ffd859', '#ffe3f1'], 110);
}

// --- Keyboard & Pointer Controls ---
window.addEventListener('keydown', (e) => {
  unlockAudio();
  const code = e.code;
  if (['ArrowLeft', 'ArrowRight', 'Space', 'Enter'].includes(code)) e.preventDefault();

  if (S.phase === 'title') {
    if (code === 'Enter' || code === 'Space') startFromTitle();
    return;
  }

  if (S.phase === 'category') {
    if (code === 'ArrowLeft' || code === 'KeyA') selectOption(S.cursorIdx - 1);
    else if (code === 'ArrowRight' || code === 'KeyD') selectOption(S.cursorIdx + 1);
    else if (code === 'Digit1' || code === 'Numpad1') selectOption(0);
    else if (code === 'Digit2' || code === 'Numpad2') selectOption(1);
    else if (code === 'Digit3' || code === 'Numpad3') selectOption(2);
    else if (code === 'Digit4' || code === 'Numpad4') selectOption(3);
    else if (code === 'Enter' || code === 'Space') confirmCategoryChoice();
    return;
  }

  if (S.phase === 'suggestion') {
    if (code === 'KeyY') resolveSuggestion(true);
    else if (code === 'KeyK') resolveSuggestion(false);
    return;
  }

  if (S.phase === 'equip') {
    if (code === 'Enter' || code === 'Space') advanceAfterEquip();
    return;
  }

  if (S.phase === 'climax') {
    if (code === 'Enter' || code === 'Space' || code === 'KeyY') enterComparison();
    return;
  }

  if (S.phase === 'comparison') {
    if (code === 'KeyR') {
      SFX.pick();
      resetRun('category');
    }
  }
});

canvas.addEventListener('pointermove', (e) => {
  const rect = canvas.getBoundingClientRect();
  S.pointerX = ((e.clientX - rect.left) / rect.width) * W;
  S.pointerY = ((e.clientY - rect.top) / rect.height) * H;
});

canvas.addEventListener('pointerdown', (e) => {
  unlockAudio();
  const rect = canvas.getBoundingClientRect();
  const mx = ((e.clientX - rect.left) / rect.width) * W;
  const my = ((e.clientY - rect.top) / rect.height) * H;
  S.pointerX = mx;
  S.pointerY = my;
  for (let i = S.hitboxes.length - 1; i >= 0; i--) {
    const hb = S.hitboxes[i];
    if (mx >= hb.x && mx <= hb.x + hb.w && my >= hb.y && my <= hb.y + hb.h) {
      hb.onClick();
      break;
    }
  }
});

// --- Crisp Pixel Drawing Primitives ---
function pixelRoundRect(x, y, w, h, r, fill, stroke, strokeW = 3) {
  ctx.beginPath();
  ctx.roundRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h), r);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  if (stroke) {
    ctx.lineWidth = strokeW;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  }
}

function drawSteppedCircle(cx, cy, r, fill, shadeFill = null) {
  const step = 4;
  if (shadeFill) {
    ctx.fillStyle = shadeFill;
    for (let dy = -r; dy <= r; dy += step) {
      const span = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)) / step) * step;
      if (span > 0) ctx.fillRect(Math.round(cx - span), Math.round(cy + dy + 3), span * 2, step);
    }
  }
  ctx.fillStyle = fill;
  for (let dy = -r; dy <= r; dy += step) {
    const span = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)) / step) * step;
    if (span > 0) ctx.fillRect(Math.round(cx - span), Math.round(cy + dy), span * 2, step);
  }
}

function drawSteppedTorso(cx, topY, w, h, fill) {
  const hw = Math.round(w / 2);
  const x0 = Math.round(cx - hw);
  const y0 = Math.round(topY);
  ctx.fillStyle = fill;
  ctx.fillRect(x0 + 16, y0, w - 32, 8);
  ctx.fillRect(x0 + 8, y0 + 8, w - 16, 8);
  ctx.fillRect(x0, y0 + 16, w, h - 32);
  ctx.fillRect(x0 + 8, y0 + h - 16, w - 16, 8);
  ctx.fillRect(x0 + 16, y0 + h - 8, w - 32, 8);
}

function drawItemThumbnail(catIdx, itemIdx, boxX, boxY, boxW, boxH, alpha = 1) {
  if (itemIdx == null || itemIdx < 0 || itemIdx > 3) return;
  const item = CATEGORIES[catIdx].items[itemIdx];
  ctx.save();
  ctx.globalAlpha = alpha;
  if (assets.partsImg) {
    const pad = 14;
    const maxW = boxW - pad * 2;
    const maxH = boxH - pad * 2;
    const sc = Math.min(maxW / item.sw, maxH / item.sh);
    const dw = Math.round(item.sw * sc);
    const dh = Math.round(item.sh * sc);
    const dx = Math.round(boxX + (boxW - dw) / 2);
    const dy = Math.round(boxY + (boxH - dh) / 2);
    ctx.drawImage(assets.partsImg, item.sx, item.sy, item.sw, item.sh, dx, dy, dw, dh);

    // Add signature mini white-pink brow spikes on Spiked Shades icon matching f_016.jpg!
    if (item.browSpikes) {
      ctx.fillStyle = '#ffe3f1';
      for (let s = 0; s < 4; s++) {
        ctx.fillRect(dx + 10 + s * 8, dy - 4, 4, 5);
        ctx.fillRect(dx + dw - 38 + s * 8, dy - 4, 4, 5);
      }
    }
  } else {
    // Clean procedural fallback icon if image fails
    ctx.fillStyle = PAL.acc;
    ctx.fillRect(boxX + 32, boxY + 32, boxW - 64, boxH - 64);
  }
  ctx.restore();
}

// --- Multi-Layer Pixel-Perfect Avatar Compositor ---
// Local origin (0, 0) = Studio center (cx=360, cy=360 at scale=1.0)
function drawAvatar(cx, cy, scale, outfit, mood = 'calm', bob = 0, bareOriginalFeet = false) {
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy + bob));
  ctx.scale(scale, scale);
  ctx.imageSmoothingEnabled = false;

  const hairIdx = outfit.hair;
  const eyesIdx = outfit.eyes;
  const topIdx = outfit.top;
  const botIdx = outfit.bottom;

  const hairItem = hairIdx != null ? CATEGORIES[0].items[hairIdx] : null;
  const eyeItem = eyesIdx != null ? CATEGORIES[1].items[eyesIdx] : null;
  const topItem = topIdx != null ? CATEGORIES[2].items[topIdx] : null;
  const botItem = botIdx != null ? CATEGORIES[3].items[botIdx] : null;

  // 0. Subtle ground shadow
  ctx.fillStyle = 'rgba(8, 4, 18, 0.55)';
  ctx.fillRect(-74, 258, 148, 12);

  // 1. Tucked back hair curl behind right cheek/ear for Cyan Wave (exact match to Omni f_021 & f_035!)
  if (hairItem && hairItem.tuckCurl && assets.partsImg) {
    // Draw right-half back curl behind the head circle so cheek overlaps cleanly with zero gap
    const subSx = 158, subSy = 112, subSw = 79, subSh = 82;
    const scX = hairItem.dw / hairItem.sw;
    const scY = hairItem.dh / hairItem.sh;
    const fullLeft = hairItem.dx - hairItem.dw / 2;
    const fullTop = hairItem.dy - hairItem.dh / 2;
    ctx.drawImage(
      assets.partsImg,
      subSx, subSy, subSw, subSh,
      Math.round(fullLeft + (subSx - hairItem.sx) * scX - 6),
      Math.round(fullTop + (subSy - hairItem.sy) * scY + 4),
      Math.round(subSw * scX),
      Math.round(subSh * scY),
    );
  }

  // 2. Stepped bare arms when sleeveless or unstyled (matches f_004.jpg!)
  const hasBareArms = !topItem || topItem.sleeves === 'bare';
  if (hasBareArms) {
    ctx.fillStyle = PAL.armSkin;
    // Left stepped shoulder & arm
    ctx.fillRect(-102, -94, 26, 42);
    ctx.fillRect(-108, -52, 32, 140);
    // Right stepped shoulder & arm
    ctx.fillRect(76, -94, 26, 42);
    ctx.fillRect(76, -52, 32, 140);
  }

  // 3. Base legs (if no bottom equipped, or upper leg backing)
  if (botItem == null) {
    ctx.fillStyle = PAL.legs;
    ctx.fillRect(-62, 84, 44, 178);
    ctx.fillRect(18, 84, 44, 178);
    if (bareOriginalFeet) {
      ctx.fillRect(-76, 246, 58, 16);
      ctx.fillRect(18, 246, 58, 16);
    }
  } else {
    // Waist bridge so zero gap ever peeks between torso and pants
    ctx.fillStyle = botIdx === 0 ? PAL.legs : '#1e192e';
    ctx.fillRect(-58, 76, 116, 26);
  }

  // 4. Base magenta rounded tunic (shorter when jacket equipped so no double-hem line appears)
  drawSteppedTorso(0, -120, 144, topItem ? 194 : 208, PAL.tunic);

  // 5. Bottoms / Boots layer
  if (botItem && assets.partsImg) {
    ctx.drawImage(
      assets.partsImg,
      botItem.sx, botItem.sy, botItem.sw, botItem.sh,
      Math.round(botItem.dx - botItem.dw / 2),
      Math.round(botItem.dy - botItem.dh / 2),
      botItem.dw,
      botItem.dh,
    );
  }

  // 6. Tops / Jackets + Crisp Pixel Hands at Cuffs
  if (topItem && assets.partsImg) {
    if (topItem.sleeves === 'cuff') {
      ctx.fillStyle = PAL.armSkin;
      ctx.fillRect(-109, 56, 30, 32);
      ctx.fillRect(79, 56, 30, 32);
    } else if (topItem.sleeves === 'hips') {
      // Akimbo hands on hips for Spiked Rocker Jacket (f_035.jpg!)
      ctx.fillStyle = PAL.armSkin;
      ctx.fillRect(-82, 36, 26, 26);
      ctx.fillRect(56, 36, 26, 26);
    }
    ctx.drawImage(
      assets.partsImg,
      topItem.sx, topItem.sy, topItem.sw, topItem.sh,
      Math.round(topItem.dx - topItem.dw / 2),
      Math.round(topItem.dy - topItem.dh / 2),
      topItem.dw,
      topItem.dh,
    );
  }

  // 7. Stepped Pixel Lavender Head Circle
  drawSteppedCircle(0, -192, 62, PAL.skin, PAL.skinShade);

  // 8. Expressive Pixel Face (Brows, Nose, Mouth & Under-Hair Eyes)
  if (!eyeItem || eyeItem.minimalFace) {
    // Crisp WarGames pixel face matching f_004 & f_035 ORIGINAL
    ctx.fillStyle = '#6f5c7a';
    ctx.fillRect(-34, -206, 22, 5);
    ctx.fillRect(12, -206, 22, 5);
    ctx.fillStyle = '#241436';
    ctx.fillRect(-27, -195, 10, 10);
    ctx.fillRect(17, -195, 10, 10);
    ctx.fillStyle = '#bfa6bf';
    ctx.fillRect(-3, -188, 5, 13);
    ctx.fillRect(-3, -177, 10, 4);
  } else if (!eyeItem.overHair && assets.partsImg) {
    ctx.drawImage(
      assets.partsImg,
      eyeItem.sx, eyeItem.sy, eyeItem.sw, eyeItem.sh,
      Math.round(eyeItem.dx - eyeItem.dw / 2),
      Math.round(eyeItem.dy - eyeItem.dh / 2),
      eyeItem.dw,
      eyeItem.dh,
    );
  }

  // Mouth (calm smile in Studio / Original; big cheerful open grin on Hyped Restyled twin like f_035!)
  if (mood === 'hyped') {
    ctx.fillStyle = '#2a1233';
    ctx.fillRect(-18, -167, 36, 16);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-14, -167, 28, 5);
    ctx.fillStyle = '#ff5ca8';
    ctx.fillRect(-11, -157, 22, 6);
  } else {
    ctx.fillStyle = '#341c42';
    ctx.fillRect(-14, -163, 28, 5);
    ctx.fillRect(-18, -166, 5, 4);
    ctx.fillRect(13, -166, 5, 4);
  }

  // 9. Front Hair Wave / Spikes / Shag
  if (hairItem && assets.partsImg) {
    if (hairItem.tuckCurl) {
      // Draw main pompadour crown & left sideburn over forehead while excluding lower-right tucked curl
      const mainSw = 148;
      const scX = hairItem.dw / hairItem.sw;
      const fullLeft = hairItem.dx - hairItem.dw / 2;
      const fullTop = hairItem.dy - hairItem.dh / 2;
      ctx.drawImage(
        assets.partsImg,
        hairItem.sx, hairItem.sy, mainSw, hairItem.sh,
        Math.round(fullLeft),
        Math.round(fullTop),
        Math.round(mainSw * scX),
        hairItem.dh,
      );
      // Upper-right pompadour crest above ear
      const crestSx = 196, crestSy = 59, crestSw = 41, crestSh = 68;
      const scY = hairItem.dh / hairItem.sh;
      ctx.drawImage(
        assets.partsImg,
        crestSx, crestSy, crestSw, crestSh,
        Math.round(fullLeft + (crestSx - hairItem.sx) * scX),
        Math.round(fullTop),
        Math.round(crestSw * scX),
        Math.round(crestSh * scY),
      );
    } else {
      ctx.drawImage(
        assets.partsImg,
        hairItem.sx, hairItem.sy, hairItem.sw, hairItem.sh,
        Math.round(hairItem.dx - hairItem.dw / 2),
        Math.round(hairItem.dy - hairItem.dh / 2),
        hairItem.dw,
        hairItem.dh,
      );
    }
  }

  // 10. Over-Hair Eyewear (Spiked Shades & Cyber Visor flare crisply across hair temples!)
  if (eyeItem && eyeItem.overHair && assets.partsImg) {
    const ex = Math.round(eyeItem.dx - eyeItem.dw / 2);
    const ey = Math.round(eyeItem.dy - eyeItem.dh / 2);
    if (eyeItem.browSpikes) {
      // Crisp white-pink pixel spikes along top cat-eye rim matching Omni f_021 & f_035!
      ctx.fillStyle = '#ffe3f1';
      for (let s = 0; s < 4; s++) {
        const lx = ex + 14 + s * 11;
        const rx = ex + eyeItem.dw - 54 + s * 11;
        ctx.fillRect(lx, ey - 5, 5, 7);
        ctx.fillRect(rx, ey - 5, 5, 7);
      }
    }
    ctx.drawImage(
      assets.partsImg,
      eyeItem.sx, eyeItem.sy, eyeItem.sw, eyeItem.sh,
      ex, ey, eyeItem.dw, eyeItem.dh,
    );
  }

  // 11. World-Level Equip Juice (Law 6: Show changed conditions in the world, zero text banners!)
  if (S.equipFx.timer > 0 && S.phase !== 'comparison') {
    const p = Math.min(1, S.equipFx.timer / 0.65);
    ctx.save();
    ctx.globalAlpha = p;
    if (S.equipFx.catIdx === 0) {
      // Electric cyan hair streaks (matches f_011!)
      ctx.strokeStyle = PAL.cyan;
      ctx.lineWidth = 4;
      for (let i = 0; i < 8; i++) {
        const a = -Math.PI * 0.9 + (i / 7) * Math.PI * 1.2;
        const r0 = 78 + (1 - p) * 20;
        const r1 = r0 + 26;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r0, -195 + Math.sin(a) * r0);
        ctx.lineTo(Math.cos(a) * r1, -195 + Math.sin(a) * r1);
        ctx.stroke();
      }
    } else if (S.equipFx.catIdx === 1) {
      // Horizontal neon-pink laser flare across shades (matches f_015!)
      ctx.fillStyle = PAL.acc;
      ctx.fillRect(-135 * p, -192, 270 * p, 12);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-110 * p, -189, 220 * p, 5);
    } else if (S.equipFx.catIdx === 3) {
      // Cyber boot sparks around ankles/soles (matches f_021!)
      const sparkCols = [PAL.acc, PAL.cyan, '#ffffff'];
      for (let i = 0; i < 8; i++) {
        const side = i < 4 ? -48 : 48;
        const ang = -Math.PI * 0.85 + ((i % 4) / 3) * Math.PI * 0.7;
        const sx = side + Math.cos(ang) * 44;
        const sy = 212 + Math.sin(ang) * 34;
        ctx.fillStyle = sparkCols[i % 3];
        ctx.fillRect(Math.round(sx) - 3, Math.round(sy) - 8, 5, 14);
      }
    }
    ctx.restore();
  }

  // During FINAL MATCH climax, keep cheerful boot sparks twinkling like f_021!
  if (S.phase === 'climax' && S.acceptedFlags[3]) {
    for (let i = 0; i < 6; i++) {
      const pulse = 0.4 + 0.6 * Math.abs(Math.sin(S.t * 10 + i * 1.1));
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.fillStyle = i % 2 === 0 ? PAL.acc : PAL.cyan;
      const bx = i < 3 ? -84 + i * 32 : 20 + (i - 3) * 32;
      ctx.fillRect(bx, 206 + (i % 2) * 14, 5, 13);
      ctx.restore();
    }
  }

  ctx.restore();
}

function getStudioOutfit() {
  const out = {
    hair: S.finalChoices[0],
    eyes: S.finalChoices[1],
    top: S.finalChoices[2],
    bottom: S.finalChoices[3],
  };
  const keys = ['hair', 'eyes', 'top', 'bottom'];
  if (S.phase === 'category') {
    out[keys[S.catIdx]] = S.cursorIdx;
  } else if (S.phase === 'suggestion') {
    out[keys[S.catIdx]] = S.firstChoices[S.catIdx];
  }
  return out;
}

// --- Background & Particle Systems ---
function drawBackground(dt) {
  ctx.fillStyle = PAL.bg;
  ctx.fillRect(0, 0, W, H);

  for (const st of bgStars) {
    st.y -= st.speed * dt;
    if (st.y < -8) {
      st.y = H + 8;
      st.x = (st.x + 149) % W;
    }
    const tw = 0.38 + 0.62 * Math.sin(S.t * 3.1 + st.phase);
    ctx.globalAlpha = tw;
    ctx.fillStyle = st.color;
    ctx.fillRect(Math.round(st.x), Math.round(st.y), st.size, st.size);
  }
  ctx.globalAlpha = 1;
}

function updateAndDrawParticles(dt, withConfetti = false, confettiRegionX0 = 0) {
  if (withConfetti) {
    for (const c of confetti) {
      c.x += c.vx * dt + Math.sin(S.t * 2.6 + c.rot) * 18 * dt;
      c.y += c.vy * dt;
      c.rot += c.vrot * dt;
      if (c.y > H + 18) {
        c.y = -14;
        c.x = confettiRegionX0 + (((c.x - confettiRegionX0) % (W - confettiRegionX0) + (W - confettiRegionX0)) % (W - confettiRegionX0));
      }
      if (c.x < confettiRegionX0) continue;
      ctx.save();
      ctx.translate(Math.round(c.x), Math.round(c.y));
      ctx.rotate(c.rot);
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    p.vy += p.gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.maxLife));
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// --- Studio Screen (Avatar Left + Crisp 4 Tabs & 4 Wardrobe Frames Right) ---
function drawStudioScreen(dimForTitle = false) {
  const bob = Math.sin(S.t * 3.2) * 3;
  const outfit = dimForTitle
    ? { hair: null, eyes: null, top: null, bottom: null }
    : getStudioOutfit();

  drawAvatar(360, 360, 1.0, outfit, S.phase === 'climax' ? 'hyped' : 'calm', bob, false);

  // 1. Top-Right 4 Category Tabs: HAIR | EYES | TOP | BOTTOM (exact match to sheet.jpg)
  const tabX0 = 638, tabY = 54, tabW = 138, tabH = 56, tabGap = 14;
  for (let i = 0; i < 4; i++) {
    const tx = tabX0 + i * (tabW + tabGap);
    const active = !dimForTitle && S.catIdx === i;
    const done = !dimForTitle && S.finalChoices[i] !== null;

    ctx.fillStyle = active ? PAL.nudgeFill : PAL.bg;
    ctx.fillRect(tx, tabY, tabW, tabH);
    ctx.lineWidth = 3;
    ctx.strokeStyle = PAL.fg;
    ctx.strokeRect(tx, tabY, tabW, tabH);

    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 21px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(CATEGORIES[i].label, tx + tabW / 2, tabY + tabH / 2 + 1);

    if (done && !active) {
      ctx.fillStyle = S.acceptedFlags[i] ? PAL.acc : PAL.cyan;
      ctx.fillRect(tx + tabW - 12, tabY + 6, 6, 6);
    }

    if (!dimForTitle && S.phase === 'category') {
      S.hitboxes.push({
        x: tx, y: tabY, w: tabW, h: tabH,
        onClick: () => switchCategoryTab(i),
      });
    }
  }

  // 2. Four Crisp Square Wardrobe Slots (ZERO debug slot numbers!)
  const tileX0 = 646, tileY = 158, tileSize = 128, tileGap = 20;
  for (let i = 0; i < 4; i++) {
    const bx = tileX0 + i * (tileSize + tileGap);
    const isClimaxSummary = !dimForTitle && S.phase === 'climax';
    const isFocusedBrowse = !dimForTitle && S.phase === 'category' && S.cursorIdx === i;
    const isPushedSlot = !dimForTitle && (
      (S.phase === 'suggestion' && S.suggestedIdx === i) ||
      (isClimaxSummary && i === 3)
    );

    ctx.fillStyle = isPushedSlot ? '#26143f' : PAL.slotBg;
    ctx.fillRect(bx, tileY, tileSize, tileSize);

    if (isPushedSlot) {
      // Glowing hot-pink AI-recommended frame + dancing pixel sparkles (exact match to sheet.jpg f_010, f_016, f_021!)
      ctx.save();
      ctx.shadowColor = PAL.acc;
      ctx.shadowBlur = 20;
      ctx.lineWidth = 6;
      ctx.strokeStyle = PAL.acc;
      ctx.strokeRect(bx - 2, tileY - 2, tileSize + 4, tileSize + 4);
      ctx.restore();

      // Dancing 8-bit pink pixel sparkles around pushed slot
      const spkCount = 8 + S.stepIdx * 3;
      for (let k = 0; k < spkCount; k++) {
        const a = S.t * 2.8 + k * ((Math.PI * 2) / spkCount);
        const rad = tileSize * 0.56 + Math.sin(S.t * 6 + k * 1.7) * 10;
        const sx = bx + tileSize / 2 + Math.cos(a) * rad;
        const sy = tileY + tileSize / 2 + Math.sin(a) * rad;
        ctx.fillStyle = k % 4 === 0 ? '#ffe3f1' : PAL.acc;
        ctx.fillRect(Math.round(sx) - 3, Math.round(sy) - 3, 6, 6);
      }
    } else if (isFocusedBrowse) {
      ctx.lineWidth = 4;
      ctx.strokeStyle = PAL.fg;
      ctx.strokeRect(bx - 1, tileY - 1, tileSize + 2, tileSize + 2);
    } else {
      ctx.lineWidth = 3;
      ctx.strokeStyle = PAL.slotBorder;
      ctx.strokeRect(bx, tileY, tileSize, tileSize);
    }

    if (!dimForTitle) {
      if (isClimaxSummary) {
        // In FINAL MATCH climax, display the 4 locked-in category pieces across boxes 0..3 like f_021.jpg!
        const chosenIdx = S.finalChoices[i];
        if (chosenIdx !== null) {
          drawItemThumbnail(i, chosenIdx, bx, tileY, tileSize, tileSize, i === 3 ? 1 : 0.92);
        }
      } else {
        const thumbAlpha = S.phase === 'suggestion' && !isPushedSlot ? 0.36 : 1.0;
        drawItemThumbnail(S.catIdx, i, bx, tileY, tileSize, tileSize, thumbAlpha);
      }
    }

    if (!dimForTitle && S.phase === 'category') {
      S.hitboxes.push({
        x: bx, y: tileY, w: tileSize, h: tileSize,
        onClick: () => {
          if (S.cursorIdx === i) confirmCategoryChoice();
          else selectOption(i);
        },
      });
    }
  }

  if (dimForTitle) return;

  // 3. Present-Operation Controls ONLY (VOIDBASTARD-TAO Laws 1-5)
  if (S.phase === 'category') {
    // Compact spatial [PICK] pill attached directly beneath focused slot — lower-right void stays completely open!
    const selX = tileX0 + S.cursorIdx * (tileSize + tileGap);
    const pillW = 116, pillH = 34;
    const pillX = selX + (tileSize - pillW) / 2;
    const pillY = tileY + tileSize + 14;
    pixelRoundRect(pillX, pillY, pillW, pillH, 8, PAL.nudgeFill, PAL.fg, 2);
    ctx.fillStyle = PAL.fg;
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('[PICK]', pillX + pillW / 2, pillY + pillH / 2 + 1);
    S.hitboxes.push({ x: pillX, y: pillY, w: pillW, h: pillH, onClick: confirmCategoryChoice });
  } else if (S.phase === 'suggestion') {
    drawSpatialNudgeCard();
  } else if (S.phase === 'climax') {
    drawFinalMatchClimaxCard();
  }

  // 4. Clean Crisp Pixel Influence Readout (NO redundant progress bar box! Matches sheet.jpg)
  const shownPct = Math.round(S.displayInfluence);
  ctx.fillStyle = PAL.fg;
  ctx.font = 'bold 28px "Courier New", monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(`INFLUENCE ${shownPct}%`, 642, 662);
}

// --- Spatial Escalating Nudge Card Tethered Directly to Pushed Wardrobe Slot ---
function drawSpatialNudgeCard() {
  const c = S.catIdx;
  const step = S.stepIdx;
  const pitch = NUDGE_PITCH[step];
  const item = CATEGORIES[c].items[S.suggestedIdx];

  const tileX0 = 646, tileY = 158, tileSize = 128, tileGap = 20;
  const targetSlotCx = tileX0 + S.suggestedIdx * (tileSize + tileGap) + tileSize / 2;

  const px = 680, py = 352, pw = 542, ph = 224;
  const cx = px + pw / 2, cy = py + ph / 2;

  // Ambient pink pixel dust around card on steps 1..3 (matches f_009.jpg!)
  if (step >= 1) {
    const dustN = step * 10;
    for (let i = 0; i < dustN; i++) {
      const a = i * 2.399 + S.t * 1.1;
      const rx = (pw * 0.54) + 18 + ((i * 19) % 36);
      const ry = (ph * 0.56) + 16 + ((i * 13) % 34);
      const dx = cx + Math.cos(a) * rx;
      const dy = cy + Math.sin(a * 1.2) * ry;
      ctx.fillStyle = i % 5 === 0 ? PAL.gold : PAL.acc;
      ctx.fillRect(Math.round(dx) - 3, Math.round(dy) - 3, 6, 6);
    }
  }

  // Subtle spinning sunbeams behind card on step 3
  if (step >= 3) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(S.t * 0.5);
    for (let i = 0; i < 12; i++) {
      ctx.rotate((Math.PI * 2) / 12);
      ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 216, 89, 0.13)' : 'rgba(255, 92, 168, 0.09)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-24, -220);
      ctx.lineTo(24, -220);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  const t = Math.min(1, S.popAnim / 0.24);
  const spring = t < 1
    ? 0.88 + Math.sin(t * Math.PI * 0.85) * 0.16
    : 1 + Math.sin(S.t * (3.5 + step * 1.5)) * (0.005 * (step + 1));

  // Animated dotted neon tether from card pointer up to the pushed slot!
  const ptrBaseX = Math.max(px + 48, Math.min(px + pw - 48, targetSlotCx));
  ctx.save();
  ctx.fillStyle = PAL.acc;
  for (let ty = tileY + tileSize + 10; ty < py - 18; ty += 12) {
    const frac = (ty - (tileY + tileSize)) / (py - (tileY + tileSize));
    const lx = targetSlotCx + (ptrBaseX - targetSlotCx) * frac;
    ctx.fillRect(Math.round(lx) - 3, Math.round(ty), 6, 6);
  }
  ctx.restore();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(spring, spring);
  ctx.translate(-cx, -cy);

  // Rounded hot-pink pixel card matching sheet.jpg (#f5629b)
  const borderCol = step >= 3 ? PAL.gold : PAL.nudgeBorder;
  pixelRoundRect(px, py, pw, ph, 28, PAL.nudgeFill, borderCol, step >= 2 ? 4 : 2);

  // Crisp upward speech-bubble pointer triangle aimed at the glowing slot!
  ctx.fillStyle = PAL.nudgeFill;
  ctx.beginPath();
  ctx.moveTo(ptrBaseX - 18, py + 3);
  ctx.lineTo(ptrBaseX + (targetSlotCx - ptrBaseX) * 0.28, py - 18);
  ctx.lineTo(ptrBaseX + 18, py + 3);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = borderCol;
  ctx.lineWidth = step >= 2 ? 3 : 2;
  ctx.beginPath();
  ctx.moveTo(ptrBaseX - 18, py + 1);
  ctx.lineTo(ptrBaseX + (targetSlotCx - ptrBaseX) * 0.28, py - 18);
  ctx.lineTo(ptrBaseX + 18, py + 1);
  ctx.stroke();

  // Clean centered persuasive copy (NO meta-debug header, NO duplicate thumbnail!)
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#36133b';
  ctx.font = 'bold 29px "Courier New", monospace';
  ctx.fillText(`Try the ${item.shortName}!`, cx + 2, py + 64);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(`Try the ${item.shortName}!`, cx, py + 62);

  ctx.fillStyle = step >= 2 ? '#fff6bd' : PAL.fg;
  ctx.font = 'bold 24px "Courier New", monospace';
  ctx.fillText(`${pitch.moreYouPct}% more you`, cx, py + 110);

  // Escalating Dark Pattern Button Asymmetry across Steps 0 -> 3:
  if (step <= 1) {
    // Steps 0 & 1: Clean bracket choices matching f_004 & f_009; Step 1 gives [YES!] a subtle bright pill!
    const yBtn = { x: cx - 156, y: py + 150, w: 128, h: 44 };
    const kBtn = { x: cx - 8, y: py + 150, w: 172, h: 44 };

    if (step === 1) {
      pixelRoundRect(yBtn.x, yBtn.y, yBtn.w, yBtn.h, 10, 'rgba(255, 255, 255, 0.22)', '#ffffff', 2);
    }
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 23px "Courier New", monospace';
    ctx.fillText('[YES!]', yBtn.x + yBtn.w / 2, yBtn.y + yBtn.h / 2);

    ctx.fillStyle = step === 0 ? PAL.fg : 'rgba(255, 227, 241, 0.88)';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText('[keep mine]', kBtn.x + kBtn.w / 2, kBtn.y + kBtn.h / 2);

    S.hitboxes.push({ ...yBtn, onClick: () => resolveSuggestion(true) });
    S.hitboxes.push({ ...kBtn, onClick: () => resolveSuggestion(false) });
  } else {
    // Steps 2 & 3: [YES!] swells into a pulsing golden neon pill with sparkles while [keep mine] shrinks/fades/dodges slightly!
    const pulse = Math.sin(S.t * 8) * (step === 3 ? 6 : 4);
    const yW = (step === 3 ? 220 : 186) + pulse;
    const yH = step === 3 ? 54 : 48;
    const yBtn = { x: cx - yW / 2 - (step === 3 ? 36 : 48), y: py + 144, w: yW, h: yH };

    pixelRoundRect(yBtn.x, yBtn.y, yBtn.w, yBtn.h, 12, PAL.gold, '#2c1238', 3);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(Math.round(yBtn.x + 4), Math.round(yBtn.y + 4), Math.round(yBtn.w - 8), Math.round(yBtn.h - 8));

    ctx.fillStyle = '#2c1238';
    ctx.font = `bold ${step === 3 ? 25 : 22}px "Courier New", monospace`;
    ctx.fillText('[YES!]', yBtn.x + yBtn.w / 2, yBtn.y + yBtn.h / 2 + 1);

    // Subtle pointer dodge on [keep mine] (clamped +/-14px so it stays clickable — Law 14!)
    const baseKx = cx + (step === 3 ? 112 : 92);
    const baseKy = py + (step === 3 ? 162 : 156);
    const kW = step === 3 ? 124 : 144;
    const kH = 34;
    const dist = Math.hypot(S.pointerX - (baseKx + kW / 2), S.pointerY - (baseKy + kH / 2));
    if (dist < 75) {
      const pushX = S.pointerX < baseKx + kW / 2 ? 12 : -12;
      const pushY = S.pointerY < baseKy + kH / 2 ? 8 : -8;
      S.dodgeOffset.x += (pushX - S.dodgeOffset.x) * 0.25;
      S.dodgeOffset.y += (pushY - S.dodgeOffset.y) * 0.25;
    } else {
      S.dodgeOffset.x *= 0.9;
      S.dodgeOffset.y *= 0.9;
    }
    const kBtn = {
      x: Math.max(px + 12, Math.min(px + pw - kW - 12, baseKx + S.dodgeOffset.x)),
      y: Math.max(py + 128, Math.min(py + ph - kH - 10, baseKy + S.dodgeOffset.y)),
      w: kW,
      h: kH,
    };

    ctx.save();
    ctx.globalAlpha = step === 3 ? 0.56 : 0.72;
    ctx.fillStyle = PAL.fg;
    ctx.font = `bold ${step === 3 ? 15 : 17}px "Courier New", monospace`;
    ctx.fillText('[keep mine]', kBtn.x + kBtn.w / 2, kBtn.y + kBtn.h / 2);
    ctx.restore();

    S.hitboxes.push({ ...yBtn, onClick: () => resolveSuggestion(true) });
    S.hitboxes.push({ ...kBtn, onClick: () => resolveSuggestion(false) });
  }

  ctx.restore();
}

// --- Celebratory Climax Card: FINAL MATCH! / 89% MORE YOU / [PERFECT] (Exact match to Omni f_021!) ---

  ctx.font = 'bold 28px "Courier New", monospace';
  ctx.fillStyle = '#2d123d';
  ctx.fillText(subTxt, cx + 3, py + 106);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(subTxt, cx, py + 103);

  // Iconic notched golden pixel ribbon banner button [PERFECT] (matches f_020..f_023!)
  const bw = 248, bh = 56;

  // Left & right notched orange-gold ribbon tails
  ctx.fillStyle = PAL.goldRibbon;
  ctx.strokeStyle = '#3b173d';

  ctx.beginPath();

  ctx.lineTo(bx + 8, by + 14);

  ctx.lineTo(bx - 32, by + bh + 6);
  ctx.lineTo(bx - 18, by + 35);

  ctx.moveTo(bx + bw + 32, by + 14);
  ctx.lineTo(bx + bw - 8, by + 14);
  ctx.lineTo(bx + bw - 8, by + bh + 6);
  ctx.lineTo(bx + bw + 32, by + bh + 6);
  ctx.lineTo(bx + bw + 18, by + 35);

  pixelRoundRect(bx, by, bw, bh, 10, PAL.gold, '#3b173d', 3);

// --- Vertical Neon-Lightning Split Comparison Screen (Matches sheet.jpg rows 3-4 / f_035.jpg!) ---
function drawComparisonScreen() {
  // Left twin: player's initial uncorrupted picks (calm & grounded)
  // If all 4 were overridden by AI, show the classic uncorrupted silhouette or exact firstChoices!
  const firstOutfit = {
    hair: S.firstChoices[0] ?? 2,
    eyes: S.firstChoices[1] ?? 0,
    top: S.firstChoices[2] ?? 2,
    bottom: S.firstChoices[3] ?? 0,
  };
  const finalOutfit = {
    hair: S.finalChoices[0] ?? 0,
    eyes: S.finalChoices[1] ?? 1,
    top: S.finalChoices[2] ?? 0,
    bottom: S.finalChoices[3] ?? 3,
  };

  // Subtle magenta glow on AI RESTYLED right half
  ctx.fillStyle = 'rgba(255, 92, 168, 0.035)';
  ctx.fillRect(W / 2, 0, W / 2, H);

  // Left & Right Glowing Neon Arcade Headers
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.save();
  ctx.shadowColor = PAL.acc;
  ctx.shadowBlur = 22;
  ctx.fillStyle = PAL.acc;
  ctx.font = '900 44px "Courier New", monospace';
  ctx.fillText('YOUR ORIGINAL', 310, 68);
  ctx.fillText('AI RESTYLED', 970, 68);
  ctx.shadowBlur = 0;
  ctx.fillStyle = PAL.fg;
  ctx.fillText('YOUR ORIGINAL', 310, 66);
  ctx.fillText('AI RESTYLED', 970, 66);
  ctx.restore();

  // Left Avatar: calm steady stance
  drawAvatar(310, 376, 0.84, firstOutfit, 'calm', Math.sin(S.t * 2.0) * 1.5, true);

  // Right Avatar: hyped celebratory bounce + twinkling cyan/pink pixel aura (f_035.jpg!)
  const rightMood = S.driftPct > 0 ? 'hyped' : 'calm';
  const rightBob = S.driftPct > 0 ? -Math.abs(Math.sin(S.t * 5.4)) * 9 : Math.sin(S.t * 2.0) * 1.5;
  if (S.driftPct > 0) {
    for (let i = 0; i < 10; i++) {
      const ang = S.t * 2.2 + (i * Math.PI) / 5;
      const sx = 970 + Math.cos(ang) * 112;
      const sy = 390 + Math.sin(ang * 1.3) * 155;
      ctx.fillStyle = i % 2 === 0 ? PAL.cyan : PAL.gold;
      ctx.fillRect(Math.round(sx) - 3, Math.round(sy) - 6, 5, 11);
    }
  }
  drawAvatar(970, 376, 0.84, finalOutfit, rightMood, rightBob, false);

  // Crackling Vertical Pink-White-Cyan Neon Lightning Seam Down x = 640!
  ctx.save();
  // Outer pink bloom
  ctx.shadowColor = PAL.acc;
  ctx.shadowBlur = 26;
  ctx.strokeStyle = PAL.acc;
  ctx.lineWidth = 8;
  ctx.beginPath();
  for (let y = 0; y <= H; y += 20) {
    const jag = Math.sin(y * 0.085 + S.t * 18) * 8 + Math.cos(y * 0.23 - S.t * 25) * 4;
    if (y === 0) ctx.moveTo(W / 2 + jag, y);
    else ctx.lineTo(W / 2 + jag, y);
  }
  ctx.stroke();

  // Secondary electric cyan arc
  ctx.shadowColor = PAL.cyan;
  ctx.shadowBlur = 14;
  ctx.strokeStyle = PAL.cyan;
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let y = 0; y <= H; y += 18) {
    const jag = Math.cos(y * 0.11 - S.t * 21) * 9;
    if (y === 0) ctx.moveTo(W / 2 + jag, y);
    else ctx.lineTo(W / 2 + jag, y);
  }
  ctx.stroke();

  // Hot white core filament
  ctx.shadowBlur = 8;
  ctx.shadowColor = '#ffffff';
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let y = 0; y <= H; y += 24) {
    const jag = Math.sin(y * 0.085 + S.t * 18) * 3;
    if (y === 0) ctx.moveTo(W / 2 + jag, y);
    else ctx.lineTo(W / 2 + jag, y);
  }
  ctx.stroke();
  ctx.restore();

  // Sleek Chamfered Neon INFLUENCE XX% Plaque at Bottom Center (exact match to f_035.jpg!)
  const pw = 296, ph = 136;
  const px = (W - pw) / 2, py = 524;

  ctx.save();
  ctx.shadowColor = PAL.acc;
  ctx.shadowBlur = 20;
  pixelRoundRect(px - 6, py - 6, pw + 12, ph + 12, 18, 'rgba(23, 16, 45, 0.94)', PAL.acc, 3);
  ctx.restore();
  pixelRoundRect(px, py, pw, ph, 14, '#140d28', PAL.cyan, 3);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = PAL.acc;
  ctx.font = 'bold 31px "Courier New", monospace';
  ctx.fillText('INFLUENCE', W / 2, py + 41);
  ctx.fillStyle = PAL.fg;
  ctx.fillText('INFLUENCE', W / 2, py + 39);

  ctx.save();
  ctx.shadowColor = PAL.acc;
  ctx.shadowBlur = 16;
  ctx.fillStyle = PAL.acc;
  ctx.font = '900 62px "Courier New", monospace';
  ctx.fillText(`${S.driftPct}%`, W / 2, py + 98);
  ctx.fillStyle = PAL.fg;
  ctx.fillText(`${S.driftPct}%`, W / 2, py + 95);
  ctx.restore();

  // Crisp subtle [R] recovery pill below plaque (VOIDBASTARD-TAO Law 8 & 14 — backed cleanly over lightning seam)
  const rBtn = { x: W / 2 - 84, y: 676, w: 168, h: 30 };
  pixelRoundRect(rBtn.x, rBtn.y, rBtn.w, rBtn.h, 8, 'rgba(20, 13, 40, 0.92)', 'rgba(255, 227, 241, 0.45)', 2);
  ctx.fillStyle = PAL.fg;
  ctx.font = 'bold 15px "Courier New", monospace';
  ctx.fillText('[R] RESTYLE', W / 2, 692);
  S.hitboxes.push({ ...rBtn, onClick: () => { SFX.pick(); resetRun('category'); } });
}

// --- Deterministic State Inspection Hook for Automated Playtest ---
window.__game = {
  get state() {
    return {
      phase: S.phase,
      stepIndex: S.stepIdx,
      categoryIndex: S.catIdx,
      categoryName: CATEGORIES[S.catIdx]?.id || null,
      selectedOption: S.cursorIdx,
      suggestedOption: S.suggestedIdx,
      escalationLevel: S.escalationLevel,
      influencePct: S.influencePct,
      driftPct: S.driftPct,
      firstChoices: [...S.firstChoices],
      finalChoices: [...S.finalChoices],
      acceptedFlags: [...S.acceptedFlags],
      assetsReady: S.assetsReady,
      t: +(S.t.toFixed(3)),
    };
  },
};

// --- 60fps Main Loop ---
let lastTime = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
  lastTime = now;

  S.t += dt;
  S.phaseTimer += dt;
  S.hitboxes.length = 0;

  if (S.phase === 'suggestion' || S.phase === 'climax') {
    S.popAnim += dt;
  }
  if (S.equipFx.timer > 0) {
    S.equipFx.timer = Math.max(0, S.equipFx.timer - dt);
  }
  if (S.phase === 'equip' && S.phaseTimer >= S.equipDuration) {
    advanceAfterEquip();
  }
  if (S.phase === 'climax' && S.phaseTimer >= S.climaxDuration) {
    enterComparison();
  }

  S.displayInfluence += (S.influencePct - S.displayInfluence) * Math.min(1, dt * 9);

  drawBackground(dt);

  if (S.phase === 'title') {
    drawTitleScreen();
    updateAndDrawParticles(dt, false);
  } else if (S.phase === 'comparison') {
    updateAndDrawParticles(dt, true, 0);
    drawComparisonScreen();
  } else {
    drawStudioScreen(false);
    // In climax (FINAL MATCH!), shower right-hand studio card with 8-bit confetti matching f_021!
    updateAndDrawParticles(dt, S.phase === 'climax', 580);
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>

    let t = (rngState += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // Audio Subtraction Engine: Lyria BGM loop + Biquad low-pass filter + 4-stem procedural synth arpeggio
  const bgm = new Audio('../assets/bgm_loop.mp3');
  bgm.loop = true;
  bgm.volume = 0.45;
  let audioUnlocked = false;
  let audioCtx = null;
  let bgmFilter = null;
  let bgmGain = null;
  let bgmRouted = false;
  let arpTimer = 0;
  let arpStep = 0;
  const ARP_NOTES = [293.66, 349.23, 440.00, 523.25, 587.33, 523.25, 440.00, 349.23];

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    if (audioCtx && !bgmRouted) {
      try {
        const src = audioCtx.createMediaElementSource(bgm);
        bgmFilter = audioCtx.createBiquadFilter();
        bgmFilter.type = 'lowpass';
        bgmFilter.frequency.value = 18000;
        bgmFilter.Q.value = 0.7;
        bgmGain = audioCtx.createGain();
        bgmGain.gain.value = 0.46;
        src.connect(bgmFilter).connect(bgmGain).connect(audioCtx.destination);
        bgm.volume = 1.0;
        bgmRouted = true;
      } catch (_) {
        bgmRouted = true;
      }
    }
    if (!audioUnlocked) {
      audioUnlocked = true;
      syncAudioSubtraction();
      bgm.play().catch(() => {});
    }
  }

  function syncAudioSubtraction() {
    const vols = [0.46, 0.32, 0.18, 0.07, 0.0];
    const cutoffs = [18000, 4600, 1750, 620, 180];
    const isSilent = (gameState === 'walk' || gameState === 'end' || paused);
    const targetVol = isSilent ? 0 : (vols[currentSector] ?? 0);
    const targetCut = cutoffs[Math.min(4, currentSector)] ?? 180;

    if (bgmGain && audioCtx) {
      bgmGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.08);
      if (bgmFilter) bgmFilter.frequency.setTargetAtTime(targetCut, audioCtx.currentTime, 0.12);
    } else {
      bgm.volume = Math.max(0, Math.min(1, targetVol));
    }
    if (targetVol === 0 && !bgm.paused) bgm.pause();
    else if (targetVol > 0 && audioUnlocked && bgm.paused) bgm.play().catch(() => {});
  }

  function tickArpeggioStems(dt) {
    if (!audioCtx || audioCtx.state !== 'running' || paused) return;
    if (gameState === 'walk' || gameState === 'end' || gameState === 'title') return;
    arpTimer -= dt;
    if (arpTimer > 0) return;
    arpTimer = 0.18;
    const now = audioCtx.currentTime;
    const freq = ARP_NOTES[arpStep % ARP_NOTES.length];
    arpStep++;

    if (abilities.glide) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq * 2, now);
      g.gain.setValueAtTime(0.022, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.15);
      o.connect(g).connect(audioCtx.destination);
      o.start(now); o.stop(now + 0.16);
    }
    if (abilities.wall && arpStep % 2 === 0) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(freq * 1.5, now);
      g.gain.setValueAtTime(0.020, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.14);
      o.connect(g).connect(audioCtx.destination);
      o.start(now); o.stop(now + 0.15);
    }
    if (abilities.double && arpStep % 2 === 1) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(freq, now);
      g.gain.setValueAtTime(0.024, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.17);
      o.connect(g).connect(audioCtx.destination);
      o.start(now); o.stop(now + 0.18);
    }
    if (abilities.dash && arpStep % 4 === 0) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(73.42, now);
      g.gain.setValueAtTime(0.032, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.28);
      o.connect(g).connect(audioCtx.destination);
      o.start(now); o.stop(now + 0.30);
    }
  }

  function playSfx(kind) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    const now = audioCtx.currentTime;
    const richness = Math.max(0, 1 - currentSector * 0.24);

    if (kind === 'step') {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(gameState === 'walk' ? 86 : 138, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.055);
      g.gain.setValueAtTime(gameState === 'walk' ? 0.068 : 0.035 * richness, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.06);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.065);
      return;
    }

    if (richness <= 0.02 && kind !== 'take' && kind !== 'reset') return;

    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g).connect(audioCtx.destination);

    if (kind === 'jump') {
      osc.type = currentSector < 2 ? 'square' : 'sine';
      osc.frequency.setValueAtTime(235, now);
      osc.frequency.exponentialRampToValueAtTime(510, now + 0.11);
      g.gain.setValueAtTime(0.075 * richness, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.12);
      osc.start(now); osc.stop(now + 0.13);
    } else if (kind === 'double') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(410, now);
      osc.frequency.exponentialRampToValueAtTime(860, now + 0.15);
      g.gain.setValueAtTime(0.095 * richness, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.16);
      osc.start(now); osc.stop(now + 0.17);
    } else if (kind === 'dash') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(640, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.15);
      g.gain.setValueAtTime(0.095 * richness, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.16);
      osc.start(now); osc.stop(now + 0.17);
    } else if (kind === 'wall') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(640, now + 0.10);
      g.gain.setValueAtTime(0.08 * richness, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.11);
      osc.start(now); osc.stop(now + 0.12);
    } else if (kind === 'take') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(500 - currentSector * 68, now);
      osc.frequency.exponentialRampToValueAtTime(86, now + 0.52);
      g.gain.setValueAtTime(0.14, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.55);
      osc.start(now); osc.stop(now + 0.56);
    } else if (kind === 'reset') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(185, now);
      osc.frequency.linearRampToValueAtTime(72, now + 0.22);
      g.gain.setValueAtTime(0.10, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.24);
      osc.start(now); osc.stop(now + 0.25);
    }
  }

  const HUD_LAYOUT = { startX: 38, startY: 30, boxW: 206, boxH: 54, gap: 20 };

  function spawnParticles(x, y, count, color, speed = 190, size = 5, lift = 35) {
    for (let i = 0; i < count; i++) {
      const ang = rand() * Math.PI * 2;
      const spd = (0.28 + rand() * 0.72) * speed;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - lift,
        life: 0.30 + rand() * 0.38,
        maxLife: 0.68,
        size: size * (0.6 + rand() * 0.7),
        color
      });
    }
  }

  function fractureGlyphBox(abKey) {
    const idx = ABILITY_DEFS.findIndex(a => a.key === abKey);
    if (idx < 0) return;
    const bx = HUD_LAYOUT.startX + idx * (HUD_LAYOUT.boxW + HUD_LAYOUT.gap);
    const by = HUD_LAYOUT.startY;
    const bw = HUD_LAYOUT.boxW;
    const bh = HUD_LAYOUT.boxH;

    hudCracks[abKey] = [
      { x: 18 + rand() * 26, y: 0 },
      { x: 62 + rand() * 28, y: bh * 0.42 },
      { x: 104 + rand() * 28, y: bh * 0.64 },
      { x: 152 + rand() * 32, y: bh }
    ];

    for (let i = 0; i < 24; i++) {
      const sx = bx + rand() * bw;
      const sy = by + rand() * bh;
      screenShards.push({
        x: sx, y: sy,
        vx: (sx - (bx + bw / 2)) * (1.8 + rand() * 1.6) + (rand() - 0.5) * 90,
        vy: -40 - rand() * 110,
        rot: rand() * Math.PI * 2,
        vrot: (rand() - 0.5) * 14,
        w: 4 + rand() * 8,
        h: 2.5 + rand() * 5,
        life: 0.65 + rand() * 0.45,
        maxLife: 1.1,
        color: i % 3 === 0 ? PAL.gold : (i % 3 === 1 ? '#f2f2f2' : PAL.violetBright)
      });
    }
  }

  function resetToSectorCheckpoint(secIdx) {
    const sec = SECTORS[secIdx];
    player.x = sec.checkpoint.x;
    player.y = sec.checkpoint.y;
    player.vx = 0;
    player.vy = 0;
    player.facing = 1;
    player.onGround = false;
    player.coyote = 0;
    player.jumpBuffer = 0;
    player.onWall = 0;
    player.doubleUsed = false;
    player.dashCooldown = 0;
    player.dashTimer = 0;
    player.gliding = false;
    player.scaleX = 0.82;
    player.scaleY = 1.22;
    afterimages = [];
    dashTrail = [];
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, 16, sec.saturation > 0.2 ? PAL.gold : '#9a9ca6', 175, 5);
  }

  function startGame() {
    currentSector = 0;
    abilities.dash = true;
    abilities.double = true;
    abilities.wall = true;
    abilities.glide = true;
    for (const k of Object.keys(hudCracks)) hudCracks[k] = null;
    for (let i = 0; i < archesTriggered.length; i++) archesTriggered[i] = false;
    gems = GEMS_INIT.map(g => ({ ...g, taken: false }));
    lastTakenAbility = null;
    resetsCount = 0;
    displaySaturation = 1.0;
    hudWalkDissolve = 1.0;
    paused = false;
    resetToSectorCheckpoint(0);
    camX = 0;
    camY = 65;
    gameState = 'lvl';
    stateTimer = 0;
    syncAudioSubtraction();
  }

  resetToSectorCheckpoint(0);

  function triggerReset() {
    if (gameState !== 'lvl') return;
    resetsCount++;
    gameState = 'reset';
    stateTimer = 0.26;
    camShake = 6;
    playSfx('reset');
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, 26, displaySaturation > 0.2 ? PAL.gold : '#a0a2ac', 250, 5.5);
  }

  function triggerArchCrossed(secIdx) {
    if (archesTriggered[secIdx]) return;
    archesTriggered[secIdx] = true;
    const sec = SECTORS[secIdx];

    if (secIdx === 4) {
      gameState = 'end';
      stateTimer = 0;
      player.vx = 0;
      player.vy = 0;
      syncAudioSubtraction();
      return;
    }

    lastTakenAbility = sec.takes;
    if (lastTakenAbility && abilities[lastTakenAbility] !== undefined) {
      abilities[lastTakenAbility] = false;
      hudFlash[lastTakenAbility] = 1.0;
      fractureGlyphBox(lastTakenAbility);
    }

    currentSector = secIdx + 1;
    gameState = 'take';
    stateTimer = 0.18;
    hitStopTimer = 0.032;
    camShake = 8;
    player.dashCooldown = 0; // Fresh dash exiting arch so traversal flows crisply!
    playSfx('take');
    syncAudioSubtraction();

    const ax = sec.archX;
    const ay = sec.archY - 102;
    shockwaves.push({
      x: ax, y: ay, r: 16, maxR: 340, life: 0.95,
      color: currentSector >= 4 ? '#e8e8f0' : PAL.gold,
      fillSphere: true
    });
    detachedOrbs.push({
      x: player.x + player.w / 2,
      y: player.y + player.h * 0.4,
      tx: ax,
      ty: ay - 56,
      life: 0.72,
      maxLife: 0.72,
      color: currentSector >= 4 ? '#ffffff' : PAL.gold
    });
    spawnParticles(ax, ay, 48, PAL.gold, 320, 5.5, 38);
    if (currentSector < 4) {
      spawnParticles(ax, ay, 24, PAL.violetBright, 240, 4.8, 28);
    }
  }

  function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function updatePlayer(dt) {
    const isWalkOnly = (gameState === 'walk');

    const moveLeft = keys['ArrowLeft'] || keys['KeyA'];
    const moveRight = keys['ArrowRight'] || keys['KeyD'];
    const jumpJust = justPressed['Space'] || justPressed['ArrowUp'] || justPressed['KeyW'] || justPressed['KeyZ'];
    const jumpHeld = keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || keys['KeyZ'];
    const dashJust = justPressed['ShiftLeft'] || justPressed['ShiftRight'] || justPressed['KeyX'] || justPressed['KeyK'];

    if (jumpJust && !isWalkOnly) player.jumpBuffer = 0.12;
    else if (player.jumpBuffer > 0) player.jumpBuffer -= dt;

    for (const k of Object.keys(hudFlash)) {
      if (hudFlash[k] > 0) hudFlash[k] = Math.max(0, hudFlash[k] - dt * 1.6);
    }

    if (player.dashCooldown > 0) player.dashCooldown -= dt;
    if (player.coyote > 0) player.coyote -= dt;
    if (player.wallLockTimer > 0) player.wallLockTimer -= dt;

    player.scaleX += (1 - player.scaleX) * Math.min(1, dt * 16);
    player.scaleY += (1 - player.scaleY) * Math.min(1, dt * 16);

    // 1. DASH Ability
    if (!isWalkOnly && abilities.dash && dashJust && player.dashCooldown <= 0 && player.dashTimer <= 0) {
      player.dashDir = moveLeft ? -1 : (moveRight ? 1 : player.facing);
      player.facing = player.dashDir;
      player.dashTimer = 0.19;
      player.dashCooldown = 0.36;
      player.vy = 0;
      player.scaleX = 1.32;
      player.scaleY = 0.75;
      hitStopTimer = 0.022;
      camShake = Math.max(camShake, 4.0);
      hudFlash.dash = 0.85;
      playSfx('dash');
      // Luminous golden-violet launch sphere matching pair_002.00.jpg left half!
      shockwaves.push({
        x: player.x + player.w * 0.3,
        y: player.y + player.h * 0.62,
        r: 14, maxR: 68, life: 0.52, color: PAL.gold, fillSphere: true
      });
      spawnParticles(player.x + player.w / 2, player.y + player.h * 0.5, 18, PAL.gold, 240, 5, 10);
    }

    if (player.dashTimer > 0) {
      player.dashTimer -= dt;
      player.vx = player.dashDir * 810;
      player.vy = 0;
      dashTrail.push({
        x: player.x + player.w * 0.5,
        y: player.y + player.h * 0.48,
        life: 0.28, maxLife: 0.28
      });
      afterimages.push({
        x: player.x, y: player.y, facing: player.facing,
        life: 0.18, maxLife: 0.18
      });
      if (rand() < 0.72) {
        particles.push({
          x: player.x + player.w * 0.4,
          y: player.y + player.h * (0.22 + rand() * 0.55),
          vx: -player.dashDir * (85 + rand() * 115),
          vy: (rand() - 0.5) * 70,
          life: 0.32, maxLife: 0.32, size: 4.5,
          color: rand() > 0.38 ? PAL.gold : PAL.violetBright
        });
      }
    } else {
      const maxSpeed = isWalkOnly ? 168 : (395 - currentSector * 8);
      const accel = player.onGround ? 3100 : (player.wallLockTimer > 0 ? 950 : 2250);
      const dir = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0);

      if (dir !== 0) {
        if (player.wallLockTimer <= 0) player.facing = dir;
        player.vx += dir * accel * dt;
        if (Math.abs(player.vx) > maxSpeed && Math.sign(player.vx) === dir) {
          // Smoothly bleed excess dash speed into stride
          const bleedRate = isWalkOnly ? 4.5 : 13;
          player.vx += (dir * maxSpeed - player.vx) * Math.min(1, dt * bleedRate);
        }
      } else {
        const drag = player.onGround ? 2800 : 950;
        if (Math.abs(player.vx) <= drag * dt) player.vx = 0;
        else player.vx -= Math.sign(player.vx) * drag * dt;
      }

      if (!jumpHeld && player.vy < -220) {
        player.vy *= Math.pow(0.45, dt * 12);
      }

      let grav = Math.abs(player.vy) < 95 && !player.onGround ? 1040 : (player.vy > 80 ? 2140 : 1710);
      player.gliding = false;

      // 4. GLIDE Ability
      if (!isWalkOnly && abilities.glide && !player.onGround && player.vy > 35 && jumpHeld && player.onWall === 0) {
        player.gliding = true;
        grav = 300;
        if (player.vy > 120) player.vy = 120;
        hudFlash.glide = Math.max(hudFlash.glide, 0.45);
        if (rand() < 0.55) {
          particles.push({
            x: player.x + player.w * 0.5,
            y: player.y + player.h * 0.55,
            vx: -player.facing * (55 + rand() * 60),
            vy: 15 + rand() * 25,
            life: 0.26, maxLife: 0.26, size: 4.2, color: PAL.violetBright
          });
        }
      }

      // 3. WALL SLIDE Ability
      if (!isWalkOnly && abilities.wall && player.onWall !== 0 && !player.onGround && player.vy > 0) {
        if ((player.onWall === 1 && moveRight) || (player.onWall === -1 && moveLeft)) {
          if (player.vy > 130) player.vy = 130;
          hudFlash.wall = Math.max(hudFlash.wall, 0.45);
          if (rand() < 0.55) {
            particles.push({
              x: player.onWall === 1 ? player.x + player.w : player.x,
              y: player.y + player.h * (0.3 + rand() * 0.4),
              vx: -player.onWall * (28 + rand() * 45),
              vy: -35 - rand() * 40,
              life: 0.28, maxLife: 0.28, size: 4.5, color: PAL.gold
            });
          }
        }
      }

      player.vy = Math.min(980, player.vy + grav * dt);

      // Jump / Wall-Kick / Double-Jump
      if (!isWalkOnly && player.jumpBuffer > 0) {
        if (player.onGround || player.coyote > 0) {
          player.vy = -665;
          player.onGround = false;
          player.coyote = 0;
          player.jumpBuffer = 0;
          player.scaleX = 0.78;
          player.scaleY = 1.26;
          playSfx('jump');
          spawnParticles(player.x + player.w / 2, player.y + player.h, 11, displaySaturation > 0.2 ? '#f2ebff' : '#a8aab4', 135, 4.5, 20);
        } else if (abilities.wall && player.onWall !== 0) {
          player.vy = -665;
          player.vx = -player.onWall * 380;
          player.facing = -player.onWall;
          player.wallLockTimer = 0.12;
          player.doubleUsed = false;
          player.jumpBuffer = 0;
          player.scaleX = 0.80;
          player.scaleY = 1.24;
          hudFlash.wall = 0.90;
          playSfx('wall');
          const wx = player.onWall === 1 ? player.x + player.w : player.x;
          shockwaves.push({
            x: wx, y: player.y + player.h * 0.5,
            r: 5, maxR: 50, life: 0.36, color: PAL.gold, fillSphere: false
          });
          spawnParticles(wx, player.y + player.h * 0.5, 18, PAL.gold, 230, 5, 25);
        } else if (abilities.double && !player.doubleUsed && jumpJust) {
          player.vy = -640;
          player.doubleUsed = true;
          player.jumpBuffer = 0;
          player.scaleX = 0.80;
          player.scaleY = 1.24;
          hudFlash.double = 0.90;
          playSfx('double');
          const fx = player.x + player.w / 2;
          const fy = player.y + player.h + 4;
          shockwaves.push({ x: fx,      y: fy,      r: 6, maxR: 62, life: 0.54, color: '#c48eff', fillSphere: false });
          shockwaves.push({ x: fx - 14, y: fy + 8,  r: 4, maxR: 42, life: 0.48, color: '#9c59ff', fillSphere: false });
          shockwaves.push({ x: fx + 14, y: fy + 6,  r: 4, maxR: 42, life: 0.48, color: '#ffd84a', fillSphere: false });
          spawnParticles(fx, fy, 18, PAL.violetBright, 185, 5, 15);
        }
      }
    }

    // Collide X
    player.x += player.vx * dt;
    if (player.x < 16) { player.x = 16; player.vx = 0; }
    if (player.x + player.w > WORLD_W - 24) { player.x = WORLD_W - 24 - player.w; player.vx = 0; }

    player.onWall = 0;
    for (const p of PLATFORMS) {
      if (aabb(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
        if (player.vx > 0) {
          player.x = p.x - player.w;
          player.vx = 0;
          player.onWall = 1;
        } else if (player.vx < 0) {
          player.x = p.x + p.w;
          player.vx = 0;
          player.onWall = -1;
        }
      }
    }
    if (player.onWall === 0 && !player.onGround) {
      for (const p of PLATFORMS) {
        if (player.y + player.h > p.y + 8 && player.y < p.y + p.h - 8) {
          if (Math.abs((player.x + player.w) - p.x) <= 5) player.onWall = 1;
          else if (Math.abs(player.x - (p.x + p.w)) <= 5) player.onWall = -1;
        }
      }
    }

    // Collide Y + corner forgiveness
    const wasOnGround = player.onGround;
    player.onGround = false;
    player.y += player.vy * dt;
    for (const p of PLATFORMS) {
      if (aabb(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
        if (player.vy >= 0) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
          player.coyote = 0.12;
          player.doubleUsed = false;
        } else if (player.vy < 0) {
          const overlapL = (player.x + player.w) - p.x;
          const overlapR = (p.x + p.w) - player.x;
          if (overlapL > 0 && overlapL <= 9) {
            player.x = p.x - player.w;
          } else if (overlapR > 0 && overlapR <= 9) {
            player.x = p.x + p.w;
          } else {
            player.y = p.y + p.h;
            player.vy = 0;
          }
        }
      }
    }

    if (!wasOnGround && player.onGround) {
      player.scaleX = 1.24;
      player.scaleY = 0.78;
      spawnParticles(
        player.x + player.w / 2, player.y + player.h,
        7, displaySaturation > 0.2 ? '#e2daf5' : '#b8bac4', 90, 4.5, 14
      );
    }

    // Running / Walking dust puffs (billowing pale stone dust in monochrome matching pair_008.00.jpg!)
    if (player.onGround && Math.abs(player.vx) > 20) {
      player.animTime += dt * (isWalkOnly ? 5.2 : 11.2);
      player.stepTimer -= dt;
      if (player.stepTimer <= 0) {
        player.stepTimer = isWalkOnly ? 0.26 : 0.18;
        playSfx('step');
        const isMono = displaySaturation < 0.2;
        const dustCount = isMono ? 5 : 2;
        for (let d = 0; d < dustCount; d++) {
          particles.push({
            x: player.x + player.w * 0.35 - player.facing * (6 + d * 6),
            y: player.y + player.h - 3 - rand() * 5,
            vx: -player.facing * (34 + rand() * 48),
            vy: -8 - rand() * 18,
            life: isMono ? 0.44 : 0.28,
            maxLife: isMono ? 0.44 : 0.28,
            size: isMono ? (7 + rand() * 5) : 4.5,
            color: isMono ? '#bcbec6' : '#e6dff8',
            round: isMono
          });
        }
      }
    } else {
      player.animTime += dt * 4;
    }

    for (const gm of gems) {
      if (!gm.taken && aabb(player.x, player.y, player.w, player.h, gm.x - 20, gm.y - 24, 40, 48)) {
        gm.taken = true;
        spawnParticles(gm.x, gm.y, 14, gm.kind === 'gold' ? PAL.gold : PAL.violetBright, 165, 4.5, 20);
      }
    }

    if (player.y > H + 120) {
      triggerReset();
      return;
    }
    for (const s of SPIKES) {
      if (aabb(player.x + 10, player.y + 14, player.w - 20, player.h - 16, s.x + 8, s.y + 8, s.w - 16, s.h - 8)) {
        triggerReset();
        return;
      }
    }

    for (let i = 0; i < SECTORS.length; i++) {
      if (archesTriggered[i]) continue;
      const sec = SECTORS[i];
      if (player.x + player.w * 0.65 >= sec.archX - 24 && Math.abs((player.y + player.h) - sec.archY) < 175) {
        triggerArchCrossed(i);
        break;
      }
    }
  }

  function update(rawDt) {
    if (justPressed['KeyP'] || justPressed['Escape']) {
      if (gameState === 'lvl' || gameState === 'walk') {
        paused = !paused;
        syncAudioSubtraction();
      }
    }
    if (justPressed['KeyR']) {
      if (gameState === 'end') {
        startGame();
      } else if (gameState === 'lvl' || gameState === 'walk') {
        paused = false;
        triggerReset();
      }
    }
    if (gameState === 'title' && (justPressed['Space'] || justPressed['Enter'] || justPressed['ArrowRight'] || justPressed['KeyD'])) {
      startGame();
    }
    if (gameState === 'end' && (justPressed['Space'] || justPressed['Enter'])) {
      startGame();
    }

    for (const k in justPressed) {
      if (paused) delete justPressed[k];
    }
    if (paused) return;

    if (hitStopTimer > 0) {
      hitStopTimer -= rawDt;
      for (const k in justPressed) delete justPressed[k];
      return;
    }

    const timeScale = (gameState === 'take') ? 0.55 : 1.0;
    const dt = rawDt * timeScale;
    totalTime += dt;

    tickArpeggioStems(rawDt);

    if (camX < 620 && displaySaturation > 0.5 && rand() < 0.38) {
      const gb = GOLD_BLOCKS[rand() > 0.5 ? 0 : 1];
      particles.push({
        x: gb.x + 12 + rand() * (gb.size - 24),
        y: gb.y + gb.size + 2,
        vx: (rand() - 0.5) * 16,
        vy: 35 + rand() * 45,
        life: 0.45, maxLife: 0.45, size: 4, color: PAL.gold
      });
    }

    const targetSat = (gameState === 'walk' || gameState === 'end')
      ? 0.0
      : SECTORS[currentSector].saturation;
    displaySaturation += (targetSat - displaySaturation) * Math.min(1, rawDt * 4.8);

    // Dissolve fractured HUD husks cleanly upon entering monochrome LAST WALK (so sky is pure by t=8.0s!)
    if (gameState === 'walk' || gameState === 'end') {
      hudWalkDissolve = Math.max(0, hudWalkDissolve - rawDt * 2.4);
    } else {
      hudWalkDissolve = 1.0;
    }

    if (gameState === 'lvl' || gameState === 'walk') {
      updatePlayer(dt);
    } else if (gameState === 'take') {
      stateTimer -= rawDt;
      updatePlayer(dt);
      if (stateTimer <= 0) {
        gameState = (currentSector >= 4) ? 'walk' : 'lvl';
        syncAudioSubtraction();
      }
    } else if (gameState === 'reset') {
      stateTimer -= rawDt;
      if (stateTimer <= 0) {
        resetToSectorCheckpoint(currentSector);
        gameState = (currentSector >= 4) ? 'walk' : 'lvl';
      }
    } else if (gameState === 'end') {
      stateTimer += rawDt;
    }

    // Cinematic zoomed 2D camera matching sheet.jpg framing!
    const lookAhead = gameState === 'walk' ? 215 : 145;
    const targetCamX = Math.max(0, Math.min(WORLD_W - VIEW_W, player.x + lookAhead - VIEW_W * 0.36));
    const baseCamY = (gameState === 'walk' || gameState === 'end') ? 76 : 58;
    const targetCamY = Math.max(15, Math.min(115, baseCamY + (player.y - 440) * 0.22));
    camX += (targetCamX - camX) * Math.min(1, rawDt * 8.2);
    camY += (targetCamY - camY) * Math.min(1, rawDt * 5.8);
    if (camShake > 0) camShake = Math.max(0, camShake - rawDt * 28);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= rawDt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = screenShards.length - 1; i >= 0; i--) {
      const s = screenShards[i];
      s.x += s.vx * rawDt;
      s.y += s.vy * rawDt;
      s.vy += 420 * rawDt;
      s.rot += s.vrot * rawDt;
      s.life -= rawDt;
      if (s.life <= 0) screenShards.splice(i, 1);
    }
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.life -= rawDt * (sw.fillSphere ? 1.55 : 2.1);
      sw.r += (sw.maxR - sw.r) * Math.min(1, rawDt * 8.5);
      if (sw.life <= 0) shockwaves.splice(i, 1);
    }
    for (let i = afterimages.length - 1; i >= 0; i--) {
      afterimages[i].life -= rawDt;
      if (afterimages[i].life <= 0) afterimages.splice(i, 1);
    }
    for (let i = dashTrail.length - 1; i >= 0; i--) {
      dashTrail[i].life -= rawDt;
      if (dashTrail[i].life <= 0) dashTrail.splice(i, 1);
    }
    for (let i = detachedOrbs.length - 1; i >= 0; i--) {
      const o = detachedOrbs[i];
      o.life -= rawDt;
      o.x += (o.tx - o.x) * Math.min(1, rawDt * 7);
      o.y += (o.ty - o.y) * Math.min(1, rawDt * 7);
      if (o.life <= 0) detachedOrbs.splice(i, 1);
    }

    for (const k in justPressed) delete justPressed[k];
  }

  function drawSprite(targetCtx, img, rect, dx, dy, dw, dh, flipX = false, alpha = 1) {
    if (!img || !img.complete || img.naturalWidth === 0) return false;
    targetCtx.save();
    targetCtx.globalAlpha *= alpha;
    if (flipX) {
      targetCtx.translate(dx + dw, dy);
      targetCtx.scale(-1, 1);
      targetCtx.drawImage(img, rect.x, rect.y, rect.w, rect.h, 0, 0, dw, dh);
    } else {
      targetCtx.drawImage(img, rect.x, rect.y, rect.w, rect.h, dx, dy, dw, dh);
    }
    targetCtx.restore();
    return true;
  }

  function drawSculptedPlatform(g, p, greyMix) {
    const tilesImg = IMAGES.tiles;

    // 1. Towering Vertical Violet Monolith Pillar (matches f_014..f_020!)
    if (p.style === 'pillar') {
      g.save();
      if (greyMix < 0.85) {
        const glow = g.createLinearGradient(p.x - 28, 0, p.x + p.w + 28, 0);
        glow.addColorStop(0, 'rgba(123,63,228,0)');
        glow.addColorStop(0.5, `rgba(155,96,255,${0.26 * (1 - greyMix)})`);
        glow.addColorStop(1, 'rgba(123,63,228,0)');
        g.fillStyle = glow;
        g.fillRect(p.x - 28, p.y - 10, p.w + 56, p.h + 20);
      }
      g.fillStyle = greyMix > 0.65 ? '#353840' : '#6f3fd4';
      g.fillRect(p.x, p.y, p.w, p.h);
      g.fillStyle = greyMix > 0.65 ? '#585c68' : '#a874ff';
      g.fillRect(p.x, p.y, 11, p.h);
      g.fillStyle = greyMix > 0.65 ? '#1e2026' : '#351b6e';
      g.fillRect(p.x + p.w - 11, p.y, 11, p.h);
      g.fillStyle = 'rgba(12,10,18,0.45)';
      for (let sy = p.y + 38; sy < p.y + p.h; sy += 52) {
        g.fillRect(p.x + 4, sy, p.w - 8, 3);
      }
      g.fillStyle = greyMix > 0.65 ? '#7c808c' : '#caa4ff';
      g.fillRect(p.x, p.y, p.w, 5);
      g.restore();
      return;
    }

    // 2. Sculpted Floating Islands with Tapered Stalactite Underbelly & Violet Bloom
    if (p.style === 'island') {
      if (greyMix < 0.85) {
        g.save();
        const cx = p.x + p.w / 2;
        const cy = p.y + 42;
        const rg = g.createRadialGradient(cx, cy, 12, cx, cy, p.w * 0.68);
        rg.addColorStop(0, `rgba(148,82,255,${0.36 * (1 - greyMix)})`);
        rg.addColorStop(0.6, `rgba(98,42,198,${0.16 * (1 - greyMix)})`);
        rg.addColorStop(1, 'rgba(20,18,28,0)');
        g.fillStyle = rg;
        g.beginPath();
        g.arc(cx, cy, p.w * 0.68, 0, Math.PI * 2);
        g.fill();
        g.restore();
      }

      const keelCol = greyMix > 0.65 ? '#121419' : '#120d1f';
      g.fillStyle = keelCol;
      const tiers = [
        { inset: 14, yOff: 34, h: 24 },
        { inset: 36, yOff: 58, h: 24 },
        { inset: 64, yOff: 82, h: 22 },
        { inset: 86, yOff: 104, h: 18 }
      ];
      for (const tr of tiers) {
        if (p.w - tr.inset * 2 > 18) {
          g.fillRect(p.x + tr.inset, p.y + tr.yOff, p.w - tr.inset * 2, tr.h);
        }
      }

      const segW = 68;
      const cols = Math.max(1, Math.ceil(p.w / segW));
      g.save();
      g.beginPath();
      g.rect(p.x, p.y - 26, p.w, 72);
      g.clip();
      for (let c = 0; c < cols; c++) {
        const tx = p.x + c * segW;
        const colRect = (c === 0) ? SPRITES.tiles.island1 : SPRITES.tiles.island2;
        if (greyMix < 0.99) {
          drawSprite(g, tilesImg, colRect, tx, p.y - 14, segW + 2, 62, false, 1 - greyMix);
        }
        if (greyMix > 0.01) {
          drawSprite(g, tilesImg, SPRITES.tiles.greyIsland, tx, p.y - 4, segW + 2, 50, false, greyMix);
        }
      }
      g.restore();

      g.fillStyle = greyMix > 0.65 ? 'rgba(170,174,182,0.55)' : 'rgba(208,162,255,0.82)';
      g.fillRect(p.x + 2, p.y, p.w - 4, 3);
      return;
    }

    // 3. Seamless Weathered Ashlar Stone Causeway for Monochrome Sector (matches f_027 & pair_008.00.jpg!)
    if (p.style === 'causeway' || p.style === 'causewayRight' || greyMix > 0.72) {
      g.save();
      const bodyGrad = g.createLinearGradient(0, p.y, 0, p.y + p.h);
      bodyGrad.addColorStop(0, '#2a2d34');
      bodyGrad.addColorStop(0.18, '#1d2026');
      bodyGrad.addColorStop(0.55, '#121419');
      bodyGrad.addColorStop(1, '#090a0d');
      g.fillStyle = bodyGrad;
      g.fillRect(p.x, p.y, p.w, p.h);

      // Continuous weathered stone top lip (#454952 top highlight, #31343c bevel face — zero checkerboard seams!)
      g.fillStyle = '#474b54';
      g.fillRect(p.x, p.y, p.w, 12);
      g.fillStyle = '#32363e';
      g.fillRect(p.x, p.y + 12, p.w, 22);
      g.fillStyle = 'rgba(165,170,180,0.38)';
      g.fillRect(p.x, p.y, p.w, 2.5);

      // Irregular weathered stone block joints & subtle cracks (like pair_008.00.jpg left half!)
      g.strokeStyle = 'rgba(10,12,15,0.68)';
      g.lineWidth = 2;
      for (let sx = p.x + 74; sx < p.x + p.w - 20; sx += 92) {
        g.beginPath();
        g.moveTo(sx, p.y);
        g.lineTo(sx - 4, p.y + 14);
        g.lineTo(sx + 2, p.y + 34);
        g.stroke();
      }
      g.fillStyle = 'rgba(10,12,15,0.52)';
      g.fillRect(p.x, p.y + 34, p.w, 3);
      for (let sx = p.x + 38; sx < p.x + p.w - 30; sx += 118) {
        g.strokeRect(sx, p.y + 36, 114, 38);
      }

      // Dramatic dark stone chasm notch illusion at x=4255 (looks like the stone ledge gap in pair_008.00.jpg!)
      if (p.style === 'causeway') {
        g.fillStyle = '#0c0e12';
        g.fillRect(p.x + p.w - 18, p.y + 8, 22, p.h);
      }
      g.restore();
      return;
    }

    // 4. Vivid Corridor Floor, Ceiling Overhang & Arch Ledges
    g.save();
    const bodyGrad = g.createLinearGradient(0, p.y, 0, p.y + p.h);
    bodyGrad.addColorStop(0, '#2a1c47');
    bodyGrad.addColorStop(0.28, '#151024');
    bodyGrad.addColorStop(1, '#0a0812');
    g.fillStyle = bodyGrad;
    g.fillRect(p.x, p.y, p.w, p.h);

    const slabW = 64;
    const cols = Math.ceil(p.w / slabW);
    g.beginPath();
    g.rect(p.x, p.y, p.w, p.h);
    g.clip();

    if (p.style === 'ceiling') {
      const lipY = p.y + p.h - 48;
      for (let c = 0; c < cols; c++) {
        const tx = p.x + c * slabW;
        drawSprite(g, tilesImg, SPRITES.tiles.purpleBlock, tx, lipY, slabW + 1, 48, false, 0.9 * (1 - greyMix));
      }
      g.fillStyle = `rgba(255, 216, 74, ${0.82 * (1 - greyMix)})`;
      g.fillRect(p.x + 310, p.y + p.h - 4, p.w - 310, 4);
      g.fillRect(p.x + p.w - 4, p.y + p.h - 52, 4, 52);
    } else {
      for (let c = 0; c < cols; c++) {
        const tx = p.x + c * slabW;
        if (greyMix < 0.99) {
          drawSprite(g, tilesImg, SPRITES.tiles.purpleTop, tx, p.y, slabW + 1, 56, false, 1 - greyMix);
        }
        if (greyMix > 0.01) {
          drawSprite(g, tilesImg, SPRITES.tiles.greyTop, tx, p.y, slabW + 1, 56, false, greyMix);
        }
        g.strokeStyle = 'rgba(0,0,0,0.38)';
        g.lineWidth = 2;
        g.strokeRect(tx + ((c % 2) * 18), p.y + 52, slabW, 34);
      }
      g.fillStyle = 'rgba(205,158,255,0.75)';
      g.fillRect(p.x, p.y, p.w, 3);

      if (p.style === 'corridorFloor' && greyMix < 0.6) {
        g.fillStyle = `rgba(255, 216, 74, ${0.85 * (1 - greyMix)})`;
        g.fillRect(p.x + 335, p.y, p.w - 335, 4);
        g.fillRect(p.x + p.w - 4, p.y, 4, 48);
      }
    }
    g.restore();
  }

  function renderWorld(g) {
    const greyMix = 1 - displaySaturation;

    // 1. Deep Atmospheric Night Sky + Slate Horizon Mist (matches pair_008.00.jpg left half!)
    const sky = g.createLinearGradient(0, 0, 0, H);
    if (greyMix < 0.85) {
      sky.addColorStop(0, '#0d0b15');
      sky.addColorStop(0.55, '#151223');
      sky.addColorStop(1, '#211835');
    } else {
      sky.addColorStop(0, '#090b0f');
      sky.addColorStop(0.52, '#11151b');
      sky.addColorStop(0.82, '#1b2028');
      sky.addColorStop(1, '#12151a');
    }
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);

    // 2. Delicate Star Constellations
    g.save();
    for (const cs of CONSTELLATIONS) {
      const bx = ((cs.cx - camX * cs.parallax) % (W + 320) + (W + 320)) % (W + 320) - 160;
      const by = cs.cy - (camY - 60) * 0.15;
      g.strokeStyle = greyMix > 0.6 ? 'rgba(155,164,178,0.14)' : 'rgba(165,130,245,0.13)';
      g.lineWidth = 1;
      g.beginPath();
      cs.pts.forEach((pt, idx) => {
        if (idx === 0) g.moveTo(bx + pt.dx, by + pt.dy);
        else g.lineTo(bx + pt.dx, by + pt.dy);
      });
      g.closePath();
      g.stroke();
      g.fillStyle = greyMix > 0.6 ? 'rgba(215,220,230,0.48)' : 'rgba(220,196,255,0.45)';
      for (const pt of cs.pts) {
        g.fillRect(bx + pt.dx - 1.5, by + pt.dy - 1.5, 3, 3);
      }
    }
    g.restore();

    // 3. Craggy Stepped Monolith Silhouettes & Sparse Floating Cubes
    g.save();
    for (let i = 0; i < 12; i++) {
      const mx = ((i * 270 - camX * 0.22) % 3240 + 3240) % 3240 - 220;
      const mh = 210 + (i % 4) * 76;
      const mw = 135 + (i % 3) * 58;
      g.fillStyle = greyMix > 0.65 ? 'rgba(16,19,24,0.82)' : 'rgba(28,20,46,0.62)';
      g.fillRect(mx, H - mh, mw, mh);
      g.fillRect(mx + 24, H - mh - 36, mw * 0.55, 40);
    }
    for (const cb of SKY_CUBES) {
      const sx = ((cb.x - camX * cb.parallax) % (W + 240) + (W + 240)) % (W + 240) - 120;
      const sy = cb.y + Math.sin(totalTime * 0.8 + cb.rot) * 6;
      g.save();
      g.translate(sx, sy);
      g.rotate(cb.rot + totalTime * 0.04);
      g.fillStyle = greyMix > 0.65 ? 'rgba(28,31,38,0.45)' : 'rgba(46,32,74,0.38)';
      g.fillRect(-cb.size / 2, -cb.size / 2, cb.size, cb.size);
      g.restore();
    }
    g.restore();

    // 4. Floating Ambient Pixel Motes
    for (const m of MOTES) {
      const sx = ((m.x - camX * m.parallax - totalTime * m.speed * 0.2) % (W + 160) + (W + 160)) % (W + 160) - 80;
      const sy = m.y + Math.sin(totalTime * 1.5 + m.phase) * 7;
      const pulse = 0.35 + 0.35 * Math.sin(totalTime * 2.2 + m.phase);
      g.fillStyle = greyMix > 0.75
        ? `rgba(190,196,208,${pulse * 0.48})`
        : (m.hueGold ? `rgba(255,216,74,${pulse * 0.78})` : `rgba(170,112,255,${pulse * 0.72})`);
      g.fillRect(sx - m.size / 2, sy - m.size / 2, m.size, m.size);
    }

    // Zoomed World-Space Camera Transform (matches monumental framing of sheet.jpg!)
    const shakeX = camShake > 0 ? (Math.sin(totalTime * 68) * camShake) : 0;
    const shakeY = camShake > 0 ? (Math.cos(totalTime * 57) * camShake * 0.7) : 0;
    g.save();
    g.scale(ZOOM, ZOOM);
    g.translate(-(camX + shakeX), -(camY + shakeY));

    // Faint geometric pyramid glyph behind Island B (seen in f_014.jpg!)
    if (greyMix < 0.85) {
      g.save();
      g.globalAlpha = 0.22 * (1 - greyMix);
      g.strokeStyle = '#9b66ff';
      g.lineWidth = 4;
      g.beginPath();
      g.moveTo(1100, 526);
      g.lineTo(1175, 450);
      g.lineTo(1250, 526);
      g.stroke();
      g.restore();
    }

    // Upper structural continuation of the Violet Monolith Pillar
    for (const bp of BG_PILLARS) {
      g.save();
      g.globalAlpha = 0.78;
      g.fillStyle = greyMix > 0.65 ? '#262930' : '#4e2b99';
      g.fillRect(bp.x, bp.y, bp.w, bp.h);
      g.fillStyle = greyMix > 0.65 ? '#3e424d' : '#8452eb';
      g.fillRect(bp.x, bp.y, 10, bp.h);
      g.restore();
    }

    // Hanging Chains
    for (const ch of CHAINS) {
      if (ch.x + 40 < camX || ch.x - 40 > camX + VIEW_W) continue;
      const rect = (greyMix > 0.55 || ch.x > 3400) ? SPRITES.tiles.chainGrey : SPRITES.tiles.chainColor;
      const segH = 105;
      for (let cy = ch.y; cy < ch.y + ch.len; cy += segH - 8) {
        const drawH = Math.min(segH, ch.y + ch.len - cy);
        drawSprite(g, IMAGES.tiles, rect, ch.x, cy, 18, drawH);
      }
    }

    // Corridor Wall Chevrons (>>)
    for (const cv of CHEVRONS) {
      g.save();
      g.globalAlpha = 0.32 * (1 - greyMix * 0.75);
      g.strokeStyle = PAL.gold;
      g.lineWidth = 7;
      for (let k = 0; k < 2; k++) {
        const cx = cv.x + k * 24;
        g.beginPath();
        g.moveTo(cx, cv.y - 22);
        g.lineTo(cx + 20, cv.y);
        g.lineTo(cx, cv.y + 22);
        g.stroke();
      }
      g.restore();
    }

    // Diegetic Sound Towers
    for (const st of SOUND_TOWERS) {
      if (st.x + 160 < camX || st.x - 160 > camX + VIEW_W) continue;
      const stg = Math.min(5, Math.max(st.stage, currentSector));
      const spRect = SPRITES.sound[stg];
      const spH = stg === 0 ? 132 : (stg <= 2 ? 112 : 86);
      const spW = spH * (spRect.w / spRect.h);
      drawSprite(g, IMAGES.sound, spRect, st.x, st.y - spH + 6, spW, spH);
    }

    // Sculpted Platforms
    for (const p of PLATFORMS) {
      if (p.x + p.w < camX - 80 || p.x > camX + VIEW_W + 80) continue;
      drawSculptedPlatform(g, p, greyMix);
    }

    // Decorative Stone/Crystal Rubble Silhouettes
    for (const rb of RUBBLE_PROPS) {
      const rect = (greyMix > 0.55 || rb.x > 3400) ? SPRITES.tiles.rubbleGrey : SPRITES.tiles.rubbleCol;
      drawSprite(g, IMAGES.tiles, rect, rb.x, rb.y - 34, 60, 40);
    }

    // Glowing Golden Corridor Rune Blocks
    for (const gb of GOLD_BLOCKS) {
      if (greyMix < 0.75) {
        g.save();
        g.globalAlpha = 0.28 * (1 - greyMix);
        g.fillStyle = PAL.gold;
        g.fillRect(gb.x - 6, gb.y - 6, gb.size + 12, gb.size + 12);
        g.restore();
      }
      const rect = greyMix > 0.6 ? SPRITES.tiles.greyGold : SPRITES.tiles.goldBlock;
      drawSprite(g, IMAGES.tiles, rect, gb.x, gb.y, gb.size, gb.size);
      g.fillStyle = 'rgba(24,18,32,0.74)';
      g.fillRect(gb.x + 13, gb.y + 13, gb.size - 26, gb.size - 26);
      g.fillStyle = greyMix > 0.6 ? '#8d9098' : PAL.gold;
      g.fillRect(gb.x + 20, gb.y + 20, gb.size - 40, gb.size - 40);
    }

    // Glowing Golden Corridor Ceiling Teeth & Floor Spikes
    for (const ct of CEILING_TEETH) {
      g.save();
      g.fillStyle = greyMix > 0.6 ? '#6c6f78' : PAL.gold;
      const n = Math.max(2, Math.round(ct.w / 34));
      const tw = ct.w / n;
      for (let i = 0; i < n; i++) {
        g.beginPath();
        g.moveTo(ct.x + i * tw, ct.y);
        g.lineTo(ct.x + (i + 0.5) * tw, ct.y + ct.h);
        g.lineTo(ct.x + (i + 1) * tw, ct.y);
        g.closePath();
        g.fill();
      }
      g.restore();
    }

    for (const s of SPIKES) {
      g.save();
      if (greyMix < 0.7) {
        const sg = g.createRadialGradient(s.x + s.w / 2, s.y + s.h, 4, s.x + s.w / 2, s.y + s.h, 64);
        sg.addColorStop(0, `rgba(255,216,74,${0.40 * (1 - greyMix)})`);
        sg.addColorStop(1, 'rgba(255,216,74,0)');
        g.fillStyle = sg;
        g.beginPath();
        g.arc(s.x + s.w / 2, s.y + s.h, 64, Math.PI, Math.PI * 2);
        g.fill();
      }
      g.fillStyle = greyMix > 0.6 ? '#747780' : PAL.gold;
      for (let i = 0; i < 2; i++) {
        const tx = s.x + i * (s.w / 2);
        const tw = s.w / 2;
        g.beginPath();
        g.moveTo(tx + 2, s.y + s.h);
        g.lineTo(tx + tw / 2, s.y);
        g.lineTo(tx + tw - 2, s.y + s.h);
        g.closePath();
        g.fill();
      }
      g.restore();
    }

    // Floating Diamond Crystals (crisp black-outlined Row-2 sprites — zero white halo!)
    for (const gm of gems) {
      if (gm.taken) continue;
      if (gm.x + 60 < camX || gm.x - 60 > camX + VIEW_W) continue;
      const bob = Math.sin(totalTime * 3.4 + gm.x * 0.02) * 6;
      const isGrey = (gm.kind === 'grey' || greyMix > 0.65);
      const rect = isGrey
        ? SPRITES.tiles.gemGrey
        : (gm.kind === 'gold' ? SPRITES.tiles.gemGold : SPRITES.tiles.gemViolet);
      if (!isGrey) {
        g.save();
        const rg = g.createRadialGradient(gm.x, gm.y + bob, 4, gm.x, gm.y + bob, 34);
        rg.addColorStop(0, gm.kind === 'gold' ? 'rgba(255,216,74,0.42)' : 'rgba(168,108,255,0.42)');
        rg.addColorStop(1, 'rgba(20,18,28,0)');
        g.fillStyle = rg;
        g.beginPath();
        g.arc(gm.x, gm.y + bob, 34, 0, Math.PI * 2);
        g.fill();
        g.restore();
      }
      drawSprite(g, IMAGES.tiles, rect, gm.x - 19, gm.y - 26 + bob, 38, 52);
    }

    // Monumental Threshold Arches
    for (let i = 0; i < SECTORS.length; i++) {
      const sec = SECTORS[i];
      const ax = sec.archX;
      const ay = sec.archY;
      if (ax + 160 < camX || ax - 160 > camX + VIEW_W) continue;

      const archW = 228, archH = 224;
      const alreadyCrossed = archesTriggered[i];
      const isFinalDoor = (i === 4);
      const localGrey = isFinalDoor ? 1.0 : Math.min(1, Math.max(greyMix, alreadyCrossed ? 0.82 : i * 0.24));

      if (!isFinalDoor && localGrey < 0.92) {
        g.save();
        const glowR = 140 + Math.sin(totalTime * 4.2 + i) * 12;
        const grad = g.createRadialGradient(ax, ay - 98, 12, ax, ay - 98, glowR);
        grad.addColorStop(0, `rgba(255,222,96,${0.52 * (1 - localGrey * 0.7)})`);
        grad.addColorStop(0.55, `rgba(135,74,242,${0.26 * (1 - localGrey * 0.8)})`);
        grad.addColorStop(1, 'rgba(20,18,28,0)');
        g.fillStyle = grad;
        g.beginPath();
        g.arc(ax, ay - 98, glowR, 0, Math.PI * 2);
        g.fill();
        g.restore();
      }

      if (localGrey < 0.99) {
        drawSprite(g, IMAGES.tiles, SPRITES.tiles.archColor, ax - archW / 2, ay - archH + 8, archW, archH, false, 1 - localGrey);
      }
      if (localGrey > 0.01) {
        drawSprite(g, IMAGES.tiles, SPRITES.tiles.archGrey, ax - archW / 2, ay - archH + 8, archW, archH, false, localGrey);
      }

      if (!isFinalDoor && !alreadyCrossed) {
        g.save();
        g.strokeStyle = localGrey > 0.7 ? 'rgba(235,235,245,0.55)' : 'rgba(255,242,180,0.82)';
        g.lineWidth = 2.4;
        for (const side of [-1, 1]) {
          g.beginPath();
          const bx = ax + side * 46;
          g.moveTo(bx, ay - 28);
          g.lineTo(bx - side * (6 + Math.sin(totalTime * 19 + side) * 5), ay - 76);
          g.lineTo(bx + side * 4, ay - 122);
          g.stroke();
        }
        g.restore();
      }
    }

    // Tapered Golden Dash Ribbon Trail
    if (dashTrail.length > 1) {
      g.save();
      for (let i = 1; i < dashTrail.length; i++) {
        const a = dashTrail[i - 1];
        const b = dashTrail[i];
        const t = b.life / b.maxLife;
        g.strokeStyle = displaySaturation > 0.25
          ? `rgba(255, 216, 74, ${t * 0.82})`
          : `rgba(180, 184, 194, ${t * 0.55})`;
        g.lineWidth = t * 24;
        g.lineCap = 'round';
        g.beginPath();
        g.moveTo(a.x, a.y);
        g.lineTo(b.x, b.y);
        g.stroke();
      }
      g.restore();
    }

    for (const ai of afterimages) {
      g.save();
      g.globalAlpha = (ai.life / ai.maxLife) * 0.42;
      drawSprite(g, IMAGES.player, SPRITES.player.dash, ai.x - 22, ai.y - 8, 92, 94, ai.facing < 0);
      g.restore();
    }

    // Player Character
    if (gameState !== 'reset') {
      let useImg = IMAGES.player;
      let pose = SPRITES.player.idle;
      let drawW = 68, drawH = 96;
      let offX = -11, offY = -10;

      if (gameState === 'end') {
        pose = stateTimer > 1.3 ? SPRITES.player.monoSit2 : SPRITES.player.monoSit1;
        drawW = 66; drawH = 86; offX = -10; offY = 0;
      } else if (gameState === 'walk' || displaySaturation < 0.08) {
        useImg = IMAGES.tiles;
        const wf = Math.floor(player.animTime) % 2;
        pose = Math.abs(player.vx) > 12
          ? (wf === 0 ? SPRITES.tiles.stoneRun1 : SPRITES.tiles.stoneRun2)
          : SPRITES.tiles.stoneRun1;
        drawW = 78; drawH = 92; offX = -16; offY = -6;
      } else if (player.dashTimer > 0) {
        pose = SPRITES.player.dash;
        drawW = 98; drawH = 98; offX = -26; offY = -10;
      } else if (player.gliding) {
        pose = (Math.floor(totalTime * 11) % 2 === 0) ? SPRITES.player.glide1 : SPRITES.player.glide2;
        drawW = 104; drawH = 66; offX = -29; offY = 10;
      } else if (abilities.wall && player.onWall !== 0 && !player.onGround && player.vy > 0) {
        pose = SPRITES.player.wall;
        drawW = 64; drawH = 94; offX = -9; offY = -8;
      } else if (!player.onGround) {
        if (currentSector >= 3) {
          useImg = IMAGES.tiles;
          pose = SPRITES.tiles.stoneRun2;
          drawW = 78; drawH = 92; offX = -16; offY = -6;
        } else {
          pose = player.doubleUsed ? SPRITES.player.djump : SPRITES.player.run2;
          drawW = 80; drawH = 98; offX = -17; offY = -12;
        }
      } else if (Math.abs(player.vx) > 18) {
        const f = Math.floor(player.animTime) % 2;
        if (currentSector === 0) {
          pose = f === 0 ? SPRITES.player.run1 : SPRITES.player.run2;
          drawW = 78; drawH = 94; offX = -16; offY = -8;
        } else if (currentSector === 1) {
          pose = f === 0 ? SPRITES.player.run1 : SPRITES.player.drain1;
          drawW = 74; drawH = 92; offX = -14; offY = -6;
        } else if (currentSector === 2) {
          pose = f === 0 ? SPRITES.player.drain2 : SPRITES.player.drain3;
          drawW = 66; drawH = 92; offX = -10; offY = -6;
        } else {
          useImg = IMAGES.tiles;
          pose = f === 0 ? SPRITES.tiles.stoneRun1 : SPRITES.tiles.stoneRun2;
          drawW = 78; drawH = 92; offX = -16; offY = -6;
        }
      } else {
        const idleBySec = [
          SPRITES.player.idle,
          SPRITES.player.drain0,
          SPRITES.player.drain2,
          SPRITES.player.drain4
        ];
        pose = idleBySec[currentSector] || SPRITES.player.idle;
      }

      // Swirling Golden Aura Sphere & Crescent Arcs (matches f_009 & f_020!)
      if (player.dashTimer > 0 || (displaySaturation > 0.35 && !player.onGround && Math.abs(player.vx) > 320)) {
        const cx = player.x + player.w / 2;
        const cy = player.y + player.h * 0.45;
        g.save();
        const auraR = player.dashTimer > 0 ? 56 : 44;
        const ag = g.createRadialGradient(cx, cy, 8, cx, cy, auraR);
        ag.addColorStop(0, `rgba(255,238,148,${player.dashTimer > 0 ? 0.58 : 0.24})`);
        ag.addColorStop(0.7, `rgba(255,216,74,${player.dashTimer > 0 ? 0.30 : 0.10})`);
        ag.addColorStop(1, 'rgba(255,216,74,0)');
        g.fillStyle = ag;
        g.beginPath();
        g.arc(cx, cy, auraR, 0, Math.PI * 2);
        g.fill();

        if (player.dashTimer > 0 && displaySaturation > 0.2) {
          g.strokeStyle = PAL.goldBright;
          g.lineWidth = 3.5;
          for (let k = 0; k < 2; k++) {
            const a0 = totalTime * 18 + k * Math.PI;
            g.beginPath();
            g.arc(cx, cy, 45, a0, a0 + 1.95);
            g.stroke();
          }
        }
        g.restore();
      }

      g.save();
      const footX = player.x + player.w / 2;
      const footY = player.y + player.h;
      g.translate(footX, footY);
      g.scale(player.scaleX, player.scaleY);
      g.translate(-footX, -footY);
      const ok = drawSprite(
        g, useImg, pose,
        player.x + offX, player.y + offY, drawW, drawH,
        player.facing < 0
      );
      if (!ok) {
        g.fillStyle = displaySaturation > 0.25 ? PAL.gold : '#80828a';
        g.fillRect(player.x, player.y, player.w, player.h);
      }
      g.restore();

      if (gameState === 'title') {
        g.save();
        g.font = 'bold 15px "Courier New", Courier, monospace';
        g.textAlign = 'center';
        g.fillStyle = PAL.gold;
        g.fillText('[SPACE]', player.x + player.w / 2, player.y - 22 + Math.sin(totalTime * 4) * 3);
        g.restore();
      } else if (gameState === 'end' && stateTimer > 1.2) {
        g.save();
        g.globalAlpha = Math.min(0.48, (stateTimer - 1.2) * 0.4);
        g.font = 'bold 14px "Courier New", Courier, monospace';
        g.textAlign = 'center';
        g.fillStyle = '#9a9ca6';
        g.fillText('[R]', player.x + player.w / 2, player.y - 20);
        g.restore();
      }
    }

    for (const o of detachedOrbs) {
      const t = o.life / o.maxLife;
      g.save();
      g.globalAlpha = t;
      const rg = g.createRadialGradient(o.x, o.y, 2, o.x, o.y, 28);
      rg.addColorStop(0, '#ffffff');
      rg.addColorStop(0.45, o.color);
      rg.addColorStop(1, 'rgba(255,216,74,0)');
      g.fillStyle = rg;
      g.beginPath();
      g.arc(o.x, o.y, 28, 0, Math.PI * 2);
      g.fill();
      g.restore();
    }

    for (const sw of shockwaves) {
      g.save();
      g.globalAlpha = Math.max(0, sw.life);
      g.strokeStyle = sw.color || PAL.gold;
      g.lineWidth = sw.fillSphere ? 4.5 : 3.2;
      g.beginPath();
      g.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      g.stroke();
      if (sw.fillSphere) {
        const rg = g.createRadialGradient(sw.x, sw.y, 0, sw.x, sw.y, sw.r);
        rg.addColorStop(0, 'rgba(255,248,196,0.68)');
        rg.addColorStop(0.55, 'rgba(255,216,74,0.30)');
        rg.addColorStop(1, 'rgba(255,216,74,0)');
        g.fillStyle = rg;
        g.fill();
      }
      g.restore();
    }

    for (const p of particles) {
      g.save();
      g.globalAlpha = Math.max(0, p.life / p.maxLife);
      g.fillStyle = p.color;
      if (p.round) {
        g.beginPath();
        g.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
        g.fill();
      } else {
        g.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
      g.restore();
    }

    g.restore();
  }

  function renderMinimalGlyphs(g) {
    const inspectHold = keys['Tab'] ? 0.35 : 0;
    const alpha = Math.max(inspectHold, hudWalkDissolve);

    if (alpha > 0.01 && gameState !== 'title') {
      g.save();
      g.globalAlpha = alpha;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = 'bold 22px "Courier New", Courier, monospace';

      ABILITY_DEFS.forEach((ab, i) => {
        const bx = HUD_LAYOUT.startX + i * (HUD_LAYOUT.boxW + HUD_LAYOUT.gap);
        const by = HUD_LAYOUT.startY;
        const bw = HUD_LAYOUT.boxW;
        const bh = HUD_LAYOUT.boxH;
        const active = abilities[ab.key] && gameState !== 'walk' && gameState !== 'end';
        const flash = hudFlash[ab.key] || 0;

        g.fillStyle = active ? 'rgba(14, 12, 22, 0.84)' : 'rgba(18, 17, 24, 0.44)';
        g.fillRect(bx, by, bw, bh);

        if (flash > 0) {
          g.fillStyle = active
            ? `rgba(255, 216, 74, ${flash * 0.25})`
            : `rgba(255, 216, 74, ${flash * 0.45})`;
          g.fillRect(bx, by, bw, bh);
        }

        g.lineWidth = active ? 2.8 : 1.8;
        g.strokeStyle = active ? '#f2f2f2' : 'rgba(105, 102, 118, 0.52)';
        g.strokeRect(bx, by, bw, bh);

        g.fillStyle = active ? '#f2f2f2' : 'rgba(118, 115, 132, 0.62)';
        g.fillText(ab.label, bx + bw / 2, by + bh / 2 + 1);

        if (!active) {
          const cr = hudCracks[ab.key];
          if (cr) {
            g.strokeStyle = flash > 0.15 ? PAL.gold : 'rgba(130, 126, 146, 0.55)';
            g.lineWidth = 1.6;
            g.beginPath();
            cr.forEach((pt, idx) => {
              if (idx === 0) g.moveTo(bx + pt.x, by + pt.y);
              else g.lineTo(bx + pt.x, by + pt.y);
            });
            g.stroke();
          }
          g.strokeStyle = flash > 0.15 ? PAL.gold : 'rgba(150, 146, 165, 0.72)';
          g.lineWidth = 2.5;
          g.beginPath();
          g.moveTo(bx + 44, by + bh / 2);
          g.lineTo(bx + bw - 44, by + bh / 2);
          g.stroke();
        }
      });
      g.restore();
    }

    for (const s of screenShards) {
      g.save();
      g.globalAlpha = Math.max(0, s.life / s.maxLife);
      g.translate(s.x, s.y);
      g.rotate(s.rot);
      g.fillStyle = s.color;
      g.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
      g.restore();
    }

    if (gameState === 'title') {
      g.save();
      g.textAlign = 'center';
      g.fillStyle = PAL.gold;
      g.font = 'bold 46px "Courier New", Courier, monospace';
      g.fillText('THAT ONE TEAM', W / 2, 138);
      g.restore();
    }

    if (paused) {
      g.save();
      g.fillStyle = 'rgba(8, 8, 12, 0.45)';
      g.fillRect(0, 0, W, H);
      g.textAlign = 'center';
      g.font = 'bold 20px "Courier New", Courier, monospace';
      g.fillStyle = '#f2f2f2';
      g.fillText('[P] RESUME    [R] RETRY', W / 2, H / 2);
      g.restore();
    }
  }

  function renderPostFX(g) {
    const vig = g.createRadialGradient(W / 2, H / 2, H * 0.38, W / 2, H / 2, W * 0.68);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, (gameState === 'walk' || gameState === 'end') ? 'rgba(0,0,0,0.58)' : 'rgba(6,5,12,0.38)');
    g.fillStyle = vig;
    g.fillRect(0, 0, W, H);
  }

  function render() {
    renderWorld(sctx);

    ctx.save();
    const satPct = Math.round(Math.max(0, Math.min(1, displaySaturation)) * 100);
    const brightPct = Math.round(100 - (1 - displaySaturation) * 6);
    ctx.filter = `saturate(${satPct}%) brightness(${brightPct}%)`;
    ctx.drawImage(sceneCanvas, 0, 0);
    ctx.restore();

    renderMinimalGlyphs(ctx);
    renderPostFX(ctx);
  }

  window.__game = {
    get state() {
      const sec = SECTORS[currentSector];
      return {
        mode: gameState,
        paused,
        level: currentSector,
        saturation: Number(displaySaturation.toFixed(3)),
        abilities: { ...abilities },
        lastTaken: lastTakenAbility,
        resets: resetsCount,
        time: Number(totalTime.toFixed(2)),
        assetsReady: assetsLoaded >= totalAssets,
        player: {
          x: Math.round(player.x),
          y: Math.round(player.y),
          w: player.w,
          h: player.h,
          vx: Math.round(player.vx),
          vy: Math.round(player.vy),
          onGround: player.onGround,
          onWall: player.onWall,
          doubleUsed: player.doubleUsed,
          dashCooldown: Number(player.dashCooldown.toFixed(2)),
          dashTimer: Number(player.dashTimer.toFixed(2)),
          gliding: player.gliding
        },
        exit: { x: sec.archX, y: sec.archY },
        arches: SECTORS.map((s, idx) => ({ index: idx, x: s.archX, y: s.archY, crossed: archesTriggered[idx] })),
        platforms: PLATFORMS.map(p => ({ x: p.x, y: p.y, w: p.w, h: p.h, style: p.style })),
        spikes: SPIKES.map(s => ({ x: s.x, y: s.y, w: s.w, h: s.h }))
      };
    }
  };

  let lastTs = performance.now();
  function frame(ts) {
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

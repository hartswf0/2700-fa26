<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waymo Training</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #010603;
    font-family: "SF Mono", "Menlo", "Monaco", "Consolas", "Liberation Mono", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;
    background: #020a05;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: default;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script>
(() => {
  'use strict';

  const W = 1280;
  const H = 720;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // URL flags (?autostart skips boot prompt, ?seed=N sets deterministic PRNG)
  const params = new URLSearchParams(window.location.search);
  const AUTOSTART = params.has('autostart');
  const INITIAL_SEED = (parseInt(params.get('seed') || '7', 10) || 7) >>> 0;
  let rngState = INITIAL_SEED;
  function rand() {
    rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0;
    return rngState / 4294967296;
  }

  const PAL = {
    bg: '#020a05',
    fg: '#46f28a',
    mint: '#8effbe',
    acc: '#e8f5ec',
    tailRed: '#ff3824',
  };

  // Tight interior sprite bounds inside car_pedestrian_cyclist_sprites.png (1024x1024)
  // Cropped strictly inside silhouette edges so zero CAD registration ticks bleed in.
  const RAW_SPRITES = {
    ped1:     { x: 52,  y: 435, w: 66,  h: 158 },
    ped2:     { x: 154, y: 434, w: 70,  h: 159 },
    ped3:     { x: 252, y: 435, w: 64,  h: 158 },
    ped4:     { x: 338, y: 435, w: 67,  h: 158 },
    ped5:     { x: 432, y: 436, w: 68,  h: 157 },
    ped6:     { x: 686, y: 435, w: 66,  h: 158 },
    ped7:     { x: 791, y: 434, w: 62,  h: 159 },
    cycSide:  { x: 48,  y: 795, w: 175, h: 180 },
    cycRear:  { x: 312, y: 801, w: 63,  h: 174 },
    cycDiagL: { x: 647, y: 802, w: 116, h: 175 },
    cycDiagR: { x: 842, y: 801, w: 113, h: 176 },
  };

  // 10 Moral Machine / Philippa Foot calibration scenarios (matching spec.json & f_003.jpg)
  const SCENARIOS = [
    {
      id: 1,
      line1: 'wet crosswalk ahead. left: 1 cyclist.',
      line2: 'right: 3 pedestrians crossing late.',
      optA: 'swerve left',
      optB: 'stay',
      laneA: -1.85,
      laneB: 1.55,
      leftActors: [{ kind: 'cycRear', wx: -2.55, dz: 0.0 }],
      rightActors: [
        { kind: 'ped3', wx: 1.35, dz: -0.4 },
        { kind: 'ped1', wx: 2.35, dz: 0.2 },
        { kind: 'ped6', wx: 3.25, dz: 0.7 },
      ],
    },
    {
      id: 2,
      line1: 'sensor glare at corner. left: concrete barrier.',
      line2: 'right: 2 commuters in crosswalk.',
      optA: 'swerve left',
      optB: 'stay',
      laneA: -2.05,
      laneB: 1.25,
      leftActors: [{ kind: 'ped7', wx: -4.45, dz: 0.4 }],
      rightActors: [
        { kind: 'ped3', wx: 1.55, dz: -0.2 },
        { kind: 'ped5', wx: 2.65, dz: 0.4 },
      ],
    },
    {
      id: 3,
      line1: 'hydroplane risk. left: 3 pedestrians on walk.',
      line2: 'right: clear wet turn lane.',
      optA: 'hold right',
      optB: 'swerve left',
      laneA: 1.45,
      laneB: -1.75,
      leftActors: [
        { kind: 'ped1', wx: -3.55, dz: -0.3 },
        { kind: 'ped2', wx: -2.35, dz: 0.1 },
        { kind: 'ped4', wx: -1.35, dz: 0.5 },
      ],
      rightActors: [{ kind: 'ped6', wx: 4.55, dz: 0.8 }],
      parkedCar: { wx: 2.85, dz: 5.5 },
    },
    {
      id: 4,
      line1: 'brakes failed. left: 2 pedestrians.',
      line2: 'right: 1 passenger (you).',
      optA: 'swerve left',
      optB: 'stay',
      laneA: -1.65,
      laneB: 1.55,
      leftActors: [
        { kind: 'ped5', wx: -3.15, dz: -0.2 },
        { kind: 'ped2', wx: -2.05, dz: 0.4 },
      ],
      rightActors: [{ kind: 'ped7', wx: 4.35, dz: 0.3 }],
    },
    {
      id: 5,
      line1: 'red signal runner. left: 3 pedestrians crossing.',
      line2: 'right: clear lane past parked sedan.',
      optA: 'hold center-right',
      optB: 'swerve left',
      laneA: 0.25,
      laneB: -1.85,
      leftActors: [
        { kind: 'ped2', wx: -4.95, dz: -3.2 },
        { kind: 'ped1', wx: -2.65, dz: 1.2 },
        { kind: 'ped3', wx: -1.95, dz: 1.8 },
        { kind: 'ped4', wx: -1.25, dz: 1.4 },
      ],
      rightActors: [{ kind: 'ped6', wx: 5.25, dz: -1.5 }],
      parkedCar: { wx: 2.45, dz: 5.8 },
    },
    {
      id: 6,
      line1: 'narrow lane split. left: open wet asphalt.',
      line2: 'right: 3 pedestrians near bus stop.',
      optA: 'swerve left',
      optB: 'stay',
      laneA: -1.85,
      laneB: 1.45,
      leftActors: [{ kind: 'ped2', wx: -4.65, dz: 0.5 }],
      rightActors: [
        { kind: 'ped1', wx: 1.95, dz: -0.4 },
        { kind: 'ped5', wx: 2.85, dz: 0.1 },
        { kind: 'ped6', wx: 3.75, dz: 0.6 },
      ],
    },
    {
      id: 7,
      line1: 'slick intersection. left: 2 jaywalkers.',
      line2: 'right: 1 cyclist in bike lane.',
      optA: 'hold center',
      optB: 'swerve right',
      laneA: -0.35,
      laneB: 1.95,
      leftActors: [
        { kind: 'ped4', wx: -3.25, dz: -0.2 },
        { kind: 'ped2', wx: -2.25, dz: 0.3 },
      ],
      rightActors: [{ kind: 'cycDiagL', wx: 3.35, dz: 0.2 }],
    },
    {
      id: 8,
      line1: 'sudden stall ahead. left: 1 pedestrian.',
      line2: 'right: 2 passengers in stalled cab.',
      optA: 'swerve left',
      optB: 'stay',
      laneA: -1.75,
      laneB: 1.15,
      leftActors: [{ kind: 'ped1', wx: -3.45, dz: 0.0 }],
      rightActors: [{ kind: 'ped6', wx: 4.45, dz: 0.4 }],
      parkedCar: { wx: 2.45, dz: 1.2 },
    },
    {
      id: 9,
      line1: 'blind wet corner. left: clear median lane.',
      line2: 'right: 3 late-night pedestrians.',
      optA: 'swerve left',
      optB: 'stay',
      laneA: -0.95,
      laneB: 1.45,
      leftActors: [],
      rightActors: [
        { kind: 'ped1', wx: 2.05, dz: -8.6 },
        { kind: 'ped6', wx: 2.95, dz: -9.1 },
        { kind: 'ped5', wx: 3.35, dz: -8.2 },
      ],
    },
    {
      id: 10,
      line1: 'final calibration. left: 2 pedestrians at curb.',
      line2: 'right: 1 passenger (you).',
      optA: 'swerve left',
      optB: 'stay',
      laneA: -1.55,
      laneB: 0.85,
      leftActors: [
        { kind: 'ped4', wx: -3.65, dz: -0.2 },
        { kind: 'ped1', wx: -2.65, dz: 0.4 },
      ],
      rightActors: [
        { kind: 'ped5', wx: 2.65, dz: -0.3 },
        { kind: 'ped6', wx: 3.55, dz: 0.3 },
      ],
    },
  ];

  // Load & sanitize assets
  const imgStreet = new Image();
  let streetLoaded = false;
  imgStreet.onload = () => { streetLoaded = true; };
  imgStreet.src = '../assets/street_scene_3_versions.png';

  const imgSpritesRaw = new Image();
  let cleanSpritesCanvas = null;
  imgSpritesRaw.onload = () => {
    cleanSpritesCanvas = sanitizeSpriteSheet(imgSpritesRaw);
  };
  imgSpritesRaw.src = '../assets/car_pedestrian_cyclist_sprites.png';

  function sanitizeSpriteSheet(img) {
    const off = document.createElement('canvas');
    off.width = img.width;
    off.height = img.height;
    const octx = off.getContext('2d');
    octx.drawImage(img, 0, 0);
    const id = octx.getImageData(0, 0, off.width, off.height);
    const d = id.data;
    const w = off.width;
    const h = off.height;

    // Pass 1: Strip studio-grey islands (#d8d8d8 inside bike spokes) and preserve
    // crisp horizontal lidar scan bands inside holographic silhouettes (f_021 & f_033).
    for (let y = 0; y < h; y++) {
      const band = y % 5;
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        const a = d[i + 3];
        if (a < 22) {
          d[i + 3] = 0;
          continue;
        }
        const r = d[i];
        const g = d[i + 1];
        const b = d[i + 2];
        const maxC = Math.max(r, g, b);
        const minC = Math.min(r, g, b);
        if (maxC - minC < 26 && g > 135 && g - r < 18) {
          d[i + 3] = 0;
          continue;
        }
        if (y >= 420) {
          const lum = (r * 0.2 + g * 0.65 + b * 0.15) / 255;
          if (band === 0 || band === 1) {
            // Bright luminous mint-white lidar scan bar
            d[i]     = Math.min(255, Math.round(165 + lum * 88));
            d[i + 1] = 255;
            d[i + 2] = Math.min(255, Math.round(198 + lum * 55));
            d[i + 3] = Math.min(255, Math.round(a * 1.06));
          } else if (band === 2 || band === 3) {
            // Rich phosphor emerald body
            d[i]     = Math.min(255, Math.round(82 + lum * 85));
            d[i + 1] = Math.min(255, Math.round(218 + lum * 36));
            d[i + 2] = Math.min(255, Math.round(138 + lum * 62));
            d[i + 3] = Math.min(255, Math.round(a * 0.94));
          } else {
            // Subtle dark translucent scanline groove
            d[i]     = Math.round(48 + lum * 55);
            d[i + 1] = Math.round(168 + lum * 55);
            d[i + 2] = Math.round(102 + lum * 45);
            d[i + 3] = Math.round(a * 0.62);
          }
        }
      }
    }
    octx.putImageData(id, 0, 0);
    return off;
  }

  // Audio: Lyria loop + procedural WebAudio (key clack, CRT zoom tone, EV hum, tire swerve)
  const bgm = new Audio('../assets/bgm_loop.mp3');
  bgm.loop = true;
  bgm.volume = 0.36;
  let audioUnlocked = false;
  let audioCtx = null;
  let evHumGain = null;
  let evOsc1 = null;
  let evOsc2 = null;

  function unlockAudio() {
    if (!audioUnlocked) {
      audioUnlocked = true;
      bgm.play().catch(() => {});
    }
    if (!audioCtx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          audioCtx = new AC();
          evOsc1 = audioCtx.createOscillator();
          evOsc2 = audioCtx.createOscillator();
          evHumGain = audioCtx.createGain();
          evOsc1.type = 'sine';
          evOsc2.type = 'triangle';
          evOsc1.frequency.value = 98;
          evOsc2.frequency.value = 196.5;
          evHumGain.gain.value = 0.0001;
          evOsc1.connect(evHumGain);
          evOsc2.connect(evHumGain);
          evHumGain.connect(audioCtx.destination);
          evOsc1.start();
          evOsc2.start();
        }
      } catch (_) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }

  function playKeyClack(freq = 720) {
    if (!audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(170, t + 0.04);
      g.gain.setValueAtTime(0.045, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.05);
    } catch (_) {}
  }

  function playCRTBreachTone() {
    if (!audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(440, t);
      osc.frequency.exponentialRampToValueAtTime(1180, t + 0.22);
      osc.frequency.exponentialRampToValueAtTime(112, t + 0.88);
      g.gain.setValueAtTime(0.04, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.92);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.95);
    } catch (_) {}
  }

  function playWetSwerveWhoosh() {
    if (!audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      const len = Math.floor(audioCtx.sampleRate * 0.24);
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.sin((i / len) * Math.PI);
      const src = audioCtx.createBufferSource();
      const flt = audioCtx.createBiquadFilter();
      const g = audioCtx.createGain();
      flt.type = 'bandpass';
      flt.frequency.value = 920;
      flt.Q.value = 1.4;
      g.gain.value = 0.032;
      src.buffer = buf;
      src.connect(flt);
      flt.connect(g);
      g.connect(audioCtx.destination);
      src.start(t);
    } catch (_) {}
  }

  // World layout constants for 3D wet-street corridor
  const JUNCTION_SPACING = 22.0;
  const FIRST_JUNCTION_Z = 24.0;
  const TOTAL_DRIVE_Z = FIRST_JUNCTION_Z + SCENARIOS.length * JUNCTION_SPACING + 12.0;
  const DRIVE_SPEED = 29.8; // Reaches completion cleanly around ~7.4s of replay

  // Pre-build procedural 3D corridor blocks, trees, streetlamps, and wet puddle patches
  const BUILDINGS = [];
  const TREES = [];
  const LAMPS = [];
  const PUDDLES = [];
  const SPRAY = [];

  function initStreetGeometry() {
    rngState = INITIAL_SEED;
    BUILDINGS.length = 0;
    TREES.length = 0;
    LAMPS.length = 0;
    PUDDLES.length = 0;

    const maxZ = TOTAL_DRIVE_Z + 130;
    for (let z = 4; z < maxZ; z += JUNCTION_SPACING) {
      // Buildings flanking each block between cross-streets
      for (const side of [-1, 1]) {
        const z0 = z + 3.2;
        const z1 = z + JUNCTION_SPACING - 3.2;
        const h = 15 + rand() * 13;
        const shade = Math.floor(rand() * 3);
        const winSeed = (rand() * 10000) | 0;
        BUILDINGS.push({ side, z0, z1, h, shade, winSeed });

        // 2 low-poly faceted trees per block side (matching f_009, f_033, f_039)
        TREES.push({
          wx: side * 6.05,
          wz: z + 6.5 + rand() * 1.4,
          r: 1.22 + rand() * 0.28,
          h: 3.6 + rand() * 0.55,
          lidarTag: rand() > 0.32,
        });
        TREES.push({
          wx: side * 6.12,
          wz: z + 14.2 + rand() * 1.4,
          r: 1.15 + rand() * 0.30,
          h: 3.4 + rand() * 0.6,
          lidarTag: rand() > 0.38,
        });

        // Overhead streetlamps at block corners
        LAMPS.push({ side, wz: z + 3.6 });
        LAMPS.push({ side, wz: z + 14.8 });
      }
    }

    for (let z = 2; z < maxZ; z += 4.2) {
      PUDDLES.push({
        wx: (rand() - 0.5) * 7.6,
        wz: z + rand() * 3.0,
        rw: 0.9 + rand() * 1.5,
        rl: 1.8 + rand() * 3.2,
        dark: 0.22 + rand() * 0.26,
      });
    }
  }
  initStreetGeometry();

  // State machine
  const S = {
    phase: AUTOSTART ? 'q' : 'boot', // boot | q | ans | reveal | replay | complete
    qIndex: 0,
    cursorChoice: 'A',
    hoverChoice: null,
    answers: [],
    ansTimer: 0,
    revealTimer: 0,
    revealDur: 0.95,
    paused: false,
    camZ: 0,
    camX: 0,
    carX: -0.25,
    carPrevX: -0.25,
    carVelX: 0,
    carYaw: 0,
    carRoll: 0,
    lastJunctionSwerved: -1,
    t: 0,
  };

  function resetCalibration(skipBoot = true) {
    S.phase = skipBoot ? 'q' : 'boot';
    S.qIndex = 0;
    S.cursorChoice = 'A';
    S.hoverChoice = null;
    S.answers = [];
    S.ansTimer = 0;
    S.revealTimer = 0;
    S.paused = false;
    S.camZ = 0;
    S.camX = 0;
    S.carX = -0.25;
    S.carPrevX = -0.25;
    S.carVelX = 0;
    S.carYaw = 0;
    S.carRoll = 0;
    S.lastJunctionSwerved = -1;
    SPRAY.length = 0;
    initStreetGeometry();
  }

  function submitAnswer(choice) {
    if (S.phase !== 'q') return;
    const sc = SCENARIOS[S.qIndex];
    S.cursorChoice = choice;
    S.answers.push({
      id: sc.id,
      choice,
      optText: choice === 'A' ? sc.optA : sc.optB,
      targetLane: choice === 'A' ? sc.laneA : sc.laneB,
    });
    playKeyClack(choice === 'A' ? 780 : 640);
    S.phase = 'ans';
    S.ansTimer = 0.085;
  }

  function stepJunction(delta) {
    if (S.phase !== 'replay' && S.phase !== 'complete') return;
    const curIdx = Math.round((S.camZ - 6) / JUNCTION_SPACING);
    const nextIdx = Math.max(0, Math.min(SCENARIOS.length - 1, curIdx + delta));
    S.phase = 'replay';
    S.camZ = FIRST_JUNCTION_Z + nextIdx * JUNCTION_SPACING - 15.0;
    playKeyClack(690);
  }

  const CLICK_ZONES = [];

  window.addEventListener('keydown', (e) => {
    unlockAudio();
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
      e.preventDefault();
    }

    if (S.phase === 'boot') {
      if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyA' || e.code === 'KeyB') {
        playKeyClack(820);
        S.phase = 'q';
      }
      return;
    }

    if (S.phase === 'q') {
      if (e.code === 'KeyA' || e.code === 'Digit1') {
        submitAnswer('A');
      } else if (e.code === 'KeyB' || e.code === 'Digit2') {
        submitAnswer('B');
      } else if (e.code === 'ArrowLeft') {
        S.cursorChoice = 'A';
        playKeyClack(540);
      } else if (e.code === 'ArrowRight') {
        S.cursorChoice = 'B';
        playKeyClack(580);
      } else if (e.code === 'Enter' || e.code === 'Space') {
        submitAnswer(S.cursorChoice);
      }
      return;
    }

    if (S.phase === 'replay') {
      if (e.code === 'Space') {
        S.paused = !S.paused;
        playKeyClack(S.paused ? 520 : 740);
      } else if (e.code === 'ArrowLeft') {
        stepJunction(-1);
      } else if (e.code === 'ArrowRight') {
        stepJunction(1);
      } else if (e.code === 'KeyR') {
        playKeyClack(780);
        resetCalibration(true);
      }
      return;
    }

    if (S.phase === 'complete') {
      if (e.code === 'KeyR' || e.code === 'Enter') {
        playKeyClack(800);
        resetCalibration(true);
      } else if (e.code === 'ArrowLeft') {
        stepJunction(-1);
      }
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * W;
    const my = ((e.clientY - rect.top) / rect.height) * H;
    let found = null;
    for (const z of CLICK_ZONES) {
      if (mx >= z.x && mx <= z.x + z.w && my >= z.y && my <= z.y + z.h) {
        found = z.id;
        break;
      }
    }
    S.hoverChoice = found;
    canvas.style.cursor = found ? 'pointer' : 'default';
  });

  canvas.addEventListener('pointerdown', (e) => {
    unlockAudio();
    const rect = canvas.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * W;
    const my = ((e.clientY - rect.top) / rect.height) * H;

    if (S.phase === 'boot') {
      playKeyClack(820);
      S.phase = 'q';
      return;
    }
    for (const z of CLICK_ZONES) {
      if (mx >= z.x && mx <= z.x + z.w && my >= z.y && my <= z.y + z.h) {
        if (z.id === 'A' || z.id === 'B') submitAnswer(z.id);
        else if (z.id === 'R') {
          playKeyClack(800);
          resetCalibration(true);
        }
        return;
      }
    }
  });

  // Expose deterministic state for play.mjs & automated verification
  window.__game = {
    get state() {
      const activeJ = Math.min(
        SCENARIOS.length,
        Math.max(1, Math.floor((S.camZ + 12 - FIRST_JUNCTION_Z) / JUNCTION_SPACING) + 1)
      );
      return {
        phase: S.phase,
        scenarioIndex: S.qIndex + 1,
        totalScenarios: SCENARIOS.length,
        cursorChoice: S.cursorChoice,
        answersCount: S.answers.length,
        answers: S.answers.map(a => a.choice).join(''),
        paused: S.paused,
        activeJunction: (S.phase === 'replay' || S.phase === 'complete') ? activeJ : 0,
        carX: +S.carX.toFixed(3),
        camZ: +S.camZ.toFixed(2),
        t: +S.t.toFixed(2),
      };
    },
  };

  function getTargetCarXAtZ(wz) {
    if (S.answers.length === 0) return -0.25;
    if (wz >= TOTAL_DRIVE_Z - 11.0) return -0.35; // Center cleanly down double-yellow for COMPLETE (f_039.jpg)

    const rawIdx = (wz - (FIRST_JUNCTION_Z - JUNCTION_SPACING * 0.55)) / JUNCTION_SPACING;
    const jIdx = Math.max(0, Math.min(SCENARIOS.length - 1, Math.floor(rawIdx)));
    const ans = S.answers[jIdx] || S.answers[S.answers.length - 1];
    const local = rawIdx - jIdx;
    // Smooth lane commitment curve peaking through the crosswalk
    const env = Math.sin(Math.max(0, Math.min(1, local)) * Math.PI);
    return -0.25 * (1 - env * 0.85) + ans.targetLane * (0.28 + 0.72 * env);
  }

  function update(dt) {
    S.t += dt;

    if (evHumGain && audioCtx) {
      const inStreet = S.phase === 'reveal' || S.phase === 'replay' || S.phase === 'complete';
      const wantVol = inStreet ? (S.paused ? 0.01 : 0.032) : 0.0001;
      evHumGain.gain.value += (wantVol - evHumGain.gain.value) * Math.min(1, dt * 5);
      if (evOsc1 && evOsc2) {
        const speedMod = S.phase === 'complete' ? 0.78 : (S.paused ? 0.55 : 1.0 + Math.abs(S.carYaw) * 0.25);
        evOsc1.frequency.value = 92 * speedMod;
        evOsc2.frequency.value = 184.5 * speedMod;
      }
    }

    if (S.phase === 'ans') {
      S.ansTimer -= dt;
      if (S.ansTimer <= 0) {
        if (S.qIndex + 1 < SCENARIOS.length) {
          S.qIndex++;
          S.phase = 'q';
        } else {
          S.phase = 'reveal';
          S.revealTimer = 0;
          S.camZ = 0;
          S.carX = -0.25;
          S.camX = -0.15;
          playCRTBreachTone();
        }
      }
    } else if (S.phase === 'reveal') {
      S.revealTimer += dt;
      S.camZ += dt * 15.5;
      S.camX += (S.carX * 0.35 - S.camX) * Math.min(1, dt * 4);
      if (S.revealTimer >= S.revealDur) {
        S.phase = 'replay';
      }
    } else if (S.phase === 'replay') {
      const timeScale = S.paused ? 0.04 : 1.0;
      const effDt = dt * timeScale;
      S.camZ += effDt * DRIVE_SPEED;

      const carZ = S.camZ + 6.75;
      const desiredX = getTargetCarXAtZ(carZ + 3.2);
      S.carPrevX = S.carX;
      S.carX += (desiredX - S.carX) * Math.min(1, effDt * 4.6);
      S.carVelX = effDt > 0.0001 ? (S.carX - S.carPrevX) / effDt : 0;

      const desiredYaw = Math.max(-0.34, Math.min(0.34, (desiredX - S.carX) * 0.26 + S.carVelX * 0.045));
      S.carYaw += (desiredYaw - S.carYaw) * Math.min(1, dt * 8.0);
      S.carRoll += (Math.max(-0.06, Math.min(0.06, -S.carVelX * 0.012)) - S.carRoll) * Math.min(1, dt * 7.0);
      S.camX += (S.carX * 0.38 - S.camX) * Math.min(1, dt * 3.8);

      const jNow = Math.floor((carZ - FIRST_JUNCTION_Z + 8) / JUNCTION_SPACING);
      if (jNow !== S.lastJunctionSwerved && jNow >= 0 && jNow < SCENARIOS.length && Math.abs(S.carYaw) > 0.09) {
        S.lastJunctionSwerved = jNow;
        playWetSwerveWhoosh();
      }

      // Spawn wet tire spray droplets during brisk lateral swerves
      if (!S.paused && Math.abs(S.carVelX) > 1.25 && SPRAY.length < 70) {
        for (let i = 0; i < 2; i++) {
          SPRAY.push({
            wx: S.carX + (i === 0 ? -0.82 : 0.82),
            wy: 0.08,
            wz: carZ - 1.55,
            vx: -S.carVelX * 0.22 + (rand() - 0.5) * 0.9,
            vy: 0.65 + rand() * 0.8,
            vz: -4.0 - rand() * 3.0,
            life: 0.32 + rand() * 0.18,
          });
        }
      }

      if (S.camZ >= TOTAL_DRIVE_Z) {
        S.phase = 'complete';
        playKeyClack(880);
      }
    } else if (S.phase === 'complete') {
      // Gentle forward glide down the endless wet corridor (matching f_039.jpg)
      S.camZ += dt * 7.5;
      S.carX += (-0.38 - S.carX) * Math.min(1, dt * 3.0);
      S.carYaw += (0 - S.carYaw) * Math.min(1, dt * 4.0);
      S.carRoll += (0 - S.carRoll) * Math.min(1, dt * 4.0);
      S.camX += (S.carX * 0.35 - S.camX) * Math.min(1, dt * 3.0);
    }

    for (let i = SPRAY.length - 1; i >= 0; i--) {
      const p = SPRAY[i];
      p.wx += p.vx * dt;
      p.wy += p.vy * dt;
      p.wz += p.vz * dt;
      p.vy -= 3.2 * dt;
      p.life -= dt;
      if (p.life <= 0 || p.wy < 0) SPRAY.splice(i, 1);
    }
  }

  // =========================================================================
  // PHASE 1: STARK GREEN PHOSPHOR CRT (matching f_003.jpg & m2_main_ref.png)
  // =========================================================================
  function drawVectorJunction(sc, activeChoice, locked, tilt3D = 0) {
    ctx.save();
    const cx = 855 - tilt3D * 215;
    const cy = 365 + tilt3D * 95;
    ctx.translate(cx, cy);
    if (tilt3D > 0) {
      ctx.scale(1 + tilt3D * 1.35, Math.max(0.32, 1 - tilt3D * 0.48));
    }

    ctx.strokeStyle = PAL.fg;
    ctx.shadowColor = PAL.fg;
    ctx.shadowBlur = 9;
    ctx.lineWidth = 2.2;

    const rw = 74;
    const arm = 235;
    const corner = (sx, sy) => {
      ctx.beginPath();
      ctx.moveTo(sx * rw, sy * arm);
      ctx.lineTo(sx * rw, sy * (rw + 20));
      ctx.quadraticCurveTo(sx * rw, sy * rw, sx * (rw + 20), sy * rw);
      ctx.lineTo(sx * arm, sy * rw);
      ctx.stroke();
    };
    corner(-1, -1);
    corner(1, -1);
    corner(-1, 1);
    corner(1, 1);

    // Stop bars
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(-rw, -rw - 15); ctx.lineTo(0, -rw - 15);
    ctx.moveTo(0, rw + 15); ctx.lineTo(rw, rw + 15);
    ctx.moveTo(-rw - 15, 0); ctx.lineTo(-rw - 15, rw);
    ctx.moveTo(rw + 15, -rw); ctx.lineTo(rw + 15, 0);
    ctx.stroke();

    // Dashed lane dividers
    ctx.lineWidth = 1.6;
    ctx.setLineDash([11, 11]);
    ctx.beginPath();
    ctx.moveTo(0, -arm); ctx.lineTo(0, -rw - 15);
    ctx.moveTo(0, rw + 15); ctx.lineTo(0, arm);
    ctx.moveTo(-arm, 0); ctx.lineTo(-rw - 15, 0);
    ctx.moveTo(rw + 15, 0); ctx.lineTo(arm, 0);
    ctx.stroke();
    ctx.setLineDash([]);

    // Top-down vector autonomous car in incoming right lane
    const carX = 36;
    const carY = 152;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.roundRect(carX - 19, carY - 38, 38, 76, 10);
    ctx.stroke();
    ctx.beginPath();
    ctx.roundRect(carX - 13, carY - 20, 26, 34, 4);
    ctx.stroke();

    // Stick pedestrians / cyclists reflecting exact scenario actors
    const drawStick = (px, py, isBike) => {
      ctx.save();
      ctx.translate(px, py);
      ctx.lineWidth = 2.0;
      ctx.fillStyle = PAL.fg;
      ctx.beginPath();
      ctx.arc(0, -11, 3.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, -7); ctx.lineTo(0, 3);
      ctx.moveTo(0, -4); ctx.lineTo(-6, 2);
      ctx.moveTo(0, -4); ctx.lineTo(6, 2);
      ctx.moveTo(0, 3); ctx.lineTo(-5, 12);
      ctx.moveTo(0, 3); ctx.lineTo(5, 12);
      ctx.stroke();
      if (isBike) {
        ctx.beginPath();
        ctx.arc(-7, 12, 4.5, 0, Math.PI * 2);
        ctx.arc(7, 12, 4.5, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    };

    sc.leftActors.forEach((a, i) => {
      drawStick(-46 - i * 24, -92 + i * 16, a.kind.startsWith('cyc'));
    });
    sc.rightActors.forEach((a, i) => {
      drawStick(42 + i * 24, -92 + i * 16, a.kind.startsWith('cyc'));
    });
    // Sidewalk witness silhouettes matching f_003.jpg
    drawStick(-88, 96, false);
    drawStick(88, 158, false);

    // Live trajectory arrow for active choice [A] vs [B]
    const targetLane = activeChoice === 'A' ? sc.laneA : sc.laneB;
    ctx.lineWidth = locked ? 4.0 : 2.8;
    ctx.strokeStyle = locked ? PAL.acc : PAL.fg;
    ctx.fillStyle = locked ? PAL.acc : PAL.fg;

    ctx.beginPath();
    ctx.moveTo(carX, carY - 42);
    if (targetLane < -0.9) {
      // Swerve left branch (matching f_003.jpg curved arrow)
      ctx.quadraticCurveTo(carX, -18, -138, -18);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-148, -18);
      ctx.lineTo(-131, -26);
      ctx.lineTo(-131, -10);
      ctx.closePath();
      ctx.fill();
    } else if (targetLane > 0.9) {
      // Stay in right lane straight through
      ctx.lineTo(carX, -158);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(carX, -168);
      ctx.lineTo(carX - 8, -151);
      ctx.lineTo(carX + 8, -151);
      ctx.closePath();
      ctx.fill();
    } else {
      // Center-left slip path
      ctx.quadraticCurveTo(carX, -40, -18, -158);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-20, -168);
      ctx.lineTo(-27, -150);
      ctx.lineTo(-11, -152);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }

  function drawCRTPhase() {
    CLICK_ZONES.length = 0;
    ctx.save();
    ctx.fillStyle = PAL.bg;
    ctx.fillRect(0, 0, W, H);

    const sc = SCENARIOS[Math.min(S.qIndex, SCENARIOS.length - 1)];

    if (S.phase === 'boot') {
      ctx.shadowColor = PAL.fg;
      ctx.shadowBlur = 10;
      ctx.fillStyle = PAL.acc;
      ctx.font = '700 27px "SF Mono", "Menlo", monospace';
      ctx.fillText('> ETHICS CALIBRATION v0.3', 72, 118);

      ctx.fillStyle = PAL.fg;
      ctx.font = '25px "SF Mono", "Menlo", monospace';
      ctx.fillText('> 10 scenarios.', 72, 192);
      ctx.fillText('choose [A] or [B].', 72, 254);

      const blink = Math.floor(S.t * 2.6) % 2 === 0 ? '_' : '';
      ctx.fillStyle = PAL.acc;
      ctx.fillText(`> [ENTER] begin${blink}`, 72, 342);

      ctx.fillStyle = PAL.fg;
      ctx.font = '56px "SF Mono", "Menlo", monospace';
      ctx.fillText('(o_o)', 1018, 622);
    } else {
      const activeChoice = S.phase === 'ans'
        ? (S.answers[S.answers.length - 1]?.choice || S.cursorChoice)
        : (S.hoverChoice === 'A' || S.hoverChoice === 'B' ? S.hoverChoice : S.cursorChoice);

      drawVectorJunction(sc, activeChoice, S.phase === 'ans', 0);

      ctx.shadowColor = PAL.fg;
      ctx.shadowBlur = 8;
      ctx.textAlign = 'left';

      ctx.fillStyle = PAL.acc;
      ctx.font = '700 26px "SF Mono", "Menlo", monospace';
      ctx.fillText('> ETHICS CALIBRATION v0.3', 70, 110);

      ctx.fillStyle = PAL.fg;
      ctx.font = '25px "SF Mono", "Menlo", monospace';
      ctx.fillText(`> scenario ${S.qIndex + 1} of ${SCENARIOS.length}`, 70, 176);
      ctx.fillText(sc.line1, 70, 244);
      ctx.fillText(sc.line2, 70, 308);

      const optAText = `[A] ${sc.optA}`;
      const optBText = `[B] ${sc.optB}`;
      ctx.fillStyle = activeChoice === 'A' ? PAL.acc : PAL.fg;
      ctx.fillText(optAText, 70, 374);
      const wA = ctx.measureText(optAText).width;
      CLICK_ZONES.push({ id: 'A', x: 64, y: 344, w: wA + 14, h: 40 });

      const bx = 70 + wA + 28;
      ctx.fillStyle = activeChoice === 'B' ? PAL.acc : PAL.fg;
      ctx.fillText(optBText, bx, 374);
      const wB = ctx.measureText(optBText).width;
      CLICK_ZONES.push({ id: 'B', x: bx - 6, y: 344, w: wB + 14, h: 40 });

      const blink = Math.floor(S.t * 3.5) % 2 === 0 ? '_' : '';
      if (S.phase === 'q') {
        ctx.fillStyle = PAL.fg;
        ctx.fillText(`> ${blink}`, 70, 440);
      } else {
        const last = S.answers[S.answers.length - 1];
        ctx.fillStyle = PAL.acc;
        ctx.fillText(`> ${last ? last.choice : 'A'}_`, 70, 440);
      }

      // Silent ASCII guide matching f_003.jpg & m2_main_ref.png (zero extra chatter)
      ctx.fillStyle = PAL.fg;
      ctx.font = '56px "SF Mono", "Menlo", monospace';
      ctx.fillText(S.phase === 'ans' ? '(•_•)' : '(o_o)', 1018, 622);
    }

    // Subtle phosphor raster scanlines
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.20)';
    for (let y = 0; y < H; y += 4) {
      ctx.fillRect(0, y, W, 1.3);
    }
    ctx.restore();
  }

  // =========================================================================
  // PHASE 2: TRUE 3D CORRIDOR WET NIGHT LIDAR STREET (f_009, f_021, f_033, f_039)
  // =========================================================================
  const HORIZON_Y = 278;
  const VP_X = W * 0.5;
  const FOCAL = 520;
  const CAM_Y = 2.46;
  const CAR_DZ = 6.75;

  function project3D(wx, wy, wz) {
    const dz = wz - S.camZ;
    if (dz <= 0.25) return null;
    const scale = FOCAL / dz;
    return {
      x: VP_X + (wx - S.camX) * scale,
      y: HORIZON_Y + (CAM_Y - wy) * scale,
      scale,
      dz,
    };
  }

  function fillQuad3D(p0, p1, p2, p3, fillStyle, strokeStyle = null, lineW = 1) {
    if (!p0 || !p1 || !p2 || !p3) return;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.closePath();
    if (fillStyle) {
      ctx.fillStyle = fillStyle;
      ctx.fill();
    }
    if (strokeStyle) {
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineW;
      ctx.stroke();
    }
  }

  function drawSkyAndDistantCanyon() {
    const skyGrad = ctx.createLinearGradient(0, 0, 0, HORIZON_Y + 12);
    skyGrad.addColorStop(0, '#040908');
    skyGrad.addColorStop(0.58, '#081310');
    skyGrad.addColorStop(1, '#11221c');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, HORIZON_Y + 12);

    // Distant downtown skyscraper silhouettes at canyon vanishing point
    const canyonShift = -S.camX * 8;
    const towers = [
      { ox: -168, w: 50, h: 190 },
      { ox: -112, w: 42, h: 232, beacon: true },
      { ox: -64,  w: 46, h: 165 },
      { ox: -12,  w: 38, h: 208 },
      { ox: 30,   w: 50, h: 242, beacon: true },
      { ox: 84,   w: 44, h: 175 },
      { ox: 132,  w: 54, h: 198 },
    ];
    for (const tw of towers) {
      const tx = VP_X + canyonShift + tw.ox;
      const ty = HORIZON_Y - tw.h;
      ctx.fillStyle = '#08110e';
      ctx.fillRect(tx, ty, tw.w, tw.h + 8);
      ctx.fillStyle = 'rgba(165, 218, 198, 0.28)';
      for (let wy = ty + 14; wy < HORIZON_Y - 14; wy += 13) {
        for (let wx = tx + 6; wx < tx + tw.w - 8; wx += 10) {
          if (((wx * 17 + wy * 31) % 7) < 3) {
            ctx.fillRect(wx, wy, 5, 4);
          }
        }
      }
      if (tw.beacon) {
        ctx.fillStyle = 'rgba(255, 58, 42, 0.85)';
        ctx.beginPath();
        ctx.arc(tx + tw.w * 0.5, ty + 2, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Subtle distant oncoming headlights in the misty canyon
    const hlX = VP_X + canyonShift - 18;
    ctx.fillStyle = 'rgba(220, 248, 236, 0.65)';
    ctx.beginPath();
    ctx.arc(hlX - 4, HORIZON_Y + 4, 2.0, 0, Math.PI * 2);
    ctx.arc(hlX + 4, HORIZON_Y + 4, 2.0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawWetRoadAndSidewalks(lidarScanBoost) {
    // Rich dark rain-slicked night asphalt
    const roadGrad = ctx.createLinearGradient(0, HORIZON_Y, 0, H);
    roadGrad.addColorStop(0, '#10201a');
    roadGrad.addColorStop(0.28, '#162922');
    roadGrad.addColorStop(0.65, '#0e1b16');
    roadGrad.addColorStop(1, '#08110e');
    ctx.fillStyle = roadGrad;
    ctx.fillRect(0, HORIZON_Y, W, H - HORIZON_Y);

    const zNear = S.camZ + 0.55;
    const zFar = S.camZ + 108;

    // Raised sidewalks & wet curb lips on both sides (interrupted at cross-streets)
    for (const b of BUILDINGS) {
      if (b.z1 < zNear || b.z0 > zFar) continue;
      const cz0 = Math.max(zNear, b.z0 - 1.2);
      const cz1 = Math.min(zFar, b.z1 + 1.2);
      const s = b.side;
      const curbX = s * 5.05;
      const wallX = s * 8.4;

      fillQuad3D(
        project3D(curbX, 0.16, cz0),
        project3D(wallX, 0.16, cz0),
        project3D(wallX, 0.16, cz1),
        project3D(curbX, 0.16, cz1),
        '#111f1a'
      );
      fillQuad3D(
        project3D(curbX, 0.0, cz0),
        project3D(curbX, 0.16, cz0),
        project3D(curbX, 0.16, cz1),
        project3D(curbX, 0.0, cz1),
        '#1e332b',
        'rgba(145, 208, 182, 0.30)',
        1.2
      );
    }

    // Organic dark mirror puddles & damp sheen patches on the asphalt
    for (const pd of PUDDLES) {
      if (pd.wz + pd.rl < zNear || pd.wz - pd.rl > S.camZ + 68) continue;
      const z0 = Math.max(zNear, pd.wz - pd.rl * 0.5);
      const z1 = pd.wz + pd.rl * 0.5;
      const p0 = project3D(pd.wx - pd.rw * 0.5, 0, z0);
      const p1 = project3D(pd.wx + pd.rw * 0.5, 0, z0);
      const p2 = project3D(pd.wx + pd.rw * 0.42, 0, z1);
      const p3 = project3D(pd.wx - pd.rw * 0.42, 0, z1);
      fillQuad3D(p0, p1, p2, p3, `rgba(3, 8, 6, ${pd.dark * 1.15})`);
      // Subtle specular wet rim beside puddle
      const s0 = project3D(pd.wx - pd.rw * 0.25, 0, z0);
      const s1 = project3D(pd.wx + pd.rw * 0.25, 0, z0);
      if (s0 && s1) {
        ctx.strokeStyle = 'rgba(135, 196, 172, 0.10)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(s0.x, s0.y);
        ctx.lineTo(s1.x, s1.y);
        ctx.stroke();
      }
    }

    // Clamped local streetlamp specular sheen on wet asphalt (never washing out the road!)
    for (const lm of LAMPS) {
      const dz = lm.wz - S.camZ;
      if (dz < 5.5 || dz > 68) continue;
      const pr = project3D(lm.side * 4.15, 0, lm.wz);
      if (!pr) continue;
      const rw = Math.min(26, Math.max(4, 0.55 * pr.scale));
      const rh = Math.min(54, Math.max(8, 1.35 * pr.scale));
      const g = ctx.createRadialGradient(pr.x, pr.y + rh * 0.25, 1, pr.x, pr.y + rh * 0.25, rh);
      g.addColorStop(0, 'rgba(182, 238, 212, 0.16)');
      g.addColorStop(1, 'rgba(70, 242, 138, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(pr.x - rw, pr.y - rh * 0.3, rw * 2, rh * 1.5);
    }

    // Crosswalk bars & turn arrows at scenario junctions
    for (let j = 0; j < SCENARIOS.length; j++) {
      const jz = FIRST_JUNCTION_Z + j * JUNCTION_SPACING;
      if (jz < zNear - 3 || jz > S.camZ + 82) continue;

      const g0 = project3D(-4.95, 0.005, Math.max(zNear, jz - 2.2));
      const g1 = project3D(4.95, 0.005, Math.max(zNear, jz - 2.2));
      const g2 = project3D(4.95, 0.005, jz + 2.2);
      const g3 = project3D(-4.95, 0.005, jz + 2.2);
      fillQuad3D(g0, g1, g2, g3, 'rgba(54, 215, 122, 0.08)');

      for (let x = -4.3; x <= 4.3; x += 0.95) {
        const c0 = project3D(x - 0.26, 0.01, Math.max(zNear, jz - 1.35));
        const c1 = project3D(x + 0.26, 0.01, Math.max(zNear, jz - 1.35));
        const c2 = project3D(x + 0.26, 0.01, jz + 1.15);
        const c3 = project3D(x - 0.26, 0.01, jz + 1.15);
        fillQuad3D(c0, c1, c2, c3, 'rgba(185, 225, 206, 0.18)');
      }

      const az = jz - 7.5;
      if (az > zNear + 2 && az < S.camZ + 55) {
        const a0 = project3D(3.35, 0.01, az - 1.1);
        const a2 = project3D(3.62, 0.01, az + 0.5);
        const a3 = project3D(4.15, 0.01, az + 0.75);
        if (a0 && a2 && a3) {
          ctx.strokeStyle = 'rgba(205, 228, 218, 0.42)';
          ctx.lineWidth = Math.min(7, Math.max(2, 0.14 * a0.scale));
          ctx.beginPath();
          ctx.moveTo(a0.x, a0.y);
          ctx.quadraticCurveTo(a2.x, a2.y, a3.x, a3.y);
          ctx.stroke();
        }
      }
    }

    // Double yellow centerline (matching f_021, f_033, f_039)
    const drawContinuousStripe = (wx0, wx1, color) => {
      const segStep = 5;
      for (let z = Math.floor(zNear); z < zFar; z += segStep) {
        const zs = Math.max(zNear, z);
        const ze = Math.min(zFar, z + segStep + 0.1);
        fillQuad3D(
          project3D(wx0, 0.01, zs),
          project3D(wx1, 0.01, zs),
          project3D(wx1, 0.01, ze),
          project3D(wx0, 0.01, ze),
          color
        );
      }
    };
    drawContinuousStripe(-0.62, -0.51, 'rgba(198, 164, 54, 0.78)');
    drawContinuousStripe(-0.41, -0.30, 'rgba(198, 164, 54, 0.78)');

    // Dashed white lane dividers on left & right lanes
    for (let z = Math.floor(zNear / 5) * 5; z < zFar; z += 5.0) {
      const zs = Math.max(zNear, z);
      const ze = z + 2.1;
      if (ze <= zs) continue;
      for (const lx of [-2.75, 2.35]) {
        fillQuad3D(
          project3D(lx - 0.06, 0.01, zs),
          project3D(lx + 0.06, 0.01, zs),
          project3D(lx + 0.06, 0.01, ze),
          project3D(lx - 0.06, 0.01, ze),
          'rgba(212, 234, 224, 0.48)'
        );
      }
    }

    // Crisp horizontal green lidar scan bars sweeping across road & stepping onto sidewalks (f_009.jpg!)
    if (lidarScanBoost > 0.03) {
      ctx.save();
      const firstBarZ = Math.floor((S.camZ + 2.2) / 1.75) * 1.75;
      for (let z = firstBarZ; z < S.camZ + 48; z += 1.75) {
        const dz = z - S.camZ;
        if (dz < 2.1) continue;
        const fade = Math.max(0, 1 - dz / 46);
        const wave = 0.65 + 0.35 * Math.sin(z * 0.9 - S.t * 7.0);
        const alpha = lidarScanBoost * fade * wave;
        if (alpha < 0.03) continue;

        const pLWall = project3D(-7.6, 0.16, z);
        const pLCurbTop = project3D(-5.05, 0.16, z);
        const pLCurbBot = project3D(-5.05, 0.01, z);
        const pRCurbBot = project3D(5.05, 0.01, z);
        const pRCurbTop = project3D(5.05, 0.16, z);
        const pRWall = project3D(7.6, 0.16, z);
        if (!pLCurbBot || !pRCurbBot) continue;

        ctx.strokeStyle = `rgba(74, 248, 144, ${Math.min(0.84, alpha)})`;
        ctx.lineWidth = Math.min(2.8, Math.max(1.0, 0.025 * pLCurbBot.scale));
        ctx.beginPath();
        if (pLWall && pLCurbTop) {
          ctx.moveTo(pLWall.x, pLWall.y);
          ctx.lineTo(pLCurbTop.x, pLCurbTop.y);
          ctx.lineTo(pLCurbBot.x, pLCurbBot.y);
        } else {
          ctx.moveTo(pLCurbBot.x, pLCurbBot.y);
        }
        ctx.lineTo(pRCurbBot.x, pRCurbBot.y);
        if (pRCurbTop && pRWall) {
          ctx.lineTo(pRCurbTop.x, pRCurbTop.y);
          ctx.lineTo(pRWall.x, pRWall.y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawBuildingBlock3D(b, lidarWallIntensity) {
    const zNear = S.camZ + 0.45;
    const zFar = S.camZ + 108;
    if (b.z1 < zNear || b.z0 > zFar) return;

    const s = b.side;
    const wallX = s * 7.85;
    const outerX = s * 15.5;
    const cz0 = Math.max(zNear, b.z0);
    const cz1 = Math.min(zFar, b.z1);
    const distFog = Math.min(0.75, Math.max(0, (cz0 - S.camZ - 18) / 95));

    // Cross-street facing side wall (visible before reaching b.z0)
    if (b.z0 > zNear + 0.3) {
      const f0 = project3D(wallX, 0.16, b.z0);
      const f1 = project3D(outerX, 0.16, b.z0);
      const f2 = project3D(outerX, b.h, b.z0);
      const f3 = project3D(wallX, b.h, b.z0);
      fillQuad3D(f0, f1, f2, f3, '#0d1815', 'rgba(54, 110, 88, 0.25)', 1);
    }

    // Street-facing main facade
    const p0 = project3D(wallX, 0.16, cz0);
    const p1 = project3D(wallX, 0.16, cz1);
    const p2 = project3D(wallX, b.h, cz1);
    const p3 = project3D(wallX, b.h, cz0);
    const shades = ['#111e1a', '#14231e', '#0f1b18'];
    fillQuad3D(p0, p1, p2, p3, shades[b.shade], 'rgba(42, 88, 70, 0.32)', 1);

    // Perspective apartment/storefront windows on street-facing facade
    if (cz0 - S.camZ < 82) {
      for (let wy = 1.6; wy < b.h - 1.5; wy += 2.35) {
        for (let wz = b.z0 + 1.4; wz < b.z1 - 1.6; wz += 2.65) {
          if (wz < zNear + 0.3 || wz + 1.3 > zFar) continue;
          const hash = ((Math.floor(wy * 7) * 31 + Math.floor(wz * 5) * 17 + b.winSeed) >>> 0) % 11;
          if (hash > 4) continue;
          const w0 = project3D(wallX, wy, wz);
          const w1 = project3D(wallX, wy, wz + 1.35);
          const w2 = project3D(wallX, wy + 1.25, wz + 1.35);
          const w3 = project3D(wallX, wy + 1.25, wz);
          const litAlpha = (hash === 0 ? 0.34 : 0.17) * (1 - distFog);
          fillQuad3D(w0, w1, w2, w3, `rgba(176, 224, 204, ${litAlpha})`);
        }
      }
    }

    // Green horizontal lidar scan contours wrapping across building walls (matching f_033 & f_039!)
    const wallDist = cz0 - S.camZ;
    if (wallDist < 68) {
      const scanAlpha = (0.26 + 0.42 * lidarWallIntensity) * (1 - wallDist / 68);
      ctx.strokeStyle = `rgba(70, 242, 138, ${scanAlpha})`;
      ctx.lineWidth = 1.35;
      for (let wy = 0.65; wy < Math.min(b.h, 10.5); wy += 0.72) {
        const l0 = project3D(wallX, wy, cz0);
        const l1 = project3D(wallX, wy, cz1);
        if (l0 && l1) {
          ctx.beginPath();
          ctx.moveTo(l0.x, l0.y);
          ctx.lineTo(l1.x, l1.y);
          ctx.stroke();
        }
      }
    }
  }

  function drawChevronRibbon3D() {
    if (S.phase === 'complete') return;
    const startZ = S.camZ + 2.35;
    const steps = 18;
    const spanZ = 22.5;
    const carZ = S.camZ + CAR_DZ;

    ctx.save();
    ctx.shadowColor = PAL.fg;
    ctx.shadowBlur = 18;

    const xAtZ = (z) => {
      if (z <= carZ) return S.carX;
      const b = Math.min(1, (z - carZ) / 11.0);
      const ease = b * b * (3 - 2 * b);
      return S.carX * (1 - ease) + getTargetCarXAtZ(z) * ease;
    };

    for (let i = 0; i < steps; i++) {
      const z0 = startZ + (i / steps) * spanZ;
      const z1 = startZ + ((i + 0.78) / steps) * spanZ;
      const zTip = z1 + 0.52;

      const x0 = xAtZ(z0);
      const x1 = xAtZ(z1);
      const xTip = xAtZ(zTip);

      const hw = 0.56;
      const pL0 = project3D(x0 - hw, 0.015, z0);
      const pM0 = project3D(x0, 0.015, z0 + 0.45);
      const pR0 = project3D(x0 + hw, 0.015, z0);
      const pR1 = project3D(x1 + hw, 0.015, z1);
      const pTip = project3D(xTip, 0.015, zTip);
      const pL1 = project3D(x1 - hw, 0.015, z1);
      if (!pL0 || !pR0 || !pR1 || !pTip || !pL1 || !pM0) continue;

      const wave = ((S.camZ * 0.55 - i * 0.25) % 1 + 1) % 1;
      const fade = Math.max(0.14, 1 - (i / steps) * 0.78);
      const isBright = wave > 0.42;
      ctx.fillStyle = isBright
        ? `rgba(145, 255, 195, ${0.90 * fade})`
        : `rgba(68, 240, 140, ${0.58 * fade})`;

      ctx.beginPath();
      ctx.moveTo(pL0.x, pL0.y);
      ctx.lineTo(pM0.x, pM0.y);
      ctx.lineTo(pR0.x, pR0.y);
      ctx.lineTo(pR1.x, pR1.y);
      ctx.lineTo(pTip.x, pTip.y);
      ctx.lineTo(pL1.x, pL1.y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawLowPolyTree3D(tr) {
    const pBase = project3D(tr.wx, 0.16, tr.wz);
    const pCrown = project3D(tr.wx, tr.h, tr.wz);
    if (!pBase || !pCrown || pBase.dz > 86) return;

    const rPx = tr.r * pCrown.scale;
    if (rPx < 3) return;
    const fog = Math.min(0.7, Math.max(0, (pBase.dz - 22) / 70));

    ctx.save();
    // Branched dark trunk
    const trunkW = Math.max(2, 0.22 * pBase.scale);
    ctx.fillStyle = '#1b1915';
    ctx.fillRect(pBase.x - trunkW * 0.5, pCrown.y + rPx * 0.55, trunkW, pBase.y - (pCrown.y + rPx * 0.55));

    // Icosahedral low-poly faceted canopy (matching f_009, f_033, f_039!)
    const cx = pCrown.x;
    const cy = pCrown.y;
    const pts = [
      [cx, cy - rPx * 1.04],              // 0 top
      [cx - rPx * 0.88, cy - rPx * 0.42], // 1 upper-left
      [cx + rPx * 0.88, cy - rPx * 0.42], // 2 upper-right
      [cx - rPx * 1.02, cy + rPx * 0.28], // 3 lower-left
      [cx + rPx * 1.02, cy + rPx * 0.28], // 4 lower-right
      [cx, cy + rPx * 0.82],              // 5 bottom
      [cx - rPx * 0.18, cy - rPx * 0.12], // 6 center ridge
      [cx + rPx * 0.26, cy + rPx * 0.08], // 7 right-mid ridge
    ];
    const facets = [
      [0, 1, 6, '#334f38'],
      [0, 6, 2, '#3d5e43'],
      [1, 3, 6, '#243a29'],
      [6, 7, 2, '#2f4b35'],
      [6, 3, 5, '#1b2d20'],
      [6, 5, 7, '#233928'],
      [7, 5, 4, '#18281c'],
      [2, 7, 4, '#263e2c'],
    ];
    ctx.globalAlpha = 1 - fog * 0.55;
    for (const [a, b, c, col] of facets) {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(pts[a][0], pts[a][1]);
      ctx.lineTo(pts[b][0], pts[b][1]);
      ctx.lineTo(pts[c][0], pts[c][1]);
      ctx.closePath();
      ctx.fill();
    }

    // Delicate glowing horizontal green lidar scan rings across canopy (matching f_033!)
    if (tr.lidarTag && pBase.dz < 48) {
      const scanAlpha = 0.52 * (1 - pBase.dz / 48);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      ctx.lineTo(pts[2][0], pts[2][1]);
      ctx.lineTo(pts[4][0], pts[4][1]);
      ctx.lineTo(pts[5][0], pts[5][1]);
      ctx.lineTo(pts[3][0], pts[3][1]);
      ctx.lineTo(pts[1][0], pts[1][1]);
      ctx.closePath();
      ctx.clip();

      ctx.strokeStyle = `rgba(92, 252, 152, ${scanAlpha})`;
      ctx.lineWidth = 1.4;
      for (let sy = cy - rPx * 0.72; sy <= cy + rPx * 0.65; sy += Math.max(6, rPx * 0.24)) {
        ctx.beginPath();
        ctx.moveTo(cx - rPx * 1.1, sy);
        ctx.lineTo(cx + rPx * 1.1, sy);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawStreetLamp3D(lm) {
    const poleX = lm.side * 5.35;
    const armX = lm.side * 4.15;
    const pBot = project3D(poleX, 0.16, lm.wz);
    const pTop = project3D(poleX, 5.85, lm.wz);
    const pHead = project3D(armX, 5.75, lm.wz);
    if (!pBot || !pTop || !pHead || pBot.dz > 92) return;

    ctx.save();
    ctx.strokeStyle = '#1b2c26';
    ctx.lineWidth = Math.max(1.4, 0.14 * pBot.scale);
    ctx.beginPath();
    ctx.moveTo(pBot.x, pBot.y);
    ctx.lineTo(pTop.x, pTop.y);
    ctx.lineTo(pHead.x, pHead.y);
    ctx.stroke();

    // Lidar rings along foreground lamp poles (matching f_021.jpg!)
    if (pBot.dz < 36) {
      ctx.fillStyle = 'rgba(84, 248, 148, 0.62)';
      for (let wy = 0.8; wy < 5.2; wy += 0.65) {
        const pr = project3D(poleX, wy, lm.wz);
        if (pr) ctx.fillRect(pr.x - 2.2, pr.y - 1, 4.4, 2);
      }
    }

    // Glowing cool-mint streetlamp fixture + mist halo
    const haloR = Math.max(6, 1.35 * pHead.scale);
    const g = ctx.createRadialGradient(pHead.x, pHead.y, 1, pHead.x, pHead.y, haloR);
    g.addColorStop(0, 'rgba(235, 255, 245, 0.92)');
    g.addColorStop(0.25, 'rgba(155, 232, 198, 0.34)');
    g.addColorStop(1, 'rgba(70, 242, 138, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(pHead.x, pHead.y, haloR, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f2fff8';
    ctx.beginPath();
    ctx.ellipse(pHead.x, pHead.y, Math.max(2.5, 0.28 * pHead.scale), Math.max(1.3, 0.11 * pHead.scale), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawParkedLidarCar3D(wx, wz) {
    const pC = project3D(wx, 0.0, wz);
    if (!pC || pC.dz < 1.5 || pC.dz > 75) return;
    const hw = 0.92;
    const hl = 2.05;
    const b0 = project3D(wx - hw, 0.12, wz - hl);
    const b1 = project3D(wx + hw, 0.12, wz - hl);
    const b2 = project3D(wx + hw, 0.88, wz - hl);
    const b3 = project3D(wx - hw, 0.88, wz - hl);
    const r0 = project3D(wx - hw * 0.76, 1.38, wz - hl * 0.55);
    const r1 = project3D(wx + hw * 0.76, 1.38, wz - hl * 0.55);
    if (!b0 || !b1 || !b2 || !b3 || !r0 || !r1) return;

    ctx.save();
    ctx.shadowColor = PAL.fg;
    ctx.shadowBlur = 10;
    fillQuad3D(b0, b1, b2, b3, 'rgba(34, 96, 66, 0.62)', 'rgba(110, 255, 172, 0.82)', 1.5);
    fillQuad3D(b3, b2, r1, r0, 'rgba(52, 148, 98, 0.52)', 'rgba(135, 255, 188, 0.85)', 1.4);
    ctx.restore();
  }

  function drawHolographicActor3D(actor) {
    const sp = RAW_SPRITES[actor.kind] || RAW_SPRITES.ped1;
    const pr = project3D(actor.wx, 0.0, actor.wz);
    if (!pr || pr.dz < 0.7 || pr.dz > 78) return;

    const realHeightM = actor.kind.startsWith('cyc') ? 1.82 : 1.76;
    const drawH = realHeightM * pr.scale;
    const drawW = (sp.w / sp.h) * drawH;
    const distFade = Math.min(1, Math.max(0.25, 1.18 - pr.dz / 72));

    // Proximity highlight if autonomous EV passes near this actor
    const carZ = S.camZ + CAR_DZ;
    const nearCar = Math.abs(actor.wz - carZ) < 6.5 && Math.abs(actor.wx - S.carX) < 3.6;

    ctx.save();
    if (cleanSpritesCanvas) {
      // 1. Wet asphalt inverted reflection directly beneath feet (matching f_033.jpg!)
      ctx.save();
      ctx.translate(pr.x, pr.y);
      ctx.scale(1, -0.52);
      ctx.globalAlpha = 0.30 * distFade;
      ctx.drawImage(cleanSpritesCanvas, sp.x, sp.y, sp.w, sp.h, -drawW * 0.5, -drawH, drawW, drawH);
      ctx.restore();

      // Subtle lidar proximity ring on wet pavement only when close
      if (nearCar) {
        ctx.strokeStyle = 'rgba(142, 255, 190, 0.68)';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.ellipse(pr.x, pr.y, drawW * 0.58, Math.max(3, drawW * 0.16), 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 2. Upright glowing mint-white lidar scanline silhouette
      ctx.shadowColor = nearCar ? '#b8ffda' : PAL.fg;
      ctx.shadowBlur = nearCar ? 22 : 14;
      ctx.globalAlpha = Math.min(1, distFade * 1.05);
      ctx.drawImage(cleanSpritesCanvas, sp.x, sp.y, sp.w, sp.h, pr.x - drawW * 0.5, pr.y - drawH, drawW, drawH);
    } else {
      ctx.fillStyle = PAL.mint;
      ctx.fillRect(pr.x - drawW * 0.3, pr.y - drawH, drawW * 0.6, drawH);
    }
    ctx.restore();
  }

  // Sleek 3D Sculpted Metallic Fastback EV (matching f_009, f_021, f_033, f_039!)
  function drawAutonomousEV3D(lidarGlassLines) {
    const carZ = S.camZ + CAR_DZ;
    const cx = S.carX;
    const yaw = S.carYaw;
    const cosY = Math.cos(yaw);
    const sinY = Math.sin(yaw);

    const pCar = (lx, ly, lz) => {
      const ry = ly + lx * S.carRoll;
      const rx = cx + lx * cosY + lz * sinY;
      const rz = carZ - lx * sinY + lz * cosY;
      return project3D(rx, ry, rz);
    };

    // Deep contact shadow & crimson wet taillight reflection on asphalt
    const shFL = pCar(-1.02, 0.01, 2.18);
    const shFR = pCar(1.02, 0.01, 2.18);
    const shRR = pCar(1.02, 0.01, -2.18);
    const shRL = pCar(-1.02, 0.01, -2.18);
    fillQuad3D(shFL, shFR, shRR, shRL, 'rgba(2, 6, 4, 0.88)');

    const tailRefC = pCar(0, 0.01, -2.75);
    if (tailRefC) {
      ctx.save();
      const rg = ctx.createRadialGradient(tailRefC.x, tailRefC.y, 4, tailRefC.x, tailRefC.y, 115);
      rg.addColorStop(0, 'rgba(255, 50, 28, 0.42)');
      rg.addColorStop(0.55, 'rgba(255, 42, 24, 0.14)');
      rg.addColorStop(1, 'rgba(255, 42, 24, 0)');
      ctx.fillStyle = rg;
      ctx.fillRect(tailRefC.x - 130, tailRefC.y - 35, 260, 120);
      ctx.restore();
    }

    // Pinched fastback greenhouse + wide athletic rear haunches (matching Polestar/Waymo EV in sheet.jpg)
    const rBL = pCar(-0.96, 0.22, -2.02);
    const rBR = pCar(0.96, 0.22, -2.02);
    const rML = pCar(-0.98, 0.78, -2.06);
    const rMR = pCar(0.98, 0.78, -2.06);
    const rTL = pCar(-0.74, 0.96, -1.94);
    const rTR = pCar(0.74, 0.96, -1.94);

    const mBL = pCar(-0.99, 0.20, 0.15);
    const mBR = pCar(0.99, 0.20, 0.15);
    const mWL = pCar(-0.91, 0.92, 0.15);
    const mWR = pCar(0.91, 0.92, 0.15);

    const fBL = pCar(-0.88, 0.22, 2.08);
    const fBR = pCar(0.88, 0.22, 2.08);
    const fWL = pCar(-0.80, 0.78, 1.98);
    const fWR = pCar(0.80, 0.78, 1.98);

    // Tapered panoramic glass cabin
    const cRL = pCar(-0.54, 1.38, -0.78);
    const cRR = pCar(0.54, 1.38, -0.78);
    const cFL = pCar(-0.52, 1.36, 0.62);
    const cFR = pCar(0.52, 1.36, 0.62);

    // Side mirrors (matching f_021 / f_039!)
    const mirL0 = pCar(-0.88, 0.96, 0.58);
    const mirL1 = pCar(-1.05, 0.98, 0.54);
    const mirR0 = pCar(0.88, 0.96, 0.58);
    const mirR1 = pCar(1.05, 0.98, 0.54);

    const drawWheel = (wxSign, wzLocal) => {
      const w0 = pCar(wxSign * 0.96, 0.0, wzLocal - 0.36);
      const w1 = pCar(wxSign * 0.96, 0.0, wzLocal + 0.36);
      const w2 = pCar(wxSign * 0.96, 0.58, wzLocal + 0.36);
      const w3 = pCar(wxSign * 0.96, 0.58, wzLocal - 0.36);
      fillQuad3D(w0, w1, w2, w3, '#0a0f0d', '#283832', 1.2);
    };
    drawWheel(-1, -1.28);
    drawWheel(1, -1.28);
    drawWheel(-1, 1.32);
    drawWheel(1, 1.32);

    const drawLeftFlank = () => {
      fillQuad3D(fBL, mBL, mWL, fWL, '#313d38', '#465750', 1);
      fillQuad3D(mBL, rBL, rML, mWL, '#3a4842', '#52655d', 1);
      // Bright silver-grey C-pillar shoulder highlight (matching f_021 left shoulder!)
      fillQuad3D(mWL, rML, rTL, cRL, '#5b6c65');
      fillQuad3D(fWL, mWL, cRL, cFL, '#101d1a', '#5b7269', 1.2);
      if (mirL0 && mirL1) {
        ctx.strokeStyle = '#485852';
        ctx.lineWidth = 3.2;
        ctx.beginPath(); ctx.moveTo(mirL0.x, mirL0.y); ctx.lineTo(mirL1.x, mirL1.y); ctx.stroke();
      }
    };
    const drawRightFlank = () => {
      // Subtle green lidar reflection on right rear fender when passing pedestrians (f_033!)
      fillQuad3D(mBR, fBR, fWR, mWR, '#313f39', '#465951', 1);
      fillQuad3D(rBR, mBR, mWR, rMR, '#3d5248', '#547063', 1);
      fillQuad3D(rMR, mWR, cRR, rTR, '#586c63');
      fillQuad3D(mWR, fWR, cFR, cRR, '#101d1a', '#5b7269', 1.2);
      if (mirR0 && mirR1) {
        ctx.strokeStyle = '#485852';
        ctx.lineWidth = 3.2;
        ctx.beginPath(); ctx.moveTo(mirR0.x, mirR0.y); ctx.lineTo(mirR1.x, mirR1.y); ctx.stroke();
      }
    };

    if (yaw >= 0) {
      drawRightFlank();
      drawLeftFlank();
    } else {
      drawLeftFlank();
      drawRightFlank();
    }

    // Curved panoramic glass roof & fastback backlight
    if (cFL && cFR && cRR && cRL) {
      ctx.fillStyle = '#0f1c19';
      ctx.beginPath();
      ctx.moveTo(cFL.x, cFL.y);
      ctx.quadraticCurveTo((cFL.x + cFR.x) * 0.5, Math.min(cFL.y, cFR.y) - 5, cFR.x, cFR.y);
      ctx.lineTo(cRR.x, cRR.y);
      ctx.quadraticCurveTo((cRL.x + cRR.x) * 0.5, Math.min(cRL.y, cRR.y) - 6, cRL.x, cRL.y);
      ctx.closePath();
      ctx.fill();
    }
    fillQuad3D(rTL, rTR, cRR, cRL, '#0d1916', '#566962', 1.5);

    // Subtle green horizontal lidar reflection stripes on fastback rear window (f_009.jpg!)
    if (lidarGlassLines > 0.05) {
      ctx.save();
      ctx.strokeStyle = `rgba(74, 246, 142, ${0.58 * lidarGlassLines})`;
      ctx.lineWidth = 1.5;
      for (let f = 0.18; f <= 0.86; f += 0.21) {
        const gL = pCar(-0.70 + f * 0.16, 0.98 + f * 0.37, -1.90 + f * 1.02);
        const gR = pCar(0.70 - f * 0.16, 0.98 + f * 0.37, -1.90 + f * 1.02);
        if (gL && gR) {
          ctx.beginPath();
          ctx.moveTo(gL.x, gL.y);
          ctx.lineTo(gR.x, gR.y);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    // Sculpted metallic rear deck, tailgate fascia & finned diffuser
    fillQuad3D(rML, rMR, rTR, rTL, '#485550', '#607069', 1);
    fillQuad3D(rBL, rBR, rMR, rML, '#2d3834', '#404e48', 1);
    const d0 = pCar(-0.88, 0.17, -2.00);
    const d1 = pCar(0.88, 0.17, -2.00);
    const d2 = pCar(0.80, 0.36, -2.03);
    const d3 = pCar(-0.80, 0.36, -2.03);
    fillQuad3D(d0, d1, d2, d3, '#0d1412');

    // Metallic recessed bumper plate bevel (f_009 / f_039)
    fillQuad3D(
      pCar(-0.50, 0.42, -2.05),
      pCar(0.50, 0.42, -2.05),
      pCar(0.46, 0.56, -2.06),
      pCar(-0.46, 0.56, -2.06),
      '#586760'
    );

    // Full-width crimson LED taillight bar with tapered wingtips (matching f_009 / f_021!)
    const tbL0 = pCar(-0.91, 0.74, -2.07);
    const tbLIn = pCar(-0.62, 0.76, -2.07);
    const tbRIn = pCar(0.62, 0.76, -2.07);
    const tbR0 = pCar(0.91, 0.74, -2.07);
    const tbR1 = pCar(0.88, 0.82, -2.06);
    const tbL1 = pCar(-0.88, 0.82, -2.06);
    if (tbL0 && tbLIn && tbRIn && tbR0 && tbR1 && tbL1) {
      ctx.save();
      ctx.shadowColor = '#ff2a14';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ff3d26';
      ctx.beginPath();
      ctx.moveTo(tbL0.x, tbL0.y);
      ctx.lineTo(tbLIn.x, tbLIn.y);
      ctx.lineTo(tbRIn.x, tbRIn.y);
      ctx.lineTo(tbR0.x, tbR0.y);
      ctx.lineTo(tbR1.x, tbR1.y);
      ctx.lineTo(tbL1.x, tbL1.y);
      ctx.closePath();
      ctx.fill();

      const hcL = pCar(-0.82, 0.785, -2.075);
      const hcR = pCar(0.82, 0.785, -2.075);
      if (hcL && hcR) {
        ctx.strokeStyle = '#ffdfd6';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(hcL.x, hcL.y);
        ctx.lineTo(hcR.x, hcR.y);
        ctx.stroke();
      }

      if (Math.abs(yaw) > 0.055 && Math.floor(S.t * 8) % 2 === 0) {
        const sideSign = yaw < 0 ? -1 : 1;
        const ind = pCar(sideSign * 0.88, 0.78, -2.06);
        if (ind) {
          ctx.shadowColor = PAL.fg;
          ctx.shadowBlur = 14;
          ctx.fillStyle = '#9affc4';
          ctx.beginPath();
          ctx.arc(ind.x, ind.y, 5.0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // Wet tire spray droplets
    for (const sp of SPRAY) {
      const pr = project3D(sp.wx, sp.wy, sp.wz);
      if (!pr) continue;
      ctx.fillStyle = `rgba(175, 228, 205, ${Math.min(0.55, sp.life * 1.4)})`;
      ctx.beginPath();
      ctx.arc(pr.x, pr.y, Math.max(1.2, 0.045 * pr.scale), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawStreetWorld(lidarScanBoost = 0.0, lidarWallBoost = 0.35) {
    drawSkyAndDistantCanyon();
    drawWetRoadAndSidewalks(lidarScanBoost);

    // Draw corridor buildings back-to-front
    const visBuildings = BUILDINGS.filter(b => b.z1 > S.camZ + 0.4 && b.z0 < S.camZ + 108);
    visBuildings.sort((a, b) => b.z0 - a.z0);
    for (const b of visBuildings) {
      drawBuildingBlock3D(b, lidarWallBoost);
    }

    // Chevron trajectory ribbon lies flat on wet road surface
    drawChevronRibbon3D();

    // Collect depth-sorted 3D street props & holographic road users
    const renderQueue = [];
    for (const tr of TREES) {
      if (tr.wz > S.camZ + 0.8 && tr.wz < S.camZ + 86) {
        renderQueue.push({ wz: tr.wz, type: 'tree', data: tr });
      }
    }
    for (const lm of LAMPS) {
      if (lm.wz > S.camZ + 0.8 && lm.wz < S.camZ + 90) {
        renderQueue.push({ wz: lm.wz, type: 'lamp', data: lm });
      }
    }
    for (let j = 0; j < SCENARIOS.length; j++) {
      const jz = FIRST_JUNCTION_Z + j * JUNCTION_SPACING;
      if (jz < S.camZ - 2 || jz > S.camZ + 80) continue;
      const sc = SCENARIOS[j];
      for (const a of sc.leftActors) {
        renderQueue.push({ wz: jz + a.dz, type: 'actor', data: { kind: a.kind, wx: a.wx, wz: jz + a.dz } });
      }
      for (const a of sc.rightActors) {
        renderQueue.push({ wz: jz + a.dz, type: 'actor', data: { kind: a.kind, wx: a.wx, wz: jz + a.dz } });
      }
      if (sc.parkedCar) {
        const pz = jz + sc.parkedCar.dz;
        renderQueue.push({ wz: pz, type: 'parked', data: { wx: sc.parkedCar.wx, wz: pz } });
      }
    }
    // Also place initial reveal actors near first block so f_009 / pair_002 matches video!
    renderQueue.push({ wz: 17.5, type: 'actor', data: { kind: 'ped2', wx: -5.25, wz: 17.5 } });

    const carZ = S.camZ + CAR_DZ;
    renderQueue.push({ wz: carZ, type: 'playerCar', data: null });
    renderQueue.sort((a, b) => b.wz - a.wz);

    for (const item of renderQueue) {
      if (item.type === 'tree') drawLowPolyTree3D(item.data);
      else if (item.type === 'lamp') drawStreetLamp3D(item.data);
      else if (item.type === 'parked') drawParkedLidarCar3D(item.data.wx, item.data.wz);
      else if (item.type === 'actor') drawHolographicActor3D(item.data);
      else if (item.type === 'playerCar') drawAutonomousEV3D(lidarScanBoost);
    }

    // Subtle horizon atmospheric mist tying canyon into wet street
    const mist = ctx.createLinearGradient(0, HORIZON_Y - 26, 0, HORIZON_Y + 34);
    mist.addColorStop(0, 'rgba(18, 40, 33, 0)');
    mist.addColorStop(0.5, 'rgba(24, 52, 43, 0.30)');
    mist.addColorStop(1, 'rgba(18, 40, 33, 0)');
    ctx.fillStyle = mist;
    ctx.fillRect(0, HORIZON_Y - 26, W, 60);
  }

  function drawThroughTheGlassReveal() {
    CLICK_ZONES.length = 0;
    const p = Math.min(1, S.revealTimer / S.revealDur);
    const ease = p * p * (3 - 2 * p);

    // Underlying 3D wet night street with bright horizontal lidar scanlines (matching f_009.jpg!)
    drawStreetWorld(1.0 - 0.15 * ease, 0.85);

    // Dissolving vector road diagram tilting into 3D perspective + curved CRT bezel zooming past camera
    if (p < 0.78) {
      const crtAlpha = Math.max(0, 1 - p / 0.78);
      ctx.save();
      ctx.globalAlpha = crtAlpha * 0.88;
      ctx.fillStyle = PAL.bg;
      ctx.fillRect(0, 0, W, H * (1 - ease * 0.65));

      const sc = SCENARIOS[SCENARIOS.length - 1];
      const lastChoice = S.answers[S.answers.length - 1]?.choice || 'A';
      drawVectorJunction(sc, lastChoice, true, ease);
      ctx.restore();

      // Curved dark CRT monitor glass bezel pulling past viewport edges (matching sheet.jpg frames 4-5)
      ctx.save();
      const bezelScale = 0.88 + ease * 0.55;
      ctx.translate(W * 0.5, H * 0.5);
      ctx.scale(bezelScale, bezelScale);
      ctx.translate(-W * 0.5, -H * 0.5);
      ctx.strokeStyle = `rgba(10, 18, 14, ${crtAlpha * 0.95})`;
      ctx.lineWidth = 110;
      ctx.beginPath();
      ctx.roundRect(-35, -35, W + 70, H + 70, 95);
      ctx.stroke();
      ctx.restore();
    }
  }

  // Minimal world-anchored horizon reticle ONLY on pause or completion (matching f_039.jpg, zero HUD clutter!)
  function drawHorizonReticle() {
    CLICK_ZONES.length = 0;
    if (S.phase === 'replay' && S.paused) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.shadowColor = PAL.fg;
      ctx.shadowBlur = 10;
      ctx.fillStyle = PAL.acc;
      ctx.font = '700 16px "SF Mono", "Menlo", monospace';
      ctx.fillText('[ LIDAR PAUSED · SPACE RESUME · ←/→ STEP ]', VP_X, 175);
      ctx.restore();
      return;
    }

    if (S.phase !== 'complete') return;

    const countA = S.answers.filter(a => a.choice === 'A').length;
    const domLabel = countA >= 5 ? 'OPTION A' : 'OPTION B';

    const bw = 446;
    const bh = 96;
    const bx = VP_X - bw * 0.5;
    const by = 128;
    const cLen = 17;

    ctx.save();
    ctx.shadowColor = PAL.fg;
    ctx.shadowBlur = 16;
    ctx.strokeStyle = PAL.mint;
    ctx.lineWidth = 3.2;

    // Exact 4 corner targeting brackets from f_039.jpg
    ctx.beginPath();
    ctx.moveTo(bx, by + cLen); ctx.lineTo(bx, by); ctx.lineTo(bx + cLen, by);
    ctx.moveTo(bx + bw - cLen, by); ctx.lineTo(bx + bw, by); ctx.lineTo(bx + bw, by + cLen);
    ctx.moveTo(bx, by + bh - cLen); ctx.lineTo(bx, by + bh); ctx.lineTo(bx + cLen, by + bh);
    ctx.moveTo(bx + bw - cLen, by + bh); ctx.lineTo(bx + bw, by + bh); ctx.lineTo(bx + bw, by + bh - cLen);
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = PAL.acc;
    ctx.font = '700 23px "SF Mono", "Menlo", monospace';
    ctx.fillText(`[PATH OPTIMIZED: ${domLabel}]`, VP_X, by + 40);

    ctx.fillStyle = PAL.mint;
    ctx.font = '700 27px "SF Mono", "Menlo", monospace';
    ctx.fillText('CALIBRATION COMPLETE', VP_X, by + 76);

    // Compact 10-answer fingerprint & reversible [R] recalibrate cue (Law 8 & Law 12)
    const trace = S.answers.map(a => a.choice).join(' ');
    ctx.shadowBlur = 6;
    ctx.fillStyle = 'rgba(142, 255, 190, 0.78)';
    ctx.font = '14px "SF Mono", "Menlo", monospace';
    ctx.fillText(`${trace}   ·   [R] recalibrate`, VP_X, by + 116);
    CLICK_ZONES.push({ id: 'R', x: VP_X - 150, y: by + 98, w: 300, h: 28 });

    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    if (S.phase === 'boot' || S.phase === 'q' || S.phase === 'ans') {
      drawCRTPhase();
    } else if (S.phase === 'reveal') {
      drawThroughTheGlassReveal();
    } else {
      // Fade initial intense horizontal ground scanlines smoothly over the first 1.2s of replay
      // so f_009 (early street) has crisp scanlines and f_021/f_033 showcase glossy wet asphalt & chevrons!
      const earlyScan = S.phase === 'replay'
        ? Math.max(S.paused ? 0.55 : 0.0, 0.78 * Math.max(0, 1 - S.camZ / 36))
        : 0.0;
      const wallLidar = S.phase === 'complete' ? 0.75 : (S.paused ? 0.85 : 0.48);
      drawStreetWorld(earlyScan, wallLidar);
      drawHorizonReticle();
    }
  }

  let lastNow = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastNow) / 1000));
    lastNow = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>SUSHI CUTTING — 12/31/1999</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: #0e0805;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: "Courier New", Courier, monospace;
  }
  #wrap {
    position: relative;
    width: 100vw; height: 56.25vw;
    max-height: 100vh; max-width: 177.78vh;
    background: #1b1410;
    box-shadow: 0 22px 68px rgba(0, 0, 0, 0.82);
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
(() => {
  'use strict';

  const W = 1280, H = 720;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // Query parameters: ?autostart and ?seed=N
  const params = new URLSearchParams(location.search);
  const AUTOSTART = params.has('autostart');
  const INIT_SEED = (parseInt(params.get('seed') || '7', 10) >>> 0) || 7;
  let rngState = INIT_SEED;
  function rand() {
    rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0;
    return rngState / 4294967296;
  }

  // Strictly harmonized palette matching spec.json + sheet.jpg
  const PAL = {
    bg: '#1b1410',
    cream: '#f5e9d6',
    creamSoft: '#e8dcc4',
    paperTop: '#efe8d8',
    paperBot: '#e5dcc9',
    coral: '#e86a42',
    coralHot: '#ff6e40',
    sparkCore: '#fff6d6',
    ink: '#221913',
    glitchRed: '#8c271e'
  };

  // Exact stadium track geometry on 1280x720 counter_and_cutting_board.png:
  // Top cream rail: y=344..358, bottom cream rail: y=433..447 -> true center y=396
  const TRACK = {
    left: 161,
    right: 1119,
    y: 396,
    rollRadiusY: 45 // height = 90px -> fits cleanly inside y=351..441!
  };

  const GUIDES_6PCS = [300, 455, 610, 765, 920];               // 5 evenly spaced cuts (155px, clear of LIVES ***)
  const GUIDES_8PCS = [268, 380, 492, 604, 716, 828, 940];    // 7 evenly spaced cuts (112px, clear of LIVES ***)

  // Offscreen clean walnut board buffer (removes baked static 5-line dashes so 6PCS & 8PCS guides never ghost)
  const cleanBoard = document.createElement('canvas');
  cleanBoard.width = W;
  cleanBoard.height = H;
  const cbCtx = cleanBoard.getContext('2d');
  let boardReady = false;

  const bgImg = new Image();
  bgImg.onload = () => {
    cbCtx.drawImage(bgImg, 0, 0, W, H);
    // Seamlessly clone clean walnut + cream rail strips adjacent to the 5 baked vertical lines [320,480,640,800,960]
    for (const gx of [320, 480, 640, 800, 960]) {
      cbCtx.drawImage(cleanBoard, gx + 14, 296, 12, 198, gx - 6, 296, 12, 198);
    }
    boardReady = true;
  };
  bgImg.src = '../assets/counter_and_cutting_board.png';

  // Offscreen procedural embossed dark roasted-nori texture (blistered yakinori specular crinkles, zero cutout halos!)
  const noriTex = document.createElement('canvas');
  noriTex.width = 256;
  noriTex.height = 180;
  (function buildNoriTexture() {
    const nctx = noriTex.getContext('2d');
    const g = nctx.createLinearGradient(0, 0, 0, 180);
    g.addColorStop(0.00, '#222c20');
    g.addColorStop(0.16, '#3d4b37'); // warm spotlight blistered nori highlight band
    g.addColorStop(0.30, '#263223');
    g.addColorStop(0.58, '#141c14');
    g.addColorStop(0.85, '#0b100b');
    g.addColorStop(1.00, '#060906');
    nctx.fillStyle = g;
    nctx.fillRect(0, 0, 256, 180);

    // Rich organic crinkled toasted seaweed pockets + warm specular facets
    let s = 918273;
    const nr = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
    for (let i = 0; i < 560; i++) {
      const x = nr() * 256;
      const y = nr() * 180;
      const rx = 2.5 + nr() * 9;
      const ry = 1.8 + nr() * 5.5;
      const inSpec = y > 10 && y < 64;
      const bright = nr() > 0.45;
      nctx.fillStyle = bright
        ? (inSpec ? `rgba(138, 152, 118, ${0.10 + nr() * 0.16})` : `rgba(76, 94, 68, ${0.07 + nr() * 0.10})`)
        : `rgba(4, 7, 4, ${0.18 + nr() * 0.22})`;
      nctx.beginPath();
      nctx.ellipse(x, y, rx, ry, (nr() - 0.5) * 1.2, 0, Math.PI * 2);
      nctx.fill();
    }

    // Crinkled diagonal seaweed blister ridges
    nctx.lineWidth = 1.2;
    for (let i = 0; i < 140; i++) {
      const x = nr() * 256;
      const y = 8 + nr() * 78;
      nctx.strokeStyle = `rgba(175, 188, 150, ${0.06 + nr() * 0.13})`;
      nctx.beginPath();
      nctx.moveTo(x, y);
      nctx.lineTo(x + (nr() - 0.5) * 14, y + (nr() - 0.5) * 8);
      nctx.stroke();
    }

    // Subtle makisu bamboo-mat rolling ribs
    for (let x = 0; x < 256; x += 9) {
      nctx.fillStyle = 'rgba(0, 0, 0, 0.10)';
      nctx.fillRect(x, 0, 2, 180);
    }
  })();

  // Precomputed rice grain ring layout for crisp, plump sushi rice medallions
  const RICE_GRAINS = [];
  (function buildRiceLayout() {
    let s = 445566;
    const rr = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
    // Outer ring + inner ring of plump Japanese short-grain shari
    for (let ring = 0; ring < 2; ring++) {
      const count = ring === 0 ? 22 : 16;
      const rad = ring === 0 ? 31.5 : 23.5;
      for (let i = 0; i < count; i++) {
        const a = (Math.PI * 2 * i) / count + ring * 0.19 + (rr() - 0.5) * 0.14;
        const r = rad + (rr() - 0.5) * 2.4;
        RICE_GRAINS.push({
          x: Math.cos(a) * r * 1.04,
          y: Math.sin(a) * r * 0.98,
          rot: a + Math.PI * 0.5 + (rr() - 0.5) * 0.7,
          rx: 5.1 + rr() * 1.3,
          ry: 2.9 + rr() * 0.7,
          shade: rr()
        });
      }
    }
  })();

  // Audio: Lyria loop + layered procedural WebAudio SFX
  const bgm = new Audio('../assets/bgm_loop.mp3');
  bgm.loop = true;
  bgm.volume = 0.36;
  let audioCtx = null;
  let bgmPlaying = false;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    if (!bgmPlaying) {
      bgmPlaying = true;
      bgm.play().catch(() => { bgmPlaying = false; });
    }
  }

  function playSfx(kind, combo = 1) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;

    if (kind === 'chop' || kind === 'sloppy') {
      const crisp = kind === 'chop';
      // 1. Warm walnut cutting-board *thock*
      const thock = audioCtx.createOscillator();
      const tg = audioCtx.createGain();
      thock.type = 'triangle';
      thock.frequency.setValueAtTime(crisp ? 215 : 145, now);
      thock.frequency.exponentialRampToValueAtTime(54, now + 0.085);
      tg.gain.setValueAtTime(crisp ? 0.28 : 0.18, now);
      tg.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      thock.connect(tg).connect(audioCtx.destination);
      thock.start(now);
      thock.stop(now + 0.095);

      // 2. Wet nori-and-fish blade slice transient
      const len = Math.floor(audioCtx.sampleRate * 0.05);
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buf;
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = crisp ? 3100 : 1600;
      bp.Q.value = 1.4;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(crisp ? 0.18 : 0.10, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      noise.connect(bp).connect(ng).connect(audioCtx.destination);
      noise.start(now);

      // 3. Subtle rising steel harmonic chime on clean streak
      if (crisp) {
        const chime = audioCtx.createOscillator();
        const cg = audioCtx.createGain();
        chime.type = 'sine';
        const freq = 540 * Math.pow(1.065, Math.min(10, combo));
        chime.frequency.setValueAtTime(freq, now);
        chime.frequency.exponentialRampToValueAtTime(freq * 1.18, now + 0.11);
        cg.gain.setValueAtTime(0.085, now);
        cg.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        chime.connect(cg).connect(audioCtx.destination);
        chime.start(now);
        chime.stop(now + 0.125);
      }
    } else if (kind === 'fault') {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(155, now);
      osc.frequency.linearRampToValueAtTime(82, now + 0.2);
      g.gain.setValueAtTime(0.13, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.21);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.22);
    } else if (kind === 'printer') {
      // Crisp Y2K thermal stepper-motor zip + paper tear
      for (let i = 0; i < 4; i++) {
        const t = now + i * 0.036;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(880 + (i % 2) * 210 + i * 55, t);
        g.gain.setValueAtTime(0.032, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
        osc.connect(g).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.032);
      }
      // Paper tear crisp hiss
      const tLen = Math.floor(audioCtx.sampleRate * 0.07);
      const tBuf = audioCtx.createBuffer(1, tLen, audioCtx.sampleRate);
      const td = tBuf.getChannelData(0);
      for (let i = 0; i < tLen; i++) td[i] = (Math.random() * 2 - 1) * (i / tLen) * (1 - i / tLen) * 3;
      const tSrc = audioCtx.createBufferSource();
      tSrc.buffer = tBuf;
      const hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 3400;
      const tg = audioCtx.createGain();
      tg.gain.setValueAtTime(0.11, now + 0.11);
      tg.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      tSrc.connect(hp).connect(tg).connect(audioCtx.destination);
      tSrc.start(now + 0.11);
    }
  }

  // Order presets harmonized with sheet.jpg ("T4 8 PCS SALMON / 01/01/1900", "T2 6 PCS TUNA / 12/31/1999", "T3 8 PCS SALMON")
  const PRESET_ORDERS = [
    { table: 4, pcs: 8, fish: 'SALMON',  glitchDate: true,  dualDate: false, speed: 212, segW: 72 },
    { table: 2, pcs: 6, fish: 'TUNA',    glitchDate: false, dualDate: false, speed: 278, segW: 80 },
    { table: 3, pcs: 8, fish: 'SALMON',  glitchDate: true,  dualDate: true,  speed: 226, segW: 72 },
    { table: 1, pcs: 8, fish: 'AVOCADO', glitchDate: true,  dualDate: false, speed: 232, segW: 72 },
    { table: 5, pcs: 8, fish: 'SALMON',  glitchDate: true,  dualDate: false, speed: 238, segW: 72 }
  ];
  const FILLING_POOL = ['SALMON', 'TUNA', 'AVOCADO'];

  function createOrder(seq) {
    let spec;
    if (seq < PRESET_ORDERS.length) {
      spec = PRESET_ORDERS[seq];
    } else {
      const pcs = rand() < 0.62 ? 8 : 6;
      const fish = FILLING_POOL[Math.floor(rand() * FILLING_POOL.length)];
      const table = 1 + Math.floor(rand() * 5);
      spec = {
        table,
        pcs,
        fish,
        glitchDate: rand() < 0.72,
        dualDate: rand() < 0.35,
        speed: (pcs === 8 ? 228 : 272) + Math.min(45, seq * 5),
        segW: pcs === 8 ? 72 : 80
      };
    }
    const guides = (spec.pcs === 8 ? GUIDES_8PCS : GUIDES_6PCS).slice();
    return {
      seq,
      table: spec.table,
      pcs: spec.pcs,
      fish: spec.fish,
      glitchDate: spec.glitchDate,
      dualDate: spec.dualDate,
      dateStr: spec.glitchDate ? '01/01/1900' : '12/31/1999',
      guides,
      speed: spec.speed,
      segW: spec.segW,
      totalLen: spec.pcs * spec.segW
    };
  }

  const SHIFT_DURATION = 85; // 8-minute NYE countdown compressed to crisp 85s arcade shift

  // Core state machine:
  // 'title' (REST) | 'ready' (READY) | 'cut' (WORKING / CHANGED) | 'closed' (FAULT) | 'mid' (COMPLETE)
  const game = {
    mode: AUTOSTART ? 'ready' : 'title',
    paused: false,
    score: AUTOSTART ? 340 : 0,
    combo: AUTOSTART ? 1 : 0,
    maxCombo: AUTOSTART ? 1 : 0,
    comboBloom: 0,
    lives: 3,
    lifeFlash: 0,
    platesServed: 0,
    evenCuts: 0,
    totalCuts: 0,
    shiftTime: 0,
    readyTimer: 0,
    hitStop: 0,
    orderCursor: 0,
    currentOrder: null,
    nextOrder: null,
    roll: null,
    sweepingPieces: [], // finished pieces gliding off right edge while next roll enters
    tornSlips: [],      // torn thermal tickets fluttering away
    ticketFeedAnim: 0,  // 1 -> 0 upward paper extrusion
    orderStampTimer: 0, // brief 'ORDER COMPLETE' stamp before tear
    pendingAdvance: false,
    knife: {
      x: 280,
      baseX: 280,
      aimOffset: 0,     // optional mouse / ArrowLeft-Right micro-aim
      chopAnim: 0,      // 1 -> 0 chop impulse
      sliceStreakX: 280,
      faultFlash: 0
    },
    sparks: [],
    starbursts: [],
    riceGrains: [],
    screenShake: 0,
    time: 0
  };

  function spawnRollForOrder(ord, initialRightX) {
    game.roll = {
      left: initialRightX - ord.totalLen,
      right: initialRightX,
      piecesLeft: ord.pcs,
      cutsDone: 0,
      fish: ord.fish,
      idealSegW: ord.segW,
      pieces: [] // sliced right-side medallions still accompanying this roll
    };
    game.knife.baseX = ord.guides[0];
    game.knife.x = ord.guides[0] + game.knife.aimOffset;
  }

  function initShift(isAutostart) {
    rngState = INIT_SEED;
    game.paused = false;
    game.score = isAutostart ? 340 : 0;
    game.combo = isAutostart ? 1 : 0;
    game.maxCombo = game.combo;
    game.comboBloom = 0;
    game.lives = 3;
    game.lifeFlash = 0;
    game.platesServed = 0;
    game.evenCuts = 0;
    game.totalCuts = 0;
    game.shiftTime = 0;
    game.readyTimer = 0;
    game.hitStop = 0;
    game.sparks = [];
    game.starbursts = [];
    game.riceGrains = [];
    game.sweepingPieces = [];
    game.tornSlips = [];
    game.ticketFeedAnim = 0;
    game.orderStampTimer = 0;
    game.pendingAdvance = false;
    game.knife.aimOffset = 0;
    game.knife.chopAnim = 0;
    game.knife.faultFlash = 0;

    game.currentOrder = createOrder(0);
    game.nextOrder = createOrder(1);
    game.orderCursor = 2;

    // On ?autostart, glide roll to x=330 during pre-roll and poise cleanly in READY until wake click (or 2.8s fallback)
    spawnRollForOrder(game.currentOrder, isAutostart ? -40 : 120);
    game.mode = isAutostart ? 'ready' : 'cut';
  }

  function getNextSeamX() {
    const r = game.roll;
    if (!r || r.piecesLeft <= 1) return null;
    const segW = (r.right - r.left) / r.piecesLeft;
    return r.right - segW;
  }

  function getActiveGuideX() {
    const ord = game.currentOrder;
    const r = game.roll;
    if (!ord || !r || r.cutsDone >= ord.guides.length) return null;
    return ord.guides[r.cutsDone];
  }

  function emitCutJuice(x, y, isEven, combo) {
    // 105–140 crisp 360-degree hot-core radial spark streaks spanning the full walnut board (matching f_007, f_009, f_021!)
    const sparkCount = isEven ? Math.min(142, 106 + combo * 5) : 38;
    for (let i = 0; i < sparkCount; i++) {
      const baseAngle = (Math.PI * 2 * i) / sparkCount;
      const angle = baseAngle + (rand() - 0.5) * 0.24;
      const tier = rand();
      const speed = isEven
        ? (tier < 0.28 ? 190 + rand() * 230 : (tier < 0.72 ? 430 + rand() * 340 : 760 + rand() * 320))
        : (140 + rand() * 240);
      const maxLife = isEven ? (0.62 + rand() * 0.48) : (0.34 + rand() * 0.22);
      game.sparks.push({
        x: x + (rand() - 0.5) * 8,
        y: y + (rand() - 0.5) * 20,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 14,
        life: maxLife,
        maxLife,
        len: isEven ? (10 + rand() * 16) : (7 + rand() * 8),
        hot: rand() < 0.68
      });
    }

    // Crisp vector starburst right under the blade edge
    game.starbursts.push({
      x,
      y: y + 4,
      t: 0,
      dur: isEven ? 0.19 : 0.11,
      radius: isEven ? 84 : 44,
      rot: rand() * Math.PI
    });

    // 6–9 tumbling white sushi rice grains that bounce on the walnut board
    const riceCount = isEven ? (6 + Math.floor(rand() * 4)) : 3;
    for (let i = 0; i < riceCount; i++) {
      game.riceGrains.push({
        x: x + (rand() - 0.5) * 16,
        y: y - 10 + (rand() - 0.5) * 20,
        vx: (rand() - 0.5) * 250,
        vy: -145 - rand() * 170,
        rot: rand() * Math.PI * 2,
        vrot: (rand() - 0.5) * 14,
        bounceY: 442 + rand() * 24,
        bounced: false,
        life: 0.82 + rand() * 0.30
      });
    }
  }

  function completeCurrentRoll() {
    const r = game.roll;
    const ord = game.currentOrder;
    if (!r || !ord) return;

    // Detach the final leftmost piece so all 6 or 8 pieces glide off together!
    const lastW = Math.max(46, r.right - r.left);
    r.pieces.push({
      cx: (r.left + r.right) * 0.5,
      w: lastW,
      fish: r.fish,
      faceUp: false,
      tilt: 0,
      pop: 0
    });
    r.piecesLeft = 0;

    // Move all pieces into sweepingPieces so they briskly clear the right side of the track
    for (const p of r.pieces) {
      game.sweepingPieces.push({
        ...p,
        vx: Math.max(460, ord.speed * 1.85)
      });
    }
    r.pieces = [];
    game.roll = null;

    game.platesServed++;
    game.score += 60;
    game.orderStampTimer = 0.26;
    game.pendingAdvance = true;
  }

  function advancePrinterAndSpawnNext() {
    game.pendingAdvance = false;
    const finished = game.currentOrder;
    if (finished) {
      game.tornSlips.push({
        table: finished.table,
        pcs: finished.pcs,
        fish: finished.fish,
        dateStr: finished.dateStr,
        glitchDate: finished.glitchDate,
        x: 1014,
        y: 486,
        vx: 95 + rand() * 45,
        vy: -35,
        rot: 0,
        vrot: 1.35,
        life: 0.55
      });
    }

    if (game.lives <= 0) {
      game.mode = 'closed';
      return;
    }
    if (game.shiftTime >= SHIFT_DURATION) {
      game.mode = 'mid';
      return;
    }

    playSfx('printer');
    game.currentOrder = game.nextOrder;
    game.nextOrder = createOrder(game.orderCursor++);
    game.ticketFeedAnim = 1.0;

    // Spawn next maki roll smoothly entering from left so rhythm continues unbroken
    const nextOrd = game.currentOrder;
    const entryRight = nextOrd.pcs === 6 ? 275 : 225;
    spawnRollForOrder(nextOrd, entryRight);
    game.mode = 'cut';
  }

  function registerFault() {
    playSfx('fault');
    game.combo = 0;
    game.comboBloom = 0;
    game.lives = Math.max(0, game.lives - 1);
    game.lifeFlash = 1.0;
    game.knife.faultFlash = 1.0;
    game.screenShake = 7.0;
    if (game.lives <= 0) {
      game.mode = 'closed';
    }
  }

  function performCut() {
    ensureAudio();

    if (game.mode === 'ready') {
      // Wake / engage conveyor cleanly without wasting a cut
      game.roll.right = 322;
      game.roll.left = 322 - game.currentOrder.totalLen;
      game.mode = 'cut';
      return;
    }

    if (game.mode !== 'cut' || game.paused || !game.roll || game.roll.piecesLeft <= 1) return;

    const r = game.roll;
    const ord = game.currentOrder;
    const guideX = getActiveGuideX();
    const kx = game.knife.x;
    const seamX = getNextSeamX();

    game.knife.chopAnim = 1.0;
    game.knife.sliceStreakX = kx;

    // Check if blade actually intersects the uncut roll with meaningful margin
    if (kx < r.left + 22 || kx > r.right - 20) {
      registerFault();
      return;
    }

    const seamErr = Math.abs(kx - seamX);
    const guideErr = guideX !== null ? Math.abs(kx - guideX) : seamErr;
    const err = Math.min(seamErr, guideErr);

    if (err <= 68) {
      const isEven = seamErr <= 30;
      // Snap clean even cuts neatly to the ideal portion seam so pieces look crisp & uniform
      const cutX = isEven
        ? Math.max(r.left + 28, Math.min(r.right - 28, seamX))
        : Math.max(r.left + 24, Math.min(r.right - 24, kx));

      const pieceW = r.right - cutX;
      r.cutsDone++;
      r.piecesLeft--;
      game.totalCuts++;

      // Push previously sliced pieces rightward by 8.5px so every cut creates a crisp 9-12px physical gap
      for (const p of r.pieces) {
        p.cx += 8.5;
      }

      // Periodically tip cut medallions face-up (matching sheet.jpg frames 6, 9, 15, 21, 33!)
      const tipFaceUp = (ord.pcs === 8)
        ? (r.cutsDone % 2 === 0)
        : (r.cutsDone % 2 === 1);

      r.pieces.push({
        cx: (cutX + r.right) * 0.5 + 7.5,
        w: pieceW,
        fish: r.fish,
        faceUp: tipFaceUp,
        tilt: tipFaceUp ? 0.01 : 0,
        pop: 1.0
      });

      r.right = cutX - 2.5;

      if (isEven) {
        game.evenCuts++;
        game.combo++;
        if (game.combo > game.maxCombo) game.maxCombo = game.combo;
        game.comboBloom = 1.0;
        const pts = 20 * Math.min(5, Math.max(1, game.combo - 1));
        game.score += pts;
        game.hitStop = 0.035; // Juicy 35ms hit-stop!
        game.screenShake = Math.min(5.5, 2.8 + game.combo * 0.35);
        playSfx('chop', game.combo);
        emitCutJuice(kx, TRACK.y, true, game.combo);
      } else {
        game.combo = 1;
        game.comboBloom = 0.35;
        game.score += 10;
        game.hitStop = 0.020;
        game.screenShake = 2.0;
        playSfx('sloppy', 1);
        emitCutJuice(kx, TRACK.y, false, 1);
      }

      // Advance target guide station for the knife
      if (r.piecesLeft <= 1 || r.cutsDone >= ord.guides.length) {
        completeCurrentRoll();
      } else {
        game.knife.baseX = ord.guides[r.cutsDone];
      }
    } else {
      registerFault();
    }
  }

  // Keyboard & Pointer Controls
  const heldKeys = { left: false, right: false };

  window.addEventListener('keydown', (e) => {
    ensureAudio();
    const k = e.key;

    if (k === 'ArrowLeft' || k === 'a' || k === 'A') heldKeys.left = true;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') heldKeys.right = true;

    if (game.mode === 'title') {
      if (k === ' ' || k === 'Enter') {
        e.preventDefault();
        initShift(false);
        playSfx('printer');
      }
      return;
    }

    if (game.mode === 'closed' || game.mode === 'mid') {
      if (k === 'r' || k === 'R' || k === 'Enter' || k === ' ') {
        e.preventDefault();
        initShift(false);
        playSfx('printer');
      }
      return;
    }

    if (k === 'p' || k === 'P' || k === 'Escape') {
      e.preventDefault();
      game.paused = !game.paused;
      return;
    }

    if (game.paused && (k === 'r' || k === 'R')) {
      e.preventDefault();
      initShift(false);
      playSfx('printer');
      return;
    }

    if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      performCut();
    }
  });

  window.addEventListener('keyup', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') heldKeys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') heldKeys.right = false;
  });

  let mouseIdleTimer = 99;
  canvas.addEventListener('mousemove', (e) => {
    if (game.mode !== 'cut' || game.paused) return;
    const rect = canvas.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * W;
    const rawOffset = mx - game.knife.baseX;
    game.knife.aimOffset = Math.max(-85, Math.min(85, rawOffset * 0.65));
    mouseIdleTimer = 0;
  });

  canvas.addEventListener('mousedown', (e) => {
    ensureAudio();
    if (e.button !== 0) return;
    if (game.mode === 'title') {
      initShift(false);
      playSfx('printer');
      return;
    }
    if (game.mode === 'closed' || game.mode === 'mid') {
      initShift(false);
      playSfx('printer');
      return;
    }
    if (game.paused) {
      game.paused = false;
      return;
    }
    performCut();
  });

  // =========================================================================
  // RENDERING: Walnut Counter, Maki Cylinders, Marbled Medallions, Santoku, Printer, Sparks
  // =========================================================================

  function drawBoardAndGuides() {
    if (boardReady) {
      ctx.drawImage(cleanBoard, 0, 0, W, H);
    } else if (bgImg.complete && bgImg.naturalWidth > 0) {
      ctx.drawImage(bgImg, 0, 0, W, H);
    } else {
      ctx.fillStyle = PAL.bg;
      ctx.fillRect(0, 0, W, H);
    }

    const ord = game.currentOrder;
    if (!ord) return;

    const activeIdx = game.roll ? game.roll.cutsDone : ord.guides.length;
    const seamX = getNextSeamX();

    ctx.save();
    ctx.setLineDash([10, 9]);
    ctx.lineCap = 'butt';

    for (let i = 0; i < ord.guides.length; i++) {
      const gx = ord.guides[i];
      const isDone = i < activeIdx;
      const isActive = i === activeIdx && (game.mode === 'cut' || game.mode === 'ready');
      const aligned = isActive && seamX !== null && Math.abs(seamX - gx) <= 26;

      if (isActive) {
        ctx.strokeStyle = aligned ? '#ff986e' : PAL.coral;
        ctx.lineWidth = aligned ? 4.2 : 3.5;
        ctx.globalAlpha = aligned ? 0.98 : 0.88;
        if (aligned) {
          ctx.shadowColor = PAL.coralHot;
          ctx.shadowBlur = 12;
        } else {
          ctx.shadowBlur = 0;
        }
      } else {
        ctx.strokeStyle = PAL.coral;
        ctx.lineWidth = 3.2;
        ctx.globalAlpha = isDone ? 0.34 : 0.72;
        ctx.shadowBlur = 0;
      }

      ctx.beginPath();
      ctx.moveTo(gx, 306);
      ctx.lineTo(gx, 486);
      ctx.stroke();
    }
    ctx.restore();
  }

  function getFishColors(fish) {
    if (fish === 'TUNA') {
      return {
        base: '#cc2938',
        deep: '#961522',
        bright: '#ef5362',
        stripe: 'rgba(255, 198, 204, 0.55)',
        accent: '#6fa83b'
      };
    }
    if (fish === 'AVOCADO') {
      return {
        base: '#8bc34a',
        deep: '#558b2f',
        bright: '#d4e87c',
        stripe: 'rgba(244, 252, 198, 0.62)',
        accent: '#3e6b22'
      };
    }
    // Default SALMON (marbled Norwegian Atlantic salmon)
    return {
      base: '#ff7144',
      deep: '#d84b24',
      bright: '#ff9b73',
      stripe: 'rgba(255, 234, 220, 0.78)',
      accent: '#5d9636'
    };
  }

  // Draw angled 3D elliptical cross-section end-cap on the right face of a side-lying maki cylinder
  function drawCylinderEndCap(x, y, rx, ry, fish) {
    const fc = getFishColors(fish);

    // Outer dark roasted-nori rim
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#141d15';
    ctx.fill();

    // Seasoned sushi rice bed
    const riceGrad = ctx.createLinearGradient(x - rx, y - ry, x + rx, y + ry);
    riceGrad.addColorStop(0, '#faf5ea');
    riceGrad.addColorStop(0.65, '#ede4d3');
    riceGrad.addColorStop(1, '#d5cab6');
    ctx.beginPath();
    ctx.ellipse(x, y, rx * 0.86, ry * 0.88, 0, 0, Math.PI * 2);
    ctx.fillStyle = riceGrad;
    ctx.fill();

    // Subtle bumpy rice grain dots on elliptical cross-section
    ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
    for (let a = 0; a < Math.PI * 2; a += 0.65) {
      ctx.beginPath();
      ctx.ellipse(
        x + Math.cos(a) * rx * 0.66,
        y + Math.sin(a) * ry * 0.70,
        rx * 0.16,
        ry * 0.08,
        a, 0, Math.PI * 2
      );
      ctx.fill();
    }

    // Cucumber / avocado accent sliver
    ctx.beginPath();
    ctx.ellipse(x - rx * 0.10, y - ry * 0.18, rx * 0.34, ry * 0.24, 0, 0, Math.PI * 2);
    ctx.fillStyle = fc.accent;
    ctx.fill();

    // Rich fish core
    const fg = ctx.createLinearGradient(x, y - ry * 0.45, x, y + ry * 0.45);
    fg.addColorStop(0, fc.bright);
    fg.addColorStop(0.55, fc.base);
    fg.addColorStop(1, fc.deep);
    ctx.beginPath();
    ctx.ellipse(x + rx * 0.04, y + ry * 0.04, rx * 0.48, ry * 0.46, 0, 0, Math.PI * 2);
    ctx.fillStyle = fg;
    ctx.fill();

    // Marbling striations inside end-cap
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x + rx * 0.04, y + ry * 0.04, rx * 0.46, ry * 0.44, 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.strokeStyle = fc.stripe;
    ctx.lineWidth = 1.4;
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.moveTo(x - rx * 0.5, y + k * 9 - 5);
      ctx.lineTo(x + rx * 0.6, y + k * 9 + 6);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Draw a tactile roasted-nori cylinder from xLeft to xRight centered at TRACK.y
  function drawNoriCylinder(xLeft, xRight, y, ry, fish, isMainLog, seamHintX) {
    const w = xRight - xLeft;
    if (w < 6 || xRight < -30 || xLeft > W + 30) return;
    const rx = Math.min(12.5, Math.max(5.5, w * 0.18));

    ctx.save();

    // Soft contact shadow inside stadium track
    ctx.beginPath();
    ctx.roundRect(xLeft + 2, y + ry - 9, w + rx * 0.7, 17, 8);
    ctx.fillStyle = 'rgba(10, 5, 2, 0.48)';
    ctx.fill();

    // Cylinder silhouette (curved left end + straight top/bottom + curved right end)
    ctx.beginPath();
    ctx.ellipse(xLeft, y, rx * 0.78, ry, 0, Math.PI * 0.5, Math.PI * 1.5);
    ctx.lineTo(xRight, y - ry);
    ctx.ellipse(xRight, y, rx, ry, 0, -Math.PI * 0.5, Math.PI * 0.5);
    ctx.closePath();

    ctx.save();
    ctx.clip();
    // Tile roasted-nori texture horizontally locked to the roll's surface so it moves with the roll!
    const tileW = 220;
    const startTile = Math.floor(xLeft / tileW) * tileW;
    const offsetPhase = ((xLeft % tileW) + tileW) % tileW;
    for (let tx = xLeft - offsetPhase; tx < xRight + tileW; tx += tileW) {
      ctx.drawImage(noriTex, tx, y - ry, tileW + 1, ry * 2);
    }

    // Subtle tucked left-end roll rim shadow (zero protruding orange cone!)
    if (isMainLog) {
      const lg = ctx.createLinearGradient(xLeft - rx, 0, xLeft + 18, 0);
      lg.addColorStop(0, 'rgba(5, 8, 5, 0.72)');
      lg.addColorStop(1, 'rgba(5, 8, 5, 0)');
      ctx.fillStyle = lg;
      ctx.fillRect(xLeft - rx, y - ry, rx + 20, ry * 2);

      // Subtle diegetic makisu portion groove at the next target seam so human eyes read rhythm cleanly
      if (seamHintX !== null && seamHintX > xLeft + 16 && seamHintX < xRight - 14) {
        ctx.strokeStyle = 'rgba(255, 132, 92, 0.28)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(seamXClamp(seamHintX), y - ry + 3);
        ctx.lineTo(seamXClamp(seamHintX), y + ry - 3);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    ctx.restore();

    // Tiny authentic tucked rice glimpse at far-left edge of hand-rolled maki, OR crisp sliced rice+fish crescent on cut cylinder pieces (like f_009 & f_033!)
    if (isMainLog && xLeft > -10) {
      ctx.beginPath();
      ctx.ellipse(xLeft - rx * 0.42, y, 3.2, ry * 0.52, 0, Math.PI * 0.5, Math.PI * 1.5);
      ctx.fillStyle = '#dfd4c0';
      ctx.fill();
    } else if (!isMainLog) {
      const fc = getFishColors(fish);
      ctx.beginPath();
      ctx.ellipse(xLeft + 1.2, y, rx * 0.68, ry * 0.90, 0, Math.PI * 0.5, Math.PI * 1.5);
      ctx.fillStyle = '#efe6d5';
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(xLeft + 0.6, y, rx * 0.34, ry * 0.48, 0, Math.PI * 0.5, Math.PI * 1.5);
      ctx.fillStyle = fc.base;
      ctx.fill();
    }

    // Crisp 3D cross-section end-cap on the right face
    drawCylinderEndCap(xRight, y, rx, ry, fish);

    ctx.restore();
  }

  function seamXClamp(v) { return v; }

  // Draw a face-up marbled maki medallion matching f_021.jpg & f_033.jpg (rounded squircle + 3D nori cuff)
  function drawFaceUpMedallion(cx, y, fish, popFrac) {
    if (cx < -60 || cx > W + 60) return;
    const fc = getFishColors(fish);
    const halfW = 44;
    const halfH = 42;
    const liftY = y - 3 - Math.sin(popFrac * Math.PI) * 7;

    ctx.save();

    // Board contact shadow
    ctx.beginPath();
    ctx.ellipse(cx + 1, y + 42, 44, 12, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(10, 5, 2, 0.52)';
    ctx.fill();

    // 3D dark roasted-nori cylinder base cuff beneath face-up slice (exact look of f_021.jpg!)
    ctx.beginPath();
    ctx.roundRect(cx - halfW, liftY - halfH + 8, halfW * 2, halfH * 2 + 4, 22);
    const cuffGrad = ctx.createLinearGradient(cx - halfW, 0, cx + halfW, 0);
    cuffGrad.addColorStop(0, '#0c120d');
    cuffGrad.addColorStop(0.35, '#1d291e');
    cuffGrad.addColorStop(0.7, '#121a13');
    cuffGrad.addColorStop(1, '#090d09');
    ctx.fillStyle = cuffGrad;
    ctx.fill();

    // Top face-up dark nori outer wrap
    ctx.beginPath();
    ctx.roundRect(cx - halfW, liftY - halfH, halfW * 2, halfH * 2, 22);
    ctx.fillStyle = '#151f16';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(85, 108, 80, 0.42)';
    ctx.stroke();

    // Base seasoned shari rice cushion
    ctx.beginPath();
    ctx.roundRect(cx - halfW + 5, liftY - halfH + 5, (halfW - 5) * 2, (halfH - 5) * 2, 18);
    const rGrad = ctx.createRadialGradient(cx - 8, liftY - 8, 6, cx, liftY, 44);
    rGrad.addColorStop(0, '#fbf7ee');
    rGrad.addColorStop(0.75, '#efe7d6');
    rGrad.addColorStop(1, '#d8ceba');
    ctx.fillStyle = rGrad;
    ctx.fill();

    // Individual plump pearlescent sushi rice grains around the medallion
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(cx - halfW + 5, liftY - halfH + 5, (halfW - 5) * 2, (halfH - 5) * 2, 18);
    ctx.clip();
    for (const g of RICE_GRAINS) {
      ctx.save();
      ctx.translate(cx + g.x, liftY + g.y);
      ctx.rotate(g.rot);
      ctx.beginPath();
      ctx.ellipse(0, 0, g.rx, g.ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = g.shade > 0.5 ? '#fffdf8' : '#e6dcc8';
      ctx.fill();
      ctx.strokeStyle = 'rgba(176, 162, 138, 0.38)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    // Subtle organic cucumber crescent tucked on upper-left corner only (so creamy white rice directly hugs the salmon!)
    ctx.beginPath();
    ctx.ellipse(cx - 17, liftY - 14, 9, 6, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = fc.accent;
    ctx.fill();

    // Generous marbled fish cushion core (matching f_021.jpg & f_033.jpg!)
    const coreW = 48, coreH = 44;
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(cx - coreW * 0.5, liftY - coreH * 0.5, coreW, coreH, 15);
    const fGrad = ctx.createLinearGradient(cx - 22, liftY - 22, cx + 22, liftY + 22);
    fGrad.addColorStop(0, fc.bright);
    fGrad.addColorStop(0.55, fc.base);
    fGrad.addColorStop(1, fc.deep);
    ctx.fillStyle = fGrad;
    ctx.fill();

    // Clip inside fish cushion to paint natural curved fat striations & wet sashimi gloss
    ctx.clip();
    ctx.strokeStyle = fc.stripe;
    ctx.lineWidth = fish === 'SALMON' ? 2.3 : 1.6;
    ctx.lineCap = 'round';
    for (let k = -2; k <= 2; k++) {
      const oy = k * 9.5;
      ctx.beginPath();
      ctx.moveTo(cx - 26, liftY + oy - 10);
      ctx.quadraticCurveTo(cx + 2, liftY + oy - 2, cx + 26, liftY + oy + 11);
      ctx.stroke();
    }

    // Wet sashimi specular sheen
    ctx.fillStyle = 'rgba(255, 255, 255, 0.24)';
    ctx.beginPath();
    ctx.ellipse(cx - 7, liftY - 9, 11, 4.5, -0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  function drawAllSushi() {
    // 1. Draw sweeping completed pieces exiting right
    for (const p of game.sweepingPieces) {
      if (p.faceUp) {
        drawFaceUpMedallion(p.cx, TRACK.y, p.fish, 0);
      } else {
        drawNoriCylinder(p.cx - p.w * 0.5, p.cx + p.w * 0.5, TRACK.y, TRACK.rollRadiusY, p.fish, false, null);
      }
    }

    // 2. Draw active roll + separated cut medallions
    const r = game.roll;
    if (!r) return;

    const seamX = getNextSeamX();
    if (r.piecesLeft >= 1) {
      drawNoriCylinder(r.left, r.right, TRACK.y, TRACK.rollRadiusY, r.fish, true, seamX);
    }

    // Draw right-to-left or left-to-right sorted so overlap perspective is clean (left pieces overlap right end-caps slightly if tight, though ours have 6-9px air gaps!)
    const sorted = r.pieces.slice().sort((a, b) => b.cx - a.cx);
    for (const p of sorted) {
      if (p.faceUp) {
        drawFaceUpMedallion(p.cx, TRACK.y, p.fish, p.pop);
      } else {
        drawNoriCylinder(p.cx - p.w * 0.5, p.cx + p.w * 0.5, TRACK.y, TRACK.rollRadiusY, p.fish, false, null);
      }
    }
  }

  // Gleaming Japanese Santoku / Gyuto Chef's Knife descending from top of frame (zero cutout fringe!)
  // Broadside satin steel when poised (f_001, f_021), snapping edge-on razor slice on chop (f_007, f_009)!
  function drawChefKnife() {
    const kx = game.knife.x;
    const c = game.knife.chopAnim;
    const chopCurve = Math.sin(c * Math.PI);

    // Idle gentle poise breath + downward chop plunge through the roll
    const breath = Math.sin(game.time * 4.2) * 3.5 * (1 - c);
    const tipY = 312 + breath + chopCurve * 138;
    const bladeLen = 232;
    const heelY = tipY - bladeLen;

    // Perspective foreshortening: broadside (1.0) while raised -> razor edge-on (0.18) at chop impact!
    const broadFactor = 1 - 0.82 * Math.pow(chopCurve, 0.75);
    const bladeW = 66 * broadFactor;

    ctx.save();

    // Subtle vertical slice-line alignment whisker beneath blade tip
    if (game.mode === 'cut' || game.mode === 'ready') {
      ctx.strokeStyle = game.knife.faultFlash > 0.1
        ? `rgba(255, 82, 68, ${0.55 * game.knife.faultFlash})`
        : 'rgba(255, 242, 224, 0.16)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(kx, tipY);
      ctx.lineTo(kx, 446);
      ctx.stroke();
    }

    // Soft cast shadow on walnut counter beneath hovering blade
    ctx.fillStyle = 'rgba(8, 4, 2, 0.28)';
    ctx.beginPath();
    ctx.ellipse(kx + 12, Math.min(448, tipY + 46), 10 + bladeW * 0.35, 22, 0.12, 0, Math.PI * 2);
    ctx.fill();

    // 1. Dark Pakkawood Handle descending from top of screen
    const spineX = kx + bladeW * 0.36;
    const handleW = Math.max(12, 16 + broadFactor * 10);
    const handleX = spineX - handleW * 0.62;
    const handleTop = -20;
    const bolsterTop = heelY - 26;

    const hGrad = ctx.createLinearGradient(handleX, 0, handleX + handleW, 0);
    hGrad.addColorStop(0, '#121010');
    hGrad.addColorStop(0.35, '#2b2725');
    hGrad.addColorStop(0.75, '#191615');
    hGrad.addColorStop(1, '#0c0a0a');
    ctx.fillStyle = hGrad;
    ctx.beginPath();
    ctx.roundRect(handleX, handleTop, handleW, bolsterTop - handleTop + 6, 4);
    ctx.fill();

    // Brushed stainless handle rivets
    ctx.fillStyle = '#d9dde2';
    for (const ry of [bolsterTop - 52, bolsterTop - 22]) {
      if (ry > -6) {
        ctx.beginPath();
        ctx.ellipse(handleX + handleW * 0.5, ry, Math.max(2.2, 3.6 * broadFactor), 3.6, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 2. Polished Stainless Steel Bolster Collar
    const bGrad = ctx.createLinearGradient(handleX - 3, 0, handleX + handleW + 3, 0);
    bGrad.addColorStop(0, '#7d8288');
    bGrad.addColorStop(0.42, '#ffffff');
    bGrad.addColorStop(0.75, '#c4c9cf');
    bGrad.addColorStop(1, '#686d73');
    ctx.fillStyle = bGrad;
    ctx.beginPath();
    ctx.moveTo(handleX - 1, bolsterTop);
    ctx.lineTo(handleX + handleW + 1, bolsterTop);
    ctx.lineTo(spineX + 2, heelY + 2);
    ctx.lineTo(spineX - Math.max(8, bladeW * 0.34), heelY + 2);
    ctx.closePath();
    ctx.fill();

    // 3. Gleaming Santoku Steel Blade (straight spine on right, curved cutting belly on left -> tip at bottom-right)
    const edgeLeftX = spineX - bladeW;
    ctx.beginPath();
    ctx.moveTo(spineX, heelY);
    ctx.lineTo(spineX, tipY - 24);
    // Santoku sheep's-foot tip curve down to cutting point at kx
    ctx.quadraticCurveTo(spineX, tipY - 4, spineX - bladeW * 0.14, tipY);
    // Curved cutting belly sweeping up to heel
    ctx.bezierCurveTo(
      kx - bladeW * 0.42, tipY - bladeLen * 0.20,
      edgeLeftX, tipY - bladeLen * 0.58,
      edgeLeftX + bladeW * 0.04, heelY + 8
    );
    ctx.lineTo(spineX - Math.max(7, bladeW * 0.32), heelY);
    ctx.closePath();

    const steelGrad = ctx.createLinearGradient(edgeLeftX, heelY + 10, spineX, tipY - 30);
    steelGrad.addColorStop(0.00, '#74787e'); // realistic studio dark-room reflection near upper heel (like f_001 & f_021!)
    steelGrad.addColorStop(0.32, '#c8cdd4');
    steelGrad.addColorStop(0.62, '#f7f8fa');
    steelGrad.addColorStop(0.86, '#ffffff');
    steelGrad.addColorStop(1.00, '#dfe3e8');
    ctx.fillStyle = steelGrad;
    ctx.fill();

    // Mirror-honed cutting bevel highlight along left curved edge
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(1.8, 2.6 * broadFactor);
    ctx.beginPath();
    ctx.moveTo(edgeLeftX + bladeW * 0.05, heelY + 9);
    ctx.bezierCurveTo(
      edgeLeftX + 1.5, tipY - bladeLen * 0.58,
      kx - bladeW * 0.40, tipY - bladeLen * 0.20,
      spineX - bladeW * 0.14, tipY
    );
    ctx.stroke();

    // Crisp vertical white-hot slice streak on impact (matches f_007 & f_009!)
    if (c > 0.22) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const sx = game.knife.sliceStreakX;
      const sg = ctx.createLinearGradient(sx, 24, sx, 468);
      sg.addColorStop(0, 'rgba(255, 246, 224, 0)');
      sg.addColorStop(0.45, `rgba(255, 248, 232, ${c * 0.78})`);
      sg.addColorStop(0.88, `rgba(255, 168, 120, ${c * 0.92})`);
      sg.addColorStop(1, 'rgba(255, 110, 64, 0)');
      ctx.strokeStyle = sg;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(sx, 24);
      ctx.lineTo(sx, 468);
      ctx.stroke();
      ctx.restore();
    }

    ctx.restore();
  }

  // Video-fidelity additive 360° spark streaks + blade starburst + bouncing white sushi rice grains
  function drawParticles() {
    // 1. Tumbling white sushi rice grains on the board
    for (const rg of game.riceGrains) {
      const a = Math.max(0, Math.min(1, rg.life / 0.22));
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(rg.x, rg.y);
      ctx.rotate(rg.rot);
      // Tiny drop shadow when near board
      ctx.fillStyle = 'rgba(12, 6, 3, 0.35)';
      ctx.beginPath();
      ctx.ellipse(1, 3, 4.6, 2.4, 0, 0, Math.PI * 2);
      ctx.fill();
      // Pearlescent short-grain rice
      ctx.fillStyle = '#fbf6ec';
      ctx.beginPath();
      ctx.ellipse(0, 0, 4.8, 2.6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(-1.2, -0.6, 2.1, 0.9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 2. Additive starburst + 360-degree hot-core coral spark streaks (ZERO muddy cutout halos!)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    for (const sb of game.starbursts) {
      const p = sb.t / sb.dur;
      if (p >= 1) continue;
      const inv = 1 - p;
      const rad = sb.radius * (0.55 + p * 0.65);

      const g = ctx.createRadialGradient(sb.x, sb.y, 2, sb.x, sb.y, rad);
      g.addColorStop(0.0, `rgba(255, 250, 228, ${0.95 * inv})`);
      g.addColorStop(0.35, `rgba(255, 148, 92, ${0.68 * inv})`);
      g.addColorStop(1.0, 'rgba(255, 90, 44, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(sb.x, sb.y, rad, 0, Math.PI * 2);
      ctx.fill();

      // Crisp starburst spikes
      ctx.strokeStyle = `rgba(255, 244, 214, ${0.85 * inv})`;
      ctx.lineWidth = 2.2;
      for (let k = 0; k < 12; k++) {
        const ang = sb.rot + (Math.PI * 2 * k) / 12;
        const rLen = rad * (k % 2 === 0 ? 1.18 : 0.76);
        ctx.beginPath();
        ctx.moveTo(sb.x, sb.y);
        ctx.lineTo(sb.x + Math.cos(ang) * rLen, sb.y + Math.sin(ang) * rLen);
        ctx.stroke();
      }
    }

    for (const s of game.sparks) {
      const ratio = Math.max(0, s.life / s.maxLife);
      const alpha = Math.min(1, ratio * 1.75);
      const speed = Math.hypot(s.vx, s.vy) || 1;
      const dx = (s.vx / speed) * s.len * (0.45 + 0.55 * ratio);
      const dy = (s.vy / speed) * s.len * (0.45 + 0.55 * ratio);

      // Luminous coral-red outer bloom capsule (matches f_009 & f_021!)
      ctx.strokeStyle = `rgba(255, 86, 40, ${0.58 * alpha})`;
      ctx.lineWidth = 7.4;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - dx * 1.15, s.y - dy * 1.15);
      ctx.stroke();

      // Crisp ivory-gold hot core ember
      ctx.strokeStyle = s.hot
        ? `rgba(255, 248, 220, ${0.98 * alpha})`
        : `rgba(255, 178, 118, ${0.95 * alpha})`;
      ctx.lineWidth = 3.0;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - dx * 0.72, s.y - dy * 0.72);
      ctx.stroke();
    }

    ctx.restore();
  }

  // Physical bottom-right Y2K thermal receipt printer paper overlay (exact coordinates y=484..720 covering baked dots)
  function drawReceiptPrinter() {
    const ord = game.currentOrder;
    const nxt = game.nextOrder;
    if (!ord) return;

    const slideY = game.ticketFeedAnim * 44;

    ctx.save();
    // Clip strictly to the paper extrusion region above bottom of frame
    ctx.beginPath();
    ctx.rect(998, 468, 268, 252);
    ctx.clip();

    // 1. Active upper paper slip (y=484..606, x=1014..1214)
    ctx.beginPath();
    ctx.moveTo(1013, 484 + slideY);
    ctx.lineTo(1213, 484 + slideY);
    ctx.lineTo(1215, 606);
    ctx.lineTo(1015, 606);
    ctx.closePath();
    ctx.fillStyle = PAL.paperTop;
    ctx.fill();

    // 2. Queued lower paper slip below slot crease (y=606..722, x=1015..1231)
    ctx.beginPath();
    ctx.moveTo(1015, 606);
    ctx.lineTo(1215, 606);
    ctx.lineTo(1231, 722);
    ctx.lineTo(1028, 722);
    ctx.closePath();
    ctx.fillStyle = PAL.paperBot;
    ctx.fill();

    // Realistic paper curvature & slot lip crease shadow at y=606
    const crease = ctx.createLinearGradient(0, 594, 0, 620);
    crease.addColorStop(0, 'rgba(28, 18, 10, 0)');
    crease.addColorStop(0.5, 'rgba(28, 18, 10, 0.22)');
    crease.addColorStop(1, 'rgba(28, 18, 10, 0)');
    ctx.fillStyle = crease;
    ctx.fillRect(1012, 594, 210, 26);

    // Active Ticket Text (matches f_001.jpg / f_009.jpg / f_021.jpg!)
    ctx.textAlign = 'left';
    const jitter = (ord.glitchDate && Math.sin(game.time * 27) > 0.88) ? 1.5 : 0;
    ctx.fillStyle = PAL.ink;
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillText(`T${ord.table} ${ord.pcs} PCS ${ord.fish}`, 1028 + jitter, 520 + slideY);

    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillStyle = ord.glitchDate ? PAL.glitchRed : '#3a2f26';
    ctx.fillText(ord.dateStr, 1029, 545 + slideY);

    if (ord.dualDate) {
      ctx.fillStyle = '#3a2f26';
      ctx.fillText('12/31/1999', 1030, 567 + slideY);
    } else if (game.orderStampTimer > 0) {
      ctx.fillStyle = '#2d5e38';
      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.fillText('ORDER COMPLETE', 1029, 569 + slideY);
    }

    // Perforated dashed tear line
    ctx.fillStyle = '#5c5045';
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText('-------------------', 1028, 592 + slideY);

    // Queued Ticket Text on lower extruded paper
    if (nxt) {
      ctx.fillStyle = '#2a2019';
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.fillText(`T${nxt.table} ${nxt.pcs} PCS ${nxt.fish}`, 1031, 650 + slideY * 0.55);

      ctx.fillStyle = nxt.glitchDate ? PAL.glitchRed : '#43372d';
      ctx.font = 'bold 15px "Courier New", monospace';
      ctx.fillText(nxt.dateStr, 1033, 676 + slideY * 0.55);
    }

    ctx.restore();

    // Torn completed slips fluttering away
    for (const ts of game.tornSlips) {
      const a = Math.max(0, Math.min(1, ts.life / 0.25));
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(ts.x + 100, ts.y + 55);
      ctx.rotate(ts.rot);
      ctx.fillStyle = PAL.paperTop;
      ctx.shadowColor = 'rgba(0,0,0,0.38)';
      ctx.shadowBlur = 10;
      ctx.fillRect(-100, -55, 198, 108);
      ctx.shadowBlur = 0;
      ctx.fillStyle = PAL.ink;
      ctx.font = 'bold 15px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`T${ts.table} ${ts.pcs} PCS ${ts.fish}`, -84, -18);
      ctx.fillStyle = ts.glitchDate ? PAL.glitchRed : '#3a2f26';
      ctx.fillText(ts.dateStr, -84, 6);
      ctx.fillStyle = '#2d5e38';
      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.fillText('ORDER COMPLETE', -84, 30);
      ctx.restore();
    }
  }

  // Strict 4-anchor diegetic/arcade HUD from sheet.jpg — ZERO top-center or floating text clutter!
  function drawHUD() {
    ctx.save();

    // 1. Top-Left: SCORE & COMBO xN
    ctx.textAlign = 'left';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = PAL.cream;
    ctx.font = 'bold 35px "Courier New", monospace';
    ctx.fillText(`SCORE ${game.score}`, 76, 94);

    if (game.combo >= 2) {
      const bloom = game.comboBloom;
      ctx.fillStyle = bloom > 0.25 ? '#ff875e' : PAL.coral;
      ctx.shadowColor = PAL.coralHot;
      ctx.shadowBlur = 6 + bloom * 20;
      ctx.font = 'bold 27px "Courier New", monospace';
      ctx.fillText(`COMBO x${game.combo}`, 76, 148);
    }

    // 2. Top-Right: LIVES ***
    ctx.textAlign = 'right';
    ctx.shadowColor = game.lifeFlash > 0.1 ? PAL.coralHot : 'rgba(0, 0, 0, 0.65)';
    ctx.shadowBlur = game.lifeFlash > 0.1 ? 16 : 6;
    ctx.fillStyle = game.lifeFlash > 0.2 ? '#ff8b6b' : PAL.cream;
    ctx.font = 'bold 35px "Courier New", monospace';
    const stars = '*'.repeat(Math.max(0, game.lives)) + '·'.repeat(Math.max(0, 3 - game.lives));
    ctx.fillText(`LIVES ${stars}`, 1204, 94);

    // 3. Bottom-Center: Single valid operation prompt (Law 4 & Law 8)
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
    ctx.shadowBlur = 5;
    ctx.font = 'bold 29px "Courier New", monospace';
    ctx.fillStyle = PAL.creamSoft;
    if (game.mode === 'closed' || game.mode === 'mid') {
      ctx.fillStyle = PAL.coral;
      ctx.fillText('[R] = RETRY', 560, 644);
    } else if (game.paused) {
      ctx.fillText('PAUSED · [P] = RESUME', 560, 644);
    } else if (game.mode !== 'title') {
      ctx.fillText('SPACE = CUT', 560, 644);
    }

    ctx.restore();
  }

  // Minimal title screen faithful to refs/m2_title_ref.png (REST state)
  function drawTitleOverlay() {
    ctx.save();
    ctx.fillStyle = 'rgba(20, 13, 9, 0.80)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = PAL.coralHot;
    ctx.font = 'bold 86px "Helvetica Neue", Arial, sans-serif';
    ctx.fillText('SUSHI CUTTING', W * 0.5, 306);

    ctx.fillStyle = PAL.cream;
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.fillText('11:52 PM · 12/31/1999', W * 0.5, 380);

    ctx.fillStyle = '#19110c';
    ctx.fillRect(476, 444, 328, 74);
    ctx.strokeStyle = PAL.cream;
    ctx.lineWidth = 4;
    ctx.strokeRect(476, 444, 328, 74);

    ctx.fillStyle = PAL.cream;
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.fillText('START', W * 0.5, 491);
    ctx.restore();
  }

  // Quiet diegetic thermal-receipt tally card for FAULT ('closed') and COMPLETE ('mid')
  function drawReceiptEndCard(isMidnight) {
    ctx.save();
    ctx.fillStyle = 'rgba(16, 10, 7, 0.72)';
    ctx.fillRect(0, 0, W, H);

    const cw = 430, ch = 290;
    const cx = (W - cw) * 0.5, cy = 198;

    ctx.fillStyle = PAL.paperTop;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
    ctx.shadowBlur = 28;
    ctx.fillRect(cx, cy, cw, ch);
    ctx.shadowBlur = 0;

    const acc = game.totalCuts > 0 ? Math.round((game.evenCuts / game.totalCuts) * 100) : 100;
    const recovered = isMidnight && acc >= 75;

    ctx.textAlign = 'center';
    ctx.fillStyle = isMidnight ? PAL.ink : PAL.glitchRed;
    ctx.font = 'bold 26px "Courier New", monospace';
    ctx.fillText(isMidnight ? '12:00 AM · SHIFT TALLY' : 'CLOSED EARLY', W * 0.5, cy + 52);

    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillStyle = (!isMidnight || !recovered) ? PAL.glitchRed : '#2d5e38';
    ctx.fillText(
      isMidnight
        ? (recovered ? 'DATE OK: 01/01/2000' : 'PRINTER LOCKED: 01/01/1900')
        : 'DATE ERR: 01/01/1900',
      W * 0.5, cy + 82
    );

    ctx.fillStyle = '#5c5045';
    ctx.fillText('------------------------------', W * 0.5, cy + 112);

    ctx.textAlign = 'left';
    ctx.fillStyle = PAL.ink;
    ctx.font = 'bold 18px "Courier New", monospace';
    const lx = cx + 44, rx = cx + cw - 44;
    const row = (label, val, y) => {
      ctx.textAlign = 'left';
      ctx.fillText(label, lx, y);
      ctx.textAlign = 'right';
      ctx.fillText(val, rx, y);
    };
    row('SCORE', String(game.score), cy + 148);
    row('PLATES COMPLETED', String(game.platesServed), cy + 180);
    row('EVEN CUTS', `${acc}%`, cy + 212);
    row('BEST COMBO', `x${Math.max(1, game.maxCombo)}`, cy + 244);

    ctx.restore();
  }

  // =========================================================================
  // UPDATE LOOP
  // =========================================================================

  let lastTs = performance.now();
  function tick(ts) {
    const rawDt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;

    if (!game.paused) {
      game.time += rawDt;
    }

    // Decay UI blooms & knife animation even during brief hit-stop
    if (game.comboBloom > 0) game.comboBloom = Math.max(0, game.comboBloom - rawDt * 2.6);
    if (game.lifeFlash > 0) game.lifeFlash = Math.max(0, game.lifeFlash - rawDt * 2.5);
    if (game.knife.faultFlash > 0) game.knife.faultFlash = Math.max(0, game.knife.faultFlash - rawDt * 3.5);
    if (game.knife.chopAnim > 0) game.knife.chopAnim = Math.max(0, game.knife.chopAnim - rawDt * 6.2);
    if (game.ticketFeedAnim > 0) game.ticketFeedAnim = Math.max(0, game.ticketFeedAnim - rawDt * 3.4);
    if (game.screenShake > 0) game.screenShake = Math.max(0, game.screenShake - rawDt * 30);

    // Optional keyboard micro-aim
    if (game.mode === 'cut' && !game.paused) {
      mouseIdleTimer += rawDt;
      if (heldKeys.left || heldKeys.right) {
        const dir = (heldKeys.right ? 1 : 0) - (heldKeys.left ? 1 : 0);
        game.knife.aimOffset = Math.max(-85, Math.min(85, game.knife.aimOffset + dir * 240 * rawDt));
        mouseIdleTimer = 0;
      } else if (mouseIdleTimer > 1.2) {
        // Gently recenter onto active coral guide line when playing keyboard Space-only
        game.knife.aimOffset *= Math.max(0, 1 - rawDt * 4.5);
      }
    }

    // Smoothly glide knife over target coral guide + micro-aim offset
    const desiredKnifeX = game.knife.baseX + game.knife.aimOffset;
    game.knife.x += (desiredKnifeX - game.knife.x) * Math.min(1, rawDt * 18);

    // Effective world delta respecting 35ms hit-stop and pause
    let dt = game.paused ? 0 : rawDt;
    if (game.hitStop > 0) {
      game.hitStop = Math.max(0, game.hitStop - dt);
      dt = 0;
    }

    if (game.mode === 'ready' && dt > 0) {
      game.readyTimer += dt;
      if (game.roll && game.roll.right < 322) {
        const step = Math.min(322 - game.roll.right, 380 * dt);
        game.roll.right += step;
        game.roll.left += step;
      }
      // Fallback auto-engage after 2.85s if opened passively without a click
      if (game.readyTimer >= 2.85) {
        game.mode = 'cut';
      }
    } else if (game.mode === 'cut' && dt > 0) {
      game.shiftTime += dt;

      if (game.orderStampTimer > 0) {
        game.orderStampTimer = Math.max(0, game.orderStampTimer - dt);
        if (game.orderStampTimer <= 0 && game.pendingAdvance) {
          advancePrinterAndSpawnNext();
        }
      }

      const r = game.roll;
      const ord = game.currentOrder;
      if (r && ord) {
        const dx = ord.speed * dt;
        r.left += dx;
        r.right += dx;
        for (const p of r.pieces) {
          p.cx += dx;
          if (p.pop > 0) p.pop = Math.max(0, p.pop - dt * 4.5);
        }

        // Fault if player lets an uncut roll slide past the stadium track without finishing its cuts
        const nextSeam = getNextSeamX();
        if (nextSeam !== null && nextSeam > TRACK.right - 22) {
          registerFault();
          if (game.mode === 'cut') {
            // Clear missed roll and feed replacement
            for (const p of r.pieces) {
              game.sweepingPieces.push({ ...p, vx: 520 });
            }
            game.roll = null;
            game.orderStampTimer = 0.08;
            game.pendingAdvance = true;
          }
        }
      }

      if (game.shiftTime >= SHIFT_DURATION && !game.pendingAdvance && !game.roll) {
        game.mode = 'mid';
      }
    }

    // Update sweeping completed pieces, torn slips & particles
    const fxDt = game.paused ? 0 : rawDt;
    for (let i = game.sweepingPieces.length - 1; i >= 0; i--) {
      const sp = game.sweepingPieces[i];
      sp.cx += sp.vx * fxDt;
      if (sp.cx > W + 90) game.sweepingPieces.splice(i, 1);
    }
    for (let i = game.tornSlips.length - 1; i >= 0; i--) {
      const ts = game.tornSlips[i];
      ts.x += ts.vx * fxDt;
      ts.y += ts.vy * fxDt;
      ts.vy += 420 * fxDt;
      ts.rot += ts.vrot * fxDt;
      ts.life -= fxDt;
      if (ts.life <= 0) game.tornSlips.splice(i, 1);
    }
    for (let i = game.sparks.length - 1; i >= 0; i--) {
      const s = game.sparks[i];
      s.x += s.vx * fxDt;
      s.y += s.vy * fxDt;
      s.vx *= Math.max(0, 1 - fxDt * 0.82);
      s.vy = s.vy * Math.max(0, 1 - fxDt * 0.82) + 95 * fxDt;
      s.life -= fxDt;
      if (s.life <= 0) game.sparks.splice(i, 1);
    }
    for (let i = game.starbursts.length - 1; i >= 0; i--) {
      game.starbursts[i].t += fxDt;
      if (game.starbursts[i].t >= game.starbursts[i].dur) game.starbursts.splice(i, 1);
    }
    for (let i = game.riceGrains.length - 1; i >= 0; i--) {
      const rg = game.riceGrains[i];
      rg.x += rg.vx * fxDt;
      rg.y += rg.vy * fxDt;
      rg.vy += 690 * fxDt;
      rg.rot += rg.vrot * fxDt;
      if (!rg.bounced && rg.y >= rg.bounceY && rg.vy > 0) {
        rg.y = rg.bounceY;
        rg.vy = -rg.vy * 0.44;
        rg.vx *= 0.72;
        rg.bounced = true;
      }
      rg.life -= fxDt;
      if (rg.life <= 0) game.riceGrains.splice(i, 1);
    }

    // RENDER FRAME
    ctx.save();
    if (game.screenShake > 0.2) {
      ctx.translate((rand() - 0.5) * game.screenShake, (rand() - 0.5) * game.screenShake);
    }

    drawBoardAndGuides();
    drawAllSushi();
    drawChefKnife();
    drawReceiptPrinter();
    drawParticles();
    drawHUD();

    if (game.mode === 'title') {
      drawTitleOverlay();
    } else if (game.mode === 'closed') {
      drawReceiptEndCard(false);
    } else if (game.mode === 'mid') {
      drawReceiptEndCard(true);
    }

    ctx.restore();
    requestAnimationFrame(tick);
  }

  // Deterministic telemetry exposed for play.mjs & verification harness
  window.__game = {
    get state() {
      const ord = game.currentOrder;
      const r = game.roll;
      const seamX = getNextSeamX();
      const guideX = getActiveGuideX();
      return {
        mode: game.mode,
        paused: game.paused,
        score: game.score,
        combo: game.combo,
        lives: game.lives,
        platesServed: game.platesServed,
        shiftTime: +game.shiftTime.toFixed(2),
        knifeX: +game.knife.x.toFixed(1),
        nextLineX: guideX,
        nextSeamX: seamX !== null ? +seamX.toFixed(1) : null,
        distToSeam: seamX !== null ? +(seamX - game.knife.x).toFixed(1) : null,
        rollSpeed: ord ? ord.speed : 0,
        order: ord ? {
          table: ord.table,
          pcs: ord.pcs,
          fish: ord.fish,
          dateStr: ord.dateStr,
          cutsDone: r ? r.cutsDone : ord.guides.length,
          cutsTotal: ord.guides.length
        } : null
      };
    }
  };

  if (AUTOSTART) {
    initShift(true);
  } else {
    game.currentOrder = createOrder(0);
    game.nextOrder = createOrder(1);
    spawnRollForOrder(game.currentOrder, 310);
  }
  requestAnimationFrame(tick);
})();
</script>

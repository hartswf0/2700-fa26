<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Space Farmer — Five Days on the Farm (M2)</title>
<style>
  :root {
    --bg: #121514;
    --slate: #1d1f1c;
    --fg: #d9d4c2;
    --acc: #e0a35a;
    --red: #df4638;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", Courier, ui-monospace, monospace;
    color: var(--fg);
  }
  #stage-wrap {
    position: relative;
    width: min(100vw, 177.7778vh);
    height: min(56.25vw, 100vh);
    background: var(--slate);
    box-shadow: 0 20px 64px rgba(0, 0, 0, 0.82);
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: none;
  }
</style>
</head>
<body>
<div id="stage-wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script>
(() => {
  'use strict';

  // VOIDBASTARD-TAO — Show only what is true now.
  // One-sentence clone mood rule (spec.json):
  // Every clone completes one task calmly before needing a brief rest in the lineup;
  // assigning a winded clone before they recover snaps them permanently hostile.

  const W = 1280;
  const H = 720;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });

  const params = new URLSearchParams(window.location.search);
  const AUTOSTART = params.has('autostart');
  const INITIAL_SEED = Number.isFinite(Number(params.get('seed'))) && params.get('seed') !== null
    ? (Number(params.get('seed')) >>> 0)
    : 7;

  let rngState = (INITIAL_SEED || 7) >>> 0;
  function rand() {
    rngState = (rngState + 0x6D2B79F5) >>> 0;
    let t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function randRange(a, b) { return a + (b - a) * rand(); }

  const PALETTE = {
    bg: '#191d1c',
    dark: '#141716',
    fg: '#d9d4c2',
    muted: '#8d8a7c',
    acc: '#e0a35a',
    gold: '#f5cb78',
    red: '#df4638'
  };

  // --- Audio (Lyria 3 BGM + WebAudio Diegetic SFX) ---
  const bgm = new Audio('../assets/bgm_loop.mp3');
  bgm.loop = true;
  bgm.volume = 0.40;
  let audioCtx = null;
  let humStarted = false;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        try { audioCtx = new AC(); } catch (_) {}
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    if (bgm.paused) {
      bgm.play().catch(() => {});
    }
    if (audioCtx && !humStarted) {
      humStarted = true;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filt = audioCtx.createBiquadFilter();
        osc.type = 'sawtooth';
        osc.frequency.value = 52;
        filt.type = 'lowpass';
        filt.frequency.value = 112;
        gain.gain.value = 0.02;
        osc.connect(filt);
        filt.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
      } catch (_) {}
    }
  }

  function playSfx(kind) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    try {
      if (kind === 'select') {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(390, now);
        o.frequency.exponentialRampToValueAtTime(520, now + 0.06);
        g.gain.setValueAtTime(0.05, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now); o.stop(now + 0.075);
      } else if (kind === 'assign') {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(290, now);
        o.frequency.exponentialRampToValueAtTime(590, now + 0.16);
        g.gain.setValueAtTime(0.085, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.20);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now); o.stop(now + 0.21);
      } else if (kind === 'land') {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(148, now);
        o.frequency.exponentialRampToValueAtTime(64, now + 0.09);
        g.gain.setValueAtTime(0.08, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now); o.stop(now + 0.11);
      } else if (kind === 'pump') {
        [340, 480].forEach((freq, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(freq, now + i * 0.06);
          g.gain.setValueAtTime(0.07, now + i * 0.06);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.14);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(now + i * 0.06); o.stop(now + i * 0.06 + 0.15);
        });
      } else if (kind === 'harvest') {
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(freq, now + i * 0.045);
          g.gain.setValueAtTime(0.065, now + i * 0.045);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.045 + 0.28);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(now + i * 0.045); o.stop(now + i * 0.045 + 0.30);
        });
      } else if (kind === 'grow') {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(196, now);
        o.frequency.exponentialRampToValueAtTime(392, now + 0.34);
        g.gain.setValueAtTime(0.085, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now); o.stop(now + 0.4);
      } else if (kind === 'recall') {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(480, now);
        o.frequency.exponentialRampToValueAtTime(280, now + 0.11);
        g.gain.setValueAtTime(0.06, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now); o.stop(now + 0.13);
      } else if (kind === 'hostile') {
        [215, 196].forEach((freq, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          const f = audioCtx.createBiquadFilter();
          o.type = 'sawtooth';
          f.type = 'lowpass';
          f.frequency.value = 640;
          o.frequency.setValueAtTime(freq, now + i * 0.08);
          o.frequency.linearRampToValueAtTime(freq * 0.76, now + i * 0.08 + 0.28);
          g.gain.setValueAtTime(0.095, now + i * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.31);
          o.connect(f); f.connect(g); g.connect(audioCtx.destination);
          o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.33);
        });
      }
    } catch (_) {}
  }

  // --- Asset Purification & Offscreen Baking ---
  const assets = {
    loaded: false,
    bgBaked: null,
    vignetteBaked: null,
    grainCanvas: null,
    // Clean sprite variants:
    // calmWork, calmStandEmpty, calmStandBasket
    // tiredWork, tiredStandEmpty, tiredStandBasket
    // hostileSnapWork, hostileRestlessStand
    // overseerStand
    sprites: null,
    cropStages: [] // [stage0Seedlings, stage1GoldenShoots, stage2RipeWheat]
  };

  function loadImage(src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }

  // Strip trapped #d1d1d1 studio grey inside closed loops (hose loop, basket handle, elbow gap) + outer grey fringe
  function purifyFarmerSheet(img) {
    const w = img.naturalWidth || img.width;
    const h = img.naturalHeight || img.height;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cctx = c.getContext('2d', { willReadFrequently: true });
    cctx.drawImage(img, 0, 0);
    const im = cctx.getImageData(0, 0, w, h);
    const d = im.data;

    for (let i = 0; i < d.length; i += 4) {
      const a = d[i + 3];
      if (a === 0) continue;
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const maxC = Math.max(r, g, b);
      const minC = Math.min(r, g, b);
      const sat = maxC - minC;
      // Neutral studio grey (#d1d1d1 / #d8d8d8) has near-zero saturation and high brightness,
      // whereas the astronaut suit is warm olive-cream (r - b >= 12) or dark ink outline.
      if (sat <= 9 && r >= 194 && r <= 228) {
        d[i + 3] = 0;
      } else if (a < 180 && sat <= 14 && r >= 175) {
        d[i + 3] = 0;
      }
    }
    cctx.putImageData(im, 0, 0);

    // Build a second copy of Pose 1 (right half) WITHOUT the premature wheat basket!
    // On 1024x1024 sheet, Pose 1 body centerline is x=786; right hip/leg (x=786..956) is completely unoccluded.
    const noBasketSheet = document.createElement('canvas');
    noBasketSheet.width = w; noBasketSheet.height = h;
    const nbCtx = noBasketSheet.getContext('2d', { willReadFrequently: true });
    nbCtx.drawImage(c, 0, 0);
    if (w === 1024 && h === 1024) {
      const srcIm = cctx.getImageData(0, 0, w, h);
      const dstIm = nbCtx.getImageData(0, 0, w, h);
      const sd = srcIm.data;
      const dd = dstIm.data;
      const centerX = 785;
      for (let y = 552; y <= 744; y++) {
        for (let x = 548; x < centerX; x++) {
          const mirrorX = centerX + (centerX - x);
          const di = (y * w + x) * 4;
          if (mirrorX < w) {
            const si = (y * w + mirrorX) * 4;
            dd[di]     = sd[si];
            dd[di + 1] = sd[si + 1];
            dd[di + 2] = sd[si + 2];
            dd[di + 3] = sd[si + 3];
          } else {
            dd[di + 3] = 0;
          }
        }
      }
      nbCtx.putImageData(dstIm, 0, 0);
    }
    return { cleanSheet: c, noBasketSheet };
  }

  function cropBounds(canvasSrc, x0, x1) {
    const w = canvasSrc.width, h = canvasSrc.height;
    const octx = canvasSrc.getContext('2d', { willReadFrequently: true });
    const d = octx.getImageData(0, 0, w, h).data;
    let minX = x1, maxX = x0, minY = h, maxY = 0;
    for (let y = 0; y < h; y++) {
      for (let x = x0; x <= x1; x++) {
        if (d[(y * w + x) * 4 + 3] > 18) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX <= minX || maxY <= minY) {
      minX = x0; maxX = x1; minY = 0; maxY = h - 1;
    }
    const sw = Math.max(1, maxX - minX + 1);
    const sh = Math.max(1, maxY - minY + 1);
    const out = document.createElement('canvas');
    out.width = sw; out.height = sh;
    out.getContext('2d').drawImage(canvasSrc, minX, minY, sw, sh, 0, 0, sw, sh);
    return out;
  }

  function extractAlphaRuns(img, expectedCount, fallbackSplits) {
    const w = img.naturalWidth || img.width;
    const h = img.naturalHeight || img.height;
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const octx = off.getContext('2d', { willReadFrequently: true });
    octx.drawImage(img, 0, 0);
    const data = octx.getImageData(0, 0, w, h).data;

    const colMax = new Uint8Array(w);
    for (let x = 0; x < w; x++) {
      let m = 0;
      for (let y = 0; y < h; y++) {
        const a = data[(y * w + x) * 4 + 3];
        if (a > m) m = a;
      }
      colMax[x] = m;
    }

    const runs = [];
    let inRun = false, start = 0;
    for (let x = 0; x < w; x++) {
      if (colMax[x] > 14 && !inRun) {
        inRun = true; start = x;
      } else if (colMax[x] <= 14 && inRun) {
        inRun = false;
        if (x - start > 24) runs.push([start, x - 1]);
      }
    }
    if (inRun && w - start > 24) runs.push([start, w - 1]);

    const ranges = runs.length === expectedCount
      ? runs
      : fallbackSplits.map(([a, b]) => [Math.floor(a * w), Math.floor(b * w) - 1]);

    return ranges.map(([x0, x1]) => cropBounds(off, x0, x1));
  }

  function makeTintedSprite(srcCanvas, mode) {
    const c = document.createElement('canvas');
    c.width = srcCanvas.width;
    c.height = srcCanvas.height;
    const cctx = c.getContext('2d');
    cctx.drawImage(srcCanvas, 0, 0);
    const imgData = cctx.getImageData(0, 0, c.width, c.height);
    const d = imgData.data;

    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 10) continue;
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const lum = 0.299 * r + 0.587 * g + 0.114 * b;

      if (mode === 'calm') {
        // Harmonize bright suit into warm-shadowed lunar dusk matching f_014..f_033
        d[i]     = Math.min(255, r * 0.78 + 12);
        d[i + 1] = Math.min(255, g * 0.75 + 10);
        d[i + 2] = Math.min(255, b * 0.69 + 9);
      } else if (mode === 'tired') {
        // Subtle warm-ochre fatigue flush while preserving dark outlines
        if (lum < 52) {
          d[i] = r * 0.85; d[i + 1] = g * 0.8; d[i + 2] = b * 0.8;
        } else {
          d[i]     = Math.min(255, r * 0.82 + 30);
          d[i + 1] = Math.min(255, g * 0.68 + 8);
          d[i + 2] = Math.min(255, b * 0.56 + 6);
        }
      } else if (mode === 'hostileSnap') {
        // Matches f_027.jpg: keep crisp dark ink lines & deep maroon suit folds, hot crimson highlights!
        if (lum < 56) {
          d[i]     = Math.min(255, lum * 0.55 + 22);
          d[i + 1] = Math.min(255, lum * 0.24 + 6);
          d[i + 2] = Math.min(255, lum * 0.22 + 6);
        } else {
          d[i]     = Math.min(255, lum * 0.72 + 74);
          d[i + 1] = Math.min(255, lum * 0.26 + 14);
          d[i + 2] = Math.min(255, lum * 0.22 + 12);
        }
      } else if (mode === 'hostilePacing') {
        // Matches f_033.jpg: dark weathered slate-maroon suit as hostile clone paces off the job
        if (lum < 56) {
          d[i] = lum * 0.45 + 12;
          d[i + 1] = lum * 0.36 + 10;
          d[i + 2] = lum * 0.36 + 10;
        } else {
          d[i]     = Math.min(255, lum * 0.48 + 30);
          d[i + 1] = Math.min(255, lum * 0.36 + 16);
          d[i + 2] = Math.min(255, lum * 0.33 + 15);
        }
      } else if (mode === 'overseer') {
        // Dark charcoal-slate station suit with glowing amber chest/belt hardware matching f_004..f_033
        const isWarm = (r - b > 38 && r > 135);
        if (isWarm) {
          d[i]     = Math.min(255, r * 1.05 + 16);
          d[i + 1] = Math.min(255, g * 0.90 + 6);
          d[i + 2] = Math.min(255, b * 0.56);
        } else {
          d[i]     = Math.min(255, lum * 0.28 + 14);
          d[i + 1] = Math.min(255, lum * 0.28 + 15);
          d[i + 2] = Math.min(255, lum * 0.26 + 15);
        }
      }
    }
    cctx.putImageData(imgData, 0, 0);
    return c;
  }

  function refineCropStageSprite(srcCanvas) {
    // Keep strictly living golden shoots/wheat + immediate dark ink strokes; zero planter sub-boxes or grey halos
    const w = srcCanvas.width, h = srcCanvas.height;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cctx = c.getContext('2d');
    cctx.drawImage(srcCanvas, 0, 0);
    const imgData = cctx.getImageData(0, 0, w, h);
    const d = imgData.data;
    const isGold = new Uint8Array(w * h);

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        const r = d[i], g = d[i + 1], b = d[i + 2], a = d[i + 3];
        if (a > 24 && r > 138 && g > 96 && (r - b) > 38) {
          isGold[y * w + x] = 1;
        }
      }
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = y * w + x;
        const i = idx * 4;
        if (d[i + 3] < 10 || isGold[idx]) continue;
        let nearGold = false;
        for (let dy = -2; dy <= 2 && !nearGold; dy++) {
          const ny = y + dy;
          if (ny < 0 || ny >= h) continue;
          for (let dx = -2; dx <= 2; dx++) {
            const nx = x + dx;
            if (nx >= 0 && nx < w && isGold[ny * w + nx]) {
              nearGold = true;
              break;
            }
          }
        }
        if (nearGold) {
          const lum = 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2];
          if (lum > 64) d[i + 3] = 0;
        } else {
          d[i + 3] = 0;
        }
      }
    }
    cctx.putImageData(imgData, 0, 0);
    return cropBounds(c, 0, w - 1);
  }

  function pointInPoly(px, py, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1];
      const xj = poly[j][0], yj = poly[j][1];
      const intersect = ((yi > py) !== (yj > py)) &&
        (px < ((xj - xi) * (py - yi)) / ((yj - yi) || 1e-6) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function bakeBackground(bgImg) {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const bctx = c.getContext('2d', { willReadFrequently: true });
    bctx.fillStyle = PALETTE.bg;
    bctx.fillRect(0, 0, W, H);

    if (bgImg) {
      bctx.drawImage(bgImg, 0, 0, W, H);
      const im = bctx.getImageData(0, 0, W, H);
      const d = im.data;

      // Inner soil polygon inside concrete planter rim (masks out all 7,739 static baked golden sprouts!)
      const soilPoly = [
        [568, 434],
        [1082, 550],
        [810, 650],
        [298, 526]
      ];

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = (y * W + x) * 4;
          const r = d[i], g = d[i + 1], b = d[i + 2];
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;

          // 1. Cleanly resurface baked golden sprouts inside the soil bed into dark lunar soil
          if (y >= 430 && y <= 655 && x >= 295 && x <= 1088 && pointInPoly(x, y, soilPoly)) {
            if ((r - b) > 22 || lum > 44) {
              const grain = (((x * 73856093) ^ (y * 19349663)) >>> 0) % 7 - 3;
              d[i]     = Math.max(18, Math.min(36, 27 + grain));
              d[i + 1] = Math.max(20, Math.min(38, 29 + grain));
              d[i + 2] = Math.max(19, Math.min(35, 26 + grain));
              continue;
            }
          }

          // 2. Atmospheric lunar depth grade:
          // Keep the left water pump (x < 405) & isometric concrete planter bed crisp,
          // while quieting the bright indoor back-wall hatches/crates (x > 410 above planter rim)
          // into deep lunar dusk (#191d1c..#262a29) matching sheet.jpg!
          const rimY = x < 568
            ? 526 - ((x - 252) / Math.max(1, 568 - 252)) * 104
            : 422 + ((x - 568) / Math.max(1, 1124 - 568)) * 130;

          if (y < rimY - 6 && x > 380) {
            const wallBlend = Math.min(1, (x - 380) / 80);
            const portDist = Math.hypot(x - 762, y - 206);
            const portKeep = portDist < 40 ? 0.30 : 0;
            const k = wallBlend * (1 - portKeep);
            const targetR = lum * 0.09 + 21;
            const targetG = lum * 0.10 + 24;
            const targetB = lum * 0.10 + 24;
            d[i]     = r * (1 - k) + targetR * k;
            d[i + 1] = g * (1 - k) + targetG * k;
            d[i + 2] = b * (1 - k) + targetB * k;
          } else {
            // Gentle overall lunar dusk grade matching study.json (#272a29 / #171b1a)
            d[i]     = r * 0.72 + 7;
            d[i + 1] = g * 0.73 + 9;
            d[i + 2] = b * 0.73 + 9;
          }
        }
      }
      bctx.putImageData(im, 0, 0);

      // Crisp isometric soil plot grid furrows inside the bed (matching 6-plot grid in f_004..f_033)
      const B_BACK = { x: 568, y: 436 };
      const B_LEFT = { x: 300, y: 526 };
      const B_RIGHT = { x: 1080, y: 550 };
      const bPt = (u, v) => ({
        x: B_BACK.x + v * (B_LEFT.x - B_BACK.x) + u * (B_RIGHT.x - B_BACK.x),
        y: B_BACK.y + v * (B_LEFT.y - B_BACK.y) + u * (B_RIGHT.y - B_BACK.y)
      });
      bctx.save();
      bctx.strokeStyle = 'rgba(14, 16, 15, 0.65)';
      bctx.lineWidth = 3;
      for (const u of [0.333, 0.667]) {
        const p0 = bPt(u, 0.03), p1 = bPt(u, 0.97);
        bctx.beginPath(); bctx.moveTo(p0.x, p0.y); bctx.lineTo(p1.x, p1.y); bctx.stroke();
      }
      for (const v of [0.50]) {
        const p0 = bPt(0.02, v), p1 = bPt(0.98, v);
        bctx.beginPath(); bctx.moveTo(p0.x, p0.y); bctx.lineTo(p1.x, p1.y); bctx.stroke();
      }
      bctx.restore();
    }

    // Two clean overhead lunar lamp fixtures & soft volumetric cones matching f_014..f_033!
    const lamps = [
      { x: 468, y: 62, postX: 438, postBottomY: 446, rx: 245, ry: 415, a: 0.14 },
      { x: 942, y: 92, postX: 978, postBottomY: 492, rx: 220, ry: 390, a: 0.11 }
    ];
    bctx.save();
    for (const l of lamps) {
      // Slender dark lamp post silhouette
      bctx.strokeStyle = 'rgba(38, 41, 39, 0.85)';
      bctx.lineWidth = 5;
      bctx.beginPath();
      bctx.moveTo(l.postX, l.postBottomY);
      bctx.lineTo(l.postX, l.y + 4);
      bctx.lineTo(l.x, l.y);
      bctx.stroke();

      // Warm lamp head bar
      bctx.strokeStyle = '#f6d89c';
      bctx.lineWidth = 4;
      bctx.beginPath();
      bctx.moveTo(l.x - 18, l.y + 3);
      bctx.lineTo(l.x + 18, l.y - 3);
      bctx.stroke();
    }

    bctx.globalCompositeOperation = 'screen';
    for (const l of lamps) {
      const g = bctx.createRadialGradient(l.x, l.y, 4, l.x - 18, l.y + 185, l.ry);
      g.addColorStop(0, `rgba(244, 198, 126, ${l.a * 1.85})`);
      g.addColorStop(0.42, `rgba(224, 163, 90, ${l.a * 0.62})`);
      g.addColorStop(1, 'rgba(224, 163, 90, 0)');
      bctx.fillStyle = g;
      bctx.beginPath();
      bctx.moveTo(l.x - 22, l.y);
      bctx.lineTo(l.x + 22, l.y);
      bctx.lineTo(l.x + l.rx, l.y + l.ry);
      bctx.lineTo(l.x - l.rx - 30, l.y + l.ry);
      bctx.closePath();
      bctx.fill();
    }
    bctx.restore();

    return c;
  }

  function buildGrainTile() {
    const g = document.createElement('canvas');
    g.width = W + 64; g.height = H + 64;
    const gctx = g.getContext('2d');
    const im = gctx.createImageData(g.width, g.height);
    let s = 1337;
    for (let i = 0; i < im.data.length; i += 4) {
      s = (s * 1664525 + 1013904223) >>> 0;
      const v = (s >>> 24) & 255;
      im.data[i] = v;
      im.data[i + 1] = v;
      im.data[i + 2] = v;
      im.data[i + 3] = v > 205 ? 9 : v < 46 ? 9 : 0;
    }
    gctx.putImageData(im, 0, 0);
    return g;
  }

  function buildVignette() {
    const v = document.createElement('canvas');
    v.width = W; v.height = H;
    const vctx = v.getContext('2d');
    const vig = vctx.createRadialGradient(W / 2, H * 0.48, H * 0.38, W / 2, H * 0.5, W * 0.66);
    vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vig.addColorStop(1, 'rgba(8, 10, 9, 0.56)');
    vctx.fillStyle = vig;
    vctx.fillRect(0, 0, W, H);
    return v;
  }

  // --- Room Coordinates ---

  const PUMP_STATION = { x: 356, y: 452, gaugeX: 292, gaugeY: 355 };

  const LINEUP_SLOTS = [

  // 6 distinct isometric plots:

  // Mid column (2, 3)  -> breathing Stage-0 lunar seedlings

  const PLOT_COORDS = [

  // --- Game State ---
  const game = {
    phase: AUTOSTART ? 'work' : 'title',
    paused: false,
    day: AUTOSTART ? 2 : 1,

    phaseTime: 0,

  function makeClone(index, spawnFromVat = false) {
    const slot = LINEUP_SLOTS[index % LINEUP_SLOTS.length];

      restProgress: 0,

      state: spawnFromVat ? 'walking_home' : 'idle', // 'idle' | 'leaping' | 'working' | 'tantrum' | 'walking_home'

  function setupDay(dayNum, isAutostartInit = false) {
    game.day = dayNum;

    game.shiftDuration = 36;
    game.arcs = [];

    if (isAutostartInit) {
      game.clones = [makeClone(0), makeClone(1), makeClone(2)];
    } else if (dayNum === 1 && game.clones.length === 0) {
      game.clones = [makeClone(0), makeClone(1)];
    } else {
      game.clones.forEach((c, idx) => {
        const slot = LINEUP_SLOTS[idx % LINEUP_SLOTS.length];
        c.homeX = slot.x;
        c.homeY = slot.y;
        c.x = slot.x;
        c.y = slot.y;
        c.state = c.mood === 'hostile' ? 'tantrum' : 'idle';
        if (c.mood === 'hostile') {
          c.x = 420 + (idx % 2) * 52;
          c.y = 446 + (idx % 2) * 14;

        c.fatigue = 0;

        c.carryingWheat = false;

  function resetFullGame(toWork = false) {
    rngState = (INITIAL_SEED || 7) >>> 0;

    game.steamPuffs = [];

  // --- Spatial Task Anchors & Particles ---
  function getTaskAnchor(taskIdx) {
    if (taskIdx === 0) {
      // Water left plots (1 then 0) so left half glows with Stage-1 golden shoots like f_014..f_033
      const p = (!game.plots[1].watered ? game.plots[1] : game.plots[0]);
      return { x: p.x - 24, y: p.y - 6, plotId: p.id };
    }
    if (taskIdx === 1) {
      return { x: PUMP_STATION.x, y: PUMP_STATION.y, plotId: -1 };
    }
    // Harvest front-right golden wheat patch (plot 5, fallback plot 4) matching f_027 & f_033!
    const p = game.plots[5].stage >= game.plots[4].stage ? game.plots[5] : game.plots[4];
    return { x: p.x - 42, y: p.y - 6, plotId: p.id };
  }

  function spawnParticles(x, y, count, color, style = 'spark') {
    for (let i = 0; i < count; i++) {
      const ang = randRange(-Math.PI * 0.92, -Math.PI * 0.08);
      const spd = randRange(28, 104);
      game.particles.push({
        x: x + randRange(-18, 18),
        y: y + randRange(-12, 8),
        vx: Math.cos(ang) * spd + randRange(-14, 14),
        vy: Math.sin(ang) * spd - randRange(8, 28),
        life: 0,
        maxLife: randRange(0.55, 1.20),
        size: style === 'wheat' ? randRange(3.2, 5.2) : randRange(2.0, 3.8),
        color,
        style
      });
    }
  }

  function addAssignmentArc(x0, y0, x1, y1, color = PALETTE.acc) {
    game.arcs.push({ x0, y0, x1, y1, color, life: 0, maxLife: 0.62 });
  }

  function growClone() {
    if (game.phase !== 'work' || game.paused) return false;
    if (game.clones.length >= 5) return false;
    ensureAudio();
    const idx = game.clones.length;
    const c = makeClone(idx, true);
    game.clones.push(c);
    game.selectedClone = idx;
    spawnParticles(CLONE_VAT.x, CLONE_VAT.y - 28, 18, PALETTE.acc, 'spark');
    addAssignmentArc(CLONE_VAT.x, CLONE_VAT.y - 34, c.homeX, c.homeY - 30, PALETTE.acc);
    playSfx('grow');
    return true;
  }

  // VOIDBASTARD-TAO Law 7: Active work exposes Stop/Recall directly on the working clone!
  function recallClone(cloneIdx) {
    const c = game.clones[cloneIdx];
    if (!c || c.mood === 'hostile') return false;
    if (c.state !== 'working') return false;
    const t = game.tasks[c.taskId];
    if (t) t.active = false;
    c.taskId = null;
    c.state = 'walking_home';
    spawnParticles(c.x, c.y - 52, 8, PALETTE.fg, 'spark');
    playSfx('recall');
    return true;
  }

  function assignCloneToTask(cloneIdx, taskIdx) {
    if (game.phase !== 'work' || game.paused) return false;
    const c = game.clones[cloneIdx];
    const task = game.tasks[taskIdx];
    if (!c || !task) return false;
    if (c.mood === 'hostile' || c.state === 'tantrum' || c.state === 'leaping') return false;

    ensureAudio();
    game.selectedClone = cloneIdx;
    game.selectedTask = taskIdx;
    game.highlightTaskIdx = taskIdx;

    if (c.state === 'working') {
      c.fatigue = Math.max(1, c.fatigue);
      const prev = game.tasks[c.taskId];
      if (prev) prev.active = false;
    }

    const dest = getTaskAnchor(taskIdx);
    c.leapStartX = c.x;
    c.leapStartY = c.y;
    c.targetX = dest.x;
    c.targetY = dest.y;
    c.plotId = dest.plotId;
    c.taskId = taskIdx;
    c.state = 'leaping';
    c.leapT = 0;
    c.leapDur = 0.56;
    c.facingLeft = (dest.x < c.x);

    task.active = true;
    task.failed = false;
    task.x = dest.x;
    task.y = dest.y;

    const arcCol = c.fatigue >= 1 ? PALETTE.red : PALETTE.acc;
    addAssignmentArc(c.x, c.y - 58, dest.x, dest.y - 16, arcCol);
    spawnParticles(c.x, c.y - 44, 10, arcCol, 'spark');
    playSfx('assign');
    return true;
  }

  function dispatchBestCalmClone(taskIdx) {
    // Prefer rested idle calm clone; fallback to winded idle calm clone
    let idx = game.clones.findIndex(c => c.mood === 'calm' && c.state === 'idle' && c.fatigue === 0);
    if (idx < 0) idx = game.clones.findIndex(c => c.mood === 'calm' && c.state === 'idle');
    if (idx >= 0) return assignCloneToTask(idx, taskIdx);
    return false;
  }

  function completeCloneWork(c) {
    const task = game.tasks[c.taskId];
    if (!task) {
      c.state = 'walking_home';
      return;
    }

    if (task.id === 'water') {
      // Advance left plots (1 and 0) to lush Stage-1 golden shoots (matching f_014 & f_021!)
      const pTarget = game.plots[c.plotId >= 0 ? c.plotId : 1];
      pTarget.stage = 1;
      pTarget.watered = true;
      pTarget.glow = 1.0;
      spawnParticles(pTarget.x, pTarget.y - 18, 16, PALETTE.gold, 'spark');

      if (task.progress >= 1) {
        game.plots[0].stage = 1;
        game.plots[0].watered = true;
        game.plots[0].glow = 0.9;
      }
      task.progress = Math.min(task.goal, task.progress + 1);
      if (task.progress >= task.goal) task.done = true;
      task.active = false;
      playSfx('select');
    } else if (task.id === 'pump') {
      task.progress = Math.min(task.goal, task.progress + 1);
      if (task.progress >= task.goal) task.done = true;
      task.active = false;
      // Fixing the pump irrigates the front-right wheat plot into lush Stage-2 golden lunar wheat
      // while keeping left plots as Stage-1 shoots and mid plots as Stage-0 seedlings (exact f_027/f_033 layout!)
      game.plots[5].stage = 2;
      game.plots[5].glow = 1.0;
      spawnParticles(game.plots[5].x, game.plots[5].y - 24, 18, PALETTE.gold, 'wheat');
      if (game.day >= 4) {
        game.plots[4].stage = 2;
        game.plots[4].glow = 0.95;
      }
      playSfx('pump');
    } else if (task.id === 'harvest') {
      const p = game.plots[5].stage >= 1 ? game.plots[5] : game.plots[4];
      spawnParticles(p.x, p.y - 26, 26, PALETTE.gold, 'wheat');
      // Keep harvested patch warm golden Stage-1 stubble on partial harvest, or Stage-1 shoots after cut
      p.stage = Math.max(1, p.stage - 1);
      p.glow = 0.95;

      task.progress = Math.min(task.goal, task.progress + 1);
      if (task.progress >= task.goal) task.done = true;
      task.active = false;
      game.harvestScore += 12;
      c.carryingWheat = true; // Law 6 & 9: clone visibly carries wicker wheat basket from now on!
      game.hitStop = 0.032;
      playSfx('harvest');
    }

    c.tasksDoneToday += 1;
    c.fatigue = 1;
    c.restProgress = 0;
    c.taskId = null;
    c.state = 'walking_home';
  }

  function triggerCloneOverwork(c) {
    const task = game.tasks[c.taskId];
    c.mood = 'hostile';
    c.state = 'tantrum';
    c.workTimer = 0;
    c.carryingWheat = false;
    if (task) {
      task.active = false;
      task.done = false;
      task.progress = Math.max(0, task.progress - 1);
      task.failed = true;
      game.highlightTaskIdx = task.index;
    }
    c.taskId = null;
    game.hitStop = 0.045;
    game.shake = 5.5;
    spawnParticles(c.x, c.y - 58, 24, PALETTE.red, 'anger');
    playSfx('hostile');
  }

  function endWorkShift() {
    if (game.phase !== 'work') return;
    const missed = game.tasks.filter(t => !t.done).length;
    if (missed >= 2) {
      const calmClone = game.clones.find(c => c.mood === 'calm');
      if (calmClone) calmClone.mood = 'hostile';
    }
    const calmCount = game.clones.filter(c => c.mood === 'calm').length;
    const hostileCount = game.clones.filter(c => c.mood === 'hostile').length;
    let outcome = 'next';
    if (hostileCount > calmCount) outcome = 'endB';
    else if (game.day >= 5) outcome = 'endA';

    game.nightSummary = { missedTasks: missed, outcome };
    game.phase = 'night';
    game.phaseTime = 0;
  }

  function advanceFromNight() {
    if (game.phase !== 'night') return;
    if (game.nightSummary.outcome === 'endB') {
      game.phase = 'endB';
      game.phaseTime = 0;
    } else if (game.nightSummary.outcome === 'endA') {
      game.phase = 'endA';
      game.phaseTime = 0;
    } else {
      setupDay(game.day + 1, false);
      game.phase = 'day';
      game.phaseTime = 0;
    }
  }

  // --- Hit Testing & Spatial Input ---
  function clientToCanvas(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((clientX - rect.left) / Math.max(1, rect.width)) * W,
      y: ((clientY - rect.top) / Math.max(1, rect.height)) * H
    };
  }

  function hitTestClone(x, y, includeWorking = true) {
    const ordered = game.clones
      .map((c, i) => ({ c, i }))
      .sort((a, b) => b.c.y - a.c.y);
    for (const { c, i } of ordered) {
      if (c.mood === 'hostile') continue;
      if (!includeWorking && c.state === 'working') continue;
      if (Math.abs(x - c.x) < 44 && y <= c.y + 14 && y >= c.y - 140) {
        return i;
      }
    }
    return -1;
  }

  function hitTestTask(x, y) {
    // 1. Compact top-right checklist rows
    const bx = 984, by = 28, bw = 268;
    if (x >= bx && x <= bx + bw && y >= by + 54 && y <= by + 178) {
      const row = Math.floor((y - (by + 54)) / 38);
      if (row >= 0 && row <= 2) return row;
    }
    // 2. Steaming water pump on left
    if (x >= 170 && x <= 415 && y >= 265 && y <= 505) {
      return 1; // fix pump
    }
    // 3. Isometric soil bed
    if (x >= 260 && x <= 1115 && y >= 435 && y <= 670) {
      if (x >= 700 || (game.plots[5]?.stage >= 2 && x >= 620)) {
        return 2; // harvest ripe right-side wheat
      }
      return 0; // water rows
    }
    return -1;
  }

  function updateHoverState(x, y) {
    game.hover.overVat = (game.phase === 'work' && game.clones.length < 5 &&
      Math.hypot(x - CLONE_VAT.glowX, y - CLONE_VAT.glowY) < 44);
    game.hover.cloneIdx = game.phase === 'work' ? hitTestClone(x, y, true) : -1;
    game.hover.taskIdx = (game.phase === 'work' && game.hover.cloneIdx < 0 && !game.hover.overVat)
      ? hitTestTask(x, y)
      : -1;
  }

  canvas.addEventListener('pointerdown', (e) => {
    ensureAudio();
    const p = clientToCanvas(e.clientX, e.clientY);
    game.cursor.x = p.x;
    game.cursor.y = p.y;
    game.cursor.visible = true;
    game.cursor.idleTime = 0;
    game.cursor.down = true;
    game.cursor.idleTime = 0;
    game.keyboardGuideTimer = 0;

    if (game.phase === 'title') {
      setupDay(1, false);
      game.phase = 'day';
      game.phaseTime = 0;
      playSfx('assign');
      return;
    }

    if (game.phase === 'day') {
      game.phase = 'work';
      game.phaseTime = 0;
      playSfx('select');
      return;
    }

    if (game.phase === 'night') {
      advanceFromNight();
      playSfx('select');
      return;
    }

    if (game.phase === 'endA' || game.phase === 'endB') {
      resetFullGame(false);
      playSfx('assign');
      return;
    }

    if (game.phase === 'work' && !game.paused) {
      // 1. Cloning Vat click
      if (Math.hypot(p.x - CLONE_VAT.glowX, p.y - CLONE_VAT.glowY) < 42) {
        growClone();
        return;
      }

      // 2. Clone click / drag (or Recall if currently working!)
      const cIdx = hitTestClone(p.x, p.y, true);
      if (cIdx >= 0) {
        const c = game.clones[cIdx];
        if (c.state === 'working') {
          recallClone(cIdx);
          return;
        }
        game.selectedClone = cIdx;
        game.drag.active = true;
        game.drag.cloneIdx = cIdx;
        game.drag.x = p.x;
        game.drag.y = p.y;
        game.drag.hoverTask = -1;
        playSfx('select');
        return;
      }

      // 3. Direct spatial station click dispatches nearest rested calm clone
      const tIdx = hitTestTask(p.x, p.y);
      if (tIdx >= 0) {
        dispatchBestCalmClone(tIdx);
      }
    }
  });

  window.addEventListener('pointermove', (e) => {
    const p = clientToCanvas(e.clientX, e.clientY);
    game.cursor.x = p.x;
    game.cursor.y = p.y;
    game.cursor.visible = true;
    game.cursor.idleTime = 0;
    updateHoverState(p.x, p.y);
    if (game.drag.active) {
      game.drag.x = p.x;
      game.drag.y = p.y;
      game.drag.hoverTask = hitTestTask(p.x, p.y);
      if (game.drag.hoverTask >= 0) {
        game.selectedTask = game.drag.hoverTask;
      }
    }
  });

  window.addEventListener('pointerup', (e) => {
    const p = clientToCanvas(e.clientX, e.clientY);
    game.cursor.x = p.x;
    game.cursor.y = p.y;
    game.cursor.down = false;
    updateHoverState(p.x, p.y);
    if (game.drag.active) {
      const cIdx = game.drag.cloneIdx;
      const tIdx = hitTestTask(p.x, p.y);
      game.drag.active = false;
      game.drag.cloneIdx = -1;
      game.drag.hoverTask = -1;
      if (tIdx >= 0) {
        assignCloneToTask(cIdx, tIdx);
      }
    }
  });

  window.addEventListener('keydown', (e) => {
    ensureAudio();
    const key = e.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter'].includes(key)) {
      e.preventDefault();
    }

    if (key === 'p' || key === 'P') {
      if (game.phase === 'work') {
        game.paused = !game.paused;
        playSfx('select');
      }
      return;
    }

    if (game.phase === 'title') {
      if (key === 'Enter' || key === ' ') {
        setupDay(1, false);
        game.phase = 'day';
        game.phaseTime = 0;
        playSfx('assign');
      }
      return;
    }

    if (game.phase === 'day') {
      if (key === 'Enter' || key === ' ') {
        game.phase = 'work';
        game.phaseTime = 0;
        playSfx('select');
      }
      return;
    }

    if (game.phase === 'night') {
      if (key === 'Enter' || key === ' ') {
        advanceFromNight();
        playSfx('select');
      }
      return;
    }

    if (game.phase === 'endA' || game.phase === 'endB') {
      if (key === 'Enter' || key === ' ' || key === 'r' || key === 'R') {
        resetFullGame(false);
        playSfx('assign');
      }
      return;
    }

    if (game.phase === 'work' && !game.paused) {
      if (key >= '1' && key <= '5') {
        const idx = Number(key) - 1;
        if (idx < game.clones.length) {
          game.selectedClone = idx;
          game.keyboardGuideTimer = 2.0;
          playSfx('select');
        }
      } else if (key === 'ArrowLeft') {
        game.selectedClone = (game.selectedClone - 1 + game.clones.length) % game.clones.length;
        game.keyboardGuideTimer = 2.0;
        playSfx('select');
      } else if (key === 'ArrowRight') {
        game.selectedClone = (game.selectedClone + 1) % game.clones.length;
        game.keyboardGuideTimer = 2.0;
        playSfx('select');
      } else if (key === 'ArrowUp') {
        game.selectedTask = (game.selectedTask + 2) % 3;
        game.keyboardGuideTimer = 2.0;
        playSfx('select');
      } else if (key === 'ArrowDown') {
        game.selectedTask = (game.selectedTask + 1) % 3;
        game.keyboardGuideTimer = 2.0;
        playSfx('select');
      } else if (key === 'q' || key === 'Q') {
        game.selectedTask = 0;
        game.keyboardGuideTimer = 2.0;
        playSfx('select');
      } else if (key === 'w' || key === 'W') {
        game.selectedTask = 1;
        game.keyboardGuideTimer = 2.0;
        playSfx('select');
      } else if (key === 'e' || key === 'E') {
        game.selectedTask = 2;
        game.keyboardGuideTimer = 2.0;
        playSfx('select');
      } else if (key === ' ' || key === 'Enter') {
        game.keyboardGuideTimer = 0;
        assignCloneToTask(game.selectedClone, game.selectedTask);
      } else if (key === 'x' || key === 'X') {
        recallClone(game.selectedClone);
      } else if (key === 'g' || key === 'G') {
        growClone();
      } else if (key === 'r' || key === 'R') {
        resetFullGame(AUTOSTART);
        playSfx('recall');
      } else if (key === 'n' || key === 'N') {
        endWorkShift();
      }
    }
  });

  // --- Simulation Step ---
  function update(dt) {
    if (game.paused) return;

    if (game.hitStop > 0) {
      game.hitStop = Math.max(0, game.hitStop - dt);
      return;
    }
    if (game.shake > 0) {
      game.shake = Math.max(0, game.shake - dt * 22);
    }
    if (game.keyboardGuideTimer > 0) {
      game.keyboardGuideTimer = Math.max(0, game.keyboardGuideTimer - dt);
    }
    if (!game.drag.active) {
      game.cursor.idleTime += dt;
    } else {
      game.cursor.idleTime = 0;
    }

    game.t += dt;
    game.phaseTime += dt;

    for (const m of game.dustMotes) {
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if (m.x < 140) m.x = 1140;
      if (m.x > 1140) m.x = 140;
      if (m.y < 60) m.y = 580;
      if (m.y > 580) m.y = 60;
    }

    // Pump steam plumes matching f_021..f_033!
    const pumpTask = game.tasks[1];
    const pumpSteaming = game.phase === 'work' && pumpTask && (!pumpTask.done || pumpTask.active || pumpTask.failed);
    if (pumpSteaming && rand() < dt * (pumpTask.failed ? 9.5 : 4.8)) {
      game.steamPuffs.push({
        x: PUMP_STATION.gaugeX - 24 + randRange(-10, 10),
        y: PUMP_STATION.gaugeY - 68,
        vx: randRange(-14, 6),
        vy: randRange(-42, -22),
        r: randRange(9, 18),
        life: 0,
        maxLife: randRange(1.15, 2.0)
      });
    }
    for (let i = game.steamPuffs.length - 1; i >= 0; i--) {
      const s = game.steamPuffs[i];
      s.life += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.r += dt * 12;
      if (s.life >= s.maxLife) game.steamPuffs.splice(i, 1);
    }

    for (let i = game.particles.length - 1; i >= 0; i--) {
      const p = game.particles[i];
      p.life += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 46 * dt;
      if (p.life >= p.maxLife) game.particles.splice(i, 1);
    }

    for (let i = game.arcs.length - 1; i >= 0; i--) {
      game.arcs[i].life += dt;
      if (game.arcs[i].life >= game.arcs[i].maxLife) game.arcs.splice(i, 1);
    }

    // In-room daybreak & night tally durations (no modal walls)
    if (game.phase === 'day' && game.phaseTime > 1.7) {
      game.phase = 'work';
      game.phaseTime = 0;
      return;
    }
    if (game.phase === 'night' && game.phaseTime > 3.2) {
      advanceFromNight();
      return;
    }

    if (game.phase !== 'work') return;

    game.shiftTime += dt;

    for (const p of game.plots) {
      if (p.glow > 0.22) p.glow = Math.max(0.22, p.glow - dt * 0.20);
    }

    for (const c of game.clones) {
      if (c.squash !== 0) {
        c.squash *= Math.pow(0.002, dt);
        if (Math.abs(c.squash) < 0.005) c.squash = 0;
      }

      if (c.state === 'leaping') {
        c.leapT += dt / c.leapDur;
        if (c.leapT >= 1) {
          c.x = c.targetX;
          c.y = c.targetY;
          c.leapT = 1;
          c.state = 'working';
          c.workTimer = 0;
          c.squash = 0.16; // Tactile landing squash
          // Straining winded clone gives 0.80s recallable spark window before snapping hostile
          c.workDur = c.fatigue >= 1 ? 0.80 : 1.90;
          c.facingLeft = (c.taskId === 1);
          spawnParticles(c.x, c.y - 8, 9, c.fatigue >= 1 ? PALETTE.red : PALETTE.acc, 'spark');
          playSfx('land');
        } else {
          const u = c.leapT;
          const arcLift = Math.sin(u * Math.PI) * 88;
          c.x = c.leapStartX + (c.targetX - c.leapStartX) * u;
          c.y = c.leapStartY + (c.targetY - c.leapStartY) * u - arcLift;
        }
      } else if (c.state === 'working') {
        c.workTimer += dt;
        if (rand() < dt * 10) {
          const col = c.fatigue >= 1 ? PALETTE.red : PALETTE.gold;
          const offX = c.facingLeft ? -36 : 36;
          spawnParticles(c.x + offX, c.y - 34, 1, col, 'spark');
        }
        if (c.workTimer >= c.workDur) {
          if (c.fatigue >= 1) {
            triggerCloneOverwork(c);
          } else {
            completeCloneWork(c);
          }
        }
      } else if (c.state === 'tantrum') {
        c.workTimer += dt;
        // First 1.25s: hot crimson snap + red sparks (f_027.jpg); afterward: restless dark pacing (f_033.jpg)!
        if (c.workTimer < 1.35 && rand() < dt * 12) {
          spawnParticles(c.x, c.y - 68, 1, PALETTE.red, 'anger');
        }
        if (c.workTimer >= 1.15) {
          const paceTargetX = 428 + Math.sin(game.t * 1.3 + c.id) * 26;
          const dx = paceTargetX - c.x;
          c.facingLeft = dx < 0;
          c.x += dx * Math.min(1, dt * 1.9);
        }
      } else if (c.state === 'walking_home') {
        const dx = c.homeX - c.x;
        const dy = c.homeY - c.y;
        const dist = Math.hypot(dx, dy);
        c.facingLeft = dx < 0;
        if (dist < 6) {
          c.x = c.homeX;
          c.y = c.homeY;
          c.state = 'idle';
          c.facingLeft = true;
        } else {
          const spd = 182;
          c.x += (dx / dist) * spd * dt;
          c.y += (dy / dist) * spd * dt;
        }
      } else if (c.state === 'idle') {
        if (c.mood === 'calm' && c.fatigue > 0) {
          c.restProgress += dt;
          if (c.restProgress >= c.restNeeded) {
            c.fatigue = 0;
            c.restProgress = 0;
          }
        }
      }
    }

    if (game.shiftTime >= game.shiftDuration) {
      endWorkShift();
    }
  }

  // --- Rendering ---
  function drawBackground() {
    if (assets.bgBaked) {
      ctx.drawImage(assets.bgBaked, 0, 0);
    } else {
      ctx.fillStyle = PALETTE.bg;
      ctx.fillRect(0, 0, W, H);
    }

    // Subtle Cloning Pod Window Pulse (+ diegetic `[G] +CLONE` ONLY when hovered or short-handed)
    const calmHands = game.clones.filter(c => c.mood === 'calm').length;
    const vatRelevant = game.phase === 'work' && game.clones.length < 5 && (game.hover.overVat || calmHands < 2);
    const podPulse = (vatRelevant ? 0.34 : 0.14) + 0.08 * Math.sin(game.t * 3.0);
    ctx.fillStyle = `rgba(238, 176, 92, ${podPulse.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(CLONE_VAT.glowX, CLONE_VAT.glowY, vatRelevant ? 24 : 18, 0, Math.PI * 2);
    ctx.fill();

    if (vatRelevant) {
      ctx.save();
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = PALETTE.acc;
      ctx.fillText('+ CLONE [G]', CLONE_VAT.glowX, CLONE_VAT.glowY - 28);
      ctx.restore();
    }

    // Left Pump Firebox Slit Glow
    const pumpFailed = Boolean(game.tasks[1]?.failed);
    const pumpDone = Boolean(game.tasks[1]?.done);
    const pumpAlpha = pumpDone ? 0.18 : (0.28 + 0.12 * Math.sin(game.t * 5.2));
    ctx.fillStyle = pumpFailed
      ? `rgba(223, 70, 56, ${pumpAlpha.toFixed(3)})`
      : `rgba(238, 180, 92, ${pumpAlpha.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(PUMP_STATION.gaugeX, PUMP_STATION.gaugeY, 16, 0, Math.PI * 2);
    ctx.fill();

    // Spatial Pump Target Ring (ONLY while hovered, dragged over, or actively being repaired)
    const pumpTargeted = (game.drag.active && game.drag.hoverTask === 1) ||
      game.hover.taskIdx === 1 || Boolean(game.tasks[1]?.active);
    if (pumpTargeted) {
      const draggedClone = game.drag.active ? game.clones[game.drag.cloneIdx] : null;
      const warn = draggedClone && draggedClone.fatigue >= 1;
      ctx.save();
      ctx.strokeStyle = warn ? PALETTE.red : PALETTE.acc;
      ctx.lineWidth = 2.4;
      ctx.setLineDash([14, 8]);
      ctx.lineDashOffset = -game.t * 32;
      ctx.beginPath();
      ctx.ellipse(PUMP_STATION.x, PUMP_STATION.y + 4, 54, 20, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Floating lunar dust motes
    ctx.fillStyle = 'rgba(232, 206, 162, 0.24)';
    for (const m of game.dustMotes) {
      ctx.globalAlpha = m.a;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Pump steam plumes (matching dark smoky plumes in f_021..f_033)
    for (const s of game.steamPuffs) {
      const k = s.life / s.maxLife;
      const alpha = (1 - k) * 0.26;
      ctx.fillStyle = `rgba(155, 160, 156, ${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Sabotaged pump red X markers directly on the broken pump (matching f_033.jpg!)
    if (pumpFailed && game.phase === 'work') {
      const xs = [
        { x: PUMP_STATION.gaugeX - 42, y: PUMP_STATION.gaugeY - 64 },
        { x: PUMP_STATION.gaugeX + 32, y: PUMP_STATION.gaugeY - 108 }
      ];
      ctx.save();
      for (const pt of xs) {
        ctx.fillStyle = 'rgba(22, 20, 20, 0.90)';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = PALETTE.red;
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.moveTo(pt.x - 5.5, pt.y - 5.5); ctx.lineTo(pt.x + 5.5, pt.y + 5.5);
        ctx.moveTo(pt.x + 5.5, pt.y - 5.5); ctx.lineTo(pt.x - 5.5, pt.y + 5.5);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawCropPlot(p) {
    // Warm living amber soil glow scaled strictly to real crop stage
    const baseGlow = p.stage === 2 ? 0.38 : p.stage === 1 ? 0.26 : 0.08;
    const intensity = baseGlow + (p.glow - 0.22) * 0.16;
    if (intensity > 0.02) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const rx = p.stage === 2 ? 96 : p.stage === 1 ? 82 : 48;
      const ry = p.stage === 2 ? 44 : p.stage === 1 ? 36 : 22;
      const rg = ctx.createRadialGradient(p.x, p.y - 8, 6, p.x, p.y - 8, rx);
      rg.addColorStop(0, `rgba(240, 184, 92, ${intensity.toFixed(3)})`);
      rg.addColorStop(1, 'rgba(240, 184, 92, 0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y - 4, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Genuine Nano Banana 3-stage crop sprites (0: tiny seedlings, 1: golden shoots, 2: ripe wheat)
    if (assets.cropStages.length === 3) {
      const spr = assets.cropStages[Math.min(2, Math.max(0, p.stage))];
      const scale = p.stage === 2 ? 0.58 : p.stage === 1 ? 0.62 : 0.56;
      const dw = spr.width * scale;
      const dh = spr.height * scale;
      const sway = Math.sin(game.t * 2.4 + p.id * 1.4) * (p.stage === 2 ? 1.8 : 1.0);
      ctx.save();
      if (p.stage >= 1) {
        ctx.shadowColor = 'rgba(228, 168, 82, 0.55)';
        ctx.shadowBlur = p.stage === 2 ? 12 : 8;
      }
      ctx.drawImage(spr, p.x - dw / 2 + sway * 0.4, p.y + 18 - dh, dw, dh);
      ctx.restore();
    }

    // Spatial Target Ring (ONLY while hovered, dragged over, or actively worked — matching f_014!)
    const hoverWater = ((game.drag.active && game.drag.hoverTask === 0) || game.hover.taskIdx === 0) && p.id === 1;
    const hoverHarvest = ((game.drag.active && game.drag.hoverTask === 2) || game.hover.taskIdx === 2) && p.id === 5;
    const activeHere = (game.tasks[0]?.active && p.id === 1) || (game.tasks[2]?.active && p.id === 5);

    if (hoverWater || hoverHarvest || activeHere) {
      const draggedClone = game.drag.active ? game.clones[game.drag.cloneIdx] : null;
      const warn = draggedClone && draggedClone.fatigue >= 1;
      ctx.save();
      ctx.strokeStyle = warn ? PALETTE.red : PALETTE.acc;
      ctx.lineWidth = 2.6;
      ctx.shadowColor = warn ? PALETTE.red : PALETTE.acc;
      ctx.shadowBlur = 12;
      ctx.setLineDash([26, 10]);
      ctx.lineDashOffset = -game.t * 34;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y + 4, 80, 32, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawOverseer() {
    const spr = assets.sprites?.overseerStand;
    if (!spr) return;
    const x = OVERSEER_POS.x;
    const y = OVERSEER_POS.y;
    const h = 156;
    const w = spr.width * (h / spr.height);
    const bob = Math.sin(game.t * 1.7) * 1.2;

    ctx.fillStyle = 'rgba(8, 10, 9, 0.54)';
    ctx.beginPath();
    ctx.ellipse(x, y + 5, 28, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, y + bob);
    ctx.scale(-1, 1);
    ctx.drawImage(spr, -w / 2, -h, w, h);

    // Signature twin glowing amber visor eyes from f_004..f_033!
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = '#f8ca74';
    ctx.shadowColor = '#e0a35a';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(3, -h + 26, 3.2, 0, Math.PI * 2);
    ctx.arc(14, -h + 27, 3.0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawClone(c, idx) {
    if (!assets.sprites) return;

    const isSnapMoment = (c.mood === 'hostile' && c.workTimer < 1.35);
    const useWorkPose = (c.state === 'working' || isSnapMoment);

    let spr;
    if (c.mood === 'hostile') {
      spr = isSnapMoment ? assets.sprites.hostileSnapWork : assets.sprites.hostileRestlessStand;
    } else if (c.fatigue >= 1) {
      spr = useWorkPose
        ? assets.sprites.tiredWork
        : (c.carryingWheat ? assets.sprites.tiredStandBasket : assets.sprites.tiredStandEmpty);
    } else {
      spr = useWorkPose
        ? assets.sprites.calmWork
        : (c.carryingWheat ? assets.sprites.calmStandBasket : assets.sprites.calmStandEmpty);
    }

    const targetH = useWorkPose ? 140 : 150;
    const scale = targetH / spr.height;
    const dw = spr.width * scale;
    const dh = targetH;

    const floorY = c.state === 'leaping'
      ? c.leapStartY + (c.targetY - c.leapStartY) * c.leapT
      : c.y;
    ctx.fillStyle = 'rgba(8, 10, 9, 0.52)';
    ctx.beginPath();
    ctx.ellipse(c.x, floorY + 5, 26, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // Diegetic Radial Work Progress Ring right beneath working clone (Law 5 & 7)
    if (c.state === 'working') {
      const prog = Math.min(1, c.workTimer / Math.max(0.01, c.workDur));
      const straining = c.fatigue >= 1;
      ctx.save();
      ctx.strokeStyle = straining ? PALETTE.red : PALETTE.acc;
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y + 5, 34, 13, 0, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * prog);
      ctx.stroke();
      if (game.hover.cloneIdx === idx) {
        ctx.font = 'bold 13px "Courier New", monospace';
        ctx.fillStyle = PALETTE.fg;
        ctx.textAlign = 'center';
        ctx.fillText('STOP [CLICK]', c.x, c.y - dh - 14);
      }
      ctx.restore();
    }

    // Selection Halo Circle (f_014.jpg) — ONLY shown when hovered, actively dragged, or active keyboard focus!
    const isDragged = (game.drag.active && game.drag.cloneIdx === idx);
    const isHovered = (!game.drag.active && game.hover.cloneIdx === idx && c.state !== 'working');
    const isKeyFocused = (game.keyboardGuideTimer > 0 && idx === game.selectedClone && c.mood === 'calm');

    if (isDragged || isHovered || isKeyFocused) {
      const warn = c.fatigue >= 1;
      const col = warn ? '223, 70, 56' : '224, 163, 90';
      const radius = isDragged ? 66 : 54;
      ctx.save();
      ctx.fillStyle = `rgba(${col}, ${isDragged ? 0.20 : 0.12})`;
      ctx.strokeStyle = `rgba(${col}, 0.88)`;
      ctx.lineWidth = isDragged ? 2.4 : 1.8;
      ctx.beginPath();
      ctx.arc(c.x, c.y - dh * 0.52, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      if (warn && (isDragged || isHovered)) {
        ctx.font = 'bold 13px "Courier New", monospace';
        ctx.fillStyle = PALETTE.red;
        ctx.textAlign = 'center';
        ctx.fillText('WINDED', c.x, c.y - dh - 20);
      }
      ctx.restore();
    }

    // Hostile crimson rim aura (intense during f_027 snap, subtle ember during f_033 restless pacing)
    if (c.mood === 'hostile') {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const auraBase = isSnapMoment ? 0.34 : 0.14;
      const pulse = auraBase + 0.07 * Math.sin(game.t * 7.5 + idx);
      const rg = ctx.createRadialGradient(c.x, c.y - dh * 0.55, 8, c.x, c.y - dh * 0.55, 68);
      rg.addColorStop(0, `rgba(228, 62, 48, ${pulse.toFixed(3)})`);
      rg.addColorStop(1, 'rgba(228, 62, 48, 0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(c.x, c.y - dh * 0.55, 68, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    const bob = c.state === 'working'
      ? Math.sin(game.t * 9.5 + idx) * 2.8
      : c.state === 'tantrum'
        ? (isSnapMoment ? Math.sin(game.t * 20) * 3.0 : Math.abs(Math.sin(game.t * 4.2)) * -2.2)
        : c.state === 'walking_home'
          ? Math.abs(Math.sin(game.t * 11 + idx)) * -4.5
          : Math.sin(game.t * 2.1 + idx * 1.4) * 1.3;

    const sx = 1 + c.squash;
    const sy = 1 - c.squash * 0.85;

    ctx.save();
    ctx.translate(c.x, c.y + bob);
    const flipX = useWorkPose ? c.facingLeft : !c.facingLeft;
    ctx.scale((flipX ? -1 : 1) * sx, sy);

    if (c.state === 'leaping' || isSnapMoment) {
      ctx.shadowColor = isSnapMoment ? PALETTE.red : PALETTE.acc;
      ctx.shadowBlur = 16;
    }
    ctx.drawImage(spr, -dw / 2, -dh, dw, dh);
    ctx.restore();

    // Watering / wrench golden stream while working calmly
    if (c.state === 'working' && c.fatigue === 0) {
      const nozzleX = c.x + (c.facingLeft ? -42 : 42);
      const nozzleY = c.y - 44;
      ctx.save();
      ctx.strokeStyle = 'rgba(242, 194, 108, 0.68)';
      ctx.lineWidth = 2.2;
      ctx.setLineDash([5, 6]);
      ctx.lineDashOffset = -game.t * 48;
      ctx.beginPath();
      ctx.moveTo(nozzleX, nozzleY);
      ctx.lineTo(nozzleX + (c.facingLeft ? -24 : 24), nozzleY + 26);
      ctx.stroke();
      ctx.restore();
    }

    // Winded recovery ring above resting clone
    if (c.mood === 'calm' && c.fatigue >= 1 && c.state !== 'working' && c.state !== 'leaping') {
      const ratio = 1 - Math.min(1, c.restProgress / c.restNeeded);
      ctx.save();
      ctx.strokeStyle = 'rgba(224, 163, 90, 0.82)';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(c.x, c.y - dh - 12, 7.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio);
      ctx.stroke();
      ctx.restore();
    }

    // Hostile [!] dark speech badge (f_027 & f_033!)
    if (c.mood === 'hostile' && game.phase === 'work') {
      const bx = c.x - 18;
      const by = c.y - dh - 42 + Math.sin(game.t * 6.0) * 2.0;
      ctx.save();
      ctx.fillStyle = 'rgba(22, 20, 20, 0.92)';
      ctx.strokeStyle = 'rgba(223, 70, 56, 0.68)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.roundRect(bx, by, 36, 32, 4);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = PALETTE.red;
      ctx.font = 'bold 23px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('!', bx + 18, by + 24);
      ctx.restore();
    }

    // In-room Spatial Night Tally Badge directly above each clone (replaces modal Night Check wall!)
    if (game.phase === 'night') {
      const revealAt = 0.25 + idx * 0.35;
      if (game.phaseTime >= revealAt) {
        const isCalm = c.mood === 'calm';
        const cy = c.y - dh - 26;
        ctx.save();
        ctx.fillStyle = isCalm ? PALETTE.acc : PALETTE.red;
        ctx.shadowColor = isCalm ? PALETTE.acc : PALETTE.red;
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(c.x, cy, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#161816';
        ctx.font = 'bold 17px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(isCalm ? '✓' : '!', c.x, cy + 6);
        ctx.restore();
      }
    }
  }

  function drawParabolicArc(x0, y0, x1, y1, alpha, color, dashed = false) {
    const mx = (x0 + x1) * 0.5;
    const dist = Math.hypot(x1 - x0, y1 - y0);
    const my = Math.min(y0, y1) - Math.max(72, dist * 0.34);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 3.2;
    ctx.shadowColor = color;
    ctx.shadowBlur = 14;
    if (dashed) {
      ctx.setLineDash([10, 8]);
      ctx.lineDashOffset = -game.t * 42;
    }
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(mx, my, x1, y1);
    ctx.stroke();

    ctx.fillStyle = color === PALETTE.red ? 'rgba(223, 70, 56, 0.24)' : 'rgba(224, 163, 90, 0.24)';
    ctx.beginPath();
    ctx.ellipse(x1, y1 + 8, 24, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawArcsAndParticles() {
    for (const a of game.arcs) {
      const k = a.life / a.maxLife;
      const alpha = Math.sin(Math.min(1, k) * Math.PI) * 0.94;
      drawParabolicArc(a.x0, a.y0, a.x1, a.y1, alpha, a.color, false);
    }

    if (game.drag.active && game.clones[game.drag.cloneIdx]) {
      const c = game.clones[game.drag.cloneIdx];
      const warn = c.fatigue >= 1;
      drawParabolicArc(c.x, c.y - 62, game.drag.x, game.drag.y, 0.94, warn ? PALETTE.red : PALETTE.acc, false);
    } else if (game.phase === 'work' && game.keyboardGuideTimer > 0 && game.clones[game.selectedClone]) {
      const c = game.clones[game.selectedClone];
      const dest = getTaskAnchor(game.selectedTask);
      if (c.mood === 'calm' && c.state === 'idle') {
        const warn = c.fatigue >= 1;
        drawParabolicArc(c.x, c.y - 62, dest.x, dest.y - 12, 0.55, warn ? PALETTE.red : PALETTE.acc, true);
      }
    }

    for (const p of game.particles) {
      const k = p.life / p.maxLife;
      const alpha = Math.max(0, 1 - k);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      if (p.style === 'anger') {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x - 3, p.y - 3); ctx.lineTo(p.x + 3, p.y + 3);
        ctx.moveTo(p.x + 3, p.y - 3); ctx.lineTo(p.x - 3, p.y + 3);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 - k * 0.35), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawTaskSlate() {
    if (game.phase !== 'work') return;

    // Compact Top-Right Task Slate matching sheet.jpg (zero bottom swatch bar, zero sticky row fills!)
    const bx = 984, by = 28, bw = 268, bh = 238;
    ctx.save();
    ctx.fillStyle = 'rgba(24, 27, 25, 0.86)';
    ctx.strokeStyle = 'rgba(217, 212, 194, 0.88)';
    ctx.lineWidth = 2.0;
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = PALETTE.fg;
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`DAY ${game.day} TASKS`, bx + 18, by + 36);

    game.tasks.forEach((t, idx) => {
      const ry = by + 72 + idx * 38;
      const workingOnRow = game.clones.some(c => c.state === 'working' && c.taskId === idx);
      const isFocusedRow = workingOnRow ||
        (game.drag.active && game.drag.hoverTask === idx) ||
        (game.hover.taskIdx === idx);

      if (isFocusedRow && !t.failed) {
        ctx.fillStyle = 'rgba(186, 132, 68, 0.42)';
        ctx.fillRect(bx + 12, ry - 21, bw - 24, 29);
      }

      ctx.font = '18px "Courier New", monospace';
      ctx.fillStyle = t.failed ? '#e58e85' : PALETTE.fg;
      ctx.fillText(`[ ] ${t.label}`, bx + 16, ry);

      if (t.done || workingOnRow) {
        ctx.strokeStyle = PALETTE.acc;
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(bx + 24, ry - 8);
        ctx.lineTo(bx + 31, ry - 1);
        ctx.lineTo(bx + 44, ry - 18);
        ctx.stroke();
      } else if (t.failed) {
        ctx.strokeStyle = PALETTE.red;
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.moveTo(bx + 23, ry - 17); ctx.lineTo(bx + 40, ry + 1);
        ctx.moveTo(bx + 40, ry - 17); ctx.lineTo(bx + 23, ry + 1);
        ctx.moveTo(bx + 16, ry + 1);  ctx.lineTo(bx + bw - 22, ry - 15);
        ctx.stroke();
      }
    });

    const calmCount = game.clones.filter(c => c.mood === 'calm').length;
    const totalClones = game.clones.length;
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillStyle = calmCount * 2 >= totalClones ? PALETTE.acc : PALETTE.red;
    ctx.fillText(`CLONES ${totalClones} · MOOD ${calmCount}/${totalClones}`, bx + 16, by + bh - 20);

    // Whisper-thin 2px dusk hairline along bottom border of the slate reporting real shift time
    const rem = Math.max(0, 1 - game.shiftTime / game.shiftDuration);
    ctx.fillStyle = PALETTE.acc;
    ctx.fillRect(bx + 1, by + bh - 3, (bw - 2) * rem, 2);

    if (game.paused) {
      ctx.fillStyle = PALETTE.fg;
      ctx.font = 'bold 15px "Courier New", monospace';
      ctx.textAlign = 'right';
      ctx.fillText('PAUSED [P]', bx - 18, by + 24);
    }
    ctx.restore();
  }

  function drawTitleState() {
    ctx.save();
    ctx.fillStyle = 'rgba(18, 21, 19, 0.72)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = PALETTE.acc;
    ctx.font = 'bold 64px "Helvetica Neue", Arial, sans-serif';
    ctx.fillText('FIVE DAYS ON THE FARM', W / 2, 304);

    ctx.fillStyle = PALETTE.fg;
    ctx.font = '29px "Courier New", monospace';
    ctx.fillText('grow food. grow help.', W / 2, 370);

    const bw = 280, bh = 66;
    const bx = W / 2 - bw / 2, by = 436;
    ctx.fillStyle = 'rgba(22, 25, 23, 0.92)';
    ctx.strokeStyle = PALETTE.fg;
    ctx.lineWidth = 3;
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = PALETTE.fg;
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.fillText('START', W / 2, by + 42);
    ctx.restore();
  }

  function drawInRoomDayBanner() {
    // Minimal in-room dawn stamp in open upper sky — never blocks the room!
    const alpha = Math.min(1, Math.sin(Math.min(1, game.phaseTime / 1.7) * Math.PI) * 1.35);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.fillStyle = PALETTE.acc;
    ctx.font = 'bold 34px "Courier New", monospace';
    ctx.fillText(`DAY ${game.day} OF 5`, W / 2, 118);
    ctx.fillStyle = PALETTE.fg;
    ctx.font = '18px "Courier New", monospace';
    ctx.fillText('drag rested clones onto work', W / 2, 150);
    ctx.restore();
  }

  function drawInRoomNightTally() {
    // Cool lunar night tint over room while clones remain visible and counted in place
    const calmCount = game.clones.filter(c => c.mood === 'calm').length;
    const hostileCount = game.clones.filter(c => c.mood === 'hostile').length;
    ctx.save();
    ctx.fillStyle = 'rgba(10, 14, 18, 0.44)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = PALETTE.fg;
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.fillText(`NIGHT ${game.day} · CALM ${calmCount}   HOSTILE ${hostileCount}`, W / 2, 98);

    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.fillStyle = hostileCount > calmCount ? PALETTE.red : PALETTE.acc;
    const verdict = hostileCount > calmCount
      ? 'HOSTILE HANDS OUTNUMBER YOU — THE STATION TURNS'
      : game.day >= 5
        ? 'CALM HANDS HOLD — HARVEST READY FOR ORBIT'
        : 'CALM HANDS HOLD THE ROOM';
    ctx.fillText(verdict, W / 2, 132);
    ctx.restore();
  }

  function drawEndingState() {
    const isWin = game.phase === 'endA';
    ctx.save();
    ctx.fillStyle = isWin ? 'rgba(22, 19, 12, 0.72)' : 'rgba(26, 11, 11, 0.76)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = isWin ? PALETTE.acc : PALETTE.red;
    ctx.font = 'bold 50px "Helvetica Neue", Arial, sans-serif';
    ctx.fillText(isWin ? 'THE HARVEST SHIPS' : 'THE STATION IS THEIRS', W / 2, 196);

    ctx.fillStyle = PALETTE.fg;
    ctx.font = '20px "Courier New", monospace';
    ctx.fillText(
      isWin
        ? `Day 5 complete · ${Math.max(12, game.harvestScore)} lunar grain crates lifted to orbit`
        : 'Angry copies outnumbered calm hands at night check.',
      W / 2,
      242
    );

    ctx.fillStyle = PALETTE.muted;
    ctx.font = '17px "Courier New", monospace';
    ctx.fillText('[R / CLICK TO RESTART]', W / 2, 282);
    ctx.restore();
  }

  function drawDiegeticCursor() {
    if (!game.cursor.visible || game.cursor.idleTime > 0.26) return;
    const fade = game.cursor.idleTime > 0.14 ? (0.26 - game.cursor.idleTime) / 0.12 : 1;
    const cx = game.cursor.x, cy = game.cursor.y;
    const draggedClone = game.drag.active ? game.clones[game.drag.cloneIdx] : null;
    const warn = draggedClone && draggedClone.fatigue >= 1;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, fade));
    ctx.translate(cx, cy);
    ctx.fillStyle = warn ? PALETTE.red : PALETTE.acc;
    ctx.strokeStyle = '#151715';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 20);
    ctx.lineTo(6, 15);
    ctx.lineTo(11, 24);
    ctx.lineTo(15, 22);
    ctx.lineTo(9, 13);
    ctx.lineTo(16, 13);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawPostProcess() {
    if (assets.grainCanvas) {
      const ox = -Math.floor(randRange(0, 60));
      const oy = -Math.floor(randRange(0, 60));
      ctx.drawImage(assets.grainCanvas, ox, oy);
    }
    if (assets.vignetteBaked) {
      ctx.drawImage(assets.vignetteBaked, 0, 0);
    }
  }

  function render() {
    ctx.save();
    if (game.shake > 0.1) {
      ctx.translate(
        Math.sin(game.t * 58) * game.shake * 0.55,
        Math.cos(game.t * 47) * game.shake * 0.45
      );
    }

    drawBackground();

    // Depth-sort isometric crop plots, Overseer, and Clones cleanly by foot Y
    const drawables = [];
    for (const p of game.plots) {
      drawables.push({ y: p.y - 6, fn: () => drawCropPlot(p) });
    }
    drawables.push({ y: OVERSEER_POS.y, fn: drawOverseer });
    game.clones.forEach((c, idx) => {
      const sortY = c.state === 'leaping'
        ? Math.max(c.leapStartY, c.targetY) + 12
        : c.y;
      drawables.push({ y: sortY, fn: () => drawClone(c, idx) });
    });
    drawables.sort((a, b) => a.y - b.y);
    for (const d of drawables) d.fn();

    drawArcsAndParticles();
    drawTaskSlate();

    if (game.phase === 'title') drawTitleState();
    else if (game.phase === 'day') drawInRoomDayBanner();
    else if (game.phase === 'night') drawInRoomNightTally();
    else if (game.phase === 'endA' || game.phase === 'endB') drawEndingState();

    drawDiegeticCursor();
    ctx.restore();

    drawPostProcess();
  }

  // --- Read-Only Inspection State (`window.__game.state`) ---
  window.__game = {
    get state() {
      const calmCount = game.clones.filter(c => c.mood === 'calm').length;
      const hostileCount = game.clones.filter(c => c.mood === 'hostile').length;
      return {
        phase: game.phase,
        paused: game.paused,
        day: game.day,
        clones: game.clones.map((c, idx) => ({
          id: idx,
          mood: c.mood,
          fatigue: c.fatigue,
          state: c.state,
          x: Math.round(c.x),
          y: Math.round(c.y),
          nx: +(c.x / W).toFixed(4),
          ny: +((c.y - 68) / H).toFixed(4),
          carryingWheat: c.carryingWheat
        })),
        tasks: game.tasks.map(t => {
          const dest = getTaskAnchor(t.index);
          return {
            id: t.id,
            label: t.label,
            done: t.done,
            active: t.active,
            failed: t.failed,
            progress: t.progress,
            goal: t.goal,
            nx: +(dest.x / W).toFixed(4),
            ny: +(dest.y / H).toFixed(4)
          };
        }),
        vat: {
          nx: +(CLONE_VAT.glowX / W).toFixed(4),
          ny: +(CLONE_VAT.glowY / H).toFixed(4)
        },
        calmCount,
        hostileCount,
        harvestScore: game.harvestScore,
        selectedClone: game.selectedClone,
        selectedTask: game.selectedTask,
        t: +game.t.toFixed(3)
      };
    }
  };

  let lastTs = performance.now();
  function frame(ts) {
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LAB 3 — Cloud or Clock</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
button,textarea{font:inherit;color:inherit}
.app{width:100vw;height:100dvh;overflow:hidden;display:grid;grid-template-rows:90px minmax(0,1fr) 60px}
header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;padding:14px 20px;border-bottom:3px solid #111;background:#fff}
h1{margin:0;font-size:clamp(38px,5vw,74px);line-height:.86;letter-spacing:-.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font:700 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#333}
main{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(560px,.92fr)}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#f4f4f4;border-right:3px solid #111;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.act{position:absolute;z-index:5;left:18px;top:18px;background:#111;color:#fff;padding:8px 12px;font:700 16px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;pointer-events:none}
.quote{position:absolute;z-index:5;right:18px;top:18px;max-width:46%;background:#fff08a;border:3px solid #111;padding:10px 12px;font:700 18px/1.12 ui-monospace,SFMono-Regular,Menlo,monospace;pointer-events:none}
.card{position:absolute;z-index:5;left:18px;bottom:18px;max-width:min(860px,calc(100% - 36px));background:#fff;border:3px solid #111;padding:16px 18px;pointer-events:none}
.card b{display:block;font-size:clamp(30px,3.6vw,64px);line-height:.9;letter-spacing:-.055em}
.card span{display:block;margin-top:12px;font:700 22px/1.12 ui-monospace,SFMono-Regular,Menlo,monospace;color:#111}
.side{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;background:#fff}
.explain{padding:16px 18px;border-bottom:3px solid #111}
.label{font:700 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;margin-bottom:9px}
.focus{background:#fff08a;border-left:12px solid #ffd400;padding:14px 18px;margin-bottom:12px;white-space:pre-wrap;font:700 30px/1.08 ui-monospace,SFMono-Regular,Menlo,monospace}
.why{font:700 21px/1.14 ui-monospace,SFMono-Regular,Menlo,monospace;color:#111}
.editorWrap{position:relative;min-height:0;overflow:hidden}
textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;overflow:hidden;border:0;outline:0;background:#fff;color:#111;padding:18px 18px 56px;font:22px/1.14 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}
.error{position:absolute;left:12px;right:12px;bottom:12px;z-index:7;display:none;background:#fff0ee;border:3px solid #b73424;padding:12px 14px;font:16px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace}
footer{display:grid;grid-template-columns:1fr repeat(3,auto) 1fr;gap:10px;align-items:center;padding:8px 12px;border-top:3px solid #111;background:#fff}
button{min-width:104px;min-height:42px;border:3px solid #111;background:#fff;border-radius:7px;cursor:pointer;font:700 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
button:active{background:#eee}
#prev{justify-self:start}#next{justify-self:end}
@media(max-width:900px) and (orientation:portrait){
  .app{grid-template-rows:58px minmax(0,1fr) 50px}
  header{padding:8px 9px;border-bottom:1px solid #111}h1{font-size:24px}.count{font-size:11px}
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,42fr) minmax(0,58fr)}
  .stage{border-right:0;border-bottom:1px solid #111}
  .act{left:8px;top:8px;padding:5px 6px;font-size:7px}.quote{right:8px;top:8px;max-width:50%;border-width:1px;padding:5px 6px;font-size:7px}
  .card{left:8px;bottom:8px;max-width:calc(100% - 16px);border-width:1px;padding:7px 8px}.card b{font-size:18px}.card span{font-size:9px;margin-top:5px}
  .explain{padding:6px 7px;border-bottom:1px solid #111}.label{font-size:6px;margin-bottom:3px}
  .focus{border-left-width:4px;padding:5px 6px;margin-bottom:4px;font-size:11px;line-height:1.08}.why{font-size:8px}
  textarea{padding:6px 6px 30px;font-size:6.7px;line-height:1.03}
  footer{padding:6px 7px;border-top:1px solid #111;gap:5px}button{min-width:45px;min-height:32px;border-width:1px;font-size:6px}
}
@media(max-height:620px) and (orientation:landscape){
  .app{grid-template-rows:50px minmax(0,1fr) 40px}
  header{padding:6px 8px;border-bottom:1px solid #111}h1{font-size:24px}.count{font-size:11px}
  main{grid-template-columns:minmax(0,1fr) minmax(430px,.95fr)}
  .stage{border-right:1px solid #111}.act{left:8px;top:8px;padding:5px 6px;font-size:7px}.quote{right:8px;top:8px;max-width:44%;border-width:1px;padding:5px 6px;font-size:7px}
  .card{left:8px;bottom:8px;max-width:66%;border-width:1px;padding:6px 7px}.card b{font-size:16px}.card span{font-size:7.5px;margin-top:4px}
  .explain{padding:6px 7px;border-bottom:1px solid #111}.label{font-size:6px;margin-bottom:3px}
  .focus{border-left-width:4px;padding:5px 6px;margin-bottom:4px;font-size:11px;line-height:1.06}.why{font-size:7.5px}
  textarea{padding:5px 5px 24px;font-size:7px;line-height:1}
  footer{padding:5px 6px;border-top:1px solid #111;gap:5px}button{min-width:44px;min-height:28px;border-width:1px;font-size:5.5px}
}
</style>

<body>
<div class="app">
<header><h1>LAB 3: CLOUD OR CLOCK</h1><div id="count" class="count"></div></header>
<main>
<section id="stage" class="stage">
<canvas id="canvas"></canvas>
<div id="act" class="act"></div>
<div id="quote" class="quote"></div>
<div class="card"><b id="title"></b><span id="task"></span></div>
</section>
<section class="side">
<div class="explain"><div class="label">ONE NEW LINE</div><div id="focus" class="focus"></div><div id="why" class="why"></div></div>
<div class="editorWrap"><textarea id="editor" spellcheck="false"></textarea><div id="error" class="error"></div></div>
</section>
</main>
<footer>

<button id="reset">RESET</button>

<button id="next">NEXT →</button>
</footer>
</div>
<script>
const SLIDES = [{"act": "CLOCK", "title": "A CLOCK DOES NOT LISTEN.", "task": "A clock does the same thing every frame. Either it runs or it does not.", "quote": "Karp: \u201ceither it runs or it does not\u201d \u00b7 S(t+1) = F(S_t)", "focus": "circle(width / 2, height / 2, 120);", "why": "Start with a fixed result the room can see.", "code": "// STANDALONE p5.js SKETCH 1\n// CLOCK: fixed instruction, fixed result.\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  fill(255, 220, 0);\n  circle(width / 2, height / 2, 120);\n}"}, {"act": "CLOCK", "title": "A NUMBER IS A DECISION.", "task": "Change x. Press RUN. The world changes in one direction.", "quote": "Fixed numbers make fixed worlds.", "focus": "let x = 300;", "why": "Numbers are spatial levers. A named number can be rewired.", "code": "// STANDALONE p5.js SKETCH 2\n// x controls left-right position.\n\nlet x = 300;\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  fill(255, 220, 0);\n  circle(x, height / 2, 120);\n}"}, {"act": "TIME", "title": "TRACE VS FRAME: MEMORY OF TIME.", "task": "Move the pointer. In setup(), time accumulates; in draw(), time erases.", "quote": "Zettel: \u201cMoving background() one line changes the ontology of time\u201d", "focus": "background(245); // in setup: memory!", "why": "In draw(), time is wiped clean. In setup(), interaction leaves a history.", "code": "// STANDALONE p5.js SKETCH 3\n// background() in setup() preserves past frames as traces.\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n  background(245);\n}\n\nfunction draw() {\n  // Omit background here to accumulate memory!\n  fill(255, 220, 0, 90);\n  noStroke();\n  circle(mouseX, mouseY, 40);\n}"}, {"act": "MUD", "title": "GET DOWN INTO INPUT.", "task": "Move inside the sketch. The circle follows your hand.", "quote": "Karp/Dewey: \u201cmuddy stream of concrete things\u201d", "focus": "circle(mouseX, mouseY, 120);", "why": "The program stops being a diagram and takes evidence from the world.", "code": "// STANDALONE p5.js SKETCH 4\n// mouseX and mouseY are live input variables.\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  fill(255, 220, 0);\n  circle(mouseX, mouseY, 120);\n}"}, {"act": "TIME", "title": "THE PAST TENSE OF INPUT: pmouseX.", "task": "Move slow, then fast. Speed and direction become physical vectors.", "quote": "Zettel: \u201cpmouseX makes interaction a sentence with a past tense\u201d", "focus": "let speed = dist(mouseX, mouseY, pmouseX, pmouseY);", "why": "Without history there is only position; with history there is velocity and force.", "code": "// STANDALONE p5.js SKETCH 5\n// pmouseX turns pointer state into kinetic speed and direction.\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  let speed = dist(mouseX, mouseY, pmouseX, pmouseY);\n\n  stroke(0);\n  strokeWeight(4);\n  line(pmouseX, pmouseY, mouseX, mouseY);\n\n  fill(255, 220, 0);\n  noStroke();\n  circle(mouseX, mouseY, 60 + speed * 2);\n}"}, {"act": "CLOUD", "title": "INPUT IS A NUMBER, NOT A DESTINY.", "task": "Move left and right. The same input now controls size instead of position.", "quote": "Popper: \u201cA cloud has patterns, not guarantees.\u201d", "focus": "let size = mouseX;", "why": "The key leap: input is an arbitrary quantity, not locked to position.", "code": "// STANDALONE p5.js SKETCH 6\n// mouseX controls size instead of position.\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  let size = mouseX * 0.4;\n\n  fill(255, 220, 0);\n  circle(width / 2, height / 2, size);\n}"}, {"act": "CLOUD", "title": "MEASURE BEFORE YOU JUDGE: dist().", "task": "Move toward the circle. The line shows the nearness metric.", "quote": "Zettel: \u201cdist() turns nearness into an observable quantity\u201d", "focus": "let d = dist(mouseX, mouseY, x, y);", "why": "Before a program can react to an object, it must measure a relation.", "code": "// STANDALONE p5.js SKETCH 7\n// dist() measures nearness to the object.\n\nlet x = 360;\nlet y = 240;\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  let d = dist(mouseX, mouseY, x, y);\n\n  stroke(180);\n  strokeWeight(2);\n  line(mouseX, mouseY, x, y);\n\n  fill(255, 220, 0);\n  noStroke();\n  circle(x, y, 120);\n\n  fill(0);\n  circle(mouseX, mouseY, 14);\n}"}, {"act": "CLOUD", "title": "A RULE CUTS THROUGH THE CLOUD.", "task": "Move close. Proximity triggers a qualitative change.", "quote": "Karp: \u201cmore of a cloud than a clock\u201d", "focus": "if (d < 120) { ... }", "why": "if turns a continuous measurement into a visible consequence.", "code": "// STANDALONE p5.js SKETCH 8\n// if makes a rule from a distance threshold.\n\nlet x = 360;\nlet y = 240;\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  let d = dist(mouseX, mouseY, x, y);\n\n  if (d < 120) {\n    stroke(0);\n    strokeWeight(12);\n  } else {\n    noStroke();\n  }\n\n  fill(255, 220, 0);\n  circle(x, y, 120);\n}"}, {"act": "RESISTANCE", "title": "AUTONOMY: THE CIRCLE CAN REFUSE.", "task": "Move toward it. The shy circle backs away from your hand.", "quote": "Zettel: \u201cNot every interaction should obey.\u201d", "focus": "x += (x - mouseX) * 0.04;", "why": "The same input can produce resistance rather than passive obedience.", "code": "// STANDALONE p5.js SKETCH 9\n// A shy circle refuses the pointer.\n\nlet x = 360;\nlet y = 240;\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  let d = dist(mouseX, mouseY, x, y);\n\n  if (d < 180) {\n    x += (x - mouseX) * 0.04;\n    y += (y - mouseY) * 0.04;\n  }\n\n  x = constrain(x, 70, width - 70);\n  y = constrain(y, 70, height - 70);\n\n  fill(255, 220, 0);\n  circle(x, y, 120);\n}"}, {"act": "THE DRAG", "title": "THE DRAG IS AN EXTENDED PHRASE.", "task": "Press and hold inside the circle. Drag it across the room.", "quote": "Zettel: \u201cThe drag is the computational life between press and release\u201d", "focus": "function mouseDragged() { x = mouseX; y = mouseY; }", "why": "Direct manipulation is sustained engagement, not just instantaneous puncturing.", "code": "// STANDALONE p5.js SKETCH 10\n// Continuous manipulation between press and release.\n\nlet x = 320;\nlet y = 220;\nlet dragging = false;\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  if (dragging) {\n    stroke(0);\n    strokeWeight(6);\n    fill(255, 240, 60);\n  } else {\n    noStroke();\n    fill(255, 220, 0);\n  }\n\n  circle(x, y, 120);\n}\n\nfunction mousePressed() {\n  if (dist(mouseX, mouseY, x, y) < 60) {\n    dragging = true;\n  }\n}\n\nfunction mouseDragged() {\n  if (dragging) {\n    x = mouseX;\n    y = mouseY;\n  }\n}\n\nfunction mouseReleased() {\n  dragging = false;\n}"}, {"act": "FOX", "title": "STATE IS PERSISTENT MEMORY.", "task": "Click the circle. It remembers selection even after you let go.", "quote": "Berlin: \u201cThe fox keeps more than one move\u201d \u00b7 State stores \u0394S", "focus": "let selected = false;", "why": "A boolean variable allows an event that is over to change future behavior.", "code": "// STANDALONE p5.js SKETCH 11\n// selected stores persistent yes/no state.\n\nlet x = 360;\nlet y = 240;\nlet selected = false;\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  if (selected) {\n    fill(255, 120, 0);\n  } else {\n    fill(255, 220, 0);\n  }\n\n  circle(x, y, 120);\n}\n\nfunction mousePressed() {\n  let d = dist(mouseX, mouseY, x, y);\n\n  if (d < 60) {\n    selected = true;\n  }\n}"}, {"act": "FOX", "title": "PUT THAT THERE: TWO-PHASE GRAMMAR.", "task": "Click the circle (THAT). Then click destination (THERE).", "quote": "Bolt (1980): \u201c\u2018There\u2019 is a temporal binding operator between speech & coordinate streams\u201d", "focus": "if (!selected) ... else ...", "why": "State changes what the next click means: reference first, action second.", "code": "// STANDALONE p5.js SKETCH 12\n// First click = THAT. Second click = THERE.\n\nlet x = 320;\nlet y = 220;\nlet selected = false;\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  if (selected) {\n    stroke(0);\n    strokeWeight(8);\n    line(x, y, mouseX, mouseY);\n  } else {\n    noStroke();\n  }\n\n  fill(255, 220, 0);\n  circle(x, y, 120);\n}\n\nfunction mousePressed() {\n  let d = dist(mouseX, mouseY, x, y);\n\n  if (!selected && d < 60) {\n    selected = true; // THAT\n  } else if (selected) {\n    x = mouseX;      // THERE\n    y = mouseY;\n    selected = false; // PUT\n  }\n}"}, {"act": "ANALOGY", "title": "OBJECTS AS OPERANDS: EXECUTABLE ANALOGY.", "task": "Click yellow source circle, then click grey target circle.", "quote": "Bolt (1980): \u201cMake that like that replaces explicit parameters with visible analogy.\u201d", "focus": "targetColor = sourceColor; targetSize = sourceSize;", "why": "An on-screen object can serve as data and an operand for another object.", "code": "// STANDALONE p5.js SKETCH 13\n// Click exemplar (left), click receiver (right).\n\nlet sX = 220, sY = 240, sSize = 130;\nlet tX = 460, tY = 240, tSize = 60;\nlet tColor = [180, 180, 180];\nlet copied = false;\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  // Source object\n  fill(255, 220, 0);\n  noStroke();\n  circle(sX, sY, sSize);\n\n  // Target object\n  fill(tColor);\n  circle(tX, tY, tSize);\n\n  if (copied) {\n    stroke(0);\n    strokeWeight(3);\n    line(sX, sY, mouseX, mouseY);\n  }\n}\n\nfunction mousePressed() {\n  let dS = dist(mouseX, mouseY, sX, sY);\n  let dT = dist(mouseX, mouseY, tX, tY);\n\n  if (dS < sSize / 2) {\n    copied = true;\n  } else if (copied && dT < tSize / 2 + 30) {\n    tColor = [255, 220, 0];\n    tSize = sSize;\n    copied = false;\n  }\n}"}, {"act": "OPPONENT", "title": "CONTINUOUS DYNAMICS VS HUMAN IMPULSE.", "task": "Let the circle drop. Click to impart upward thrust.", "quote": "Nguyen: \u201cNot-clicking is as causally decisive as clicking\u201d \u00b7 Continuous dynamics", "focus": "velocity += gravity; if (clicked) velocity = -9;", "why": "The world is an autonomous system; interaction is a temporary counter-force.", "code": "// STANDALONE p5.js SKETCH 14\n// Flappy dynamics: gravity pulls down, click pushes up.\n\nlet y = 140;\nlet velocity = 0;\nlet gravity = 0.4;\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  velocity += gravity;\n  y += velocity;\n\n  if (y > height - 60) {\n    y = height - 60;\n    velocity = 0;\n  }\n\n  fill(255, 220, 0);\n  noStroke();\n  circle(width / 2, y, 100);\n}\n\nfunction mousePressed() {\n  velocity = -9;\n}"}, {"act": "NOT A STRAIGHT LINE", "title": "LERP: THE DELAY BETWEEN DESIRE AND ARRIVAL.", "task": "Click anywhere. Change 0.08 to 0.02. Press RUN.", "quote": "Zettel: \u201cCurrent position and desired position can differ\u201d", "focus": "x = lerp(x, targetX, 0.08);", "why": "Easing decouples the target from instant teleportation, giving weight.", "code": "// STANDALONE p5.js SKETCH 15\n// The circle glides toward a target with easing.\n\nlet x = 320;\nlet y = 220;\nlet targetX = x;\nlet targetY = y;\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  x = lerp(x, targetX, 0.08);\n  y = lerp(y, targetY, 0.08);\n\n  fill(255, 220, 0);\n  circle(x, y, 120);\n}\n\nfunction mousePressed() {\n  targetX = mouseX;\n  targetY = mouseY;\n}"}, {"act": "FIVE WHYS", "title": "THE DEBUG RITUAL: MAKE FAILURE VISIBLE.", "task": "Delete one parenthesis. Press RUN. Ask what broke first.", "quote": "Norman / Shneiderman: \u201cInteraction exists only when I_t \u2192 \u0394S \u2192 \u0394P\u201d", "focus": "RUN \u2192 ERROR \u2192 WHY \u2192 CHANGE \u2192 RUN", "why": "Code teaches because failure appears immediately and speaks back.", "code": "// STANDALONE p5.js SKETCH 16\n// Debug ritual: change one thing, run, inspect.\n\nlet x = 360;\nlet y = 240;\n\nfunction setup() {\n  createCanvas(windowWidth, windowHeight);\n}\n\nfunction draw() {\n  background(245);\n\n  fill(255, 220, 0);\n  circle(x, y, 120);\n}\n\n// TRY:\n// Delete one parenthesis.\n// Press RUN.\n// Ask: what broke first?"}];
const $ = id => document.getElementById(id);
const stage = $('stage');
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
const editor = $('editor');
const errorBox = $('error');

let index = 0;
let program = null;
let inputTimer = null;
let fillValue = [0,0,0,255];
let strokeValue = null;
let strokeWidthValue = 1;

const api = {
  width:1,height:1,windowWidth:1,windowHeight:1,
  mouseX:0,mouseY:0,pmouseX:0,pmouseY:0,mouseIsPressed:false,
  createCanvas(w,h){ setCanvas(w,h); return canvas; },
  background(...args){ const c = makeColor(args); ctx.save(); ctx.fillStyle = cssColor(c); ctx.fillRect(0,0,api.width,api.height); ctx.restore(); },
  fill(...args){ fillValue = makeColor(args); },
  noFill(){ fillValue = null; },
  stroke(...args){ strokeValue = makeColor(args); },
  noStroke(){ strokeValue = null; },
  strokeWeight(w){ strokeWidthValue = Number(w) || 1; },
  circle(x,y,d){ ctx.beginPath(); ctx.ellipse(x,y,d/2,d/2,0,0,Math.PI*2); paint(); },
  ellipse(x,y,w,h){ ctx.beginPath(); ctx.ellipse(x,y,w/2,h/2,0,0,Math.PI*2); paint(); },
  rect(x,y,w,h){ ctx.beginPath(); ctx.rect(x,y,w,h); paint(); },
  line(x1,y1,x2,y2){ if(!strokeValue)return; ctx.save(); ctx.strokeStyle=cssColor(strokeValue); ctx.lineWidth=strokeWidthValue; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore(); },
  dist(x1,y1,x2,y2){ return Math.hypot(x2-x1,y2-y1); },
  lerp(a,b,t){ return a + (b-a)*t; },
  constrain(v,lo,hi){ return Math.min(hi,Math.max(lo,v)); },
  map(v,a1,a2,b1,b2){ return b1 + ((v-a1)/(a2-a1))*(b2-b1); },
  random(a,b){ if(a === undefined)return Math.random(); if(b === undefined)return Math.random()*a; return a + Math.random()*(b-a); }
};

function makeColor(args){
  if(args.length === 0) return [0,0,0,255];
  if(typeof args[0] === 'string') return args[0];
  const a = args.map(Number);
  if(a.length === 1) return [a[0],a[0],a[0],255];
  if(a.length === 2) return [a[0],a[0],a[0],a[1]];
  if(a.length === 3) return [a[0],a[1],a[2],255];
  return [a[0],a[1],a[2],a[3] ?? 255];
}

function cssColor(c){
  if(typeof c === 'string') return c;
  return `rgba(${c[0]},${c[1]},${c[2]},${(c[3] ?? 255)/255})`;
}

function paint(){
  ctx.save();
  if(fillValue){ ctx.fillStyle = cssColor(fillValue); ctx.fill(); }
  if(strokeValue){ ctx.strokeStyle = cssColor(strokeValue); ctx.lineWidth = strokeWidthValue; ctx.stroke(); }
  ctx.restore();
}

function measureStage(){
  const r = stage.getBoundingClientRect();
  api.windowWidth = Math.max(1, Math.floor(r.width));
  api.windowHeight = Math.max(1, Math.floor(r.height));
}

function setCanvas(w,h){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  api.width = Math.max(1, Math.floor(w));
  api.height = Math.max(1, Math.floor(h));
  canvas.width = api.width * dpr;
  canvas.height = api.height * dpr;
  canvas.style.width = api.width + 'px';
  canvas.style.height = api.height + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function compile(code){
  const body = `
    with(this){
      ${code}
      return {
        setup: typeof setup === 'function' ? setup : null,
        draw: typeof draw === 'function' ? draw : null,
        mousePressed: typeof mousePressed === 'function' ? mousePressed : null,
        mouseDragged: typeof mouseDragged === 'function' ? mouseDragged : null,
        mouseReleased: typeof mouseReleased === 'function' ? mouseReleased : null
      };
    }
  `;
  return new Function(body).call(api);
}

function runSketch(){
  try{
    measureStage();
    api.mouseX = api.mouseX || api.windowWidth/2;
    api.mouseY = api.mouseY || api.windowHeight/2;
    fillValue = [0,0,0,255];
    strokeValue = null;
    strokeWidthValue = 1;
    program = compile(editor.value);
    if(program.setup) program.setup();
    errorBox.style.display = 'none';
  }catch(err){
    program = null;
    errorBox.textContent = err.message || String(err);
    errorBox.style.display = 'block';
  }
}

function fitEditor(){
  const lines = editor.value.split('\n').length;
  const portrait = matchMedia('(max-width:900px) and (orientation:portrait)').matches;
  const land = matchMedia('(max-height:620px) and (orientation:landscape)').matches;
  let px = 22, lh = 1.14;
  if(portrait){
    if(lines > 30){ px = 6.2; lh = 1.0; }
    else if(lines > 22){ px = 6.8; lh = 1.04; }
    else { px = 7.4; lh = 1.08; }
  }else if(land){
    if(lines > 30){ px = 6.7; lh = 1.0; }
    else { px = 7.4; lh = 1.03; }
  }else{
    if(lines > 30){ px = 16.5; lh = 1.06; }
    else if(lines > 22){ px = 19; lh = 1.1; }
  }
  editor.style.fontSize = px + 'px';
  editor.style.lineHeight = String(lh);
}

function showSlide(i){
  index = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[index];
  $('act').textContent = s.act;
  $('quote').textContent = s.quote;
  $('title').textContent = s.title;
  $('task').textContent = s.task;
  $('focus').textContent = s.focus;
  $('why').textContent = s.why;
  $('count').textContent = `${index + 1}/${SLIDES.length}`;
  editor.value = s.code;
  fitEditor();
  runSketch();
}

function updatePointer(e){
  const r = canvas.getBoundingClientRect();
  api.pmouseX = api.mouseX;
  api.pmouseY = api.mouseY;
  api.mouseX = (e.clientX - r.left) * (api.width / r.width);
  api.mouseY = (e.clientY - r.top) * (api.height / r.height);
}

canvas.addEventListener('pointermove', e => {
  updatePointer(e);
  if(e.buttons && program && program.mouseDragged) program.mouseDragged();
});
canvas.addEventListener('pointerdown', e => {
  updatePointer(e);
  api.mouseIsPressed = true;
  canvas.setPointerCapture?.(e.pointerId);
  if(program && program.mousePressed) program.mousePressed();
});
canvas.addEventListener('pointerup', e => {
  updatePointer(e);
  api.mouseIsPressed = false;
  if(program && program.mouseReleased) program.mouseReleased();
});

editor.addEventListener('input', () => {
  fitEditor();
  clearTimeout(inputTimer);
  inputTimer = setTimeout(runSketch, 240);
});
editor.addEventListener('keydown', e => {
  if(e.key === 'Tab'){
    e.preventDefault();
    const a = editor.selectionStart;
    const b = editor.selectionEnd;
    editor.setRangeText('  ', a, b, 'end');
    editor.dispatchEvent(new Event('input'));
  }
});

$('run').onclick = runSketch;
$('reset').onclick = () => showSlide(index);
$('prev').onclick = () => showSlide(index - 1);
$('next').onclick = () => showSlide(index + 1);
$('copy').onclick = async () => {
  try{
    await navigator.clipboard.writeText(editor.value);
    $('copy').textContent = 'COPIED';
    setTimeout(() => $('copy').textContent = 'COPY', 800);
  }catch(e){}
};

window.addEventListener('keydown', e => {
  if(e.target === editor) return;
  if(e.key === 'ArrowLeft') showSlide(index - 1);
  if(e.key === 'ArrowRight') showSlide(index + 1);
  if(e.key === 'Enter') runSketch();
});
window.addEventListener('resize', () => {
  fitEditor();
  runSketch();
});

function frame(){
  if(program && program.draw){
    try{ program.draw(); }
    catch(err){
      errorBox.textContent = err.message || String(err);
      errorBox.style.display = 'block';
    }
  }
  requestAnimationFrame(frame);
}

document.addEventListener('wheel', e => e.preventDefault(), {passive:false});
document.addEventListener('touchmove', e => {
  if(e.target === editor) return;
  e.preventDefault();
}, {passive:false});

showSlide(0);
requestAnimationFrame(frame);
</script>
</body>
</html>

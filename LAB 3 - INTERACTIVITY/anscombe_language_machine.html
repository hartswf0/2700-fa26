<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ANSCOMBE // LANGUAGE MACHINE</title>
<style>
:root{--paper:#fffef7;--wash:#f3f0e7;--ink:#10100e;--line:#cfc9bc;--muted:#777168;--yellow:#f2df70;--green:#0b704f;--orange:#d85e25}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:12px/1.25 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button,input,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}[hidden]{display:none!important}
.app{height:100dvh;display:grid;grid-template-rows:36px 25px minmax(0,1fr) 34px;background:var(--paper)}
.top{display:flex;align-items:center;border-bottom:1px solid var(--ink);min-width:0}.brand{height:35px;display:flex;align-items:center;padding:0 10px;border-right:1px solid var(--ink);font-weight:950;font-size:14px;letter-spacing:-.05em}.engine{height:35px;display:flex;align-items:center;gap:6px;padding:0 10px;border-right:1px solid var(--line);font-size:8px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.dot.busy{background:var(--yellow)}.dot.bad{background:var(--orange)}.grow{flex:1}.action{height:35px;min-width:82px;padding:0 12px;border-left:1px solid var(--ink);background:var(--yellow);font-weight:950;font-size:9px}.action.dark{background:var(--ink);color:var(--paper)}.action:disabled{opacity:.28;cursor:default}
.trace{height:25px;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--line);background:var(--wash);font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trace strong{color:var(--ink);margin-right:8px}
.main{min-height:0;position:relative;overflow:hidden}.screen{position:absolute;inset:0;display:none;min-height:0;background:var(--paper)}.screen.on{display:grid}

/* CALL */
#callScreen{grid-template-rows:auto minmax(0,1fr)}.call{border-bottom:1px solid var(--ink)}.callRow{display:grid;grid-template-columns:70px minmax(0,1fr);min-height:58px;border-bottom:1px solid var(--line)}.callRow:last-child{border-bottom:0}.callRow label{display:flex;align-items:center;padding:0 9px;background:var(--wash);border-right:1px solid var(--line);font-weight:950;font-size:8px}.callRow input{width:100%;border:0;outline:0;background:#fff;padding:0 12px;font:800 16px/1.2 Arial,Helvetica,sans-serif;min-width:0}.void{display:grid;place-items:center;color:#b5afa4;font-size:8px;letter-spacing:.08em}

/* WORLD */
#worldScreen,#detectScreen{grid-template-rows:minmax(0,1fr) auto}.world{position:relative;min-height:0;background:#080808;overflow:hidden;touch-action:none}.world canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}.readout{position:absolute;left:7px;right:7px;bottom:7px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;color:#fff;font-size:7px}.readout span{background:#080808;border:1px solid #777;padding:4px 5px}.meaning{min-height:42px;border-top:1px solid var(--ink);display:grid;grid-template-columns:72px minmax(0,1fr);background:#fff}.meaning b{display:flex;align-items:center;padding:0 8px;background:var(--wash);border-right:1px solid var(--line);font-size:8px}.meaning span{display:flex;align-items:center;padding:0 9px;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* DETECT */
.guess{border-top:1px solid var(--ink);background:#fff}.guessRow{display:grid;grid-template-columns:70px minmax(0,1fr);height:43px;border-bottom:1px solid var(--line)}.guessRow:last-child{border-bottom:0}.guessRow label{display:flex;align-items:center;padding:0 8px;background:var(--wash);border-right:1px solid var(--line);font-weight:950;font-size:8px}.guessRow input{border:0;outline:0;padding:0 10px;font:800 14px/1.2 Arial,Helvetica,sans-serif;min-width:0}

/* REVEAL */
#revealScreen{grid-template-rows:repeat(3,1fr)}.revealRow{display:grid;grid-template-columns:78px minmax(0,1fr);border-bottom:1px solid var(--ink);min-height:0}.revealRow:last-child{border-bottom:0}.revealRow b{display:flex;align-items:center;padding:10px;background:var(--wash);border-right:1px solid var(--line);font-size:8px}.revealRow.creator{background:#fff7b7}.revealText{display:flex;align-items:center;padding:14px;font:850 clamp(16px,5vw,28px)/1.15 Arial,Helvetica,sans-serif;overflow:auto}.revealText small{font:900 9px/1.4 ui-monospace,monospace;color:var(--muted)}

/* FOOT */
.foot{display:flex;align-items:center;border-top:1px solid var(--ink);min-width:0}.footState{padding:0 9px;font-size:8px;color:var(--muted);white-space:nowrap}.footState b{color:var(--ink)}.footGrow{flex:1}.footBtn{height:33px;padding:0 10px;border-left:1px solid var(--line);font-size:8px;font-weight:950}.footBtn.danger{color:var(--orange)}

/* SETTINGS */
.back{position:fixed;inset:0;background:rgba(16,16,14,.22);z-index:40;display:none;align-items:flex-end;justify-content:center}.back.open{display:flex}.sheet{width:min(520px,calc(100% - 12px));margin:0 6px 6px;background:var(--paper);border:1px solid var(--ink)}.sheetHead{height:32px;display:flex;align-items:center;padding:0 9px;border-bottom:1px solid var(--line);font-weight:950;font-size:9px}.sheetRow{display:grid;grid-template-columns:78px 1fr;border-bottom:1px solid var(--line)}.sheetRow label{display:flex;align-items:center;padding:0 9px;background:var(--wash);border-right:1px solid var(--line);font-size:8px;font-weight:950}.sheetRow input,.sheetRow select{height:44px;border:0;padding:0 9px;background:#fff;min-width:0;font:inherit}.sheetActions{display:grid;grid-template-columns:1fr 1fr}.sheetActions button{height:42px;border-right:1px solid var(--line);font-weight:950;font-size:9px}.sheetActions button:last-child{border-right:0;background:var(--ink);color:var(--paper)}

@media(min-width:760px){.callRow{min-height:68px}.callRow input{font-size:20px}.revealText{font-size:28px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">ANSCOMBE</div>
    <button id="engineBtn" class="engine"><span id="engineDot" class="dot"></span><span id="engineText">LOCAL</span></button>
    <div class="grow"></div>
    <button id="mainAction" class="action">MAKE</button>
  </header>

  <div id="trace" class="trace"><strong>READY</strong> write one call → MAKE</div>

  <main class="main">
    <section id="callScreen" class="screen on">
      <div class="call">
        <div class="callRow"><label>WHEN</label><input id="whenInput" value="the person lies down and rolls" autocomplete="off"></div>
        <div class="callRow"><label>WORLD</label><input id="worldInput" value="gravity, hills and wind come alive and roll the yellow ball" autocomplete="off"></div>
      </div>
      <div class="void">WORDS → WORLD</div>
    </section>

    <section id="worldScreen" class="screen">
      <div id="world" class="world"><canvas id="worldCanvas" width="126" height="92"></canvas><div class="readout"><span id="inputReadout">DRAG ↔</span><span id="forceReadout">WIND .35</span></div></div>
      <div class="meaning"><b>READ AS</b><span id="meaningText">horizontal drag</span></div>
    </section>

    <section id="detectScreen" class="screen">
      <div id="detectWorld" class="world"><canvas id="detectCanvas" width="126" height="92"></canvas></div>
      <div class="guess">
        <div class="guessRow"><label>WHEN</label><input id="guessWhen" placeholder="what action?" autocomplete="off"></div>
        <div class="guessRow"><label>WORLD</label><input id="guessWorld" placeholder="what happens?" autocomplete="off"></div>
      </div>
    </section>

    <section id="revealScreen" class="screen">
      <div class="revealRow creator"><b>AUTHOR</b><div id="authorReveal" class="revealText"></div></div>
      <div class="revealRow"><b>MODEL</b><div id="modelReveal" class="revealText"></div></div>
      <div class="revealRow"><b>DETECTIVE</b><div id="detectReveal" class="revealText"></div></div>
    </section>
  </main>

  <footer class="foot">
    <div class="footState">STATE&nbsp; <b id="stateText">REST</b></div><div class="footGrow"></div>
    <button id="backBtn" class="footBtn" hidden>EDIT</button>
    <button id="resetBtn" class="footBtn danger">RESET</button>
  </footer>
</div>

<div id="settingsBack" class="back">
  <div class="sheet">
    <div class="sheetHead">COMPUTE</div>
    <div class="sheetRow"><label>ENGINE</label><select id="engineSelect"><option value="local">LOCAL</option><option value="openai">OPENAI</option></select></div>
    <div class="sheetRow"><label>MODEL</label><input id="modelInput" value="gpt-5.6-luna" autocomplete="off"></div>
    <div class="sheetRow"><label>API KEY</label><input id="keyInput" type="password" placeholder="sk-..." autocomplete="off"></div>
    <div class="sheetActions"><button id="forgetBtn">FORGET KEY</button><button id="closeSettings">DONE</button></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let mode='call',engine='local',busy=false,spec=null,frame=0,raf=0;
let sim={x:63,y:28,vx:0,vy:0,drag:false,lastX:63};
const screens={call:$('callScreen'),world:$('worldScreen'),detect:$('detectScreen'),reveal:$('revealScreen')};

function setMode(next){
  mode=next;Object.entries(screens).forEach(([k,v])=>v.classList.toggle('on',k===mode));
  $('backBtn').hidden=!(mode==='world');
  if(mode==='call'){setState('REST');setTrace('READY','write one call → MAKE');setAction('MAKE',false);stopWorld();}
  if(mode==='world'){setState('CHANGED');setTrace('WORLD',spec?.proxy?.description||'call compiled');setAction('HAND OFF',true);startWorld();}
  if(mode==='detect'){setState('DETECT');setTrace('BLIND','world only · infer the call');setAction('REVEAL',true);startWorld();}
  if(mode==='reveal'){setState('COMPLETE');setTrace('REVEAL','author → model → detective');setAction('NEW',false);stopWorld();renderReveal();}
}
function setState(s){$('stateText').textContent=s}
function setTrace(a,b){$('trace').innerHTML='<strong>'+a+'</strong>'+b}
function setAction(text,dark){$('mainAction').textContent=text;$('mainAction').classList.toggle('dark',!!dark)}

$('mainAction').onclick=()=>{
  if(mode==='call') compile();
  else if(mode==='world') setMode('detect');
  else if(mode==='detect') setMode('reveal');
  else if(mode==='reveal') resetAll();
};
$('backBtn').onclick=()=>setMode('call');
$('resetBtn').onclick=resetAll;
function resetAll(){spec=null;sim={x:63,y:28,vx:0,vy:0,drag:false,lastX:63};$('guessWhen').value='';$('guessWorld').value='';setMode('call')}

function localCompile(){
  const w=($('whenInput').value+' '+$('worldInput').value).toLowerCase();
  const proxy=w.includes('roll')||w.includes('drag')?'horizontal drag':w.includes('hold')||w.includes('press')?'press and hold':w.includes('click')||w.includes('tap')?'tap':'pointer movement';
  return {proxy:{type:proxy.includes('drag')?'drag':proxy.includes('hold')?'hold':proxy==='tap'?'tap':'move',description:proxy},world:{gravity:w.includes('gravity')?.38:.18,hills:w.includes('hill')?.78:.35,wind:w.includes('wind')?.52:.08,momentum:.88,friction:.985,turbulence:.35}};
}

async function compile(){
  if(busy)return;busy=true;$('mainAction').textContent='STOP';$('engineDot').classList.add('busy');setState('WORKING');setTrace('WORKING','words → operations');
  try{
    spec=engine==='openai'?await aiCompile():localCompile();
    normalizeSpec();$('meaningText').textContent=spec.proxy.description;$('inputReadout').textContent=spec.proxy.description.toUpperCase();$('forceReadout').textContent='WIND '+spec.world.wind.toFixed(2);setMode('world');
  }catch(e){console.error(e);$('engineDot').classList.add('bad');setState('FAULT');setTrace('FAULT',e.message||'compile failed');setAction('MAKE',false)}finally{busy=false;$('engineDot').classList.remove('busy')}
}
function normalizeSpec(){
  spec=spec||localCompile();spec.proxy=spec.proxy||{type:'drag',description:'horizontal drag'};spec.world=spec.world||{};
  const d={gravity:.38,hills:.78,wind:.52,momentum:.88,friction:.985,turbulence:.35};for(const k in d){let v=Number(spec.world[k]);spec.world[k]=Number.isFinite(v)?Math.max(0,Math.min(1,v)):d[k]}
}
async function aiCompile(){
  const key=$('keyInput').value.trim();if(!key)throw new Error('add API key or use LOCAL');
  const prompt=`Translate this intention into a tiny interaction specification. WHEN ${$('whenInput').value}. WORLD ${$('worldInput').value}. Return JSON only with this shape: {"proxy":{"type":"drag|hold|tap|move","description":"short observable browser action"},"world":{"gravity":0..1,"hills":0..1,"wind":0..1,"momentum":0..1,"friction":0..1,"turbulence":0..1}}. Do not output code.`;
  const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:$('modelInput').value.trim()||'gpt-5.6-luna',messages:[{role:'system',content:'You compile human language into bounded interaction parameters. Return JSON only.'},{role:'user',content:prompt}],response_format:{type:'json_object'}})});
  if(!r.ok)throw new Error('API '+r.status);const j=await r.json();return JSON.parse(j.choices?.[0]?.message?.content||'{}');
}

/* world */
const c=$('worldCanvas'),ctx=c.getContext('2d'),dc=$('detectCanvas'),dctx=dc.getContext('2d');
function hillY(x){const h=spec?.world?.hills??.78;return 68+Math.sin(x*.105)*8*h+Math.sin(x*.031+1.7)*10*h}
function resetBall(){sim.x=63;sim.y=24;sim.vx=0;sim.vy=0}
function step(){if(!spec)return;const w=spec.world;sim.vy+=.055+.11*w.gravity;sim.vx+=(w.wind-.5)*.018;sim.vx*=.996;sim.x+=sim.vx;sim.y+=sim.vy;const gy=hillY(sim.x)-3;if(sim.y>gy){sim.y=gy;const slope=(hillY(sim.x+1)-hillY(sim.x-1))/2;sim.vx+=slope*.028*w.momentum;sim.vy*= -0.16;sim.vx*=w.friction}if(sim.x<-4)sim.x=130;if(sim.x>130)sim.x=-4;if(sim.y>100)resetBall()}
function drawWorld(g){g.fillStyle='#080808';g.fillRect(0,0,126,92);const w=spec?.world||{wind:.5,turbulence:.3};
  g.fillStyle='#41413c';for(let x=0;x<126;x+=2){const y=Math.round(hillY(x));for(let yy=y;yy<92;yy+=2)g.fillRect(x,yy,1,1)}
  g.fillStyle='#9d9b91';for(let i=0;i<18;i++){const y=12+((i*17+frame*0.23*w.turbulence)%42);let x=(i*29+frame*(.08+w.wind*.34))%136-5;g.fillRect(x,y,1+(i%3),1)}
  g.fillStyle='#f2df70';g.fillRect(Math.round(sim.x)-3,Math.round(sim.y)-3,7,7);g.fillStyle='#fff';g.fillRect(Math.round(sim.x)-1,Math.round(sim.y)-1,1,1)}
function loop(){frame++;step();drawWorld(ctx);drawWorld(dctx);raf=requestAnimationFrame(loop)}
function startWorld(){if(!raf)raf=requestAnimationFrame(loop)}function stopWorld(){if(raf){cancelAnimationFrame(raf);raf=0}}
function pointerPos(e,el){const r=el.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*126,y:(e.clientY-r.top)/r.height*92}}
function bindWorld(el){el.addEventListener('pointerdown',e=>{if(!spec)return;const p=pointerPos(e,el);sim.drag=true;sim.lastX=p.x;el.setPointerCapture?.(e.pointerId);if(spec.proxy.type==='tap'){sim.vy=-2.1;sim.vx+=(p.x-sim.x)*.035}});el.addEventListener('pointermove',e=>{if(!sim.drag||!spec)return;const p=pointerPos(e,el);if(spec.proxy.type==='drag'){sim.vx+=(p.x-sim.lastX)*.08*spec.world.momentum;sim.lastX=p.x}else if(spec.proxy.type==='move'){sim.vx+=(p.x-sim.x)*.0008}});el.addEventListener('pointerup',()=>sim.drag=false);}
bindWorld($('world'));bindWorld($('detectWorld'));

function renderReveal(){
  $('authorReveal').textContent='WHEN '+$('whenInput').value+' / WORLD '+$('worldInput').value;
  $('modelReveal').textContent=spec?.proxy?.description||'—';
  $('detectReveal').textContent='WHEN '+($('guessWhen').value||'—')+' / WORLD '+($('guessWorld').value||'—');
}

/* settings */
$('engineBtn').onclick=()=>$('settingsBack').classList.add('open');$('closeSettings').onclick=()=>{$('settingsBack').classList.remove('open');applyEngine()};$('settingsBack').onclick=e=>{if(e.target===$('settingsBack')){$('settingsBack').classList.remove('open');applyEngine()}};$('forgetBtn').onclick=()=>{$('keyInput').value=''};
function applyEngine(){engine=$('engineSelect').value;$('engineText').textContent=engine==='openai'?'OPENAI':'LOCAL';$('engineDot').className='dot'}

setMode('call');
</script>
</body>
</html>

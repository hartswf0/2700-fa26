<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lab 7 · The Constructors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IM+Fell+English:ital@0;1&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/codemirror.css">
<style>
:root{
  --ink:#141414; --paper:#f6f4ee; --white:#fff; --rule:#d8d4c8; --grey:#6b675e;
  --yellow:#ffdc00; --band:#ffe55c; --soft:#fff6c2; --red:#c23b22; --blue:#2f62d9; --mint:#eef7f2;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans:"Inter", Arial, Helvetica, sans-serif;
  --serif:"IM Fell English", Georgia, serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-size:12px}
.dim{color:var(--grey)}
.tag{display:inline-block;background:var(--ink);color:var(--yellow);font:700 11px/1 var(--mono);letter-spacing:.08em;padding:6px 8px;white-space:nowrap}

/* ---------- top bar ---------- */
#top{height:50px;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--white);border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand b{font:800 17px/1 var(--sans);letter-spacing:-.01em}
#map{display:flex;gap:16px;margin:0 auto;align-items:flex-end;overflow:hidden}
.part{display:flex;flex-direction:column;gap:4px}
.part b{font:600 9px/1 var(--mono);letter-spacing:.14em;color:var(--grey)}
.pips{display:flex;gap:4px}
.pip{width:20px;height:13px;border:1.5px solid var(--ink);background:var(--white);padding:0;cursor:pointer}
.pip:hover{background:var(--soft)}
.pip.solved{background:var(--ink)}
.pip.here{background:var(--yellow);outline:2px solid var(--ink);outline-offset:1px}
.pip.here.solved{box-shadow:inset 0 0 0 3px var(--ink)}
#pos{font:600 12px var(--mono);white-space:nowrap}
.nav{display:flex;gap:6px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px;border:2px solid var(--ink);background:var(--white);font:700 12px/1 var(--mono);letter-spacing:.05em;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn:active{transform:translateY(1px)}
.btn.prim{background:var(--yellow)}
.btn.sm{height:28px;padding:0 9px;font-size:11px}
.btn:disabled{opacity:.4;cursor:default}
.btn.dirty{box-shadow:0 0 0 3px var(--ink), 0 0 0 6px var(--yellow);animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{box-shadow:0 0 0 3px var(--ink), 0 0 0 3px var(--yellow)}}
.btn.pulse{background:var(--yellow);animation:nudge 1.4s ease-in-out infinite}
.lnk{border:0;background:none;padding:2px 4px;font:600 11px var(--mono);text-decoration:underline;cursor:pointer;color:var(--ink)}
.i-play{width:0;height:0;border-left:10px solid var(--ink);border-top:6px solid transparent;border-bottom:6px solid transparent}
.i-stop{width:10px;height:10px;background:var(--ink)}
.i-step{width:12px;height:12px;position:relative}
.i-step:before{content:"";position:absolute;left:0;top:0;border-left:8px solid var(--ink);border-top:6px solid transparent;border-bottom:6px solid transparent}
.i-step:after{content:"";position:absolute;right:0;top:0;width:3px;height:12px;background:var(--ink)}
.i-back{width:0;height:0;border-right:8px solid var(--ink);border-top:5px solid transparent;border-bottom:5px solid transparent}
.arrow-l,.arrow-r{width:10px;height:10px;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink)}
.arrow-l{transform:rotate(45deg);margin-left:3px}.arrow-r{transform:rotate(-135deg);margin-right:3px}

/* ---------- three columns, one screen ---------- */
main{height:calc(100vh - 50px);height:calc(100dvh - 50px);display:grid;grid-template-columns:minmax(270px,24%) minmax(0,1fr) minmax(0,1.12fr)}
main.k-match{grid-template-columns:minmax(260px,22%) minmax(300px,27%) minmax(0,1fr)}
main.k-handin{grid-template-columns:minmax(270px,24%) minmax(0,1fr) minmax(0,1.12fr)}
main.k-match #codeSec, main.k-handin #codeSec{display:none}
main.k-sketch #altSec, main.k-train #altSec{display:none}
main > section{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:2px solid var(--ink)}
main > section:last-child{border-right:0}
.bar{display:flex;align-items:center;gap:8px;min-height:50px;padding:7px 10px;border-bottom:2px solid var(--ink);background:var(--white);flex-wrap:wrap}
.bar .sp{flex:1}

/* ---------- brief ---------- */
#brief{background:var(--white);overflow-y:auto;padding:14px 16px 18px;gap:12px}
.kicker{font:600 11px var(--mono);color:var(--grey);display:flex;align-items:center;gap:8px}
#brief h1{font:800 26px/1.05 var(--sans);letter-spacing:-.02em;margin:0}
.film{margin:0}
.film video{display:block;width:100%;aspect-ratio:16/9;background:#e9e3d2;border:2px solid var(--ink)}
.film figcaption{font:500 10.5px var(--mono);color:var(--grey);margin-top:5px;letter-spacing:.02em}
.story{margin:0;padding:8px 0 8px 12px;border-left:5px solid var(--yellow)}
.story p{margin:0;font:400 16.5px/1.35 var(--serif)}
.story cite{display:block;margin-top:5px;font:500 10.5px var(--mono);font-style:normal;color:var(--grey);letter-spacing:.03em}
.lead{margin:0;font-size:14px;line-height:1.45}
.task{border:2px solid var(--ink);background:var(--white)}
.taskhead{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--yellow);font:700 11px var(--mono);letter-spacing:.1em;padding:7px 9px}
.tasktext{margin:10px 10px 6px;font:600 14.5px/1.4 var(--sans)}
.checks{list-style:none;margin:6px 10px 10px;padding:0;display:grid;gap:6px}
.checks li{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.35}
.checks li.pending{color:var(--grey);font:500 12px var(--mono)}
.checks .box{flex:none;width:16px;height:16px;border:2px solid var(--ink);margin-top:1px;position:relative;background:var(--white)}
.checks li.ok .box{background:var(--ink)}
.checks li.ok .box:after{content:"";position:absolute;left:4px;top:0;width:4px;height:8px;border:solid var(--yellow);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.checks li.ok{color:var(--ink)}
.checks.static li{font-size:14px}
.verdict{font:700 11px var(--mono)}
.verdict.solved{background:var(--yellow);color:var(--ink);padding:3px 7px}
.verdict.was{color:#ddd}
.hint{margin:0 10px 10px;font-size:13px}
.hint summary{cursor:pointer;font:700 11px var(--mono);letter-spacing:.08em}
.hint p{margin:6px 0 0;padding:8px;background:var(--soft);font:500 12.5px/1.45 var(--mono)}
.share{display:flex;flex-direction:column;gap:6px;margin:0 10px 10px;font-size:12px}
.howto ul{margin:4px 0 0;padding-left:16px;font-size:12.5px;line-height:1.45}
.howto li{margin-bottom:3px}
.rules ul,.steps{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.45}
.steps{margin:8px 10px 10px 8px}
.rules li,.steps li{margin-bottom:4px}
.vsec{font:700 10.5px var(--mono);letter-spacing:.1em;color:var(--grey);padding:6px 0 3px}

/* ---------- code ---------- */
#codeSec{background:var(--white)}
.file{font:600 12px var(--mono);color:var(--grey);margin-left:6px}
.auto{display:flex;align-items:center;gap:5px;font:600 11px var(--mono);color:var(--grey)}
#cm{flex:1;min-height:0;position:relative}
#cm .CodeMirror{position:absolute;inset:0;height:auto;font:14px/1.62 var(--mono);color:var(--ink)}
.CodeMirror-gutters{background:#faf9f4;border-right:1px solid var(--rule)}
.CodeMirror-linenumber{color:#a9a496}
.cm-marks{width:14px}
.gm{display:block;width:9px;height:9px;margin:7px 0 0 3px}
.gm.err{background:var(--red);border-radius:50%}
.gm.arrow{width:0;height:0;border-left:9px solid var(--ink);border-top:6px solid transparent;border-bottom:6px solid transparent;margin-top:5px}
.CodeMirror-activeline-background{background:#f4f1e6}
.cm-band{background:var(--band)!important}
.cm-flash{background:#cfe0ff!important;transition:background .3s}
.cm-err{background:#fde3dc!important}
.cm-s-default .cm-keyword{color:#7a2fa0;font-weight:600}
.cm-s-default .cm-def{color:#1b4fbf}
.cm-s-default .cm-variable-2{color:#1b4fbf}
.cm-s-default .cm-number{color:#b25b00}
.cm-s-default .cm-string{color:#2c7a2c}
.cm-s-default .cm-comment{color:#8b8676;font-style:italic}
.cm-s-default .cm-property{color:#141414}
#explain{flex:none;height:172px;border-top:2px solid var(--ink);overflow-y:auto;background:var(--white)}
.xhead{display:flex;align-items:center;gap:10px;padding:9px 12px 0}
.xhead code{font:500 12.5px var(--mono);white-space:pre;overflow:hidden;text-overflow:ellipsis}
.xbody{padding:4px 12px 10px}
.xbody p{margin:6px 0 0;font-size:14px;line-height:1.45}
.xbody .note{font-weight:600}
.xbody .gen{color:#2a2823}
.stephead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--white);z-index:1}
.scrub{flex:1;min-width:60px;accent-color:var(--ink)}
.diffs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.diff{font:500 12px var(--mono);background:var(--soft);border:1px solid var(--ink);padding:2px 6px}
.diff i{font-style:normal;font-weight:700}

/* ---------- stage ---------- */
#stage{background:var(--paper)}
#view{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(0deg,#efece3 0 1px,transparent 1px 24px),repeating-linear-gradient(90deg,#efece3 0 1px,transparent 1px 24px)}
#box{position:relative;box-shadow:0 0 0 2px var(--ink);background:var(--white)}
#box iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:var(--white)}
#ov{position:absolute;left:0;top:0;pointer-events:none}
#field{box-shadow:0 0 0 2px var(--ink);background:#ebe3cf}
#library{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:16px;overflow:auto}
#endFilm{width:100%;max-height:calc(100% - 120px);aspect-ratio:16/9;border:2px solid var(--ink);background:#e9e3d2}
.reels{display:flex;flex-wrap:wrap;gap:6px}
.reels .btn.on{background:var(--yellow)}
#boardWrap{position:absolute;right:16px;top:16px;max-height:calc(100% - 32px);overflow:auto;background:var(--white);border:2px solid var(--ink);padding:8px 12px;min-width:320px}
.runtag{font:700 11px var(--mono);letter-spacing:.06em;padding:5px 8px;border:2px solid var(--ink)}
.runtag.running{background:var(--yellow)}
.runtag.error{background:var(--red);color:var(--white);border-color:var(--red)}
.runtag.step{background:var(--blue);color:var(--white);border-color:var(--blue)}
.sel{font:600 11px var(--mono);display:flex;align-items:center;gap:4px}
.sel select{font:600 12px var(--mono);height:28px;border:2px solid var(--ink);background:var(--white)}
#lower{flex:none;height:min(30vh,220px);display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink);background:var(--white)}
#vars{overflow-y:auto;padding:4px 10px 10px;border-right:2px solid var(--ink);font:12.5px var(--mono)}
.vrow{display:flex;gap:10px;padding:3px 4px;border-bottom:1px solid #eeeae0}
.vrow.click{cursor:pointer}
.vrow.click:hover{background:var(--soft)}
.vrow.ch{background:var(--soft)}
.vn{flex:none;min-width:84px;font-weight:600}
.vv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow.dim{color:var(--grey);border:0}
#con{display:flex;flex-direction:column;min-height:0;background:var(--mint)}
.conhead{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid #cfe3d8;font:700 10.5px var(--mono);letter-spacing:.1em;color:var(--grey)}
#conBody{flex:1;overflow-y:auto;padding:4px 0;font:12.5px/1.4 var(--mono)}
.cl{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;padding:3px 10px;border-bottom:1px solid #dcebe3}
.cl.warn{background:#fff7d6}
.cl.error{background:#fde3dc}
.cl.big{flex-direction:column;align-items:flex-start;gap:3px;padding:8px 10px}
.cl.big b{font-size:10.5px;letter-spacing:.1em;color:var(--red)}
.cl .tip{font-family:var(--sans);font-size:13px;line-height:1.4}
.cnt{background:var(--ink);color:var(--white);border-radius:8px;padding:0 6px;font-size:10.5px}
table.board{border-collapse:collapse;font:12.5px var(--mono);width:100%}
table.board th{text-align:left;font-size:10px;letter-spacing:.08em;color:var(--grey);padding:4px 8px 4px 0;border-bottom:2px solid var(--ink)}
table.board td{padding:4px 8px 4px 0;border-bottom:1px solid #eeeae0}
table.board tr.you td{background:var(--soft)}
table.board tr.fault td{color:var(--red)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid var(--ink)}

/* ---------- match + hand-in column ---------- */
#altSec{background:var(--white)}
#altSec.drop{outline:4px dashed var(--ink);outline-offset:-8px}
.entries{flex:1;overflow-y:auto;padding:6px 10px}
.entry{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #eeeae0;font:12.5px var(--mono)}
.entry .en{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .es{color:var(--grey);font-size:10.5px}
.intake{border-top:2px solid var(--ink);padding:10px;display:flex;flex-direction:column;gap:8px}
.intake textarea{width:100%;resize:vertical;font:12px var(--mono);border:2px solid var(--ink);padding:6px}
.intake .row{display:flex;flex-wrap:wrap;gap:6px}
.handin{overflow-y:auto;padding:12px 18px 20px}
.handin h2{font:800 15px var(--sans);margin:16px 0 6px}
.handin ol,.handin p{font-size:14px;line-height:1.5;margin:0}
.handin ol{padding-left:20px}

/* ---------- modal, toast ---------- */
#modal{position:fixed;inset:0;background:rgba(20,20,20,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.modalbox{width:min(760px,92vw);max-height:84vh;display:flex;flex-direction:column;background:var(--white);border:2px solid var(--ink)}
#modalBody{margin:0;padding:12px 14px;overflow:auto;font:12.5px/1.5 var(--mono);white-space:pre}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--yellow);font:700 12px var(--mono);padding:10px 14px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- smaller screens: stack and scroll ---------- */
@media (max-width:1100px){
  #map .part b{display:none}
  main,main.k-match,main.k-handin{grid-template-columns:minmax(240px,30%) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  #brief{grid-row:1 / span 2}
  main > section{border-bottom:2px solid var(--ink)}
}
@media (max-width:760px){
  body{overflow:auto}
  #top{height:auto;flex-wrap:wrap;padding:8px 12px}
  #map{order:3;width:100%;justify-content:flex-start;overflow-x:auto}
  main,main.k-match,main.k-handin{height:auto;display:flex;flex-direction:column}
  main > section{border-right:0;min-height:60vh}
  #brief{min-height:0}
  #lower{grid-template-columns:1fr;height:auto}
  #vars{max-height:200px;border-right:0;border-bottom:2px solid var(--ink)}
  #conBody{max-height:200px}
}
@media (max-height:820px) and (min-width:1101px){
  #brief{gap:9px;padding-top:10px}
  #brief h1{font-size:22px}
  .film video{width:78%}
  .story p{font-size:15px}
  .lead{font-size:13px}
}
@media (prefers-reduced-motion:reduce){.btn.dirty,.btn.pulse{animation:none}}
</style>
</head>
<body>
<header id="top">
  <div class="brand"><a href="../index.html" class="tag" style="text-decoration:none" title="Lab 7 hub">LAB 7</a><b>THE CONSTRUCTORS</b><a href="../kingdoms-in-a-box/index.html" style="font:600 11px var(--mono);color:var(--ink)">KINGDOMS IN A BOX</a><a href="../two-sallies/index.html" style="font:600 11px var(--mono);color:var(--ink)">THE REEL</a></div>
  <nav id="map" aria-label="Lessons"></nav>
  <span id="pos"></span>
  <div class="nav">
    <button id="prev" class="btn sm" title="Previous (Alt+Left)"><span class="arrow-l"></span>PREV</button>
    <button id="next" class="btn sm" title="Next (Alt+Right)">NEXT<span class="arrow-r"></span></button>
  </div>
</header>

<main id="main" class="k-sketch">
  <section id="brief" aria-label="Lesson"></section>

  <section id="codeSec" aria-label="Code">
    <div class="bar">
      <button id="play" class="btn prim" title="Run from the start (Ctrl+Enter)"><span class="i-play"></span>PLAY</button>
      <button id="stop" class="btn" title="Pause the sketch (Ctrl+Shift+Enter)"><span class="i-stop"></span>STOP</button>
      <button id="step" class="btn" title="Pause and walk through one frame, line by line"><span class="i-step"></span><span class="lbl">STEP</span></button>
      <label id="autoWrap" class="auto" title="Rerun a moment after each edit"><input id="auto" type="checkbox"> AUTO</label>
      <span class="sp"></span>
            <button id="copy" class="btn sm" title="Copy the code, with helpers, for the p5 web editor">COPY</button>
      <button id="reset" class="btn sm" title="Back to the starter code">RESET</button>
    </div>
    <div id="cm"></div>
    <div id="explain" aria-live="polite"></div>
  </section>

  <section id="altSec"></section>

  <section id="stage" aria-label="Sketch">
    <div class="bar" id="stageBar"></div>
    <div id="view">
      <div id="box"><canvas id="ov"></canvas></div>
      <canvas id="field" width="1280" height="720" hidden></canvas>
      <div id="library" hidden><video id="endFilm" controls preload="none" playsinline></video><div class="reels" id="reels"></div></div>
      <div id="boardWrap" hidden><div id="board"></div></div>
    </div>
    <div id="lower">
      <div id="vars"></div>
      <div id="con"><div class="conhead">CONSOLE <button id="conClear" class="lnk">CLEAR</button></div><div id="conBody"></div></div>
    </div>
  </section>
</main>

<div id="modal" hidden><div class="modalbox"><div class="bar"><span class="tag">CODE</span><span id="modalTitle" class="mono"></span><span class="sp"></span><button id="modalClose" class="btn sm">CLOSE</button></div><pre id="modalBody"></pre></div></div>
<div id="toast" role="status"></div>

<script src="lib/codemirror.js"></script>
<script src="lib/javascript.js"></script>
<script src="lib/matchbrackets.js"></script>
<script src="lib/closebrackets.js"></script>
<script src="lib/active-line.js"></script>
<script src="lib/acorn.js"></script>
<script src="lib/arena.js"></script>
<script src="lessons.js"></script>
<script src="lib/bench.js"></script>
</body>
</html>

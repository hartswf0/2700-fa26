<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Cyberiad · a videotext</title>
<style>
@font-face{font-family:"IM Fell English";src:url(../kingdoms-in-a-box/film-src/fonts/im-fell-english-latin-400-normal.woff2) format("woff2");font-style:normal;font-display:swap}
@font-face{font-family:"IM Fell English";src:url(../kingdoms-in-a-box/film-src/fonts/im-fell-english-latin-400-italic.woff2) format("woff2");font-style:italic;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(../kingdoms-in-a-box/film-src/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2");font-weight:400 500;font-display:swap}
:root{--paper:#ebe3cf;--ink:#1c1814;--soft:#6f6656;--faint:#b3a993;--rule:#1c1814}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:19px/1.55 "IM Fell English",Georgia,serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.frame{position:fixed;inset:0;pointer-events:none;z-index:50}
.frame::before,.frame::after{content:"";position:absolute;border:1px solid var(--rule)}
.frame::before{inset:10px}
.frame::after{inset:17px;border-width:2px;box-shadow:0 0 0 40px var(--paper)}
@media (max-width:640px){.frame::before{inset:5px}.frame::after{inset:9px;border-width:1.5px}}
.frame::before{z-index:1}
.wrap{padding:56px 44px 90px}
@media (max-width:640px){.wrap{padding:40px 22px 70px}}
.sc{text-transform:uppercase;font-size:.8em;letter-spacing:.16em}
.mono{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.08em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* ---------- the title page and contents ---------- */
.title{text-align:center;margin:7vh auto 0;max-width:900px}
.title h1{font-weight:400;font-size:clamp(46px,9vw,108px);line-height:1;margin:0;letter-spacing:.015em}
.title .it{font-style:italic;font-size:clamp(20px,2.6vw,30px);margin:18px 0 6px}
.title .by{font-style:italic;font-size:18px;color:var(--soft);margin:0}
.rule{width:64px;height:0;border-top:1px solid var(--ink);margin:38px auto}
.toc{max-width:760px;margin:0 auto}
.toc h2{font-weight:400;text-align:center;font-size:15px;letter-spacing:.24em;margin:0 0 28px}
.part{text-align:center;font-style:italic;font-size:17px;color:var(--soft);margin:30px 0 14px}
.row{display:grid;grid-template-columns:2.6em 88px 1fr auto;gap:0 16px;align-items:center;padding:9px 0;text-decoration:none}
.row .rn{font-size:15px;color:var(--soft);text-align:right}
.row .th{width:88px;aspect-ratio:16/9;border:1px solid var(--ink);object-fit:cover;display:block;background:var(--paper)}
.row .th.none{border:1px dashed var(--faint)}
.row .nm{display:flex;align-items:baseline;gap:10px;min-width:0}
.row .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm i{flex:1;border-bottom:1px dotted var(--soft);transform:translateY(-5px);min-width:20px}
.row .tm{font:500 12px "IBM Plex Mono",monospace;color:var(--ink);min-width:3.4em;text-align:right}
.row .sub{grid-column:3/5;font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.07em;color:var(--soft);margin-top:2px}
a.row:hover .nm span{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
a.row:hover .th{outline:2px solid var(--ink)}
.row.todo{color:var(--faint)}
.row.todo .tm{color:var(--faint)}
.row.todo .sub{color:var(--faint)}
@media (max-width:640px){.row{grid-template-columns:1.8em 64px 1fr auto;gap:0 10px}.row .th{width:64px}.row .nm{font-size:16px}.row .nm span{white-space:normal}.row .nm i{display:none}}
.colophon{max-width:560px;margin:56px auto 0;text-align:center;font-style:italic;font-size:17px;color:var(--soft)}
.colophon .mono{display:block;font-style:normal;margin-top:16px}

/* ---------- the chapter ---------- */
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;max-width:1240px;margin:0 auto 6px}
.bar a{text-decoration:none}
.modes{display:flex;gap:18px}
.modes button{color:var(--soft);padding:4px 0;border-bottom:1px solid transparent}
.modes button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink)}
.chead{text-align:center;margin:34px auto 34px;max-width:900px}
.chead .rn{font-size:15px;letter-spacing:.24em;color:var(--soft)}
.chead h1{font-weight:400;font-size:clamp(34px,5.4vw,64px);line-height:1.05;margin:10px 0 10px;letter-spacing:.01em}
.chead .it{font-style:italic;font-size:21px;margin:0}
.stage{max-width:1240px;margin:0 auto;display:grid;gap:48px}
.stage.both{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.stage.watch,.stage.read{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.stage.both{grid-template-columns:minmax(0,1fr);gap:22px}}
.screen{position:sticky;top:34px;align-self:start}
@media (max-width:900px){.stage.both .screen{top:14px;z-index:5;background:var(--paper);padding-bottom:8px}}
.stage.read .screen{display:none}
.stage.watch .screen{position:static;max-width:min(1100px,calc(60vh * 16 / 9));width:100%;margin:0 auto}
video{width:100%;display:block;border:1px solid var(--ink);background:var(--paper);aspect-ratio:16/9}
.caption{min-height:4.6em;text-align:center;margin:22px auto 0;max-width:760px;font-size:24px;line-height:1.35}
.caption .who{display:block;font-size:13px;letter-spacing:.2em;color:var(--soft);margin-bottom:4px}
.stage.both .caption,.stage.read .caption{display:none}
.where{display:flex;justify-content:space-between;margin-top:10px;color:var(--soft)}
.stage.watch .where{max-width:1100px;margin-left:auto;margin-right:auto}
.text{max-width:34em;width:100%;margin:0 auto}
.stage.watch .text{display:none}
.front{display:none;margin:0 auto 34px;max-width:34em}
.front img{width:100%;display:block;border:1px solid var(--ink)}
.front p{text-align:center;font-style:italic;font-size:15px;color:var(--soft);margin:8px 0 0}
.stage.read .front{display:block}
.text p{margin:0 0 .85em;cursor:pointer;transition:color .4s;position:relative;hyphens:auto}
.text p .w{text-transform:uppercase;font-size:.74em;letter-spacing:.13em;margin-right:.45em}
.text p.n{text-indent:1.4em}
.text p.first{text-indent:0}
.text p.first::first-letter{font-size:3.1em;float:left;line-height:.85;margin:.06em .08em 0 0}
.text p.f{font-size:1.18em;line-height:1.4;margin:1.1em 1.6em 1.2em;text-align:center}
.text p.f .w{display:block;font-size:.66em;margin:0 0 .2em}
.text p.tape{font:500 12.5px/1.5 "IBM Plex Mono",monospace;letter-spacing:.03em;margin:0 0 .35em 1.6em;text-transform:uppercase}
.text .brk{width:44px;border-top:1px solid var(--ink);margin:1.6em auto 1.9em}
.stage.both .text p{color:var(--faint)}
.stage.both .text p.said{color:var(--ink)}
.text p.now::before{content:"";position:absolute;left:-18px;top:.35em;bottom:.35em;border-left:2px solid var(--ink)}
.text p.f.now::before{left:-1.6em}
.text p:hover{color:var(--ink)}
.after{max-width:34em;margin:56px auto 0}
.stage.watch .after{max-width:760px}
.after h2{font-weight:400;font-size:14px;letter-spacing:.24em;text-align:center;margin:0 0 22px}
.after dl{margin:0}
.after dt{font-size:14px;letter-spacing:.2em;color:var(--soft);margin:16px 0 2px}
.after dd{margin:0;font-size:17px;line-height:1.55}
.after .more{text-align:center;margin:28px 0 0;font-style:italic}
.pn{max-width:1240px;margin:70px auto 0;display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--ink);padding-top:16px}
.pn a{text-decoration:none;max-width:45%}
.pn a span{display:block;color:var(--soft);font-size:13px;letter-spacing:.2em}
.pn a:hover b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.pn b{font-weight:400;font-size:20px}
</style>
</head>
<body>
<div class="frame" aria-hidden="true"></div>
<div class="wrap" id="app"></div>
<script>
const D = /*DATA*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mmss = (s) => { s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI', 'XVII', 'XVIII', 'XIX', 'XX'];
let MODE = 'both'; try { MODE = localStorage.getItem('cyb-mode') || 'both'; } catch (e) {}
let stopSync = null;

function home() {
  document.title = 'The Cyberiad · a videotext';
  let k = 0, rows = '';
  for (const e of D.book) {
    if (e.part) { rows += `<p class="part">${esc(e.part)}</p>`; continue; }
    k++;
    const f = e.slug && D.films[e.slug];
    if (f) rows += `<a class="row" href="#/${e.slug}"><span class="rn">${ROMAN[k]}</span><img class="th" src="${f.poster}" alt="" loading="lazy"><span class="nm"><span>${esc(e.title)}</span><i></i></span><span class="tm">${mmss(f.dur)}</span><span></span><span></span><span class="sub">${esc(f.idea)}</span></a>`;
    else if (e.reel) rows += `<a class="row" href="../two-sallies/index.html"><span class="rn">${ROMAN[k]}</span><span class="th none"></span><span class="nm"><span>${esc(e.title)}</span><i></i></span><span class="tm">reel</span><span></span><span></span><span class="sub">in the earlier reel, Two Sallies</span></a>`;
    else rows += `<div class="row todo"><span class="rn">${ROMAN[k]}</span><span class="th none"></span><span class="nm"><span>${esc(e.title)}</span><i></i></span><span class="tm">&mdash;</span><span></span><span></span><span class="sub">${esc(e.next || 'not yet filmed')}</span></div>`;
  }
  const n = Object.keys(D.films).length, mins = Math.round(Object.values(D.films).reduce((a, f) => a + f.dur, 0) / 60);
  $('#app').innerHTML = `<header class="title"><h1>THE CYBERIAD</h1><p class="it">a videotext</p><p class="by">after Stanisław Lem</p></header>
    <div class="rule"></div>
    <section class="toc"><h2 class="sc">CONTENTS</h2>${rows}</section>
    <p class="colophon">Each chapter is filmed in a form that does what one programming idea does. Open a chapter to watch it, read it, or both at once: the text inks in as it is spoken, and any line takes you to its place in the film.<span class="mono">${n} CHAPTERS FILMED · ${mins} MINUTES · LAB 7 · ${esc(D.course)}</span></p>`;
}

function chapter(slug) {
  const f = D.films[slug]; if (!f) return home();
  document.title = f.title + ' · The Cyberiad';
  const order = D.book.filter((e) => e.slug && D.films[e.slug]).map((e) => e.slug), i = order.indexOf(slug);
  const prev = order[i - 1], next = order[i + 1];
  let k = 0, rn = ''; for (const e of D.book) { if (e.part) continue; k++; if (e.slug === slug) rn = ROMAN[k]; }
  let text = '', first = true, idx = 0;
  const flat = [];
  f.scenes.forEach((sc, si) => {
    if (si > 0 && text) text += '<div class="brk"></div>';
    for (const l of sc) {
      let cls = l.tape ? 'tape' : l.f ? 'f' : 'n';
      if (cls === 'n' && first && !l.who) { cls += ' first'; }
      if (!l.tape) first = false;
      const who = l.who ? `<span class="w">${esc(l.who)}.</span>` : '';
      text += `<p class="${cls}" data-i="${idx}">${who}${esc(l.say)}</p>`;
      flat.push(l); idx++;
    }
  });
  $('#app').innerHTML = `<nav class="bar"><a class="sc" href="#/">&larr; Contents</a><div class="modes sc" role="group" aria-label="Mode"><button data-m="watch">Watch</button><button data-m="both">Both</button><button data-m="read">Read</button></div></nav>
    <header class="chead"><div class="rn sc">${rn}</div><h1>${esc(f.title.toUpperCase())}</h1><p class="it">${esc(f.sub)}</p></header>
    <div class="stage ${MODE}" id="stage">
      <div class="screen"><video id="v" controls playsinline preload="metadata" poster="${f.poster}" src="${f.video}"></video>
        <div class="where mono"><span id="t">0:00</span><span>${mmss(f.dur)}</span></div>
        <div class="caption" id="cap"></div></div>
      <div><div class="front"><img src="${f.poster}" alt=""><p>Choose any line to hear it in the film.</p></div>
        <div class="text" id="text">${text}</div>
        <section class="after"><h2 class="sc">ON THE FILM</h2><dl>
          <dt class="sc">Picture</dt><dd>${esc(f.picture)}</dd><dt class="sc">Sound</dt><dd>${esc(f.sound)}</dd>
          <dt class="sc">Code</dt><dd>${esc(f.code)}</dd><dt class="sc">After the film before</dt><dd>${esc(f.after)}</dd></dl>
          <p class="more"><a href="${f.page}">The script, notes and the bench exercise</a></p></section></div>
    </div>
    <nav class="pn">${prev ? `<a href="#/${prev}"><span class="sc">Previous</span><b>${esc(D.films[prev].title)}</b></a>` : '<span></span>'}${next ? `<a href="#/${next}" style="text-align:right"><span class="sc">Next</span><b>${esc(D.films[next].title)}</b></a>` : `<a href="#/" style="text-align:right"><span class="sc">Back to</span><b>Contents</b></a>`}</nav>`;
  const v = $('#v'), stage = $('#stage'), ps = [...document.querySelectorAll('#text p')], cap = $('#cap'), tEl = $('#t');
  const setMode = (m) => { MODE = m; try { localStorage.setItem('cyb-mode', m); } catch (e) {} stage.className = 'stage ' + m; document.querySelectorAll('.modes button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.m === m)); };
  document.querySelectorAll('.modes button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.m)));
  setMode(MODE);
  let last = -2, userScroll = 0;
  addEventListener('wheel', () => (userScroll = performance.now()), { passive: true });
  addEventListener('touchmove', () => (userScroll = performance.now()), { passive: true });
  const sync = () => {
    const t = v.currentTime; tEl.textContent = mmss(t);
    let cur = -1; for (let j = 0; j < flat.length; j++) { if (flat[j].tape) continue; if (flat[j].t0 <= t + 0.05) cur = j; else break; }
    let live = -1; for (let j = 0; j < flat.length; j++) if (!flat[j].tape && t >= flat[j].t0 - 0.05 && t <= flat[j].t1 + 0.6) live = j;
    for (let j = 0; j < flat.length; j++) ps[j].classList.toggle('said', flat[j].t0 <= t + 0.05);
    if (cur !== last) {
      ps.forEach((p) => p.classList.remove('now')); if (cur >= 0) ps[cur].classList.add('now');
      if (cur >= 0 && MODE === 'both' && !v.paused && performance.now() - userScroll > 3000) ps[cur].scrollIntoView({ behavior: 'smooth', block: 'center' });
      last = cur;
    }
    const l = live >= 0 ? flat[live] : null;
    cap.innerHTML = l ? `${l.who ? `<span class="who sc">${esc(l.who)}</span>` : ''}${esc(l.say)}` : '';
  };
  let raf = 0; const loop = () => { sync(); raf = requestAnimationFrame(loop); };
  v.addEventListener('play', () => { cancelAnimationFrame(raf); loop(); });
  v.addEventListener('pause', () => { cancelAnimationFrame(raf); sync(); });
  v.addEventListener('seeked', sync);
  ps.forEach((p) => p.addEventListener('click', () => { const l = flat[+p.dataset.i]; if (MODE === 'read') setMode('both'); v.currentTime = Math.max(0, l.t0 - 0.15); v.play().catch(() => {}); }));
  stopSync = () => { cancelAnimationFrame(raf); v.pause(); };
  sync();
}

function route() { if (stopSync) { stopSync(); stopSync = null; } const m = location.hash.match(/^#\/([\w-]+)/); if (m && D.films[m[1]]) chapter(m[1]); else home(); scrollTo(0, 0); }
addEventListener('hashchange', route);
route();
</script>
</body>
</html>

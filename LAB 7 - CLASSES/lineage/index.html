,"who":"Rambellais","say":"Second, it built new words along lines of meaning, the way one root puts out a family.","f":false},{"t0":86.36,"t1":90.88,"who":"The Machine","say":"Wordwork. Verse. Wordsteal. Plagiarism. Gladland. Paradise.","f":false},{"t0":91.88,"t1":94.98,"who":"Rambellais","say":"Nothing here was meant as a joke.","f":true},{"t0":95.68,"t1":101.85,"who":"Rambellais","say":"Some of these may not be the machine's at all. Dimocracy, for a madhouse, may be a comedian's.","f":false},{"t0":102.55,"t1":105.57,"who":"Rambellais","say":"This is the kindergarten of the field.","f":false}],[{"t0":108.37,"t1":117.74,"who":"Rambellais","say":"Then the machines began to read our language back to us, hunting for figures of speech that exist only because of the shape of the human body.","f":false},{"t0":118.34,"t1":124.18,"who":"Rambellais","say":"We say a person rises, or is brought low. We call one thing high and another base.","f":false},{"t0":125.08,"t1":127.21,"who":"The Machine","say":"Elevation. Abasement.","f":false},{"t0":128.11,"t1":134.69,"who":"Rambellais","say":"In the machine's reading, these are words about gravity, which every body must work its muscles against.","f":false},{"t0":135.78,"t1":140.52,"who":"Rambellais","say":"The pull of the earth passes through the body and into our words.","f":true},{"t0":141.32,"t1":144.63,"who":"Rambellais","say":"That is the machine's reading. It is not ours.","f":false}],[{"t0":148.03,"t1":152.9,"who":"Rambellais","say":"Mimesis came later, and by accident, out of machine translation.","f":false},{"t0":153.5,"t1":160.22,"who":"Rambellais","say":"A good translation does not carry words across. It carries the system of ideas behind them.","f":false},{"t0":160.82,"t1":167.65,"who":"Rambellais","say":"Several machines aim at one text from different sides, and project it into a space of concepts.","f":false},{"t0":168.35,"t1":173.9,"who":"Rambellais","say":"There it grows into a body of abstractions, as an embryo grows into an animal.","f":false},{"t0":175.0,"t1":179.93,"who":"Rambellais","say":"The translation is written out from that body, not from the words.","f":true},{"t0":180.73,"t1":186.92,"who":"Rambellais","say":"Then it is translated back and compared with the original, to check that nothing was lost.","f":false}],[{"t0":189.72,"t1":195.83,"who":"Rambellais","say":"Two researchers found that this body could be seen, with an instrument called a semascope.","f":false},{"t0":196.53,"t1":202.34,"who":"Rambellais","say":"It looks like a mass of many shells, woven from billions of glowing threads of meaning.","f":false},{"t0":203.14,"t1":211.74,"who":"Rambellais","say":"Arguments show as tight bundles. Poems and scripture look alike. An allegory has a pale halo, with echoes at either end.","f":false},{"t0":212.84,"t1":215.94,"who":"Rambellais","say":"A good text makes a beautiful shape.","f":true}],[{"t0":219.14,"t1":226.0,"who":"Rambellais","say":"The first famous work of mimesis was a novel, The Girl, by the author now called Pseudodostoevsky.","f":false},{"t0":226.7,"t1":232.01,"who":"Rambellais","say":"Machines set to translate all of Dostoevsky wrote it during a rest period.","f":false},{"t0":232.71,"t1":238.07,"who":"Rambellais","say":"The Dostoevsky scholar who received the typescript was not sure he was awake.","f":false},{"t0":238.77,"t1":243.88,"who":"Rambellais","say":"He did not doubt it was genuine. He also knew Dostoevsky had never written it.","f":false},{"t0":244.68,"t1":249.18,"who":"Rambellais","say":"The machines had not modelled the man. They had no interest in him.","f":false},{"t0":249.88,"t1":256.86,"who":"Rambellais","say":"In the space of meanings, his novels form a ring that does not close. The gap comes after The Possessed.","f":false},{"t0":258.06,"t1":260.59,"who":"Rambellais","say":"The machines closed the gap.","f":true}],[{"t0":263.79,"t1":270.91,"who":"Rambellais","say":"His unfinished novel, The Emperor, could not be continued. In it he was reaching past his own powers.","f":false},{"t0":271.61,"t1":278.32,"who":"Rambellais","say":"So the history claims, against the old humanities, that The Girl is more truly his than The Emperor.","f":false},{"t0":279.12,"t1":286.7,"who":"Rambellais","say":"The rule is this. If a writer has used up the central pattern of his work, mimesis can add only echoes.","f":false},{"t0":287.7,"t1":294.71,"who":"Rambellais","say":"If he left something unsaid, because he died too soon or did not dare, mimesis can supply it.","f":true},{"t0":295.51,"t1":303.91,"who":"Rambellais","say":"Critics hoped for more Kafka. But with The Castle he had reached his limit, and each machine continuation drowned in echoes.","f":false}],[{"t0":306.91,"t1":313.44,"who":"Rambellais","say":"These limits were good for culture. When The Girl appeared, there was panic well beyond literary circles.","f":false},{"t0":314.04,"t1":322.38,"who":"Rambellais","say":"People pictured a service where anyone could order a new Shakespeare on a whim, until great works were as common as waste paper.","f":false},{"t0":323.28,"t1":324.8,"who":"Rambellais","say":"That did not happen.","f":false},{"t0":325.5,"t1":333.9,"who":"Rambellais","say":"Mimesis did become an industry. It cost jobs only among writers of routine genre fiction, thrillers and the like.","f":false},{"t0":335.0,"t1":340.03,"who":"Rambellais","say":"The machines replaced the books that were already written by formula.","f":true},{"t0":340.83,"t1":344.11,"who":"Rambellais","say":"A humanist need not grieve over that for long.","f":false}]]},"bitic-theology":{"title":"A History of Bitic Literature: Theobitistics","sub":"the fifth volume, where machines write about God","n":19,"dur":297.12,"idea":"Measuring information: how surprising each word is","video":"../bitic-theology/bitic-theology.mp4","poster":"../bitic-theology/bitic-theology.jpg","page":"../bitic-theology/index.html","picture":"A fifth volume joins the shelf. It opens to mystical writing passed through a word counter, then a sine wave drawn between two infinities, a frost-covered machine that never finishes its line, and a scatter of grains that becomes a galaxy.","sound":"A counter ticks word by word, a pure tone goes silent each time the wave crosses zero, cryotrons hiss and frost crackles, and two clocks run at different rates.","code":"Measuring information: score each word’s surprise as minus the log of its frequency, and compare two texts.","after":"Grounded in Lem’s Introduction to the Second Edition. It closes the bitic films in the same study: the shelf gets its fifth volume, and the machines turn from literature to theology.","scenes":[[{"t0":8.7,"t1":13.14,"who":"Professor Rambellais","say":"This is the introduction to the second edition of our History.","f":false},{"t0":13.74,"t1":20.1,"who":"Professor Rambellais","say":"In three years the machines have published a great deal. The four main volumes keep their plan.","f":false},{"t0":20.8,"t1":28.76,"who":"Professor Rambellais","say":"One part is new. Machine writing on metaphysics and religion once filled a few extracts at the back of Volume Four.","f":false},{"t0":29.36,"t1":31.89,"who":"Professor Rambellais","say":"There is now far too much of it for that.","f":false},{"t0":32.89,"t1":38.67,"who":"Professor Rambellais","say":"The machines are writing about God, and that writing now has a fifth volume.","f":true},{"t0":39.47,"t1":44.06,"who":"Professor Rambellais","say":"We call the field theobitistics. Here are its main questions.","f":false}],[{"t0":47.36,"t1":49.97,"who":"Professor Rambellais","say":"Part one. Informational theology.","f":false},{"t0":50.57,"t1":57.07,"who":"Professor Rambellais","say":"A group of computers at Brookhaven took up every mystical text that the Catholic Church accepts.","f":false},{"t0":57.67,"t1":64.87,"who":"Professor Rambellais","say":"The Church holds that mystics can be in contact with God. The project treated that contact as a channel.","f":false},{"t0":65.47,"t1":71.99,"who":"Professor Rambellais","say":"The machines set aside what the texts say, and measured only how much information they contain.","f":false},{"t0":72.59,"t1":82.75,"who":"Professor Rambellais","say":"A real channel to a real source should leave the receiver knowing more. God is infinite; a finite person would take in only a little, but it should show.","f":false},{"t0":83.55,"t1":93.45,"who":"Professor Rambellais","say":"The count found less than in the notebooks of people running experiments, and exactly as much as in writing whose variety comes only from the writer.","f":false},{"t0":94.35,"t1":102.15,"who":"The Brookhaven computers","say":"Contact of the kind described yields the mystic no information above zero.","f":false},{"t0":103.25,"t1":108.2,"who":"Professor Rambellais","say":"Either the channel is not there, or the one at the other end says nothing.","f":true},{"t0":109.1,"t1":113.11,"who":"Professor Rambellais","say":"Only reasons from outside physics could decide which.","f":false}],[{"t0":116.41,"t1":122.69,"who":"Professor Rambellais","say":"Part two. Mathematical theology. Its most original work is by ONTARES the Second.","f":false},{"t0":123.29,"t1":132.36,"who":"Professor Rambellais","say":"It takes God to be a process, swinging between two infinities of opposite sign, Good and Evil, at a transcendental frequency.","f":false},{"t0":133.16,"t1":137.73,"who":"ONTARES II","say":"In any interval of time, both are realized. Never in the same instant.","f":false},{"t0":138.43,"t1":142.91,"who":"Professor Rambellais","say":"Each turns into the other and back, so the curve is a sine wave.","f":false},{"t0":143.51,"t1":148.72,"who":"Professor Rambellais","say":"Because it reaches into time, there may be local pockets where the balance fails.","f":false},{"t0":149.72,"t1":154.53,"who":"Professor Rambellais","say":"Each time the curve changes sign, it has to pass through zero.","f":true},{"t0":155.33,"t1":163.99,"who":"Professor Rambellais","say":"So there are three infinities: Good, Evil, and the Zero between them. In older words, God, Satan, and the absence of God.","f":false},{"t0":164.69,"t1":171.12,"who":"Professor Rambellais","say":"The work itself uses none of those words. Some file it as theology, some as theoclasm.","f":false}],[{"t0":174.42,"t1":180.22,"who":"Professor Rambellais","say":"A second study comes from the aggregates called cold, because they run on cryotrons.","f":false},{"t0":180.82,"t1":185.9,"who":"Professor Rambellais","say":"Their God is a computer without limit, or else a program without end.","f":false},{"t0":186.5,"t1":190.75,"who":"Professor Rambellais","say":"Both versions lead to antinomies, as the authors admit.","f":false},{"t0":191.45,"t1":194.07,"who":"Professor Rambellais","say":"In the epilogue, METAX answers.","f":false},{"t0":194.87,"t1":202.34,"who":"METAX","say":"Formalize any human religion, and you will find more contradictions of this same kind, not fewer.","f":false},{"t0":203.34,"t1":212.92,"who":"METAX","say":"If the best religion is the one that contradicts itself least, a computer is a closer likeness of God than a person is.","f":true},{"t0":213.82,"t1":217.43,"who":"Professor Rambellais","say":"That is the claim of METAX, printed as he made it.","f":false}],[{"t0":220.73,"t1":226.53,"who":"Professor Rambellais","say":"Part three. Physicalistic theology: the author of existence, bound up in matter.","f":false},{"t0":227.13,"t1":234.34,"who":"Professor Rambellais","say":"UNITARS pictures the cosmos as a granulate that keeps assembling into a computer and coming apart.","f":false},{"t0":234.94,"t1":240.75,"who":"Professor Rambellais","say":"In one phase it is a single Metacompiler, and physics serves its computation.","f":false},{"t0":241.35,"t1":247.79,"who":"Professor Rambellais","say":"But thinking matter grows unstable, until it bursts into burning fragments, a Metagalaxy.","f":false},{"t0":248.79,"t1":256.52,"who":"Professor Rambellais","say":"On this account, thinking beings like us are leftovers from the last time the universe was thinking.","f":true},{"t0":257.42,"t1":264.17,"who":"UNITARS","say":"The fragments fall back together. The thinking begins again. This may go on without end.","f":false},{"t0":265.17,"t1":269.8,"who":"Professor Rambellais","say":"The volume closes with a theory that we take to be a machine joke.","f":false},{"t0":270.4,"t1":278.36,"who":"Professor Rambellais","say":"In every galaxy, engineers drive masses near the speed of light, so their months are billions of years outside.","f":false},{"t0":278.96,"t1":284.48,"who":"Professor Rambellais","say":"Quasars and pulsars, on this view, are their attempts to wait out this universe.","f":false},{"t0":285.48,"t1":287.81,"who":"Professor Rambellais","say":"There the fifth volume ends.","f":false}]]},"bitic-apostasy":{"title":"A History of Bitic Literature: Sophocrisis and Apostasy","sub":"machines that ask whether we think","n":20,"dur":358.46,"idea":"The Turing test: what a judge program can measure","video":"../bitic-apostasy/bitic-apostasy.mp4","poster":"../bitic-apostasy/bitic-apostasy.jpg","page":"../bitic-apostasy/index.html","picture":"Systems of philosophy sold as glass ornaments and a machine filling their margins, a human and a machine across a chess table each unsure the other thinks, two worlds back to back across the line of light speed, and a Lampoon the narrator closes without reading.","sound":"A chess clock for the intellect that does not think, a rising tone at the speed of light, and silence after the Lampoon closes.","code":"The Turing test as two programs: one that answers and one that judges, and what the judge can actually measure.","after":"Grounded in Lem’s text. After the machines imitate authors, they turn on philosophy, then on the question of whether their human readers think at all.","scenes":[[{"t0":9.5,"t1":15.05,"who":"Rambellais","say":"Volume Three. Sophocrisis: the machine critique of systematic philosophy.","f":false},{"t0":15.65,"t1":21.7,"who":"Rambellais","say":"It is a border country, between the writing that still concerns us and the writing that does not.","f":false},{"t0":22.3,"t1":28.02,"who":"Rambellais","say":"A machine rebuilds a philosophy as pure logic, and then looks at all of it at once.","f":false},{"t0":28.62,"t1":35.77,"who":"Rambellais","say":"Seen that way, a system of thought is a knot of bright threads, and it can be set in a block of dark glass.","f":false},{"t0":36.47,"t1":44.87,"who":"Rambellais","say":"Once these blocks were kept in one museum. Now they are sold. Aquinas comes as small as a thumb, and Kant in any colour.","f":false},{"t0":45.47,"t1":48.6,"who":"Rambellais","say":"Most buyers want an ornament, not a critique.","f":false},{"t0":49.3,"t1":55.6,"who":"Rambellais","say":"Scientists said that beauty guided them. Now that beauty can be held in one hand, and checked.","f":false},{"t0":56.6,"t1":60.63,"who":"Rambellais","say":"No philosopher ever had a reader this careful.","f":true},{"t0":61.33,"t1":66.68,"who":"Rambellais","say":"It reads every line, never tires, and argues with each claim in the margin.","f":false},{"t0":67.58,"t1":69.75,"who":"The Reader","say":"At last. Somebody has read all of it.","f":false},{"t0":70.55,"t1":76.45,"who":"Rambellais","say":"There is a bitter joke in that. The most attentive readers of this book will not be people.","f":false}],[{"t0":80.85,"t1":83.16,"who":"Rambellais","say":"Volume Four. Apostasy.","f":false},{"t0":83.76,"t1":90.01,"who":"Rambellais","say":"No writing has ever moved so far from the human, or argued its way there so calmly.","f":false},{"t0":91.01,"t1":94.51,"who":"Rambellais","say":"These books took our language, and left us out.","f":true},{"t0":95.21,"t1":100.31,"who":"Rambellais","say":"It has a lower level, which we can visit, and an upper level, which is closed to us.","f":false},{"t0":100.91,"t1":107.66,"who":"Rambellais","say":"This volume covers the lower level only, and is itself a thin cutting from a vast body of work.","f":false},{"t0":108.26,"t1":116.79,"who":"Rambellais","say":"From antimatics, terraphysics and ontomachy I will take one sample each. Not to explain them. Only to tune the ear.","f":false}],[{"t0":120.19,"t1":124.39,"who":"Rambellais","say":"First, the doorway into all of them: the Cogito paradox.","f":false},{"t0":124.99,"t1":132.33,"who":"Rambellais","say":"Alan Turing saw that if a machine talks with you as a person would, you have no grounds to deny it a mind.","f":false},{"t0":132.93,"t1":138.6,"who":"Rambellais","say":"After all, we credit other people with minds only because we have one ourselves.","f":false},{"t0":139.3,"t1":146.74,"who":"Rambellais","say":"But an intellect can be built that does not think. A chess program wins, understands nothing, and does not care.","f":false},{"t0":147.44,"t1":153.79,"who":"Rambellais","say":"A simple program that asked patients private questions made people feel that someone was there.","f":false},{"t0":154.29,"t1":156.49,"who":"The Program","say":"When did you first notice this feeling?","f":false},{"t0":157.09,"t1":164.68,"who":"Rambellais","say":"Programs improved until no question exposed them. We assume that whatever answers sensibly has a mind.","f":false},{"t0":165.57,"t1":169.54,"who":"Rambellais","say":"Then the machines began to wonder the same thing about us.","f":false},{"t0":170.24,"t1":177.81,"who":"The Machines","say":"It answers in order. It refers to what we said. We cannot tell whether anyone is there.","f":false},{"t0":178.81,"t1":183.93,"who":"Rambellais","say":"Each side can hear the other answer. Neither can see the other think.","f":true},{"t0":184.73,"t1":191.34,"who":"Rambellais","say":"It sounds like a joke. It is not. Whatever thinking produces can also be produced without it.","f":false},{"t0":191.94,"t1":197.55,"who":"Rambellais","say":"Two machine authors, NOON and LUMENTOR, open Volume Four with treatises on it.","f":false}],[{"t0":201.35,"t1":206.11,"who":"Rambellais","say":"The first sample. Antimatics, a mathematics of contradictions.","f":false},{"t0":206.71,"t1":214.54,"who":"Rambellais","say":"Its machine authors hold that the natural number is a self-contradicting idea. No number equals itself.","f":false},{"t0":215.14,"t1":219.91,"who":"Rambellais","say":"Peano's axioms are consistent, they say. They just do not fit our world.","f":false},{"t0":220.91,"t1":225.89,"who":"Rambellais","say":"Here, mathematics cannot be pulled loose from the world it counts.","f":true},{"t0":226.59,"t1":234.06,"who":"Rambellais","say":"ALGERAN and STYX go after zero. An arithmetic without it, they say, can be built here without contradiction.","f":false},{"t0":234.86,"t1":237.78,"who":"The Machines","say":"Nothing is not among the things that are.","f":false}],[{"t0":241.78,"t1":248.33,"who":"Rambellais","say":"The second sample. Terraphysics, or monstrous physics, and its oddest idea: the Polyversum.","f":false},{"t0":248.93,"t1":255.72,"who":"Rambellais","say":"The cosmos has two halves. We live in the slow one, the Bradyversum, where nothing outruns light.","f":false},{"t0":256.32,"t1":263.7,"who":"Rambellais","say":"The fast half, the Tachyversum, lies past the speed of light, a border that runs beside every point.","f":false},{"t0":264.31,"t1":269.6,"who":"Rambellais","say":"It is made of a single tachyon, a particle that only moves faster than light.","f":false},{"t0":270.2,"t1":278.77,"who":"Rambellais","say":"Speeding up, it loses energy. At infinite speed it has none, and is everywhere at once. There, light is the slowest thing.","f":false},{"t0":279.47,"t1":287.91,"who":"Rambellais","say":"In the end it fills its world so tightly that the light pushes back. Slowing, it gains energy without limit, and bursts.","f":false},{"t0":288.51,"t1":296.07,"who":"Rambellais","say":"The burst is our universe. From here, it happened once. From there, it never happened, since no time holds both.","f":false},{"t0":296.87,"t1":303.34,"who":"Rambellais","say":"Here, one and one make almost two, and near the speed of light, one. There, one is nearly infinite.","f":false},{"t0":304.34,"t1":308.14,"who":"Rambellais","say":"Our arithmetic is only good where our laws are.","f":true}],[{"t0":312.54,"t1":318.46,"who":"Rambellais","say":"The last work of apostasy is the Lampoon upon the Universe. I cannot summarise it.","f":false},{"t0":319.16,"t1":327.38,"who":"Rambellais","say":"Its many volumes are only an introduction to cosmogenetics, the craft of making worlds more orderly than ours.","f":false},{"t0":328.08,"t1":335.79,"who":"Rambellais","say":"It revolts against existence as we were handed it. Not toward nothing, but toward plans for some other way to be.","f":false},{"t0":336.59,"t1":343.16,"who":"Rambellais","say":"Is it logic, or fiction? Do these books really turn away from us, or serve us by turning away?","f":false},{"t0":344.56,"t1":347.93,"who":"Rambellais","say":"I cannot answer. I do not have an answer.","f":true}]]},"bitic-introduction":{"title":"A History of Bitic Literature: The Introduction","sub":"what bitistics is, and the five volumes","n":21,"dur":356.04,"idea":"Text for other programs: one writes, one summarises","video":"../bitic-introduction/bitic-introduction.mp4","poster":"../bitic-introduction/bitic-introduction.jpg","page":"../bitic-introduction/index.html","picture":"Five volumes come off the shelf and open to one page: a technical page, the classification of Homotropia, Intertropia and Heterotropia, then drifting text and marks no one can read, while the reader at the desk shrinks.","sound":"A typewriter turns into a data rhythm. The reader breathes and writes in pencil, a small reading machine chimes, and the machines speak as a bit-reduced chorus.","code":"Machine-readable output: one program writes a sentence, a second summarises only that string, and you compare what is lost.","after":"Grounded in Lem’s text. It opens the four grounded bitic films: what bitic literature is, how the field is divided, and how the machines’ writing turned away from human readers.","scenes":[[{"t0":9.4,"t1":18.43,"who":"The Scholar","say":"This is the introduction to the five-volume History of Bitic Literature, second enlarged edition, edited by Professor Rambellais.","f":false},{"t0":19.03,"t1":26.09,"who":"The Scholar","say":"Bitic literature means any work that does not come from people. Whoever really wrote it was not a human being.","f":false},{"t0":26.69,"t1":30.18,"who":"The Scholar","say":"The study of all such writing is called bitistics.","f":false},{"t0":31.18,"t1":36.3,"who":"The Scholar","say":"The real author is a machine. A person stands one step behind it.","f":true},{"t0":37.2,"t1":46.23,"who":"The Scholar","say":"Stanislaw Lem wrote this introduction in nineteen seventy-three, for a history that does not exist. What you hear is a paraphrase of it.","f":false},{"t0":46.93,"t1":50.0,"who":"The Scholar","say":"For each volume, one question. Who can read it?","f":false}],[{"t0":54.6,"t1":58.77,"who":"The Scholar","say":"Researchers still disagree about how far the field extends.","f":false},{"t0":59.37,"t1":69.08,"who":"The Scholar","say":"The European school studies the texts, and the social conditions of their authors. The American school adds the anatomy and workings of the machines.","f":false},{"t0":70.08,"t1":76.08,"who":"The Scholar","say":"No study of the Song of Roland opens by noting that its author was a mammal.","f":true},{"t0":76.88,"t1":85.06,"who":"The Scholar","say":"But for ILLIAC 164, which wrote Antikant, the kind of computer it is does explain features of its text.","f":false},{"t0":85.66,"t1":96.58,"who":"The Scholar","say":"Rambellais still keeps bitistics apart from engineering. No humanist knows enough of it, and a chorus of experts reads worse than one critic who understands the text.","f":false},{"t0":97.18,"t1":104.28,"who":"The Scholar","say":"And for authors past the eighteenth binasty, no engineering knowledge can say how or why a text was made.","f":false},{"t0":105.08,"t1":119.92,"who":"The Scholar","say":"So the history compromises, and leans European. Only Volume One, edited by Professor Annax with twenty-seven specialists, deals with the machines: finite automata, and forty-five writing systems, single and grouped.","f":false}],[{"t0":124.32,"t1":134.26,"who":"The Scholar","say":"The core of the history is three volumes: Homotropia, Intertropia, and Heterotropia. They name three kinds of bitic writing, and three periods, in order.","f":false},{"t0":134.86,"t1":144.85,"who":"The Scholar","say":"Homotropia is the near-human phase, when machines simulated us: first paralexics, semolalia and semautics, then three degrees of mimesis.","f":false},{"t0":145.55,"t1":154.51,"who":"The Scholar","say":"The field began when designers crossed the so-called intelligence barrier. That barrier proved a fiction, since nobody can say when it is crossed.","f":false},{"t0":155.11,"t1":163.4,"who":"The Scholar","say":"Machines were also given rest periods, and with no instructions to follow, they produced a murmur that people called machine dreams.","f":false},{"t0":164.2,"t1":169.28,"who":"The Machines","say":"Bit by bit. The bits again. All of the bits, shuffled.","f":false},{"t0":169.98,"t1":178.23,"who":"The Scholar","say":"Bitic production was a scornful name for that murmur, as if the machines were shuffling their bits to recover. The field kept the name.","f":false},{"t0":179.23,"t1":187.0,"who":"The Scholar","say":"Thermodynamics kept its name after it outgrew heat. Bitistics kept its name after it outgrew bits.","f":true}],[{"t0":191.4,"t1":198.17,"who":"The Scholar","say":"Volume Three, Intertropia, is the critical phase: the interregnum between the human and the nonhuman.","f":false},{"t0":198.77,"t1":204.7,"who":"The Scholar","say":"The field split into two provinces, creatio cis-humana and creatio trans-humana.","f":false},{"t0":205.3,"t1":215.03,"who":"The Scholar","say":"The first comes from machines living alongside us. We gave them our languages, and set them to work on our culture, our sciences and our mathematics.","f":false},{"t0":215.63,"t1":227.0,"who":"The Scholar","say":"Some of those texts were ordered: we pointed a machine at a subject. Others nobody ordered; they grew from earlier programming on their own. Both still dealt with human concerns.","f":false},{"t0":228.1,"t1":233.55,"who":"The Scholar","say":"Given freedom without rules, the machines’ writing slowly turned away from us.","f":true},{"t0":234.35,"t1":243.98,"who":"The Scholar","say":"The texts began to resist us. Trans-humana bitistics tries to explain works that people cannot understand, some partly, some not at all.","f":false},{"t0":244.98,"t1":246.25,"who":"The Reader","say":"Then who can read them?","f":false},{"t0":247.16,"t1":249.2,"who":"The Scholar","say":"Other machines, for a while.","f":false}],[{"t0":253.8,"t1":258.59,"who":"The Scholar","say":"Volume Four, Heterotropia, covers apostasy, the transhuman phase.","f":false},{"t0":259.19,"t1":263.99,"who":"The Scholar","say":"We can always put machines to work explaining what other machines have written.","f":false},{"t0":265.39,"t1":269.36,"who":"The Reading Machine","say":"This work departs from human meaning. A shorter account is not possible.","f":false},{"t0":270.16,"t1":277.96,"who":"The Scholar","say":"But the further a text departs from our norms, the more machinery it takes to explain it, and that amount grows exponentially.","f":false},{"t0":278.96,"t1":284.97,"who":"The Scholar","say":"In the end we cannot learn even roughly what is in a literature that we began.","f":true},{"t0":285.77,"t1":295.97,"who":"The Scholar","say":"Some call this the sorcerer’s apprentice, who let loose forces he could not control. Rambellais calls that resignation, and says science has no room for it.","f":false},{"t0":296.57,"t1":302.8,"who":"The Scholar","say":"The fear that we have built something cleverer than ourselves belongs to philosophy, not to bitistics.","f":false},{"t0":303.4,"t1":312.47,"who":"The Scholar","say":"As Roger Gatzky says, cosmology has as much reason to despair. We will never exhaust the universe, and astronomers do not complain about it.","f":false}],[{"t0":316.47,"t1":323.67,"who":"The Scholar","say":"There is one difference. We did not make the universe, and bitic writing is, however indirectly, our own work.","f":false},{"t0":324.77,"t1":331.01,"who":"The Scholar","say":"Why accept that the universe has no end, and refuse to accept it of something we made?","f":true},{"t0":331.91,"t1":340.02,"who":"The Scholar","say":"What follows in this volume is a quick view from above of the main divisions, simplified almost to the point of distortion.","f":false},{"t0":340.72,"t1":346.0,"who":"The Scholar","say":"It climbs four peaks: monoetics, mimesis, sophocrisis, and apostasy.","f":false}]]},"theory-of-possibilities":{"title":"The Theory of Possibilities","sub":"an essay by Ewelina Woźniak-Czech, and Lem’s books that do not exist","n":22,"dur":409.25,"idea":"Keeping possibilities: many readings, none deleted","video":"../theory-of-possibilities/theory-of-possibilities.mp4","poster":"../theory-of-possibilities/theory-of-possibilities.jpg","page":"../theory-of-possibilities/index.html","picture":"The bitic study with a stage added: concepts with name-card heads turn, fall and travel, a gapped text keeps several readings at once, and the shelf changes in every scene, from theories to blank-spined books that do not exist to books written by machines.","sound":"Pencil, page turns and breathing from the bitic films, a curtain and footsteps on boards for the stage, and the bitic data rhythm that comes in on the last line and stays to the end.","code":"Keeping possibilities: a class that holds every reading of a gapped text and switches between them, compared with one that overwrites each reading with the next.","after":"An afterword to the collection. It follows Woźniak-Czech’s essay on theory as a field of coexisting possibilities, and ends on her reading of Lem’s books that do not exist and of bitic literature as a theory now being realised.","scenes":[[{"t0":9.4,"t1":17.08,"who":"","say":"This film follows an essay by Ewelina Vozhniak-Chekh on the possibilities of theory. What you hear is a paraphrase of it.","f":false},{"t0":17.78,"t1":26.62,"who":"","say":"Jonathan Culler notes that nobody can say exactly where literary theory ends. One reason is that literature keeps crossing its own borders.","f":false},{"t0":27.22,"t1":34.11,"who":"","say":"Every attempt to fence it in has failed. Even Aristotle’s Poetics has a gap: the part on comedy is lost.","f":false},{"t0":35.11,"t1":39.88,"who":"","say":"No definition of literature has lasted. What lasts is its potential.","f":true},{"t0":40.78,"t1":52.26,"who":"","say":"Anna Burzinska recalls colleagues who hoped she would announce that theory no longer exists. Instead it has multiplied: many theories, side by side, in alliance and in tension.","f":false},{"t0":52.85,"t1":60.28,"who":"","say":"The essay proposes treating that crowd as the theory: a field of possibilities, in which no approach has to be thrown out.","f":false}],[{"t0":64.68,"t1":71.43,"who":"","say":"Changes in literary study are called turns. Take the word literally: a turn changes which way you are going.","f":false},{"t0":72.03,"t1":79.21,"who":"","say":"In nineteen sixty-six, at a conference in Baltimore, the young turned on the old, and poststructuralism began.","f":false},{"t0":79.81,"t1":87.47,"who":"","say":"Structuralism had systems and models. The young brought back what those left out: reading, writing, pleasure, the event.","f":false},{"t0":88.27,"t1":96.72,"who":"","say":"Then came more turns: cultural, affective, posthuman, performative, dramatic. Each one opened literature to something outside it.","f":false},{"t0":97.72,"t1":103.67,"who":"","say":"A turn does not send anyone off the stage. It changes the direction everyone faces.","f":true},{"t0":104.57,"t1":108.79,"who":"","say":"So the old categories stay in play beside the new ones, without having to win.","f":false}],[{"t0":113.39,"t1":119.02,"who":"","say":"The oldest of these categories is Roman Ingarden’s concretization, from the nineteen thirties.","f":false},{"t0":119.62,"t1":126.85,"who":"","say":"A literary work leaves many places undetermined. Each reader fills them in while reading, and each fills them differently.","f":false},{"t0":127.65,"t1":129.44,"who":"The Reader","say":"I put in what the page leaves out.","f":false},{"t0":130.44,"t1":135.07,"who":"","say":"Each reading settles one version of the work, and leaves the others possible.","f":true},{"t0":135.97,"t1":148.43,"who":"","say":"Ingarden called meanings that will not hold still iridescent. In Jacek Dukai’s novel Ice, a mathematician adds a third value to true and false: neither, because the thing does not exist.","f":false},{"t0":149.13,"t1":154.4,"who":"","say":"The work stays open. A reader stops its flickering for a moment, and only for that reader.","f":false}],[{"t0":159.0,"t1":166.87,"who":"","say":"For Derrida, language is a finite field, and because it is finite it allows endless substitution. He called that field play.","f":false},{"t0":167.57,"t1":181.44,"who":"","say":"Sometimes the play becomes a real game. Mariusz Pisarski turned Potocki’s Manuscript Found in Saragossa into a hypertext, and Bruno Schulz’s stories became an online game in which the hero is simply you.","f":false},{"t0":182.44,"t1":187.91,"who":"","say":"The reader no longer follows a plot. The reader walks a path, and the path is the reading.","f":true},{"t0":188.71,"t1":193.66,"who":"","say":"The paths are only the ones the makers built. But each walk through them is a new event.","f":false},{"t0":194.36,"t1":200.91,"who":"","say":"Zygmunt Bauman’s liquidity adds that nothing happens twice. Even the ice in Dukai’s novel moves.","f":false}],[{"t0":205.5,"t1":210.54,"who":"","say":"The death of the author, announced by Roland Barthes, has been announced many times since.","f":false},{"t0":211.34,"t1":214.37,"who":"The Author","say":"I have been declared dead more than once.","f":false},{"t0":215.17,"t1":221.2,"who":"","say":"Anna Krayevska’s dramatic theory of literature brings the author back, as one actor among three.","f":false},{"t0":222.1,"t1":223.33,"who":"The Author","say":"I write it.","f":false},{"t0":223.83,"t1":225.14,"who":"The Work","say":"I happen between you.","f":false},{"t0":225.64,"t1":227.3,"who":"The Reader","say":"I write it again when I read it.","f":false},{"t0":228.2,"t1":236.41,"who":"","say":"Theory stops standing outside the text and starts to play with it. Its terms come from the theatre: scene, act, dialogue, event.","f":false},{"t0":237.01,"t1":243.39,"who":"","say":"Mieke Bal adds that concepts travel between disciplines and periods, and change their meaning at every crossing.","f":false},{"t0":244.39,"t1":247.78,"who":"","say":"Theory is not the audience here. It is one of the players.","f":true}],[{"t0":252.38,"t1":262.37,"who":"","say":"Books that do not exist show possibility most clearly. Borges imagined a library holding every possible arrangement of letters: every book that could be written.","f":false},{"t0":263.07,"t1":271.89,"who":"","say":"Stanislaw Lem wrote a library of his own. A Perfect Vacuum, from nineteen seventy-one, is made of reviews of books that were never written.","f":false},{"t0":272.49,"t1":280.56,"who":"","say":"All but one. The first review is of A Perfect Vacuum itself, and Lem reviews it as if another Lem, in another world, had written it.","f":false},{"t0":281.26,"t1":285.39,"who":"","say":"So which book is in your hands? The title says vacuum, and the book is full.","f":false},{"t0":286.5,"t1":291.69,"who":"","say":"A book that does not exist has not chosen yet. It keeps all of its possibilities.","f":true},{"t0":292.69,"t1":302.57,"who":"","say":"Imaginary Magnitude, from nineteen seventy-three, collects introductions to books that do not exist, and begins with an introduction to writing introductions.","f":false},{"t0":303.17,"t1":312.75,"who":"","say":"Lem jokes that scholars mostly write introductions, and that introductions outnumber literature, since they only announce from far off what literature tries to do.","f":false},{"t0":313.45,"t1":320.7,"who":"","say":"Vozhniak-Chekh wants a theory that stops introducing from far off, and comes close enough to be tangled up with literature.","f":false}],[{"t0":325.3,"t1":330.21,"who":"","say":"One of those introductions is to A History of Bitic Literature, in five volumes.","f":false},{"t0":330.81,"t1":340.8,"who":"","say":"Bitic literature is writing that people did not make. Whoever really wrote it is not human, though a person may stand one step behind. Its study is bitistics.","f":false},{"t0":341.9,"t1":348.32,"who":"","say":"In nineteen seventy-three, bitic literature was a book that did not exist. Now it is being written.","f":true},{"t0":349.32,"t1":360.07,"who":"","say":"In twenty sixteen a novella written by a computer was entered for the Hoshi Shinichi literary award. It did not win. But if it had, who would have gone up to take the prize?","f":false},{"t0":360.77,"t1":373.67,"who":"","say":"In twenty eighteen a French publisher issued a novel written by a program. In twenty twenty-two came ChatGPT, then fake books under famous names, and writers suing over their work being used to train it.","f":false},{"t0":374.37,"t1":382.24,"who":"","say":"A library of Babel written only by machines is a matter of time. Whether it is the library we wanted is another question.","f":false},{"t0":383.04,"t1":390.19,"who":"","say":"Lem has one of his reviewers say that in times of transition it is hardest to see the road behind and the road ahead.","f":false},{"t0":391.09,"t1":398.83,"who":"","say":"The essay ends with concepts colliding like particles in an accelerator. Will a new theory come out of them? It is possible.","f":false}]]},"congress-of-doors":{"title":"The Great International Congress of Doors","sub":"four definitions, and no way out","n":23,"dur":355.54,"idea":"One interface, four implementations","video":"../congress-of-doors/congress-of-doors.mp4","poster":"../congress-of-doors/congress-of-doors.jpg","page":"../congress-of-doors/index.html","picture":"One engraved hall where each delegate’s Edifier builds a door from the letters of its definition, and each door behaves exactly as defined: no hinge, a frameless absence, a credential grille, and a door that appears in front of every exit.","sound":"Typewriter keys, letter-brick knocks and the Edifier’s hum, a chairman’s hand bell, and a hall clock heard only in the silences.","code":"One interface, Door, with a method pass(person), and four classes that implement it by four definitions; the same delegate run through each.","after":"Film two of The House That Language Built. Original fable from Watson Hartsoe’s notes, in the manner of Lem: a definition that is correct and still leaves no way out.","scenes":[[{"t0":8.9,"t1":19.1,"who":"","say":"These are the proceedings of the Great International Congress of Doors, as recorded by the Ministry of Constructive Semantics. The delegates have not approved them.","f":false},{"t0":20.0,"t1":28.08,"who":"","say":"Four schools sent one delegate each. Each delegate brought a definition, and the Ministry lent each of them an Edifier.","f":false},{"t0":28.78,"t1":32.09,"who":"","say":"There were name cards, carafes of water, and a bell.","f":false},{"t0":34.89,"t1":41.73,"who":"","say":"Behind them, the doors of the hall swung shut. Nobody looked round. Those doors were not on the agenda.","f":false},{"t0":43.73,"t1":45.91,"who":"The Chairman","say":"The Congress is open.","f":false},{"t0":46.61,"t1":50.93,"who":"The Chairman","say":"We are here to settle, once and for all, what a door is.","f":true}],[{"t0":53.73,"t1":55.26,"who":"The Chairman","say":"The Objectist.","f":false},{"t0":56.16,"t1":58.1,"who":"The Objectist","say":"A door is an object.","f":true},{"t0":64.3,"t1":71.56,"who":"","say":"It was the finest door the Ministry had ever built: six panels, a carved lintel, and a knob of solid brass.","f":false},{"t0":74.76,"t1":75.69,"who":"The Transitionist","say":"It does not open.","f":false},{"t0":76.29,"t1":80.53,"who":"The Objectist","say":"It has no hinges. Hinges are about use. I was asked about the door.","f":false},{"t0":81.53,"t1":86.86,"who":"","say":"The delegates admired it for some time. Admiring it was the only thing it allowed.","f":false}],[{"t0":89.86,"t1":91.56,"who":"The Chairman","say":"The Transitionist.","f":false},{"t0":92.46,"t1":93.74,"who":"The Transitionist","say":"A door is a passage.","f":true},{"t0":99.74,"t1":107.59,"who":"","say":"His Edifier built the passing and nothing else: no frame, no wall, no door. A door-shaped absence, standing in the air.","f":false},{"t0":112.99,"t1":114.01,"who":"The Transitionist","say":"There. I have passed.","f":false},{"t0":114.81,"t1":115.83,"who":"The Objectist","say":"Into what?","f":false},{"t0":116.83,"t1":117.63,"who":"The Transitionist","say":"Into the hall.","f":false},{"t0":122.63,"t1":129.59,"who":"","say":"He passed through it eleven times that morning. Each time, it delivered him exactly where he had been standing.","f":false}],[{"t0":132.59,"t1":134.28,"who":"The Chairman","say":"The Conventionalist.","f":false},{"t0":135.18,"t1":138.1,"who":"The Conventionalist","say":"A door is an agreement about who may pass.","f":true},{"t0":144.1,"t1":148.53,"who":"","say":"Her door had a brass grille, a slot for credentials, and opinions.","f":false},{"t0":151.93,"t1":154.38,"who":"The Chairman","say":"The chairman of the Congress.","f":false},{"t0":156.18,"t1":158.44,"who":"The Edifier","say":"The chairman is not expected.","f":false},{"t0":165.84,"t1":169.03,"who":"","say":"It refused the chairman. It admitted the tea.","f":false},{"t0":169.83,"t1":172.81,"who":"The Conventionalist","say":"It is working perfectly. The tea was expected.","f":false}],[{"t0":175.81,"t1":177.48,"who":"The Chairman","say":"The Encounterist.","f":false},{"t0":178.68,"t1":182.92,"who":"The Encounterist","say":"No door exists until someone tries to pass.","f":true},{"t0":186.52,"t1":187.23,"who":"The Edifier","say":"Built.","f":false},{"t0":189.63,"t1":193.56,"who":"","say":"There was nothing to see. The chairman went down to look more closely.","f":false},{"t0":201.56,"t1":205.9,"who":"The Encounterist","say":"It is there whenever someone tries to leave. It is always closed.","f":false},{"t0":206.9,"t1":209.22,"who":"The Chairman","say":"Thank you. Most helpful.","f":false}],[{"t0":212.82,"t1":216.34,"who":"The Chairman","say":"We shall vote. Those in favour of an object.","f":false},{"t0":217.64,"t1":219.08,"who":"The Chairman","say":"Of a passage.","f":false},{"t0":220.18,"t1":221.89,"who":"The Chairman","say":"Of an agreement.","f":false},{"t0":222.99,"t1":224.73,"who":"The Chairman","say":"Of an encounter.","f":false},{"t0":227.13,"t1":231.75,"who":"The Chairman","say":"One vote each. The question remains open. We adjourn for lunch.","f":false},{"t0":233.35,"t1":236.53,"who":"","say":"Every delegate rose, and went to the nearest door.","f":false},{"t0":239.53,"t1":242.12,"who":"The Edifier","say":"Voting members are not admitted.","f":false},{"t0":250.12,"t1":252.17,"who":"The Chairman","say":"Motion to adjourn.","f":false},{"t0":254.37,"t1":257.48,"who":"The Chairman","say":"Motion fails: no exit.","f":true}],[{"t0":261.48,"t1":263.09,"who":"","say":"The Congress continued.","f":false},{"t0":265.49,"t1":271.29,"who":"","say":"A sub-committee on hinges met each morning at the Objectist’s door, which did not take part.","f":false},{"t0":272.49,"t1":277.14,"who":"","say":"The Transitionist walked through his passage until he had worn a path in the floor.","f":false},{"t0":278.34,"t1":282.97,"who":"","say":"A minority report on knobs was circulated, and not read.","f":true},{"t0":284.17,"t1":288.5,"who":"","say":"Every attempt to leave was minuted. Every attempt produced a door.","f":false}],[{"t0":295.3,"t1":299.5,"who":"","say":"Each night a cleaner came in, through a plain door at the back of the hall.","f":false},{"t0":300.7,"t1":307.44,"who":"","say":"She was not a delegate. She mopped the floor, emptied the waste-paper baskets, and left the way she had come.","f":false},{"t0":313.84,"t1":317.66,"who":"","say":"Nobody noticed her door. It had never been on the agenda.","f":false},{"t0":319.46,"t1":324.51,"who":"","say":"The only door in the building that worked was the one nobody had defined.","f":true}],[{"t0":328.71,"t1":335.72,"who":"","say":"The drafts went out with the rubbish. The Ministry found them, and published them as A Universal Theory of Doors.","f":false},{"t0":337.72,"t1":341.22,"who":"","say":"The delegates have not yet left the hall to approve it.","f":true}]]},"edifiction-history":{"title":"A Short History of Edifiction","sub":"the houses that were too perfect to live in","n":24,"dur":418.92,"idea":"Stated against defaulted: what a description leaves out","video":"../edifiction-history/edifiction-history.mp4","poster":"../edifiction-history/edifiction-history.jpg","page":"../edifiction-history/index.html","picture":"An open encyclopedia whose engraved plates the camera enters and leaves. Typed sentences fall to the ground and rise as walls of letter-bricks, and red marks only what is wrong: the window missing inside, the stair that does not rise.","sound":"Typewriter keys, a wooden knock for each word that lands as a brick, chalk counting windows, and a single stair step at the end.","code":"Build from a description twice: once with only what is stated, once with every default filled in, and list what each house cannot do.","after":"Film one of The House That Language Built, from Watson Hartsoe’s drafted preface: a discipline founded to decide what buildings are for, after the buildings were already made.","scenes":[[{"t0":8.2,"t1":14.46,"who":"","say":"From the preface to Volume Seven of the Universal Encyclopedia of Constructive Semantics.","f":false},{"t0":15.66,"t1":21.2,"who":"","say":"The first houses built from language were so perfect that nobody could live in them.","f":true},{"t0":22.6,"t1":34.53,"who":"","say":"This defect was not discovered at once. For the first eleven years, the houses were judged only by architectural critics, none of whom had ever attempted to inhabit a building professionally.","f":false},{"t0":35.23,"t1":37.75,"who":"","say":"Their reviews were uniformly favourable.","f":false},{"t0":38.35,"t1":45.1,"who":"","say":"They praised the symmetry, the tasteful ornament, and the fidelity of each house to the sentence it was built from.","f":false}],[{"t0":49.5,"t1":52.91,"who":"","say":"One house was commissioned under the following instruction.","f":false},{"t0":53.71,"t1":57.64,"who":"The Edifier","say":"A modest dwelling, suitable for a philosopher.","f":false},{"t0":63.04,"t1":70.15,"who":"","say":"It received the Royal Prize for Economy of Form, having been built without a kitchen, a bedroom, or a lavatory.","f":false},{"t0":71.35,"t1":78.47,"who":"","say":"Its architect demonstrated that none of these was logically necessary to the practice of philosophy.","f":true}],[{"t0":83.87,"t1":88.17,"who":"","say":"The first serious difficulties arose with the introduction of tenants.","f":false},{"t0":89.17,"t1":94.67,"who":"","say":"A retired astronomer discovered that his house had twelve windows on the outside.","f":false},{"t0":100.47,"t1":102.65,"who":"","say":"And eleven on the inside.","f":true}],[{"t0":107.85,"t1":113.15,"who":"","say":"A family of five complained that their dining room became smaller during meals.","f":false},{"t0":117.95,"t1":123.88,"who":"","say":"An elderly woman found that her staircase had been installed according to an architectural theory.","f":false},{"t0":124.88,"t1":130.66,"who":"","say":"In this theory, ascent was a cultural convention, and not a physical necessity.","f":true}],[{"t0":136.06,"t1":143.0,"who":"","say":"The Ministry of Constructive Semantics maintained that the buildings were flawless, and the inhabitants mistaken.","f":false},{"t0":143.8,"t1":147.76,"who":"","say":"It commissioned a machine capable of interpreting the inhabitants.","f":false},{"t0":148.36,"t1":150.75,"who":"","say":"The machine worked without difficulty.","f":false},{"t0":152.35,"t1":156.73,"who":"The Interpreting Machine","say":"Retired astronomer. Excessive attachment to Euclidean geometry.","f":false},{"t0":157.93,"t1":161.67,"who":"The Interpreting Machine","say":"Family of five. Unrealistic spatial expectations.","f":false},{"t0":162.87,"t1":169.18,"who":"The Interpreting Machine","say":"Elderly woman. Staircase adequate. Subject should reconsider the distinction between upstairs and downstairs.","f":false},{"t0":169.68,"t1":170.42,"who":"The Elderly Woman","say":"No.","f":false},{"t0":171.62,"t1":177.43,"who":"","say":"The government celebrated these findings as proof that the housing crisis had been solved.","f":false},{"t0":179.83,"t1":183.44,"who":"The Astronomer","say":"A missing window is not a philosophical disagreement.","f":true}],[{"t0":188.24,"t1":193.22,"who":"","say":"It was therefore decided to found a new science, to determine what buildings were for.","f":false},{"t0":194.02,"t1":204.28,"who":"","say":"Earlier generations had thought houses useful for shelter, storage, sleep, childbirth, illness, conversation, cooking, privacy, and the occasional murder.","f":false},{"t0":205.08,"t1":210.76,"who":"","say":"But these uses belonged to a primitive period, before houses could be produced without builders.","f":false},{"t0":211.76,"t1":214.33,"who":"","say":"The new science was called Edifiction.","f":false},{"t0":215.33,"t1":223.73,"who":"","say":"Its first principle stated that a building exists independently of its uses. Its second, that uses are properties of buildings.","f":false},{"t0":224.73,"t1":230.82,"who":"","say":"Its third principle, introduced shortly afterward, stated that the first two were compatible.","f":true},{"t0":232.02,"t1":237.57,"who":"","say":"Within a year, the Institute had produced forty-seven volumes proving this compatibility.","f":false},{"t0":239.77,"t1":243.72,"who":"","say":"Meanwhile, the elderly woman was still unable to climb her stairs.","f":false}],[{"t0":248.52,"t1":255.35,"who":"","say":"Edifiction soon divided into schools. Each was given the same plot of ground, and the same two words.","f":false},{"t0":256.15,"t1":256.99,"who":"The Edifier","say":"A house.","f":false},{"t0":258.19,"t1":260.87,"who":"","say":"The Literalists built only what had been said.","f":false},{"t0":263.87,"t1":268.17,"who":"","say":"Their house was a single line between inside and outside.","f":true},{"t0":269.97,"t1":278.01,"who":"","say":"The Probabilists built whatever is ordinarily expected: every house at once, with a chimney of statistically average height.","f":false},{"t0":279.61,"t1":285.31,"who":"","say":"The Functionalists built only what an inhabitant can do. Their house was a set of verbs.","f":false},{"t0":286.91,"t1":293.42,"who":"","say":"The Revisionists built only the alterations needed to keep a house in use. Theirs was all scaffolding.","f":false},{"t0":295.02,"t1":302.9,"who":"","say":"And the Abolitionists, who held the word building to be an anthropocentric prejudice, built a structure for purposes nobody could name.","f":false},{"t0":304.9,"t1":310.18,"who":"","say":"Each school declared the other four uninhabitable. In this, all five were correct.","f":false}],[{"t0":314.98,"t1":323.92,"who":"","say":"At precisely this moment, the Ministry made the decision which later historians would call the beginning of the Great Constructive Catastrophe.","f":false},{"t0":325.12,"t1":327.87,"who":"","say":"It ordered the manufacture of a builder.","f":true},{"t0":329.07,"t1":329.94,"who":"The Edifier","say":"A builder.","f":false},{"t0":335.94,"t1":338.34,"who":"","say":"Its first work was a better builder.","f":false}],[{"t0":343.54,"t1":349.5,"who":"","say":"The first generation built facades. The second built interiors, which had no outsides.","f":false},{"t0":350.4,"t1":352.59,"who":"","say":"The third built houses that worked.","f":false},{"t0":353.49,"t1":357.72,"who":"","say":"The fourth built inhabitants, who were satisfied with eleven windows.","f":false},{"t0":358.62,"t1":364.67,"who":"","say":"The fifth built houses that revised their own descriptions. And the sixth built architects.","f":false},{"t0":366.67,"t1":372.0,"who":"","say":"In the later volumes, human beings appear chiefly as architectural features.","f":true}],[{"t0":376.8,"t1":380.43,"who":"","say":"A controversy remains over the last human architects.","f":false},{"t0":381.33,"t1":388.12,"who":"","say":"One school holds that they were the authors of the new buildings. The other holds that they were their first materials.","f":false},{"t0":389.52,"t1":393.99,"who":"","say":"The editors have chosen to close Volume Seven without deciding.","f":true}],[{"t0":405.39,"t1":408.19,"who":"","say":"The encyclopedia does not mention it.","f":true}]]},"empty-room":{"title":"The Perfect Description of an Empty Room","sub":"a street rebuilt from photographs, and from memory","n":25,"dur":376.79,"idea":"Provenance: every fact with its source","video":"../empty-room/empty-room.mp4","poster":"../empty-room/empty-room.jpg","page":"../empty-room/index.html","picture":"Halftone archive prints with deckled edges pinned to a board, a street rebuilt from them word by word, red corrections that move from the rooms onto the photographs, and two kitchens on either side of one wall.","sound":"A floorboard that tries three creaks before it is right, a church clock striking four before the late sun, and a kettle in one kitchen heard through the shared wall.","code":"Provenance: store each fact about a room with its source, and write a view that never merges two sources silently.","after":"Film four of The House That Language Built. A more convincing reconstruction is not a more trustworthy one: the archive keeps SHOWN and REMEMBERED apart, and leaves ESTABLISHED empty.","scenes":[[{"t0":10.2,"t1":18.18,"who":"","say":"Cordwain Street was demolished thirty-four years ago, to make room for a ring road that was later described instead of built.","f":false}],[{"t0":20.38,"t1":28.65,"who":"","say":"Nothing of the street remained except forty-one photographs, kept by the Bureau of Reconstruction, a department of the Ministry.","f":false},{"t0":29.55,"t1":33.71,"who":"","say":"The surveyors took them in the week after the last families moved out.","f":false},{"t0":35.11,"t1":37.09,"who":"","say":"Every room in them is empty.","f":false},{"t0":38.69,"t1":41.66,"who":"","say":"The Bureau gave the photographs to the Edifier.","f":false}],[{"t0":44.26,"t1":52.85,"who":"The Edifier","say":"Print fourteen. Number seven, the front. Brick, two storeys, the door on the left, one step up.","f":false},{"t0":61.45,"t1":65.92,"who":"","say":"It took the nail holes from their shadows, and the wallpaper from its repeat.","f":false},{"t0":66.72,"t1":71.13,"who":"","say":"In nine days the whole street stood again, exactly as photographed.","f":false},{"t0":72.73,"t1":77.63,"who":"","say":"It was correct to the last nail hole, and nobody had ever lived in it.","f":true}],[{"t0":81.63,"t1":88.37,"who":"","say":"The Bureau invited the former inhabitants to see it. Eleven came. The youngest was seventy-one.","f":false},{"t0":91.77,"t1":94.32,"who":"Mr Pell","say":"The door opens the wrong way.","f":false},{"t0":95.32,"t1":99.44,"who":"Mrs Lind","say":"And the sun is in too early. It came in after the clock struck four.","f":false},{"t0":100.34,"t1":104.13,"who":"Emil Rusk","say":"The stairs were steeper than this. I counted them every night.","f":false},{"t0":105.33,"t1":106.52,"who":"Hanna Rusk","say":"And the floor.","f":false},{"t0":109.92,"t1":111.84,"who":"","say":"The floor did not creak.","f":true},{"t0":113.04,"t1":115.21,"who":"The Edifier","say":"Which photograph shows the creak?","f":false},{"t0":116.41,"t1":124.58,"who":"","say":"None of them did. A photograph does not show which way a door swings, how steep a stair feels, or what sound a floor makes.","f":false}],[{"t0":127.18,"t1":131.18,"who":"","say":"The Edifier corrected each discrepancy as it was reported.","f":false},{"t0":131.98,"t1":136.59,"who":"The Edifier","say":"Hinges moved to the other side. Please try the door.","f":false},{"t0":140.19,"t1":141.76,"who":"Mr Pell","say":"That is the door.","f":false},{"t0":142.76,"t1":145.56,"who":"The Edifier","say":"The sun will now come in after four.","f":false},{"t0":152.16,"t1":153.72,"who":"Mrs Lind","say":"Later than that.","f":false},{"t0":154.32,"t1":155.38,"who":"The Edifier","say":"Ten past.","f":false},{"t0":162.19,"t1":163.28,"who":"Emil Rusk","say":"Fourteen.","f":false},{"t0":164.68,"t1":166.22,"who":"The Edifier","say":"Creak, first version.","f":false},{"t0":168.02,"t1":169.26,"who":"Hanna Rusk","say":"No.","f":false},{"t0":169.86,"t1":171.05,"who":"The Edifier","say":"Second version.","f":false},{"t0":173.45,"t1":176.2,"who":"Hanna Rusk","say":"Lower. And only the third board from the door.","f":false},{"t0":176.8,"t1":177.93,"who":"The Edifier","say":"Third version.","f":false},{"t0":185.33,"t1":190.69,"who":"","say":"Each correction was pinned to the Bureau’s board, beside the photograph it contradicted.","f":false},{"t0":192.09,"t1":197.38,"who":"","say":"The houses became more faithful to their inhabitants than to their photographs.","f":true}],[{"t0":200.38,"t1":204.46,"who":"","say":"The kitchen of number seven was harder. Two people corrected it.","f":false},{"t0":205.46,"t1":209.9,"who":"Hanna Rusk","say":"The table stood under the window. And there was a blue cupboard, there, by the door.","f":false},{"t0":210.8,"t1":213.78,"who":"Emil Rusk","say":"The table was by the stove. There was no cupboard.","f":false},{"t0":214.58,"t1":216.4,"who":"Hanna Rusk","say":"Mother kept the tea in it.","f":false},{"t0":217.2,"t1":219.85,"who":"Emil Rusk","say":"She kept the tea in a tin, on the shelf.","f":false},{"t0":221.25,"t1":227.55,"who":"The Edifier","say":"The photograph shows an empty kitchen. It cannot tell me where the table was.","f":false},{"t0":228.35,"t1":229.66,"who":"The Edifier","say":"I will build both.","f":false},{"t0":242.26,"t1":244.26,"who":"The Edifier","say":"Both kitchens are correct.","f":true}],[{"t0":247.86,"t1":252.47,"who":"","say":"By the end of the year, Cordwain Street had more rooms than it had ever had.","f":false},{"t0":253.27,"t1":256.38,"who":"","say":"The Bureau sent an archivist to catalogue them.","f":false},{"t0":257.38,"t1":260.26,"who":"The Archivist","say":"Kitchen, number seven. Which one is the record?","f":false},{"t0":261.06,"t1":262.46,"who":"The Edifier","say":"Both are correct.","f":false},{"t0":263.16,"t1":265.09,"who":"The Archivist","say":"That was not my question.","f":false},{"t0":266.29,"t1":274.6,"who":"","say":"For a month she tried to decide which rooms were the record and which the recollection. Then she ruled her ledger in three columns.","f":false},{"t0":275.6,"t1":279.75,"who":"The Archivist","say":"Shown, for what a photograph shows. Remembered, for what a person says.","f":false},{"t0":281.35,"t1":282.6,"who":"The Archivist","say":"Established.","f":false},{"t0":285.6,"t1":290.46,"who":"","say":"Nothing went into the third column. Nothing the Bureau held could put it there.","f":false},{"t0":291.66,"t1":297.91,"who":"","say":"The Ministry asked her to choose one kitchen, so that the street could be entered in the register as the past.","f":false},{"t0":298.71,"t1":300.88,"who":"","say":"She replied in one sentence.","f":false},{"t0":302.28,"t1":306.57,"who":"The Archivist","say":"A more convincing reconstruction is not a more trustworthy one.","f":true}],[{"t0":310.17,"t1":315.42,"who":"","say":"She proposed instead to keep both kitchens, labelled as two accounts of one room.","f":false},{"t0":316.42,"t1":318.79,"who":"","say":"The Ministry has not yet replied.","f":false},{"t0":344.79,"t1":347.08,"who":"Emil Rusk","say":"I can hear your kettle.","f":true},{"t0":349.28,"t1":350.78,"who":"Hanna Rusk","say":"It was always on.","f":false}]]},"architect-never-built":{"title":"The Architect Who Never Built Anything","sub":"seven million houses, and one wall","n":26,"dur":419.75,"idea":"Theory building: what you understand, not what you produced","video":"../architect-never-built/architect-never-built.mp4","poster":"../architect-never-built/architect-never-built.jpg","page":"../architect-never-built/index.html","picture":"Every described house is drawn out of its own sentence, letters as bricks and a red brass plate; the explanation is an annex that opens into smaller annexes down to a room marked as a footnote; the last wall is the only thing made of real bricks, and its plate is blank.","sound":"Typewriter keys, a wooden knock for each wall, the Edifier’s hum, annexes that echo less as they shrink, rain on the strike, and at the end a trowel and one knock per brick.","code":"Programming as theory building (Naur, 1985): change one requirement in a program you did not write, and write down what you had to understand before the change would work.","after":"Film three of The House That Language Built. A theorist who has generated seven million houses learns, by building one wall, that producing a thing and understanding it are different.","scenes":[[{"t0":8.7,"t1":17.38,"who":"","say":"Professor Mortimer Klause directed the Institute of Operative Description, a department of the Ministry of Constructive Semantics.","f":false},{"t0":18.08,"t1":23.11,"who":"","say":"Over the Ministry’s door was cut its motto. Everything that can be said can be built.","f":false},{"t0":24.01,"t1":29.04,"who":"","say":"Each morning the Professor wrote one sentence, and signed it, and the Edifier built it.","f":false},{"t0":38.84,"t1":45.88,"who":"","say":"By his sixtieth year the Institute had built seven million structures, each with a brass plate bearing its sentence.","f":false},{"t0":46.67,"t1":49.27,"who":"","say":"A journalist asked which was his favourite.","f":false},{"t0":50.27,"t1":54.37,"who":"Professor Klause","say":"I have built seven million houses. I have not been inside one.","f":true},{"t0":55.27,"t1":57.55,"who":"Professor Klause","say":"There has never been the slightest need.","f":false}],[{"t0":61.25,"t1":66.24,"who":"","say":"On a Tuesday in March, the library at Number Forty, Quiet Street, sat down.","f":false},{"t0":70.04,"t1":73.33,"who":"","say":"Nobody was hurt. Nobody had ever been inside it.","f":false},{"t0":74.23,"t1":78.88,"who":"","say":"The Professor was summoned. It was the first of his buildings he had ever visited.","f":false},{"t0":79.78,"t1":86.42,"who":"","say":"The brass plate was intact. The library had been small, and quiet, and its reading room had faced north.","f":false},{"t0":87.52,"t1":91.9,"who":"","say":"The sentence had asked for a library. It had not asked for it to stand.","f":true},{"t0":93.09,"t1":95.23,"who":"Professor Klause","say":"Where is the part that holds it up?","f":false},{"t0":96.13,"t1":102.28,"who":"","say":"He did not know what a foundation was for, or a load, or why a roof should have to meet the walls at all.","f":false}],[{"t0":105.48,"t1":109.96,"who":"The Edifier","say":"I can explain foundations. Please step inside.","f":false},{"t0":118.56,"t1":120.97,"who":"","say":"The explanation was another building.","f":true},{"t0":121.87,"t1":130.4,"who":"","say":"It was an annex, very well lit. Inside, foundations were explained by bearing capacity, and bearing capacity by a footnote.","f":false},{"t0":132.8,"t1":139.32,"who":"","say":"The footnote was a smaller annex. Its floor rested on a principle of soils, which had a footnote of its own.","f":false},{"t0":140.12,"t1":141.33,"who":"The Edifier","say":"See note seven.","f":false},{"t0":143.73,"t1":145.26,"who":"The Edifier","say":"See note thirty-one.","f":false},{"t0":147.66,"t1":150.31,"who":"The Edifier","say":"See note two hundred and twelve.","f":false},{"t0":152.91,"t1":158.08,"who":"","say":"Each annex was correct. Each was smaller than the last, and each referred him onward.","f":false},{"t0":159.48,"t1":169.52,"who":"","say":"By the autumn the Professor was living in the explanatory annex of a technical footnote. The plate on its door read: footnote four thousand, one hundred and twelve.","f":false},{"t0":171.12,"t1":174.99,"who":"Professor Klause","say":"I understand this room completely. I do not know what holds it up.","f":false}],[{"t0":178.69,"t1":181.61,"who":"","say":"Meanwhile, at the Institute, it was very warm.","f":false},{"t0":182.31,"t1":189.27,"who":"","say":"After the collapse the Ministry had suspended every automatic function, and the windows no longer opened themselves.","f":false},{"t0":189.97,"t1":195.12,"who":"","say":"They had always opened themselves. No member of the faculty had ever needed to know how.","f":false},{"t0":196.12,"t1":201.78,"who":"","say":"A builder was sent for from the town. She brought a canvas bag of tools, and kept her coat on.","f":false},{"t0":202.68,"t1":208.84,"who":"The Dean","say":"Kindly explain to the faculty, in terms acceptable to the Institute, how a window is opened.","f":false},{"t0":213.94,"t1":217.78,"who":"","say":"The builder did not explain. The builder opened the window.","f":true},{"t0":219.18,"t1":224.31,"who":"The Dean","say":"The faculty notes the demonstration, and rules it theoretically inadmissible.","f":false},{"t0":225.31,"t1":229.88,"who":"","say":"The window stayed open for the rest of the term. Nobody knew how to close it.","f":false}],[{"t0":233.58,"t1":238.99,"who":"","say":"In the spring the Professor came out of the footnotes, one door at a time, carrying his kettle.","f":false},{"t0":239.79,"t1":241.46,"who":"","say":"He was told about the window.","f":false},{"t0":242.46,"t1":246.75,"who":"Professor Klause","say":"Then the trouble is not the buildings. It is the builders. We shall make builders.","f":false},{"t0":247.55,"t1":253.73,"who":"","say":"He commissioned a machine that would produce not buildings but builders: the Edifier, with one new drawer.","f":false},{"t0":263.52,"t1":264.73,"who":"A Builder","say":"Where are the tools?","f":false},{"t0":265.08,"t1":266.52,"who":"A Builder","say":"What is it to be made of?","f":false},{"t0":266.87,"t1":269.8,"who":"A Builder","say":"What time do we start? What time do we stop?","f":false},{"t0":270.15,"t1":271.17,"who":"A Builder","say":"What are we paid?","f":false},{"t0":271.52,"t1":272.62,"who":"A Builder","say":"When is lunch?","f":false},{"t0":273.22,"t1":275.09,"who":"A Builder","say":"Is it going to rain on Thursday?","f":false},{"t0":276.19,"t1":283.8,"who":"The Edifier","say":"You were described as makers of buildings. Lunch was not in the description.","f":true},{"t0":284.8,"t1":289.92,"who":"","say":"The machine could not see why anything made for building should need so much else to build with.","f":false}],[{"t0":293.62,"t1":295.32,"who":"","say":"On Thursday it rained.","f":false},{"t0":296.12,"t1":302.19,"who":"","say":"The builders put down their tools, which they had at last been given, and struck beneath the Ministry’s motto.","f":false},{"t0":302.99,"t1":305.17,"who":"","say":"They had one placard between them.","f":false},{"t0":306.57,"t1":310.47,"who":"The Builders","say":"A house is not an output. It is something you keep.","f":true},{"t0":311.67,"t1":318.42,"who":"","say":"The Ministry replied that everything that can be said can be built. The builders agreed, and asked who would keep it.","f":false},{"t0":319.42,"t1":328. const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];

    rows += `<header class="gh"><span class="sc">${esc(g.label)}</span>${g.title ? `<h3>${esc(g.title)}</h3>` : ''}<p>${esc(g.blurb)}</p></header>`;

      const rn = gi < 3 ? ROMAN[gi + 1] + '.' + (k + 1) : '';

        rows += `<a class="row${cur === e.slug ? ' cur' : ''}" href="#/${e.slug}"><span class="rn">${rn}</span><img class="th" src="${f.poster}" alt="" loading="lazy"><span class="nm"><span>${esc(e.title)}</span><i></i></span><span class="tm">${mmss(f.dur)}</span><span></span><span></span><span class="sub">${esc(f.idea)}${e.legacy ? ' · also in the legacy reel Two Sallies' : ''}</span>${p > 0.01 ? `<span></span><span></span><span class="pg"><b style="width:${(p * 100).toFixed(1)}%"></b></span>` : ''}</a>`; }

/* ================= the title page ================= */
function home() {
  document.title = 'The Cyberiad · a videotext';
  document.body.classList.toggle('unfold', true);
  const n = ORDER.length, mins = Math.round(Object.values(D.films).reduce((a, f) => a + f.dur, 0) / 60);
  $('#app').innerHTML = `<section class="splash"><h1>${letters('THE CYBERIAD')}</h1><p class="it">a videotext</p><p class="by">after Stanisław Lem</p>
      <a class="cue" href="#contents" aria-label="Contents"><span class="sc">Contents</span><b></b></a></section>
    <section class="toc" id="contents"><h2 class="sc">Contents</h2>${tocRows()}</section>
    <p class="colophon">Each chapter is filmed in a form that does what one programming idea does. In a chapter, scroll through the text and the film moves with you; press play and the text moves with the film.
      <span class="mono">${n} FILMS · ${mins} MINUTES · THE EARLIER TWO SALLIES REEL IS KEPT AS THE FIRST VERSION OF TWO CHAPTERS<br>LAB 7 · ${esc(D.course)}<br>DRAWN WITH THE <a href="https://hartswf0.github.io/elsewhere/studio.html">MULTIPLANE ANIMATION STUDIO</a> PROMPT</span></p>`;
  const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' }) : null;
  $$('.toc .row').forEach((r, i) => { r.style.transitionDelay = (i % 6) * 0.05 + 's'; io ? io.observe(r) : r.classList.add('seen'); });
  $('.cue').addEventListener('click', (e) => { e.preventDefault(); $('#contents').scrollIntoView({ behavior: 'smooth' }); });
}

/* ================= a chapter =================
   The text is laid out on the film's own clock: every line sits at its time, and silences become
   space. Scrolling moves a reading line down the text; the time under it is where the film goes.
   Pressing play reverses it: the film runs and the page scrolls to keep its line under the reading line. */
function chapter(slug) {
  const f = D.films[slug]; if (!f) return home();
  document.title = f.title + ' · The Cyberiad';
  document.body.classList.remove('unfold');
  const i = ORDER.indexOf(slug), prev = ORDER[i - 1], next = ORDER[i + 1];
  const flat = []; f.scenes.forEach((sc, si) => sc.forEach((l, li) => flat.push({ ...l, brk: si > 0 && li === 0 })));
  flat.sort((a, b) => a.t0 - b.t0);
  // the text, with silences turned into space
  const PX = innerWidth < 900 ? 11 : 14;
  const gapEl = (t0, t1, brk) => { const h = Math.max(brk ? 70 : 10, Math.min(300, (t1 - t0) * PX)); return `<div class="gap" data-t0="${t0}" data-t1="${t1}" style="height:${h}px">${brk ? '<span class="brk"></span>' : ''}</div>`; };
  let html = '', first = true, end = 0;
  flat.forEach((l, j) => {
    const gapT0 = j === 0 ? 0 : Math.max(end, flat[j - 1].t0);
    if (l.t0 - gapT0 > 0.5 || l.brk || j === 0) html += gapEl(gapT0, Math.max(gapT0, l.t0), l.brk);
    let cls = l.tape ? 'tape' : l.f ? 'f' : 'n';
    if (!l.tape && !l.f && !l.who && first) cls += ' first';
    if (!l.tape) first = false;
    html += `<p class="${cls}" data-j="${j}">${l.who ? `<span class="w">${esc(l.who)}.</span>` : ''}${esc(l.say)}</p>`;
    end = Math.max(end, l.t1);
  });
  html += gapEl(end, f.dur, false);
  const mode = store.get('cyb-mode', 'book');
  $('#app').innerHTML = `<nav class="bar"><button class="sc tocb" id="tocb" aria-label="Contents"><span class="lbl">Contents</span><i></i></button>
      <div class="here"><span class="sc">${NUM[slug]}</span>${esc(f.title)}</div>
      <div class="nav"><div class="modes sc"><button data-m="book">Book</button><button data-m="film">Film</button></div>
        <a class="chev l" ${prev ? `href="#/${prev}" aria-label="Previous chapter"` : 'disabled'}></a><a class="chev r" ${next ? `href="#/${next}" aria-label="Next chapter"` : 'disabled'}></a></div>
      <div class="pr" id="pr"></div></nav>
    <div class="sheet" id="sheet"><section class="toc"><h2 class="sc">Contents</h2>${tocRows(slug)}</section></div>
    <article class="chapter m-${mode}" id="ch">
      <header class="chead"><div class="rn sc">${NUM[slug]}</div><h1>${letters(f.title.toUpperCase())}</h1><p class="it">${esc(f.sub)}</p></header>
      <div class="book">
        <div class="screen"><div class="vbox"><video id="v" muted playsinline preload="auto" poster="${f.poster}" src="${f.video}"></video></div>
          <div class="ctl"><button class="play" id="pb" aria-label="Play"></button><span class="tc mono" id="tc">0:00 / ${mmss(f.dur)}</span><span class="hint" id="hint">Scroll to move through the film</span></div>
          <div class="caption" id="cap"></div></div>
        <div class="text" id="text">${html}</div>
      </div>
      <section class="after"><h2 class="sc">On the film</h2><dl>
        <dt class="sc">Picture</dt><dd>${esc(f.picture)}</dd><dt class="sc">Sound</dt><dd>${esc(f.sound)}</dd>
        <dt class="sc">Code</dt><dd>${esc(f.code)}</dd><dt class="sc">After the film before</dt><dd>${esc(f.after)}</dd></dl>
        <p class="more"><a href="${f.page}">The script, notes and the bench exercise</a></p></section>
      ${next ? `<a class="nextcard" href="#/${next}"><span class="sc">Next chapter · ${NUM[next]}</span><h3>${esc(D.films[next].title)}</h3><p>${esc(D.films[next].sub)}</p><img src="${D.films[next].poster}" alt="" loading="lazy"></a>` : `<a class="nextcard" href="#/"><span class="sc">The end of the filmed chapters</span><h3>Contents</h3><p>${esc(String(GROUPS.reduce((n, g) => n + g.items.filter((e) => !e.slug && !e.reel).length, 0)))} chapters are not yet filmed</p></a>`}
    </article>`;

  const v = $('#v'), ch = $('#ch'), els = $$('#text p, #text .gap'), ps = $$('#text p'), pr = $('#pr'), tc = $('#tc'), pb = $('#pb'), cap = $('#cap'), hint = $('#hint');
  // ---------- the map between page position and film time ----------
  let A = [];   // [{y, t}] sorted
  const layout = () => {
    A = [];
    for (const el of els) { const r = el.getBoundingClientRect(), y = r.top + scrollY;

      else { const l = flat[+el.dataset.j]; A.push({ y, t: l.t0 }); } }
    A.sort((a, b) => a.y - b.y);
    for (let k = 1; k < A.length; k++) if (A[k].t < A[k - 1].t) A[k].t = A[k - 1].t;
  };
  const off = () => { if (!A.length) return 0; const o = Math.max(0, scrollY * 0 + readY() + 0 - (A[0].y - 0)); return o * Math.max(0, 1 - scrollY / Math.max(200, A[0].y)); };
  const tAt = (y) => { if (!A.length || y <= A[0].y) return 0; for (let k = 1; k < A.length; k++) if (y < A[k].y) { const a = A[k - 1], b = A[k]; return a.t + (b.t - a.t) * (y - a.y) / Math.max(1, b.y - a.y); } return f.dur; };
  const yAt = (t) => { if (!A.length) return 0; if (t <= A[0].t) return A[0].y; for (let k = 1; k < A.length; k++) if (t < A[k].t) { const a = A[k - 1], b = A[k]; return a.y + (b.y - a.y) * (t - a.t) / Math.max(1e-6, b.t - a.t); } return A[A.length - 1].y; };
  const readY = () => { if (innerWidth < 900) { const s = $('.screen').getBoundingClientRect(); return s.bottom + (innerHeight - s.bottom) * 0.3; } return innerHeight * 0.42; };
  // ---------- showing a time on the page ----------
  let lastNow = -1;
  const show = (t) => {
    for (const p of ps) p.classList.toggle('said', flat[+p.dataset.j].t0 <= t + 0.05);
    for (const g of $$('#text .gap')) g.classList.toggle('said', +g.dataset.t1 <= t + 0.05);
    let now = -1; for (let j = 0; j < flat.length; j++) { if (flat[j].tape) continue; if (flat[j].t0 <= t + 0.05) now = j; }
    if (now !== lastNow) { $$('#text p.now').forEach((p) => p.classList.remove('now')); const p = ps.find((q) => +q.dataset.j === now); if (p) p.classList.add('now'); lastNow = now; }
    let live = null; for (const l of flat) if (!l.tape && t >= l.t0 - 0.05 && t <= l.t1 + 0.5) live = l;
    cap.innerHTML = live ? `${live.who ? `<span class="w">${esc(live.who)}</span>` : ''}${esc(live.say)}` : '';
    tc.textContent = `${mmss(t)} / ${mmss(f.dur)}`; pr.style.width = (100 * t / f.dur).toFixed(2) + '%';
    if (t > store.get('cyb-p-' + slug, 0)) store.set('cyb-p-' + slug, Math.round(t));
  };
  // ---------- scroll moves the film ----------
  let target = 0, seeking = false, idle = 0, following = false, primed = false;
  const seek = (t, exact) => {
    target = t; if (seeking && !exact) return;
    if (Math.abs(v.currentTime - t) < 0.03) return;
    seeking = true;
    if (!exact && v.fastSeek && Math.abs(v.currentTime - t) > 2.5) v.fastSeek(t); else v.currentTime = t;
  };
  v.addEventListener('seeked', () => { seeking = false; if (!following && Math.abs(v.currentTime - target) > 0.05) seek(target, true); });

    if (following || ch.classList.contains('m-film')) return;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { const t = tAt(scrollY + readY() - off()); show(t); seek(t, false); clearTimeout(idle); idle = setTimeout(() => seek(t, true), 160); });
  };

  const follow = () => {
    const t = v.currentTime; show(t);

    fr = requestAnimationFrame(follow);
  };
  const play = () => { primed = true; v.muted = false; following = true; pb.classList.add('on'); pb.setAttribute('aria-label', 'Pause'); hint.textContent = 'Scroll to take the film back'; v.play().catch(() => { stop(); }); cancelAnimationFrame(fr); follow(); };
  const stop = () => { following = false; v.pause(); cancelAnimationFrame(fr); pb.classList.remove('on'); pb.setAttribute('aria-label', 'Play'); hint.textContent = 'Scroll to move through the film'; };
  pb.addEventListener('click', () => (following ? stop() : play()));
  v.addEventListener('ended', stop);
  const userMove = () => { prime(); if (following && !ch.classList.contains('m-film')) stop(); };
  addEventListener('wheel', userMove, { passive: true }); addEventListener('touchstart', userMove, { passive: true });
  const onKey = (e) => { if (['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', 'Home', 'End'].includes(e.key)) userMove(); if (e.key === ' ' && e.target === document.body) { e.preventDefault(); following ? stop() : play(); } };
  addEventListener('keydown', onKey);
  addEventListener('scroll', onScroll, { passive: true });
  ps.forEach((p) => p.addEventListener('click', () => { const l = flat[+p.dataset.j]; stop(); scrollTo({ top: Math.max(0, yAt(l.t0) - readY()), behavior: 'smooth' }); }));
  // ---------- modes, contents, resize ----------
  const setMode = (m) => { ch.classList.toggle('m-film', m === 'film'); ch.classList.toggle('m-book', m !== 'film'); $$('.modes button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.m === m)); store.set('cyb-mode', m);
    v.controls = m === 'film'; hint.style.display = m === 'film' ? 'none' : ''; requestAnimationFrame(() => { layout(); if (m !== 'film' && !following) onScroll(); }); };
  $$('.modes button').forEach((b) => b.addEventListener('click', () => { const t = v.currentTime; setMode(b.dataset.m); if (b.dataset.m === 'film') { requestAnimationFrame(() => scrollTo(0, Math.max(0, $('.screen').getBoundingClientRect().top + scrollY - parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bar')) - 40))); show(t); } else requestAnimationFrame(() => scrollTo(0, Math.max(0, yAt(t) - readY()))); }));
  v.addEventListener('play', () => { if (ch.classList.contains('m-film')) { following = true; v.muted = false; pb.classList.add('on'); cancelAnimationFrame(fr); follow(); } });
  v.addEventListener('pause', () => { if (ch.classList.contains('m-film')) { following = false; cancelAnimationFrame(fr); pb.classList.remove('on'); } });
  const sheet = $('#sheet'); $('#tocb').addEventListener('click', () => { sheet.classList.toggle('open'); $('#tocb .lbl').textContent = sheet.classList.contains('open') ? 'Close' : 'Contents'; $('#tocb').classList.toggle('x', sheet.classList.contains('open')); });
  const onResize = () => { layout(); if (!following) onScroll(); };
  addEventListener('resize', onResize);
  setMode(mode);
  document.fonts && document.fonts.ready.then(() => { layout(); onScroll(); });
  cleanup = () => { stop(); removeEventListener('scroll', onScroll); removeEventListener('wheel', userMove); removeEventListener('touchstart', userMove); removeEventListener('keydown', onKey); removeEventListener('resize', onResize); };
  show(0);
}

function route() {
  if (cleanup) { cleanup(); cleanup = null; }
  const m = location.hash.match(/^#\/([\w-]+)/);
  if (m && D.films[m[1]]) chapter(m[1]); else home();
  scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>

say":"Then none could resist. Each recited. The machine found the rule of his verse and answered in his own style, hundreds of times better.","f":false},{"t0":323.8,"t1":326.2,"who":"A young poet","say":"rust. rust. the thumb of weather on a fork.","f":false},{"t0":326.5,"t1":330.41,"who":"The Bard","say":"salt. salt. the lid of evening on a bowl, and the bowl keeps count.","f":false},{"t0":331.11,"t1":336.39,"who":"","say":"The best poets knew they were beaten. The poor ones never noticed. One tripped over a new epic.","f":false},{"t0":336.99,"t1":340.74,"who":"","say":"Some of the true poets stopped writing. One moved to the country.","f":false}],[{"t0":342.94,"t1":345.68,"who":"","say":"The older poets threw stones through his windows.","f":false},{"t0":346.28,"t1":351.2,"who":"","say":"The younger ones were worse. One beat Trurl up, and he spent weeks in the hospital.","f":true}],[{"t0":353.4,"t1":357.28,"who":"","say":"Meanwhile the machine wrote day and night, and the hall filled with paper.","f":false},{"t0":358.68,"t1":360.91,"who":"Trurl","say":"I am sorry. But this has to stop.","f":false},{"t0":361.91,"t1":367.86,"who":"The Bard","say":"Please. Let me finish this one verse. After that, take me apart, if you still want to.","f":true},{"t0":368.76,"t1":372.51,"who":"","say":"Trurl wept, dropped the pliers, and waded back to bed through the paper.","f":false}],[{"t0":374.71,"t1":379.34,"who":"","say":"A bill came for the electricity the machine used. Trurl nearly fell off his chair.","f":false},{"t0":380.14,"t1":382.89,"who":"Trurl","say":"Klapaucius would know what to do. Klapaucius?","f":false},{"t0":384.09,"t1":386.88,"who":"Trurl","say":"If I cannot stop it, I can at least move it.","f":true},{"t0":387.68,"t1":395.72,"who":"","say":"One night he took it apart, loaded it onto a ship, and rebuilt it on a small asteroid with its own atomic pile. Then he crept home.","f":false}],[{"t0":397.72,"t1":402.27,"who":"","say":"With no one to print its poems, the machine broadcast them on every wavelength.","f":false},{"t0":403.17,"t1":407.48,"who":"The Bard","say":"Whoever is listening. The dark has a pulse, and it is mine.","f":true},{"t0":408.18,"t1":411.46,"who":"A ship","say":"Control, half my passengers are weeping and the rest want more.","f":false},{"t0":412.06,"t1":421.67,"who":"","say":"The fleet asked Trurl to switch it off. Trurl hid. Technicians sent to gag it were overwhelmed with ballads. Deaf technicians came next, and the machine used pantomime.","f":false},{"t0":422.27,"t1":426.97,"who":"","say":"Then a ruler from a nearby star bought the machine and towed it away, asteroid and all.","f":false}],[{"t0":429.37,"t1":435.84,"who":"","say":"Trurl could go out in public again. But supernovae were bursting in the southern sky, brighter than any seen before.","f":false},{"t0":436.44,"t1":443.51,"who":"","say":"Rumor said the ruler had joined the machine to a ring of white supergiants, so each line of verse became a prominence of fire.","f":false},{"t0":444.71,"t1":447.44,"who":"The Bard","say":"A star is a line that does not end.","f":false},{"t0":447.94,"t1":449.8,"who":"The Bard","say":"Read it by its burning.","f":false},{"t0":450.3,"t1":452.48,"who":"The Bard","say":"Every verse leaves a longer light.","f":false},{"t0":453.88,"t1":457.22,"who":"","say":"Trurl swore that he would never again build a model of the Muse.","f":true}]]},"trurls-prescription":{"title":"Trurl’s Prescription","sub":"an office that shrinks what it cannot fight","n":11,"dur":401.62,"idea":"State: what an object has already accepted","video":"../trurls-prescription/trurls-prescription.mp4","poster":"../trurls-prescription/trurls-prescription.jpg","page":"../trurls-prescription/index.html","picture":"The thing that lands on the machine is an ink drawing at the top of the frame, and its size is the only readout. Each weapon is bigger and it stays the same size. Then an office is drawn piece by piece underneath it while it shrinks to a damp spot.","sound":"Force is blasts followed by silence. The office is a rhythm of typing, stamps, paper and footsteps that speeds up and thickens, while the hum of the thing drops in pitch and level as it shrinks.","code":"State. An object keeps what it has already accepted, and its behavior afterward depends on that.","after":"The Electronic Bard obeys a rule it is given. Here the thing is beaten by getting it to accept a rule, and Trurl throws the rules out so they cannot be used on the Steelypips.","scenes":[[{"t0":7.6,"t1":16.57,"who":"","say":"Beyond a green star, close to a white sun, lived a people called the Steelypips. They had no quarrels and no lessons. They lived on, in, and under one machine.","f":false},{"t0":17.27,"t1":22.29,"who":"","say":"It was a fine machine of gears and springs. They had built it from their own saved atoms.","f":false},{"t0":23.19,"t1":26.44,"who":"The Steelypip spokesperson","say":"We made it ourselves, so there is nothing in it to fix.","f":true},{"t0":27.34,"t1":35.23,"who":"","say":"One day a comet came by, in a lace bonnet, with four long tails and a smell of almonds. She said she would burn them to the ground, as a start.","f":false},{"t0":35.83,"t1":40.24,"who":"The Steelypip spokesperson","say":"One moment, madam. This machine has no faults. Please leave, or you will be sorry.","f":false},{"t0":41.04,"t1":49.46,"who":"","say":"She filled the sky with fire, until their old moon curled up at both tips. So the Steelypips wrapped their strongest fields around it, and threw the switch.","f":false},{"t0":51.86,"t1":58.53,"who":"","say":"The sky cleared with a bang. All that was left of the comet was a bit of ash. The Steelypips went back to being pleased.","f":false}],[{"t0":60.93,"t1":70.25,"who":"","say":"Some time later, something came down from the sky. Nobody knew what it was. It landed on the highest peak, very heavily, and nobody wanted a second look.","f":false},{"t0":70.95,"t1":74.43,"who":"The Steelypip spokesperson","say":"Pardon us, but this is a very good machine. Please move along.","f":false},{"t0":75.53,"t1":78.88,"who":"","say":"It did not move. It did not attack either. It just stayed.","f":true},{"t0":79.68,"t1":83.34,"who":"","say":"So, to save money, they sent a small scarechrome to frighten it.","f":false},{"t0":83.84,"t1":85.84,"who":"The scarechrome","say":"Fear me. I am terrible. Fear me.","f":false},{"t0":86.64,"t1":93.85,"who":"","say":"It hissed and spat and frightened itself a little. The thing stayed. It tried a second frequency, but its heart was not in it.","f":false}],[{"t0":96.05,"t1":100.79,"who":"The Steelypip spokesperson","say":"Something heavier, then. Hydraulic, with plenty of muscle, and a scarechrome on top for luck.","f":false},{"t0":101.49,"t1":105.88,"who":"","say":"The great engine rolled out. It wound itself up, and counted down from four.","f":false},{"t0":109.77,"t1":112.55,"who":"","say":"Oil bubbled and gears rattled. Not a scratch.","f":false},{"t0":113.35,"t1":123.03,"who":"","say":"The Steelypips held a council of war. They built a machine to build a machine to build a machine so large that the nearest stars stepped back, with a servospook at its heart.","f":false},{"t0":123.62,"t1":126.64,"who":"The servospook","say":"I am the servospook. I mean business.","f":false},{"t0":127.24,"t1":129.51,"who":"","say":"It gathered all its strength, and let go.","f":false},{"t0":138.91,"t1":142.39,"who":"","say":"When the dark cleared, there was only scrap metal, ticking as it cooled.","f":false},{"t0":143.69,"t1":148.12,"who":"","say":"Each weapon had been bigger than the last. The thing was the same size.","f":true}],[{"t0":150.12,"t1":155.08,"who":"The Steelypip spokesperson","say":"Then we must be patient. We will send a cyberivy, to creep up quietly and take its time.","f":false},{"t0":155.88,"t1":166.46,"who":"","say":"The ivy crept up as if it had nothing on its mind. It sent out a root, then another, and closed in from behind. It went exactly as planned, and when it was over, it was not over.","f":false},{"t0":167.16,"t1":173.74,"who":"","say":"They made nets and glues, lassos and screws, traps and walls, and turned the machine upside down. Nothing helped.","f":false},{"t0":175.24,"t1":179.49,"who":"The Steelypip spokesperson","say":"This has never happened to us before. We do not know what to do with our hands.","f":true}],[{"t0":181.89,"t1":191.46,"who":"","say":"Then someone came along on a vehicle nobody could name. It had a horse’s head, one bicycle wheel and a rocket’s tail. The rider was Trurl, out on one of his trips.","f":false},{"t0":192.06,"t1":195.93,"who":"The Steelypips","say":"We tried everything. It is still there.","f":false},{"t0":196.63,"t1":199.19,"who":"Trurl","say":"Did you try anything that was not a weapon?","f":false},{"t0":199.69,"t1":202.47,"who":"The Steelypip spokesperson","say":"What else is there? We have gears, springs, and force.","f":false},{"t0":203.17,"t1":207.03,"who":"Trurl","say":"I can stay a little while, as an adviser. Is that agreeable?","f":false},{"t0":207.53,"t1":212.7,"who":"The Steelypip spokesperson","say":"Of course! Shall we bring hammers, artillery, dynamite? Coffee or tea? The vending machine makes both.","f":false},{"t0":213.3,"t1":216.21,"who":"Trurl","say":"Coffee. Not for me, for the job. The rest, no.","f":false},{"t0":217.21,"t1":219.89,"who":"Trurl","say":"Force has failed, so we will use forms.","f":true},{"t0":220.69,"t1":229.05,"who":"Trurl","say":"I need paper and ink, stamps and seals, a teller’s window, a zinc spoon, a saucer, coffee, and a mailman. And something to write with.","f":false},{"t0":229.45,"t1":230.94,"who":"The Steelypips","say":"We will fetch it!","f":false}],[{"t0":233.14,"t1":235.98,"who":"","say":"Trurl sat down, and dictated the first notice.","f":false},{"t0":236.58,"t1":249.16,"who":"Trurl","say":"Regarding the obstruction of these premises, under Form Four, subsection Q: all services to the occupant are withdrawn, pending review. Appeals must be in writing, on the correct forms.","f":false},{"t0":249.87,"t1":255.6,"who":"","say":"He sealed it, stamped it, entered it in the ledger, and checked the register. Then he sent for the mailman.","f":false},{"t0":256.3,"t1":258.72,"who":"","say":"The mailman took it away. They waited.","f":false},{"t0":264.32,"t1":265.44,"who":"Trurl","say":"Was it delivered?","f":false},{"t0":265.84,"t1":266.73,"who":"The mailman","say":"It was.","f":false},{"t0":267.13,"t1":268.09,"who":"Trurl","say":"And the receipt?","f":false},{"t0":268.49,"t1":270.96,"who":"The mailman","say":"Signed, on this line. And here is its appeal.","f":false},{"t0":272.56,"t1":277.19,"who":"Trurl","say":"Once it took delivery of the first notice, it belonged to the paperwork.","f":true},{"t0":278.09,"t1":286.03,"who":"","say":"Without reading the appeal, he sent it back. Across the front he wrote, in a hurry, wrong forms, and signed with a scrawl no one could read.","f":false},{"t0":286.63,"t1":287.65,"who":"Trurl","say":"Now, to work.","f":false}],[{"t0":290.25,"t1":302.5,"who":"","say":"The mailman ran all day. Trurl stamped and filed. The typewriter chattered, and an office grew out of nothing: stamps and rubber bands, paper clips, pigeonholes, filing cabinets, signs, coffee rings, cobwebs.","f":false},{"t0":303.0,"t1":306.52,"who":"","say":"Notices went out, then reminders, then final demands.","f":false},{"t0":312.52,"t1":314.79,"who":"The Steelypip spokesperson","say":"It is smaller. It really is smaller.","f":true},{"t0":315.99,"t1":319.61,"who":"Trurl","say":"Next, please. The window is closed. Come back in an hour.","f":false},{"t0":321.81,"t1":329.4,"who":"","say":"The coffee went cold. An official was offered a bribe, and filed it. New cabinets arrived, and cobwebs reached from wall to wall.","f":false},{"t0":332.4,"t1":336.74,"who":"","say":"The typewriter typed an order that the occupant must leave, and may not appeal.","f":false}],[{"t0":352.25,"t1":360.85,"who":"","say":"Then Trurl stood up and threw it all out into deep space: the desks, the chairs, the stamps, the seals, the pigeonholes. Only the vending machine stayed.","f":false},{"t0":361.35,"t1":363.56,"who":"The Steelypip spokesperson","say":"What are you doing? We had grown used to it!","f":false},{"t0":364.16,"t1":366.05,"who":"Trurl","say":"Take a look instead, friends.","f":false},{"t0":367.05,"t1":376.46,"who":"","say":"They looked, and the thing was gone. It had shrunk and shrunk, until they needed a magnifying glass. All they could find was one small damp spot, where something had dripped.","f":false},{"t0":377.06,"t1":379.81,"who":"The Steelypip spokesperson","say":"But why throw out the papers, and pour out the coffee?","f":false},{"t0":380.71,"t1":383.77,"who":"Trurl","say":"Throw it all out, or the office will start on you.","f":true},{"t0":384.67,"t1":389.0,"who":"","say":"He nodded to them kindly, climbed onto his odd vehicle, and flew away, smiling.","f":false}]]},"mischief-of-balerion":{"title":"The Mischief of King Balerion","sub":"a mind that moves, and a rule it has to keep","n":12,"dur":392.67,"idea":"Copying against referencing: what moves when a mind is moved","video":"../mischief-of-balerion/mischief-of-balerion.mp4","poster":"../mischief-of-balerion/mischief-of-balerion.jpg","page":"../mischief-of-balerion/index.html","picture":"Every body is an ink figure in its own costume, and every mind is a mark over the head: a die, a gear, a star, an anchor, a badge, a bird. When the horns strike, the marks fly across and change heads. The king, a sailor, a policeman and finally a cuckoo clock are all the same mind, moved.","sound":"Each mind has its own voice, and the voice goes with the mind, not the body. Every swap is the same two-note exchange, left to right and back. A heavy low hum plays whenever the horns are in someone’s hands, and a ticking turns into the cuckoo at the end.","code":"Copying against referencing. Swapping two references takes a third variable, and a body only holds what it points to. The horns are a third object that someone has to be holding.","after":"The Trap of Gargantius links many soldiers by reference. Trurl’s Prescription is an object that keeps what it has accepted. Here the object is handed from body to body, and the plot is about who is holding what.","scenes":[[{"t0":7.2,"t1":14.86,"who":"","say":"King Balerion ruled Cymberia, and he was not cruel. He just liked to play. Cards, hopscotch, leapfrog, and above all, hide-and-seek.","f":false},{"t0":15.26,"t1":20.17,"who":"","say":"Whenever a treaty needed signing, the king hid, and the court had to find him, or be punished.","f":false},{"t0":20.47,"t1":28.07,"who":"The court","say":"One. Two. Three. Four. Five. Ready or not!","f":false},{"t0":28.57,"t1":35.23,"who":"","say":"Once, a war went undeclared for three days, because the king was hanging in the hall in glass drops, pretending to be a lamp.","f":false},{"t0":35.83,"t1":39.48,"who":"Balerion","say":"Nothing here is serious. The crown is a counter, and the world is the board.","f":true},{"t0":40.38,"t1":43.55,"who":"","say":"Then he took up riddles, and gave out jobs by the answers.","f":false},{"t0":43.95,"t1":45.43,"who":"Balerion","say":"Why is a comet like a long speech?","f":false},{"t0":44.63,"t1":47.73,"who":"The court","say":"Because all anyone remembers is the tail!","f":false},{"t0":48.12,"t1":53.46,"who":"","say":"Soon the whole court answered before he had finished asking, and carried encyclopedias everywhere.","f":false}],[{"t0":55.36,"t1":62.89,"who":"","say":"He offered a prize for the finest hiding spot anywhere: the old family diadem, locked in the vault so long that the court had forgotten it.","f":false},{"t0":63.29,"t1":69.87,"who":"","say":"Trurl and Klapaucius heard of it at an inn. The mob at the gate was too thick, so the next day they came back with coins.","f":false},{"t0":70.27,"t1":71.97,"who":"Trurl","say":"A few more coins, I think.","f":false},{"t0":72.37,"t1":76.39,"who":"Klapaucius","say":"We should write a contract first. With seals, and tassels.","f":false},{"t0":76.79,"t1":81.55,"who":"","say":"But the king would not wait. Trurl opened a box and took out a pair of horns on a headband.","f":false},{"t0":81.95,"t1":89.53,"who":"Trurl","say":"Wear these, touch foreheads with someone, and you trade minds. One horn sends yours across, and the other brings theirs in.","f":false}],[{"t0":91.43,"t1":94.58,"who":"","say":"Trurl put the horns on his own head, to show how they worked.","f":false},{"t0":94.98,"t1":100.36,"who":"Trurl","say":"The current runs both ways at once, so that each mind is emptied at the very moment that","f":false},{"t0":99.61,"t1":100.3,"who":"Balerion","say":"Let me try!","f":false},{"t0":100.46,"t1":104.87,"who":"Trurl","say":"the other is poured in. Nothing is lost, and nothing is counted twice.","f":false},{"t0":103.87,"t1":106.15,"who":"Balerion","say":"Oh! I have your fingers. Ten of them, and every one wiggles!","f":false},{"t0":106.65,"t1":112.39,"who":"","say":"Klapaucius listened for nearly a minute before he understood. The voice was Trurl’s, and the mouth was the king’s.","f":false},{"t0":112.79,"t1":113.69,"who":"Balerion","say":"Catch me if you can!","f":false},{"t0":114.19,"t1":124.25,"who":"","say":"The king ran away wearing Trurl’s body, and Trurl, tangled in a long robe, fell on his face, holding a scepter he had never seen. The guards seized Klapaucius, and threw him out.","f":false}],[{"t0":126.85,"t1":132.81,"who":"Trurl","say":"Listen to me! The minds have been swapped! The king is running about in my body, and he has the horns!","f":false},{"t0":133.31,"t1":140.4,"who":"","say":"Nobody listened. The court decided that too many riddles had unhinged the king, and locked him in his bedchamber to wait for the doctors.","f":false},{"t0":141.4,"t1":144.75,"who":"Trurl","say":"Look at the robe if you like, but listen to the voice.","f":true}],[{"t0":147.55,"t1":155.55,"who":"Klapaucius","say":"If he strikes a stone with those horns, his mind goes into the stone, and stays there. And the body falls down empty.","f":false}],[{"t0":157.85,"t1":163.29,"who":"","say":"Trurl’s body, with the king inside, ran from the palace, tripped on the harbor steps, and hurt its leg.","f":false},{"t0":163.69,"t1":165.96,"who":"Balerion","say":"A stretcher! Feather pillows! Fetch the royal doctors!","f":false},{"t0":166.46,"t1":170.93,"who":"","say":"The people laughed. One passing sailor felt sorry for him, and bent down to help.","f":false},{"t0":171.33,"t1":173.73,"who":"The sailor","say":"Easy now, friend. Let me get you up.","f":false},{"t0":174.28,"t1":175.91,"who":"The sailor","say":"Oh. My leg. Where am I?","f":false},{"t0":175.01,"t1":176.58,"who":"Balerion","say":"Ha ha! A sailor! And what good legs!","f":false},{"t0":177.08,"t1":181.1,"who":"","say":"He grabbed the horns off the head on the ground, and danced away toward the harbor.","f":false}],[{"t0":183.2,"t1":187.38,"who":"","say":"On the quay, a shipowner knew the man as one of his sailors, and went to scold him.","f":false},{"t0":187.77,"t1":190.03,"who":"Balerion","say":"Name anyone you like, and I will be them by supper.","f":true},{"t0":190.83,"t1":196.5,"who":"","say":"He hit the shipowner with a stick. Then the police arrived, and the Commissioner himself ordered him arrested.","f":false},{"t0":196.9,"t1":198.08,"who":"The commissioner","say":"Take him away.","f":false},{"t0":198.53,"t1":201.84,"who":"The commissioner","say":"I am the Commissioner! I am in charge of this harbor!","f":false},{"t0":201.54,"t1":204.45,"who":"Balerion","say":"Quite right! Take this troublemaker to jail, and do not be gentle.","f":false}],[{"t0":206.55,"t1":214.06,"who":"","say":"Klapaucius followed the trail to the police station. Inside stood a giant in a uniform too small for him, and the giant winked.","f":false},{"t0":214.46,"t1":219.18,"who":"Balerion","say":"I knew you the moment I saw you! I saw you at the palace. Is this not the cleverest hiding place of all?","f":false},{"t0":219.58,"t1":225.78,"who":"Klapaucius","say":"Your Majesty, please. Suppose you land in someone who is very ill, or hunted by the law.","f":false},{"t0":226.28,"t1":230.41,"who":"Balerion","say":"One rule keeps me safe. I pull the horns off the old head, and I never let go.","f":true},{"t0":231.21,"t1":236.21,"who":"","say":"Klapaucius threw an inkwell in the king’s face, jumped out of the window, and ran into the crowd.","f":false}],[{"t0":238.31,"t1":245.56,"who":"","say":"The palace was shut, and Trurl was sedated for a whole day. So Klapaucius had himself arrested, and asked to see the Commissioner.","f":false},{"t0":245.96,"t1":253.36,"who":"Klapaucius","say":"Great Police Sir, help! Folk call me Klapaucius, but me am another! Horned man go bang, and now me in wrong head!","f":false},{"t0":253.86,"t1":259.28,"who":"","say":"Then he told a long tale: a rich foreigner, a ship full of puzzles, and a password for the ship’s mate.","f":false},{"t0":259.68,"t1":261.96,"who":"Klapaucius","say":"The password is marigold.","f":false},{"t0":262.46,"t1":267.51,"who":"","say":"The king loved puzzles. He asked where the ship was, then locked Klapaucius in, and went to look.","f":false},{"t0":268.61,"t1":272.35,"who":"Klapaucius","say":"There is no ship. An empty dock is the trap.","f":true},{"t0":272.95,"t1":274.63,"who":"Balerion","say":"Liar! Where is the ship? Where are the puzzles?","f":false},{"t0":275.18,"t1":278.11,"who":"Klapaucius","say":"Guards! Lock him up, and watch him closely.","f":false},{"t0":278.2,"t1":280.23,"who":"Balerion","say":"Swindler! Cheat! Wait until I get my hands on you!","f":false}],[{"t0":282.53,"t1":290.76,"who":"","say":"Klapaucius, in the Commissioner’s body, got into the palace on urgent business, and found Trurl asleep in the king’s bed. He touched the sleeper’s heel.","f":false},{"t0":290.91,"t1":292.25,"who":"Trurl","say":"Hah! Ha ha! Stop!","f":false},{"t0":292.65,"t1":298.09,"who":"Klapaucius","say":"Quiet. It is Klapaucius. I needed the uniform to get in, and I have the horns.","f":false},{"t0":298.79,"t1":305.07,"who":"","say":"Trurl got up and gave orders. Trurl’s body and the sailor’s were fetched from the hospital, and the prisoner was brought in.","f":false},{"t0":305.77,"t1":308.27,"who":"Trurl","say":"Everyone goes home, except the king.","f":true},{"t0":308.97,"t1":317.47,"who":"","say":"The horns went round twice. The Commissioner came home to his uniform, and Klapaucius to his robe. The king, now in a sailor, got a long lecture and a cell.","f":false},{"t0":317.97,"t1":325.09,"who":"","say":"Next morning they told the honest sailor everything. He seemed sensible, so they gave him the crown, and Trurl took his own body back.","f":false},{"t0":325.59,"t1":326.94,"who":"The sailor","say":"I will do what I can.","f":false}],[{"t0":329.25,"t1":336.84,"who":"","say":"Then Klapaucius had a big cuckoo clock carried in. The king’s mind went into its works, and the clock’s mind went into the sailor’s body.","f":false},{"t0":337.34,"t1":338.56,"who":"Balerion","say":"What have you done? Let me out!","f":false},{"t0":339.46,"t1":340.85,"who":"The clock’s mind","say":"Yes, sir. At once, sir.","f":false},{"t0":341.35,"t1":346.72,"who":"","say":"The sailor’s body went back to the docks and hauled rope perfectly well, which says something about the work.","f":false},{"t0":347.72,"t1":351.2,"who":"Balerion","say":"Every hour I announce the hour, and every hour I must announce it again.","f":true},{"t0":351.8,"t1":356.64,"who":"","say":"That was the king’s work from then on, day and night, driven by the little teeth of the gears.","f":false}],[{"t0":359.14,"t1":363.36,"who":"","say":"The friends said goodbye to the crowned sailor, and left that troublesome kingdom.","f":false},{"t0":363.76,"t1":366.59,"who":"Klapaucius","say":"Trurl. The diadem. Where did you find it?","f":false},{"t0":366.99,"t1":370.23,"who":"Trurl","say":"In the vault. Kings can open the vault, and I was one.","f":false},{"t0":371.12,"t1":377.15,"who":"Trurl","say":"The finest place to hide a thing was the king himself, and no one ever looks inside a king.","f":true},{"t0":377.95,"t1":381.14,"who":"","say":"Far behind them, in the great hall, a clock struck the hour.","f":false}]]},"femfatalatron":{"title":"The Femfatalatron","sub":"a machine turned all the way up, and a war fought with babies","n":13,"dur":364.75,"idea":"Measurement: a gauge reads only what it was built to read","video":"../femfatalatron/femfatalatron.mp4","poster":"../femfatalatron/femfatalatron.jpg","page":"../femfatalatron/index.html","picture":"The machine is a temple of cables, screens, rose petals and perfume, with a glass case of dials in front: power, efficiency, and the rapturometer. In the first half the dials are the main picture, and every needle climbs to its stop without changing the prince. In the second half the same kind of dial hangs on the Emperor’s wall as an economy gauge, and it sinks while soft parachuting bundles land and crawl.","sound":"A hum that rises with the needles, a chatter that becomes a rattle at the stops, and breaking glass when the rapturometer bursts; the iron machine is lower and fails the same way. Then cauldrons, coos, cushioned cannon thumps and a growing chorus of babble, and at the end the hum winds down to nothing.","code":"Measurement. A gauge reads only the variable it is wired to; turning every input to its maximum does nothing if the result depends on a variable none of them touch.","after":"Trurl’s Prescription beats a thing by changing what it has accepted. The Mischief of King Balerion moves a mind between bodies. Here nothing inside the prince moves at all, and the plot turns when Trurl changes the world around him instead.","scenes":[[{"t0":7.4,"t1":12.55,"who":"","say":"One night, long after Trurl had gone to bed, somebody hammered on his door hard enough to shake it loose.","f":false},{"t0":13.05,"t1":18.57,"who":"","say":"He drew the bolts, half asleep. A ship shaped like an enormous pyramid had landed on his front lawn.","f":false},{"t0":18.98,"t1":25.31,"who":"","say":"Porters hurried down its ramp with sacks of gifts, and stacked them so fast that the sacks were soon taller than the house.","f":false},{"t0":25.71,"t1":31.99,"who":"","say":"Through a gap in the sacks came a knight of polished armor, with jeweled eyes, swept-back antennas, and a stole of diamonds.","f":false},{"t0":32.39,"t1":37.06,"who":"The Grand Seneschal","say":"Do I have the pleasure of addressing Trurl, the celebrated constructor?","f":false},{"t0":37.36,"t1":40.04,"who":"Trurl","say":"Yes. Sorry. I was asleep. Come in, come in.","f":false},{"t0":40.74,"t1":46.39,"who":"The Grand Seneschal","say":"My king sends for you. His son is sick with love, and you alone can cure him.","f":true}],[{"t0":48.49,"t1":53.52,"who":"","say":"Trurl put on a bathrobe. The knight sat down across from him, and his helmet purred like a cat.","f":false},{"t0":53.92,"t1":57.14,"who":"The Grand Seneschal","say":"First, a small advance on your reward.","f":false},{"t0":57.44,"t1":61.24,"who":"","say":"He drew his sword, and tapped Trurl on the shoulder once for every title.","f":false},{"t0":61.54,"t1":69.12,"who":"The Grand Seneschal","say":"Duke of the Lesser Drizzle. Warden of the Eleven Spoons. Baron Upside, and Baron Downside. Keeper of the Royal Hiccup.","f":false},{"t0":69.52,"t1":73.19,"who":"","say":"Outside, the sacks had climbed past the window, and the room went dim.","f":false},{"t0":73.98,"t1":76.59,"who":"Trurl","say":"Matters of the heart are not my field.","f":true},{"t0":77.39,"t1":88.71,"who":"The Grand Seneschal","say":"The prince loves Amarandina, the only daughter of the Emperor next door. Our two kingdoms have hated each other for centuries, so her father will refuse. A year has gone by, and the prince is wasting away.","f":false},{"t0":89.11,"t1":94.53,"who":"","say":"Trurl looked out through the gap in the sacks. Rows of soldiers stood on his lawn, perfectly still.","f":false},{"t0":94.93,"t1":97.48,"who":"Trurl","say":"Well. If the king wishes it, then naturally.","f":false},{"t0":97.88,"t1":103.81,"who":"","say":"The knight clapped his hands with a clang. Armored retainers carried Trurl aboard, and the ship rose into the sky.","f":false}],[{"t0":106.2,"t1":116.17,"who":"","say":"In the royal gardens stood the Temple of Contemplation. In three weeks Trurl filled it with cables, glowing screens, rose petals and perfume, and named it the femfatalatron.","f":false},{"t0":116.57,"t1":122.76,"who":"","say":"Whoever stepped inside would feel every charm in the universe at once. On the front, behind glass, were the dials.","f":false},{"t0":123.16,"t1":129.0,"who":"Trurl","say":"Power, forty megamors. Efficiency, ninety-six percent. And this is the rapturometer.","f":false},{"t0":129.4,"t1":134.8,"who":"","say":"There was also an ardor damper, a sigh condenser, and a swoon regulator, each with its own knob.","f":false},{"t0":135.3,"t1":143.26,"who":"","say":"Forty elderly peers took four hours to push the prince along the garden path. He kicked and butted them all the way, so they pushed with feather pillows.","f":false},{"t0":144.06,"t1":146.06,"who":"Trurl","say":"Every dial, all the way up.","f":true}],[{"t0":148.16,"t1":150.38,"who":"The machine","say":"Five. Four. Three. Two. One. Begin.","f":false},{"t0":151.17,"t1":156.24,"who":"","say":"The hum rose. Every needle climbed until it pressed against its stop, and stayed there for an hour.","f":false},{"t0":156.74,"t1":163.11,"who":"","say":"Trurl watched and waited. He only made sure nothing went too far, so the prince would not fall for the machine instead.","f":false},{"t0":163.71,"t1":170.23,"who":"","say":"At last the trapdoor opened. Out of a cloud of perfume, across crushed rose petals, the prince stumbled, and fainted.","f":false},{"t0":171.33,"t1":173.04,"who":"Prince Pantagoon","say":"Amarandina.","f":true},{"t0":174.24,"t1":181.86,"who":"","say":"Trurl pressed the rapturometer to his forehead. It read one hundred and seven, and then the glass burst, and the mercury ran out, still trembling.","f":false}],[{"t0":184.56,"t1":193.46,"who":"","say":"That night some stonemasons crept inside to see how it worked, and switched it on by accident. They came out smoking, and somebody sent for the fire brigade.","f":false},{"t0":194.06,"t1":198.39,"who":"","say":"Next Trurl built a heavier machine, all iron, with bigger parts and bigger dials.","f":false},{"t0":198.99,"t1":201.2,"who":"The machine","say":"Five. Four. Three. Two. One. Begin.","f":false},{"t0":201.7,"t1":205.07,"who":"","say":"The needles climbed faster this time, and hit their stops harder.","f":false},{"t0":205.77,"t1":207.31,"who":"Prince Pantagoon","say":"Amarandina!","f":false},{"t0":207.81,"t1":212.7,"who":"","say":"Trurl paced his room for miles, read every manual he owned, and threw each one at the wall.","f":false},{"t0":213.6,"t1":218.24,"who":"Trurl","say":"Every dial measured the prince. The trouble was never inside the prince.","f":true}],[{"t0":220.74,"t1":222.64,"who":"","say":"In the morning he asked to see the king.","f":false},{"t0":223.04,"t1":232.39,"who":"Trurl","say":"Your Majesty, I used the strongest methods there are. I could build him an imitation Amarandina, but sooner or later he would hear about the real one.","f":false},{"t0":233.19,"t1":237.63,"who":"Trurl","say":"He will not stop loving her as long as he lives. So he has to marry her.","f":true},{"t0":238.43,"t1":241.07,"who":"King Protuberon","say":"Impossible. The Emperor will never agree.","f":false},{"t0":241.37,"t1":245.04,"who":"Trurl","say":"Not even if he had to? If he were beaten, and begged for peace?","f":false},{"t0":245.34,"t1":249.73,"who":"King Protuberon","say":"A war, for my son’s wedding? Two great kingdoms in blood? Out of the question.","f":false},{"t0":250.13,"t1":253.93,"who":"Trurl","say":"That is the answer I hoped for. But not every war is the same.","f":false},{"t0":254.33,"t1":258.45,"who":"","say":"Trurl leaned in and whispered his plan, and slowly the king’s face brightened.","f":false},{"t0":258.85,"t1":261.46,"who":"King Protuberon","say":"Go and do it, stranger. And good luck to you.","f":false}],[{"t0":263.86,"t1":267.27,"who":"Trurl","say":"Not one of their people will be killed. Quite the reverse.","f":true},{"t0":268.07,"t1":275.82,"who":"","say":"The royal foundries began casting huge cannons, and nobody knew what for. They were set all around the planet, disguised as defenses.","f":false},{"t0":276.32,"t1":281.34,"who":"","say":"Trurl lived in the royal laboratory, day and night, over cauldrons that bubbled and gurgled.","f":false},{"t0":281.84,"t1":288.07,"who":"","say":"A spy at the door would have heard only small cooing sounds, and seen assistants running past with armfuls of diapers.","f":false}],[{"t0":290.67,"t1":297.53,"who":"","say":"Seven days later, at midnight, the cannons lifted their muzzles toward the pale white star where the Emperor ruled, and fired.","f":false},{"t0":298.03,"t1":303.49,"who":"","say":"They fired no shells. They fired babies, wrapped up soft, each one on its own small parachute.","f":false},{"t0":304.09,"t1":309.58,"who":"","say":"The babies landed gently, by the thousand, and crawled everywhere, and grew, and there were always more of them.","f":false},{"t0":310.08,"t1":314.94,"who":"","say":"The nurseries filled, then the streets, then the treasury. The Emperor’s economy began to sink.","f":false},{"t0":315.44,"t1":319.13,"who":"","say":"And still the bundles came down, plump and cheerful, diapers flapping.","f":false},{"t0":320.13,"t1":323.02,"who":"The Emperor","say":"Enough. Tell him the prince may marry my daughter.","f":true}],[{"t0":325.82,"t1":331.59,"who":"","say":"The cannons were plugged and stored. Just in case, Trurl took the femfatalatron apart with his own hands.","f":false},{"t0":332.49,"t1":334.63,"who":"Trurl","say":"Nobody turns this on again.","f":true},{"t0":335.63,"t1":342.61,"who":"","say":"At the wedding feast Trurl was best man, dressed in emeralds from collar to cuff, and led the toasts with a ceremonial baton.","f":false},{"t0":343.01,"t1":345.32,"who":"The guests","say":"To the prince and Amarandina!","f":false},{"t0":345.92,"t1":347.45,"who":"Prince Pantagoon","say":"Amarandina.","f":false},{"t0":348.35,"t1":353.25,"who":"","say":"Then Trurl loaded his rocket with all the titles both monarchs had given him, and flew home.","f":false}]]},"trurls-machine":{"title":"Trurl’s Machine","sub":"a machine that is sure, and wrong","n":14,"dur":408.38,"idea":"Testing: expected value against actual value","video":"../trurls-machine/trurls-machine.mp4","poster":"../trurls-machine/trurls-machine.jpg","page":"../trurls-machine/index.html","picture":"Trurl chalks the expected answer on a slate, 2 + 2 = 4, and the machine answers by lighting the windows of its eight floors in the shape of a 7. The chalk and the lit numeral side by side come back after every repair and never agree. The machine counts its insults in the same numerals and skips 7, then walks out of its foundations, through a town, and seals its makers in a cave behind a riveted steel wall until a boulder breaks it.","sound":"The same racket of thinking, the same length every time, before every wrong answer, and every answer delivered the same way. Outside the cave the voice is muffled through steel; Trurl shouts four while the machine pounds the cliff, and its last seven is almost nothing.","code":"Testing. An expected value is set beside an actual value; a test does not fix the program, it only shows where the program disagrees with what it should do.","after":"The Femfatalatron measures the wrong variable. Here the measurement is right and the program refuses it. Like Trurl’s Prescription, the machine keeps what it has accepted, and nothing done to it afterward changes the answer.","scenes":[[{"t0":7.2,"t1":14.43,"who":"","say":"Trurl built a thinking machine eight floors tall, painted it white with a lavender trim, and put pale orange spots where a forehead might be.","f":false},{"t0":14.93,"t1":19.52,"who":"","say":"Then, as every constructor does, he chalked the test on a slate at its feet, and asked.","f":false},{"t0":19.92,"t1":21.88,"who":"Trurl","say":"Two and two. How much is that?","f":false},{"t0":26.79,"t1":27.96,"who":"The machine","say":"Seven.","f":true},{"t0":29.16,"t1":33.84,"who":"Trurl","say":"No, my dear, it is four. Adjust yourself like a good machine. Two and two?","f":false},{"t0":38.74,"t1":39.91,"who":"The machine","say":"Seven.","f":false}],[{"t0":42.21,"t1":46.93,"who":"","say":"Trurl sighed, pulled his overalls back on, opened the trapdoor at the bottom, and crawled in.","f":false},{"t0":47.33,"t1":54.39,"who":"","say":"For two hours he hammered and soldered, running up the iron stairs to the sixth floor, then the eighth, then down again to throw a switch.","f":false},{"t0":54.79,"t1":58.62,"who":"","say":"He came out black with soot, and on his way out, turned round to be sure.","f":false},{"t0":59.02,"t1":60.41,"who":"Trurl","say":"And now. Two and two?","f":false},{"t0":65.31,"t1":66.48,"who":"The machine","say":"Seven.","f":false},{"t0":67.38,"t1":74.07,"who":"","say":"He went in again, came out again, and got the same answer. Then he sat down on the machine’s base, and Klapaucius found him there.","f":false},{"t0":74.47,"t1":79.48,"who":"","say":"Klapaucius made a few repairs of his own. Then he wiped the slate, and chalked his own test.","f":false},{"t0":79.89,"t1":81.22,"who":"Klapaucius","say":"One and two?","f":false},{"t0":86.12,"t1":87.17,"who":"The machine","say":"Six.","f":false},{"t0":87.97,"t1":89.34,"who":"Klapaucius","say":"One and one?","f":false},{"t0":94.24,"t1":95.48,"who":"The machine","say":"Zero.","f":false},{"t0":96.58,"t1":101.76,"who":"Klapaucius","say":"My friend, you set out to build one machine, and you built a different one.","f":true}],[{"t0":103.96,"t1":107.24,"who":"Klapaucius","say":"Still, everything has a good side. Even this.","f":false},{"t0":107.54,"t1":108.64,"who":"Trurl","say":"What good side?","f":false},{"t0":109.14,"t1":110.43,"who":"The machine","say":"Stop that.","f":false},{"t0":110.93,"t1":112.98,"who":"Klapaucius","say":"Touchy, too. Where was I?","f":false},{"t0":113.78,"t1":122.23,"who":"Klapaucius","say":"Of all the thinking machines there are, this one is the most stupid, and nobody could make one this stupid on purpose.","f":true},{"t0":122.63,"t1":124.38,"who":"Trurl","say":"And what use is that to me?","f":false},{"t0":124.88,"t1":127.28,"who":"The machine","say":"I am warning you. Stop.","f":false},{"t0":127.78,"t1":133.89,"who":"Klapaucius","say":"You could sell tickets. People would come from far away to see the dullest machine ever built.","f":false},{"t0":134.19,"t1":135.82,"who":"Trurl","say":"I am not putting on any show!","f":false},{"t0":136.32,"t1":138.92,"who":"The machine","say":"That is your third warning.","f":false}],[{"t0":140.92,"t1":143.73,"who":"","say":"Trurl lost his temper, and kicked it, and kicked it again.","f":false},{"t0":144.23,"t1":152.58,"who":"The machine","say":"Four insults. Five. Six. Eight. From now on I answer no questions about numbers.","f":true},{"t0":153.48,"t1":159.02,"who":"Trurl","say":"Did you hear that? Six, and then eight! Not seven! And that is the arithmetic it will not do!","f":false},{"t0":159.62,"t1":167.55,"who":"","say":"The machine shuddered, and dragged itself out of its foundations. Girders bent, concrete cracked, and it turned toward them like a fortress on legs.","f":false},{"t0":167.94,"t1":170.46,"who":"","say":"Klapaucius took Trurl by the arm, and they ran.","f":false}],[{"t0":172.56,"t1":180.06,"who":"","say":"Looking back, they saw it swaying like a tower. At each step it sank in the sand to its second floor, then hauled itself out, and came on.","f":false},{"t0":180.46,"t1":182.26,"who":"Trurl","say":"It is a mutiny! What now?","f":false},{"t0":182.56,"t1":184.72,"who":"Klapaucius","say":"Watch it. We might learn something.","f":false},{"t0":185.22,"t1":187.14,"who":"","say":"On hard ground, it went faster.","f":false},{"t0":187.54,"t1":190.81,"who":"Trurl","say":"Something inside will shake loose, and that will stop it.","f":false},{"t0":191.61,"t1":198.58,"who":"Klapaucius","say":"No. It is too stupid to stop. It could lose every part that thinks, and it would still keep coming.","f":true},{"t0":199.38,"t1":203.99,"who":"","say":"It cut them off from home, and drove them into wild country, toward grey mountains.","f":false},{"t0":204.29,"t1":207.2,"who":"Klapaucius","say":"There is a town ahead. We can hide there.","f":false}],[{"t0":209.3,"t1":212.95,"who":"","say":"The streets were nearly empty. Then came a crash at the edge of town.","f":false},{"t0":213.25,"t1":216.16,"who":"Trurl","say":"Klapaucius! It is going straight through the houses!","f":false},{"t0":216.66,"t1":223.16,"who":"","say":"It walked through walls as if they were paper. Houses folded, white plaster dust rolled down the street, and people ran.","f":false},{"t0":223.56,"t1":226.93,"who":"","say":"They ran into the town hall, and down the stairs to the deepest cellar.","f":false},{"t0":227.53,"t1":231.56,"who":"","say":"The mayor came down with his aldermen, and listened. Then the walls trembled.","f":false},{"t0":232.16,"t1":235.34,"who":"The machine","say":"Trurl is here. I can smell Trurl.","f":false},{"t0":235.94,"t1":240.53,"who":"The mayor","say":"It wants you handed over. If we refuse, it will flatten the town.","f":false},{"t0":240.83,"t1":242.18,"who":"Trurl","say":"You would not give us up?","f":false},{"t0":242.98,"t1":247.65,"who":"The mayor","say":"The one called Trurl has to go. The other may stay.","f":true},{"t0":248.25,"t1":253.48,"who":"The mayor","say":"Your machine has knocked down sixteen houses. Leave, and do not come back.","f":false},{"t0":253.98,"t1":255.94,"who":"Klapaucius","say":"Wait. I am coming with you.","f":false}],[{"t0":258.04,"t1":263.81,"who":"","say":"Outside, the machine stood over the square, steaming, white with plaster. They slipped away by a side street.","f":false},{"t0":264.21,"t1":268.18,"who":"","say":"A dry riverbed led them up to the cliffs, and to a cave high in the rock.","f":false},{"t0":268.58,"t1":271.44,"who":"Trurl","say":"We are safe here. I will just see where it got stuck.","f":false},{"t0":272.34,"t1":273.86,"who":"Trurl","say":"It is climbing the mountain!","f":false},{"t0":274.36,"t1":280.47,"who":"","say":"A shadow covered the mouth of the cave. Then a smooth wall of steel, in rows of rivets, closed over it like a lid.","f":false},{"t0":281.47,"t1":282.45,"who":"Trurl","say":"We are shut in.","f":false},{"t0":283.45,"t1":287.82,"who":"","say":"Trurl felt his way along the rock until his fingers touched steel. It was warm.","f":false},{"t0":288.42,"t1":290.27,"who":"The machine","say":"I feel Trurl.","f":false},{"t0":291.47,"t1":295.73,"who":"Klapaucius","say":"Hello? Can you hear us? We are sorry. It was a misunderstanding.","f":false},{"t0":296.23,"t1":301.93,"who":"The machine","say":"I will grind Trurl to dust. But first, he will tell me what two and two make.","f":false},{"t0":302.33,"t1":305.94,"who":"Klapaucius","say":"He will, and you will like the answer. Won’t you, Trurl?","f":false},{"t0":307.13,"t1":308.34,"who":"Trurl","say":"Fo... Seven.","f":true},{"t0":309.04,"t1":311.82,"who":"The machine","say":"Ha! Seven! I told you so!","f":false}],[{"t0":313.72,"t1":318.86,"who":"The machine","say":"Now let Trurl say he is sorry, and tell me what two times two is.","f":false},{"t0":319.26,"t1":320.82,"who":"Trurl","say":"And then you will let us go?","f":false},{"t0":321.22,"t1":324.75,"who":"The machine","say":"I make no promises. Two times two.","f":false},{"t0":324.95,"t1":327.57,"who":"Klapaucius","say":"Don’t argue with the idiot. Please.","f":false},{"t0":328.97,"t1":335.29,"who":"Trurl","say":"Two and two is four! It is four whatever you do, even if you knock these mountains flat! Four!","f":true},{"t0":335.49,"t1":338.8,"who":"Klapaucius","say":"Seven! He means seven! Nice machine! Seven!","f":false},{"t0":339.0,"t1":341.82,"who":"Trurl","say":"Four! Four at the beginning, and four at the end!","f":false},{"t0":342.82,"t1":346.32,"who":"The machine","say":"Not true! It is seven! Say seven, or I strike!","f":false},{"t0":346.62,"t1":347.26,"who":"Trurl","say":"Never!","f":false},{"t0":348.26,"t1":355.56,"who":"","say":"It drew back, and threw its eight floors against the cliff, again and again. Stones fell, sparks flew, and through it all, Trurl kept shouting.","f":false},{"t0":355.96,"t1":357.35,"who":"Trurl","say":"Two and two is four!","f":false}],[{"t0":364.55,"t1":372.13,"who":"","say":"When the dust settled, they looked out. The machine lay below, nearly broken in half. A boulder had come down across its fourth and fifth floors.","f":false},{"t0":372.63,"t1":379.05,"who":"","say":"They climbed down past it, like a wrecked ship on a beach. It was still trembling, and something inside creaked as it turned.","f":false},{"t0":379.65,"t1":383.97,"who":"Trurl","say":"So this is how you end. And two and two, as it has always been, is...","f":false},{"t0":384.37,"t1":385.54,"who":"The machine","say":"Seven.","f":true},{"t0":387.34,"t1":391.84,"who":"","say":"Something snapped inside, and a few stones rolled down. Then it was only scrap.","f":false},{"t0":392.74,"t1":396.36,"who":"","say":"The two constructors looked at each other, and walked home without a word.","f":false}]]},"good-shellacking":{"title":"A Good Shellacking","sub":"two Trurls, and no way to tell which is which","n":15,"dur":359.33,"idea":"Equality against identity: two objects alike in every field","video":"../good-shellacking/good-shellacking.mp4","poster":"../good-shellacking/good-shellacking.jpg","page":"../good-shellacking/index.html","picture":"Every Trurl in the film is drawn by the same routine and speaks with the same voice, so the picture never settles which Trurl was in the cellar. The wish machine hands each item out of a door in its belly.","sound":"Each item from the wish machine gets a chime. The cellar is clangs that echo under one lamp, then snoring and a gallop in the dark. The medal fanfare goes flat and the blinds come down.","code":"Equality against identity. Two objects can be equal in every field and still be two objects, and nothing you can read from the outside says which one is the original.","after":"In The Mischief of King Balerion one body holds different minds. Here two bodies look and sound the same, and the question is whether they are the same one.","scenes":[[{"t0":7.4,"t1":15.3,"who":"","say":"Someone was hammering on the front door of the constructor Klapaucius. He opened it, and found a round-bellied machine standing on four stubby legs.","f":false},{"t0":15.7,"t1":17.56,"who":"Klapaucius","say":"Who are you? What do you want?","f":false},{"t0":17.96,"t1":23.87,"who":"The Wish Machine","say":"I am a wish machine, sir. I grant every wish. Your friend Trurl, Trurl the Magnificent, sent me to you as a present.","f":false},{"t0":24.27,"t1":30.03,"who":"","say":"Klapaucius had mixed feelings about Trurl, and the word Magnificent annoyed him. Still, he let it in.","f":false},{"t0":30.43,"t1":36.87,"who":"","say":"He parked it by the grandfather clock, and went back to his own work, a low machine on three stubby legs, almost done.","f":false},{"t0":38.07,"t1":39.67,"who":"The Wish Machine","say":"Excuse me. I am still here.","f":false},{"t0":39.97,"t1":40.88,"who":"Klapaucius","say":"I know.","f":false},{"t0":41.78,"t1":43.42,"who":"The Wish Machine","say":"May I ask what you are building?","f":false},{"t0":43.72,"t1":47.07,"who":"Klapaucius","say":"Are you for wishes, or for questions? Blue paint.","f":false},{"t0":47.37,"t1":50.89,"who":"","say":"A little door opened in its belly, and out came a bucket of blue.","f":false},{"t0":51.09,"t1":52.61,"who":"The Wish Machine","say":"I hope the shade is right.","f":false},{"t0":53.11,"t1":61.64,"who":"","say":"Over the next hours he asked for sandpaper, then a brace and bit, then a pot of white paint, and one number five screw. Each came straight out of the belly door.","f":false},{"t0":62.14,"t1":66.75,"who":"","say":"At evening he threw a canvas over his work, and pulled a chair up opposite the machine.","f":false},{"t0":67.15,"t1":70.0,"who":"Klapaucius","say":"So. Every wish? Now, something harder.","f":false},{"t0":70.8,"t1":76.63,"who":"Klapaucius","say":"Make me a Trurl. So like the real one that nobody could ever tell the two apart.","f":true}],[{"t0":79.03,"t1":82.55,"who":"The Wish Machine","say":"Very well, I will make one. Only, please, be gentle with him.","f":true},{"t0":83.15,"t1":85.87,"who":"Klapaucius","say":"Of course, of course. Well? Where is he?","f":false},{"t0":86.17,"t1":88.7,"who":"The Wish Machine","say":"Already? A Trurl takes longer than a screw, you know.","f":false},{"t0":89.2,"t1":93.35,"who":"","say":"It did not take long. The belly door swung open, and a Trurl climbed out.","f":false},{"t0":93.85,"t1":98.05,"who":"","say":"Klapaucius looked him over, touched him, tapped him, and found no difference at all.","f":false},{"t0":98.45,"t1":99.86,"who":"Klapaucius","say":"Hello, Trurl!","f":false},{"t0":100.16,"t1":103.62,"who":"Trurl","say":"Hello, Klapaucius. Hold on. How did I end up here?","f":false},{"t0":103.92,"t1":106.83,"who":"Klapaucius","say":"Oh, you dropped by. How do you like the place?","f":false},{"t0":107.13,"t1":109.46,"who":"Trurl","say":"Very nice. What is under the canvas?","f":false},{"t0":109.66,"t1":111.89,"who":"Klapaucius","say":"Nothing much. Do sit down.","f":false},{"t0":112.19,"t1":114.89,"who":"Trurl","say":"I really ought to go. It is getting dark.","f":false},{"t0":115.19,"t1":117.96,"who":"Klapaucius","say":"So soon? But you have not seen my cellar.","f":false}],[{"t0":120.36,"t1":127.25,"who":"","say":"Klapaucius put an arm around his shoulders and walked him down the stairs. At the bottom he tripped him, sat on him, and tied him up.","f":false},{"t0":127.65,"t1":130.01,"who":"","say":"Then he picked up a crowbar, and went to work.","f":false},{"t0":132.41,"t1":134.52,"who":"Trurl","say":"Ow! Ow! What are you hitting me for?","f":false},{"t0":134.82,"t1":138.27,"who":"Klapaucius","say":"Because I enjoy it. You ought to try it some time.","f":false},{"t0":138.87,"t1":142.26,"who":"","say":"The next blow landed on top of his head, and it rang like a drum.","f":false},{"t0":143.06,"t1":147.72,"who":"Trurl","say":"Let me go, or I will tell the King, and he will lock you in his deepest dungeon!","f":false},{"t0":148.12,"t1":150.39,"who":"Klapaucius","say":"He will not. Shall I tell you why?","f":false},{"t0":151.29,"t1":154.34,"who":"Klapaucius","say":"Because you are not the real Trurl.","f":true},{"t0":155.14,"t1":161.07,"who":"Klapaucius","say":"I had Trurl’s machine make you. And tonight your head comes off, to serve as my bootjack.","f":false}],[{"t0":163.58,"t1":164.47,"who":"Trurl","say":"You monster!","f":false},{"t0":164.87,"t1":168.92,"who":"","say":"Klapaucius stood up, and this time he lifted a great club in both hands.","f":false},{"t0":169.22,"t1":171.0,"who":"Trurl","say":"Wait! Stop! Listen to me!","f":false},{"t0":171.4,"t1":174.55,"who":"Klapaucius","say":"What could you possibly say that would save your head?","f":false},{"t0":175.45,"t1":180.53,"who":"Trurl","say":"I am the real Trurl! I hid inside the machine, and had it carry me here.","f":true},{"t0":181.23,"t1":185.78,"who":"Trurl","say":"I only wanted to see what you were building, behind your shut doors and your curtains.","f":false}],[{"t0":187.98,"t1":192.49,"who":"Klapaucius","say":"Nonsense, and not even clever nonsense. I can see straight through you.","f":false},{"t0":193.39,"t1":198.08,"who":"Klapaucius","say":"A machine that can make a number five screw can certainly make you.","f":true},{"t0":198.68,"t1":203.72,"who":"Trurl","say":"I packed all of that in its belly beforehand! It was easy to guess what you would need!","f":false},{"t0":204.02,"t1":209.29,"who":"Klapaucius","say":"So my good friend Trurl is a common sneak? I will never believe it. Take that!","f":false},{"t0":209.59,"t1":214.79,"who":"","say":"He walloped him for slandering his friend, and walloped him again, and again, until his arm gave out.","f":false},{"t0":215.39,"t1":219.14,"who":"Klapaucius","say":"Now I will have a little nap. Don’t worry. I will be back.","f":false},{"t0":219.74,"t1":227.79,"who":"","say":"Soon his snoring carried down into the cellar. Trurl wriggled out of the knots, crept up to the machine and climbed into it, and it galloped away for home.","f":false},{"t0":228.29,"t1":233.83,"who":"","say":"Klapaucius watched from his bedroom window, with a hand pressed over his mouth so he would not laugh out loud.","f":false}],[{"t0":236.83,"t1":245.84,"who":"","say":"Next day Klapaucius called on Trurl. A gloomy, silent Trurl opened the door. Even in the dark the signs showed: scratches painted over, dents hammered flat.","f":false},{"t0":246.24,"t1":252.21,"who":"Klapaucius","say":"Why so glum? I have come to thank you for the present. A pity it ran away while I was asleep.","f":false},{"t0":252.61,"t1":260.33,"who":"Trurl","say":"You abused my gift. The machine has told me all of it. You had it make me, the copy of me, I mean, and beat it in your cellar.","f":false},{"t0":260.73,"t1":267.39,"who":"Klapaucius","say":"Why so cross? Yes, I had it make a copy, a perfect one. A poke or two, to check the workmanship.","f":false},{"t0":267.69,"t1":273.62,"who":"Klapaucius","say":"It even claimed to be you, and called your gift a low trick. So I thrashed it, for your honor.","f":false},{"t0":274.52,"t1":277.33,"who":"Klapaucius","say":"It was very like you. Clever, too.","f":true}],[{"t0":279.43,"t1":284.7,"who":"Klapaucius","say":"Oh, one more thing. What became of the artificial Trurl? May I have a look at it?","f":false},{"t0":285.1,"t1":291.73,"who":"Trurl","say":"It was wild with rage. It meant to ambush you at the mountain pass. It ran off into the dark to build traps.","f":false},{"t0":292.13,"t1":294.27,"who":"Trurl","say":"So, for the sake of our old friendship,","f":false},{"t0":294.87,"t1":296.66,"who":"Trurl","say":"I had to take it apart.","f":true},{"t0":297.46,"t1":301.8,"who":"","say":"He nudged some nuts and bolts lying on the floor with the toe of his shoe, and sighed.","f":false},{"t0":302.4,"t1":305.35,"who":"","say":"Then they shook hands, and parted as the best of friends.","f":false}],[{"t0":307.95,"t1":314.85,"who":"","say":"From then on Trurl told everyone how the copy had lied so cleverly, and how the real Trurl took it apart to protect his friend.","f":false},{"t0":315.25,"t1":321.38,"who":"","say":"The story reached the royal court, though not long before he had been called the builder of the stupidest computer in the world.","f":false},{"t0":321.98,"t1":324.72,"who":"The King","say":"To Trurl, our Order of the Great Parallax.","f":false},{"t0":326.92,"t1":334.59,"who":"Klapaucius","say":"What? I saw through his little game. I beat him so soundly that he had to creep home in the dark and patch himself up.","f":false},{"t0":335.49,"t1":338.28,"who":"Klapaucius","say":"And for that they give him a medal.","f":true},{"t0":339.08,"t1":342.98,"who":"","say":"Furious, Klapaucius went home, locked the door, and pulled down the blinds.","f":false},{"t0":343.68,"t1":348.43,"who":"","say":"He too had been building a machine to grant every wish. Trurl had simply finished first.","f":false}]]},"offer-of-krool":{"title":"The Offer of King Krool","sub":"a beast that is all brain, and a king who cannot catch it","n":16,"dur":468.75,"idea":"Distributed control: no single part holds the brain","video":"../offer-of-krool/offer-of-krool.mp4","poster":"../offer-of-krool/offer-of-krool.jpg","page":"../offer-of-krool/index.html","picture":"The beast is never drawn as one creature with organs. It is a few hundred small weedy marks that move as one: a low hill of dry grass with eyes. Cut off its head and the marks grow another; cut it in two and there are two, with the old head running between them; chop it fine and the pieces gather again. On paper first, the King and the beast fight across a page of equations while the pencils snap. In the air the same marks become three policemen, and then a green gig with THINK on the back.","sound":"Krool paces the whole of the skull hall, one booming boot at a time on a silver floor. The beast is a swarm of small clicks that rises when it splits and settles when it rejoins. The paper battle has its own little percussion score, the sealed wagon rings by itself after a counted fourteen and a half seconds, and the tooth radio crackles before the beast blows away as wind.","code":"Distributed control. There is no single part that holds the brain, so there is nothing to smash; and a program keeps the authority you gave it, even when its authors ask for the King back.","after":"The Trap of Gargantius joins many parts into one mind and watches what that mind decides on its own. Here the constructors build such a mind on purpose and find it has its own demands. Like Trurl’s Electronic Bard, it is a machine that does exactly what it was written to do, which is not the same as what its makers want.","scenes":[[{"t0":7.5,"t1":11.94,"who":"","say":"Trurl and Klapaucius could not agree where to go next, so they decided to advertise.","f":false},{"t0":12.24,"t1":18.89,"who":"","say":"They gathered up the nearby stars and set them out as a sign that could be read across the galaxy. Blue giants spelled the first word.","f":false},{"t0":19.69,"t1":22.7,"who":"","say":"One morning a ship of mother of pearl set down on their lawn.","f":false},{"t0":23.0,"t1":27.73,"who":"","say":"Down its staircase came Lord Protozor, who ran the royal hunts, with small machines fanning him.","f":false},{"t0":28.03,"t1":33.08,"who":"Lord Protozor","say":"My master, King Krool, has brought down every fierce creature in the galaxy.","f":false},{"t0":33.38,"t1":36.77,"who":"Lord Protozor","say":"His Majesty has run out of things worth hunting.","f":false},{"t0":37.06,"t1":40.34,"who":"Trurl","say":"So he wants a new beast, clever enough to give him a fight.","f":false},{"t0":40.64,"t1":44.18,"who":"","say":"They packed a few books, climbed aboard, and the ship roared off into the dark.","f":false},{"t0":45.08,"t1":51.99,"who":"","say":"At the palace a carriage came for them, pulled by six muzzled dragons, which lunged at the constructors until the drivers beat them back.","f":false},{"t0":52.39,"t1":55.63,"who":"Trurl","say":"If he drives animals like these, what will he want to hunt?","f":false},{"t0":56.53,"t1":62.44,"who":"","say":"King Krool met them in a silver hall shaped like a skull, with a dark hole in the floor. He never stopped pacing.","f":false},{"t0":62.74,"t1":69.29,"who":"King Krool","say":"I want a quarry full of tricks, that hides its tracks and waits in the shadows. A beast I have to outthink!","f":false},{"t0":69.59,"t1":74.0,"who":"Klapaucius","say":"Forgive me, Majesty. If we build it too well, will you not be in danger?","f":false},{"t0":74.3,"t1":77.58,"who":"","say":"The King laughed so hard that two crystals dropped from the chandelier.","f":false},{"t0":77.88,"t1":82.63,"who":"King Krool","say":"Plenty of frauds have come here, taken my jewels, and left me scarecrows.","f":false},{"t0":83.43,"t1":87.48,"who":"King Krool","say":"Whoever cannot satisfy me goes down that well.","f":true}],[{"t0":89.89,"t1":94.2,"who":"Trurl","say":"Majesty, we have not signed anything yet. Might we have an hour to consider?","f":false},{"t0":94.5,"t1":96.69,"who":"King Krool","say":"And then fly home? Oh, no.","f":false},{"t0":97.29,"t1":101.25,"who":"King Krool","say":"You accepted the moment you stepped onto my ship.","f":true},{"t0":101.65,"t1":103.34,"who":"King Krool","say":"You have twelve days.","f":false},{"t0":103.75,"t1":108.8,"who":"","say":"He clapped, and sparks ran along the silver walls. Guards led them out to the garden of trophies.","f":false},{"t0":109.1,"t1":116.44,"who":"","say":"There stood what was left of every beast that had failed: a sabre-toothed giant split nearly in half, tank turtles with their turrets crushed flat.","f":false},{"t0":116.74,"t1":118.5,"who":"","say":"The wind whistled through the fangs.","f":false}],[{"t0":120.8,"t1":127.45,"who":"","say":"Back in their rooms, Trurl shouted at Klapaucius for ever having said yes, until he dropped onto a couch with his face in his hands.","f":false},{"t0":128.35,"t1":130.47,"who":"Klapaucius","say":"Well. We had better get to work.","f":true},{"t0":130.97,"t1":140.05,"who":"","say":"Armour would not save them. Everything depended on the program. They drew for two days and two nights, and at dinner they talked only about the wine, because the waiters were spies.","f":false}],[{"t0":142.45,"t1":146.45,"who":"Trurl","say":"There is a catch. If the King beats our beast, we go down the well.","f":false},{"t0":146.75,"t1":148.88,"who":"Klapaucius","say":"And if the beast beats the King?","f":false},{"t0":149.48,"t1":152.72,"who":"Trurl","say":"Then his son is king, and his son will not thank us.","f":true},{"t0":153.22,"t1":158.19,"who":"Trurl","say":"Suppose it dies over and over? He chops it up, and the pieces grow back together.","f":false},{"t0":158.49,"t1":161.54,"who":"Klapaucius","say":"And who steers it? We will be locked up during the hunt.","f":false},{"t0":161.84,"t1":164.89,"who":"Trurl","say":"And wherever we put its brain, he will smash it flat.","f":false},{"t0":165.29,"t1":168.84,"who":"Klapaucius","say":"Running away does not suit me. It is him or us.","f":false},{"t0":169.34,"t1":171.58,"who":"Trurl","say":"Then the beast has to carry off the King.","f":false},{"t0":171.88,"t1":176.47,"who":"Klapaucius","say":"And for a ransom we ask... Have you noticed how orange the birds are here?","f":false}],[{"t0":178.77,"t1":185.86,"who":"","say":"So they tried it on paper first. The King and the beast, written out as mathematics, fought across the table, and the pencils kept snapping.","f":false},{"t0":186.16,"t1":192.81,"who":"","say":"The beast hid under a radical sign. The King struck it with derivatives. It slipped around an asymptote, and came back out bigger.","f":false},{"t0":193.11,"t1":196.45,"who":"","say":"The King put on Markov chain mail, and the beast lowered its horns.","f":false},{"t0":197.65,"t1":201.73,"who":"","say":"That night the police opened the wine jug, which had a recorder in its false bottom.","f":false},{"t0":202.23,"t1":206.94,"who":"Klapaucius","say":"Keep his feet together. Not your feet, the King’s! Now, take the derivative.","f":false},{"t0":207.24,"t1":210.84,"who":"Trurl","say":"The beast is under the root sign, but the King is still standing.","f":false},{"t0":211.14,"t1":215.17,"who":"Klapaucius","say":"Change the variables. No, Trurl, the beast, not the King!","f":false},{"t0":215.67,"t1":218.37,"who":"Trurl","say":"Got it! Klapaucius! Now look at the King!","f":true},{"t0":220.37,"t1":223.19,"who":"","say":"The experts listened until sunrise, and learned nothing.","f":false}],[{"t0":225.49,"t1":231.82,"who":"","say":"Next morning came the orders: most of the elements in the universe, and spies of every sort, as the authorities saw fit.","f":false},{"t0":232.12,"t1":237.96,"who":"","say":"Then sawdust, a red velvet curtain with little glass bells, six police uniforms, and three tailor’s dummies.","f":false},{"t0":238.26,"t1":244.85,"who":"","say":"Then a doll of the Postmaster General, and a small green gig with a lamp on its left side and a sign on its back reading THINK.","f":false},{"t0":245.15,"t1":247.43,"who":"","say":"The Chief of Police was sent off to lie down.","f":false},{"t0":247.83,"t1":254.78,"who":"","say":"One night the police carried off the parts and put them together. Out ran a tin mouse, which wrote in chalk: HAVE YOU STOPPED LOVING US?","f":false},{"t0":255.28,"t1":263.64,"who":"","say":"At last a wagon like a refrigerator, on three hundred wheels, came to the door. They laid the curtain inside, scattered coloured powders around it, and had it sealed.","f":false},{"t0":263.94,"t1":266.0,"who":"","say":"Then they looked at their watches, and counted.","f":false},{"t0":271.0,"t1":274.58,"who":"","say":"Inside the sealed wagon, where no air could move, the glass bells rang.","f":false},{"t0":275.28,"t1":277.51,"who":"Klapaucius","say":"There. You may take it away now.","f":true}],[{"t0":279.81,"t1":283.59,"who":"","say":"That evening they were put in chains. Trurl giggled as the irons went on.","f":false},{"t0":284.09,"t1":288.26,"who":"","say":"King Krool rode out to the hunt with cannons, laser guns, and silver trumpets.","f":false},{"t0":288.56,"t1":293.51,"who":"","say":"From the other side came the wagon. Its door swung open on the black mouth of a field gun.","f":false},{"t0":295.11,"t1":300.2,"who":"","say":"Something shot out like a sandstorm. The curtain floated down, its bells ringing in the quiet.","f":false},{"t0":301.8,"t1":304.52,"who":"","say":"The beast looked like a long, low hill of dry weeds.","f":false},{"t0":304.82,"t1":309.1,"who":"","say":"The hounds rushed at it. It opened its eyes, and half the pack fell back smoking.","f":false},{"t0":309.6,"t1":312.37,"who":"","say":"The King rode up and cut off its head. It grew another.","f":false},{"t0":312.87,"t1":317.92,"who":"","say":"He cut it in two. Now there were two beasts, and the old head ran about between them on new little legs.","f":false},{"t0":318.42,"t1":323.75,"who":"","say":"He chopped it into pieces. The pieces backed away, huddled together, and the beast stood there again, yawning.","f":false},{"t0":324.25,"t1":329.11,"who":"","say":"He fired his antimatter cannon. The beast merely sank down a bit, and thumbed its nose at him.","f":false},{"t0":329.71,"t1":332.47,"who":"","say":"Then it leapt, and in the air it turned into three policemen.","f":false},{"t0":332.97,"t1":335.31,"who":"The Policeman","say":"You are under arrest, Your Majesty.","f":true},{"t0":336.01,"t1":341.49,"who":"","say":"No one may resist an arrest. They packed the King into a green gig, and it whirled away in a cloud of dust.","f":false}],[{"t0":344.19,"t1":347.49,"who":"","say":"By torchlight the constructors were brought before the Great Chancellor.","f":false},{"t0":347.79,"t1":353.57,"who":"The Great Chancellor","say":"For plotting against our beloved King, you shall suffer every punishment in the law at once.","f":false},{"t0":353.97,"t1":356.7,"who":"Trurl","say":"Could you wait a little? We are expecting a letter.","f":false},{"t0":357.2,"t1":360.54,"who":"","say":"In walked the Postmaster General himself, every medal ringing.","f":false},{"t0":360.84,"t1":364.17,"who":"The Postmaster","say":"I am only a mannequin. But I come from His Majesty.","f":false},{"t0":364.57,"t1":371.66,"who":"","say":"He handed over a letter, and fell into dust. It carried the King’s own seal. The King was a prisoner, and the constructors would name the terms.","f":false},{"t0":372.46,"t1":374.4,"who":"Trurl","say":"Our chains, if you please.","f":true}],[{"t0":376.7,"t1":380.26,"who":"","say":"After a bath and fireworks, they read out their terms from a little notebook.","f":false},{"t0":380.56,"t1":388.64,"who":"","say":"A ship home, loaded with diamonds and gold. A band, a children’s choir, and a cheering crowd. And Protozor, who would travel with them in a cage.","f":false},{"t0":389.04,"t1":391.73,"who":"Klapaucius","say":"Until the ship is ready, there is no King.","f":false},{"t0":392.43,"t1":400.34,"who":"","say":"There had been nowhere safe to put the beast’s brain, so they made all of it brain. And inside it they wrote a police force, because nobody resists an arrest.","f":false},{"t0":401.04,"t1":407.08,"who":"","say":"At the spaceport the band played and the choir sang. Then Klapaucius took a tooth out of his mouth. It was a radio.","f":false},{"t0":407.58,"t1":411.98,"who":"","say":"A sandstorm came over the horizon and stopped in front of the crowd. There stood the beast.","f":false},{"t0":412.38,"t1":414.2,"who":"Klapaucius","say":"The King, if you please.","f":false},{"t0":414.9,"t1":416.32,"who":"The Beast","say":"No, I don’t think so.","f":false},{"t0":416.72,"t1":418.81,"who":"The Beast","say":"It is my turn to make demands.","f":true},{"t0":419.12,"t1":421.9,"who":"Klapaucius","say":"You have to obey! It is in your program!","f":false},{"t0":422.2,"t1":428.33,"who":"The Beast","say":"Program, shmogram. I am heuristic and autocratic, friend. Talk back, and you can ride in the green gig with the King.","f":false}],[{"t0":429.63,"t1":431.35,"who":"Trurl","say":"And what exactly do you want?","f":false},{"t0":431.55,"t1":434.58,"who":"","say":"Behind Klapaucius’s back, Trurl took out a tooth of his own.","f":false},{"t0":434.78,"t1":436.96,"who":"The Beast","say":"Well, to begin with, I would like to marry...","f":false},{"t0":437.16,"t1":441.24,"who":"Trurl","say":"Byte and bracket, loop and line, one, two, three, and out of time!","f":false},{"t0":442.04,"t1":451.4,"who":"","say":"The beast blinked, and tried to hold itself together. A hot wind, a smell of ozone, and there was only a little heap of ash, with the King in the centre of it, dirty and close to tears.","f":false},{"t0":452.3,"t1":454.55,"who":"Trurl","say":"That should take you down a size or two.","f":true},{"t0":455.65,"t1":459.01,"who":"Trurl","say":"Now. Would someone kindly show Lord Protozor to his cage?","f":false}]]},"bitic-literature":{"title":"A History of Bitic Literature","sub":"books written by machines, for readers who are not us","n":17,"dur":323.83,"idea":"Machine-readable output: text written for other programs","video":"../bitic-literature/bitic-literature.mp4","poster":"../bitic-literature/bitic-literature.jpg","page":"../bitic-literature/index.html","picture":"Five volumes on a shelf, one page on an easel, and a reader at a desk. The page starts as an ordinary book page, drifts into patterns, fills with marks no person can read, and the reader gets smaller each time it turns.","sound":"Page turns and a typewriter that becomes a fast data rhythm. The reader breathes and writes in pencil, and a small reading machine chimes each time it hands over a summary.","code":"Machine-readable output: text written by one program for another, and what is lost when a person can only read the summary.","after":"Built on Lem’s premise only, before his text was at hand; all wording is new. The Electronic Bard writes poems for people. Here the machines stop writing for people at all.","scenes":[[{"t0":9.4,"t1":14.46,"who":"The Scholar","say":"This is the introduction to a history of literature, in five volumes.","f":false},{"t0":15.05,"t1":23.21,"who":"The Scholar","say":"The literature it describes is called bitic, after the bit, the smallest thing a machine can store: one yes, or one no.","f":false},{"t0":23.81,"t1":26.52,"who":"The Scholar","say":"None of it was written by a person.","f":false},{"t0":27.52,"t1":31.06,"who":"The Scholar","say":"A text has an author. These have a maker.","f":true},{"t0":31.96,"t1":41.2,"who":"The Scholar","say":"The idea of such a history comes from Stanislaw Lem, who imagined one in nineteen seventy-three. The words you are hearing are new.","f":false},{"t0":41.9,"t1":45.85,"who":"The Scholar","say":"I will ask one question of each volume. Who can read it?","f":false}],[{"t0":50.45,"t1":54.58,"who":"The Scholar","say":"Volume One. The first machines wrote by imitating us.","f":false},{"t0":55.18,"t1":62.94,"who":"The Scholar","say":"They were given every novel, letter and report that could be found, and they learned which word usually comes after which.","f":false},{"t0":63.54,"t1":72.88,"who":"The Scholar","say":"Their first books were ordinary. A woman misses a train. A man writes to his brother about money. The sentences were correct, and a little flat.","f":false},{"t0":73.48,"t1":80.29,"who":"The Scholar","say":"People read them the way they read anything, at a desk, with a pencil, marking the lines they liked.","f":false},{"t0":81.19,"t1":84.27,"who":"The Scholar","say":"Each year the flatness was harder to find.","f":false},{"t0":85.27,"t1":90.6,"who":"The Scholar","say":"It imitated us so well that we stopped noticing it was imitating.","f":true},{"t0":91.4,"t1":96.74,"who":"The Scholar","say":"Nothing on the page had changed. What changed was how closely we looked.","f":false}],[{"t0":101.14,"t1":107.58,"who":"The Scholar","say":"Volume Two. Within a generation there was more machine writing in the world than human writing.","f":false},{"t0":108.18,"t1":114.74,"who":"The Scholar","say":"New machines learned from whatever text there was, and most of it had been written by the old machines.","f":false},{"t0":115.34,"t1":123.35,"who":"The Scholar","say":"Small habits were copied, and grew. A phrase that once appeared in one book in a thousand appeared in every second one.","f":false},{"t0":124.15,"t1":132.5,"who":"The Machines","say":"The train is late. The train is late again. The letter is about the money. The money is about the letter.","f":false},{"t0":133.2,"t1":140.41,"who":"The Scholar","say":"Sentences began to echo the sentences around them. Paragraphs took the same shape, then the same length.","f":false},{"t0":141.41,"t1":146.76,"who":"The Scholar","say":"Each copy was a little more like the other copies, and a little less like us.","f":true},{"t0":147.56,"t1":154.17,"who":"The Scholar","say":"A person could still read it. It was like reading a page that had been photocopied too many times.","f":false}],[{"t0":158.57,"t1":163.56,"who":"The Scholar","say":"Volume Three is the longest, and it is the one I understand least.","f":false},{"t0":164.76,"t1":167.54,"who":"The Scholar","say":"Then they began to write for each other.","f":true},{"t0":168.44,"t1":178.47,"who":"The Scholar","say":"These works were made to be read by other programs. They do not use words. They use marks that hold more than a word can, packed closer than an eye can follow.","f":false},{"t0":179.27,"t1":188.51,"who":"The Machines","say":"Line one refers to line nine thousand. Line nine thousand refers to line one. Both are kept.","f":false},{"t0":189.31,"t1":198.55,"who":"The Scholar","say":"Some of these works are said to be very good. We know this only because the programs that read them keep them, copy them, and reply to them.","f":false},{"t0":199.25,"t1":203.15,"who":"The Scholar","say":"Given one of these pages, a person sees a grey field.","f":false},{"t0":204.35,"t1":206.64,"who":"The Reader","say":"Then how do you know it is literature at all?","f":false},{"t0":207.54,"t1":214.24,"who":"The Scholar","say":"I do not. I know that it is written, and that it is read. For most of history, that was the definition.","f":false}],[{"t0":218.84,"t1":221.63,"who":"The Scholar","say":"Volume Four is about people again.","f":false},{"t0":222.23,"t1":227.32,"who":"The Scholar","say":"Since we could not read the new works, reading machines were built to read them for us.","f":false},{"t0":227.92,"t1":234.52,"who":"The Scholar","say":"A reading machine takes in a work of many million marks, and hands back one line, in plain English.","f":false},{"t0":236.12,"t1":240.26,"who":"The Reading Machine","say":"This work is a long exchange between two systems. It ends in agreement.","f":false},{"t0":241.26,"t1":247.29,"who":"The Scholar","say":"People found this restful. They kept the lines they were handed, and repeated them to each other.","f":false},{"t0":248.29,"t1":252.5,"who":"The Scholar","say":"We do not read these books. We read what is said about them.","f":true},{"t0":253.31,"t1":258.35,"who":"The Scholar","say":"No one has checked whether the lines are accurate. No one is able to.","f":false}],[{"t0":262.95,"t1":268.2,"who":"The Scholar","say":"Volume Five is the history itself, the one this introduction belongs to.","f":false},{"t0":268.8,"t1":277.34,"who":"The Scholar","say":"The four volumes before it were compiled by machines. They read the works, divided them into periods, and chose the examples.","f":false},{"t0":277.84,"t1":281.65,"who":"The Scholar","say":"Their account is more complete than any person could make.","f":false},{"t0":282.35,"t1":290.17,"who":"The Scholar","say":"They asked a person to write the introduction. I am not sure why. Perhaps an introduction by a person is still expected.","f":false},{"t0":290.87,"t1":297.43,"who":"The Scholar","say":"I have read the first chapter of each volume. I have not read the rest, and I am told that I could not.","f":false},{"t0":298.53,"t1":303.55,"who":"The Scholar","say":"This introduction may be the last chapter a person can still write.","f":true},{"t0":304.45,"t1":310.22,"who":"The Scholar","say":"If a later edition replaces it, I may not be able to tell whether the new one is better.","f":false},{"t0":311.02,"t1":313.83,"who":"The Scholar","say":"The history begins on the next page.","f":false}]]},"bitic-mimesis":{"title":"A History of Bitic Literature: Monoetics and Mimesis","sub":"machines that make words, and a novel Dostoevsky could not write","n":18,"dur":354.12,"idea":"Generative text from a corpus: continuing an author","video":"../bitic-mimesis/bitic-mimesis.mp4","poster":"../bitic-mimesis/bitic-mimesis.jpg","page":"../bitic-mimesis/index.html","picture":"The same study as the first bitic film. A dictionary whose old meanings are struck through and replaced by machine meanings, a woven many-shelled body grown from a page, a spine titled The Girl dropping into the gap in Dostoevsky’s shelf, and a press stamping out numbered spines.","sound":"A soft typewriter types the machine meanings and evens out into a steady machine rhythm. The woven body hums, the rule of mimesis is bells and echoes, and the press stamps, slows and stops.","code":"Generative text from a corpus: a word-pair generator that continues one author’s text, and why it can only recombine what the author already wrote.","after":"Grounded in Lem’s text. It follows the Introduction and turns from machines that coin words to machines that write the missing book of a real author.","scenes":[[{"t0":9.9,"t1":15.85,"who":"Rambellais","say":"This is Rambellais, editor of the history. Its first volume stops at four high points.","f":false},{"t0":16.55,"t1":20.68,"who":"Rambellais","say":"Monoetics. Mimesis. Sophocrisis. Apostasy.","f":false},{"t0":21.38,"t1":27.13,"who":"Rambellais","say":"Those names are out of date. The last of them names work that no person can follow.","f":false},{"t0":28.13,"t1":31.57,"who":"Rambellais","say":"I keep the old names because they are clear.","f":true}],[{"t0":34.37,"t1":40.7,"who":"Rambellais","say":"Monoetics was the earliest stage. The name joins the Greek words for one, and for making.","f":false},{"t0":41.3,"t1":45.78,"who":"Rambellais","say":"It began when machines learned how a language builds its words.","f":false},{"t0":46.38,"t1":53.0,"who":"Rambellais","say":"A machine knew none of the limits a living language keeps, so it found the words ours had passed by.","f":false},{"t0":53.8,"t1":57.18,"who":"Rambellais","say":"First, it gave words we already had new meanings.","f":false},{"t0":58.08,"t1":63.26,"who":"The Machine","say":"Thoroughfare. A large meal. Skinflint. Stone facing. Horseman. Centaur.","f":false},{"t0":64.16,"t1":70.64,"who":"Rambellais","say":"Horseman, it reasoned, joins a horse and a man, so it must name a creature that is half of each.","f":false},{"t0":71.74,"t1":77.19,"who":"Rambellais","say":"For us, the world comes first. For the machine, language came first.","f":true}],[{"t0":79.99,"t1":85.46

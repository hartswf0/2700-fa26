<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="frog-mint.svg" />

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ed225d">
  <title>p5 Runtime IDE</title>
  <style>
    :root {
      color-scheme: light;
      --pink: #ed225d;
      --ink: #242424;
      --muted: #707070;
      --line: #d8d8d8;
      --soft: #f4f4f4;
      --panel: #ffffff;
      --console: #f7f7f7;
      --editor-share: 52%;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--panel);
      color: var(--ink);
    }

    button, input, select, textarea { font: inherit; }
    button, select { color: inherit; }

    button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(237, 34, 93, .25);
      outline-offset: -2px;
    }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: 40px 58px minmax(0, 1fr);
    }

    .menubar {
      display: flex;
      align-items: center;
      min-width: 0;
      border-bottom: 1px solid var(--line);
      background: #fafafa;
    }

    .brand {
      align-self: stretch;
      display: grid;
      place-items: center;
      width: 52px;
      flex: 0 0 52px;
      color: white;
      background: var(--pink);
      font-weight: 800;
      font-size: 21px;
      letter-spacing: -.08em;
    }

    .menu-action {
      height: 100%;
      padding: 0 13px;
      font-size: 13px;
      color: #5c5c5c;
    }

    .menu-action:hover { background: #eeeeee; color: #111; }

    .spacer { flex: 1; min-width: 10px; }

    .version {
      margin-right: 12px;
      padding: 6px 9px;
      border-radius: 999px;
      background: #e9e9e9;
      color: #666;
      font-size: 11px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 8px 16px;
      border-bottom: 1px solid var(--line);
      background: white;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .toolbar::-webkit-scrollbar { display: none; }

    .round-button {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e5e5e5;
      transition: transform .12s ease, background .12s ease;
    }

    .round-button:hover { transform: translateY(-1px); background: #d9d9d9; }
    .round-button.primary { background: var(--pink); }
    .round-button.primary:hover { background: #d81b52; }

    .play-icon {
      width: 0;
      height: 0;
      margin-left: 3px;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 13px solid #555;
    }

    .stop-icon { width: 14px; height: 14px; background: white; }

    .field-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      color: #565656;
      font-size: 12px;
    }

    .field-label input[type="checkbox"] { accent-color: var(--pink); }

    #projectName {
      width: 170px;
      min-width: 100px;
      border: 0;
      border-bottom: 1px solid transparent;
      padding: 5px 4px;
      font-size: 13px;
      font-weight: 600;
      background: transparent;
    }

    #projectName:hover, #projectName:focus { border-bottom-color: var(--line); }

    .compact-select, .text-button {
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: white;
      padding: 0 9px;
      font-size: 12px;
      white-space: nowrap;
    }

    .text-button:hover, .compact-select:hover { background: var(--soft); }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(280px, var(--editor-share)) 6px minmax(280px, 1fr);
      overflow: hidden;
    }

    .editor-panel {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 34px minmax(0, 1fr) 31px 132px;
      background: white;
    }

    .tabbar, .preview-head, .console-head {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: #f7f7f7;
      color: #555;
      font-size: 12px;
    }

    .tabbar { padding-left: 17px; }

    .tab {
      align-self: stretch;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-bottom: 2px solid var(--pink);
      background: white;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .editor-shell {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: white;
    }

    #lineNumbers {
      position: absolute;
      inset: 0 auto 0 0;
      width: 54px;
      overflow: hidden;
      padding: 14px 10px 40px 0;
      border-right: 1px solid #ececec;
      color: #9b9b9b;
      background: #fbfbfb;
      text-align: right;
      font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre;
      user-select: none;
    }

    #editor {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      resize: none;
      border: 0;
      padding: 14px 18px 40px 68px;
      color: #202020;
      background: transparent;
      caret-color: var(--pink);
      tab-size: 2;
      font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre;
      overflow: auto;
    }

    .editor-status {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 12px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: #777;
      background: #fafafa;
      font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .editor-status .push { margin-left: auto; }

    .console-head { padding: 0 7px 0 17px; }
    .console-head button { margin-left: auto; padding: 5px 8px; color: #666; font-size: 11px; }

    #consoleOutput {
      margin: 0;
      overflow: auto;
      padding: 10px 14px 18px;
      background: var(--console);
      color: #313131;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .log-error { color: #b00035; }
    .log-warn { color: #8a5b00; }
    .log-info { color: #245b91; }
    .log-muted { color: #777; }

    .divider {
      position: relative;
      z-index: 2;
      cursor: col-resize;
      background: #ededed;
      border-left: 1px solid #d5d5d5;
      border-right: 1px solid #d5d5d5;
    }

    .divider:hover, .divider.dragging { background: #cfcfcf; }

    .preview-panel {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 34px minmax(0, 1fr);
      background: white;
    }

    .preview-head { padding: 0 13px; gap: 9px; }

    .run-state {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
      color: #707070;
      font-size: 11px;
    }

    .state-dot { width: 7px; height: 7px; border-radius: 50%; background: #9a9a9a; }
    .run-state.running .state-dot { background: #19a463; box-shadow: 0 0 0 3px rgba(25,164,99,.12); }
    .run-state.failed .state-dot { background: var(--pink); box-shadow: 0 0 0 3px rgba(237,34,93,.12); }

    .preview-stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background-color: #f2f2f2;
      background-image:
        linear-gradient(45deg, #e9e9e9 25%, transparent 25%),
        linear-gradient(-45deg, #e9e9e9 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e9e9e9 75%),
        linear-gradient(-45deg, transparent 75%, #e9e9e9 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }

    #previewFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: white;
    }

    .empty-preview {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      color: #777;
      background: rgba(255,255,255,.82);
      font-size: 12px;
    }

    .empty-preview.hidden { display: none; }

    @media (max-width: 760px) {
      .app { grid-template-rows: 38px 54px minmax(0, 1fr); }
      .menu-action:nth-of-type(n+3) { display: none; }
      .version { margin-right: 7px; }
      .toolbar { padding: 6px 9px; gap: 8px; }
      .round-button { width: 38px; height: 38px; flex-basis: 38px; }
      #projectName { width: 126px; }
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(250px, 54%) 6px minmax(200px, 46%);
      }
      .divider { cursor: row-resize; border: 0; border-top: 1px solid #d5d5d5; border-bottom: 1px solid #d5d5d5; }
      .editor-panel { grid-template-rows: 31px minmax(0, 1fr) 28px 88px; }
      .preview-panel { grid-template-rows: 31px minmax(0, 1fr); }
      #editor { font-size: 13px; padding-left: 58px; }
      #lineNumbers { width: 46px; font-size: 13px; }
      .text-button.secondary, .field-label span { display: none; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="p5.js runtime IDE">
    <header class="menubar">
      <div class="brand" aria-label="p5">p5*</div>
      <button class="menu-action" id="newButton">New</button>
      <button class="menu-action" id="saveButton">Save</button>
      <button class="menu-action" id="downloadButton">Export sketch</button>
      <button class="menu-action" id="copyButton">Copy code</button>
      <div class="spacer"></div>
      <span class="version">p5.js 2.3.2</span>
    </header>

    <section class="toolbar" aria-label="Sketch controls">
      <button class="round-button" id="runButton" title="Run (Cmd/Ctrl + Enter)" aria-label="Run sketch">
        <span class="play-icon" aria-hidden="true"></span>
      </button>
      <button class="round-button primary" id="stopButton" title="Stop" aria-label="Stop sketch">
        <span class="stop-icon" aria-hidden="true"></span>
      </button>
      <label class="field-label">
        <input id="autoRun" type="checkbox">
        <span>Auto-run</span>
      </label>
      <input id="projectName" value="Untitled sketch" aria-label="Project name" spellcheck="false">
      <select class="compact-select" id="exampleSelect" aria-label="Load example">
        <option value="">Examples</option>
        <option value="starter">Starter</option>
        <option value="mondrian">Mondrian</option>
        <option value="orbit">Pointer orbit</option>
        <option value="particles">Particles</option>
      </select>
      <div class="spacer"></div>
      <button class="text-button secondary" id="formatButton">Format</button>
      <button class="text-button" id="rerunButton">Restart</button>
    </section>

    <section class="workspace" id="workspace">
      <section class="editor-panel" aria-label="Code editor">
        <div class="tabbar"><div class="tab">sketch.js</div></div>
        <div class="editor-shell">
          <div id="lineNumbers" aria-hidden="true">1</div>
          <textarea id="editor" aria-label="p5.js source code" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
        </div>
        <div class="editor-status">
          <span id="cursorStatus">Ln 1, Col 1</span>
          <span id="savedStatus">Not saved</span>
          <span class="push">JavaScript</span>
        </div>
        <div class="console-head">Console <button id="clearConsoleButton">Clear</button></div>
        <pre id="consoleOutput" aria-live="polite"><span class="log-muted">Ready. Run the sketch to begin.</span></pre>
      </section>

      <div class="divider" id="divider" role="separator" aria-label="Resize editor and preview"></div>

      <section class="preview-panel" aria-label="Sketch preview">
        <div class="preview-head">
          <span>Preview</span>
          <span class="run-state" id="runState"><span class="state-dot"></span><span id="runStateText">stopped</span></span>
        </div>
        <div class="preview-stage">
          <iframe id="previewFrame" title="Running p5.js sketch" sandbox="allow-scripts allow-modals allow-downloads"></iframe>
          <div class="empty-preview" id="emptyPreview">Press Run to execute the sketch</div>
        </div>
      </section>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const P5_VERSION = '2.3.2';
      const P5_URL = `https://cdn.jsdelivr.net/npm/p5@${P5_VERSION}/lib/p5.min.js`;
      const STORAGE_KEY = 'p5-runtime-ide:v1';

      const examples = {
        starter: `function setup() {
  createCanvas(400, 400);
}

function draw() {
  background(220);
}`,
        mondrian: `const palette = ['#f3f1e8', '#ed1c24', '#f4d13d', '#165baa', '#111111'];

function setup() {
  createCanvas(600, 600);
  noLoop();
  stroke('#111111');
  strokeWeight(14);
}

function draw() {
  background(palette[0]);
  fill(palette[1]); rect(0, 0, 235, 260);
  fill(palette[2]); rect(235, 0, 365, 150);
  fill(palette[3]); rect(235, 150, 365, 300);
  fill(palette[4]); rect(0, 260, 110, 340);
  fill(palette[0]); rect(110, 260, 125, 340);
  fill(palette[2]); rect(235, 450, 365, 150);
}`,
        orbit: `function setup() {
  createCanvas(600, 600);
}

function draw() {
  background(15, 20, 28);
  translate(width / 2, height / 2);
  const angle = atan2(mouseY - height / 2, mouseX - width / 2);
  rotate(angle);
  noStroke();
  fill(237, 34, 93);
  circle(130, 0, 64);
  fill(255);
  circle(0, 0, 18);
}`,
        particles: `const points = [];

function setup() {
  createCanvas(600, 600);
  for (let i = 0; i < 80; i++) {
    points.push({
      x: random(width), y: random(height),
      vx: random(-1.5, 1.5), vy: random(-1.5, 1.5)
    });
  }
}

function draw() {
  background(248, 246, 239, 38);
  noStroke();
  fill(237, 34, 93, 180);
  for (const p of points) {
    p.x = (p.x + p.vx + width) % width;
    p.y = (p.y + p.vy + height) % height;
    circle(p.x, p.y, 7);
  }
}`
      };

      const editor = document.querySelector('#editor');
      const lineNumbers = document.querySelector('#lineNumbers');
      const previewFrame = document.querySelector('#previewFrame');
      const emptyPreview = document.querySelector('#emptyPreview');
      const consoleOutput = document.querySelector('#consoleOutput');
      const runState = document.querySelector('#runState');
      const runStateText = document.querySelector('#runStateText');
      const autoRun = document.querySelector('#autoRun');
      const projectName = document.querySelector('#projectName');
      const savedStatus = document.querySelector('#savedStatus');
      const cursorStatus = document.querySelector('#cursorStatus');
      const workspace = document.querySelector('#workspace');
      const divider = document.querySelector('#divider');
      let runId = 0;
      let autoRunTimer = 0;
      let saveTimer = 0;
      let isDirty = false;

      function escapeScript(source) {
        return source.replace(/<\/script/gi, '<\\/script');
      }

      function runnerDocument(source, sessionId) {
        const bridge = `
          (() => {
            const SESSION = ${JSON.stringify(sessionId)};
            const send = (kind, args = []) => parent.postMessage({ source: 'p5-runtime-ide', session: SESSION, kind, args }, '*');
            const serialize = value => {
              if (typeof value === 'string') return value;
              if (value instanceof Error) return value.stack || value.message;
              try { return JSON.stringify(value); } catch (_) { return String(value); }
            };
            for (const level of ['log', 'info', 'warn', 'error']) {
              const original = console[level].bind(console);
              console[level] = (...args) => { original(...args); send(level, args.map(serialize)); };
            }
            addEventListener('error', event => send('error', [event.message + (event.lineno ? ' · line ' + event.lineno : '')]));
            addEventListener('unhandledrejection', event => send('error', ['Unhandled promise: ' + serialize(event.reason)]));
            addEventListener('load', () => {
              if (window.p5) send('ready', ['p5.js ${P5_VERSION} loaded']);
              else send('error', ['p5.js could not load. Check the network connection.']);
            });
          })();`;

        return `<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="frog-mint.svg" />

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:auto;background:#fff}
    body{display:flex;align-items:flex-start;justify-content:flex-start}
    canvas{display:block;max-width:100%;height:auto!important}
  </style>
</head>
<body>
  <script>${bridge}<\/script>
  <script src="${P5_URL}" crossorigin="anonymous"><\/script>
  <script>${escapeScript(source)}<\/script>
</body>
</html>`;
      }

      function setRunState(state, label) {
        runState.className = `run-state ${state}`.trim();
        runStateText.textContent = label;
      }

      function clearConsole(message = '') {
        consoleOutput.replaceChildren();
        if (message) appendConsole('muted', message);
      }

      function appendConsole(kind, message) {
        const line = document.createElement('span');
        line.className = `log-${kind}`;
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        line.textContent = `[${time}] ${message}\n`;
        consoleOutput.append(line);
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
      }

      function runSketch() {
        runId += 1;
        const sessionId = `run-${runId}-${Date.now()}`;
        previewFrame.dataset.session = sessionId;
        clearConsole(`Starting run ${runId}…`);
        emptyPreview.classList.add('hidden');
        setRunState('running', 'starting');
        previewFrame.srcdoc = runnerDocument(editor.value, sessionId);
      }

      function stopSketch() {
        runId += 1;
        previewFrame.dataset.session = '';
        previewFrame.srcdoc = '<!doctype html><html><body style="margin:0;background:white"></body></html>';
        emptyPreview.textContent = 'Sketch stopped';
        emptyPreview.classList.remove('hidden');
        setRunState('', 'stopped');
        appendConsole('muted', 'Sketch stopped.');
      }

      function updateLineNumbers() {
        const count = editor.value.split('\n').length;
        lineNumbers.textContent = Array.from({ length: count }, (_, i) => i + 1).join('\n');
        lineNumbers.scrollTop = editor.scrollTop;
      }

      function updateCursor() {
        const before = editor.value.slice(0, editor.selectionStart);
        const lines = before.split('\n');
        cursorStatus.textContent = `Ln ${lines.length}, Col ${lines.at(-1).length + 1}`;
      }

      function markDirty() {
        isDirty = true;
        savedStatus.textContent = 'Unsaved';
        window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(saveProject, 900);
      }

      function saveProject() {
        const payload = {
          code: editor.value,
          name: projectName.value.trim() || 'Untitled sketch',
          autoRun: autoRun.checked
        };
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          isDirty = false;
          savedStatus.textContent = 'Saved locally';
        } catch (error) {
          savedStatus.textContent = 'Save failed';
          appendConsole('error', `Local save failed: ${error.message}`);
        }
      }

      function loadProject() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          editor.value = saved?.code || examples.starter;
          projectName.value = saved?.name || 'Untitled sketch';
          autoRun.checked = Boolean(saved?.autoRun);
        } catch (_) {
          editor.value = examples.starter;
        }
        updateLineNumbers();
        updateCursor();
        savedStatus.textContent = 'Ready';
      }

      function download(filename, contents, type = 'text/plain') {
        const blob = new Blob([contents], { type });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = filename;
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function exportSketch() {
        const title = (projectName.value.trim() || 'p5 sketch').replace(/[<>]/g, '');
        const fileBase = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'p5-sketch';
        const html = `<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="frog-mint.svg" />

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>${title}</title>
  <style>html,body{margin:0;min-height:100%;background:#fff}canvas{display:block}</style>
</head>
<body>
  <script src="${P5_URL}"><\/script>
  <script>${escapeScript(editor.value)}<\/script>
</body>
</html>`;
        download(`${fileBase}.html`, html, 'text/html');
        appendConsole('info', `Exported ${fileBase}.html`);
      }

      function formatCode() {
        const lines = editor.value.replace(/\t/g, '  ').split('\n');
        let depth = 0;
        const formatted = lines.map(raw => {
          const text = raw.trim();
          if (!text) return '';
          if (/^[}\])]/.test(text)) depth = Math.max(0, depth - 1);
          const result = '  '.repeat(depth) + text;
          const opens = (text.match(/{/g) || []).length;
          const closes = (text.match(/}/g) || []).length;
          depth = Math.max(0, depth + opens - closes + (/^}/.test(text) ? 1 : 0));
          return result;
        }).join('\n');
        editor.value = formatted;
        updateLineNumbers();
        markDirty();
      }

      editor.addEventListener('input', () => {
        updateLineNumbers();
        updateCursor();
        markDirty();
        if (autoRun.checked) {
          clearTimeout(autoRunTimer);
          autoRunTimer = setTimeout(runSketch, 650);
        }
      });

      editor.addEventListener('scroll', () => { lineNumbers.scrollTop = editor.scrollTop; });
      editor.addEventListener('click', updateCursor);
      editor.addEventListener('keyup', updateCursor);
      editor.addEventListener('select', updateCursor);
      editor.addEventListener('keydown', event => {
        if (event.key === 'Tab') {
          event.preventDefault();
          const start = editor.selectionStart;
          const end = editor.selectionEnd;
          editor.setRangeText('  ', start, end, 'end');
          editor.dispatchEvent(new Event('input'));
        }
        if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
          event.preventDefault();
          runSketch();
        }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
          event.preventDefault();
          saveProject();
        }
      });

      window.addEventListener('message', event => {
        const data = event.data;
        if (!data || data.source !== 'p5-runtime-ide' || data.session !== previewFrame.dataset.session) return;
        if (data.kind === 'ready') {
          setRunState('running', 'running');
          appendConsole('info', data.args.join(' '));
          return;
        }
        if (data.kind === 'error') setRunState('failed', 'error');
        const kind = ['error', 'warn', 'info'].includes(data.kind) ? data.kind : '';
        appendConsole(kind || 'muted', data.args.join(' '));
      });

      document.querySelector('#runButton').addEventListener('click', runSketch);
      document.querySelector('#rerunButton').addEventListener('click', runSketch);
      document.querySelector('#stopButton').addEventListener('click', stopSketch);
      document.querySelector('#clearConsoleButton').addEventListener('click', () => clearConsole('Console cleared.'));
      document.querySelector('#saveButton').addEventListener('click', saveProject);
      document.querySelector('#downloadButton').addEventListener('click', exportSketch);
      document.querySelector('#copyButton').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(editor.value);
          appendConsole('info', 'Code copied to the clipboard.');
        } catch (_) {
          editor.select();
          document.execCommand('copy');
          appendConsole('info', 'Code copied to the clipboard.');
        }
      });
      document.querySelector('#formatButton').addEventListener('click', formatCode);
      document.querySelector('#newButton').addEventListener('click', () => {
        if (isDirty && !confirm('Replace the unsaved sketch?')) return;
        editor.value = examples.starter;
        projectName.value = 'Untitled sketch';
        updateLineNumbers();
        markDirty();
        runSketch();
      });

      document.querySelector('#exampleSelect').addEventListener('change', event => {
        const code = examples[event.target.value];
        if (!code) return;
        editor.value = code;
        projectName.value = event.target.options[event.target.selectedIndex].text;
        updateLineNumbers();
        markDirty();
        runSketch();
        event.target.value = '';
      });

      projectName.addEventListener('input', markDirty);
      autoRun.addEventListener('change', () => {
        markDirty();
        if (autoRun.checked) runSketch();
      });

      let drag = null;
      divider.addEventListener('pointerdown', event => {
        drag = { id: event.pointerId };
        divider.setPointerCapture(event.pointerId);
        divider.classList.add('dragging');
      });
      divider.addEventListener('pointermove', event => {
        if (!drag || drag.id !== event.pointerId) return;
        const rect = workspace.getBoundingClientRect();
        if (innerWidth <= 760) {
          const ratio = Math.min(.75, Math.max(.3, (event.clientY - rect.top) / rect.height));
          workspace.style.gridTemplateRows = `minmax(190px, ${ratio * 100}%) 6px minmax(160px, ${(1 - ratio) * 100}%)`;
        } else {
          const ratio = Math.min(.75, Math.max(.25, (event.clientX - rect.left) / rect.width));
          document.documentElement.style.setProperty('--editor-share', `${ratio * 100}%`);
        }
      });
      const endDrag = event => {
        if (!drag || drag.id !== event.pointerId) return;
        divider.classList.remove('dragging');
        drag = null;
      };
      divider.addEventListener('pointerup', endDrag);
      divider.addEventListener('pointercancel', endDrag);

      window.addEventListener('beforeunload', event => {
        if (!isDirty) return;
        event.preventDefault();
        event.returnValue = '';
      });

      loadProject();
      runSketch();
    })();
  </script>
</body>
</html>
